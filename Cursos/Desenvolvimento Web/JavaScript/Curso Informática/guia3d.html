const alvo = new THREE.Vector3();
const B = { p: new THREE.Vector3(), q: new THREE.Quaternion(), fov: 50 };     // pose do plano atual
const de = { p: new THREE.Vector3(), q: new THREE.Quaternion(), fov: 50 };    // pose de saída (congelada)
function calcular(i, t, out) {
  out.fov = PLANOS[i].f(limita(t / PLANOS[i].dur, 0, 1), out.p, alvo) || 50;
  aux.position.copy(out.p);
  aux.lookAt(alvo);
  out.q.copy(aux.quaternion);
}
const TIPOS = ['CORTE', 'FUSÃO LINEAR', 'FUSÃO SUAVE'];
const MIX = 1.6;                                     // duração da fusão, em segundos
let atual = 0, t = 0, tMix = 99, tipo = 2, automatico = true, mostraMapa = true;
function ir(i) {
  de.p.copy(camera.position);                        // congela a pose de saída (nunca dá salto)
  de.q.copy(camera.quaternion);
  de.fov = camera.fov;
  atual = i;
  t = 0;
  tMix = 0;
}

// ---- interface: HUD, faixas de cinema e moldura do mapa
const css = (el, s) => { el.style.cssText = s; document.body.appendChild(el); return el; };
const hud = css(document.createElement('div'), 'position:fixed;left:14px;top:12px;color:#fff;font:700 17px/1.5 system-ui;text-shadow:0 2px 8px #000;pointer-events:none;z-index:6');
const dica = css(document.createElement('div'), 'position:fixed;left:0;right:0;bottom:14px;text-align:center;color:#fff;font:14px system-ui;text-shadow:0 2px 8px #000;pointer-events:none;z-index:6');
const faixaC = css(document.createElement('div'), 'position:fixed;left:0;right:0;top:0;height:0;background:#000;transition:height .6s;z-index:5;pointer-events:none');
const faixaB = css(document.createElement('div'), 'position:fixed;left:0;right:0;bottom:0;height:0;background:#000;transition:height .6s;z-index:5;pointer-events:none');
const moldura = css(document.createElement('div'), 'position:fixed;border:2px solid #fff;pointer-events:none;z-index:6');
let cinema = false;
addEventListener('keydown', (e) => {
  const n = parseInt(e.code.replace('Digit', ''), 10);
  if (n >= 1 && n <= PLANOS.length) ir(n - 1);
  if (e.code === 'Space') automatico = !automatico;
  if (e.code === 'KeyT') tipo = (tipo + 1) % 3;
  if (e.code === 'KeyM') mostraMapa = !mostraMapa;
  if (e.code === 'KeyB') {
    cinema = !cinema;
    faixaC.style.height = faixaB.style.height = cinema ? '11vh' : '0';
  }
});

const clock = new THREE.Clock();
const dirV = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 30);

  // ---- o ator corre pela curva (u avança pelo comprimento do arco: velocidade constante)
  uAtor = (uAtor + (3.2 * dt) / COMP) % 1;
  trajeto.getPointAt(uAtor, ator.position);
  trajeto.getTangentAt(uAtor, tg);
  ator.rotation.y = Math.atan2(tg.x, tg.z);
  const passo = Math.sin(clock.elapsedTime * 9);
  pernaE.rotation.x = passo * 0.8;
  pernaD.rotation.x = -passo * 0.8;
  ator.position.y = Math.abs(passo) * 0.08;

  // ---- o diretor
  t += dt;
  tMix += dt;
  if (automatico && t > PLANOS[atual].dur) ir((atual + 1) % PLANOS.length);
  calcular(atual, t, B);
  const f = tipo === 0 ? 1 : limita(tMix / MIX, 0, 1);   // 0 = pose de saída, 1 = pose do plano
  const g = tipo === 2 ? ease(f) : f;                    // suave: a mesma smoothstep dos trilhos
  camera.position.lerpVectors(de.p, B.p, g);
  camera.quaternion.copy(de.q).slerp(B.q, g);            // orientação: slerp, nunca ângulos de Euler
  camera.fov = de.fov + (B.fov - de.fov) * g;
  camera.updateProjectionMatrix();

  // ---- mapa: o marcador e a direção do olhar
  marcador.position.copy(camera.position);
  camera.getWorldDirection(dirV);
  posL.set([camera.position.x, camera.position.y, camera.position.z,
    camera.position.x + dirV.x * 14, camera.position.y + dirV.y * 14, camera.position.z + dirV.z * 14]);
  geoL.attributes.position.needsUpdate = true;

  // ---- desenha: tela inteira e, depois, o mapa num retângulo (viewport + scissor)
  renderer.setScissorTest(true);
  renderer.setViewport(0, 0, innerWidth, innerHeight);
  renderer.setScissor(0, 0, innerWidth, innerHeight);
  renderer.render(scene, camera);
  const s = Math.round(Math.min(innerWidth, innerHeight) * 0.34);
  moldura.style.display = mostraMapa ? 'block' : 'none';
  if (mostraMapa) {
    const x = innerWidth - s - 12, y = innerHeight - s - 12;   // y conta de baixo para cima
    renderer.setViewport(x, y, s, s);
    renderer.setScissor(x, y, s, s);
    renderer.render(scene, mapa);
    moldura.style.right = moldura.style.top = '12px';
    moldura.style.width = moldura.style.height = s + 'px';
  }

  hud.innerHTML = (atual + 1) + ' · ' + PLANOS[atual].nome +
    '<br><span style="font-size:14px;font-weight:400">transição: ' + TIPOS[tipo] + (tMix < MIX && tipo ? ' ···' : '') + '</span>';
  dica.textContent = '1–5 planos · Espaço: ' + (automatico ? 'automático' : 'manual') + ' · T transição · B cinema · M mapa';
});`},
{t:"Sprites e billboards",
 lead:"Árvores, rótulos e números de dano: imagens 2D que sempre encaram a câmera dentro de um mundo 3D.",
 txt:`<p>Um <b>billboard</b> ("cartaz") é uma imagem 2D plantada no mundo 3D que <b>sempre se vira para a câmera</b>. No Three.js o caso mais simples é o <code>Sprite</code>: um quadrado de 1 × 1 que nunca aparece de lado, com o tamanho dado por <code>scale</code> e a imagem vinda de um <code>SpriteMaterial</code>. É barato (são só 2 triângulos) e serve para tudo que é <b>informação ou enfeite</b> e não precisa de volume: rótulos com o nome, barras de vida, ícones de missão, números de dano, brilhos, fumaça e árvores ao longe. O preço é que ele é só uma imagem: <b>não reage às luzes</b> (o <code>SpriteMaterial</code> é sem iluminação) e não projeta sombra.</p>
<p><b>Desenhando a textura no Canvas.</b> Em vez de abrir um arquivo de imagem, desenhamos com a API do Canvas 2D (a mesma do capítulo de Texturas) e entregamos o canvas a um <code>CanvasTexture</code>. As árvores são círculos e triângulos; o rótulo é um retângulo arredondado com o nome e uma barra de vida. Como o rótulo muda quando a gosma apanha, redesenhamos o canvas e avisamos a GPU com <code>textura.needsUpdate = true</code>; sem isso a barra ficaria parada. E toda textura criada precisa ser liberada: os números de dano nascem e morrem o tempo todo, então ao removê-los chamamos <code>material.map.dispose()</code> e <code>material.dispose()</code>, senão a memória da placa de vídeo só cresce.</p>
<p><b>As propriedades que importam.</b> <code>sprite.center</code> é o <b>pivô</b>: com <code>(0.5, 0)</code> a posição do sprite é a <b>base</b> da imagem, e a árvore "pisa" no chão em vez de ficar enterrada pela metade. <code>transparent</code> e <code>alphaTest</code> recortam as partes vazias do desenho (o <code>alphaTest</code> descarta pixels quase transparentes e deixa a árvore escrever na profundidade sem halos). Para o rótulo usamos <code>depthTest: false</code> e <code>renderOrder</code> alto: ele é desenhado por último e <b>aparece por cima de tudo</b>, até atrás de uma árvore. <code>sizeAttenuation</code> decide o tamanho: ligado (padrão) o sprite encolhe com a distância como qualquer objeto; desligado ele mantém o <b>mesmo tamanho na tela</b>, e então <code>scale</code> passa a valer em relação à tela (por isso dividimos por uma distância de referência, <code>REF</code>). Por fim <code>fog: false</code> impede que o nevoeiro apague o texto.</p>
<p><b>Sprite ou billboard cilíndrico?</b> O <code>Sprite</code> é um billboard <b>esférico</b>: encara a câmera por completo. Visto de cima, uma árvore assim "deita" no chão, porque o quadrado acompanha o plano da tela. Para árvores o certo costuma ser o <b>billboard cilíndrico</b>: um <code>PlaneGeometry</code> comum, com o pivô na base (<code>geometry.translate(0, 0.5, 0)</code>), que gira <b>só em torno do eixo Y</b>: <code>rotation.y = atan2(câmera.x − x, câmera.z − z)</code>. A árvore fica de pé em qualquer ângulo, mas, olhando de cima, o plano aparece de lado (como na tecla 2 com a câmera no alto): é a troca. Jogos com câmera de cima usam o esférico; jogos com câmera baixa usam o cilíndrico. A mesma fórmula faz as gosmas olharem para a câmera.</p>
<p><b>Clique e números flutuantes.</b> O <code>Raycaster</code> também acerta sprites (o <code>setFromCamera</code> guarda a câmera de que ele precisa), então o rótulo é clicável como a malha. Dois cuidados: o <code>Raycaster</code> <b>ignora <code>visible</code></b>, por isso filtramos os alvos; e, como a mesma câmera é arrastada pelo <code>OrbitControls</code>, só tratamos como clique o toque que se moveu menos de 5 pixels. A cada golpe nasce um sprite com o número: ele <b>sobe desacelerando</b> (<code>vy *= exp(−2.2·dt)</code>), dá um "pulinho" de escala no começo, fica transparente com <code>opacity</code> e, ao fim de 1,1 s, é removido e liberado.</p>
<div class="note"><b>Controles:</b> <b>clique no preview</b> para dar foco. <b>Clique numa gosma</b> (ou no rótulo dela) para atacar: 20% dos golpes são críticos. <b>Arraste</b> para girar a câmera e use a <b>roda do mouse</b> para aproximar. <b>1</b> árvores como <code>Sprite</code>, <b>2</b> árvores como planos que giram só em Y (suba a câmera para ver a diferença), <b>3</b> alterna os rótulos entre tamanho no mundo e tamanho fixo na tela (afaste a câmera para ver).</div>
<div class="note tip"><b>Desafios:</b> (1) uma <b>fogueira</b> com brilho: um sprite com gradiente radial, <code>blending: THREE.AdditiveBlending</code> e <code>depthWrite: false</code>, pulsando a escala; (2) um <b>pool</b> de números de dano: reaproveite os sprites em vez de criar e destruir; (3) um <b>atlas de dígitos</b>: uma textura só com 0–9 e <code>texture.offset</code>/<code>repeat</code> para escolher cada dígito, no lugar de um canvas por número; (4) um ponto de exclamação <b>"!"</b> que pula acima de um NPC; (5) mostrar o rótulo só a menos de 15 unidades, com <code>opacity</code> diminuindo com a distância; (6) um personagem estilo <i>Doom</i>, com 4 ou 8 desenhos, escolhendo o quadro pelo ângulo entre a câmera e o rumo dele.</div>`,
 code:`// ===== Sprites e billboards: árvores 2D, rótulos e números de dano =====
camera.far = 200;
camera.updateProjectionMatrix();
camera.position.set(0, 7, 13);
scene.background = new THREE.Color(0x9ec7e8);
scene.fog = new THREE.Fog(0x9ec7e8, 22, 62);
scene.add(new THREE.HemisphereLight(0xffffff, 0x4a6b3a, 0.95));
const sol = new THREE.DirectionalLight(0xfff1d0, 0.8);
sol.position.set(10, 20, 8);
scene.add(sol);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.minDistance = 6;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI / 2 - 0.05;      // não deixa a câmera descer abaixo do chão

const rnd = (a, b) => a + Math.random() * (b - a);
let cilindrico = false, fixo = false, xp = 0;      // modos (teclas 1, 2 e 3) e pontuação
const REF = 12;                                    // distância de referência do modo "tamanho fixo"

// ---- chão e clareira
const chao = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: 0x4f8a3f }));
chao.rotation.x = -Math.PI / 2;
const clareira = new THREE.Mesh(new THREE.CircleGeometry(7, 40), new THREE.MeshStandardMaterial({ color: 0x7a6d45 }));
clareira.rotation.x = -Math.PI / 2;
clareira.position.y = 0.01;
scene.add(chao, clareira);

// ---- árvores desenhadas no Canvas 2D: 0 carvalho, 1 carvalho de outono, 2 pinheiro
function texArvore(tipo) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 192;
  const x = c.getContext('2d');
  x.fillStyle = '#5b3a22';
  x.fillRect(56, 120, 16, 72);                                  // tronco
  if (tipo === 2) {                                             // pinheiro: três triângulos empilhados
    ['#1f5a35', '#2a7444', '#379057'].forEach((cor, i) => {
      x.fillStyle = cor;
      x.beginPath();
      x.moveTo(64, 14 + i * 38);
      x.lineTo(110 - i * 6, 98 + i * 30);
      x.lineTo(18 + i * 6, 98 + i * 30);
      x.closePath();
      x.fill();
    });
  } else {                                                      // copa: círculos sobrepostos, com luz vindo de cima
    const h = tipo === 1 ? 28 : 120;
    const bolas = [[64, 104, 44], [38, 84, 32], [90, 84, 32], [64, 60, 38], [64, 34, 24]];
    bolas.forEach(([cx, cy, r]) => { x.fillStyle = 'hsl(' + h + ',55%,28%)'; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); });
    bolas.forEach(([cx, cy, r]) => { x.fillStyle = 'hsl(' + h + ',55%,42%)'; x.beginPath(); x.arc(cx - r * 0.2, cy - r * 0.25, r * 0.7, 0, 7); x.fill(); });
  }
  return new THREE.CanvasTexture(c);
}
const texs = [0, 1, 2].map(texArvore);
const matS = texs.map((t) => new THREE.SpriteMaterial({ map: t, transparent: true, alphaTest: 0.3 }));
const matP = texs.map((t) => new THREE.MeshBasicMaterial({ map: t, transparent: true, alphaTest: 0.3, side: THREE.DoubleSide }));
const geoP = new THREE.PlaneGeometry(1, 1);
geoP.translate(0, 0.5, 0);                                      // pivô do plano na base, como o center do Sprite

// as mesmas 70 árvores, nas duas versões: Sprites (grupo arvS) e planos que giram só no eixo Y (arvP)
const arvS = new THREE.Group(), arvP = new THREE.Group();
for (let i = 0; i < 70; i++) {
  const a = rnd(0, Math.PI * 2), d = rnd(8, 30), x = Math.cos(a) * d, z = Math.sin(a) * d;
  const tipo = Math.floor(Math.random() * 3), h = rnd(3, 5.5), w = (h * 128) / 192;
  const s = new THREE.Sprite(matS[tipo]);
  s.center.set(0.5, 0);                                         // pivô na base: a árvore "pisa" no chão
  s.scale.set(w, h, 1);
  s.position.set(x, 0, z);
  const p = new THREE.Mesh(geoP, matP[tipo]);
  p.scale.set(w, h, 1);
  p.position.set(x, 0, z);
  arvS.add(s);
  arvP.add(p);
}
scene.add(arvS, arvP);
arvP.visible = false;

// ---- texto desenhado no Canvas: rótulo com barra de vida e números de dano
function caixa(x, a, b, w, h, r) {                              // retângulo de cantos arredondados
  x.beginPath();
  x.moveTo(a + r, b);
  x.arcTo(a + w, b, a + w, b + h, r);
  x.arcTo(a + w, b + h, a, b + h, r);
  x.arcTo(a, b + h, a, b, r);
  x.arcTo(a, b, a + w, b, r);
  x.closePath();
}
function desenharRotulo(s) {
  const x = s.cv.getContext('2d'), r = Math.max(0, s.hp / s.max);
  x.clearRect(0, 0, 256, 72);
  x.fillStyle = 'rgba(8,6,30,.75)';
  caixa(x, 2, 2, 252, 68, 14);
  x.fill();
  x.strokeStyle = '#' + s.cor.toString(16).padStart(6, '0');
  x.lineWidth = 3;
  x.stroke();
  x.fillStyle = '#fff';
  x.font = 'bold 27px system-ui, sans-serif';
  x.textAlign = 'center';
  x.fillText(s.nome, 128, 31);
  x.fillStyle = '#3b0a14';
  x.fillRect(24, 43, 208, 14);
  x.fillStyle = 'hsl(' + r * 120 + ',80%,48%)';                  // verde -> vermelho conforme a vida
  x.fillRect(24, 43, 208 * r, 14);
  s.tex.needsUpdate = true;                                     // redesenhou o canvas: avisa a GPU
}
function textoTex(txt, cor) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 96;
  const x = c.getContext('2d');
  x.font = 'bold 64px system-ui, sans-serif';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.lineJoin = 'round';
  x.lineWidth = 10;
  x.strokeStyle = '#1a0a00';
  x.strokeText(txt, 128, 52);                                   // contorno escuro: lê bem sobre qualquer fundo
  x.fillStyle = cor;
  x.fillText(txt, 128, 52);
  return new THREE.CanvasTexture(c);
}

// ---- as gosmas: cada uma tem uma malha 3D e um Sprite de rótulo
const DADOS = [
  { nome: 'Gosma Nv 1', cor: 0x4ade80, hp: 30, xp: 10, r: 0.6, orb: 3.2, vel: 0.5 },
  { nome: 'Gosma Azul Nv 3', cor: 0x38bdf8, hp: 50, xp: 25, r: 0.8, orb: 4.6, vel: -0.35 },
  { nome: 'Gosma Rei Nv 7', cor: 0xfacc15, hp: 90, xp: 100, r: 1.1, orb: 0, vel: 0 }
];
const geoOlho = new THREE.SphereGeometry(0.14, 8, 8), matOlho = new THREE.MeshBasicMaterial({ color: 0x111111 });
const alvos = [];                                               // tudo que o clique pode acertar
const gosmas = DADOS.map((d, i) => {
  const malha = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), new THREE.MeshStandardMaterial({ color: d.cor, roughness: 0.35 }));
  [-1, 1].forEach((l) => {
    const o = new THREE.Mesh(geoOlho, matOlho);
    o.position.set(l * 0.32, 0.3, 0.88);
    malha.add(o);
  });
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 72;
  const tex = new THREE.CanvasTexture(cv);
  const rotulo = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, fog: false }));
  rotulo.renderOrder = 10;                                      // desenhado por último + sem teste de profundidade = aparece por cima de tudo
  const s = { ...d, max: d.hp, malha, rotulo, cv, tex, flash: 0, volta: 0, fase: i * 2, ang: i * 2.1 };
  malha.userData.dono = rotulo.userData.dono = s;
  scene.add(malha, rotulo);
  alvos.push(malha, rotulo);
  desenharRotulo(s);
  return s;
});
function ajustarRotulos() {                                     // tecla 3: tamanho no mundo x tamanho fixo na tela
  const f = fixo ? 1 / REF : 1;
  gosmas.forEach((s) => {
    s.rotulo.material.sizeAttenuation = !fixo;
    s.rotulo.material.needsUpdate = true;                       // sizeAttenuation muda o shader
    s.rotulo.scale.set(3.2 * f, 0.9 * f, 1);
  });
}
ajustarRotulos();

// ---- números de dano flutuantes: um Sprite novo (com a própria textura) a cada golpe
const flutuantes = [];
function numero(txt, cor, k, p) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: textoTex(txt, cor), transparent: true, depthTest: false, fog: false }));
  sp.position.copy(p);
  sp.position.x += rnd(-0.4, 0.4);
  sp.renderOrder = 20;
  sp.userData = { t: 0, vy: 3, k };
  scene.add(sp);
  flutuantes.push(sp);
}
function bater(s) {
  if (s.hp <= 0) return;
  const crit = Math.random() < 0.2, d = Math.round(rnd(4, 12)) * (crit ? 2 : 1);
  s.hp = Math.max(0, s.hp - d);
  s.flash = 1;
  const alto = s.r * 2 + 0.4, m = s.malha.position;
  numero('-' + d, crit ? '#ff5252' : '#ffe066', crit ? 1.5 : 1, new THREE.Vector3(m.x, alto, m.z));
  if (s.hp > 0) { desenharRotulo(s); return; }
  xp += s.xp;                                                   // derrotada: dá XP, some e volta depois
  numero('+' + s.xp + ' XP', '#86efac', 1.2, new THREE.Vector3(m.x, alto + 0.9, m.z));
  s.malha.visible = s.rotulo.visible = false;
  s.volta = 2.5;
  ui();
}

// ---- clique: Raycaster acerta Sprites também (precisa de raycaster.camera, que o setFromCamera já guarda)
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), el = renderer.domElement;
let down = null;
el.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
el.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;   // foi arrasto da câmera, não clique
  const r = el.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(alvos.filter((o) => o.visible))[0];   // o Raycaster ignora "visible": filtramos nós
  if (hit) bater(hit.object.userData.dono);
});

// ---- interface
const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:10px;left:14px;color:#fff;font:14px/1.5 system-ui;text-shadow:0 1px 5px #000;pointer-events:none';
document.body.appendChild(hud);
function ui() {
  hud.innerHTML = '<b>XP ' + xp + '</b><br>1/2 árvores: <b>' + (cilindrico ? 'planos (giram só em Y)' : 'Sprites (sempre de frente)')
    + '</b><br>3 rótulos: <b>' + (fixo ? 'tamanho fixo na tela' : 'tamanho no mundo') + '</b><br>clique nas gosmas para atacar';
}
ui();
addEventListener('keydown', (e) => {
  if (e.code === 'Digit1' || e.code === 'Numpad1') cilindrico = false;
  if (e.code === 'Digit2' || e.code === 'Numpad2') cilindrico = true;
  if (e.code === 'Digit3' || e.code === 'Numpad3') { fixo = !fixo; ajustarRotulos(); }
  arvS.visible = !cilindrico;
  arvP.visible = cilindrico;
  ui();
});

const clock = new THREE.Clock();
renderer.setAnimationLoop((t) => {
  const dt = Math.min(clock.getDelta(), 0.05), seg = t / 1000;
  controls.update();

  // billboard cilíndrico: o plano gira só no eixo Y para encarar a câmera (a árvore continua de pé)
  if (cilindrico) arvP.children.forEach((p) => { p.rotation.y = Math.atan2(camera.position.x - p.position.x, camera.position.z - p.position.z); });

  gosmas.forEach((s) => {
    if (s.volta > 0) {                                          // derrotada: espera e renasce
      s.volta -= dt;
      if (s.volta <= 0) { s.hp = s.max; s.malha.visible = s.rotulo.visible = true; desenharRotulo(s); }
      return;
    }
    s.ang += s.vel * dt;
    const px = Math.cos(s.ang) * s.orb, pz = Math.sin(s.ang) * s.orb;
    const b = Math.abs(Math.sin(seg * 3 + s.fase)), sy = s.r * (0.8 + 0.2 * b);   // pulinho com achatamento
    s.malha.scale.set(s.r * (1.1 - 0.1 * b), sy, s.r * (1.1 - 0.1 * b));
    s.malha.position.set(px, sy + b * 0.3 * s.r, pz);
    s.malha.rotation.y = Math.atan2(camera.position.x - px, camera.position.z - pz);   // o mesmo truque do billboard: encara a câmera
    s.rotulo.position.set(px, s.r * 2.1 + 0.9, pz);
    s.flash = Math.max(0, s.flash - dt * 4);
    s.malha.material.emissive.setRGB(s.flash, s.flash * 0.1, s.flash * 0.1);     // pisca vermelho ao apanhar
  });

  for (let i = flutuantes.length - 1; i >= 0; i--) {
    const sp = flutuantes[i], u = sp.userData;
    u.t += dt;
    u.vy *= Math.exp(-dt * 2.2);                                // sobe desacelerando
    sp.position.y += u.vy * dt;
    const pop = 1 + 0.6 * Math.exp(-u.t * 14);                  // "pulinho" de escala no começo
    sp.scale.set(2.4 * u.k * pop * 0.9, 0.9 * u.k * pop, 1);
    sp.material.opacity = Math.min(1, 2.2 - u.t * 2);           // opaco por um tempo, depois some
    if (u.t > 1.1) {                                            // acabou: libera a memória da GPU
      scene.remove(sp);
      sp.material.map.dispose();
      sp.material.dispose();
      flutuantes.splice(i, 1);
    }
  }
  renderer.render(scene, camera);
});`},
{t:"Pós-processamento",
 lead:"Desenhe a cena numa textura e passe por filtros de tela cheia: brilho neon, visual retrô e foco no centro.",
 txt:`<p>Até aqui o <code>renderer.render(scene, camera)</code> desenhava direto na tela. No <b>pós-processamento</b> a cena é desenhada primeiro numa <b>textura</b> (um <i>render target</i>) e essa imagem passa por uma fila de "filtros" em tela cheia, os <b>passes</b>, cada um um <i>fragment shader</i> que lê a imagem anterior e escreve a próxima. O <code>EffectComposer</code> organiza a fila: o <code>RenderPass</code> desenha a cena, os passes seguintes transformam a imagem, e o <b>último passe ligado</b> escreve na tela. Em vez de <code>renderer.render()</code> você chama <code>composer.render()</code> a cada quadro.</p>
<p><b>Scripts extras.</b> O <code>EffectComposer</code>, o <code>RenderPass</code>, o <code>ShaderPass</code> e o <code>UnrealBloomPass</code> (com o <code>CopyShader</code> e o <code>LuminosityHighPassShader</code>) não vêm no <code>three.min.js</code>: são arquivos de <code>examples/js</code>. O guia só os carrega quando o seu código contém <code>EffectComposer</code>, para os outros capítulos continuarem leves. Num HTML seu, coloque as <code>&lt;script&gt;</code> nesta ordem: <code>CopyShader</code>, <code>LuminosityHighPassShader</code>, <code>EffectComposer</code>, <code>ShaderPass</code>, <code>RenderPass</code>, <code>UnrealBloomPass</code>.</p>
<p><b>Bloom.</b> O <code>UnrealBloomPass</code> separa os pixels mais claros que o <code>threshold</code> (limiar), borra essa imagem em vários tamanhos e soma o resultado de volta: nasce o halo. Os parâmetros são <code>strength</code> (força), <code>radius</code> (alcance do borrão) e <code>threshold</code>. O detalhe que confunde: nenhum objeto "brilha" por ter um material especial, ele brilha por ser <b>mais claro que o limiar</b>. Por isso a cena é escura e o neon usa <code>MeshBasicMaterial</code> ou <code>emissive</code>, enquanto chão e pilares ficam abaixo do limiar e não brilham. Em cena clara, o bloom iluminaria tudo.</p>
<p><b>Seu próprio ShaderPass.</b> Pixelação e vinheta são só um objeto com <code>uniforms</code>, <code>vertexShader</code> e <code>fragmentShader</code>. O uniform <code>tDiffuse</code> é a imagem do passe anterior (o composer o preenche). Na <b>pixelação</b>, <code>d = px / res</code> é o tamanho do bloco em UV e <code>d * floor(vUv / d)</code> faz todos os pixels do bloco lerem o mesmo ponto da imagem. Na <b>vinheta</b>, multiplicamos a cor por um fator que cai com a distância até o centro (<code>smoothstep</code>). Um uniform pode mudar a qualquer momento: <code>pixelar.uniforms.px.value = 8</code>.</p>
<p><b>Ordem e custo.</b> A ordem muda o resultado: aqui a pixelação vem <b>antes</b> do bloco de bloom, então o brilho é suave sobre blocos nítidos; invertendo, o brilho também ficaria quadrado. Cada passe é uma passada de tela cheia, e o bloom é o mais caro (vários borrões): em celulares, diminua a resolução ou desligue passes. Dois cuidados: o <b>antialias do renderer deixa de valer</b> (o composer desenha nas próprias texturas), então as arestas ficam serrilhadas, e é preciso chamar <code>composer.setSize()</code> quando a janela muda.</p>
<div class="note"><b>Controles:</b> <b>clique no preview</b> para dar foco. <b>1</b> liga/desliga o bloom, <b>2</b> a pixelação, <b>3</b> a vinheta. <b>↑ ↓</b> mudam a força do bloom e <b>← →</b> o tamanho do pixel. <b>Arraste</b> para girar a câmera e use a <b>roda do mouse</b> para aproximar.</div>
<div class="note tip"><b>Desafios:</b> (1) <b>aberração cromática</b>: no shader, leia os canais R, G e B em posições levemente diferentes; (2) <b>scanlines de CRT</b>: escureça linhas alternadas com <code>sin(vUv.y * res.y)</code>; (3) <b>posterização</b>: reduza as cores com <code>floor(cor * 4.0) / 4.0</code> para um visual de console antigo; (4) um <b>flash de dano</b>: uma vinheta vermelha que pulsa quando o jogador leva um golpe, ligada a um dos jogos do guia; (5) <b>trocar a ordem</b> dos passes e ver o que muda; (6) <b>bloom seletivo</b>: só alguns objetos brilham, mesmo em cena clara (pesquise o exemplo <code>webgl_postprocessing_unreal_bloom_selective</code>).</div>`,
 code:`// ===== Pós-processamento: bloom, pixelação e vinheta =====
scene.background = new THREE.Color(0x02020a);
scene.fog = new THREE.FogExp2(0x02020a, 0.035);
camera.position.set(0, 5, 14);
scene.add(new THREE.AmbientLight(0x303060, 0.7));
const luz = new THREE.PointLight(0xff3df0, 2, 30);
luz.position.set(0, 4, 0);
scene.add(luz);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 6;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI / 2 - 0.02;

// ---- cena neon: o bloom só faz brilhar o que é CLARO, então o resto fica escuro
const chao = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x05050f, roughness: 0.35, metalness: 0.6 }));
chao.rotation.x = -Math.PI / 2;
const grade = new THREE.GridHelper(80, 40, 0x00e5ff, 0x0090ff);
grade.position.y = 0.01;
scene.add(chao, grade);

const nos = new THREE.Mesh(
  new THREE.TorusKnotGeometry(1.4, 0.4, 160, 20),
  new THREE.MeshStandardMaterial({ color: 0x220022, emissive: 0xff2bd6, emissiveIntensity: 1.2, roughness: 0.3 })
);
nos.position.y = 3;
scene.add(nos);

const NEON = [0x00f0ff, 0xffe14d, 0xff4d9a, 0x7CFF6B];
const cubos = [];
for (let i = 0; i < 14; i++) {
  const c = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshBasicMaterial({ color: NEON[i % 4] }));
  cubos.push(c);
  scene.add(c);
}
for (let i = 0; i < 10; i++) {                                  // pilares escuros com uma faixa de neon
  const a = (i / 10) * Math.PI * 2 + 0.3, d = 11 + (i % 3) * 3, h = 3 + (i * 7) % 6;
  const p = new THREE.Mesh(new THREE.BoxGeometry(1.2, h, 1.2), new THREE.MeshStandardMaterial({ color: 0x0a0a18, roughness: 0.6 }));
  p.position.set(Math.cos(a) * d, h / 2, Math.sin(a) * d);
  const faixa = new THREE.Mesh(new THREE.BoxGeometry(0.1, h, 0.1), new THREE.MeshBasicMaterial({ color: NEON[i % 4] }));
  faixa.position.set(0.6, 0, 0.6);
  p.add(faixa);
  scene.add(p);
}
const pos = [];
for (let i = 0; i < 400; i++) {                                 // estrelas
  const a = Math.random() * Math.PI * 2, b = Math.random() * 1.4, r = 60;
  pos.push(Math.cos(a) * Math.cos(b) * r, Math.sin(b) * r + 2, Math.sin(a) * Math.cos(b) * r);
}
const geoEstrelas = new THREE.BufferGeometry();
geoEstrelas.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
scene.add(new THREE.Points(geoEstrelas, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35, fog: false })));

// ---- passes personalizados: um ShaderPass é só um fragment shader de tela cheia.
// "tDiffuse" é a imagem produzida pelo passe anterior (o EffectComposer preenche).
const VERT = 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }';
const Pixelar = {
  uniforms: { tDiffuse: { value: null }, res: { value: new THREE.Vector2(1, 1) }, px: { value: 4 } },
  vertexShader: VERT,
  // d = tamanho de um "pixel grande" em coordenadas UV; floor() agrupa todos os pixels do bloco no mesmo ponto
  fragmentShader: [
    'uniform sampler2D tDiffuse; uniform vec2 res; uniform float px; varying vec2 vUv;',
    'void main() {',
    '  vec2 d = px / res;',
    '  vec2 uv = d * floor(vUv / d) + d * 0.5;',
    '  gl_FragColor = texture2D(tDiffuse, uv);',
    '}'
  ].join(' ')
};
const Vinheta = {
  uniforms: { tDiffuse: { value: null }, forca: { value: 1.25 } },
  vertexShader: VERT,
  // quanto mais longe do centro da tela, mais escuro
  fragmentShader: [
    'uniform sampler2D tDiffuse; uniform float forca; varying vec2 vUv;',
    'void main() {',
    '  vec4 c = texture2D(tDiffuse, vUv);',
    '  float d = distance(vUv, vec2(0.5)) * forca;',
    '  c.rgb *= 1.0 - smoothstep(0.25, 0.85, d);',
    '  gl_FragColor = c;',
    '}'
  ].join(' ')
};

// ---- a cadeia: RenderPass (desenha a cena numa textura) -> pixelar -> bloom -> vinheta -> tela
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const pixelar = new THREE.ShaderPass(Pixelar);
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.3, 0.5, 0.35);   // força, raio, limiar de brilho
const vinheta = new THREE.ShaderPass(Vinheta);
composer.addPass(pixelar);
composer.addPass(bloom);
composer.addPass(vinheta);                                      // o último passe ligado vai para a tela sozinho

const TAM = [2, 3, 4, 6, 8], v2 = new THREE.Vector2();
let ti = 2;
const estado = { bloom: true, pixel: false, vinheta: true };
function ajustar() {                                            // o shader precisa saber o tamanho real da imagem
  renderer.getDrawingBufferSize(v2);
  pixelar.uniforms.res.value.copy(v2);
  pixelar.uniforms.px.value = TAM[ti] * renderer.getPixelRatio();
}
const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:10px;left:14px;color:#fff;font:14px/1.55 system-ui;text-shadow:0 1px 5px #000;pointer-events:none';
document.body.appendChild(hud);
function aplicar() {
  bloom.enabled = estado.bloom;
  pixelar.enabled = estado.pixel;
  vinheta.enabled = estado.vinheta;
  ajustar();
  const on = (b) => '<b style="color:' + (b ? '#7CFF6B' : '#ff6b6b') + '">' + (b ? 'ligado' : 'desligado') + '</b>';
  hud.innerHTML = '1 bloom: ' + on(estado.bloom) + ' (força ' + bloom.strength.toFixed(1) + ' · ↑↓)<br>2 pixelação: ' + on(estado.pixel)
    + ' (' + TAM[ti] + ' px · ←→)<br>3 vinheta: ' + on(estado.vinheta);
}
aplicar();
addEventListener('keydown', (e) => {
  if (e.code === 'Digit1') estado.bloom = !estado.bloom;
  if (e.code === 'Digit2') estado.pixel = !estado.pixel;
  if (e.code === 'Digit3') estado.vinheta = !estado.vinheta;
  if (e.code === 'ArrowUp') bloom.strength = Math.min(3, bloom.strength + 0.2);
  if (e.code === 'ArrowDown') bloom.strength = Math.max(0, bloom.strength - 0.2);
  if (e.code === 'ArrowRight') ti = Math.min(TAM.length - 1, ti + 1);
  if (e.code === 'ArrowLeft') ti = Math.max(0, ti - 1);
  aplicar();
});
addEventListener('resize', () => {                              // o composer tem as próprias texturas: precisa ser redimensionado também
  composer.setSize(innerWidth, innerHeight);
  ajustar();
});

renderer.setAnimationLoop((t) => {
  const s = t / 1000;
  nos.rotation.x = s * 0.4;
  nos.rotation.y = s * 0.6;
  nos.material.emissiveIntensity = 1.1 + Math.sin(s * 3) * 0.3;
  cubos.forEach((c, i) => {
    const a = s * 0.5 + (i / cubos.length) * Math.PI * 2;
    c.position.set(Math.cos(a) * 6, 2.2 + Math.sin(s * 2 + i) * 1.2, Math.sin(a) * 6);
    c.rotation.set(s * 2, s * 1.5, 0);
  });
  controls.update();
  composer.render();                                            // no lugar de renderer.render(scene, camera)
});`},
{t:"Espelho e câmera",
 lead:"Desenhe a cena dentro de uma textura: ela vira o reflexo de um espelho e a tela de um monitor que mostra o que uma câmera de segurança enxerga.",
 txt:`<p>Até aqui o <code>renderer</code> desenhava direto na tela. Mas ele também pode desenhar numa <b>textura</b>: um <code>WebGLRenderTarget</code> é uma "tela invisível" na memória da placa de vídeo, e depois de desenhar nela você usa <code>alvo.texture</code> como qualquer imagem (<code>map</code> de um material, uniform de um shader...). O capítulo de Pós-processamento já fazia isso por baixo do <code>EffectComposer</code>; aqui fazemos à mão, e com a mesma ideia criamos dois clássicos de jogo: o <b>espelho</b> e a <b>câmera de segurança</b>. O fluxo é sempre o mesmo: <code>setRenderTarget(alvo)</code>, <code>render(scene, camera)</code>, <code>setRenderTarget(null)</code> para voltar à tela.</p>
<p><b>Câmera de segurança.</b> É a parte simples: uma segunda <code>PerspectiveCamera</code> (proporção 4:3), uma <code>WebGLRenderTarget(320, 240)</code> e um monitor na parede cujo material usa essa textura. A caixa da câmera gira até o <code>foco</code> com <code>lookAt</code>, e o foco persegue o jogador com <code>lerp</code> (a suavização do capítulo de câmeras), ou varre a sala sozinho. No monitor, um <code>ShaderMaterial</code> mistura três coisas: a imagem da câmera (tingida de verde, com listras de TV, ruído e vinheta), um <b>HUD desenhado num canvas</b> (hora, REC piscando) e uma caixa de rastreamento. Essa caixa vem de <code>posicao.project(camera)</code>, que converte um ponto do mundo em coordenadas de tela, de -1 a +1. A resolução baixa e o filtro <code>NearestFilter</code> dão o visual granulado.</p>
<p><b>Espelho: a câmera virtual.</b> Um espelho não desenha nada próprio: ele mostra a cena vista por uma <b>câmera refletida</b>. Se o espelho é o plano <code>z = ZM</code>, refletir um ponto é só <code>z' = 2·ZM − z</code> (o <code>z</code> da direção e do "para cima" simplesmente troca de sinal). Pegamos a posição da câmera real, a direção do olhar e o "para cima", refletimos os três e montamos a <code>virtual</code> com <code>lookAt</code>. Ela fica <b>atrás</b> do espelho e olha para dentro da sala; o que ela vê, através do retângulo do espelho, é exatamente o reflexo. Por isso a parede do fundo da sala é o próprio espelho: se houvesse outra parede atrás dele, ela tamparia a visão da câmera virtual (o truque de verdade para espelhos soltos é o <i>oblique near plane clipping</i>, no desafio 5).</p>
<p><b>Espelho: textura projetiva.</b> A imagem da câmera virtual é uma foto da sala inteira, não do espelho. Para saber qual pedaço dela cai em cada pixel do espelho, projetamos o ponto do espelho pela câmera virtual: <code>texMat = BIAS · projeção · visão · matrizDoEspelho</code>. A matriz <code>BIAS</code> converte as coordenadas de -1..1 para 0..1 (o espaço de uma textura). O vertex shader calcula <code>vT = texMat * position</code> e o fragment shader lê <code>texture2DProj(tReflexo, vT)</code>, que divide por <code>w</code> sozinho. É a mesma conta do <code>Reflector</code> dos exemplos do Three.js (<code>examples/js/objects/Reflector.js</code>), só que enxuta: o espelho é fixo e alinhado ao eixo Z.</p>
<p><b>A ordem importa: o loop de feedback.</b> A placa de vídeo <b>não permite</b> ler uma textura enquanto desenha nela: o WebGL lança o erro <i>Feedback loop formed between Framebuffer and active Texture</i>. Por isso a <code>tela</code> do monitor fica <b>invisível</b> enquanto desenhamos a câmera de segurança (ela leria a própria textura), e o espelho fica invisível enquanto desenhamos a câmera virtual. Cada quadro tem esta sequência: (1) reflexo visto pela câmera de segurança; (2) imagem da câmera de segurança; (3) reflexo visto pela câmera do jogador; (4) a imagem final. O espelho tem uma só textura, por isso o passo 3 sobrescreve a do passo 1: cada passe só usa o reflexo logo depois de gerá-lo. Assim a câmera de segurança também enxerga o espelho do jeito certo, e o espelho mostra o monitor mostrando o espelho.</p>
<p><b>Custo.</b> O quadro tem <b>4 passes</b> em vez de 1, e o painel mostra as <b>chamadas de desenho</b> somadas (<code>renderer.info.autoReset = false</code> evita que o contador zere a cada <code>render</code>; zeramos na mão com <code>info.reset()</code>). Aperte <b>1</b> e <b>2</b> para desligar cada efeito e veja o número cair. Em celulares, baixe o tamanho do reflexo. A tecla <b>V</b> mostra as duas texturas cruas no canto: a da esquerda é a visão da câmera virtual (repare que ela olha a sala "de trás"), a da direita é o feed da câmera de segurança, antes do shader do monitor.</p>
<div class="note"><b>Controles:</b> <b>clique no preview</b> para dar foco. <b>WASD</b> ou setas movem o robô em relação à câmera; <b>arraste</b> o mouse para girar a vista e use a <b>roda</b> para aproximar. <b>1</b> liga/desliga o espelho, <b>2</b> a câmera de segurança, <b>3</b> alterna entre seguir o robô e varrer a sala e <b>V</b> mostra as texturas. Olhe o robô no espelho e no monitor ao mesmo tempo.</div>
<div class="note tip"><b>Experimente:</b> troque <code>CAM_W, CAM_H</code> por <code>640, 480</code> e depois por <code>80, 60</code>; mude o <code>brilho</code> do espelho para 0.6 (vidro fumê); no shader do monitor, troque o verde <code>vec3(0.55, 1.0, 0.65)</code> por <code>vec3(1.0, 0.7, 0.4)</code> para uma imagem térmica.</div>
<div class="note tip"><b>Desafios:</b> (1) uma <b>segunda câmera</b> de segurança, com outro render target e outro monitor; (2) <b>marcas no espelho</b>: some ao reflexo uma textura de sujeira ou de rachadura num segundo sampler do shader; (3) um espelho <b>no chão</b> (plano <code>y = 0</code>): reflita o <code>y</code> em vez do <code>z</code>; (4) <b>borrar o reflexo</b> com a distância ao espelho (mais longe, mais desfocado); (5) cortar com o <b>plano oblíquo</b> para o espelho aguentar objetos atrás dele (veja <code>Reflector.js</code>); (6) <b>antialiasing</b> no reflexo trocando por <code>WebGLMultisampleRenderTarget</code> (precisa de WebGL2); (7) um <b>portal</b>: o mesmo método, mas a câmera virtual fica em outro lugar da cena; (8) um <b>retrovisor</b>: um render target pequeno, desenhado a cada quadro, no canto da tela do jogo de Corrida.</div>`,
 code:`// ===== Espelho e câmera de segurança com WebGLRenderTarget =====
// Dois "olhos" extras desenham a cena em TEXTURAS (render targets): uma vira o reflexo do espelho
// do fundo e a outra vira a tela do monitor, que mostra o que a câmera de segurança enxerga.
const NL = String.fromCharCode(10);
const clamp = THREE.MathUtils.clamp;
const ZM = -6, LX = 7, ZF = 9, ALT = 6;      // o espelho é o plano z = ZM; a sala vai de x = -7 a 7 e de z = -6 a 9
const CAM_W = 320, CAM_H = 240;              // resolução da câmera de segurança (baixa de propósito)

renderer.info.autoReset = false;             // nós zeramos o contador, para somar todos os passes do quadro
scene.background = new THREE.Color(0x0a0d18);
camera.fov = 55;
camera.far = 80;
camera.updateProjectionMatrix();
camera.position.set(0.5, 3.4, 8.3);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.8, -1);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 3;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.update();

scene.add(new THREE.HemisphereLight(0xbcc8ff, 0x1a1530, 0.75));
const lampada = new THREE.PointLight(0xffe2b0, 1.1, 30);
lampada.position.set(0, 5.3, 1.5);
scene.add(lampada);

const mat = (c, extra) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.75 }, extra || {}));
function caixa(w, h, d, material, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}

// ---------- 1. A SALA: chão quadriculado, três paredes, teto e moldura ----------
const cvChao = document.createElement('canvas');
cvChao.width = cvChao.height = 128;
const gc = cvChao.getContext('2d');
for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) {
  gc.fillStyle = (x + y) % 2 ? '#2f3858' : '#3d4872';
  gc.fillRect(x * 64, y * 64, 64, 64);
}
const texChao = new THREE.CanvasTexture(cvChao);
texChao.wrapS = texChao.wrapT = THREE.RepeatWrapping;
texChao.repeat.set(LX, (ZF - ZM) / 2);                    // cada quadrado mede 1 unidade
const chao = new THREE.Mesh(new THREE.PlaneGeometry(2 * LX, ZF - ZM), mat(0xffffff, { map: texChao, roughness: 0.4 }));
chao.rotation.x = -Math.PI / 2;
chao.position.set(0, 0, (ZF + ZM) / 2);
scene.add(chao);

function parede(x, z, largura, rotY, cor) {                // o plano olha para +Z: giramos para olhar para dentro da sala
  const m = new THREE.Mesh(new THREE.PlaneGeometry(largura, ALT), mat(cor));
  m.position.set(x, ALT / 2, z);
  m.rotation.y = rotY;
  scene.add(m);
}
parede(-LX, (ZF + ZM) / 2, ZF - ZM, Math.PI / 2, 0x2c3553);    // esquerda
parede(LX, (ZF + ZM) / 2, ZF - ZM, -Math.PI / 2, 0x2c3553);    // direita
parede(0, ZF, 2 * LX, Math.PI, 0x343c60);                      // da frente (atrás do jogador)
const teto = new THREE.Mesh(new THREE.PlaneGeometry(2 * LX, ZF - ZM), mat(0x1d2238));
teto.rotation.x = Math.PI / 2;
teto.position.set(0, ALT, (ZF + ZM) / 2);
scene.add(teto);
caixa(2.4, 0.12, 0.6, new THREE.MeshBasicMaterial({ color: 0xfff2cc }), 0, ALT - 0.06, 1.5);   // luminária

const madeira = mat(0x6b4a2a, { roughness: 0.5 });          // moldura do espelho
caixa(2 * LX, 0.35, 0.3, madeira, 0, ALT - 0.175, ZM + 0.15);
caixa(2 * LX, 0.3, 0.3, madeira, 0, 0.15, ZM + 0.15);
caixa(0.3, ALT, 0.3, madeira, -LX + 0.15, ALT / 2, ZM + 0.15);
caixa(0.3, ALT, 0.3, madeira, LX - 0.15, ALT / 2, ZM + 0.15);

// ---------- 2. OS ALVOS DE RENDERIZAÇÃO (as "telas invisíveis") ----------
const tam = new THREE.Vector2();
const rtEspelho = new THREE.WebGLRenderTarget(512, 512);
const rtCam = new THREE.WebGLRenderTarget(CAM_W, CAM_H);
rtCam.texture.magFilter = THREE.NearestFilter;               // pixels grandes e nítidos
function ajustarAlvo() {                                     // o reflexo acompanha o tamanho real da tela
  renderer.getDrawingBufferSize(tam);
  rtEspelho.setSize(Math.max(2, Math.floor(tam.x)), Math.max(2, Math.floor(tam.y)));
}
ajustarAlvo();
addEventListener('resize', ajustarAlvo);

// ---------- 3. O ESPELHO: um plano cujo shader lê a textura do reflexo ----------
const texMat = new THREE.Matrix4();
const BIAS = new THREE.Matrix4().set(0.5, 0, 0, 0.5,  0, 0.5, 0, 0.5,  0, 0, 0.5, 0.5,  0, 0, 0, 1);   // -1..1  ->  0..1
const VS_ESP = [
  'uniform mat4 texMat;',
  'varying vec4 vT;',
  'void main() {',
  '  vT = texMat * vec4(position, 1.0);        // onde este ponto cai na foto da camera virtual',
  '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
  '}'
].join(NL);
const FS_ESP = [
  'uniform sampler2D tReflexo;',
  'uniform float usar;',
  'uniform float brilho;',
  'varying vec4 vT;',
  'void main() {',
  '  vec3 vidro = vec3(0.03, 0.05, 0.09);',
  '  vec3 r = texture2DProj(tReflexo, vT).rgb;  // texture2DProj divide por w sozinho',
  '  gl_FragColor = vec4(mix(vidro, r * brilho, usar), 1.0);',
  '}'
].join(NL);
const espelho = new THREE.Mesh(new THREE.PlaneGeometry(2 * LX, ALT), new THREE.ShaderMaterial({
  uniforms: { tReflexo: { value: rtEspelho.texture }, texMat: { value: texMat }, usar: { value: 1 }, brilho: { value: 0.95 } },
  vertexShader: VS_ESP,
  fragmentShader: FS_ESP
}));
espelho.position.set(0, ALT / 2, ZM);
scene.add(espelho);
espelho.updateMatrixWorld(true);

// a câmera virtual: a câmera que está olhando, refletida pelo plano z = ZM
const virtual = new THREE.PerspectiveCamera();
const P = new THREE.Vector3(), D = new THREE.Vector3(), U = new THREE.Vector3(), Q = new THREE.Quaternion(), ALVO = new THREE.Vector3();
let passes = 0;
function espelhoPara(cam) {                                  // gera o reflexo como "cam" o enxergaria
  cam.updateMatrixWorld();
  cam.getWorldPosition(P);
  cam.getWorldDirection(D);
  U.set(0, 1, 0).applyQuaternion(cam.getWorldQuaternion(Q));
  if (P.z <= ZM) return;                                     // atrás do espelho: nada a refletir
  virtual.position.set(P.x, P.y, 2 * ZM - P.z);              // posição refletida: só o z muda
  virtual.up.set(U.x, U.y, -U.z);                            // o "para cima" também é refletido
  virtual.lookAt(ALVO.set(P.x + D.x, P.y + D.y, 2 * ZM - (P.z + D.z)));
  virtual.projectionMatrix.copy(cam.projectionMatrix);       // mesma lente da câmera real
  virtual.updateMatrixWorld();
  texMat.copy(BIAS).multiply(virtual.projectionMatrix).multiply(virtual.matrixWorldInverse).multiply(espelho.matrixWorld);
  espelho.visible = false;                                   // senão ele leria a própria textura
  renderer.setRenderTarget(rtEspelho);
  renderer.render(scene, virtual);
  renderer.setRenderTarget(null);
  espelho.visible = true;
  passes++;
}

// ---------- 4. OBJETOS DA SALA ----------
const OBST = [[-3.2, -2.5, 0.75], [4.5, 2, 0.95], [-4.5, 3.5, 0.9]];       // círculos de colisão: x, z, raio
caixa(1.0, 1.2, 1.0, mat(0x8892b0), -3.2, 0.6, -2.5);                      // pedestal
const no = new THREE.Mesh(new THREE.TorusKnotGeometry(0.6, 0.2, 120, 16), mat(0x330033, { emissive: 0xff2bd6, emissiveIntensity: 0.9, roughness: 0.3 }));
no.position.set(-3.2, 2.3, -2.5);
scene.add(no);
const bola = new THREE.Mesh(new THREE.SphereGeometry(0.45, 24, 16), mat(0xffc93c, { roughness: 0.25, metalness: 0.2 }));
scene.add(bola);
caixa(1.3, 1, 1.3, mat(0x9a5b2e), 4.5, 0.5, 2);
const cima = caixa(0.9, 0.8, 0.9, mat(0xb4723a), 4.5, 1.4, 2);
cima.rotation.y = 0.5;
caixa(1.2, 1, 1.2, mat(0x2b7a78), -4.5, 0.5, 3.5);

// o robô controlável (a frente é +Z)
const jogador = new THREE.Group();
const corpoJ = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.45), mat(0xff7b00));
corpoJ.position.y = 0.95;
const cabeca = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.45, 0.45), mat(0xe9edf5));
cabeca.position.y = 1.65;
const visor = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.12, 0.05), new THREE.MeshBasicMaterial({ color: 0x35e0ff }));
visor.position.set(0, 1.67, 0.24);
const pernaE = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.5, 0.25), mat(0x33384d));
pernaE.position.set(-0.18, 0.25, 0);
const pernaD = pernaE.clone();
pernaD.position.x = 0.18;
jogador.add(corpoJ, cabeca, visor, pernaE, pernaD);
jogador.position.set(0, 0, 3);
scene.add(jogador);

// ---------- 5. A CÂMERA DE SEGURANÇA: caixa que gira + PerspectiveCamera que desenha na textura ----------
const CASA = new THREE.Vector3(-6.4, 5.3, 8.4);
caixa(0.08, 0.45, 0.45, mat(0x555a68), -6.96, 5.45, 8.4);                  // placa na parede
caixa(0.6, 0.12, 0.14, mat(0x555a68), -6.68, 5.45, 8.4);                   // braço
const casa = new THREE.Group();                                            // o que gira (frente = +Z)
const corpoC = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.42, 1.0), mat(0xd9dde8, { roughness: 0.4 }));
corpoC.position.z = 0.2;
const lente = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.2, 0.3, 16).rotateX(Math.PI / 2), mat(0x10131c));
lente.position.z = 0.8;
const led = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), new THREE.MeshBasicMaterial({ color: 0xff2020 }));
led.position.set(0.18, 0.26, 0.05);
casa.add(corpoC, lente, led);
casa.position.copy(CASA);
scene.add(casa);
const secCam = new THREE.PerspectiveCamera(50, CAM_W / CAM_H, 0.2, 60);
const foco = new THREE.Vector3(0, 1, 2);                                   // para onde a câmera olha (suavizado)
const tmp = new THREE.Vector3();

// HUD da câmera: desenhado num canvas e depois sobreposto à imagem pelo shader do monitor
const hudCv = document.createElement('canvas');
hudCv.width = CAM_W;
hudCv.height = CAM_H;
const hg = hudCv.getContext('2d');
const hudTex = new THREE.CanvasTexture(hudCv);
const p2 = (n) => String(n).padStart(2, '0');
let seguir = true;
function desenharHud(t) {
  hg.clearRect(0, 0, CAM_W, CAM_H);
  hg.textBaseline = 'top';
  hg.font = 'bold 15px monospace';
  hg.fillStyle = '#e6ffe9';
  hg.fillText('CAM 01  SALA PRINCIPAL', 10, 8);
  const s = Math.floor(t);
  hg.fillText('00:' + p2(Math.floor(s / 60) % 60) + ':' + p2(s % 60), 10, CAM_H - 24);
  hg.fillText(seguir ? 'AUTO-TRACK' : 'VARREDURA', CAM_W - 112, CAM_H - 24);
  if (Math.floor(t * 1.6) % 2 === 0) {                                     // REC piscando
    hg.fillStyle = '#ff3b3b';
    hg.beginPath();
    hg.arc(CAM_W - 62, 16, 6, 0, 6.2832);
    hg.fill();
    hg.fillStyle = '#e6ffe9';
    hg.fillText('REC', CAM_W - 50, 8);
  }
  // caixa de rastreamento: project() leva um ponto do mundo para a tela da câmera (de -1 a +1)
  tmp.set(jogador.position.x, 0.95, jogador.position.z).project(secCam);
  if (Math.abs(tmp.x) < 1 && Math.abs(tmp.y) < 1 && tmp.z < 1) {
    const dist = secCam.position.distanceTo(jogador.position);
    const ppu = CAM_H / (2 * Math.tan(THREE.MathUtils.degToRad(secCam.fov / 2)) * dist);   // pixels por unidade do mundo
    const cx = (tmp.x * 0.5 + 0.5) * CAM_W, cy = (1 - (tmp.y * 0.5 + 0.5)) * CAM_H;
    hg.strokeStyle = '#ffdf4d';
    hg.lineWidth = 2;
    hg.strokeRect(cx - ppu * 0.5, cy - ppu, ppu, ppu * 2);
    hg.fillStyle = '#ffdf4d';
    hg.fillText('ALVO', cx - ppu * 0.5, cy - ppu - 17);
  }
  hudTex.needsUpdate = true;                                               // redesenhou o canvas: avisa a GPU
}

// ---------- 6. O MONITOR: o shader mistura feed, HUD, listras e ruído ----------
const VS_TELA = [
  'varying vec2 vUv;',
  'void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }'
].join(NL);
const FS_TELA = [
  'uniform sampler2D tFeed;',
  'uniform sampler2D tHud;',
  'uniform float tempo;',
  'uniform float ativo;',
  'varying vec2 vUv;',
  'float rnd(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233)) + tempo) * 43758.5453); }',
  'void main() {',
  '  vec3 c;',
  '  if (ativo > 0.5) {',
  '    float faixa = floor(vUv.y * 40.0);',
  '    float tremor = step(0.97, rnd(vec2(faixa, floor(tempo * 6.0)))) * 0.015;   // faixas que tremem de vez em quando',
  '    vec3 f = texture2D(tFeed, vUv + vec2(tremor, 0.0)).rgb;',
  '    float l = dot(f, vec3(0.299, 0.587, 0.114));                               // luminancia',
  '    c = mix(f, vec3(l) * vec3(0.55, 1.0, 0.65), 0.75) * 1.15;                  // tinge de verde',
  '    vec4 h = texture2D(tHud, vUv);',
  '    c = mix(c, h.rgb, h.a);                                                    // HUD por cima',
  '  } else {',
  '    c = vec3(rnd(vUv * vec2(160.0, 120.0)) * 0.55);                            // sem sinal: chuvisco',
  '  }',
  '  c += (rnd(vUv * vec2(320.0, 240.0) + 7.0) - 0.5) * 0.1;                      // ruido de camera',
  '  c *= 0.84 + 0.16 * sin(vUv.y * 480.0);                                       // listras de TV',
  '  float d = distance(vUv, vec2(0.5));',
  '  c *= 1.0 - smoothstep(0.35, 0.8, d) * 0.7;                                   // vinheta',
  '  gl_FragColor = vec4(c, 1.0);',
  '}'
].join(NL);
const tela = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 2.4), new THREE.ShaderMaterial({
  uniforms: { tFeed: { value: rtCam.texture }, tHud: { value: hudTex }, tempo: { value: 0 }, ativo: { value: 1 } },
  vertexShader: VS_TELA,
  fragmentShader: FS_TELA
}));
tela.position.z = 0.11;
const moldura = new THREE.Mesh(new THREE.BoxGeometry(3.5, 2.7, 0.2), mat(0x10131c, { roughness: 0.4 }));
const monitor = new THREE.Group();
monitor.add(moldura, tela);
monitor.position.set(LX - 0.12, 3.1, -1.5);
monitor.rotation.y = -Math.PI / 2;                                         // de frente para o centro da sala
scene.add(monitor);

// ---------- 7. MINIATURAS: as texturas cruas, antes do shader ----------
const miniScene = new THREE.Scene();
const miniCam = new THREE.OrthographicCamera(-0.5, 0.5, 0.5, -0.5, 0, 2);
const miniMat = new THREE.MeshBasicMaterial({ map: rtCam.texture });
const miniQuad = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), miniMat);
miniQuad.position.z = -1;
miniScene.add(miniQuad);
function miniatura(textura, x, y, w, h) {                                  // desenha a textura num retângulo do canto
  miniMat.map = textura;
  renderer.setScissorTest(true);
  renderer.setViewport(x, y, w, h);
  renderer.setScissor(x, y, w, h);
  renderer.render(miniScene, miniCam);
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, innerWidth, innerHeight);
}

// ---------- 8. INTERFACE E ENTRADA ----------
const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:10px;left:14px;color:#fff;font:14px/1.55 system-ui;text-shadow:0 1px 5px #000;pointer-events:none';
const legenda = document.createElement('div');
legenda.style.cssText = 'position:fixed;right:10px;bottom:148px;color:#cfd6ff;font:11px system-ui;text-shadow:0 1px 3px #000;pointer-events:none;text-align:right';
legenda.innerHTML = 'texturas cruas: reflexo (esq.) · câmera (dir.)';
document.body.append(hud, legenda);
let espOn = true, camOn = true, minis = true;
const teclas = {};
addEventListener('keydown', (e) => {
  teclas[e.code] = true;
  if (e.code === 'Digit1') espOn = !espOn;
  if (e.code === 'Digit2') camOn = !camOn;
  if (e.code === 'Digit3') seguir = !seguir;
  if (e.code === 'KeyV') { minis = !minis; legenda.style.display = minis ? 'block' : 'none'; }
});
addEventListener('keyup', (e) => (teclas[e.code] = false));
const tecla = (...cs) => cs.some((c) => teclas[c]);
const frente = new THREE.Vector3(), lado = new THREE.Vector3(), mov = new THREE.Vector3();
const onoff = (b) => '<b style="color:' + (b ? '#7CFF6B' : '#ff6b6b') + '">' + (b ? 'ligado' : 'desligado') + '</b>';

// ---------- 9. O LAÇO: 4 passes por quadro ----------
const relogio = new THREE.Clock();
let fps = 60;
renderer.setAnimationLoop(() => {
  const dt = Math.min(relogio.getDelta(), 0.05), t = relogio.elapsedTime;
  fps += (1 / Math.max(dt, 0.001) - fps) * 0.05;

  // robô: anda em relação à câmera, desvia dos objetos e fica dentro da sala
  camera.getWorldDirection(frente);
  frente.y = 0;
  frente.normalize();
  lado.set(-frente.z, 0, frente.x);
  const f = (tecla('KeyW', 'ArrowUp') ? 1 : 0) - (tecla('KeyS', 'ArrowDown') ? 1 : 0);
  const l = (tecla('KeyD', 'ArrowRight') ? 1 : 0) - (tecla('KeyA', 'ArrowLeft') ? 1 : 0);
  mov.copy(frente).multiplyScalar(f).addScaledVector(lado, l);
  const pj = jogador.position;
  if (mov.lengthSq() > 0) {
    mov.normalize().multiplyScalar(4 * dt);
    pj.x += mov.x;
    pj.z += mov.z;
    jogador.rotation.y = Math.atan2(mov.x, mov.z);
    pernaE.rotation.x = Math.sin(t * 10) * 0.6;
    pernaD.rotation.x = -Math.sin(t * 10) * 0.6;
  } else { pernaE.rotation.x = 0; pernaD.rotation.x = 0; }
  OBST.forEach(([ox, oz, r]) => {
    const dx = pj.x - ox, dz = pj.z - oz, d = Math.hypot(dx, dz), min = r + 0.4;
    if (d < min && d > 0.0001) { pj.x += (dx / d) * (min - d); pj.z += (dz / d) * (min - d); }
  });
  pj.x = clamp(pj.x, -LX + 0.7, LX - 0.7);
  pj.z = clamp(pj.z, ZM + 0.8, ZF - 0.7);

  no.rotation.x = t * 0.6;
  no.rotation.y = t * 0.9;
  bola.position.set(3.2, 0.45 + Math.abs(Math.sin(t * 2.4)) * 1.6, -2.5);

  // câmera de segurança: o foco persegue o robô (ou varre a sala) e a caixa gira até ele
  if (seguir) tmp.set(pj.x, 1.0, pj.z);
  else tmp.set(Math.sin(t * 0.5) * 5.5, 1, 1.5 + Math.cos(t * 0.35) * 5);
  foco.lerp(tmp, 1 - Math.exp(-3 * dt));
  casa.lookAt(foco);                                       // objeto comum: o +Z aponta para o foco
  secCam.position.copy(CASA);
  secCam.lookAt(foco);                                     // câmera: o -Z aponta para o foco
  secCam.updateMatrixWorld();
  led.material.color.setHex(Math.floor(t * 1.6) % 2 === 0 ? 0xff2020 : 0x330808);
  desenharHud(t);

  controls.update();
  camera.position.set(clamp(camera.position.x, -LX + 0.2, LX - 0.2), clamp(camera.position.y, 0.4, ALT - 0.3), clamp(camera.position.z, ZM + 0.6, ZF - 0.2));

  // ---- os passes ----
  renderer.info.reset();
  passes = 0;
  espelho.material.uniforms.usar.value = espOn ? 1 : 0;
  tela.material.uniforms.ativo.value = camOn ? 1 : 0;
  tela.material.uniforms.tempo.value = t;
  if (camOn) {
    casa.visible = false;                                  // a caixa tamparia a lente
    tela.visible = false;                                  // a tela leria a textura em que estamos desenhando (loop de feedback)
    if (espOn) espelhoPara(secCam);                        // 1) reflexo como a câmera de segurança o vê
    renderer.setRenderTarget(rtCam);
    renderer.render(scene, secCam);                        // 2) a imagem da câmera de segurança
    renderer.setRenderTarget(null);
    passes++;
    casa.visible = true;
    tela.visible = true;
  }
  if (espOn) espelhoPara(camera);                          // 3) reflexo como o jogador o vê
  renderer.render(scene, camera);                          // 4) a imagem final
  passes++;
  const chamadas = renderer.info.render.calls, tris = renderer.info.render.triangles;

  if (minis) {
    const mh = Math.round(160 * rtEspelho.height / rtEspelho.width);
    miniatura(rtCam.texture, innerWidth - 170, 10, 160, 120);
    miniatura(rtEspelho.texture, innerWidth - 340, 10, 160, mh);
  }

  hud.innerHTML = '1 espelho: ' + onoff(espOn) + '<br>2 câmera de segurança: ' + onoff(camOn) +
    '<br>3 câmera: <b>' + (seguir ? 'segue o robô' : 'varre a sala') + '</b> · V texturas' +
    '<br>passes: <b>' + passes + '</b> · chamadas de desenho: <b>' + chamadas + '</b> · triângulos: ' + tris + ' · FPS: ' + Math.round(fps);
});`},
{t:"Shadow mapping explicado",
 lead:"Como o jogo decide o que está na sombra: a câmera da luz, o mapa de profundidade e o shadow acne.",
 txt:`<p>No capítulo <i>Luzes e sombras</i> bastou ligar <code>castShadow</code> e as sombras apareceram. Aqui abrimos a caixa: o Three.js usa o <b>shadow mapping</b>, uma técnica de <b>dois passos</b> que quase todo jogo usa. A ideia é simples: <b>o que a luz enxerga está iluminado; o que ela não enxerga está na sombra</b>.</p>
<p><b>Passo 1: a câmera da luz e o mapa de profundidade.</b> O jogo coloca uma câmera <b>na posição da luz</b>, olhando na direção dela, e desenha a cena sem cor nenhuma: cada pixel guarda só a <b>distância</b> até o ponto mais próximo da luz. O resultado é o <b>mapa de profundidade</b> (<i>shadow map</i>), a imagem do quadrado no canto da tela (branco = perto da luz, preto = longe). Para uma <code>DirectionalLight</code> a câmera é <b>ortográfica</b> (<code>luz.shadow.camera</code>, a caixa que o <b>F</b> desenha); a <code>SpotLight</code> usa uma câmera em perspectiva, e a <code>PointLight</code> precisa de <b>seis</b> câmeras, uma para cada face de um cubo. Aqui o passo é refeito à mão (<code>MeshDepthMaterial</code> em <code>scene.overrideMaterial</code> e uma <code>WebGLRenderTarget</code>, a técnica do capítulo <i>Espelho e câmera</i>) só para você ver o que o Three.js guarda por dentro.</p>
<p><b>Passo 2: a pergunta de cada pixel.</b> Ao desenhar a cena com a câmera normal, cada ponto do chão faz uma pergunta: <i>se eu olhar daqui para a luz, existe algo na frente?</i> Para responder, o ponto é levado ao espaço da luz (a matriz <code>luz.shadow.matrix</code>) e se descobre qual pixel do mapa o enxerga e a que distância está dele. Se o mapa guardou uma distância <b>menor</b>, há algo na frente: sombra. Se for igual, é o próprio ponto que a luz vê: iluminado.</p>
<p><b>Resolução e filtro.</b> O mapa tem tamanho fixo (<code>shadow.mapSize</code>), e cada pixel dele, o <b>texel</b>, cobre um pedaço do mundo. Com a caixa da luz de 20 unidades e um mapa de 64, cada texel tem mais de 0,3 unidade: a sombra fica em degraus, e no quadrado do canto dá para contá-los (a textura usa <code>NearestFilter</code>). Aperte <b>M</b> para trocar o tamanho. Duas formas de ganhar nitidez: um mapa maior (custa memória) e uma <b>caixa mais justa</b> em torno do que importa, porque o mesmo mapa cobre menos mundo. O filtro (<b>T</b>) suaviza o serrilhado: <code>Basic</code> usa 1 amostra, <code>PCF</code> faz a média de vizinhos e <code>PCFSoft</code> suaviza mais.</p>
<p><b>Shadow acne.</b> Com <code>bias = 0</code>, a esfera e o chão aparecem cheios de listras. Cada texel guarda <b>um só valor</b> de profundidade, mas cobre um pedaço da superfície que, quando está inclinada em relação à luz, tem pontos um pouco mais perto e outros um pouco mais longe. Os mais longe comparam-se com o valor do texel, concluem que há algo na frente e... a superfície <b>faz sombra em si mesma</b>. Quanto mais rasante a luz, pior (use <b>↑/↓</b>). O remédio é o <code>shadow.bias</code> (<b>B</b>): uma folga que \"empurra\" a profundidade guardada. Mas um valor grande demais cria o defeito oposto, o <b>peter panning</b>: a sombra se descola da base dos objetos, como se eles flutuassem. O <code>normalBias</code> (<b>N</b>) empurra o ponto ao longo da <b>normal</b> da superfície em vez de ao longo da luz, e costuma corrigir o acne com menos descolamento. Na prática, você ajusta os dois até sumir o acne sem a sombra flutuar.</p>
<div class=\"note\"><b>Controles:</b> <b>clique no preview</b> para dar foco. <b>B</b> troca o bias (0, -0.0005, -0.002, -0.01), <b>N</b> liga o normalBias, <b>M</b> troca o tamanho do mapa, <b>T</b> o filtro, <b>V</b> mostra ou esconde o mapa de profundidade, <b>F</b> mostra ou esconde a câmera da luz, <b>↑/↓</b> mudam a altura da luz e <b>Espaço</b> pausa o giro. Arraste para girar a câmera.</div>

{t:"Geometrias procedurais",
 lead:"Gire um perfil, dê espessura a um contorno e varra um círculo ao longo de uma curva: Lathe, Extrude e Tube.",
 txt:`<p>Até aqui usamos geometrias prontas (caixa, esfera, torus). As <b>geometrias procedurais</b> nascem de uma descrição matemática que <b>você</b> fornece: um perfil, um contorno ou um caminho. O Three.js transforma isso em vértices e triângulos. São três ferramentas, cada uma com um tipo de entrada: <code>LatheGeometry</code> gira um <b>perfil 2D</b> em torno do eixo Y (vasos, taças, peões de xadrez); <code>ExtrudeGeometry</code> dá <b>espessura a um contorno 2D</b> (letras, logotipos, peças recortadas); <code>TubeGeometry</code> <b>varre um círculo ao longo de uma curva 3D</b> (canos, cabos, trilhos).</p>
<p><b>Curvas.</b> Em vez de listar centenas de pontos, damos poucos <b>pontos de controle</b> e deixamos uma curva suave passar por eles: <code>SplineCurve</code> (2D) e <code>CatmullRomCurve3</code> (3D). <code>getPoints(n)</code> amostra a curva em <i>n</i> pedaços. No 3D, o tipo <code>'centripetal'</code> evita os "nós" e os exageros que o Catmull-Rom comum cria quando os pontos estão espaçados de forma irregular, e o segundo argumento <code>true</code> fecha a curva num circuito.</p>
<p><b>Vaso (Lathe).</b> O perfil é uma lista de <code>Vector2</code> em que <code>x</code> é o <b>raio</b> e <code>y</code> é a altura, de baixo para cima. Os dois pontos que você mexe com as setas (a barriga e o pescoço) são só dois números dentro da lista de controle; a cada mudança montamos uma <code>LatheGeometry</code> nova. Repare no <code>dispose()</code> da antiga: geometria descartada sem isso fica ocupando memória da placa de vídeo. O <code>DoubleSide</code> no material garante que o vaso apareça por dentro e por fora.</p>
<p><b>Letras (Extrude).</b> O <code>TextGeometry</code> exige um arquivo de fonte, então aqui as letras são desenhadas à mão com <code>Shape</code>: <code>moveTo</code>, <code>lineTo</code>, <code>absarc</code> e <code>absellipse</code>. O <b>buraco</b> do O e do P é um <code>Path</code> colocado em <code>shape.holes</code>. As opções importantes são <code>depth</code> (espessura), <code>curveSegments</code> (suavidade das curvas) e o <b>bisel</b> (<code>bevelThickness</code>, <code>bevelSize</code>, <code>bevelSegments</code>), que arredonda as quinas e faz a luz brilhar na borda. Todo vértice conta: o contador no canto da tela mostra que as letras, com tanta curva, são a parte mais pesada da cena.</p>
<p><b>Montanha-russa (Tube).</b> O trilho é <code>new THREE.TubeGeometry(curva, segmentosAoLongo, raio, segmentosDaSeção, fechado)</code>. O laço vertical é um círculo (seno e cosseno) em que o <code>x</code> avança um pouco, para o traçado se cruzar na projeção, e o <code>z</code> desliza para que a saída não bata na entrada. A <b>mesma curva</b> move o carrinho: <code>getUtoTmapping</code> converte a distância percorrida no parâmetro da curva (assim a velocidade é uniforme, ao contrário de andar de <code>t</code> direto), <code>getPoint</code> dá a posição e <code>getTangent</code> dá a direção. A velocidade vem da energia: <code>v = √(v₀² + 2g·(altura do topo − y))</code>, então o carrinho acelera nas descidas e desacelera nas subidas.</p>
<p><b>Orientação do carrinho.</b> Só a posição e a direção não bastam: falta saber para onde é o "em cima". <code>computeFrenetFrames</code> devolve, para cada ponto, três eixos que giram junto com a curva sem torções bruscas. Giramos todos eles por um mesmo ângulo para que o início fique "em pé" (alinhado com o eixo Y do mundo), e <code>makeBasis(frente, cima, lado)</code> vira a orientação do carrinho. Por isso, no topo do laço, ele fica de <b>cabeça para baixo</b> sozinho; aperte <b>R</b> para ver de dentro. Um detalhe que costuma dar bug: esses eixos são calculados <b>por distância</b> (<code>u</code>), então o índice certo é <code>round(u * N)</code>, e não <code>t * N</code>.</p>
<div class="note"><b>Controles:</b> <b>clique no preview</b> para dar foco. <b>← →</b> mudam a barriga do vaso e <b>↑ ↓</b> o pescoço. <b>R</b> liga e desliga o passeio no carrinho. <b>Arraste</b> para girar a câmera e use a <b>roda do mouse</b> para aproximar.</div>
<div class="note tip"><b>Desafios:</b> (1) edite os <b>pontos de controle</b> e crie um segundo laço, uma curva mais fechada ou uma hélice; (2) uma <b>coleção de vasos</b> com perfis sorteados (<code>Math.random()</code> nos pontos) em fileira; (3) uma <b>estrela</b> com <code>Shape</code> e bisel; (4) um <b>coração</b> com <code>bezierCurveTo</code>; (5) <code>extrudePath</code>: extrudar uma seção em "T" ao longo da curva para um trilho com dormentes; (6) arrastar os pontos de controle com o <b>mouse</b> (<code>Raycaster</code>) e refazer o trilho ao vivo; (7) um <b>trem</b> de vários carrinhos, cada um com um <code>s</code> menor que o anterior.</div>`,
