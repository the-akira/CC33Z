function gerarPicos() {                            // morros (h > 0) e vales (h < 0): o relevo e a soma deles
  const s = [];
  for (let n = 0; n < 4; n++) {
    const h = n % 2 ? -(0.6 + 0.8 * rnd()) : 1.2 + 1.4 * rnd();
    s.push({ x: (rnd() - 0.5) * 6, z: (rnd() - 0.5) * 6, h: h, s: 0.9 + 0.8 * rnd() });
  }
  return s;
}
let modo = 1, dados = gerarBarras(), pontos = gerarPontos(), bolhas = gerarBolhas(), picos = gerarPicos(), anim = 0;

// ---- 2) ESCALAS: valor -> cor e valor -> altura
const rampa = t => new THREE.Color().setHSL(0.66 * (1 - Math.min(1, Math.max(0, t))), 0.8, 0.5);   // azul -> vermelho
const ESC = 0.7;                                  // 1 mil de vendas = 0,7 unidade de altura
// o relevo: uma soma de "sinos" (gaussianas), um por morro ou vale, sobre um piso de 1,8
const altura = (x, z) => Math.max(0.1, picos.reduce((a, q) =>
  a + q.h * Math.exp(-((x - q.x) ** 2 + (z - q.z) ** 2) / (2 * q.s * q.s)), 1.8));

function rotulo(txt, x, y, z, cor, larg = 128) {
  const c = document.createElement("canvas");
  c.width = larg; c.height = 48;
  const g = c.getContext("2d");
  g.font = "bold 28px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = cor; g.fillText(txt, larg / 2, 24);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.scale.set(1.3 * larg / 128, 0.49, 1);
  s.position.set(x, y, z);
  return s;
}
const hex = n => "#" + n.toString(16).padStart(6, "0");

// ---- 3) A CENA DO GRAFICO: tudo vive em um grupo, que e refeito ao trocar de modo
scene.add(new THREE.GridHelper(8, 8, 0x64748b, 0x1e293b));
const cena = new THREE.Group();
scene.add(cena);
const alvos = [];                                  // so estes objetos reagem ao mouse
const cres = [];                                   // e estes crescem na animacao de entrada

function eixosXYZ() {                              // eixos dos graficos de pontos
  [0, 2, 4, 6].forEach(v => {
    cena.add(rotulo(String(v), v - 3, 0.1, 3.7, "#ff8a8a"));      // eixo x
    cena.add(rotulo(String(v), -3.7, 0.1, v - 3, "#8affb0"));     // eixo z
    cena.add(rotulo(String(v), -3.7, v, -3.7, "#8ab4ff"));        // eixo y (altura)
  });
}

// modo 1: barras. regiao x mes, altura e cor = vendas
function montarBarras() {
  dados.forEach((linha, i) => linha.forEach((v, j) => {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(0.9, 1, 0.9),
      new THREE.MeshStandardMaterial({ color: rampa((v - 1) / 6.5), roughness: 0.5 })
    );
    m.position.set((i - 2) * 1.2, 0, (j - 2.5) * 1.2);
    m.userData = { brilha: true, alt: v * ESC, txt: REGIOES[i] + " / " + MESES[j] + ": " + v.toFixed(1) + " mil" };
    cena.add(m); alvos.push(m); cres.push(m);
  }));
  REGIOES.forEach((r, i) => cena.add(rotulo(r, (i - 2) * 1.2, 0.1, 4.3, "#e2e8f0")));
  MESES.forEach((r, j) => cena.add(rotulo(r, -4.3, 0.1, (j - 2.5) * 1.2, "#94a3b8")));
  [0, 2, 4, 6].forEach(v => cena.add(rotulo(v + " mil", -4.3, v * ESC, -4.3, "#facc15")));
}

// modo 2: dispersao. tres medidas por ponto, cor = grupo
function montarDispersao() {
  const cores = [0x22d3ee, 0xff4fd8, 0xfacc15];
  const geo = new THREE.SphereGeometry(0.12, 12, 8);
  pontos.forEach(q => {
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: cores[q.g], roughness: 0.4 }));
    m.position.set(q.p[0] - 3, q.p[1], q.p[2] - 3);
    m.userData = { brilha: true, r: 1, txt: "Grupo " + (q.g + 1) + "  x=" + q.p[0].toFixed(1) + "  y=" + q.p[1].toFixed(1) + "  z=" + q.p[2].toFixed(1) };
    cena.add(m); alvos.push(m); cres.push(m);
  });
  eixosXYZ();
}

// modo 3: superficie. y = f(x, z) em uma grade de 41 x 41 vertices
function montarSuperficie() {
  const N = 40;
  const geo = new THREE.PlaneGeometry(8, 8, N, N).rotateX(-Math.PI / 2);   // plano deitado: y aponta para cima
  const pos = geo.attributes.position, cores = [];
  for (let i = 0; i < pos.count; i++) {
    const y = altura(pos.getX(i), pos.getZ(i));      // a altura de cada vertice vem da funcao
    pos.setY(i, y);
    const c = rampa(y / 5);                          // e a cor tambem
    cores.push(c.r, c.g, c.b);
  }
  geo.setAttribute("color", new THREE.Float32BufferAttribute(cores, 3));
  geo.computeVertexNormals();                        // sem isso a luz nao "enxerga" o relevo
  geo.computeBoundingSphere();
  const sup = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.6, side: THREE.DoubleSide }));
  sup.userData = { dica: p => "x=" + p.x.toFixed(1) + "  z=" + p.z.toFixed(1) + "  valor=" + altura(p.x, p.z).toFixed(2) };
  const malha = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.12 }));
  const g = new THREE.Group();
  g.add(sup, malha);
  cena.add(g); alvos.push(sup); cres.push(g);
  [-4, -2, 0, 2, 4].forEach(v => {
    cena.add(rotulo(String(v), v, 0.1, 4.5, "#ff8a8a"));
    cena.add(rotulo(String(v), -4.5, 0.1, v, "#8affb0"));
  });
  [0, 2, 4, 6].forEach(v => cena.add(rotulo(String(v), -4.5, v, -4.5, "#8ab4ff")));
}

// modo 4: linhas. uma serie por regiao, uma fita por serie, uma esfera por dado
function montarLinhas() {
  dados.forEach((linha, i) => {
    const g = new THREE.Group(), z = (i - 2) * 1.5, cor = COR_REG[i];
    const pts = linha.map((v, j) => new THREE.Vector3((j - 2.5) * 1.4, v * ESC, z));
    const media = linha.reduce((a, b) => a + b, 0) / linha.length;
    const tubo = new THREE.Mesh(                     // curva suave passando pelos pontos
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 60, 0.07, 8),
      new THREE.MeshStandardMaterial({ color: cor, roughness: 0.4 })
    );
    tubo.userData = { brilha: true, txt: REGIOES[i] + ": media de " + media.toFixed(1) + " mil por mes" };
    g.add(tubo); alvos.push(tubo);
    const vs = [];                                   // parede entre a linha e o chao: 2 triangulos por trecho
    for (let j = 0; j < pts.length - 1; j++) {
      const a = pts[j], b = pts[j + 1];
      vs.push(a.x, 0, z, a.x, a.y, z, b.x, b.y, z, a.x, 0, z, b.x, b.y, z, b.x, 0, z);
    }
    const pg = new THREE.BufferGeometry();
    pg.setAttribute("position", new THREE.Float32BufferAttribute(vs, 3));
    g.add(new THREE.Mesh(pg, new THREE.MeshBasicMaterial({ color: cor, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false })));
    pts.forEach((p, j) => {
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 8), new THREE.MeshStandardMaterial({ color: cor, roughness: 0.4 }));
      s.position.copy(p);
      s.userData = { brilha: true, txt: REGIOES[i] + " / " + MESES[j] + ": " + linha[j].toFixed(1) + " mil" };
      g.add(s); alvos.push(s);
    });
    cena.add(g); cres.push(g);
    cena.add(rotulo(REGIOES[i], -4.9, 0.1, z, hex(cor)));
  });
  MESES.forEach((r, j) => cena.add(rotulo(r, (j - 2.5) * 1.4, 0.1, 4.3, "#94a3b8")));
  [0, 2, 4, 6].forEach(v => cena.add(rotulo(v + " mil", -4.9, v * ESC, -4.3, "#facc15")));
}

// modo 5: rosca. o angulo de cada fatia e proporcional ao total da regiao
function montarRosca() {
  const tot = dados.map(l => l.reduce((a, b) => a + b, 0));
  const soma = tot.reduce((a, b) => a + b, 0);
  let a0 = 0;
  tot.forEach((t, i) => {
    const a1 = a0 + 2 * Math.PI * t / soma, meio = (a0 + a1) / 2;
    const f = new THREE.Shape();                     // um "setor de anel": arco de fora, arco de dentro
    f.absarc(0, 0, 3, a0, a1, false);
    f.absarc(0, 0, 1.5, a1, a0, true);
    const m = new THREE.Mesh(
      new THREE.ExtrudeGeometry(f, { depth: 1, bevelEnabled: false, curveSegments: 32 }).rotateX(-Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: COR_REG[i], roughness: 0.45 })
    );
    const pct = (100 * t / soma).toFixed(0);
    m.userData = { brilha: true, txt: REGIOES[i] + ": " + t.toFixed(1) + " mil (" + pct + "%)" };
    cena.add(m); alvos.push(m); cres.push(m);
    cena.add(rotulo(REGIOES[i] + " " + pct + "%", 4.2 * Math.cos(meio), 0.6, -4.2 * Math.sin(meio), "#e2e8f0", 256));
    a0 = a1;
  });
  cena.add(rotulo("Total", 0, 1.5, 0, "#94a3b8"));
  cena.add(rotulo(soma.toFixed(0) + " mil", 0, 1.1, 0, "#facc15"));
}

// modo 6: bolhas. a 4a medida (w) vira tamanho E cor ao mesmo tempo
function montarBolhas() {
  const geo = new THREE.SphereGeometry(1, 20, 14);
  bolhas.forEach(q => {
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: rampa(q.w), roughness: 0.35, transparent: true, opacity: 0.85 }));
    m.position.set(q.p[0] - 3, q.p[1], q.p[2] - 3);
    m.userData = { brilha: true, r: 0.12 + 0.38 * q.w,
      txt: "x=" + q.p[0].toFixed(1) + "  y=" + q.p[1].toFixed(1) + "  z=" + q.p[2].toFixed(1) + "  tamanho=" + q.w.toFixed(2) };
    cena.add(m); alvos.push(m); cres.push(m);
  });
  eixosXYZ();
}

const NOMES = [null,
  "<b>Barras 3D</b>: vendas por regiao e mes",
  "<b>Dispersao 3D</b>: 150 pontos em 3 grupos",
  "<b>Superficie 3D</b>: altura e cor = f(x, z)",
  "<b>Linhas 3D</b>: uma serie por regiao, mes a mes",
  "<b>Rosca 3D</b>: parte de cada regiao no total",
  "<b>Bolhas 3D</b>: x, y, z mais tamanho e cor (4a medida)"];
const MONTAR = [null, montarBarras, montarDispersao, montarSuperficie, montarLinhas, montarRosca, montarBolhas];

function limpar() {                                // libera a memoria da GPU do grafico anterior
  cena.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
  });
  while (cena.children.length) cena.remove(cena.children[0]);
}

function montar() {
  limpar();
  alvos.length = 0; cres.length = 0;
  anim = 0;
  MONTAR[modo]();
  hud.innerHTML = NOMES[modo] + "<br>1 a 6 troca o grafico &middot; R novos dados &middot; passe o mouse";
  aplicar();
  sujo = true;
}

// anim vai de 0 a 1: as barras crescem, os pontos aparecem
function aplicar() {
  const k = 1 - Math.pow(1 - anim, 3);             // easing: comeca rapido, termina suave
  cres.forEach(m => {
    if (modo === 1) { const h = Math.max(m.userData.alt * k, 0.001); m.scale.y = h; m.position.y = h / 2; }
    else if (modo === 2 || modo === 6) m.scale.setScalar(Math.max(m.userData.r * k, 0.001));
    else m.scale.y = Math.max(k, 0.001);           // relevo, linhas e fatias crescem so na vertical
  });
}

// ---- 4) INTERACAO: raycaster + dica de texto
const hud = document.createElement("div");
hud.style.cssText = "position:fixed;left:10px;top:8px;color:#cbd5e1;font:13px/1.5 sans-serif;pointer-events:none";
document.body.appendChild(hud);
const dica = document.createElement("div");
dica.style.cssText = "position:fixed;pointer-events:none;display:none;padding:6px 10px;background:#0f172ae6;color:#fff;border:1px solid #22d3ee;border-radius:6px;font:13px sans-serif";
document.body.appendChild(dica);
const marca = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
marca.visible = false;                             // bolinha que marca o ponto da superficie sob o mouse
scene.add(marca);
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let sob = null;
renderer.domElement.addEventListener("pointermove", e => {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(alvos)[0];
  const novo = hit ? hit.object : null;
  if (novo !== sob) {
    if (sob && sob.userData.brilha) sob.material.emissive.setHex(0x000000);
    if (novo && novo.userData.brilha) novo.material.emissive.setHex(0x555555);
    sob = novo; sujo = true;
  }
  marca.visible = !!(novo && novo.userData.dica);
  if (marca.visible) { marca.position.copy(hit.point); sujo = true; }
  dica.style.display = novo ? "block" : "none";
  if (novo) {
    dica.textContent = novo.userData.dica ? novo.userData.dica(hit.point) : novo.userData.txt;
    dica.style.left = (e.clientX + 14) + "px"; dica.style.top = (e.clientY + 14) + "px";
  }
});
addEventListener("keydown", e => {
  const d = /^Digit([1-6])$/.exec(e.code);
  if (d) modo = +d[1];
  else if (e.code === "KeyR") { dados = gerarBarras(); pontos = gerarPontos(); bolhas = gerarBolhas(); picos = gerarPicos(); }
  else return;
  sob = null; dica.style.display = "none"; marca.visible = false;
  montar();
});
addEventListener("resize", () => { sujo = true; });

montar();
const relogio = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = relogio.getDelta();
  if (anim < 1) { anim = Math.min(1, anim + dt * 1.6); aplicar(); sujo = true; }
  controls.update();
  if (!sujo) return;       // parado: a GPU descansa
  sujo = false;
  renderer.render(scene, camera);
});`},
{t:"Colisor de partículas",
 lead:"Dois feixes batem de frente, a energia vira partículas novas e um campo magnético entorta as trilhas: a física do LHC em 150 linhas.",
 txt:`<p>Um <b>colisor</b> lança dois feixes em sentidos opostos e os faz colidir no centro de um <b>detector</b>. A energia da batida vira partículas novas (<code>E = mc²</code>). Aqui tratamos todas como <b>sem massa</b>, então energia e momento têm o mesmo valor: <code>E = p</code>. A simulação é inventada, mas respeita as regras que os físicos conferem em cada evento real.</p>
<p><b>Três conservações.</b> (1) <b>Energia:</b> a soma das partículas tem de dar <code>2 × E do feixe</code>. Sorteamos pesos aleatórios e os normalizamos para que a soma feche exatamente. (2) <b>Momento:</b> os feixes são opostos, então o momento total inicial é <b>zero</b>; por isso criamos as partículas em <b>pares</b> com direções opostas, e <code>Σp = 0</code>. (3) <b>Carga:</b> cada par é (+, −) ou (0, 0), então <code>Σq = 0</code>. O painel confere os três números a cada colisão.</p>
<p><b>O campo magnético.</b> A força de Lorentz é <code>F = q·v × B</code>: é <b>perpendicular</b> à velocidade, então muda a direção, mas não a rapidez. Com <code>B</code> ao longo do eixo X, a parte transversal da velocidade (y, z) gira num círculo e a parte ao longo de X segue reta: o resultado é uma <b>hélice</b>. O raio é <code>r = p / (q·B)</code>: quanto <b>maior o momento</b>, mais reta a trilha; mais campo ou menos momento, espiral mais fechada; carga oposta gira para o outro lado; carga zero segue reta. É assim que um detector real <b>mede o momento</b>: pela curvatura.</p>
<p><b>Por que girar o vetor e não somar a aceleração?</b> Com <code>v += a·dt</code> cada passo sai pela tangente do círculo, e a rapidez <b>cresce</b> a cada quadro: a órbita vira uma espiral para fora, como se a energia surgisse do nada. Girar o vetor por um ângulo <code>w·dt</code> com <code>cos</code> e <code>sin</code> preserva <code>|v|</code> exatamente. Aqui <code>w = K·q·B / E</code> (menos energia, giro mais rápido).</p>
<p><b>Detalhes de código.</b> Cada trilha é uma <code>Line</code> com buffer pré-alocado (400 pontos) e <code>setDrawRange</code> para ela crescer a cada quadro. Ao tocar a parede do detector a partícula deixa uma bolinha (o "calorímetro") de tamanho proporcional à energia. Partículas de pouco momento ficam em <b>laço</b> dentro do detector e nunca saem.</p>
<div class="note"><b>Controles:</b> <b>clique no preview</b> para dar foco. <b>Espaço</b> dispara os feixes, <b>R</b> repete automaticamente, <b>↑ ↓</b> mudam a energia de cada feixe e <b>← →</b> mudam o campo B. Mude o <b>B durante o evento</b> e veja as trilhas se entortarem ao vivo. <b>Arraste</b> para girar a câmera.</div>
<div class="note tip"><b>Desafios:</b> (1) coloque <b>massa</b>: <code>E² = p² + m²</code>, então a rapidez fica <code>p/E &lt; 1</code>; (2) um <b>decaimento</b>: uma partícula neutra que vira duas filhas no meio do caminho, conservando momento e energia; (3) um <b>histograma</b> dos momentos das partículas; (4) feixes com <b>energias diferentes</b>: o <code>Σp</code> inicial não é zero e o sistema todo "anda"; (5) o <b>sentido do campo</b> invertido; (6) desenhe os feixes circulando num anel antes da colisão.</div>`,
 code:`// ===== Colisor de partículas: feixes, campo magnético e conservação =====
scene.background = new THREE.Color(0x05060f);
camera.position.set(9, 6, 11);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const RD = 5, LD = 6;          // raio e meio-comprimento do detector
const V = 14;                  // rapidez de exibição das partículas ("c"), em unidades por segundo
const K = 0.5;                 // converte B e energia em velocidade de giro (unidades de exibição)
let E = 6.5, B = 3.5;          // energia de CADA feixe (TeV) e campo magnético (T)

// ---- detector (cilindro de arame em volta do eixo X) e tubo do feixe
scene.add(new THREE.Mesh(new THREE.CylinderGeometry(RD, RD, 2 * LD, 32, 6, true).rotateZ(Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x4455aa, wireframe: true, transparent: true, opacity: 0.25 })));
scene.add(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 26, 8).rotateZ(Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x667799 })));

// ---- os dois feixes e o clarão da colisão
const esfera = (cor) => new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 12), new THREE.MeshBasicMaterial({ color: cor }));
const feixeA = esfera(0xff7a3d), feixeB = esfera(0x3dd6ff);
const flash = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }));
scene.add(feixeA, feixeB, flash);

// ---- texto na tela
const hud = document.createElement("div");
hud.style.cssText = "position:fixed;left:8px;top:8px;padding:6px 9px;background:#0b1020cc;color:#e9e7ff;font:11px/1.5 monospace;border:1px solid #2a2358;border-radius:8px;pointer-events:none;white-space:pre";
document.body.appendChild(hud);
let resumo = "", auto = false;
function texto() {
  hud.textContent = "Energia de cada feixe: " + E.toFixed(1) + " TeV  [↑ ↓]\\nCampo magnético B: " + B.toFixed(1) + " T  [← →]\\n[Espaço] colidir   [R] repetir: " + (auto ? "ligado" : "desligado") + (resumo ? "\\n\\n" + resumo : "");
}

// ---- 1) AS PARTÍCULAS: cada uma é uma trilha (Line) que cresce quadro a quadro
const evento = new THREE.Group();
scene.add(evento);
let particulas = [];
function limpa() {
  evento.children.slice().forEach((o) => { evento.remove(o); o.geometry.dispose(); o.material.dispose(); });
  particulas = [];
}
function novaParticula(d, q, Ei) {            // d = direção (unitária), q = carga, Ei = energia (= momento)
  const MAX = 400;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(MAX * 3), 3));
  geo.setDrawRange(0, 1);                     // começa com 1 ponto (a origem) e vai crescendo
  const cor = q > 0 ? 0xff5f7a : q < 0 ? 0x4de3ff : 0x9aa0b5;
  const linha = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: cor, transparent: true, opacity: q ? 0.95 : 0.5 }));
  linha.frustumCulled = false;
  evento.add(linha);
  particulas.push({ geo, n: 1, MAX, cor, q, Ei, pos: new THREE.Vector3(), v: d.clone().multiplyScalar(V), viva: true });
}

// ---- 2) A COLISÃO: parte a energia em pares com momentos opostos
function colidir() {
  limpa();
  const pares = Math.round(3 + 1.5 * E);                                  // mais energia, mais partículas
  const w = Array.from({ length: pares }, () => -Math.log(1 - Math.random()));   // pesos aleatórios (exponenciais)
  const soma = w.reduce((a, b) => a + b, 0);
  w.forEach((wi) => {
    const Ei = E * wi / soma;                                             // a soma de todos os Ei fecha em E (cada par leva 2 Ei)
    const c = 2 * Math.random() - 1, a = 2 * Math.PI * Math.random(), s = Math.sqrt(1 - c * c);
    const d = new THREE.Vector3(c, s * Math.cos(a), s * Math.sin(a));     // direção sorteada (c = cosseno do ângulo com o eixo X)
    const q = Math.random() < 0.7 ? 1 : 0;                               // par carregado (+,-) ou neutro (0,0)
    novaParticula(d, q, Ei);
    novaParticula(d.clone().negate(), -q, Ei);                           // o parceiro vai no sentido oposto
  });
  // ---- conferência das conservações, calculada de verdade sobre as partículas criadas
  const sp = new THREE.Vector3();
  let se = 0, sq = 0;
  particulas.forEach((pt) => { sp.addScaledVector(pt.v, pt.Ei / V); se += pt.Ei; sq += pt.q; });
  const f2 = (v) => (Math.round(v * 100) / 100 + 0).toFixed(2);
  resumo = "partículas: " + particulas.length + "\\nΣE = " + se.toFixed(1) + " TeV (= 2 × " + E.toFixed(1) + ")\\nΣp = (" + f2(sp.x) + ", " + f2(sp.y) + ", " + f2(sp.z) + ")\\nΣcarga = " + sq;
  texto();
}

// ---- 3) O CAMPO MAGNÉTICO: B paralelo a X gira só a parte transversal (y, z) da velocidade
function avanca(pt, dt) {
  const ang = K * B * pt.q / pt.Ei * dt;                  // quanto maior o momento Ei, menor o giro
  const c = Math.cos(ang), s = Math.sin(ang);
  const vy = pt.v.y * c - pt.v.z * s, vz = pt.v.y * s + pt.v.z * c;   // rotação: não muda |v| (somar aceleração mudaria)
  pt.v.y = vy; pt.v.z = vz;
  pt.pos.addScaledVector(pt.v, dt);
  const p = pt.geo.attributes.position;
  p.setXYZ(pt.n++, pt.pos.x, pt.pos.y, pt.pos.z);
  p.needsUpdate = true;
  pt.geo.setDrawRange(0, pt.n);
  if (Math.hypot(pt.pos.y, pt.pos.z) >= RD || Math.abs(pt.pos.x) >= LD) {     // tocou a parede: deixa um "hit"
    const hit = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), new THREE.MeshBasicMaterial({ color: pt.cor }));
    hit.position.copy(pt.pos);
    hit.scale.setScalar(0.06 + 0.12 * pt.Ei);             // tamanho proporcional à energia
    evento.add(hit);
    pt.viva = false;
  } else if (pt.n >= pt.MAX) pt.viva = false;             // laço de baixo momento: nunca sai
}

// ---- 4) OS FEIXES E O TEMPO
let fase = "espera", xA = -13, tEvento = 0;
function disparar() {
  xA = -13;
  feixeA.visible = feixeB.visible = true;
  feixeA.position.x = xA; feixeB.position.x = -xA;
  fase = "feixes";
}
addEventListener("keydown", (e) => {
  if (e.code === "Space") disparar();
  if (e.code === "KeyR") { auto = !auto; if (auto && fase === "espera") disparar(); }
  if (e.code === "ArrowUp") E = Math.min(13, E + 0.5);
  if (e.code === "ArrowDown") E = Math.max(1, E - 0.5);
  if (e.code === "ArrowRight") B = Math.min(8, B + 0.5);
  if (e.code === "ArrowLeft") B = Math.max(0, B - 0.5);
  texto();
});

disparar();
texto();
const relogio = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(relogio.getDelta(), 0.05);
  if (fase === "feixes") {
    xA += V * dt;
    feixeA.position.x = xA; feixeB.position.x = -xA;
    if (xA >= 0) { fase = "evento"; tEvento = 0; feixeA.visible = feixeB.visible = false; colidir(); }
  } else if (fase === "evento") {
    tEvento += dt;
    particulas.forEach((pt) => { if (pt.viva) avanca(pt, dt); });
    if (tEvento > 5) { fase = "espera"; if (auto) disparar(); }
  }
  flash.scale.setScalar(0.3 + tEvento * 6);
  flash.material.opacity = fase === "evento" ? Math.max(0, 0.9 - tEvento * 3) : 0;
  controls.update();
  renderer.render(scene, camera);
});`},
{t:"Dupla fenda (quântica)",
 lead:"Elétrons chegam um a um, cada um num ponto aleatório, e mesmo assim, aos poucos, desenham franjas de interferência. Ligue o detector e as franjas somem.",
 txt:`<p>No experimento da <b>dupla fenda</b>, partículas (aqui, elétrons) atravessam uma barreira com duas fendas e chegam a um anteparo. Cada elétron deixa <b>um</b> ponto, e onde ele cai é <b>aleatório</b>. Só depois de milhares de pontos aparece o padrão: <b>franjas</b> claras e escuras, típicas de ondas. Na mecânica quântica cada elétron é descrito por uma <b>amplitude</b> <code>ψ</code>, e a probabilidade de chegar num ponto é <code>P = |ψ|²</code> (a regra de Born).</p>
<p><b>A matemática.</b> Com as duas fendas abertas, as <b>amplitudes</b> se somam: <code>ψ = ψ₁ + ψ₂</code>, e <code>P = |ψ₁ + ψ₂|² = |ψ₁|² + |ψ₂|² + 2·Re(ψ₁*ψ₂)</code>. O último termo é a <b>interferência</b>. Na aproximação de campo distante isso dá <code>P(x) ∝ cos²(π·d·x / λL) · sinc²(π·a·x / λL)</code>, em que <code>d</code> é a distância entre as fendas, <code>a</code> a largura de cada uma, <code>λ</code> o comprimento de onda e <code>L</code> a distância até o anteparo. O <code>cos²</code> cria as franjas, com espaçamento <code>Δx = λL/d</code>. O <code>sinc²</code> é o envelope da difração de uma fenda só.</p>
<p><b>O detector.</b> Se medimos <b>por qual fenda</b> o elétron passou, os dois caminhos ficam distinguíveis e somamos <b>probabilidades</b>, não amplitudes: <code>P = |ψ₁|² + |ψ₂|²</code>, sem o termo cruzado. As franjas desaparecem. O que importa é o detector <b>interagir</b> com o elétron e registrar o caminho, não alguém olhar. No código, a diferença é uma linha: <code>cos²·sinc²</code> sem detector, <code>sinc²</code> com detector.</p>
<p><b>Como simulamos.</b> Usamos <b>amostragem por rejeição</b>: sorteamos um <code>x</code> uniforme no anteparo e o aceitamos com probabilidade <code>P(x)</code> (que vale no máximo 1). Assim, os pontos obedecem a <code>P</code>, mas cada um é imprevisível. O gráfico compara a <b>contagem</b> (barras) com a <b>teoria</b> (linha): com poucos elétrons as barras são ruído, e com muitos elas se alinham à linha (a lei dos grandes números).</p>
<p><b>O que o desenho mostra.</b> Sem detector, desenhamos dois "fantasmas" roxos, um por fenda, que se encontram no ponto de chegada: é uma <b>metáfora</b> da superposição, não duas partículas. Com detector, o elétron segue uma fenda definida e o ponto recebe a <b>cor da fenda</b> (laranja ou ciano). Simplificação: usamos a fórmula pronta do campo distante, em vez de resolver a equação de Schrödinger, e o envelope é o mesmo para as duas fendas.</p>
<div class="note"><b>Controles:</b> <b>clique no preview</b> para dar foco. <b>O</b> liga e desliga o detector, <b>F</b> troca a velocidade (um por vez, médio, rápido), <b>↑ ↓</b> mudam o comprimento de onda <code>λ</code>, <b>← →</b> mudam a distância <code>d</code> entre as fendas e <b>R</b> reinicia. Mudar qualquer parâmetro limpa o anteparo, para não misturar padrões diferentes. <b>Câmera:</b> <b>1</b> vista geral, <b>2</b> anteparo de frente e <b>3</b> de cima. Arrastar ou dar zoom com o mouse cancela a transição.</div>
<div class="note tip"><b>Desafios:</b> (1) confira no HUD: aumente <code>λ</code> ou diminua <code>d</code> e as franjas se afastam, como em <code>Δx = λL/d</code>; (2) <b>detector parcial</b>: observe só uma fração <code>p</code> dos elétrons e use <code>P = (1−p)·cos²·sinc² + p·sinc²</code> (as franjas ficam "apagadas", mas não somem); (3) <b>N fendas</b> (rede de difração): troque o <code>cos²</code> por <code>(sen(Nβ)/sen β)²</code>; (4) ligue <code>λ</code> ao momento do elétron: <code>λ = h/(m·v)</code> (de Broglie); (5) estime <b>quantos elétrons</b> são necessários para as franjas ficarem claras; (6) resolva a equação de Schrödinger numa grade 2D.</div>`,
 code:`// ===== Dupla fenda: elétrons um a um, franjas de interferência e detector de fenda =====
scene.background = new THREE.Color(0x05060f);
camera.position.set(9, 5.5, -13);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08; controls.minDistance = 3; controls.maxDistance = 40;

// ---- parâmetros físicos (unidades de exibição)
const L = 8;                   // distância da barreira ao anteparo
const A = 0.25;                // largura de cada fenda
const X = 5;                   // o anteparo vai de -X a X
let lambda = 0.15, D = 1.0;    // comprimento de onda e distância entre as fendas
let obs = false, vel = 0;      // detector ligado? velocidade: 0 = um por vez, 1 = médio, 2 = rápido
const TAXA = [2, 25, 150];        // elétrons por segundo em cada velocidade
const DUR = [1.4, 1.4, 0.45];     // duração do voo (s): quanto maior a taxa, mais curto o voo, para a tela não lotar

// ---- 1) A FÍSICA: probabilidade de chegar na posição x do anteparo
const sinc2 = (u) => (Math.abs(u) < 1e-6 ? 1 : (Math.sin(u) / u) ** 2);
function prob(x) {
  const env = sinc2(Math.PI * A * x / (lambda * L));          // difração de uma fenda
  if (obs) return env;                                        // com detector: soma de PROBABILIDADES (sem franjas)
  return Math.cos(Math.PI * D * x / (lambda * L)) ** 2 * env;  // sem detector: soma de AMPLITUDES (franjas)
}
function sorteiaX() {                                         // amostragem por rejeição
  for (;;) {
    const x = (Math.random() * 2 - 1) * X;
    if (Math.random() < prob(x)) return x;
  }
}

// ---- 2) O CENÁRIO: canhão, barreira com duas fendas, sensores e anteparo
const basico = (cor) => new THREE.MeshBasicMaterial({ color: cor });
const canhao = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.4, 1, 16).rotateX(Math.PI / 2), basico(0x8892b0));
canhao.position.z = -9;
scene.add(canhao);
const caixa = new THREE.BoxGeometry(1, 6, 0.3);
const barr = [0, 1, 2].map(() => {
  const m = new THREE.Mesh(caixa, basico(0x2b3354));
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(caixa), new THREE.LineBasicMaterial({ color: 0x8fa0ff })));
  scene.add(m);
  return m;
});
const sensores = [0, 1].map(() => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), basico(0xff3355));
  m.position.z = -0.5;
  m.userData.flash = 0;
  scene.add(m);
  return m;
});
function montaBarreira() {                     // 3 blocos: esquerda, meio e direita; as fendas são os vãos
  const h = D / 2, a2 = A / 2;
  [[-6, -h - a2], [-h + a2, h - a2], [h + a2, 6]].forEach(([x0, x1], i) => {
    barr[i].scale.x = x1 - x0;
    barr[i].position.x = (x0 + x1) / 2;
  });
  sensores[0].position.x = -h; sensores[1].position.x = h;
}
const tela = new THREE.Mesh(new THREE.PlaneGeometry(2 * X + 0.4, 6), new THREE.MeshBasicMaterial({ color: 0x0b1230, side: THREE.DoubleSide }));
tela.position.z = L;
scene.add(tela);

// ---- 3) OS PONTOS NO ANTEPARO (um por elétron) e o histograma
const MAXD = 6000, NB = 70;
const dPos = new Float32Array(MAXD * 3), dCor = new Float32Array(MAXD * 3);
const dGeo = new THREE.BufferGeometry();
dGeo.setAttribute("position", new THREE.BufferAttribute(dPos, 3));
dGeo.setAttribute("color", new THREE.BufferAttribute(dCor, 3));
dGeo.setDrawRange(0, 0);
const pontos = new THREE.Points(dGeo, new THREE.PointsMaterial({ size: 0.07, vertexColors: true }));
pontos.frustumCulled = false;
scene.add(pontos);
const COR_A = new THREE.Color(0xff7a3d), COR_B = new THREE.Color(0x3dd6ff), COR_Q = new THREE.Color(0xfff2b0), COR_FANTASMA = new THREE.Color(0x7c5cff);
let nD = 0;
const hist = new Array(NB).fill(0);
function ponto(x, y, via) {                    // via: -1 / +1 = fenda detectada, 0 = desconhecida
  if (nD >= MAXD) return;
  const c = via < 0 ? COR_A : via > 0 ? COR_B : COR_Q;
  dPos.set([x, y, L - 0.02], nD * 3);
  dCor.set([c.r, c.g, c.b], nD * 3);
  nD++;
  hist[Math.min(NB - 1, Math.floor((x + X) / (2 * X) * NB))]++;
  dGeo.attributes.position.needsUpdate = dGeo.attributes.color.needsUpdate = true;
  dGeo.setDrawRange(0, nD);
}

// ---- 4) OS ELÉTRONS EM VOO: um (com detector) ou dois "fantasmas" (sem detector)
const bolas = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8), new THREE.MeshBasicMaterial(), 400);
bolas.frustumCulled = false;
scene.add(bolas);
let voos = [], acc = 0;
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _p = new THREE.Vector3();
function posicao(v, via, out) {                // s de 0 a 1: canhão -> fenda (até 0.52) -> ponto de chegada
  const sx = via * D / 2;
  if (v.s < 0.52) { const u = v.s / 0.52; return out.set(sx * u, 0, -9 * (1 - u)); }
  const u = (v.s - 0.52) / 0.48;
  return out.set(sx + (v.x - sx) * u, v.y * u, L * u);
}
function emite() {
  const x = sorteiaX(), y = (Math.random() - 0.5) * 5, fenda = Math.random() < 0.5 ? -1 : 1;
  voos.push({ s: 0, x, y, fenda, dur: DUR[vel] });   // todo elétron é animado, da fonte até o anteparo
}

// ---- 5) TEXTO E GRÁFICO NA TELA
const hud = document.createElement("div");
hud.style.cssText = "position:fixed;left:8px;top:8px;padding:6px 9px;background:#0b1020cc;color:#e9e7ff;font:11px/1.5 monospace;border:1px solid #2a2358;border-radius:8px;pointer-events:none;white-space:pre";
document.body.appendChild(hud);
const cv = document.createElement("canvas");
cv.width = 280; cv.height = 110;
cv.style.cssText = "position:fixed;right:8px;bottom:8px;background:#0b1020cc;border:1px solid #2a2358;border-radius:8px;pointer-events:none";
document.body.appendChild(cv);
function texto() {
  hud.textContent = "Detector de fenda: " + (obs ? "LIGADO (sem franjas)" : "desligado (franjas)") + "  [O]\\nλ = " + lambda.toFixed(2) + " [↑ ↓]   d = " + D.toFixed(1) + " [← →]\\nespaçamento das franjas Δx = λL/d = " + (lambda * L / D).toFixed(2) +
    "\\nvelocidade: " + ["um por vez", "médio", "rápido"][vel] + " [F]   reiniciar [R]\\nelétrons detectados: " + nD + (nD >= MAXD ? " (limite)" : "") + "\\ncâmera: " + nomeVista() + "  [1] geral [2] anteparo [3] de cima";
}
function desenhaGrafico() {
  const g = cv.getContext("2d"), W = 280, H = 110;
  g.clearRect(0, 0, W, H);
  const teo = hist.map((_, i) => prob(-X + (i + 0.5) * 2 * X / NB));
  const st = teo.reduce((a, b) => a + b, 0) || 1;
  const esp = teo.map((v) => nD * v / st);       // contagem esperada em cada coluna, pela teoria
  const topo = Math.max(1, ...hist, ...esp), bw = W / NB;
  g.fillStyle = "#6f7bd9";
  hist.forEach((c, i) => { const h = c / topo * (H - 22); g.fillRect(i * bw, H - 14 - h, bw - 1, h); });
  g.strokeStyle = "#ffd84d";
  g.beginPath();
  esp.forEach((v, i) => { const yy = H - 14 - v / topo * (H - 22); if (i) g.lineTo((i + 0.5) * bw, yy); else g.moveTo((i + 0.5) * bw, yy); });
  g.stroke();
  g.fillStyle = "#e9e7ff"; g.font = "10px monospace";
  g.fillText("barras: contagem   linha: teoria P(x)", 4, H - 3);
}

// ---- 6) CONTROLES
function reinicia() { nD = 0; hist.fill(0); voos = []; dGeo.setDrawRange(0, 0); montaBarreira(); texto(); }
addEventListener("keydown", (e) => {
  if (e.code === "KeyO") { obs = !obs; reinicia(); }
  if (e.code === "KeyF") { vel = (vel + 1) % 3; texto(); }
  if (e.code === "KeyR") reinicia();
  if (e.code === "ArrowUp") { lambda = Math.min(0.3, lambda + 0.01); reinicia(); }
  if (e.code === "ArrowDown") { lambda = Math.max(0.08, lambda - 0.01); reinicia(); }
  if (e.code === "ArrowRight") { D = Math.min(1.6, D + 0.1); reinicia(); }
  if (e.code === "ArrowLeft") { D = Math.max(0.6, D - 0.1); reinicia(); }
});

// ----- câmera: vistas predefinidas, transições suaves e modo seguir -----
const tanV = () => Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
const VISTAS = {
  1: { nome: "geral", pos: () => new THREE.Vector3(9, 5.5, -13), alvo: () => new THREE.Vector3(0, 0, 0) },
  2: { nome: "anteparo", pos: () => {
      const d = Math.max((X + 0.6) / (tanV() * camera.aspect), 3.4 / tanV());
      return new THREE.Vector3(0, 0.3, L - d);
    }, alvo: () => new THREE.Vector3(0, 0, L) },
  3: { nome: "de cima", pos: () => {
      const d = Math.max(10.5 / tanV(), 6.8 / (tanV() * camera.aspect));
      return new THREE.Vector3(0, d, -0.5 - d * 0.18);
    }, alvo: () => new THREE.Vector3(0, 0, -0.5) }
};
let vistaAtual = 1, transicao = null;
function nomeVista() {
  return VISTAS[vistaAtual] ? VISTAS[vistaAtual].nome : "livre";
}
function irPara(n) {
  vistaAtual = n;
  transicao = { pos: VISTAS[n].pos(), alvo: VISTAS[n].alvo() };
  texto();
}
controls.addEventListener("start", () => {
  transicao = null; vistaAtual = 0;
});
window.addEventListener("keydown", (e) => {
  if (e.code === "Digit1") irPara(1);
  else if (e.code === "Digit2") irPara(2);
  else if (e.code === "Digit3") irPara(3);
});
window.addEventListener("resize", () => {
  if (VISTAS[vistaAtual]) irPara(vistaAtual);
});
function atualizaCamera(dt) {
  if (transicao) {
    camera.position.lerp(transicao.pos, 1 - Math.exp(-4 * dt));
    controls.target.lerp(transicao.alvo, 1 - Math.exp(-4 * dt));
    if (camera.position.distanceTo(transicao.pos) < 0.02 && controls.target.distanceTo(transicao.alvo) < 0.02) transicao = null;
  }
}

reinicia();
const relogio = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(relogio.getDelta(), 0.05);
  acc += TAXA[vel] * dt;
  while (acc >= 1) { acc -= 1; emite(); }
  for (let i = voos.length - 1; i >= 0; i--) {  // avança os voos; ao chegar, vira um ponto no anteparo
    const v = voos[i];
    v.s += dt / v.dur;
    if (v.s >= 1) {
      ponto(v.x, v.y, obs ? v.fenda : 0);
      if (obs) sensores[v.fenda < 0 ? 0 : 1].userData.flash = 1;
      voos.splice(i, 1);
    }
  }
  let k = 0;
  voos.forEach((v) => {
    (obs ? [v.fenda] : [-1, 1]).forEach((via) => {
      _m.compose(posicao(v, via, _p), _q, _s.setScalar(obs ? 0.13 : 0.2));
      bolas.setMatrixAt(k, _m);
      bolas.setColorAt(k, obs ? (via < 0 ? COR_A : COR_B) : COR_FANTASMA);
      k++;
    });
  });
  bolas.count = k;
  bolas.instanceMatrix.needsUpdate = true;
  if (bolas.instanceColor) bolas.instanceColor.needsUpdate = true;
  sensores.forEach((m) => { m.visible = obs; m.userData.flash = Math.max(0, m.userData.flash - dt * 4); m.scale.setScalar(1 + m.userData.flash); });
  texto();
  atualizaCamera(dt);
  desenhaGrafico();
  controls.update();
  renderer.render(scene, camera);
});`},
{t:"Autômato celular 3D",
 lead:"O Jogo da Vida ganha uma dimensão: dezenas de milhares de cubos nascendo, decaindo e morrendo, desenhados numa única chamada.",
 txt:`<p>Um <b>autômato celular</b> é uma grade de células, cada uma com um estado, que se atualizam <b>todas ao mesmo tempo</b> por uma regra que olha só para as vizinhas. No Jogo da Vida de Conway (2D) cada célula tem 8 vizinhas. Em 3D a vizinhança é o cubo 3×3×3 sem o centro: <b>26 vizinhas</b> (vizinhança de <i>Moore</i>). Há também a de <i>von Neumann</i>, só as 6 que dividem uma face.</p>
<p><b>A regra.</b> Escrevemos <code>S/B/E</code>: <b>S</b> quantas vizinhas vivas fazem uma célula viva <i>sobreviver</i>, <b>B</b> quantas fazem uma morta <i>nascer</i>, <b>E</b> o número de estados. A regra <code>4/4/5</code> diz: viva com 4 vizinhas sobrevive; morta com exatamente 4 nasce; e como são 5 estados, quem não sobrevive não some de uma vez: <b>decai</b> pelos estados 2, 3 e 4 até virar 0 (célula em decaimento não conta como vizinha). Os números do 2D (2 e 3) não funcionam em 3D, que tem muito mais vizinhas; por isso se procuram regras novas, como as de Carter Bays (<code>5-7/6</code>).</p>
<p><b>Duas grades.</b> A geração nova é calculada numa grade <code>prox</code> lendo a <code>atual</code>. Se escrevêssemos na mesma, células já atualizadas contaminariam a contagem das vizinhas. Cada grade é um <code>Uint8Array</code> de N³ posições, e o índice 3D vira 1D com <code>i = x + N * (y + N * z)</code>. Nas bordas há duas opções: <b>toroidal</b> (sai por um lado, entra pelo oposto) ou <b>paredes</b> (fora da grade conta como morta).</p>
<p><b>Desenhar só o que vive.</b> Reaproveitamos o <code>InstancedMesh</code> (capítulo de mesmo nome) com um truque: a malha tem espaço para a grade inteira (40³ = 64 000 cubos), mas a cada geração <b>compactamos</b> só as células vivas nas primeiras posições e ajustamos <code>malha.count</code>. As matrizes e as cores (<code>setColorAt</code>) só são reescritas quando a geração muda, umas 8 vezes por segundo, e não a 60 quadros por segundo.</p>
<p><b>O custo.</b> Com N = 40 são 64 000 células × 26 vizinhas ≈ 1,7 milhão de leituras por geração. Em <code>Uint8Array</code> isso cabe em poucos milissegundos, e o desenho continua sendo 1 chamada. Com <code>Mesh</code> individuais seriam milhares.</p>
<div class="note"><b>Controles:</b> <b>clique no preview</b> para dar foco. <b>Arraste</b> para girar e use a <b>roda</b> para aproximar. <b>1 a 5</b> trocam a regra e recomeçam. <b>Espaço</b> pausa e <b>→</b> avança uma geração (pausado). <b>↑/↓</b> mudam a velocidade. <b>R</b> recomeça. <b>C</b> alterna a cor (posição, estado, vizinhas). <b>X</b> corta metade do cubo para ver o miolo. <b>B</b> alterna a borda. <b>G</b> muda o tamanho da grade (16 a 40). <b>A</b> liga/desliga a rotação.</div>
<div class="note tip"><b>Experimente:</b> (1) edite uma regra em <code>REGRAS</code>: mude um único número e a "espécie de vida" muda inteira. Teste a de Bays, <code>sobrev: faixa(5, 7), nasc: [6], estados: 2</code>: quase tudo morre e sobram pequenas estruturas imóveis. Regras interessantes são raras. (2) Compare as cores <b>estado</b> (decaimento) e <b>vizinhas</b>. (3) Na regra 5 só existe uma célula no começo: veja um cristal crescer.<br><b>Desafios:</b> (a) clique numa célula: <code>raycaster.intersectObject(malha)</code> devolve <code>instanceId</code>, e para voltar à célula guarde num <code>Int32Array</code> qual índice cada instância representa; apague-a ou crie vizinhas. (b) Troque o cubo por <code>IcosahedronGeometry</code> de poucos triângulos. (c) Para grades de 128³ ou mais, a contagem de vizinhas deve ir para a GPU (veja os capítulos de shaders).</div>`,
 code:`// ===== Autômato celular 3D: Game of Life em três dimensões com InstancedMesh =====
scene.background = new THREE.Color(0x07051a);
camera.far = 300;
camera.updateProjectionMatrix();
scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2358, 1.1));
const sol = new THREE.DirectionalLight(0xffffff, 1.2);
sol.position.set(20, 40, 25);
scene.add(sol);

const ctl = new THREE.OrbitControls(camera, renderer.domElement);
ctl.enableDamping = true;
ctl.autoRotate = true;
ctl.autoRotateSpeed = 1.2;

// ---- as regras: S (sobrevive) / B (nasce) / estados. viz: 26 = Moore, 6 = von Neumann
const faixa = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);   // faixa(5, 7) -> [5, 6, 7]
const REGRAS = [
  { nome: 'Cristais 445',  sobrev: [4],           nasc: [4],              estados: 5,  viz: 26, semente: { tipo: 'cubo', tam: 14, dens: 0.4 } },
  { nome: 'Amoeba',        sobrev: faixa(9, 26),  nasc: [5, 6, 7, 12, 13, 15], estados: 5, viz: 26, semente: { tipo: 'cubo', tam: 10, dens: 0.5 } },
  { nome: 'Piroclástico',  sobrev: faixa(4, 7),   nasc: faixa(6, 8),      estados: 10, viz: 26, semente: { tipo: 'cubo', tam: 8,  dens: 0.5 } },
  { nome: 'Coral',         sobrev: faixa(5, 8),   nasc: [6, 7, 9, 12],    estados: 4,  viz: 26, semente: { tipo: 'cubo', tam: 10, dens: 0.5 } },
  { nome: 'Cristal (1 célula)', sobrev: faixa(0, 6), nasc: [1, 3],        estados: 2,  viz: 6,  semente: { tipo: 'ponto' } },
];

// ---- a simulação: duas grades de bytes (0 = morta, 1 = viva, 2... = decaindo)
const TAMS = [16, 24, 32, 40];
let ti = 2, N = TAMS[ti];
let atual, prox, regra = REGRAS[0], gen = 0, toroidal = true;

function direcoes() {                              // lista (dx, dy, dz) das vizinhas da regra atual
  const d = [];
  for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const dist = Math.abs(dx) + Math.abs(dy) + Math.abs(dz);
    if (dist === 0 || (regra.viz === 6 && dist > 1)) continue;
    d.push(dx, dy, dz);
  }
  return Int8Array.from(d);
}
let DIRS = direcoes();

function contar(x, y, z) {                         // quantas vizinhas estão VIVAS (estado 1)
  let n = 0;
  for (let k = 0; k < DIRS.length; k += 3) {
    let a = x + DIRS[k], b = y + DIRS[k + 1], c = z + DIRS[k + 2];
    if (toroidal) { a = (a + N) % N; b = (b + N) % N; c = (c + N) % N; }
    else if (a < 0 || b < 0 || c < 0 || a >= N || b >= N || c >= N) continue;
    if (atual[a + N * (b + N * c)] === 1) n++;
  }
  return n;
}

function passo() {
  const sob = new Uint8Array(27), nas = new Uint8Array(27), C = regra.estados;
  regra.sobrev.forEach((n) => (sob[n] = 1));       // tabelas: sob[n] = 1 se sobrevive com n vizinhas
  regra.nasc.forEach((n) => (nas[n] = 1));
  for (let z = 0; z < N; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = x + N * (y + N * z), e = atual[i], n = contar(x, y, z);
    if (e === 0) prox[i] = nas[n] ? 1 : 0;                          // morta: nasce?
    else if (e === 1) prox[i] = sob[n] ? 1 : (C > 2 ? 2 : 0);       // viva: sobrevive ou começa a decair
    else prox[i] = e + 1 >= C ? 0 : e + 1;                          // decaindo: avança até sumir
  }
  [atual, prox] = [prox, atual];                   // a grade nova vira a atual
  gen++;
}

function semear() {
  atual = new Uint8Array(N * N * N);
  prox = new Uint8Array(N * N * N);
  const s = regra.semente, c = N >> 1;
  if (s.tipo === 'ponto') atual[c + N * (c + N * c)] = 1;
  else {
    const tam = Math.min(s.tam, N), a = c - (tam >> 1), b = a + tam;   // um cubo de sorteio no centro
    for (let z = a; z < b; z++) for (let y = a; y < b; y++) for (let x = a; x < b; x++)
      if (Math.random() < s.dens) atual[x + N * (y + N * z)] = 1;
  }
  gen = 0;
}

// ---- desenho: UM InstancedMesh com espaço para a maior grade; só as células vivas ocupam posições
const MAXN = Math.max(...TAMS) ** 3;
const malha = new THREE.InstancedMesh(
  new THREE.BoxGeometry(0.92, 0.92, 0.92),
  new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.1 }),   // branco: a cor vem de cada instância
  MAXN
);
malha.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
malha.setColorAt(0, new THREE.Color(1, 1, 1));     // cria o buffer de cores antes do 1º render
malha.frustumCulled = false;
malha.count = 0;
scene.add(malha);

let caixa;
function moldura() {                               // o contorno da grade
  if (caixa) { scene.remove(caixa); caixa.geometry.dispose(); }
  caixa = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(N, N, N)),
    new THREE.LineBasicMaterial({ color: 0x8b5cf6 })
  );
  scene.add(caixa);
}

let modoCor = 0, corte = false, vivas = 0, visiveis = 0;
const dummy = new THREE.Object3D(), cor = new THREE.Color();
function corDe(x, y, z, e) {
  const C = regra.estados, f = C > 2 ? (e - 1) / (C - 1) : 0;   // f: 0 = viva, perto de 1 = quase sumindo
  if (modoCor === 0) cor.setHSL(0.55 + ((x + y + z) / (3 * N)) * 0.45, 0.8, (0.35 + 0.3 * (y / N)) * (1 - 0.6 * f));
  else if (modoCor === 1) cor.setHSL(0.14 + f * 0.7, 0.9, 0.58 - f * 0.28);
  else cor.setHSL(0.62 - (contar(x, y, z) / regra.viz) * 0.62, 0.9, 0.55 * (1 - 0.6 * f));
}

function desenhar() {                              // só roda quando a geração muda
  let k = 0;
  vivas = 0;
  for (let z = 0; z < N; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const e = atual[x + N * (y + N * z)];
    if (!e) continue;
    if (e === 1) vivas++;
    if (corte && x >= N / 2) continue;             // "corte": esconde metade para ver o miolo
    dummy.position.set(x - N / 2 + 0.5, y - N / 2 + 0.5, z - N / 2 + 0.5);
    dummy.updateMatrix();
    malha.setMatrixAt(k, dummy.matrix);
    corDe(x, y, z, e);
    malha.setColorAt(k, cor);
    k++;
  }
  visiveis = malha.count = k;                      // count: quantas instâncias desenhar
  malha.instanceMatrix.needsUpdate = true;
  malha.instanceColor.needsUpdate = true;
}

function recomecar() { semear(); desenhar(); }
function trocarGrade() {
  N = TAMS[ti];
  moldura();
  camera.position.setLength(N * 1.8);
  recomecar();
}
moldura();
camera.position.set(1, 0.7, 1).setLength(N * 1.8);
recomecar();

// ---- controles
const VELS = [1, 2, 4, 8, 15, 30];
let vi = 3, pausa = false, acum = 0, vazio = 0;
addEventListener('keydown', (e) => {
  const d = e.code.match(/^Digit([1-9])$/);
  if (d && REGRAS[d[1] - 1]) { regra = REGRAS[d[1] - 1]; DIRS = direcoes(); recomecar(); }
  if (e.code === 'Space') pausa = !pausa;
  if (e.code === 'ArrowRight' && pausa) { passo(); desenhar(); }
  if (e.code === 'ArrowUp') vi = Math.min(VELS.length - 1, vi + 1);
  if (e.code === 'ArrowDown') vi = Math.max(0, vi - 1);
  if (e.code === 'KeyR') recomecar();
  if (e.code === 'KeyC') { modoCor = (modoCor + 1) % 3; desenhar(); }
  if (e.code === 'KeyX') { corte = !corte; desenhar(); }
  if (e.code === 'KeyB') toroidal = !toroidal;
  if (e.code === 'KeyG') { ti = (ti + 1) % TAMS.length; trocarGrade(); }
  if (e.code === 'KeyA') ctl.autoRotate = !ctl.autoRotate;
});

const texto = (a) => {                             // [5,6,7] -> "5-7"
  const s = [];
  for (let i = 0; i < a.length;) {
    let j = i;
    while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++;
    s.push(j > i ? a[i] + '-' + a[j] : '' + a[i]);
    i = j + 1;
  }
  return s.join(',');
};
const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:10px;left:0;right:0;text-align:center;color:#fff;font:700 16px/1.5 system-ui;text-shadow:0 2px 8px #000;pointer-events:none';
document.body.appendChild(hud);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (!pausa) {
    acum += dt;
    if (acum >= 1 / VELS[vi]) { acum = 0; passo(); desenhar(); }   // uma geração por vez
  }
  vazio = vivas + visiveis === 0 ? vazio + dt : 0;
  if (vazio > 2) recomecar();                      // tudo morreu: semeia de novo

  ctl.update();
  renderer.render(scene, camera);
  hud.innerHTML = regra.nome + ' · ' + texto(regra.sobrev) + '/' + texto(regra.nasc) + '/' + regra.estados + '/' + (regra.viz === 26 ? 'M' : 'VN') +
    '<br>geração ' + gen + ' · vivas ' + vivas + ' · desenhadas ' + visiveis + ' · grade ' + N + '³' +
    '<br>chamadas de desenho: ' + renderer.info.render.calls + (pausa ? ' · PAUSADO' : ' · ' + VELS[vi] + ' gerações/s') +
    '<br><span style="font-size:13px;font-weight:400">1-5 regra · Espaço pausa · ↑/↓ velocidade · R · C cor · X corte · B borda · G grade · A giro</span>';
});`},
{t:"Boids",
 lead:"Três regras simples, milhares de agentes e um bando que parece ter vida própria.",
 txt:`<p>Um bando de estorninhos faz curvas que parecem coreografadas, mas <b>ninguém comanda</b>. Em 1986, Craig Reynolds mostrou que basta cada \"boid\" (de <i>bird-oid</i>, \"parecido com pássaro\") seguir <b>três regras locais</b>, olhando só para os vizinhos próximos, e o bando inteiro aparece sozinho. É o mesmo espírito do capítulo <i>Autômato celular 3D</i>: regras simples, comportamento <b>emergente</b>. Aqui são milhares de agentes em 3D, desenhados com <code>InstancedMesh</code>.</p>
<p><b>As três regras.</b> Cada quadro, cada boid soma três \"vontades\" numa aceleração: (1) <b>separação</b>: afastar-se de quem está perto demais (<code>-dx / d²</code>: quanto mais perto, mais forte); (2) <b>alinhamento</b>: aproximar a sua velocidade da <b>média</b> dos vizinhos (<code>média - v</code>); (3) <b>coesão</b>: andar em direção ao <b>centro</b> dos vizinhos. A separação evita colisões, o alinhamento faz o grupo apontar para o mesmo lado e a coesão impede que o grupo se desfaça. Aperte <b>1</b>, <b>2</b> e <b>3</b> para desligar cada regra e veja o que falta: sem coesão o bando se espalha; sem alinhamento vira uma nuvem de mosquitos; sem separação todos se amontoam.</p>
<p><b>O problema do O(n²).</b> Para achar os vizinhos, a ideia ingênua compara cada boid com todos os outros: com 4000 boids são 16 milhões de pares <b>por quadro</b>. A solução clássica é uma <b>grade espacial</b>: dividimos o espaço em células do tamanho do raio de visão e guardamos, em cada célula, uma <b>lista encadeada</b> dos boids que estão nela (<code>cabeca[célula]</code> aponta o primeiro e <code>proximo[i]</code> o seguinte). Um boid só precisa olhar as <b>27 células</b> ao redor (3×3×3), porque qualquer vizinho a menos de <code>RAIO</code> está lá. O custo cai para quase linear em <code>n</code>. A grade é refeita do zero a cada quadro, o que é barato.</p>
<p><b>Dois detalhes que importam.</b> Primeiro, as velocidades novas vão para outros arrays (<code>wx, wy, wz</code>) e só depois de todos os boids terem decidido é que copiamos com <code>vx.set(wx)</code>: se cada boid mudasse a velocidade na hora, os últimos da lista enxergariam vizinhos já atualizados e o resultado dependeria da ordem. Segundo, a velocidade fica <b>entre VMIN e VMAX</b>: sem o mínimo o boid pararia no ar, e sem o máximo as forças somadas o fariam disparar. O \"aquário\" é só uma força que cresce quando o boid passa de <code>MUNDO</code>, e o predador (a esfera vermelha) empurra para longe quem chega a menos de 12 unidades.</p>
<p><b>Desenho.</b> Os dados ficam em <code>Float32Array</code>, um por grandeza, e não em objetos: milhares de objetos pequenos pesam para o coletor de lixo. Cada quadro montamos a matriz de cada instância com um <code>Object3D</code> auxiliar (o <code>dummy</code>, como no capítulo <i>InstancedMesh</i>); o truque novo é <code>dummy.lookAt(posição + velocidade)</code>, que faz o nariz do cone apontar para onde o boid vai (por isso a geometria foi girada com <code>rotateX</code>, deixando a ponta no eixo <code>+Z</code>, que é o que o <code>lookAt</code> usa). A cor de cada instância (<code>setColorAt</code>) vem da <b>direção</b>: grupos da mesma cor estão alinhados, e dá para <b>ver</b> o alinhamento nascer.</p>
<div class=\"note\"><b>Controles:</b> <b>clique no preview</b> para dar foco. <b>1 / 2 / 3</b> ligam e desligam separação, alinhamento e coesão. <b>P</b> liga o predador, <b>R</b> espalha o bando de novo e <b>↑/↓</b> mudam a quantidade (de 250 a 8000). <b>Arraste</b> para girar a câmera. Compare o tempo de <b>simulação</b> e as <b>chamadas de desenho</b>: o bando todo custa 1 ou 2, qualquer que seja o número de boids.</div>
<div class=\"note tip\"><b>Experimente:</b> (1) mude <code>W.sep</code>, <code>W.ali</code> e <code>W.coe</code> (tente <code>W.coe = 4</code>, depois <code>W.ali = 6</code>); (2) com <code>RAIO = 8</code> o bando vira um bloco só, e com <code>RAIO = 2</code> surgem vários grupinhos; (3) <code>VMIN = 6, VMAX = 6</code> deixa o bando em velocidade constante.<br><b>Desafios:</b> (a) <b>campo de visão</b>: um boid não vê o que está atrás; use o produto escalar entre a sua direção e <code>(dx, dy, dz)</code> e ignore vizinhos com resultado negativo; (b) troque a grade por um laço duplo (todos contra todos) e compare os <b>ms</b> com 2000 boids; (c) faça o predador seguir o <b>mouse</b> usando o <code>Raycaster</code> contra um plano; (d) <b>obstáculos</b>: esferas que desviam o bando, com a mesma força de fuga do predador; (e) dois bandos de cores diferentes que ignoram um ao outro; (f) um <b>líder</b> que persegue uma trilha e é seguido só por coesão; (g) peixes com cauda, balançando por um <code>ShaderMaterial</code> com uma fase por instância (veja os capítulos de shaders).</div>`,
 code:`// ===== Boids: cardumes e revoadas com 3 regras simples =====
camera.far = 300;
camera.updateProjectionMatrix();
camera.position.set(0, 14, 62);
scene.background = new THREE.Color(0x07182b);
scene.fog = new THREE.Fog(0x07182b, 50, 130);
scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x0b2a4a, 1.0));
const luz = new THREE.DirectionalLight(0xffffff, 0.9);
luz.position.set(20, 40, 10);
scene.add(luz);

const ctl = new THREE.OrbitControls(camera, renderer.domElement);
ctl.autoRotate = true;
ctl.autoRotateSpeed = 0.6;

// ---- parâmetros: mexa à vontade
const MAX = 8000;
const RAIO = 4;          // até onde um boid enxerga os vizinhos
const RAIO_SEP = 1.3;    // mais perto que isso, ele se afasta
const MUNDO = 26;        // raio do "aquário"
const VMIN = 3, VMAX = 8;
const W = { sep: 6, ali: 2, coe: 1.2 };       // peso de cada regra
const ligada = { sep: true, ali: true, coe: true };

// ---- estado: um Float32Array por grandeza (rápido e sem lixo para o coletor)
const px = new Float32Array(MAX), py = new Float32Array(MAX), pz = new Float32Array(MAX);
const vx = new Float32Array(MAX), vy = new Float32Array(MAX), vz = new Float32Array(MAX);
const wx = new Float32Array(MAX), wy = new Float32Array(MAX), wz = new Float32Array(MAX);   // velocidades novas

function espalhar() {
  for (let i = 0; i < MAX; i++) {
    const d = Math.cbrt(Math.random()) * 18, a = Math.random() * 6.283, b = Math.acos(2 * Math.random() - 1);
    px[i] = d * Math.sin(b) * Math.cos(a); py[i] = d * Math.cos(b); pz[i] = d * Math.sin(b) * Math.sin(a);
    const a2 = Math.random() * 6.283, b2 = Math.acos(2 * Math.random() - 1);
    vx[i] = 5 * Math.sin(b2) * Math.cos(a2); vy[i] = 5 * Math.cos(b2); vz[i] = 5 * Math.sin(b2) * Math.sin(a2);
  }
}
espalhar();

// ---- grade espacial: cada célula guarda uma lista encadeada dos boids que estão nela
const CEL = RAIO;                                   // célula do tamanho do raio de visão
const N_CEL = Math.ceil((MUNDO * 2 + 8) / CEL);
const OFFSET = MUNDO + 4;
const cabeca = new Int32Array(N_CEL ** 3);          // primeiro boid de cada célula (-1 = vazia)
const proximo = new Int32Array(MAX);                // o boid seguinte na mesma célula
const celula = (v) => Math.min(N_CEL - 1, Math.max(0, Math.floor((v + OFFSET) / CEL)));

function passo(n, dt, pred) {
  cabeca.fill(-1);
  for (let i = 0; i < n; i++) {
    const c = celula(px[i]) + N_CEL * (celula(py[i]) + N_CEL * celula(pz[i]));
    proximo[i] = cabeca[c];
    cabeca[c] = i;
  }
  const r2 = RAIO * RAIO, s2 = RAIO_SEP * RAIO_SEP;
  for (let i = 0; i < n; i++) {
    const x = px[i], y = py[i], z = pz[i];
    let sx = 0, sy = 0, sz = 0, ax = 0, ay = 0, az = 0, cx = 0, cy = 0, cz = 0, viz = 0;
    const gx = celula(x), gy = celula(y), gz = celula(z);
    // só as 27 células ao redor (3x3x3) podem ter vizinhos dentro do raio
    for (let k = Math.max(0, gz - 1); k <= Math.min(N_CEL - 1, gz + 1); k++)
      for (let j = Math.max(0, gy - 1); j <= Math.min(N_CEL - 1, gy + 1); j++)
        for (let l = Math.max(0, gx - 1); l <= Math.min(N_CEL - 1, gx + 1); l++) {
          let o = cabeca[l + N_CEL * (j + N_CEL * k)];
          while (o !== -1) {
            if (o !== i) {
              const dx = px[o] - x, dy = py[o] - y, dz = pz[o] - z;
              const d2 = dx * dx + dy * dy + dz * dz;
              if (d2 < r2) {
                viz++;
                ax += vx[o]; ay += vy[o]; az += vz[o];      // para o alinhamento: soma das velocidades
                cx += dx; cy += dy; cz += dz;               // para a coesão: soma dos deslocamentos
                if (d2 < s2) {                              // separação: foge, e mais forte quanto mais perto
                  const f = 1 / (d2 + 0.01);
                  sx -= dx * f; sy -= dy * f; sz -= dz * f;
                }
              }
            }
            o = proximo[o];
          }
        }
    let fx = 0, fy = 0, fz = 0;
    if (viz > 0) {
      if (ligada.ali) {                                     // 2) alinhamento: ir para a velocidade média
        fx += (ax / viz - vx[i]) * W.ali; fy += (ay / viz - vy[i]) * W.ali; fz += (az / viz - vz[i]) * W.ali;
      }
      if (ligada.coe) {                                     // 3) coesão: ir para o centro dos vizinhos
        fx += (cx / viz) * W.coe; fy += (cy / viz) * W.coe; fz += (cz / viz) * W.coe;
      }
    }
    if (ligada.sep) { fx += sx * W.sep; fy += sy * W.sep; fz += sz * W.sep; }   // 1) separação
    const d = Math.hypot(x, y, z);
    if (d > MUNDO) {                                        // aquário: empurrão suave de volta ao centro
      const k = (MUNDO - d) * 2 / d;
      fx += x * k; fy += y * k; fz += z * k;
    }
    if (pred) {                                             // predador: todo mundo foge dele
      const dx = x - pred.x, dy = y - pred.y, dz = z - pred.z, dd = Math.hypot(dx, dy, dz);
      if (dd < 12) { const k = (12 - dd) * 2.5 / (dd + 0.1); fx += dx * k; fy += dy * k; fz += dz * k; }
    }
    let nx = vx[i] + fx * dt, ny = vy[i] + fy * dt, nz = vz[i] + fz * dt;
    const v = Math.hypot(nx, ny, nz) || 1;
    const alvo = Math.min(VMAX, Math.max(VMIN, v)) / v;     // limita a velocidade: nem para, nem dispara
    wx[i] = nx * alvo; wy[i] = ny * alvo; wz[i] = nz * alvo;
  }
  vx.set(wx); vy.set(wy); vz.set(wz);                       // só agora todos adotam a velocidade nova
  for (let i = 0; i < n; i++) { px[i] += vx[i] * dt; py[i] += vy[i] * dt; pz[i] += vz[i] * dt; }
}

// ---- desenho: um InstancedMesh para o bando todo
const geo = new THREE.ConeGeometry(0.22, 0.9, 5).rotateX(Math.PI / 2);   // ponta apontando para +Z
const peixes = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true }), MAX);
peixes.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
peixes.frustumCulled = false;
const cor = new THREE.Color();
for (let i = 0; i < MAX; i++) peixes.setColorAt(i, cor.setHex(0xffffff));
scene.add(peixes);

const aquario = new THREE.Mesh(new THREE.SphereGeometry(MUNDO, 24, 16),
  new THREE.MeshBasicMaterial({ color: 0x3a7bd5, wireframe: true, transparent: true, opacity: 0.08 }));
scene.add(aquario);
const tubarao = new THREE.Mesh(new THREE.SphereGeometry(1.4, 16, 12),
  new THREE.MeshStandardMaterial({ color: 0xff4d4d, emissive: 0x661111 }));
scene.add(tubarao);

const dummy = new THREE.Object3D();
const QTDS = [250, 500, 1000, 2000, 4000, 8000];
let qi = 3, n = QTDS[qi], comPredador = true;

addEventListener('keydown', (e) => {
  if (e.code === 'Digit1') ligada.sep = !ligada.sep;
  if (e.code === 'Digit2') ligada.ali = !ligada.ali;
  if (e.code === 'Digit3') ligada.coe = !ligada.coe;
  if (e.code === 'KeyP') comPredador = !comPredador;
  if (e.code === 'KeyR') espalhar();
  if (e.code === 'ArrowUp') qi = Math.min(QTDS.length - 1, qi + 1);
  if (e.code === 'ArrowDown') qi = Math.max(0, qi - 1);
  n = QTDS[qi];
});

const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:10px;left:0;right:0;text-align:center;color:#fff;font:700 16px/1.5 system-ui;text-shadow:0 2px 8px #000;pointer-events:none';
document.body.appendChild(hud);

const clock = new THREE.Clock();
let fps = 60, ms = 0;
const pred = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.033), t = clock.elapsedTime;
  fps += (1 / Math.max(dt, 0.001) - fps) * 0.05;

  pred.set(20 * Math.sin(t * 0.5), 9 * Math.sin(t * 0.7), 20 * Math.cos(t * 0.4));
  tubarao.position.copy(pred);
  tubarao.visible = comPredador;

  const t0 = performance.now();
  passo(n, dt, comPredador ? pred : null);
  ms += (performance.now() - t0 - ms) * 0.1;

  for (let i = 0; i < n; i++) {
    dummy.position.set(px[i], py[i], pz[i]);
    dummy.lookAt(px[i] + vx[i], py[i] + vy[i], pz[i] + vz[i]);   // o nariz aponta para onde vai
    dummy.updateMatrix();
    peixes.setMatrixAt(i, dummy.matrix);
    const v = Math.hypot(vx[i], vy[i], vz[i]);
    cor.setHSL(Math.atan2(vz[i], vx[i]) / 6.2832 + 0.5, 0.8, 0.5 + 0.2 * vy[i] / v);   // matiz = direção
    peixes.setColorAt(i, cor);
  }
  peixes.count = n;
  peixes.instanceMatrix.needsUpdate = true;
  peixes.instanceColor.needsUpdate = true;

  ctl.update();
  renderer.render(scene, camera);
  hud.innerHTML = n + ' boids · FPS ' + Math.round(fps) + ' · simulação ' + ms.toFixed(1) + ' ms · chamadas de desenho ' + renderer.info.render.calls +
    '<br><span style="font-size:14px;font-weight:400">1 separação ' + (ligada.sep ? 'ON' : 'off') + ' · 2 alinhamento ' + (ligada.ali ? 'ON' : 'off') +
    ' · 3 coesão ' + (ligada.coe ? 'ON' : 'off') + ' · P predador · R espalhar · ↑/↓ quantidade</span>';
});
`},
{t:"Shaders com ShaderMaterial",
 lead:"Programe a GPU: cores e formas calculadas pixel a pixel.",
 txt:`<p>Um shader é um pequeno programa em GLSL. O <b>vertex shader</b> posiciona cada vértice; o <b>fragment shader</b> decide a cor de cada pixel. Valores como o tempo chegam do JavaScript por meio de <code>uniforms</code>.</p>
 <div class="note tip"><b>Experimente:</b> troque <code>20.0</code> por <code>60.0</code> (mais listras) ou <code>tempo * 3.0</code> por <code>tempo * 8.0</code>.</div>`,
 code:`const mat = new THREE.ShaderMaterial({
  uniforms: { tempo: { value: 0 } },
  vertexShader:
    'varying vec2 vUv;' +
    'void main(){ vUv = uv;' +
    ' gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader:
    'varying vec2 vUv; uniform float tempo;' +
    'void main(){' +
    ' float f = 0.5 + 0.5 * sin(vUv.x * 20.0 + tempo * 3.0);' +
    ' gl_FragColor = vec4(f, vUv.y, 1.0 - f, 1.0); }',
});

const obj = new THREE.Mesh(new THREE.TorusKnotGeometry(0.9, 0.3, 160, 20), mat);
scene.add(obj);

renderer.setAnimationLoop((t) => {
  mat.uniforms.tempo.value = t / 1000;
  obj.rotation.y = t / 1500;
  renderer.render(scene, camera);
});`}
,
{t:"Galeria de shaders",
 lead:"Plasma, holograma, dissolve, toon e contorno: cinco efeitos prontos para mexer, com o GLSL à mostra.",
 txt:`<p>Aqui cada <b>slide</b> é um efeito de shader pronto para mexer. Troque pelas abas (ou com <b>‹ ›</b> e as teclas <b>1 a 5</b>), arraste os sliders e aperte <b>{ } GLSL</b> para ler o código que está rodando de verdade. Para os conceitos básicos (<code>uniforms</code>, vertex e fragment shader), veja o capítulo anterior, <i>Shaders com ShaderMaterial</i>.</p>
 <p><b>1 · Plasma.</b> Somas de <code>sin()</code> em 3D e uma paleta de cossenos que transforma um número em cor. Usa a posição no objeto (<code>position</code>) em vez de UV, então a esfera não tem emenda. É o ponto de partida de quase todo efeito "procedural": uma função matemática que dá uma cor em cada ponto.</p>
 <p><b>2 · Holograma.</b> Vários truques juntos: <b>Fresnel</b> (<code>1 − |N·V|</code>) faz a borda brilhar; <code>sin(altura * linhas − tempo)</code> cria listras que sobem; o vertex shader desloca faixas horizontais para o "glitch". O material usa <code>AdditiveBlending</code> e <code>depthWrite: false</code>, assim as partes se somam como luz.</p>
 <p><b>3 · Dissolve.</b> Um ruído fractal (<code>fbm</code>) dá um número entre 0 e 1 a cada ponto. O que fica abaixo do <code>limiar</code> é descartado com <code>discard</code>; a faixa logo acima vira brasa. Com <code>side: DoubleSide</code> e <code>gl_FrontFacing</code> dá para pintar o interior de outra cor.</p>
 <p><b>4 · Toon.</b> A luz comum é um degradê (<code>dot(N, L)</code>). Para virar desenho, basta cortá-la em degraus: <code>ceil(d * niveis) / niveis</code>. Um reflexo duro (<code>step</code>) e uma borda iluminada fecham o visual.</p>
 <p><b>5 · Contorno.</b> O <b>casco invertido</b>: desenhe o mesmo objeto de novo com <code>side: BackSide</code> e empurre cada vértice para fora ao longo da normal. Como só as faces de trás aparecem, sobra um anel preto ao redor da silhueta. Aqui o empurrão é feito no espaço da tela, então a espessura é a mesma em pixels, em qualquer distância. O boneco de neve junta Toon + Contorno.</p>
 <div class="note"><b>Dica:</b> as strings GLSL ficam no começo do código (<code>FS_PLASMA</code>, <code>FS_DISS</code>...). Mude uma conta, aperte rodar e veja o efeito mudar na hora. Se houver erro de compilação, ele aparece no console do navegador (F12).</div>
 <div class="note tip"><b>Experimente:</b> (1) no Plasma, troque <code>sin(p.x + tempo)</code> por <code>sin(p.x * 2.0 + tempo)</code>; (2) no Holograma, mude <code>vec3 cor</code> para magenta; (3) no Dissolve, troque a cor da brasa; (4) no Toon, use 2 níveis para um visual de quadrinhos; (5) no Contorno, deixe a espessura em 0 e depois aumente.</div>
 <div class="note tip"><b>Desafios:</b> (1) faça o Dissolve começar de baixo para cima (use <code>vP.y</code> somado ao ruído); (2) coloque um contorno colorido no Holograma; (3) crie um sexto slide com <b>água</b>: desloque <code>position.y</code> no vertex shader com <code>sin</code>; (4) aplique o Toon no Torus com uma textura de rampa em vez do <code>ceil</code>.</div>`,
 code:`// ===== Galeria de shaders: cinco efeitos, um por slide =====
// Troque de slide nas abas, com ‹ › ou com as teclas 1 a 5. Mexa nos sliders.
// O botão { } GLSL mostra o código REAL do shader que está rodando (vertex + fragment).
// Dá para editar os textos dos shaders aqui no código e rodar de novo.

const NL = String.fromCharCode(10);
const juntar = (linhas) => linhas.join(NL);
const clamp = THREE.MathUtils.clamp;

// ---------- trechos de GLSL compartilhados ----------
// Ruído de valor 3D + soma de camadas (fbm): a base do dissolve.
const RUIDO = juntar([
  'float hash(vec3 p) {',
  '  p = fract(p * 0.3183099 + 0.1);',
  '  p *= 17.0;',
  '  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));',
  '}',
  'float ruido(vec3 x) {',
  '  vec3 i = floor(x);',
  '  vec3 f = fract(x);',
  '  f = f * f * (3.0 - 2.0 * f);',
  '  return mix(mix(mix(hash(i), hash(i + vec3(1.0, 0.0, 0.0)), f.x),',
  '                 mix(hash(i + vec3(0.0, 1.0, 0.0)), hash(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),',
  '             mix(mix(hash(i + vec3(0.0, 0.0, 1.0)), hash(i + vec3(1.0, 0.0, 1.0)), f.x),',
  '                 mix(hash(i + vec3(0.0, 1.0, 1.0)), hash(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z);',
  '}',
  'float fbm(vec3 p) {',
  '  float v = 0.0;',
  '  float a = 0.5;',
  '  for (int i = 0; i < 4; i++) { v += a * ruido(p); p *= 2.0; a *= 0.5; }',
  '  return v;',
  '}'
]);

// ---------- 1. PLASMA ----------
const VS_PLASMA = juntar([
  'varying vec3 vP;',
  'void main() {',
  '  vP = position;                       // posição no objeto: sem emendas na esfera',
  '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
  '}'
]);
const FS_PLASMA = juntar([
  'varying vec3 vP;',
  'uniform float tempo;',
  'uniform float escala;',
  'void main() {',
  '  vec3 p = vP * escala;',
  '  float v = sin(p.x + tempo);',
  '  v += sin(p.y * 1.3 + tempo * 1.1);',
  '  v += sin(p.z * 0.9 - tempo * 0.8);',
  '  v += sin(length(p.xy + vec2(sin(tempo * 0.5), cos(tempo * 0.4)) * 2.0) * 1.5);',
  '  v += sin(length(p) * 1.2 - tempo * 0.7);',
  '  v = v / 5.0;                          // soma de 5 senos, de volta para -1..1',
  '  // paleta cosseno: transforma um número em cor',
  '  vec3 cor = 0.5 + 0.5 * cos(6.28318 * (v * 0.6 + vec3(0.0, 0.33, 0.67) + tempo * 0.04));',
  '  gl_FragColor = vec4(cor, 1.0);',
  '}'
]);

// ---------- 2. HOLOGRAMA ----------
const VS_HOLO = juntar([
  'uniform float tempo;',
  'uniform float glitch;',
  'varying vec3 vN;',
  'varying vec3 vV;',
  'varying float vY;',
  'void main() {',
  '  vec3 p = position;',
  '  // glitch: de vez em quando uma faixa horizontal desliza para o lado',
  '  float faixa = floor(p.y * 12.0 + tempo * 6.0);',
  '  float sorteio = fract(sin(faixa * 91.7 + floor(tempo * 8.0)) * 43758.5);',
  '  p.x += step(0.96, sorteio) * glitch * 0.35;',
  '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
  '  vN = normalize(normalMatrix * normal);',
  '  vV = -mv.xyz;                         // vetor até a câmera',
  '  vY = (modelMatrix * vec4(p, 1.0)).y;  // altura no mundo',
  '  gl_Position = projectionMatrix * mv;',
  '}'
]);
const FS_HOLO = juntar([
  'uniform float tempo;',
  'uniform float linhas;',
  'uniform vec3 cor;',
  'varying vec3 vN;',
  'varying vec3 vV;',
  'varying float vY;',
  'void main() {',
  '  vec3 N = normalize(vN);',
  '  vec3 V = normalize(vV);',
  '  float fresnel = pow(1.0 - abs(dot(N, V)), 2.0);        // borda brilha mais',
  '  float listras = 0.5 + 0.5 * sin(vY * linhas - tempo * 3.0);  // sobem com o tempo',
  '  float tremor = 0.9 + 0.1 * sin(tempo * 60.0);',
  '  float alfa = (0.12 + fresnel * 0.9) * (0.55 + 0.45 * listras) * tremor;',
  '  gl_FragColor = vec4(cor * (0.6 + fresnel * 1.2), alfa);',
  '}'
]);

// ---------- 3. DISSOLVE ----------
const VS_DISS = juntar([
  'varying vec3 vP;',
  'varying vec3 vN;',
  'void main() {',
  '  vP = position;',
  '  vN = normalize(normalMatrix * normal);',
  '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
  '}'
]);
const FS_DISS = juntar([
  'varying vec3 vP;',
  'varying vec3 vN;',
  'uniform float limiar;',
  'uniform float escala;',
  'uniform vec3 cor;',
  RUIDO,
  'void main() {',
  '  float n = fbm(vP * escala) / 0.9375;   // ruído de 0 a 1 em cada ponto do objeto',
  '  float d = n - limiar;',
  '  if (d < 0.0) discard;                  // abaixo do limiar: o pixel desaparece',
  '  vec3 N = normalize(vN);',
  '  if (!gl_FrontFacing) N = -N;',
  '  float luz = 0.35 + 0.65 * max(dot(N, normalize(vec3(0.4, 0.7, 0.6))), 0.0);',
  '  vec3 corFinal = gl_FrontFacing ? cor * luz : vec3(0.22, 0.06, 0.02);   // dentro: carvão',
  '  // faixa logo acima do limiar vira brasa',
  '  float brasa = (1.0 - smoothstep(0.0, 0.08, d)) * smoothstep(0.0, 0.04, limiar);',
  '  gl_FragColor = vec4(mix(corFinal, vec3(1.0, 0.35, 0.05) * 1.7, brasa), 1.0);',
  '}'
]);

// ---------- 4. TOON ----------
const VS_TOON = juntar([
  'varying vec3 vNW;',
  'varying vec3 vVW;',
  'void main() {',
  '  vec4 wp = modelMatrix * vec4(position, 1.0);',
  '  vNW = (modelMatrix * vec4(normal, 0.0)).xyz;   // normal no mundo',
  '  vVW = cameraPosition - wp.xyz;                 // até a câmera',
  '  gl_Position = projectionMatrix * viewMatrix * wp;',
  '}'
]);
const FS_TOON = juntar([
  'uniform vec3 cor;',
  'uniform vec3 luz;',
  'uniform float niveis;',
  'varying vec3 vNW;',
  'varying vec3 vVW;',
  'void main() {',
  '  vec3 N = normalize(vNW);',
  '  vec3 L = normalize(luz);',
  '  vec3 V = normalize(vVW);',
  '  float d = max(dot(N, L), 0.0);                 // luz suave, de 0 a 1',
  '  float degrau = ceil(d * niveis) / niveis;      // cortada em degraus',
  '  vec3 H = normalize(L + V);',
  '  float brilho = step(0.5, pow(max(dot(N, H), 0.0), 48.0));   // reflexo duro',
  '  float borda = step(0.78, 1.0 - max(dot(N, V), 0.0)) * step(0.05, d);',
  '  vec3 c = cor * (0.3 + 0.7 * degrau) + vec3(brilho * 0.55) + cor * borda * 0.25;',
  '  gl_FragColor = vec4(c, 1.0);',
  '}'
]);

// ---------- 5. CONTORNO (casco invertido) ----------
const VS_OUT = juntar([
  'uniform float espessura;',
  'uniform float aspecto;',
  'void main() {',
  '  vec4 pos = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
  '  vec3 n = normalize(normalMatrix * normal);',
  '  vec2 d = (projectionMatrix * vec4(n, 0.0)).xy;          // normal projetada na tela',
  '  vec2 dir = d / max(length(d), 0.0001);',
  '  dir.x /= aspecto;                                        // mesma espessura em x e y',
  '  pos.xy += dir * espessura * pos.w;                       // empurra para fora, em pixels de tela',
  '  gl_Position = pos;',
  '}'
]);
const FS_OUT = juntar([
  'uniform vec3 cor;',
  'void main() { gl_FragColor = vec4(cor, 1.0); }'
]);

// ---------- cena base ----------
camera.position.set(0, 0.6, 5.4);
const controls = new THREE.OrbitControls(camera, renderer.domElement);

function ajustaVista() {                         // empurra a imagem para cima, fora do painel de baixo

const atualizaAspecto = () => { UASP.value = renderer.domElement.clientWidth / Math.max(1, renderer.domElement.clientHeight); };
addEventListener('resize', () => { ajustaVista(); atualizaAspecto(); });

const matShader = (vs, fs, uniforms, extra) =>
  new THREE.ShaderMaterial(Object.assign({ uniforms: uniforms, vertexShader: vs, fragmentShader: fs }, extra || {}));
const novoGrupo = () => { const g = new THREE.Group(); g.visible = false; scene.add(g); return g; };

const slides = [];

// ===== 1. Plasma =====
{

{

{

{

const $tabs = document.createElement('div'); $tabs.id = 'tabs';

let atual = 0, mostrandoCodigo = false;
function textoCodigo(s) {
  return '// ===== VERTEX SHADER (roda uma vez por vértice) =====' + NL + s.vs + NL + NL +
         '// ===== FRAGMENT SHADER (roda uma vez por pixel) =====' + NL + s.fs;
}
function montaControles(s) {
  $ctl.innerHTML = '';
  s.sliders.forEach((d) => {

    inp.mostra = () => { sp.textContent = d.n + ' ' + (+inp.value).toFixed(d.passo < 0.01 ? 3 : (d.passo < 1 ? 2 : 0)); };
    inp.oninput = () => { d.v = +inp.value; inp.mostra(); d.fn(d.v); };
    inp.mostra();
    l.appendChild(sp); l.appendChild(inp); $ctl.appendChild(l);
    if (d.ref) d.ref(inp);
  });
  (s.botoes || []).forEach((d) => {
    const b = document.createElement('button');

    b.onclick = () => d.fn(b);

    if (d.ref) d.ref(b);

  const bc = document.createElement('button');

function ir(n) {
  atual = (n + slides.length) % slides.length;
  const s = slides[atual];
  slides.forEach((x, i) => { x.g.visible = i === atual; abas[i].className = i === atual ? 'on' : ''; });
  scene.background = new THREE.Color(s.bg);
  $desc.textContent = s.desc;

  montaControles(s);
  $cod.textContent = textoCodigo(s);

bAnt.onclick = () => ir(atual - 1);
bProx.onclick = () => ir(atual + 1);
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') ir(atual - 1);
  else if (e.key === 'ArrowRight') ir(atual + 1);
  else { const n = parseInt(e.key, 10); if (n >= 1 && n <= slides.length) ir(n - 1); }
});
ir(0);

const relogio = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(relogio.getDelta(), 0.05);
  slides[atual].upd(dt);
