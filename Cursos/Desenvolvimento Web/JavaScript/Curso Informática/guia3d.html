<p><b>De número a ilha.</b> O ruído sozinho gera terreno em toda parte. Para virar ilha somamos uma <b>máscara circular</b> (<code>1 − d²</code>, alta no centro e zero na borda): o centro sempre fica acima do mar e a borda sempre submersa. O nível do mar (<code>MAR</code>) separa terra e água; acima dele a altura sobe rápido (montanhas) e abaixo desce devagar (fundo do mar). Para desenhar, o <code>PlaneGeometry(W, W, SEG, SEG)</code> é <b>deitado</b> com <code>rotateX</code>, e um laço passa por <b>todos os vértices</b>: lê <code>getX</code> e <code>getZ</code>, chama <code>altura</code> e grava com <code>setY</code>. Depois vêm <code>needsUpdate</code> e <code>computeVertexNormals()</code> (para a luz reagir ao novo relevo). Cada vértice também ganha uma <b>cor pela altura</b> (areia, grama, rocha, neve) guardada num atributo <code>color</code>, ligado por <code>vertexColors: true</code>. Aperte <b>T</b> para ver a malha deformada.</p>
<p><b>Vida na ilha.</b> As árvores usam o <code>InstancedMesh</code> do capítulo 37: sorteamos pontos e só plantamos onde a altura está na faixa de grama e um <b>segundo ruído</b> (em escala diferente) cai em "mancha de floresta". O jogador usa a <b>mesma</b> <code>altura(x, z)</code> para colocar os pés no chão, sem <code>Raycaster</code>, e a água funda bloqueia o caminho: se o passo é barrado, ele tenta deslizar por um eixo só. Como a malha tem resolução finita (cada quadradinho tem cerca de 1 unidade), os pés podem ficar um pouco acima ou abaixo da superfície desenhada.</p>
<div class="note"><b>Controles:</b> <b>clique no preview</b> para dar foco. <b>WASD</b> ou setas andam em relação à câmera; <b>arraste</b> o mouse para girar e use a <b>roda</b> para aproximar. <b>N</b> gera uma ilha nova e <b>T</b> liga e desliga a malha.</div>
<div class="note tip"><b>Desafios:</b> (1) mude <code>FREQ</code> (0.02 e 0.08), <code>OITAVAS</code> (1 e 8) e o 16 da <code>altura</code> e veja o que cada um faz com o relevo; (2) um segundo ruído de <b>umidade</b> para criar biomas: areia seca num lado e grama no outro; (3) <b>tesouros</b>: sorteie 5 pontos de areia e faça o jogador coletá-los; (4) ondas na água, deslocando os vértices de um plano de água com <code>Math.sin</code>; (5) um mundo <b>infinito</b>: gere blocos de terreno em volta do jogador à medida que ele anda, usando as coordenadas do mundo no ruído para que as bordas dos blocos combinem.</div>`,
 code:`// ===== Ilha procedural: ruído de valor, PlaneGeometry deformada e árvores instanciadas =====
camera.far = 300;
camera.updateProjectionMatrix();
scene.background = new THREE.Color(0x9fd3f0);
scene.fog = new THREE.Fog(0x9fd3f0, 60, 170);
scene.add(new THREE.HemisphereLight(0xffffff, 0x4a6b3a, 1.0));
const sol = new THREE.DirectionalLight(0xfff1d0, 1.1);
sol.position.set(40, 60, 20);
scene.add(sol);

// ---- RUÍDO DE VALOR: um número fixo para cada ponto da grade, suavizado entre os pontos
let semente = 7;                                       // trocar a semente troca a ilha inteira
const hash = (ix, iz) => {                             // mesma entrada, mesmo resultado: um "sorteio" repetível entre 0 e 1
  let h = Math.imul(ix, 374761393) ^ Math.imul(iz, 668265263) ^ Math.imul(semente, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
const suaviza = (t) => t * t * (3 - 2 * t);            // curva em S: tira as "quinas" da interpolação
function ruido(x, z) {                                 // interpola os 4 cantos da célula onde (x, z) cai
  const ix = Math.floor(x), iz = Math.floor(z), fx = suaviza(x - ix), fz = suaviza(z - iz);
  const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);
  return a + (b - a) * fx + (c - a) * fz + (a - b - c + d) * fx * fz;
}
const OITAVAS = 5;
function fbm(x, z) {                                   // soma de camadas: cada uma com o dobro da frequência e metade da força
  let soma = 0, amp = 0.5, freq = 1, total = 0;
  for (let o = 0; o < OITAVAS; o++) {
    soma += ruido(x * freq, z * freq) * amp;
    total += amp;
    amp *= 0.5;
    freq *= 2;
  }
  return soma / total;                                 // de volta para a faixa 0..1
}

// ---- A FUNÇÃO DE ALTURA: tudo no mundo nasce dela
const W = 120, SEG = 120, RAIO = 50, FREQ = 0.04, MAR = 0.45;
function altura(x, z) {
  const d = Math.min(1, Math.hypot(x, z) / RAIO);      // 0 no centro, 1 na borda
  const e = fbm(x * FREQ, z * FREQ) * 0.55 + (1 - d * d) * 0.6;   // ruído + máscara circular = ilha
  return e > MAR ? (e - MAR) * 16 : (e - MAR) * 8;     // acima do mar sobe rápido; o fundo desce devagar
}

// ---- o terreno: um PlaneGeometry deitado, com cada vértice levantado por altura(x, z)
const geo = new THREE.PlaneGeometry(W, W, SEG, SEG);
geo.rotateX(-Math.PI / 2);                             // deita o plano: agora y é a altura
const pos = geo.attributes.position;
geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(pos.count * 3), 3));
const terreno = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true }));
scene.add(terreno);

const agua = new THREE.Mesh(new THREE.PlaneGeometry(W * 1.6, W * 1.6).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x2a7fba, transparent: true, opacity: 0.78, roughness: 0.25 }));
scene.add(agua);

const cor = new THREE.Color();
function pintar(h, i) {                                // cor de cada vértice pela altura: areia, grama, rocha, neve
  if (h < 0.35) cor.setHex(h < -0.2 ? 0x9a8a5c : 0xe3d39a);
  else if (h < 4.5) cor.setHex(0x4f9a46).offsetHSL(0, 0, (hash(i, 99) - 0.5) * 0.08);
  else if (h < 7.5) cor.setHex(0x80807c);
  else cor.setHex(0xf3f6f8);
  geo.attributes.color.setXYZ(i, cor.r, cor.g, cor.b);
}

// ---- árvores: InstancedMesh (capítulo 37), só na faixa de grama e em manchas de floresta
const MAXARV = 4000;
const geoTronco = new THREE.CylinderGeometry(0.12, 0.18, 1, 6).translate(0, 0.5, 0);
const geoCopa = new THREE.ConeGeometry(0.7, 1.8, 8).translate(0, 1.7, 0);
const troncos = new THREE.InstancedMesh(geoTronco, new THREE.MeshStandardMaterial({ color: 0x6b4423, flatShading: true }), MAXARV);
const copas = new THREE.InstancedMesh(geoCopa, new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true }), MAXARV);
troncos.frustumCulled = copas.frustumCulled = false;
scene.add(troncos, copas);
const dummy = new THREE.Object3D();
let est = 1, nArv = 0;
const sorteio = () => (est = (est * 16807) % 2147483647) / 2147483647;

function plantar() {
  let n = 0;
  for (let t = 0; t < 20000 && n < MAXARV; t++) {
    const x = (sorteio() - 0.5) * W * 0.9, z = (sorteio() - 0.5) * W * 0.9;
    const h = altura(x, z);
    if (h < 0.5 || h > 4.5) continue;                  // só na grama
    if (ruido(x * 0.08 + 50, z * 0.08 + 50) < 0.5) continue;   // outro ruído: manchas de floresta
    dummy.position.set(x, h - 0.1, z);
    dummy.rotation.set(0, sorteio() * 6.28, 0);
    dummy.scale.setScalar(0.8 + sorteio() * 0.8);
    dummy.updateMatrix();
    troncos.setMatrixAt(n, dummy.matrix);
    copas.setMatrixAt(n, dummy.matrix);
    copas.setColorAt(n, cor.setHSL(0.27 + sorteio() * 0.08, 0.5, 0.25 + sorteio() * 0.12));
    n++;
  }
  troncos.count = copas.count = nArv = n;
  troncos.instanceMatrix.needsUpdate = copas.instanceMatrix.needsUpdate = true;
  if (copas.instanceColor) copas.instanceColor.needsUpdate = true;
}

function gerar() {                                     // (re)constrói a ilha a partir da semente
  est = semente * 7919 + 13;
  for (let i = 0; i < pos.count; i++) {
    const h = altura(pos.getX(i), pos.getZ(i));
    pos.setY(i, h);
    pintar(h, i);
  }
  pos.needsUpdate = true;
  geo.attributes.color.needsUpdate = true;
  geo.computeVertexNormals();
  plantar();
}

// ---- o jogador pisa no chão usando a MESMA função altura(x, z): sem Raycaster
const jogador = new THREE.Group();
const corpo = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.35, 0.9, 10), new THREE.MeshStandardMaterial({ color: 0xff7b00 }));
corpo.position.y = 0.45;
const cabeca = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 10), new THREE.MeshStandardMaterial({ color: 0xffd7a8 }));
cabeca.position.y = 1.15;
jogador.add(corpo, cabeca);
scene.add(jogador);

const ctl = new THREE.OrbitControls(camera, renderer.domElement);
ctl.enablePan = false;
ctl.minDistance = 4;
ctl.maxDistance = 40;
ctl.maxPolarAngle = Math.PI / 2.05;                    // não deixa a câmera descer abaixo do chão

function colocar() {                                   // jogador no centro da ilha (sempre terra) e câmera atrás
  const h = altura(0, 0);
  jogador.position.set(0, h, 0);
  camera.position.set(0, h + 9, 14);
  ctl.target.set(0, h + 1.2, 0);
}
gerar();
colocar();

const teclas = {};
addEventListener('keydown', (e) => {
  teclas[e.code] = true;
  if (e.code === 'KeyN') { semente++; gerar(); colocar(); }          // nova ilha
  if (e.code === 'KeyT') terreno.material.wireframe = !terreno.material.wireframe;   // mostra a malha
});
addEventListener('keyup', (e) => (teclas[e.code] = false));
const tecla = (...cs) => cs.some((c) => teclas[c]);

const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:10px;left:0;right:0;text-align:center;color:#fff;font:700 18px/1.5 system-ui;text-shadow:0 2px 8px #000;pointer-events:none';
document.body.appendChild(hud);

const frente = new THREE.Vector3(), lado = new THREE.Vector3(), mov = new THREE.Vector3(), delta = new THREE.Vector3();
const livre = (x, z) => altura(x, z) > -0.4;           // terra ou água rasa: a água funda bloqueia
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 30), tempo = clock.elapsedTime;

  camera.getWorldDirection(frente);                    // "frente" = para onde a câmera olha, no chão
  frente.y = 0;
  frente.normalize();
  lado.set(-frente.z, 0, frente.x);
  const f = (tecla('KeyW', 'ArrowUp') ? 1 : 0) - (tecla('KeyS', 'ArrowDown') ? 1 : 0);
  const l = (tecla('KeyD', 'ArrowRight') ? 1 : 0) - (tecla('KeyA', 'ArrowLeft') ? 1 : 0);
  mov.copy(frente).multiplyScalar(f).addScaledVector(lado, l);
  const p = jogador.position;
  if (mov.lengthSq() > 0) {
    mov.normalize().multiplyScalar(6 * dt);
    const nx = p.x + mov.x, nz = p.z + mov.z;
    if (livre(nx, nz)) { p.x = nx; p.z = nz; }         // tenta andar; se bloqueado, desliza por um eixo
    else if (livre(nx, p.z)) p.x = nx;
    else if (livre(p.x, nz)) p.z = nz;
    jogador.rotation.y = Math.atan2(mov.x, mov.z);
  }
  p.y = altura(p.x, p.z);                              // os pés seguem o terreno
  delta.set(p.x, p.y + 1.2, p.z).sub(ctl.target);      // a câmera acompanha o jogador sem perder o giro do mouse
  camera.position.add(delta);
  ctl.target.add(delta);

  agua.position.y = Math.sin(tempo * 1.2) * 0.06;
  ctl.update();
  hud.innerHTML = 'ILHA ' + semente + ' · ' + nArv + ' árvores · altura aqui: ' + p.y.toFixed(1) +
    '<br><span style="font-size:14px;font-weight:400">WASD anda · arraste gira · N nova ilha · T mostra a malha</span>';
  renderer.render(scene, camera);
});`},
{t:"Mundo infinito por chunks",
 lead:"Um simulador de voo cartoon sobre um mundo sem fim: o terreno e as nuvens nascem e somem ao redor do avião.",
 txt:`<p>Um mundo <b>infinito</b> não cabe numa malha só: ela teria vértices sem fim. A saída é cortar o mundo em quadrados iguais, os <b>chunks</b> (pedaços), e manter vivos apenas os que estão perto do avião. Quem voa <b>cria</b> chunks na frente e <b>descarta</b> os de trás. O mundo é infinito, mas a memória usada é sempre a mesma: nesta demo, uns 80 chunks.</p>
 <p><b>O mundo não é guardado, é recalculado.</b> A peça-chave é a função <code>altura(x, z)</code>: ela é <b>global</b> (vale para qualquer ponto) e <b>pura</b> (a mesma entrada dá sempre a mesma saída, graças ao ruído com <code>hash</code> e semente). Por isso um chunk pode ser destruído e, ao voltar, renascer <b>idêntico</b>. As árvores e as nuvens seguem a mesma regra: o sorteio de cada chunk é semeado por <code>hash(cx, cz)</code>. Sem <code>Math.random()</code> nada some nem muda de lugar.</p>
 <p><b>Sem rachaduras.</b> Os vértices usam <b>coordenadas do mundo</b> (<code>geo.translate</code> antes de chamar <code>altura</code>), então a borda dos dois chunks vizinhos cai nos mesmos pontos e nas mesmas alturas. Já o <code>computeVertexNormals()</code> deixaria uma costura na luz, porque o vértice da borda só enxerga os triângulos do <b>seu</b> chunk. Por isso a normal vem da <b>inclinação</b>: comparamos a altura dos dois lados do vértice (<code>altura(x - e, z) - altura(x + e, z)</code>, e o mesmo em Z). Aperte <b>T</b> e <b>C</b> para ver a malha e os chunks alternando de cor.</p>
 <p><b>O gerente de chunks.</b> O chunk do avião é <code>Math.floor(x / CH)</code>. A cada quadro o gerente descarta os que ficaram fora do raio, lista os que faltam dentro de <code>VIS</code> e cria os mais próximos primeiro, mas <b>só <code>ORCAMENTO</code> por quadro</b>: criar dezenas de uma vez travaria a imagem. A <b>histerese</b> (criar dentro de <code>VIS</code>, descartar além de <code>VIS + 1</code>) evita que um chunk na fronteira nasça e morra a cada passo. Voando rápido, o raio de visão é maior, e a <b>névoa</b> (da cor do céu) esconde o instante em que os chunks aparecem.</p>
 <p><b>O voo em três ângulos.</b> Em vez de quaternions, o avião guarda <code>rumo</code> (giro em Y), <code>arfagem</code> (nariz, eixo X) e <code>rolagem</code> (asas, eixo Z), e <code>rotation.set(arfagem, rumo, -rolagem, 'YXZ')</code> monta a orientação: primeiro rola, depois inclina, por fim gira. Três regras fazem o resto: a <b>asa inclinada faz a curva</b> (<code>rumo -= sin(rolagem) * k * dt</code>); <b>mergulhar acelera</b> e subir cansa (<code>vel -= frente.y * 30 * dt</code>); e o <b>chão é a mesma função</b> <code>altura</code>, então roçar no terreno só levanta o nariz e gasta velocidade. A câmera de perseguição usa <code>lerp</code> com <code>1 - Math.exp(-6 * dt)</code>, uma suavização que não depende da taxa de quadros, e o <code>fov</code> sobe com a velocidade para dar sensação de pressa.</p>
 <p><b>Sete câmeras, uma ideia.</b> Toda vista responde a duas perguntas: <b>onde</b> a câmera fica (<code>alvoRel</code>, um deslocamento em relação ao avião) e <b>para onde</b> ela olha (<code>alvoOlhar</code>). Só isso muda de uma vista para outra. <b>Perseguição</b> e <b>Frontal</b> usam <code>qCam</code> (rumo mais um pouco de arfagem, sem a rolagem), então a imagem não balança quando o avião rola. A <b>Cabine</b> faz o oposto: copia <code>aviao.quaternion</code>, e o horizonte inclina junto com as asas (o avião é escondido, porque por dentro só se veria o contorno preto do casco invertido). A <b>Lateral</b> gira só com o <code>rumo</code>, por isso o avião passa de perfil. A <b>Órbita</b> usa <code>setFromSphericalCoords</code> com ângulos que crescem sozinhos, ou que você muda arrastando o mouse. A <b>Aérea</b> olha para baixo e põe a frente do avião em <code>camera.up</code>, como um mapa que gira (sem isso o <code>lookAt</code> não sabe qual lado é o "alto" da tela). A <b>Torre</b> não anda: fica parada no mundo, só gira para seguir o avião, e quando ele se afasta demais ela "pula" para um ponto à frente da rota, como numa transmissão de TV.</p>
 <p><b>Atraso ou câmera presa.</b> A perseguição suaviza a posição <i>absoluta</i> da câmera com <code>lerp</code>, então ela fica um pouco para trás nas curvas e nas acelerações: isso dá peso ao voo. Nas outras vistas esse atraso atrapalharia (o avião sairia do centro da tela), então elas suavizam só o <b>deslocamento</b> (<code>relCam</code>): a câmera troca de lugar com suavidade, mas o avião fica sempre no mesmo ponto da imagem. Cada vista também tem o seu <code>fov</code>: a cabine abre mais (78°) e a torre fecha (40°, como uma teleobjetiva).</p>
 <p><b>Visual cartoon e nuvens.</b> O <code>MeshToonMaterial</code> com <code>gradientMap</code> de 3 pixels divide a luz em <b>faixas</b>, e o contorno preto vem do <i>casco invertido</i> (<code>ol</code>): uma cópia maior com <code>BackSide</code> em cada peça do avião. O terreno usa cores chapadas e saturadas, copas redondas e um céu que combina com a <code>Fog</code>. Cada chunk sorteia, com 70% de chance, uma <b>nuvem</b>: de 5 a 9 esferas achatadas numa única <code>InstancedMesh</code>. O sol é uma esfera com <code>fog: false</code>, presa à câmera, para a névoa não apagá-lo.</p>
 <p><b>Memória e a armadilha do material.</b> Remover da cena não libera a GPU: cada chunk morto precisa de <code>dispose()</code> na geometria e nas <code>InstancedMesh</code>. Atenção: as copas dividem um material, e no r128 <b>todas</b> precisam ter <code>instanceColor</code>, mesmo sem árvores (por isso o <code>setColorAt(0, ...)</code>), senão o desenho falha. O próximo capítulo, <i>Planeta esférico</i>, leva a ideia de "altura por função" para uma esfera.</p>
 <div class="note"><b>Controles:</b> <b>clique no preview</b>; <b>W/S</b> (ou setas) inclinam o nariz para baixo/cima; <b>A/D</b> rolam e fazem a curva; <b>Shift</b> turbo; <b>Espaço</b> freia; <b>N</b> gera um mundo novo; <b>T</b> mostra a malha; <b>C</b> tinge chunks alternados; <b>V</b> troca a câmera (ou as teclas <b>1</b> a <b>7</b>: perseguição, cabine, frontal, lateral, órbita, aérea e torre); na Órbita, <b>arraste</b> o mouse para girar em volta do avião.</div>
 <div class="note tip"><b>Desafios:</b> (1) mude <code>VIS</code> (3 e 8) e observe chunks na memória e desempenho; (2) ponha <code>ORCAMENTO</code> em 30 e voe no turbo para ver o engasgo; (3) crie <b>anéis de checkpoint</b> sorteados por chunk e conte quantos você atravessa; (4) faça a <b>sombra da nuvem</b> no chão (um disco escuro sob cada aglomerado); (5) troque as cores por um <b>pôr do sol</b> (céu, névoa e luz alaranjados); (6) crie uma 8ª vista, a <b>câmera de ré</b> (atrás do avião, olhando para trás, como um retrovisor); (7) na Torre, sorteie o lado (esquerda ou direita) com <code>hash</code> para a rota variar; (8) deixe a troca de vista mais lenta mudando o <code>8</code> de <code>kseg</code> e veja a câmera "voar" até o novo lugar</div>
 `,
 code:`// ===== Simulador de voo cartoon sobre um mundo infinito feito de chunks =====
camera.far = 450;
camera.updateProjectionMatrix();
const CEU = 0xa9defa;
scene.background = new THREE.Color(CEU);
scene.add(new THREE.HemisphereLight(0xffffff, 0x6fae5a, 0.9));
const sol = new THREE.DirectionalLight(0xfff1d0, 1.0);
sol.position.set(50, 80, 30);
scene.add(sol);

// ---- PARÂMETROS DO MUNDO
const CH = 40;              // lado de um chunk, em unidades do mundo
const SEG = 20;             // quadradinhos por lado do chunk (mais = mais detalhe e mais custo)
const VIS = 5;              // raio de visão, em chunks (voando rápido, precisamos ver mais longe)
const ORCAMENTO = 2;        // no máximo 2 chunks criados por quadro: evita engasgos
const FREQ = 0.01, MAXARV = 40, MAXNUV = 10;
scene.fog = new THREE.Fog(CEU, VIS * CH * 0.4, VIS * CH * 0.95);   // névoa da cor do céu: o horizonte some suave

// ---- ESTILO CARTOON: luz em 3 faixas (gradientMap) e contorno preto (casco invertido)
const grad = new THREE.DataTexture(new Uint8Array([110, 190, 255]), 3, 1, THREE.LuminanceFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter;
grad.needsUpdate = true;
const toon = (c, emissiva) => new THREE.MeshToonMaterial({ color: c, gradientMap: grad, emissive: emissiva || 0 });
const contorno = new THREE.MeshBasicMaterial({ color: 0x1a1030, side: THREE.BackSide });
function ol(m, s) {                                    // cópia escura, um pouco maior, só com as "costas" visíveis
  const o = new THREE.Mesh(m.geometry, contorno);
  o.scale.setScalar(s || 1.06);
  m.add(o);
  return m;
}

// ---- RUÍDO (o mesmo do capítulo da ilha): sorteio suave e repetível
let semente = 7;                                       // trocar a semente troca o mundo inteiro
const hash = (ix, iz) => {
  let h = Math.imul(ix, 374761393) ^ Math.imul(iz, 668265263) ^ Math.imul(semente, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
const suaviza = (t) => t * t * (3 - 2 * t);
function ruido(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z), fx = suaviza(x - ix), fz = suaviza(z - iz);
  const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);
  return a + (b - a) * fx + (c - a) * fz + (a - b - c + d) * fx * fz;
}
function fbm(x, z) {                                   // 5 camadas de ruído, cada uma com o dobro da frequência
  let soma = 0, amp = 0.5, freq = 1, total = 0;
  for (let o = 0; o < 5; o++) { soma += ruido(x * freq, z * freq) * amp; total += amp; amp *= 0.5; freq *= 2; }
  return soma / total;
}

// ---- A FUNÇÃO DE ALTURA: global e PURA (mesma entrada, mesma saída). O mundo não é guardado em lugar nenhum
function altura(x, z) {
  const e = fbm(x * FREQ, z * FREQ);                   // sem máscara de ilha: o ruído não tem borda
  const pico = Math.max(0, e - 0.56);
  return (e - 0.46) * 60 + pico * pico * 700;          // mar abaixo de 0, montanhas altas nos picos
}
const cor = new THREE.Color();
function corDe(h, x, z) {                              // cores chapadas e saturadas, como num desenho animado
  if (h < 0.8) cor.setHex(h < -2 ? 0xe0c27a : 0xf6e3a1);
  else if (h < 16) cor.setHex(0x62c74a).offsetHSL(0, 0, (hash(Math.floor(x), Math.floor(z)) - 0.5) * 0.08);
  else if (h < 30) cor.setHex(0xa98f78);
  else cor.setHex(0xffffff);
}

// ---- CHUNKS: um Map guarda os que estão vivos, com a chave "cx,cz"
const chunks = new Map();
const matA = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: grad });
const matB = matA.clone();                             // dois materiais, em xadrez, só para ver os chunks (tecla C)
const geoTronco = new THREE.CylinderGeometry(0.18, 0.28, 1.2, 7).translate(0, 0.6, 0);
const geoCopa = new THREE.SphereGeometry(1.3, 9, 7).translate(0, 2.3, 0);      // copa redonda de desenho animado
const geoNuvem = new THREE.SphereGeometry(1, 10, 8);
const matTronco = toon(0x8a5a3c);
const matCopa = new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap: grad });
const matNuvem = toon(0xffffff, 0x5b6f94);             // o emissive azulado evita a barriga cinza escura
const normal = new THREE.Vector3(), dummy = new THREE.Object3D();

function criar(cx, cz) {
  const ox = cx * CH, oz = cz * CH;                    // canto do chunk, em coordenadas do MUNDO
  const geo = new THREE.PlaneGeometry(CH, CH, SEG, SEG).rotateX(-Math.PI / 2);
  geo.translate(ox + CH / 2, 0, oz + CH / 2);          // os vértices já nascem na posição final
  const pos = geo.attributes.position, nor = geo.attributes.normal;
  const cores = new Float32Array(pos.count * 3), e = CH / SEG;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), h = altura(x, z);
    pos.setY(i, h);
    // normal pela inclinação, olhando os DOIS lados do vértice: assim a borda entre chunks não aparece
    normal.set(altura(x - e, z) - altura(x + e, z), 2 * e, altura(x, z - e) - altura(x, z + e)).normalize();
    nor.setXYZ(i, normal.x, normal.y, normal.z);
    corDe(h, x, z);
    cores.set([cor.r, cor.g, cor.b], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(cores, 3));
  geo.computeBoundingSphere();
  const malha = new THREE.Mesh(geo, (cx + cz) & 1 ? matB : matA);

  // árvores: o sorteio é semeado pelas coordenadas do chunk, então ele renasce IGUAL quando você volta
  let est = Math.floor(hash(cx, cz) * 2147483646) + 1;
  const sorteio = () => (est = (est * 16807) % 2147483647) / 2147483647;
  const troncos = new THREE.InstancedMesh(geoTronco, matTronco, MAXARV);
  const copas = new THREE.InstancedMesh(geoCopa, matCopa, MAXARV);
  copas.setColorAt(0, cor.setHex(0xffffff));           // TODAS as copas que dividem o matCopa precisam de cor por instância,
                                                       // mesmo as de chunks sem árvore (senão o r128 dá erro ao desenhar)
  let n = 0;
  for (let t = 0; t < 120 && n < MAXARV; t++) {
    const x = ox + sorteio() * CH, z = oz + sorteio() * CH, h = altura(x, z);
    if (h < 1 || h > 15) continue;                     // só na faixa de grama
    if (ruido(x * 0.05 + 50, z * 0.05 + 50) < 0.5) continue;   // manchas de floresta
    dummy.position.set(x, h - 0.1, z);
    dummy.rotation.set(0, sorteio() * 6.28, 0);
    dummy.scale.setScalar(1.5 + sorteio() * 1.2);
    dummy.updateMatrix();
    troncos.setMatrixAt(n, dummy.matrix);
    copas.setMatrixAt(n, dummy.matrix);
    copas.setColorAt(n, cor.setHSL(0.28 + sorteio() * 0.07, 0.6, 0.38 + sorteio() * 0.1));
    n++;
  }
  troncos.count = copas.count = n;
  troncos.frustumCulled = copas.frustumCulled = false;   // a esfera de uma InstancedMesh fica na origem

  // nuvens: um aglomerado de esferas achatadas, também sorteado pelas coordenadas do chunk
  const nuvens = new THREE.InstancedMesh(geoNuvem, matNuvem, MAXNUV);
  let m = 0;
  if (sorteio() < 0.7) {                               // 70% dos chunks têm uma nuvem
    const nx = ox + CH * (0.25 + sorteio() * 0.5), nz = oz + CH * (0.25 + sorteio() * 0.5), ny = 60 + sorteio() * 30;
    m = 5 + Math.floor(sorteio() * 5);
    for (let i = 0; i < m; i++) {
      const r = 4 + sorteio() * 4;
      dummy.position.set(nx + (sorteio() - 0.5) * 18, ny + (sorteio() - 0.5) * 3, nz + (sorteio() - 0.5) * 10);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(r, r * 0.6, r);                  // achatadas: fundo reto, topo fofo
      dummy.updateMatrix();
      nuvens.setMatrixAt(i, dummy.matrix);
    }
  }
  nuvens.count = m;
  nuvens.frustumCulled = false;
  scene.add(malha, troncos, copas, nuvens);
  chunks.set(cx + ',' + cz, { cx, cz, geo, malha, troncos, copas, nuvens });
}

function descartar(c) {                                // sem isto a memória da GPU cresceria para sempre
  scene.remove(c.malha, c.troncos, c.copas, c.nuvens);
  c.geo.dispose();
  c.troncos.dispose();
  c.copas.dispose();
  c.nuvens.dispose();
}

let criados = 0;
function atualizar(px, pz) {                           // chamada todo quadro: o "gerente" de chunks
  const pcx = Math.floor(px / CH), pcz = Math.floor(pz / CH);
  for (const [k, c] of chunks) {                       // 1) descarta os que ficaram longe (VIS + 1: folga para não oscilar)
    const dx = c.cx - pcx, dz = c.cz - pcz;
    if (dx * dx + dz * dz > (VIS + 1) * (VIS + 1)) { descartar(c); chunks.delete(k); }
  }
  const fila = [];                                     // 2) lista o que falta dentro do raio de visão
  for (let dz = -VIS; dz <= VIS; dz++)
    for (let dx = -VIS; dx <= VIS; dx++)
      if (dx * dx + dz * dz <= VIS * VIS && !chunks.has((pcx + dx) + ',' + (pcz + dz)))
        fila.push({ cx: pcx + dx, cz: pcz + dz, d: dx * dx + dz * dz });
  fila.sort((a, b) => a.d - b.d);                      // os mais próximos primeiro
  criados = Math.min(ORCAMENTO, fila.length);
  for (let i = 0; i < criados; i++) criar(fila[i].cx, fila[i].cz);   // 3) cria só ORCAMENTO por quadro
}

// ---- água (acompanha o avião), sol e o avião cartoon
const agua = new THREE.Mesh(new THREE.PlaneGeometry(VIS * CH * 3, VIS * CH * 3).rotateX(-Math.PI / 2),
  new THREE.MeshToonMaterial({ color: 0x35b6ff, gradientMap: grad, transparent: true, opacity: 0.85 }));
scene.add(agua);
const discoSol = new THREE.Mesh(new THREE.SphereGeometry(28, 16, 12), new THREE.MeshBasicMaterial({ color: 0xfff3a0, fog: false }));
scene.add(discoSol);                                   // fog:false: a névoa não apaga o sol

const aviao = new THREE.Group();                       // o nariz aponta para -Z, como a câmera
const peca = (geo, c, x, y, z) => {
  const m = ol(new THREE.Mesh(geo, toon(c)));
  m.position.set(x, y, z);
  aviao.add(m);
  return m;
};
peca(new THREE.SphereGeometry(1, 14, 10).scale(0.6, 0.6, 1.7), 0xe63946, 0, 0, 0);     // corpo
peca(new THREE.SphereGeometry(0.42, 10, 8), 0x9be7ff, 0, 0.5, -0.3);                   // cabine
peca(new THREE.BoxGeometry(6.4, 0.14, 1.3), 0xfff0c9, 0, 0, -0.1);                     // asas
peca(new THREE.BoxGeometry(2.2, 0.12, 0.7), 0xfff0c9, 0, 0.05, 1.5);                   // estabilizador
peca(new THREE.BoxGeometry(0.12, 1.0, 0.9), 0xe63946, 0, 0.5, 1.5);                    // leme
peca(new THREE.SphereGeometry(0.22, 8, 6), 0x333344, 0, 0, -1.7);                      // cubo da hélice
const helice = peca(new THREE.BoxGeometry(2.4, 0.18, 0.06), 0x333344, 0, 0, -1.85);
scene.add(aviao);

// estado do voo: três ângulos (em vez de quaternions) deixam a conta simples e sem "cambalhota"
const V = { rumo: 0, arfagem: 0, rolagem: 0, vel: 55 };   // rumo = guinada (Y), arfagem = nariz (X), rolagem = asas (Z)
function colocar() {
  aviao.position.set(0, Math.max(altura(0, 0), 0) + 45, 0);
  V.rumo = V.arfagem = V.rolagem = 0;
  V.vel = 55;
  camera.position.set(0, aviao.position.y + 4, 12);
}
colocar();

// ---- VISTAS (câmeras): V passa para a próxima, ou 1 a 7 escolhe direto
const NOMES = ['Perseguição', 'Cabine', 'Frontal', 'Lateral', 'Órbita', 'Aérea', 'Torre'];
const FOV = [60, 78, 55, 48, 55, 60, 40];              // cada vista tem o seu campo de visão
const UP = new THREE.Vector3(0, 1, 0);
let vista = 0, orbAz = 0, orbEl = 0.35, arrastando = false, torreLonge = true;
function trocarVista(i) {
  vista = (i + NOMES.length) % NOMES.length;
  aviao.visible = vista !== 1;                         // na cabine escondemos o avião: por dentro só se veria o contorno preto
  torreLonge = true;                                   // a torre escolhe um posto novo
}
renderer.domElement.style.touchAction = 'none';
renderer.domElement.addEventListener('pointerdown', () => (arrastando = true));
addEventListener('pointerup', () => (arrastando = false));
addEventListener('pointermove', (e) => {               // arrastar só vale na Órbita
  if (!arrastando || vista !== 4) return;
  orbAz -= e.movementX * 0.008;
  orbEl = THREE.MathUtils.clamp(orbEl + e.movementY * 0.006, -0.1, 1.4);
});

const teclas = {};
addEventListener('keydown', (e) => {
  teclas[e.code] = true;
  if (e.code === 'KeyN') {                             // mundo novo: joga fora tudo e deixa o gerente recriar
    semente++;
    for (const c of chunks.values()) descartar(c);
    chunks.clear();
    colocar();
  }
  if (e.code === 'KeyV') trocarVista(vista + 1);       // próxima câmera
  if (/^Digit[1-7]$/.test(e.code)) trocarVista(+e.code[5] - 1);   // 1 a 7: escolhe a câmera
  if (e.code === 'KeyT') matA.wireframe = matB.wireframe = !matA.wireframe;           // mostra a malha
  if (e.code === 'KeyC') matB.color.setHex(matB.color.getHex() === 0xffffff ? 0xffa060 : 0xffffff);   // tinge chunks alternados
});
addEventListener('keyup', (e) => (teclas[e.code] = false));
const tecla = (...cs) => cs.some((c) => teclas[c]);

const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:10px;left:0;right:0;text-align:center;color:#fff;font:700 18px/1.5 system-ui;text-shadow:0 2px 8px #000;pointer-events:none';
document.body.appendChild(hud);

const frente = new THREE.Vector3(), alvoCam = new THREE.Vector3();
const alvoRel = new THREE.Vector3(), relCam = new THREE.Vector3(), alvoOlhar = new THREE.Vector3(), torrePos = new THREE.Vector3();
const qCam = new THREE.Quaternion(), eCam = new THREE.Euler(0, 0, 0, 'YXZ');
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  const sobe = (tecla('KeyS', 'ArrowDown') ? 1 : 0) - (tecla('KeyW', 'ArrowUp') ? 1 : 0);   // S puxa o nariz para cima
  const dir = (tecla('KeyD', 'ArrowRight') ? 1 : 0) - (tecla('KeyA', 'ArrowLeft') ? 1 : 0);

  // ---- o voo: três regras simples
  V.arfagem += sobe * 1.1 * dt;                        // segurar a tecla inclina o nariz; soltar nivela devagar
  V.arfagem = THREE.MathUtils.clamp(V.arfagem * (sobe ? 1 : 1 - 0.8 * dt), -1.0, 1.0);
  V.rolagem += (dir * 0.95 - V.rolagem) * Math.min(1, 3 * dt);    // a rolagem segue o comando com suavidade
  V.rumo -= Math.sin(V.rolagem) * 1.4 * dt;            // asa inclinada = curva (rolagem positiva curva à direita)
  aviao.rotation.set(V.arfagem, V.rumo, -V.rolagem, 'YXZ');        // ordem YXZ: primeiro rola, depois inclina, depois gira
  frente.set(0, 0, -1).applyQuaternion(aviao.quaternion);          // para onde o nariz aponta, no mundo
  const alvoVel = tecla('ShiftLeft', 'ShiftRight') ? 110 : tecla('Space') ? 25 : 55;
  V.vel += (alvoVel - V.vel) * Math.min(1, 1.2 * dt) - frente.y * 30 * dt;   // mergulhar acelera, subir cansa
  V.vel = THREE.MathUtils.clamp(V.vel, 20, 130);
  const p = aviao.position;
  p.addScaledVector(frente, V.vel * dt);
  const chao = Math.max(altura(p.x, p.z), 0) + 2.2;    // o chão vem da MESMA função altura (e o mar conta como chão)
  if (p.y < chao) { p.y = chao; V.arfagem = Math.max(V.arfagem, 0.12); V.vel *= 1 - 1.5 * dt; }   // roçou: levanta o nariz e perde velocidade
  helice.rotation.z += 40 * dt;

  // ---- CÂMERAS: cada vista só decide ONDE a câmera fica (alvoRel, em relação ao avião) e PARA ONDE olha (alvoOlhar)
  eCam.set(V.arfagem * 0.4, V.rumo, 0);                // giro da câmera: segue o rumo e um pouco da arfagem, mas NÃO a rolagem
  qCam.setFromEuler(eCam);
  camera.up.set(0, 1, 0);
  let atraso = false, direta = false;                  // atraso: a câmera arrasta atrás do avião; direta: copia a orientação do avião
  const kseg = 1 - Math.exp(-8 * dt);                  // suavização que não depende da taxa de quadros
  if (vista === 0) {                                   // 1 PERSEGUIÇÃO: atrás e acima, com atraso suave
    alvoRel.set(0, 3.2, 11).applyQuaternion(qCam);
    alvoOlhar.set(p.x + frente.x * 14, p.y + frente.y * 14 + 1, p.z + frente.z * 14);
    atraso = true;
  } else if (vista === 1) {                            // 2 CABINE: a câmera É o piloto: mesma posição e mesma orientação do avião
    alvoRel.set(0, 0.55, -0.5).applyQuaternion(aviao.quaternion);
    direta = true;
  } else if (vista === 2) {                            // 3 FRONTAL: na frente do avião, olhando para ele (vê a hélice girar)
    alvoRel.set(0, 1.6, -10).applyQuaternion(qCam);
    alvoOlhar.copy(p);
  } else if (vista === 3) {                            // 4 LATERAL: de lado, gira só com o rumo: o avião passa de perfil
    alvoRel.set(13, 1.5, 0).applyAxisAngle(UP, V.rumo);
    alvoOlhar.copy(p);
  } else if (vista === 4) {                            // 5 ÓRBITA: gira sozinha em volta do avião; arraste o mouse para controlar
    if (!arrastando) orbAz += 0.4 * dt;
    alvoRel.setFromSphericalCoords(15, Math.PI / 2 - orbEl, orbAz);
    alvoOlhar.copy(p);
  } else if (vista === 5) {                            // 6 AÉREA: de cima, com a frente do avião para o alto da tela (um mapa que gira)
    alvoRel.set(-frente.x * 8, 55, -frente.z * 8);
    alvoOlhar.copy(p);
    camera.up.set(frente.x, 0, frente.z);              // sem isto o lookAt para baixo não sabe qual lado é o "alto" da tela
  }

  if (vista === 6) {                                   // 7 TORRE: câmera PARADA no mundo, só gira para seguir o avião
    if (torreLonge || torrePos.distanceTo(p) > 120) {  // ele se afastou: novo posto, à frente da rota e um pouco de lado
      torrePos.set(p.x + frente.x * 70 - frente.z * 22, 0, p.z + frente.z * 70 + frente.x * 22);
      torrePos.y = Math.max(altura(torrePos.x, torrePos.z), 0) + 7;     // com os pés no chão (a mesma função altura)
      torreLonge = false;
    }
    camera.position.copy(torrePos);
    camera.lookAt(p);
    relCam.copy(camera.position).sub(p);
  } else {
    if (atraso) {                                      // com atraso: a posição ABSOLUTA corre atrás do alvo (sente-se a inércia)
      alvoCam.copy(p).add(alvoRel);
      camera.position.lerp(alvoCam, 1 - Math.exp(-6 * dt));
      relCam.copy(camera.position).sub(p);
    } else {                                           // sem atraso: suaviza só o DESLOCAMENTO, e o avião fica sempre no mesmo ponto da tela
      relCam.lerp(alvoRel, direta ? 1 : kseg);
      camera.position.copy(p).add(relCam);
    }
    if (direta) camera.quaternion.copy(aviao.quaternion);   // cabine: olha para onde o avião olha, inclusive inclinado
    else camera.lookAt(alvoOlhar);
  }
  const alvoFov = FOV[vista] + (V.vel - 55) * 0.12;    // mais rápido, campo de visão mais aberto: sensação de velocidade
  camera.fov += (alvoFov - camera.fov) * kseg;
  camera.updateProjectionMatrix();

  agua.position.set(p.x, 0, p.z);
  discoSol.position.copy(camera.position).addScaledVector(sol.position, 3.4);
  atualizar(p.x, p.z);
  hud.innerHTML = 'MUNDO ' + semente + ' · ' + Math.round(V.vel * 3.6) + ' km/h · ' + Math.round(p.y - Math.max(altura(p.x, p.z), 0)) + ' m de altura · ' +
    chunks.size + ' chunks · ' + criados + ' novos · câmera: ' + NOMES[vista] +
    '<br><span style="font-size:14px;font-weight:400">W/S inclina o nariz · A/D rola e curva · Shift turbo · Espaço freia · N mundo novo · T malha · C chunks · V câmera</span>';
  renderer.render(scene, camera);
});
`},
{t:"Planeta esférico",
 lead:"Em um planeta esférico o “em cima” não é o eixo Y: é a direção que sai do centro. Gravidade, pés e câmera precisam concordar com ela.",
 txt:`<p>Em Super Mario Galaxy você anda pelas laterais e de cabeça para baixo em volta de planetinhas, e o mundo nunca parece virar. O truque é que o jogo não usa o eixo <code>Y</code> como “em cima”. O <b>em cima</b> é recalculado a cada quadro: é a direção que <b>sai do centro</b> do planeta e passa pelos pés do jogador, e a gravidade aponta para o lado oposto. O capítulo inteiro gira em torno de um vetor: <code>up = (pos − centro).normalize()</code>.</p>
<p><b>Alinhar o jogador com <code>setFromUnitVectors</code>.</b> A orientação do jogador é um <code>Quaternion</code> <code>q</code>. O “cima” atual dele é <code>(0,1,0)</code> girado por <code>q</code>. Para endireitá-lo, <code>qAl.setFromUnitVectors(cimaAtual, up)</code> devolve a <b>menor rotação</b> que leva um vetor até o outro. Como é a menor, o jogador não gira em torno do próprio eixo e continua olhando para onde olhava. A composição é <code>qAlvo = qAl · q</code> (a rotação de alinhamento vem <b>depois</b>, no referencial do mundo) e usamos <code>q.slerp(qAlvo, …)</code>: andando, o ajuste de cada quadro é minúsculo; ao saltar de um planeta para o outro, o <code>up</code> muda de uma vez e o <code>slerp</code> faz o corpo girar com suavidade. Os ângulos de Euler (<code>rotation.x/y/z</code>) não servem aqui: quando o “cima” gira em todas as direções eles se atrapalham (<i>gimbal lock</i>).</p>
<p><b>Girar com A e D: a ordem importa.</b> Girar em torno do <b>próprio</b> cima é <code>q.multiply(giro)</code>: a rotação entra pela direita, no referencial do jogador. Alinhar com o mundo é o contrário, compor pela esquerda (<code>qAl · q</code>). Trocar a ordem é o erro clássico dos quaternions: o personagem passa a girar em torno do eixo errado.</p>
<p><b>Andar na superfície.</b> A frente do jogador é <code>(0,0,1)</code> girado por <code>q</code>, mas só vale o pedaço dela que é <b>tangente</b> à esfera: <code>fwd.projectOnPlane(up)</code> tira o componente na direção de <code>up</code>. Andar é somar <code>fwd · velocidade · dt</code> à posição. Como o passo é uma reta e a superfície é curva, o jogador sairia um pouquinho da esfera; por isso, no chão, a posição é <b>recolocada na superfície</b> a cada quadro: <code>centro + n · R</code>. É isso que o faz contornar o planeta inteiro sem nenhum <code>if</code> especial.</p>
<p><b>Gravidade, pulo e vários planetas.</b> Em cada quadro, o planeta que puxa é o de <b>superfície mais próxima</b> (<code>distância − R</code>). No ar, <code>vel −= up · G · dt</code>; no chão, a velocidade vem do teclado. O pulo é <code>vel += up · PULO</code>. Ao cair, quando <code>dist ≤ R</code> e a velocidade ainda aponta para dentro, o jogador pousa: removemos da velocidade o componente na direção da normal. Como a velocidade é um vetor 3D do mundo (e não um número “vertical”), dá para pular de um planeta e ser capturado pela gravidade do outro: vá até o lado do planeta que está virado para a lua e aperte <b>Espaço</b>.</p>
<p><b>A câmera.</b> Ela fica atrás e acima do jogador, só que “atrás” e “acima” usam o <code>up</code> e o <code>fwd</code> do próprio jogador, suavizados (<code>upCam</code>, <code>fwdCam</code>) como no capítulo <i>Câmeras de jogo</i>. A distância é um multiplicador <code>zoom</code> aplicado a esses dois afastamentos: multiplicar (e não somar) faz a roda do mouse dar o mesmo “passo” perto e longe. O detalhe novo é <code>camera.up.copy(upCam)</code> antes do <code>lookAt</code>: por padrão a câmera acha que o céu é <code>+Y</code>, e sem isso o horizonte ficaria torto ao dar a volta no planeta.</p>
<p><b>Árvores com a mesma ideia.</b> Cada árvore sorteia um ponto na esfera (a normal <code>n</code>), faz <code>setFromUnitVectors((0,1,0), n)</code> para ficar em pé e ganha um giro aleatório em torno de si mesma. As 60 árvores (sorteadas com uma distância mínima entre os troncos) viram duas <code>InstancedMesh</code> (tronco e copa), como no capítulo <i>InstancedMesh</i>; com <code>frustumCulled = false</code>, porque a esfera de corte de uma <code>InstancedMesh</code> não conhece a posição das instâncias.</p>
<p><b>Tronco no chão.</b> A malha é um poliedro: só os vértices tocam a esfera de raio <code>R</code>, e no meio de cada face a superfície fica um pouco mais baixa. Plantar a árvore em <code>R</code> fixo a deixava enterrada num ponto e flutuando em outro. A solução tem duas partes: (1) um <code>Raycaster</code> dispara um raio de fora para o centro, na direção <code>n</code>, e a árvore nasce <b>onde o raio acerta a malha</b> (<code>raioDaMalha</code>); (2) como a face é inclinada, um tronco de base plana ainda deixaria uma fresta do lado de baixo, então o cilindro desce 0.3 para dentro do planeta e a fresta fica escondida.</p>
<p><b>Colisão.</b> Cada árvore é um <b>círculo no plano tangente</b>. Pegamos o vetor da base da árvore até os pés do jogador e tiramos dele o componente na direção da normal da árvore; o que sobra é a distância no chão. Se for menor que <code>RAIO_COLISAO · s + RAIO_JOG</code>, empurramos o jogador para fora, na direção do tronco para ele. Como a velocidade não é tocada, o jogador <b>desliza</b> pelo tronco em vez de parar seco. Depois do empurrão, ele é recolocado na superfície, como no passo 6. A colisão só vale abaixo do topo da copa (<code>2.4 · s</code>), então um pulo alto passa por cima.</p>
<div class="note"><b>Controles:</b> <b>clique no preview</b> para dar foco. <b>A/D</b> (ou ←/→) giram, <b>W/S</b> andam, <b>Espaço</b> pula e <b>Q/E</b> (ou a <b>roda do mouse</b>) aproximam e afastam a câmera: afaste bastante para ver o planeta e a lua inteiros. <b>G</b> liga e desliga a seta vermelha, que mostra a direção da gravidade. Colete as 10 estrelas; as da lua pedem um pulo bem apontado.</div>
<div class="note"><b>Detalhes:</b> a malha do planeta é um poliedro (<code>IcosahedronGeometry</code> com <code>flatShading</code>), então a superfície visível fica alguns centímetros dentro da esfera matemática de raio <code>R</code>; os pés podem parecer afundar ou flutuar um pouco. Mais <code>detail</code>, menos diferença. Por isso a base de cada árvore é medida na malha com um <code>Raycaster</code>, e não em <code>R</code>. Os pés do jogador ainda seguem a esfera matemática, então podem ficar uns centímetros acima ou abaixo do chão desenhado.</div>
<div class="note tip"><b>Desafios:</b> (1) mude <code>G</code> (24 para 8) e <code>PULO</code> e veja a lua ficar fácil ou impossível de alcançar; (2) troque a regra “superfície mais próxima” por “gravidade só dentro de um alcance” e deixe o espaço vazio sem gravidade; (3) dê a cada planeta o seu <code>G</code> (uma lua com gravidade fraca e pulos longos); (4) troque o círculo da árvore por um <b>cone</b> (o raio diminui com a altura) e veja o jogador chegar mais perto do tronco; depois use o mesmo <code>raioDaMalha</code> para colocar os pés do jogador no chão desenhado; (5) faça a lua orbitar o planeta (o jogador no chão deve herdar o movimento dela); (6) faça o planeta girar em torno do próprio eixo levando o jogador junto; (7) troque o <code>slerp</code> por alinhamento instantâneo e observe o tranco ao trocar de planeta.</div>`,
 code:`// ===== Planeta esférico: gravidade que aponta para o centro =====
camera.far = 400;
camera.updateProjectionMatrix();
scene.background = new THREE.Color(0x070b1c);
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x2a2440, 0.9));
const sol = new THREE.DirectionalLight(0xfff1d0, 1.1);
sol.position.set(40, 60, 30);
scene.add(sol);

const EIXO_Y = new THREE.Vector3(0, 1, 0);
const suave = (taxa, dt) => 1 - Math.exp(-taxa * dt);   // fração do caminho a andar neste quadro (igual em qualquer FPS)
let semente = 7;
const sorteio = () => (semente = (semente * 16807) % 2147483647) / 2147483647;
function sorteioNormal() {                              // ponto aleatório na esfera de raio 1
  const v = new THREE.Vector3();
  do { v.set(sorteio() * 2 - 1, sorteio() * 2 - 1, sorteio() * 2 - 1); } while (v.lengthSq() > 1 || v.lengthSq() < 0.01);
  return v.normalize();
}

// ---- fundo de estrelas
const fundo = [];
for (let i = 0; i < 700; i++) fundo.push(sorteioNormal().multiplyScalar(150));
scene.add(new THREE.Points(new THREE.BufferGeometry().setFromPoints(fundo), new THREE.PointsMaterial({ color: 0xffffff, size: 0.9 })));

// ---- os planetas: centro c e raio R
const planetas = [
  { c: new THREE.Vector3(0, 0, 0), R: 10, cor: 0x4caf6a, det: 4 },
  { c: new THREE.Vector3(17, 9, 0), R: 3.5, cor: 0xe9c46a, det: 3 }
];
planetas.forEach((p) => {
  p.malha = new THREE.Mesh(new THREE.IcosahedronGeometry(p.R, p.det), new THREE.MeshStandardMaterial({ color: p.cor, flatShading: true }));
  p.malha.position.copy(p.c);
  scene.add(p.malha);
});
const dirLua = planetas[1].c.clone().normalize();       // de onde se pula para a lua

// ---- árvores: cada uma em pé sobre a normal da esfera (InstancedMesh)
const N_ARV = 60;
const DIST_ARV = 2.8;                                   // distância mínima entre dois troncos, medida no chão
const RAIO_COLISAO = 0.3;                               // raio do colisor da árvore (vezes a escala s)
const RAIO_JOG = 0.45;                                  // raio do corpo do jogador
const COS_ARV = Math.cos(DIST_ARV / planetas[0].R);     // dois troncos mais perto que isso são rejeitados
planetas.forEach((p) => p.malha.updateMatrixWorld(true));   // o Raycaster precisa da matriz já calculada

// a malha é um poliedro: entre os vértices ela fica abaixo da esfera de raio R. Por isso medimos
// a superfície de verdade: um raio de fora para dentro, na direção n, e a distância do centro até o acerto
const raycaster = new THREE.Raycaster();
const vR = new THREE.Vector3(), vD = new THREE.Vector3();
function raioDaMalha(p, n) {
  raycaster.set(vR.copy(n).multiplyScalar(p.R + 2).add(p.c), vD.copy(n).negate());
  const h = raycaster.intersectObject(p.malha)[0];
  return h ? h.point.distanceTo(p.c) : p.R;
}

// o tronco vai de -0.3 a 0.7: o pedaço enterrado esconde a folga que a face inclinada deixaria
const troncos = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.12, 0.177, 1, 6).translate(0, 0.2, 0), new THREE.MeshStandardMaterial({ color: 0x7a5230 }), N_ARV);
const copas = new THREE.InstancedMesh(new THREE.ConeGeometry(0.6, 1.6, 7).translate(0, 1.5, 0), new THREE.MeshStandardMaterial({ color: 0x1f7a4d, flatShading: true }), N_ARV);
troncos.frustumCulled = copas.frustumCulled = false;    // o corte da InstancedMesh ignora a posição das instâncias
const m4 = new THREE.Matrix4(), qa = new THREE.Quaternion(), qg = new THREE.Quaternion();
const pa = new THREE.Vector3(), esc = new THREE.Vector3();
const arvores = [];                                     // guarda n (normal), p (base do tronco) e s (escala) para a colisão
for (let tent = 0; arvores.length < N_ARV && tent < 5000; tent++) {
  const n = sorteioNormal();
  if (n.y > 0.95 || n.dot(dirLua) > 0.92) continue;     // deixa livres a largada e o ponto de pulo
  if (arvores.some((a) => a.n.dot(n) > COS_ARV)) continue;   // nada de árvores coladas umas nas outras
  const i = arvores.length;
  qa.setFromUnitVectors(EIXO_Y, n);                     // o cima da árvore passa a ser a normal
  qg.setFromAxisAngle(EIXO_Y, sorteio() * Math.PI * 2); // giro aleatório em torno do próprio eixo
  qa.multiply(qg);
  const s = 0.8 + sorteio() * 0.7;
  pa.copy(n).multiplyScalar(raioDaMalha(planetas[0], n)).add(planetas[0].c);   // base no chão que se vê
  m4.compose(pa, qa, esc.set(s, s, s));
  troncos.setMatrixAt(i, m4);
  copas.setMatrixAt(i, m4);
  arvores.push({ n, p: pa.clone(), s });
}
troncos.count = copas.count = arvores.length;
scene.add(troncos, copas);

// ---- estrelas para coletar: 7 no planeta e 3 na lua, todas alinhadas à normal
const geoEstrela = new THREE.OctahedronGeometry(0.4);
const matEstrela = new THREE.MeshStandardMaterial({ color: 0xffd23f, emissive: 0xaa7700 });
const estrelas = [];
function criaEstrela(p, n) {
  const g = new THREE.Group();
  g.position.copy(n).multiplyScalar(p.R + 1.3).add(p.c);
  g.quaternion.setFromUnitVectors(EIXO_Y, n);
  const m = new THREE.Mesh(geoEstrela, matEstrela);
  g.add(m);
  scene.add(g);
  estrelas.push({ g, m, vivo: true });
}
function normalLongeDasArvores() {                      // a estrela a 1.3 do chão ficaria dentro de uma copa
  let n, k = 0;
  do { n = sorteioNormal(); k++; } while (k < 200 && arvores.some((a) => a.n.dot(n) > 0.984));
  return n;
}
for (let i = 0; i < 7; i++) criaEstrela(planetas[0], normalLongeDasArvores());
for (let i = 0; i < 3; i++) criaEstrela(planetas[1], sorteioNormal());

// ---- o jogador (a origem fica nos pés; a frente é +Z)
const jog = new THREE.Group();
const corpo = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 12), new THREE.MeshStandardMaterial({ color: 0xff5a5f }));
corpo.position.y = 0.6;
corpo.scale.y = 1.15;
const matOlho = new THREE.MeshBasicMaterial({ color: 0x111111 });
const geoOlho = new THREE.SphereGeometry(0.08, 8, 8);
const olhoE = new THREE.Mesh(geoOlho, matOlho), olhoD = new THREE.Mesh(geoOlho, matOlho);
olhoE.position.set(0.17, 0.78, 0.4);
olhoD.position.set(-0.17, 0.78, 0.4);
const geoPe = new THREE.BoxGeometry(0.22, 0.12, 0.34);
const matPe = new THREE.MeshStandardMaterial({ color: 0x333a4a });
const peE = new THREE.Mesh(geoPe, matPe), peD = new THREE.Mesh(geoPe, matPe);
peE.position.set(0.2, 0.06, 0.1);
peD.position.set(-0.2, 0.06, 0.1);
jog.add(corpo, olhoE, olhoD, peE, peD);
scene.add(jog);

// ---- estado do jogador
const pos = new THREE.Vector3(0, 10, 0);               // posição dos pés, no topo do planeta
const vel = new THREE.Vector3();                       // velocidade 3D no mundo (não é só "vertical")
const q = new THREE.Quaternion();                      // orientação: o "cima" do jogador é q * (0, 1, 0)
const up = new THREE.Vector3(0, 1, 0), fwd = new THREE.Vector3(0, 0, 1);
const upCam = up.clone(), fwdCam = fwd.clone();
let atual = planetas[0], chao = true, pegas = 0;
const G = 24, PULO = 14, VEL = 6;
let zoomAlvo = 1, zoom = 1;                            // distância da câmera (1 = normal); a roda do mouse e Q/E mudam
const limitaZoom = (z) => Math.min(8, Math.max(0.4, z));
camera.position.set(0, 13.2, -7);

// ---- seta vermelha: a direção da gravidade (tecla G liga e desliga)
const seta = new THREE.ArrowHelper(new THREE.Vector3(0, -1, 0), new THREE.Vector3(), 2, 0xff3b3b, 0.5, 0.3);
scene.add(seta);

const teclas = {};
addEventListener('keydown', (e) => {
  teclas[e.code] = true;
  if (e.code === 'KeyG') seta.visible = !seta.visible;
});
addEventListener('keyup', (e) => (teclas[e.code] = false));
addEventListener('wheel', (e) => {                      // roda do mouse: multiplicar (e não somar) dá o mesmo passo perto e longe
  zoomAlvo = limitaZoom(zoomAlvo * Math.exp(e.deltaY * 0.001));
  e.preventDefault();
}, { passive: false });
const tecla = (...cs) => cs.some((c) => teclas[c]);

const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:10px;left:0;right:0;text-align:center;color:#fff;font:700 20px/1.5 system-ui;text-shadow:0 2px 8px #000;pointer-events:none';
document.body.appendChild(hud);

const qAlvo = new THREE.Quaternion(), qGiro = new THREE.Quaternion();
const v1 = new THREE.Vector3();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  const t = clock.elapsedTime;

  // 1) qual planeta puxa? o de superfície mais próxima. O "cima" é a normal da esfera
  let dm = Infinity;
  planetas.forEach((p) => {
    const d = pos.distanceTo(p.c) - p.R;
    if (d < dm) { dm = d; atual = p; }
  });
  up.copy(pos).sub(atual.c).normalize();

  // 2) alinha o jogador à normal: menor rotação do "cima" atual até o novo "cima"
  v1.copy(EIXO_Y).applyQuaternion(q);
  qAlvo.setFromUnitVectors(v1, up).multiply(q);         // qAlvo = alinhamento * q (vem DEPOIS, no mundo)
  q.slerp(qAlvo, suave(14, dt)).normalize();

  // 3) A e D giram em torno do próprio "cima" (multiply = no referencial do jogador)
  const giro = (tecla('KeyA', 'ArrowLeft') ? 1 : 0) - (tecla('KeyD', 'ArrowRight') ? 1 : 0);
  q.multiply(qGiro.setFromAxisAngle(EIXO_Y, giro * 2.8 * dt));

  // 4) a frente do jogador, só o pedaço tangente à esfera
  fwd.set(0, 0, 1).applyQuaternion(q).projectOnPlane(up).normalize();

  // 5) velocidade: no chão vem do teclado; no ar, gravidade em direção ao planeta
  const andar = (tecla('KeyW', 'ArrowUp') ? 1 : 0) - (tecla('KeyS', 'ArrowDown') ? 0.6 : 0);
  if (chao) {
    vel.copy(fwd).multiplyScalar(andar * VEL);
    if (tecla('Space')) { vel.addScaledVector(up, PULO); chao = false; }
  } else {
    vel.addScaledVector(up, -G * dt);
    vel.addScaledVector(fwd, andar * 8 * dt);           // um pouco de controle no ar
  }
  pos.addScaledVector(vel, dt);

  // 6) grudar na superfície (no chão) ou pousar (no ar)
  v1.copy(pos).sub(atual.c);
  const dist = v1.length();
  v1.divideScalar(dist);                                // n: a normal no ponto onde o jogador está
  if (chao) {
    pos.copy(atual.c).addScaledVector(v1, atual.R);     // o passo reto sai da esfera: volta para ela
  } else if (dist <= atual.R && vel.dot(v1) < 0) {
    pos.copy(atual.c).addScaledVector(v1, atual.R);
    vel.addScaledVector(v1, -vel.dot(v1));              // some a velocidade que entrava no chão
    chao = true;
  }
  // 6b) colisão com as árvores: um círculo no plano tangente de cada uma. Se o jogador entrou, empurramos
  // para fora na direção do centro da árvore; o resto do movimento continua, então ele desliza pelo tronco
  if (atual === planetas[0]) {
    const alt = pos.distanceTo(atual.c) - atual.R;      // altura dos pés; acima da copa não há o que bater
    for (const a of arvores) {
      if (alt > 2.4 * a.s) continue;
      vD.copy(pos).sub(a.p);
      vD.addScaledVector(a.n, -vD.dot(a.n));            // só o pedaço tangente à árvore (tira o componente da normal)
      const r = RAIO_COLISAO * a.s + RAIO_JOG, d2 = vD.lengthSq();
      if (d2 < r * r && d2 > 1e-8) pos.addScaledVector(vD, (r - Math.sqrt(d2)) / Math.sqrt(d2));
    }
    if (chao) pos.sub(atual.c).setLength(atual.R).add(atual.c);   // o empurrão sai um pouco da esfera: volta
  }
  jog.position.copy(pos);
  jog.quaternion.copy(q);

  // 7) a câmera: atrás e acima, usando o "cima" do jogador (suavizado)
  upCam.lerp(up, suave(5, dt)).normalize();
  fwdCam.lerp(fwd, suave(4, dt)).projectOnPlane(upCam).normalize();
  zoomAlvo = limitaZoom(zoomAlvo * Math.exp(((tecla('KeyE') ? 1 : 0) - (tecla('KeyQ') ? 1 : 0)) * 1.2 * dt));   // E afasta, Q aproxima
  zoom += (zoomAlvo - zoom) * suave(6, dt);
  v1.copy(pos).addScaledVector(upCam, 3.2 * zoom).addScaledVector(fwdCam, -7 * zoom);   // o zoom multiplica a distância
  camera.position.lerp(v1, suave(6, dt));
  camera.up.copy(upCam);                                // sem isto o horizonte fica torto ao contornar o planeta
  camera.lookAt(v1.copy(pos).addScaledVector(upCam, 1));

  // 8) estrelas: giram, flutuam e são coletadas por proximidade
  v1.copy(pos).addScaledVector(up, 0.6);
  estrelas.forEach((e, i) => {
    if (!e.vivo) return;
    e.m.rotation.y += dt * 2;
    e.m.position.y = Math.sin(t * 2 + i) * 0.12;
    if (v1.distanceTo(e.g.position) < 1.1) { e.vivo = false; scene.remove(e.g); pegas++; }
  });

  seta.position.copy(pos).addScaledVector(up, 2.8);
  seta.setDirection(v1.copy(up).negate());

  hud.innerHTML = '★ ' + pegas + ' / ' + estrelas.length + (pegas === estrelas.length ? ' · completo!' : '') +
    '<br><span style="font-size:15px;font-weight:400">' + (atual === planetas[0] ? 'planeta' : 'lua') +
    (chao ? ' · no chão' : ' · no ar') + ' · A/D giram · W/S andam · Espaço pula · Q/E ou roda: zoom · G seta</span>';
  renderer.render(scene, camera);
});`},
{t:"Gráficos de funções 3D",
 lead:"Uma função de duas variáveis vira relevo: a altura vira cor, e o gradiente mostra para onde a ladeira sobe mais rápido.",
 txt:`<p>Uma função <code>z = f(x, y)</code> recebe <b>dois</b> números e devolve <b>um</b>: a altura. O gráfico é uma <b>superfície</b>. Para desenhá-la, <b>amostramos</b> uma grade de pontos (x, y), calculamos <code>f</code> em cada um e levantamos o vértice até essa altura. Atenção aos eixos: na matemática o <code>z</code> é a altura, mas no Three.js a altura é o eixo <b>Y</b>. Por isso o ponto (x, y, z) da matemática vira <code>(x, z, −y)</code> na cena (o sinal de menos mantém a orientação dos eixos).</p>
<p><b>A malha.</b> Começamos com um <code>PlaneGeometry</code> dividido em 60×60 quadradinhos e o deitamos com <code>rotateX(−π/2)</code>, o que leva (x, y, 0) a (x, 0, −y). Depois, para cada vértice, lemos <code>x</code> e <code>y = −z</code>, calculamos <code>f(x, y)</code> e gravamos o resultado em <code>Y</code>. Como a forma mudou, chamamos <code>computeVertexNormals()</code> para a luz ficar certa.</p>
<p><b>Cor por altura.</b> Normalizamos a altura para <code>t = (z − zmin) / (zmax − zmin)</code>, um número entre 0 e 1, e usamos <code>t</code> para andar numa <b>rampa</b> de cores (azul → verde → amarelo → vermelho) com <code>Color.lerp</code>. A cor vai num atributo <code>color</code> <b>por vértice</b> (<code>vertexColors: true</code>) e a placa de vídeo interpola entre os vértices. A barra à direita mostra a rampa.</p>
<p><b>O gradiente.</b> <code>∇f = (∂f/∂x, ∂f/∂y)</code> é um vetor 2D que aponta para onde <code>f</code> <b>cresce mais rápido</b>; seu comprimento <code>|∇f|</code> diz o quanto a ladeira é íngreme. Em vez de derivar à mão, usamos a <b>diferença central</b>: <code>(f(x+h, y) − f(x−h, y)) / 2h</code>. Ela funciona para <b>qualquer</b> <code>f</code> que você escrever, e é a mesma ideia do "inclinar um pouquinho para cada lado" do cálculo.</p>
<p><b>Dois jeitos de desenhar o vetor.</b> No modo 1 (campo no plano) a seta fica numa camada horizontal acima do gráfico, deitada, apontando (∂f/∂x, ∂f/∂y) com comprimento proporcional a <code>|∇f|</code>. No modo 2 a seta fica <b>sobre a superfície</b> e aponta a direção de subida mais íngreme: andando 1 passo na direção horizontal <code>u = ∇f/|∇f|</code>, a altura sobe <code>|∇f|</code>, então o vetor é <code>(ux, uy, |∇f|)</code>. Para orientar cada seta usamos <code>Quaternion.setFromUnitVectors(CIMA, direção)</code>, que gira o eixo +Y até a direção desejada. As 144 setas são dois <code>InstancedMesh</code> (hastes e pontas): só duas chamadas de desenho.</p>
<p><b>Os eixos.</b> Ficam no canto da base: <b>x</b> (vermelho), <b>y</b> (verde) e <b>z</b> (azul), com marcas nos inteiros. As marcas são <code>Sprite</code> com texto desenhado num <code>canvas</code> (sempre viram de frente para a câmera). A marca do eixo z está na altura real <code>Y = z</code> da cena, então dá para ler a altura de qualquer ponto olhando de lado. A grade fica no <b>chão</b>, abaixo do gráfico.</p>
<div class="note"><b>O que observar:</b> as setas são sempre <b>perpendiculares às curvas de nível</b> (as faixas de mesma cor), apontam do azul para o vermelho e <b>somem</b> nos pontos críticos (topo, fundo e centro da sela), onde <code>∇f = 0</code>. A normal da superfície usa as mesmas derivadas: <code>(−∂f/∂x, −∂f/∂y, 1)</code>.</div>
<div class="note"><b>Controles:</b> <b>clique no preview</b> para dar foco. <b>1 a 5</b> trocam a função, <b>G</b> alterna as setas (campo no plano, sobre a superfície, nenhuma) e <b>W</b> liga a malha. <b>Clique na superfície</b> para colocar uma sonda amarela e ler <code>x</code>, <code>y</code>, <code>z</code>, as derivadas e a inclinação; <b>arraste</b> para girar a câmera.</div>
<div class="note tip"><b>Desafios:</b> (1) escreva a sua função na lista <code>FUNCOES</code>; (2) mude <code>N</code> (malha) e <code>M</code> (setas) e veja o custo e o detalhe; (3) uma <b>bolinha</b> que desce a ladeira: a cada quadro faça <code>p ← p − η·∇f</code> (gradiente descendente) e pare quando <code>|∇f|</code> for quase 0; (4) pinte a superfície por <code>|∇f|</code> (inclinação) em vez da altura; (5) exagere a altura multiplicando <code>z</code> por 2 (e ajuste o vetor do modo 2: <code>(ux, uy, 2·|∇f|)</code>); (6) desenhe as curvas de nível.</div>`,
 code:`// ===== Gráfico de função 3D: superfície z = f(x, y), cor por altura e vetores gradiente =====
scene.background = new THREE.Color(0x0b1020);
camera.position.set(6.5, 6, 8);
scene.add(new THREE.HemisphereLight(0xffffff, 0x223355, 1.0));
const sol = new THREE.DirectionalLight(0xffffff, 0.8);
sol.position.set(4, 8, 5);
scene.add(sol);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// ---- 1) AS FUNÇÕES: matemática (x, y) -> z. Acrescente as suas aqui!
const L = 3;                                   // o domínio é o quadrado [-L, L] x [-L, L]
const FUNCOES = [
  { nome: "paraboloide", txt: "z = (x² + y²)/3 − 1,5", f: (x, y) => (x * x + y * y) / 3 - 1.5 },
  { nome: "sela", txt: "z = (x² − y²)/3", f: (x, y) => (x * x - y * y) / 3 },
  { nome: "sombrero", txt: "z = 3·sen(2r)/(2r),  r = √(x²+y²)", f: (x, y) => { const r = 2 * Math.hypot(x, y) + 1e-9; return 3 * Math.sin(r) / r; } },
  { nome: "colinas", txt: "z = 1,5·sen(x)·cos(y)", f: (x, y) => 1.5 * Math.sin(x) * Math.cos(y) },
  { nome: "picos", txt: "dois picos (gaussianas) e um vale", f: (x, y) => 3 * Math.exp(-((x - 1.2) ** 2 + (y - 1) ** 2)) + 2.2 * Math.exp(-((x + 1.4) ** 2 + (y + 1.2) ** 2) / 1.2) - 1 },
];
let fi = 0, f = FUNCOES[0].f;

// ---- 2) O GRADIENTE por diferença central: funciona para qualquer f
const H = 0.001;
function grad(x, y) {
  return [(f(x + H, y) - f(x - H, y)) / (2 * H), (f(x, y + H) - f(x, y - H)) / (2 * H)];
}

// ---- 3) A SUPERFÍCIE: um plano deitado cujos vértices sobem até f(x, y)
const N = 60;
const geo = new THREE.PlaneGeometry(2 * L, 2 * L, N, N);
geo.rotateX(-Math.PI / 2);                     // (x, y, 0) vira (x, 0, -y): o y da matemática é o -z do Three.js
geo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count * 3), 3));
const surf = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
  vertexColors: true, side: THREE.DoubleSide, roughness: 0.6,
  polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,   // empurra a superfície um pouco para trás, para a malha não "brigar" com ela
}));
const fio = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true, transparent: true, opacity: 0.2 }));
fio.visible = false;
scene.add(surf, fio);

// ---- 4) COR POR ALTURA: t em [0, 1] anda numa rampa de cores
const RAMPA = [0x2b3cff, 0x00c2ff, 0x2ee07a, 0xffe14d, 0xff3d3d].map((c) => new THREE.Color(c));
function corDaAltura(t, out) {
  const k = Math.min(0.9999, Math.max(0, t)) * (RAMPA.length - 1), i = Math.floor(k);
  return out.copy(RAMPA[i]).lerp(RAMPA[i + 1], k - i);
}

// chão de referência (abaixo do gráfico), eixos, texto e barra de cores
const chao = new THREE.GridHelper(2 * L, 12, 0x8896c8, 0x445080);
scene.add(chao);
const eixos = new THREE.Group();
scene.add(eixos);
function rotulo(txt, cor, esc) {                // texto desenhado num canvas e mostrado num Sprite (sempre de frente para a câmera)
  const c = document.createElement("canvas");
  c.width = 128; c.height = 64;
  const g = c.getContext("2d");
  g.font = "bold 40px monospace"; g.fillStyle = cor; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(txt, 64, 32);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false }));
  sp.scale.set(esc, esc / 2, 1);
  sp.renderOrder = 10;
  return sp;
}
function montarEixos() {                        // eixos no canto da base, um pouco para fora do domínio; refeitos a cada função
  eixos.children.slice().forEach((o) => {
    eixos.remove(o);
    if (o.geometry) o.geometry.dispose();
    if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
  });
  const y0 = zmin - 0.4, D = L + 0.35, zTopo = Math.ceil(zmax) + 0.4;
  const linha = (a, b, cor) => eixos.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), new THREE.LineBasicMaterial({ color: cor })));
  const rot = (txt, cor, esc, x, y, z) => { const r = rotulo(txt, cor, esc); r.position.set(x, y, z); eixos.add(r); };
  linha(new THREE.Vector3(-D, y0, D), new THREE.Vector3(L + 0.7, y0, D), 0xff5566);        // eixo x (matemática) = X do Three.js
  linha(new THREE.Vector3(-D, y0, D), new THREE.Vector3(-D, y0, -L - 0.7), 0x55ff88);       // eixo y (matemática) = -Z do Three.js
  linha(new THREE.Vector3(-D, y0, D), new THREE.Vector3(-D, zTopo, D), 0x66aaff);           // eixo z (altura) = Y do Three.js
  for (let v = -L; v <= L; v++) {
    rot(String(v), "#ff9aa8", 0.7, v, y0, D + 0.4);                                         // marcas do x
    rot(String(v), "#9affb8", 0.7, -D - 0.4, y0, -v);                                       // marcas do y (z do Three.js = -y)
  }
  for (let v = Math.ceil(zmin); v <= Math.floor(zmax); v++) rot(String(v), "#9ccaff", 0.7, -D - 0.4, v, D);   // marcas do z = altura real
  rot("x", "#ff5566", 1.1, L + 1.1, y0, D);
  rot("y", "#55ff88", 1.1, -D, y0, -L - 1.1);
  rot("z", "#66aaff", 1.1, -D, zTopo + 0.35, D);
}
const hud = document.createElement("div");
hud.style.cssText = "position:fixed;left:8px;top:8px;padding:6px 9px;background:#0b1020cc;color:#e9e7ff;font:11px/1.5 monospace;border:1px solid #2a2358;border-radius:8px;pointer-events:none;white-space:pre";
document.body.appendChild(hud);
const leg = document.createElement("div");
leg.style.cssText = "position:fixed;right:8px;top:8px;height:42%;display:flex;gap:6px;color:#e9e7ff;font:11px monospace;pointer-events:none";
leg.innerHTML = '<div style="display:flex;flex-direction:column;justify-content:space-between;text-align:right"><span id="zmx"></span><span id="zmn"></span></div><div style="width:16px;border-radius:4px;background:linear-gradient(to top,' + RAMPA.map((c) => "#" + c.getHexString()).join(",") + ')"></div>';
document.body.appendChild(leg);

// ---- 5) AS SETAS: haste (cilindro) + ponta (cone), 144 de cada em só 2 InstancedMesh
const M = 12, PASSO = (2 * L) / M, NA = M * M;
const CIMA = new THREE.Vector3(0, 1, 0);
const hasteGeo = new THREE.CylinderGeometry(0.025, 0.025, 1, 6).translate(0, 0.5, 0);   // base na origem, aponta para +Y
const pontaGeo = new THREE.ConeGeometry(0.09, 0.26, 10).translate(0, -0.13, 0);         // a ponta do cone fica na origem
const matSeta = new THREE.MeshBasicMaterial({ color: 0xffffff });
const hastes = new THREE.InstancedMesh(hasteGeo, matSeta, NA);
const pontas = new THREE.InstancedMesh(pontaGeo, matSeta, NA);
hastes.frustumCulled = pontas.frustumCulled = false;
scene.add(hastes, pontas);
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _e = new THREE.Vector3();
const _b = new THREE.Vector3(), _d = new THREE.Vector3(), _n = new THREE.Vector3();
function poeSeta(k, base, dir, comp) {          // seta que sai de "base", aponta para "dir" (unitário) e mede "comp"
  _q.setFromUnitVectors(CIMA, dir);             // gira o +Y até a direção desejada
  const s = Math.min(1, comp / 0.5), cab = 0.26 * s;   // setas curtas ganham pontas menores
  _m.compose(base, _q, _s.set(1, Math.max(comp - cab, 0.001), 1));
  hastes.setMatrixAt(k, _m);
  _e.copy(dir).multiplyScalar(comp).add(base);
  _m.compose(_e, _q, _s.set(s, s, s));
  pontas.setMatrixAt(k, _m);
}

// ---- 6) A SONDA: um ponto clicado, com a seta de subida mais íngreme
const sonda = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
const setaSonda = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 1, 0xffff00, 0.3, 0.16);
sonda.visible = setaSonda.visible = false;
scene.add(sonda, setaSonda);
let alvo = null;                                // (x, y) da sonda

// ---- 7) ATUALIZAÇÃO: refaz tudo quando a função ou o modo muda
let modo = 1, zmin = 0, zmax = 1, altSetas = 1;               // modo: 0 = sem setas, 1 = campo no plano, 2 = sobre a superfície
function montarSuperficie() {
  const p = geo.attributes.position, c = geo.attributes.color, cor = new THREE.Color();
  zmin = Infinity; zmax = -Infinity;
  for (let i = 0; i < p.count; i++) {
    const z = f(p.getX(i), -p.getZ(i));          // x e y da matemática
    p.setY(i, z);                                // a altura vira o eixo Y do Three.js
    zmin = Math.min(zmin, z); zmax = Math.max(zmax, z);
  }
  for (let i = 0; i < p.count; i++) {
    corDaAltura((p.getY(i) - zmin) / (zmax - zmin), cor);
    c.setXYZ(i, cor.r, cor.g, cor.b);
  }
  p.needsUpdate = c.needsUpdate = true;
  geo.computeVertexNormals();
  geo.computeBoundingSphere();
  geo.computeBoundingBox();                      // o Raycaster precisa dos limites novos
  altSetas = zmax + 0.5;                          // camada das setas do modo 1, acima do gráfico
  chao.position.y = zmin - 0.4;
  montarEixos();
  document.getElementById("zmx").textContent = zmax.toFixed(1);
  document.getElementById("zmn").textContent = zmin.toFixed(1);
}
function atualizaSetas() {
  hastes.visible = pontas.visible = modo > 0;
  if (!modo) return;
  const g = [];
  let gmax = 1e-9;
  for (let k = 0; k < NA; k++) {                 // centro de cada célula da grade de setas
    const x = -L + PASSO * (0.5 + (k % M)), y = -L + PASSO * (0.5 + Math.floor(k / M));
    const [fx, fy] = grad(x, y), mag = Math.hypot(fx, fy);
    g.push([x, y, fx, fy, mag]);
    gmax = Math.max(gmax, mag);
  }
  g.forEach(([x, y, fx, fy, mag], k) => {
    if (mag < 1e-4) { _m.makeScale(0, 0, 0); hastes.setMatrixAt(k, _m); pontas.setMatrixAt(k, _m); return; }   // ponto crítico: sem seta
    if (modo === 1) {
      _d.set(fx / mag, 0, -fy / mag);            // (fx, fy) da matemática -> (fx, 0, -fy) no Three.js
      poeSeta(k, _b.set(x, altSetas, -y), _d, 0.15 + 0.4 * (mag / gmax));   // comprimento proporcional a |gradiente|
    } else {
      _d.set(fx / mag, mag, -fy / mag).normalize();   // tangente: (ux, uy, |gradiente|) na matemática
      _n.set(-fx, 1, fy).normalize();            // normal da superfície, para afastar a seta do chão
      poeSeta(k, _b.set(x, f(x, y), -y).addScaledVector(_n, 0.06), _d, 0.55);
    }
  });
  hastes.instanceMatrix.needsUpdate = pontas.instanceMatrix.needsUpdate = true;
}
function atualizaTexto() {
  let s = FUNCOES[fi].nome + ":  " + FUNCOES[fi].txt + "\\n[1-5] função  [G] setas: " + ["nenhuma", "campo no plano", "sobre a superfície"][modo] + "  [W] malha\\nclique na superfície para sondar";
  if (alvo) {
    const [x, y] = alvo, [fx, fy] = grad(x, y), mag = Math.hypot(fx, fy);
    sonda.position.set(x, f(x, y), -y);
    sonda.visible = true;
    setaSonda.visible = mag > 1e-4;
    if (mag > 1e-4) {
      setaSonda.position.copy(sonda.position);
      setaSonda.setDirection(_d.set(fx / mag, mag, -fy / mag).normalize());
      setaSonda.setLength(1.2, 0.35, 0.18);
    }
    s += "\\n\\nx = " + x.toFixed(2) + "   y = " + y.toFixed(2) + "\\nz = f(x, y) = " + f(x, y).toFixed(2) +
      "\\n∂f/∂x = " + fx.toFixed(2) + "   ∂f/∂y = " + fy.toFixed(2) +
      "\\n|∇f| = " + mag.toFixed(2) + "   inclinação = " + (Math.atan(mag) * 180 / Math.PI).toFixed(0) + "°";
  }
  hud.textContent = s;
}
function atualiza() { montarSuperficie(); atualizaSetas(); atualizaTexto(); }

// ---- 8) ENTRADA: teclas e clique (só conta se não foi um arrasto da câmera)
addEventListener("keydown", (e) => {
  const n = Number(e.key);
  if (n >= 1 && n <= FUNCOES.length) { fi = n - 1; f = FUNCOES[fi].f; atualiza(); }
  if (e.code === "KeyG") { modo = (modo + 1) % 3; atualizaSetas(); atualizaTexto(); }
  if (e.code === "KeyW") fio.visible = !fio.visible;
});
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener("pointerdown", (e) => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObject(surf)[0];
  if (hit) { alvo = [hit.point.x, -hit.point.z]; atualizaTexto(); }
});

atualiza();
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});`},
{t:"Visualização de dados 3D",
 lead:"Transformar uma tabela de números em formas que você pode girar, apontar e comparar: barras, dispersão, superfície, linhas, rosca e bolhas em 3D, todos interativos.",
 txt:`<p>Visualizar dados é <b>mapear números em atributos visuais</b>: o valor vira <b>altura</b>, a categoria vira <b>posição</b> e a intensidade vira <b>cor</b>. A regra é sempre a mesma: uma função que leva o <b>domínio</b> dos dados (ex.: 1 a 7 mil) ao <b>espaço da cena</b> (ex.: altura 0,7 a 4,9). Aqui há seis gráficos: <b>barras 3D</b> (região × mês × vendas), <b>dispersão 3D</b> (150 pontos em 3 grupos, com três medidas por ponto), <b>superfície 3D</b> (um relevo z = f(x, y)), <b>linhas 3D</b> (uma série por região ao longo dos meses), <b>rosca 3D</b> (a parte de cada região no total) e <b>bolhas 3D</b> (quatro medidas por ponto: x, y, z e um tamanho).</p>
 <p><b>Cor por valor.</b> Normalizamos o valor para <code>t</code> entre 0 e 1 e giramos o matiz HSL de azul (frio) a vermelho (quente). <b>Eixos e rótulos</b> são <code>Sprite</code> com texto desenhado num <code>canvas</code>, sempre de frente para a câmera. A <b>grade</b> no chão ajuda o olho a medir distâncias.</p>
 <p><b>Superfície.</b> Quando os dados são uma <b>função de duas variáveis</b>, o gráfico natural é um relevo. Criamos um <code>PlaneGeometry</code> de 40 × 40 divisões, deitamos com <code>rotateX</code> e, para cada vértice, trocamos o <code>y</code> por <code>f(x, z)</code>. A cor também é calculada por vértice (<code>vertexColors</code>), e <code>computeVertexNormals()</code> faz a luz enxergar as ondulações. Aqui <code>f</code> é uma soma de "sinos" (gaussianas): morros somam, vales subtraem. Ao passar o mouse, o raio devolve <code>hit.point</code> e calculamos <code>f</code> naquele ponto, então o valor mostrado vale para qualquer lugar da superfície, não só para os vértices.</p>
 <p><b>Linhas.</b> Cada série é uma <code>CatmullRomCurve3</code> (curva suave que passa pelos pontos) transformada em tubo com <code>TubeGeometry</code>. Uma <b>parede translúcida</b> montada à mão com <code>BufferGeometry</code> (dois triângulos por trecho) liga a linha ao chão e dá noção de área. As esferas marcam os dados reais, e passar o mouse no tubo mostra a média da série.</p>
 <p><b>Rosca.</b> Cada fatia é um <code>Shape</code> 2D com dois arcos (<code>absarc</code> por fora e por dentro) extrudado por <code>ExtrudeGeometry</code>. O ângulo é <b>proporcional ao valor</b>: <code>2π × parte / total</code>. No hover, a fatia ganha brilho e a dica mostra o valor e a porcentagem.</p>
 <p><b>Bolhas.</b> É a dispersão com uma <b>quarta medida</b> codificada duas vezes, em <b>tamanho</b> e em <b>cor</b>. Repetir o mesmo dado em dois atributos visuais ajuda a leitura, principalmente quando as bolhas se sobrepõem.</p>
 <p><b>Interação.</b> A cada movimento do mouse, um <code>Raycaster</code> dispara um raio da câmera até o ponteiro e devolve o primeiro objeto atingido. Esse objeto ganha brilho (<code>emissive</code>) e uma dica de texto aparece ao lado do cursor. O <code>OrbitControls</code> cuida de girar e dar zoom. A cena só é redesenhada quando algo muda (<code>sujo</code>), então a GPU descansa quando nada se move. Ao trocar de gráfico, <code>limpar()</code> chama <code>dispose()</code> para liberar a memória da placa de vídeo.</p>
 <div class="note"><b>Cuidado:</b> gráficos 3D podem enganar. A perspectiva faz barras do fundo parecerem menores e esconde as de trás, e um morro da superfície pode esconder o vale atrás dele: gire a cena. A <b>rosca</b> é a mais traiçoeira: em perspectiva, as fatias mais perto da câmera parecem maiores do que são. Use 3D quando houver de fato <b>três dimensões</b> de dados (dispersão, superfície, bolhas) ou quando girar a cena ajudar; para comparar poucos valores ou frações, um gráfico 2D costuma ser mais honesto.</div>
 <div class="note"><b>Controles:</b> <b>clique no preview</b> para dar foco. <b>1</b> barras, <b>2</b> dispersão, <b>3</b> superfície, <b>4</b> linhas, <b>5</b> rosca, <b>6</b> bolhas, <b>R</b> gera novos dados. Passe o mouse sobre uma barra, ponto, fatia ou sobre a superfície para ler o valor; arraste para girar e use a roda para o zoom.</div>
 <div class="note tip"><b>Desafios:</b> (1) troque <code>REGIOES</code>, <code>MESES</code> e <code>COR_REG</code> pelos seus dados; (2) mude <code>rampa</code> para uma escala de verde a amarelo; (3) no modo 3, troque <code>altura()</code> por uma onda, como <code>Math.sin(x) * Math.cos(z) + 2</code>; (4) acrescente uma tecla que ordene as barras pelo valor; (5) crie um modo 7 de <b>barras empilhadas</b>: cada região vira um andar na mesma coluna do mês; (6) na rosca, faça a altura de cada fatia depender de uma segunda medida.</div>`,
 code:`// ===== Visualizacao de dados 3D: seis tipos de grafico interativos =====
scene.background = new THREE.Color(0x0b1020);
camera.position.set(9, 8, 11);
scene.add(new THREE.HemisphereLight(0xffffff, 0x223355, 1.0));
const sol = new THREE.DirectionalLight(0xffffff, 0.8);
sol.position.set(5, 9, 6);
scene.add(sol);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 2, 0);
controls.addEventListener("change", () => { sujo = true; });
let sujo = true;                                 // so redesenha quando algo muda

// ---- 1) OS DADOS: aleatorios com semente (o resultado se repete)
let semente = 7;
const rnd = () => { semente = (semente * 16807) % 2147483647; return semente / 2147483647; };
const REGIOES = ["Norte", "Sul", "Leste", "Oeste", "Centro"];
const MESES = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun"];
const COR_REG = [0x22d3ee, 0xff4fd8, 0xfacc15, 0x4ade80, 0xfb923c];   // uma cor por regiao
const gerarBarras = () => REGIOES.map(() => MESES.map((m, j) => 1 + 4 * rnd() + 0.3 * j));   // vendas, em mil
function gerarPontos() {
  const centros = [[1.5, 1.5, 1.5], [4.5, 2, 4], [2, 4.5, 4.5]];
  const pts = [];
  centros.forEach((c, k) => {
    for (let n = 0; n < 50; n++) {
      pts.push({ g: k, p: c.map(v => v + (rnd() + rnd() + rnd() - 1.5) * 1.2) });   // nuvem ao redor do centro
    }
  });
  return pts;
}
function gerarBolhas() {                           // 45 pontos com 4 medidas: x, y, z e w (de 0 a 1)
  const b = [];
  for (let n = 0; n < 45; n++) b.push({ p: [0.5 + 5 * rnd(), 0.5 + 5 * rnd(), 0.5 + 5 * rnd()], w: rnd() });
  return b;
}
