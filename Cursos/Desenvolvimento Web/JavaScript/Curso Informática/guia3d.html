<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Three.js na Prática</title>
<link rel="icon" type="image/x-icon" href="images/pc.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#07051a;--pan:#0f0b2e;--fg:#e9e7ff;--mut:#a5a0d6;--cy:#22d3ee;--vi:#8b5cf6;--mg:#ff4fd8;--ln:#2a2358;--code:#1a1442;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 "Space Grotesk",system-ui,sans-serif;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 75% -10%,#3b1d8a99,transparent 55%),radial-gradient(circle at 0 100%,#0e7490448,transparent 45%)}
aside{position:fixed;inset:0 auto 0 0;width:325px;background:#0b0826e6;backdrop-filter:blur(8px);border-right:1px solid var(--ln);padding:20px 14px;overflow:auto;z-index:5;transition:transform .25s;perspective:700px}
.brand{display:flex;align-items:center;font:700 22px "Space Grotesk",sans-serif}.brand span{color:var(--cy)}
.cube{width:26px;height:26px;position:relative;transform-style:preserve-3d;animation:sp 7s linear infinite;margin:6px 20px 6px 8px}
.cube i{position:absolute;inset:0;border:2px solid var(--cy);background:#22d3ee22;box-shadow:0 0 8px var(--cy)}
.cube i:nth-child(1){transform:translateZ(13px)}.cube i:nth-child(2){transform:rotateY(90deg) translateZ(13px)}.cube i:nth-child(3){transform:rotateY(180deg) translateZ(13px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(13px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(13px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(13px)}
@keyframes sp{from{transform:rotateX(-25deg) rotateY(0)}to{transform:rotateX(-25deg) rotateY(360deg)}}
aside small{color:var(--mut);display:block;margin:12px 0 10px;font-size:13px}
.grp{font:700 11px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);margin:16px 0 6px 6px}
nav a{display:flex;gap:10px;padding:9px 12px;margin:3px 0;border-radius:8px;color:var(--mut);text-decoration:none;font-size:15px;cursor:pointer;border:1px solid transparent;}
nav a i{font:normal 12px "JetBrains Mono",monospace;color:var(--cy);padding-top:3px}
nav a:hover{background:var(--code);color:#fff;border-color:var(--ln)}
nav a.on{background:linear-gradient(90deg,var(--vi),var(--mg));color:#fff;box-shadow:0 0 16px #8b5cf688}nav a.on i{color:#fff}
nav a.ok::after{content:"✓";margin-left:auto;color:var(--cy)}
.meter{height:6px;background:var(--code);border-radius:3px;margin-top:16px}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--mg));border-radius:3px;transition:width .3s}
#menu{display:none;position:fixed;top:10px;left:10px;z-index:6;background:var(--vi);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:14px system-ui}
#menu:hover{cursor:pointer;}
main{margin-left:278px;padding:44px 32px 80px 90px;max-width:1200px}
.num{display:inline-block;margin-bottom:10px;font:700 96px/1 "Space Grotesk",sans-serif;color:transparent;background:linear-gradient(180deg,var(--cy),var(--mg));-webkit-background-clip:text;background-clip:text;filter:drop-shadow(4px 4px 0 #3b1d8a) drop-shadow(6px 6px 0 #1a1442);animation:fl 5s ease-in-out infinite alternate}
@keyframes fl{to{transform:perspective(500px) rotateY(14deg)}}
h1{font:700 38px/1.15 "Space Grotesk",sans-serif;margin:0 0 8px;text-shadow:0 0 24px #8b5cf6aa}
.lead{font-size:20px;color:var(--mut);margin-top:0}
code{background:var(--code);color:#f0abfc;padding:1px 6px;border-radius:4px;font:.86em "JetBrains Mono",ui-monospace,Consolas,monospace}
.note{background:#140f3a;border:1px solid var(--ln);border-left:4px solid var(--mg);padding:8px 16px;border-radius:8px;margin:16px 0}.note.tip{border-left-color:var(--cy)}
.lab{display:grid;grid-template-columns:1fr 1fr;margin:26px 0;border:1px solid var(--cy);border-radius:14px;overflow:hidden;background:var(--pan);}
.pane{min-width:0;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:#0a0720;color:var(--mut);font:12px "JetBrains Mono",monospace}.bar span{flex:1}
.bar::before{content:"";width:10px;height:10px;border-radius:50%;background:#ff5f57;box-shadow:16px 0 #febc2e,32px 0 #28c840;margin-right:44px}
.bar button{border:1px solid var(--ln);border-radius:6px;padding:6px 12px;font:600 13px system-ui;cursor:pointer;background:var(--code);color:var(--fg)}.bar button.run{background:linear-gradient(90deg,var(--cy),var(--vi));color:#07051a;border:0}
textarea{flex:1;width:100%;min-height:440px;border:0;outline:0;resize:vertical;background:#0b0826;color:#d9d4ff;font:13.5px/21px "JetBrains Mono",ui-monospace,Consolas,monospace;padding:12px 14px;tab-size:2;white-space:pre}
iframe{flex:1;width:100%;min-height:440px;border:0;background:#0b1020;display:block}
.err{background:#2a0f1c;color:#ff9aa8;font:13px "JetBrains Mono",monospace;padding:8px 12px;white-space:pre-wrap}.err:empty{display:none}
.pane.max{position:fixed;inset:0;z-index:1000;background:var(--pan)}
.pane.max iframe,.pane:fullscreen iframe{min-height:0}
.pane:fullscreen{background:var(--pan)}
body.maxlock{overflow:hidden}
#indexBtn{display:block;width:100%;margin-top:15px;padding:9px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--code);color:var(--fg);font:600 14px system-ui,sans-serif;cursor:pointer;}
#indexBtn:hover{border-color:var(--cy);color:var(--cy);}
.pg{display:flex;justify-content:space-between;margin-top:30px}
.pg button{border:1px solid var(--cy);color:var(--cy);background:transparent;padding:10px 18px;border-radius:8px;font:600 16px system-ui;cursor:pointer}.pg button:hover:not(:disabled){background:var(--cy);color:#07051a}.pg button:disabled{opacity:.3;cursor:not-allowed;}
@media(max-width:1200px){aside{transform:translateX(-100%)}aside.open{transform:none}#menu{display:block}main{margin:0;padding:56px 16px 60px}.lab{grid-template-columns:1fr}.num{font-size:64px}}
</style>
</head>
<body>
<button id="menu">☰ Capítulos</button>
<aside id="side"><div class="brand"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div>Three<span>.js</span></div><small>Guia interativo · edite e veja o resultado</small><nav id="nav"></nav><div class="meter"><i id="bar"></i></div><button id="indexBtn" onclick="window.location.href='/'">← Página Inicial</button></aside>
<main id="main"></main>
<script>
// ===== Capítulos =====
// full:true => o snippet monta renderer/scene/camera do zero. Senão, o "preâmbulo" cria os três para você.
const CAPS=[
{t:"Introdução",
 lead:"Antes do primeiro cubo, vale entender o que é, de verdade, um mundo 3D dentro do computador — e onde o Three.js entra nessa história.",
 txt:`<p>A tela do computador ou do celular é <b>plana</b>: uma grade de pixels. Mesmo assim, jogos e animações mostram profundidade, volume e sombras. O truque é que o programa guarda o mundo como <b>números</b> — posições <code>(x, y, z)</code> — e, cerca de 60 vezes por segundo, calcula como esse mundo seria visto por uma câmera e pinta o resultado, pixel a pixel. Isso é a <b>computação gráfica 3D</b>.</p>
 <p><b>Os blocos de construção.</b> Um <b>vértice</b> é um ponto no espaço. Três vértices formam um <b>triângulo</b>, a peça básica de quase tudo em 3D (um triângulo é sempre plano, o que o torna simples e rápido de desenhar). Um conjunto de triângulos é uma <b>malha</b> (<i>mesh</i>), que pode ser desde um cubo até um personagem com milhares de triângulos. Para ter aparência, a malha recebe um <b>material</b> (cor, brilho, textura) e, para ter volume, precisa de <b>luz</b>.</p>
 <p><b>Onde estamos no espaço.</b> O Three.js usa três eixos: <code>x</code> aponta para a direita, <code>y</code> para cima e <code>z</code> vem na sua direção (para fora da tela). Para lembrar: as cores dos eixos seguem <b>RGB = XYZ</b> (vermelho, verde, azul). Você os verá na cena abaixo.</p>
 <p><b>Do mundo 3D ao pixel.</b> A cada quadro, acontece mais ou menos isto: (1) os vértices são movidos, girados e escalados até o seu lugar no mundo; (2) a câmera <b>projeta</b> o mundo 3D numa imagem 2D — com perspectiva, o que está longe parece menor; (3) cada triângulo é <b>rasterizado</b>, isto é, vira um conjunto de pixels; (4) a cor de cada pixel é calculada a partir do material e das luzes. Quem faz esse trabalho pesado, em paralelo para milhões de pixels, é a <b>GPU</b> (a placa de vídeo).</p>
 <p><b>E o Three.js?</b> O navegador fala com a GPU por uma API chamada <b>WebGL</b>. Ela é poderosa, mas de baixo nível: para desenhar um único triângulo colorido você escreve dezenas de linhas, incluindo pequenos programas para a GPU (os <i>shaders</i>) e contas com matrizes. O <b>Three.js</b> é uma biblioteca JavaScript de código aberto, criada por Ricardo Cabello (mrdoob) em 2010, que esconde esse trabalho atrás de objetos prontos: <code>Scene</code>, <code>PerspectiveCamera</code>, <code>Mesh</code>, <code>Light</code>… Você descreve <i>o que</i> quer ver; ele cuida de <i>como</i> desenhar. Roda em qualquer navegador, sem instalar nada, no computador e no celular — por isso serve tanto para sites e visualizações quanto para jogos. Este guia usa a versão r128, carregada com uma simples tag <code>&lt;script&gt;</code>; em versões mais novas a importação muda (módulos <code>import</code>), mas os conceitos são os mesmos.</p>
 <p><b>A cena abaixo</b> mostra essas ideias num cubo. Os botões 1 a 4 revelam as camadas, uma de cada vez: só os vértices, os triângulos que os ligam, as faces preenchidas e, por fim, o material reagindo à luz. O círculo amarelo acompanha o vértice 0 e mostra a projeção em ação: as coordenadas 3D dele viram um <b>pixel</b> da tela (<code>vetor.project(camera)</code>). Aqui a preparação (renderer, cena e câmera) já vem pronta; no próximo capítulo você a monta do zero.</p>
 <div class="note tip"><b>Experimente:</b> arraste sobre a cena para girar. Troque <code>BoxGeometry(2, 2, 2)</code> por <code>SphereGeometry(1.3, 8, 6)</code> e veja os triângulos; depois aumente para <code>(1.3, 32, 16)</code> e note que a superfície só parece lisa porque ganhou muito mais triângulos.</div>
 <div class="note"><b>Por que 24 vértices num cubo?</b> Um cubo tem 8 cantos, mas o Three.js guarda 24 vértices: cada face leva os seus, porque cada uma precisa da própria orientação (normal) para a luz e das próprias coordenadas de textura. Já os 12 triângulos são simples: 6 faces × 2.</div>
 <div class="note"><b>Por que o cubo fica em y = 1.01?</b> Quando duas superfícies ocupam exatamente o mesmo lugar, a GPU não consegue decidir qual está na frente, e a imagem pisca (z-fighting). Uma pequena folga entre o cubo e o chão evita o problema.</div>`,
 code:`// Um objeto 3D é só uma lista de pontos (vértices) ligados em triângulos.
const geo = new THREE.BoxGeometry(2, 2, 2);
const pos = geo.attributes.position;                                  // posição (x, y, z) de cada vértice
const nVertices = pos.count;
const nTriangulos = (geo.index ? geo.index.count : pos.count) / 3;    // 3 vértices = 1 triângulo

// A MESMA geometria mostrada de dois jeitos: como pontos e como malha
const pontos = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x22d3ee, size: 0.16 }));
const malha = new THREE.Mesh(geo, new THREE.MeshBasicMaterial());
const objeto = new THREE.Group();
objeto.add(malha, pontos);
objeto.position.y = 1.01;              // o cubo tem altura 2: assim ele se apoia no chão (y = 0)
scene.add(objeto);

// Referências: um chão de grade e, sobre ele, os eixos X (vermelho), Y (verde) e Z (azul)
const chao = new THREE.GridHelper(10, 10, 0x6b7280, 0x2a3350);
const ESPESSURA = 0.03;      // raio do cilindro: aumente para engrossar
const COMPRIMENTO = 3;
const eixos = new THREE.Group();

[[1, 0, 0], [0, 1, 0], [0, 0, 1]].forEach((d, i) => {
  const cor = [[1, 0, 0], [0, 1, 0], [0.2, 0.45, 1]][i];   // X vermelho, Y verde, Z azul
  const g = new THREE.CylinderGeometry(ESPESSURA, ESPESSURA, COMPRIMENTO, 12);
  g.translate(0, COMPRIMENTO / 2, 0);                      // o cilindro passa a começar na origem
  const eixo = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: new THREE.Color(...cor) }));
  eixo.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),                            // o cilindro nasce apontando para Y
    new THREE.Vector3(...d)                                // e é girado para a direção do eixo
  );
  eixos.add(eixo);
});
chao.material.depthWrite = false;   // a grade é desenhada primeiro...
chao.renderOrder = -1;
eixos.children.forEach((e) => (e.renderOrder = 1));        // ...e os eixos ficam por cima, sem piscar
scene.add(chao, eixos);

// Luz (só os materiais "Standard" reagem a ela)
scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 0.9));
const sol = new THREE.DirectionalLight(0xffffff, 1.2);
sol.position.set(3, 5, 4);
scene.add(sol);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);       // a câmera olha para o centro do cubo

// As quatro etapas que vamos revelar
const etapas = [
  { nome: 'Vértices', pontos: true, material: null,
    texto: 'Pontos no espaço. Cada um é uma posição (x, y, z).' },
  { nome: 'Triângulos', pontos: true,
    material: new THREE.MeshBasicMaterial({ color: 0xff4fd8, wireframe: true }),
    texto: 'Ligando os pontos de três em três, formamos triângulos.' },
  { nome: 'Faces', pontos: false,
    material: new THREE.MeshBasicMaterial({ color: 0x8b5cf6 }),
    texto: 'Triângulos preenchidos. Sem luz, tudo fica chapado.' },
  { nome: 'Luz', pontos: false,
    material: new THREE.MeshStandardMaterial({ color: 0x8b5cf6, roughness: 0.35 }),
    texto: 'Material + luz: as faces ganham volume.' },
];

// --- Painel em HTML por cima da cena ---
function el(css, pai) {
  const d = document.createElement('div');
  d.style.cssText = css;
  (pai || document.body).appendChild(d);
  return d;
}
const painel = el('position:fixed;left:10px;top:10px;width:min(430px,calc(100% - 20px));box-sizing:border-box;padding:12px 14px;border-radius:10px;background:#0b0826d9;color:#e9e7ff;font:12.5px/1.45 system-ui,sans-serif');
const info = el('margin-bottom:8px', painel);
const botoes = el('display:flex;flex-wrap:wrap;gap:8px', painel);
const dados = el('margin-top:8px;font:11.5px/1.4 ui-monospace,Consolas,monospace;color:#a5a0d6', painel);
const linha1 = el('', dados);
const linha2 = el('', dados);
const alvo = el('position:fixed;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #facc15;border-radius:50%;pointer-events:none');

const p0 = new THREE.Vector3().fromBufferAttribute(pos, 0);   // vértice 0, em coordenadas do objeto
linha1.textContent = nVertices + ' vértices · ' + nTriangulos + ' triângulos';

etapas.forEach((e, i) => {
  const b = document.createElement('button');
  b.textContent = (i + 1) + '. ' + e.nome;
  b.style.cssText = 'flex:1 1 auto;white-space:nowrap;border:1px solid #2a2358;border-radius:6px;padding:6px 8px;color:#e9e7ff;font:600 12px system-ui;cursor:pointer';
  b.onclick = () => mostrar(i);
  botoes.appendChild(b);
});

function mostrar(i) {
  const e = etapas[i];
  pontos.visible = e.pontos;
  alvo.style.display = e.pontos ? 'block' : 'none';
  malha.visible = !!e.material;
  if (e.material) malha.material = e.material;
  info.innerHTML = '<b>' + e.nome + '</b><br>' + e.texto;
  [...botoes.children].forEach((b, j) => (b.style.background = j === i ? '#8b5cf6' : '#1a1442'));
}
mostrar(0);

// --- Laço de animação ---
const tela = new THREE.Vector3();
renderer.setAnimationLoop((t) => {
  objeto.rotation.y = t / 4000;
  controls.update();
  renderer.render(scene, camera);

  // Projeção: do mundo 3D para um pixel da tela
  tela.copy(p0).applyMatrix4(objeto.matrixWorld).project(camera);   // x e y ficam entre -1 e 1
  const px = (tela.x * 0.5 + 0.5) * innerWidth;
  const py = (0.5 - tela.y * 0.5) * innerHeight;
  alvo.style.left = px + 'px';
  alvo.style.top = py + 'px';
  linha2.textContent = 'vértice 0: (' + p0.x.toFixed(1) + ', ' + p0.y.toFixed(1) + ', ' + p0.z.toFixed(1) +
    ') → pixel (' + Math.round(px) + ', ' + Math.round(py) + ')';
});`},
{t:"Primeiros passos",full:true,
 lead:"Todo programa Three.js tem três ingredientes: uma <b>cena</b>, uma <b>câmera</b> e um <b>renderer</b>.",
 txt:`<p>A <code>Scene</code> guarda os objetos. A <code>Camera</code> define de onde olhamos. O <code>WebGLRenderer</code> desenha a cena vista pela câmera num <code>&lt;canvas&gt;</code>.</p>
 <p>Um objeto visível é uma <code>Mesh</code> = <b>geometria</b> (forma) + <b>material</b> (aparência). O loop <code>setAnimationLoop</code> redesenha ~60 vezes por segundo.</p>
 <div class="note tip"><b>Experimente:</b> troque <code>BoxGeometry</code> por <code>SphereGeometry(0.8)</code>, ou mude <code>camera.position.z</code> para 8.</div>`,
 code:`const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111827);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
camera.position.z = 4;

const cubo = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshNormalMaterial()
);
scene.add(cubo);

renderer.setAnimationLoop(() => {
  cubo.rotation.x += 0.01;
  cubo.rotation.y += 0.01;
  renderer.render(scene, camera);
});`},
{t:"Geometrias e materiais",
 lead:"A forma e a aparência de cada objeto são independentes — combine à vontade.",
 txt:`<p>A partir daqui o guia cria <code>renderer</code>, <code>scene</code> e <code>camera</code> automaticamente (o que você fez no capítulo 2). Foque no que é novo.</p>
 <p><code>MeshStandardMaterial</code> reage à luz (PBR): <code>roughness</code> controla o brilho e <code>metalness</code> o aspecto metálico. Sem luz na cena, ele fica preto.</p>
 <div class="note tip"><b>Experimente:</b> altere <code>roughness</code> para 0.05 e <code>metalness</code> para 0.9. Troque a lista de geometrias por <code>IcosahedronGeometry(0.6)</code>.</div>`,
 code:`const geos = [
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.SphereGeometry(0.6, 32, 16),
  new THREE.ConeGeometry(0.6, 1.2, 24),
  new THREE.TorusGeometry(0.5, 0.2, 16, 48),
];

const meshes = geos.map((g, i) => {
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(i / 4, 0.7, 0.55),
    roughness: 0.4,
    metalness: 0.2,
  });
  const m = new THREE.Mesh(g, mat);
  m.position.x = (i - 1.5) * 1.8 - (i === 0 ? 0.7 : 0);   // o cubo vermelho fica mais longe da esfera
  scene.add(m);
  return m;
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 1.2));
const sol = new THREE.DirectionalLight(0xffffff, 1.5);
sol.position.set(3, 5, 4);
scene.add(sol);

renderer.setAnimationLoop((t) => {
  meshes.forEach((m) => (m.rotation.y = t / 1000));
  renderer.render(scene, camera);
});`},
{t:"Luzes e sombras",
 lead:"Luz dá volume. Sombra dá chão.",
 txt:`<p>Sombras exigem três passos: ligar <code>renderer.shadowMap.enabled</code>, marcar a luz com <code>castShadow</code>, e marcar cada objeto como <code>castShadow</code> (projeta) e/ou <code>receiveShadow</code> (recebe).</p>
 <p>Tipos de luz: <code>AmbientLight</code> (uniforme), <code>DirectionalLight</code> (sol), <code>PointLight</code> (lâmpada), <code>SpotLight</code> (lanterna).</p>
 <div class="note tip"><b>Experimente:</b> troque <code>PointLight</code> por <code>SpotLight</code>, ou mude a cor da luz para <code>0xff8844</code>.</div>`,
 code:`renderer.shadowMap.enabled = true;

const chao = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 10),
  new THREE.MeshStandardMaterial({ color: 0x334155 })
);
chao.rotation.x = -Math.PI / 2;
chao.receiveShadow = true;
scene.add(chao);

const esfera = new THREE.Mesh(
  new THREE.SphereGeometry(0.7, 32, 16),
  new THREE.MeshStandardMaterial({ color: 0xf5c518 })
);
esfera.position.y = 1;
esfera.castShadow = true;
scene.add(esfera);

scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const luz = new THREE.PointLight(0xffffff, 1.2);
luz.castShadow = true;
scene.add(luz);

renderer.setAnimationLoop((t) => {
  luz.position.set(Math.sin(t / 800) * 4, 4, Math.cos(t / 800) * 4);
  renderer.render(scene, camera);
});`},
{t:"Animação com Clock",
 lead:"Movimento que não depende da velocidade do computador.",
 txt:`<p>Somar um valor fixo por frame faz a animação ser mais rápida em telas de 144 Hz. O correto é usar o <b>delta time</b>: o tempo entre dois frames, via <code>Clock.getDelta()</code>.</p>
 <p>Aqui a bola tem velocidade vertical <code>vy</code> e gravidade — um mini motor de física em 4 linhas.</p>
 <div class="note tip"><b>Experimente:</b> mude a gravidade de <code>9.8</code> para <code>3</code> (Lua!) e o impulso <code>6</code> para <code>10</code>.</div>`,
 code:`const clock = new THREE.Clock();

const bola = new THREE.Mesh(
  new THREE.SphereGeometry(0.5, 32, 16),
  new THREE.MeshStandardMaterial({ color: 0xd9482b })
);
scene.add(bola);
scene.add(new THREE.HemisphereLight(0xffffff, 0x222244, 1.3));
const sol = new THREE.DirectionalLight(0xffffff, 1);
sol.position.set(2, 4, 3);
scene.add(sol);

let vy = 0;
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  vy -= 9.8 * dt;            // gravidade
  bola.position.y += vy * dt;
  if (bola.position.y < 0) { // quicou no chão
    bola.position.y = 0;
    vy = 6;
  }
  renderer.render(scene, camera);
});`},
{t:"Câmera e OrbitControls",
 lead:"Deixe o usuário passear pela cena com o mouse ou o dedo.",
 txt:`<p><code>OrbitControls</code> permite girar (arrastar), dar zoom (scroll) e mover (botão direito). Chame <code>controls.update()</code> a cada frame quando usar <code>enableDamping</code>.</p>
 <p>O <code>fov</code> (campo de visão) funciona como a lente: valores pequenos "achatam" a perspectiva. Sempre chame <code>updateProjectionMatrix()</code> depois de alterar a câmera.</p>
 <div class="note tip"><b>Experimente:</b> coloque <code>camera.fov = 20</code> e afaste a câmera; depois tente <code>110</code>.</div>`,
 code:`const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

camera.fov = 60;
camera.updateProjectionMatrix();

const grade = new THREE.GridHelper(10, 10);
const eixos = new THREE.AxesHelper(2);
grade.material.depthWrite = false;   // a grade não escreve profundidade e é desenhada primeiro...
grade.renderOrder = -1;
eixos.renderOrder = 1;               // ...os eixos vêm depois e ficam por cima, sem piscar
scene.add(grade, eixos);

const caixa = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshNormalMaterial()
);
caixa.position.y = 0.5;
scene.add(caixa);

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});`},
{t:"Texturas",
 lead:"Pinte a superfície dos objetos — até com Canvas 2D.",
 txt:`<p>Uma <code>Texture</code> é uma imagem aplicada ao modelo via <code>material.map</code>. Em vez de carregar um arquivo, podemos <b>desenhar</b> num <code>&lt;canvas&gt;</code> e usar <code>CanvasTexture</code> — perfeito para quem já domina Canvas.</p>
 <div class="note tip"><b>Experimente:</b> desenhe um círculo com <code>g.arc()</code>, ou escreva texto com <code>g.fillText()</code>. Depois da mudança, o cubo já usa o novo desenho.</div>`,
 code:`const c = document.createElement('canvas');
c.width = c.height = 256;
const g = c.getContext('2d');
for (let y = 0; y < 8; y++) {
  for (let x = 0; x < 8; x++) {
    g.fillStyle = (x + y) % 2 ? '#f5c518' : '#1b1a17';
    g.fillRect(x * 32, y * 32, 32, 32);
  }
}

const tex = new THREE.CanvasTexture(c);
const cubo = new THREE.Mesh(
  new THREE.BoxGeometry(1.8, 1.8, 1.8),
  new THREE.MeshBasicMaterial({ map: tex })
);
scene.add(cubo);

renderer.setAnimationLoop((t) => {
  cubo.rotation.y = t / 1200;
  cubo.rotation.x = 0.4;
  renderer.render(scene, camera);
});`},
{t:"Interação com Raycaster",
 lead:"Como saber em qual objeto 3D o mouse está em cima?",
 txt:`<p>O <code>Raycaster</code> lança um "raio" da câmera através do ponto do mouse e informa quais objetos ele atravessa, do mais próximo ao mais distante. As coordenadas do mouse precisam estar normalizadas entre <b>-1 e 1</b>, com o eixo Y invertido.</p>
 <div class="note tip"><b>Experimente:</b> troque <code>pointermove</code> por <code>click</code> e faça o cubo clicado crescer (<code>scale.setScalar(1.5)</code>).</div>`,
 code:`const cubos = [];
for (let i = 0; i < 5; i++) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 0.8, 0.8),
    new THREE.MeshBasicMaterial({ color: 0x64748b })
  );
  m.position.x = (i - 2) * 1.2;
  scene.add(m);
  cubos.push(m);
}

const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('pointermove', (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(cubos)[0];
  cubos.forEach((c) =>
    c.material.color.set(hit && hit.object === c ? 0xf5c518 : 0x64748b)
  );
});

renderer.setAnimationLoop(() => renderer.render(scene, camera));`},
{t:"Grupos e hierarquia",
 lead:"Objetos dentro de objetos: o segredo dos sistemas planetários e dos personagens.",
 txt:`<p>Todo objeto pode ter filhos (<code>pai.add(filho)</code>). A posição e a rotação do filho são <b>relativas ao pai</b>. Girar o pai arrasta os filhos junto — é assim que a Lua orbita a Terra, que orbita o Sol.</p>
 <div class="note tip"><b>Experimente:</b> adicione Marte: outra esfera em <code>orbita2</code> com <code>position.x = 5</code> e velocidade diferente.</div>`,
 code:`const sol = new THREE.Mesh(
  new THREE.SphereGeometry(0.8, 32, 16),
  new THREE.MeshBasicMaterial({ color: 0xf5c518 })
);
scene.add(sol);

const orbita = new THREE.Group();   // pivô no centro
scene.add(orbita);

const terra = new THREE.Mesh(
  new THREE.SphereGeometry(0.3, 24, 12),
  new THREE.MeshBasicMaterial({ color: 0x4aa3e0 })
);
terra.position.x = 3;
orbita.add(terra);

const lua = new THREE.Mesh(
  new THREE.SphereGeometry(0.1, 16, 8),
  new THREE.MeshBasicMaterial({ color: 0xdddddd })
);
lua.position.x = 0.7;
terra.add(lua);                     // filha da Terra

scene.add(new THREE.GridHelper(10, 10, 0x334155, 0x1f2937));

renderer.setAnimationLoop((t) => {
  orbita.rotation.y = t / 2500;     // Terra orbita o Sol
  terra.rotation.y = t / 500;       // Lua orbita a Terra
  renderer.render(scene, camera);
});`},
{t:"Partículas com Points",
 lead:"Milhares de pontos na tela com um único objeto.",
 txt:`<p>Um <code>Points</code> desenha uma nuvem de pontos a partir de um <code>BufferGeometry</code>. Os dados ficam num <code>Float32Array</code> (x, y, z, x, y, z…), o que é muito rápido para a GPU. Serve para estrelas, chuva, faíscas e poeira.</p>
 <div class="note tip"><b>Experimente:</b> aumente <code>N</code> para 20000, ou troque o <code>size</code> para 0.15.</div>`,
 code:`const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.autoRotate = true;

const N = 3000;
const pos = new Float32Array(N * 3);
for (let i = 0; i < N * 3; i++) pos[i] = (Math.random() - 0.5) * 12;

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

const nuvem = new THREE.Points(
  geo,
  new THREE.PointsMaterial({ color: 0x7dd3fc, size: 0.06 })
);
scene.add(nuvem);

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});`},
{t:"Matemática para jogos 3D",
 lead:"Vetores, produto escalar e vetorial, matrizes, quaternions e interpolação, com laboratórios para arrastar e ver.",
 txt:`<p>Todo jogo 3D é feito de vetores: posição, velocidade, direção do olhar, normal de uma parede. Este capítulo é um laboratório com <b>seis abas</b>. Arraste as esferas coloridas e veja os números mudarem junto com a figura; arrastar o fundo gira a câmera.</p>
 <p><b>1 · Vetores.</b> <code>a.add(b)</code> soma, <code>a.sub(b)</code> subtrai, <code>length()</code> mede e <code>normalize()</code> deixa o comprimento em 1. A subtração dá a direção "daqui até o alvo": <code>alvo.clone().sub(pos).normalize().multiplyScalar(vel * dt)</code> é o movimento de qualquer perseguidor.</p>
 <p><b>2 · Produto escalar.</b> <code>a.dot(b)</code> vale <code>|a||b|·cos θ</code>. Com vetores unitários é só o cosseno: positivo = mesma direção, zero = perpendiculares, negativo = opostos. Serve para cone de visão, "está na minha frente?", iluminação (normal · luz) e a reflexão do Breakout, <code>v − 2(v·n)n</code>.</p>
 <p><b>3 · Produto vetorial.</b> <code>new THREE.Vector3().crossVectors(a, b)</code> gera um vetor perpendicular aos dois; seu comprimento é a área do paralelogramo. O sentido segue a regra da mão direita, então a ordem importa. Serve para normais de triângulos, eixos de giro e para descobrir se algo está à esquerda ou à direita. Cuidado: <code>a.cross(b)</code> altera o próprio <code>a</code>.</p>
 <p><b>4 · Matrizes.</b> Uma <code>Matrix4</code> junta translação, rotação e escala. As <b>colunas</b> mostram para onde vão os eixos X, Y, Z e a origem. <code>A.multiply(B)</code> calcula A·B, e a ordem muda o resultado: é por isso que a <code>Mesh</code> aplica escala, depois rotação, depois posição (T·R·S) quando monta <code>object.matrix</code>.</p>
 <p><b>5 · Quaternions.</b> Guardam uma rotação como <code>(n·sen(θ/2), cos(θ/2))</code>. Não sofrem gimbal lock, compõem com <code>q1.multiply(q2)</code> e giram vetores com <code>v.applyQuaternion(q)</code>. É o que existe por trás de <code>object.quaternion</code>.</p>
 <p><b>6 · Lerp, nlerp e slerp.</b> <code>a.lerp(b, t)</code> anda em linha reta; sobre uma esfera isso "corta caminho" e a velocidade angular varia. <code>nlerp</code> renormaliza e é barato. <code>slerp</code> mantém velocidade angular constante: <code>qa.clone().slerp(qb, t)</code> para quaternions.</p>
 <div class="note tip"><b>Experimente:</b> (1) na aba 2, abra o campo de visão até 170° e passe o jogador por trás do guarda; (2) na aba 3, troque a ordem e compare o sinal; (3) na aba 4, use o mesmo giro em T·R·S e em R·T·S; (4) na aba 6, deixe A e B quase opostos e veja o lerp atravessar a esfera.</div>
 <div class="note tip"><b>Desafios:</b> (1) faça um inimigo que gira até encarar o jogador usando <code>setFromUnitVectors</code> e <code>slerp</code>; (2) calcule a distância de um ponto a uma reta usando o produto vetorial; (3) implemente a reflexão de um vetor em uma parede com <code>dot</code>.</div>`,
 code:`// ===== Matemática para jogos 3D: seis laboratórios no mesmo preview =====
// Arraste as esferas coloridas (alças). Troque de aba clicando ou com as teclas 1 a 6.
// Arrastar o fundo gira a câmera.

const NL = String.fromCharCode(10);
const COR = { a: '#22d3ee', b: '#ff4fd8', r: '#facc15', g: '#4ade80', o: '#fb923c', w: '#e2e8f0' };
const RAD = Math.PI / 180;
const ZERO = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0), RIGHT = new THREE.Vector3(1, 0, 0);
const tmp = new THREE.Vector3(), tmpS = new THREE.Vector3();
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const f2 = (n) => (Math.abs(n) < 0.005 ? 0 : n).toFixed(2);
const vtxt = (v) => '(' + f2(v.x) + ', ' + f2(v.y) + ', ' + f2(v.z) + ')';
const cor = (txt, c) => '<span style="color:' + c + '">' + txt + '</span>';

// ---------- cena base ----------
scene.background = new THREE.Color(0x0b1020);
const gradeBase = new THREE.GridHelper(10, 10, 0x475569, 0x1e293b);
const eixosBase = new THREE.AxesHelper(3.5);   // X vermelho, Y verde, Z azul
gradeBase.material.depthWrite = false;         // a grade não escreve profundidade e é desenhada primeiro...
gradeBase.renderOrder = -1;
eixosBase.renderOrder = 1;                     // ...os eixos vêm depois e ficam por cima, sem piscar
scene.add(gradeBase, eixosBase);
camera.position.set(4.8, 4, 6.4);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.update();

// ---------- ferramentas de desenho ----------
let G = null;                                   // grupo do laboratório que está sendo montado
function novoGrupo() { G = new THREE.Group(); scene.add(G); return G; }

function rotulo(cssCor) {                       // texto flutuante (sprite)
  const cv = document.createElement('canvas');
  cv.width = 192; cv.height = 64;
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  sp.scale.set(1.5, 0.5, 1);
  sp.renderOrder = 10;
  sp.set = (txt) => {
    if (sp.txt === txt) return;
    sp.txt = txt;
    const g = cv.getContext('2d');
    g.clearRect(0, 0, 192, 64);
    g.font = 'bold 34px system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = cssCor;
    g.fillText(txt, 96, 34);
    tex.needsUpdate = true;
  };
  G.add(sp);
  return sp;
}

function seta(c, esp, frente) {                 // seta = vetor desenhado (haste + ponta); esp = espessura relativa
  const g = new THREE.Group();
  const k = esp || 1;                           // setas sobrepostas precisam de espessuras diferentes
  const mat = new THREE.MeshBasicMaterial({ color: c });
  if (frente) {                                 // desempate: onde duas superfícies coincidem (a tampa na origem), esta vence
    mat.polygonOffset = true;
    mat.polygonOffsetFactor = -2;
    mat.polygonOffsetUnits = -2;
  }
  g.haste = new THREE.Mesh(new THREE.CylinderGeometry(0.03 * k, 0.03 * k, 1, 8).translate(0, 0.5, 0), mat);
  g.ponta = new THREE.Mesh(new THREE.ConeGeometry(0.1 * k, 1, 14).translate(0, 0.5, 0), mat);
  g.add(g.haste); g.add(g.ponta);
  G.add(g);
  return g;
}
function moverSeta(a, de, v) {                  // desenha o vetor v começando no ponto "de"
  const L = v.length();
  a.visible = L > 0.02;
  if (!a.visible) return;
  const hp = Math.min(0.3, L * 0.5);            // comprimento da ponta
  a.position.copy(de);
  a.quaternion.setFromUnitVectors(UP, tmpS.copy(v).divideScalar(L));
  a.haste.scale.set(1, L - hp, 1);
  a.ponta.scale.set(1, hp, 1);
  a.ponta.position.y = L - hp;
}

function linha(n, c, op) {                      // polilinha com n pontos fixos
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: op || 1 }));
  l.frustumCulled = false;
  G.add(l);
  return l;
}
function pts(l, arr) {
  const p = l.geometry.attributes.position;
  for (let i = 0; i < arr.length; i++) p.setXYZ(i, arr[i].x, arr[i].y, arr[i].z);
  p.needsUpdate = true;
  l.geometry.setDrawRange(0, arr.length);
}

// ---------- alças arrastáveis ----------
const alcas = [];
function alca(c, x, y, z, regra) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.17, 20, 14), new THREE.MeshBasicMaterial({ color: c }));
  m.position.set(x, y, z);
  m.userData.regra = regra || function () {};
  G.add(m);
  alcas.push(m);
  return m;
}
const limite = (v) => {                         // mantém o vetor entre 0.2 e 3.4 de comprimento
  if (v.lengthSq() === 0) v.set(0.2, 0, 0);
  else if (v.length() < 0.2) v.setLength(0.2);
  else if (v.length() > 3.4) v.setLength(3.4);
};

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), plano = new THREE.Plane(), hit = new THREE.Vector3();
let arrastando = null;
function apontar(e) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
}
// "true" = fase de captura: roda antes do OrbitControls e podemos desligá-lo a tempo
addEventListener('pointerdown', (e) => {
  if (e.target !== renderer.domElement) return;
  apontar(e);
  const alvo = ray.intersectObjects(alcas.filter((a) => a.parent.visible))[0];
  if (!alvo) return;
  arrastando = alvo.object;
  controls.enabled = false;
  camera.getWorldDirection(tmp);
  plano.setFromNormalAndCoplanarPoint(tmp, arrastando.position);   // plano de arrasto: de frente para a câmera
}, true);
addEventListener('pointermove', (e) => {
  if (!arrastando) return;
  apontar(e);
  if (ray.ray.intersectPlane(plano, hit)) {
    arrastando.position.copy(hit);
    arrastando.userData.regra(arrastando.position);
  }
});
const soltar = () => { arrastando = null; controls.enabled = true; };
addEventListener('pointerup', soltar);
addEventListener('pointercancel', soltar);

// ---------- interface (abas, leitura numérica, controles) ----------
const css = document.createElement('style');
css.textContent =
  '#top{position:fixed;top:6px;left:6px;right:6px;pointer-events:none}' +
  '#tabs{display:flex;flex-wrap:wrap;gap:4px;font:600 12px system-ui,sans-serif;pointer-events:auto}' +
  '#tabs button,#base button{border:1px solid #2a2358;background:#0f0b2ecc;color:#a5a0d6;border-radius:6px;padding:4px 6px;cursor:pointer;font:inherit}' +
  '#tabs button.on,#base button.on{background:linear-gradient(90deg,#8b5cf6,#ff4fd8);color:#fff;border-color:transparent}' +
  '#out{margin:8px 2px 0;color:#e9e7ff;font:12px/1.5 ui-monospace,Consolas,monospace;text-shadow:0 1px 3px #000,0 0 8px #000;pointer-events:none;white-space:pre}' +
  '#base{position:fixed;left:0;right:0;bottom:0;padding:8px 10px;background:linear-gradient(0deg,#07051af2,#07051aa0);color:#cfcaf5;font:12.5px/1.4 system-ui,sans-serif}' +
  '#base .row{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;align-items:center;font-weight:600;font-size:12px}' +
  '#base label{display:flex;gap:6px;align-items:center;color:#e9e7ff}' +
  '#base input[type=range]{width:110px}';
document.head.appendChild(css);

const $tabs = document.createElement('div'); $tabs.id = 'tabs';
const $out = document.createElement('pre'); $out.id = 'out';
const $base = document.createElement('div'); $base.id = 'base';
const $desc = document.createElement('div');
const $ctl = document.createElement('div'); $ctl.className = 'row';
$base.appendChild($desc); $base.appendChild($ctl);
const $top = document.createElement('div'); $top.id = 'top';
$top.appendChild($tabs); $top.appendChild($out);
document.body.appendChild($top); document.body.appendChild($base);

let ultimaSaida = '';
function saida(html) { if (html !== ultimaSaida) { ultimaSaida = html; $out.innerHTML = html; } }

function sliderUI(nome, min, max, passo, valor, aoMudar, unidade) {
  const l = document.createElement('label');
  const sp = document.createElement('span');
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = passo; inp.value = valor;
  inp.mostra = () => { sp.textContent = nome + ' ' + (+inp.value).toFixed(passo < 1 ? 2 : 0) + (unidade || ''); };
  inp.oninput = () => { inp.mostra(); aoMudar(+inp.value); };
  inp.mostra();
  l.appendChild(sp); l.appendChild(inp); $ctl.appendChild(l);
  return inp;
}
function botaoUI(texto, aoClicar) {
  const b = document.createElement('button');
  b.textContent = texto;
  b.onclick = () => aoClicar(b);
  $ctl.appendChild(b);
  return b;
}

const modos = [];                               // cada laboratório: { g, nome, desc, ctl(), upd(dt) }

// =====================================================================
// 1. VETORES: soma, subtração, comprimento, normalização
// =====================================================================
novoGrupo();
{
  G.add(new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16),
    new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.1 })));   // esfera de raio 1
  const A = alca(COR.a, 2, 1, 0.3, limite), B = alca(COR.b, 0.4, 1.4, 2, limite);
  const sA = seta(COR.a), sB = seta(COR.b), sS = seta(COR.r), sD = seta(COR.g), sN = seta(COR.o, 1.9, true);   // Â mais grossa: envolve A em vez de brigar com ela
  const para = linha(3, COR.w, 0.35);
  const lA = rotulo(COR.a), lB = rotulo(COR.b), lS = rotulo(COR.r), lD = rotulo(COR.g), lN = rotulo(COR.o);
  lA.set('A'); lB.set('B'); lS.set('A + B'); lD.set('A − B'); lN.set('Â');
  const S = new THREE.Vector3(), D = new THREE.Vector3(), N = new THREE.Vector3();
  const OFF = V(0, 0.35, 0);
  modos.push({
    g: G, nome: '1 Vetores',
    desc: 'Arraste <b>A</b> e <b>B</b>. <b>A+B</b> fecha o paralelogramo. <b>A−B</b> aponta de B até A: a direção "daqui até o alvo". <b>Â</b> tem comprimento 1 e toca a esfera.',
    ctl: function () {},
    upd: function () {
      const p = A.position, q = B.position;
      S.copy(p).add(q);                         // A + B
      D.copy(p).sub(q);                         // A − B
      N.copy(p).normalize();                    // Â = A / |A|
      moverSeta(sA, ZERO, p); moverSeta(sB, ZERO, q);
      moverSeta(sS, ZERO, S); moverSeta(sD, q, D); moverSeta(sN, ZERO, N);
      pts(para, [p, S, q]);
      lA.position.copy(p).add(OFF); lB.position.copy(q).add(OFF); lS.position.copy(S).add(OFF);
      lD.position.copy(q).addScaledVector(D, 0.5).add(OFF); lN.position.copy(N).add(V(0.5, -0.3, 0));
      saida(
        cor('A', COR.a) + ' = ' + vtxt(p) + '   |A| = ' + f2(p.length()) + NL +

// 2. PRODUTO ESCALAR: ângulo, projeção, cone de visão
// =====================================================================
novoGrupo();
{
  const A = alca(COR.a, 2.2, 0, 0, limite), B = alca(COR.b, 1.2, 0.6, 1.8, limite);
  const sA = seta(COR.a), sB = seta(COR.b);
  const queda = linha(2, COR.w, 0.5);
  const marca = new THREE.Mesh(new THREE.SphereGeometry(0.1, 14, 10), new THREE.MeshBasicMaterial({ color: COR.o }));
  G.add(marca);
  const cone = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 48, 1, true).translate(0, -0.5, 0),   // ponta na origem
    new THREE.MeshBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false }));
  G.add(cone);
  const borda = linha(65, COR.g, 0.9);
  const anel = Array.from({ length: 65 }, () => new THREE.Vector3());
  const lA = rotulo(COR.a), lB = rotulo(COR.b), lP = rotulo(COR.o);
  lA.set('frente'); lB.set('jogador'); lP.set('projeção');
  const F = new THREE.Vector3(), Bn = new THREE.Vector3(), P = new THREE.Vector3();
  const u = new THREE.Vector3(), w = new THREE.Vector3(), YNEG = V(0, -1, 0), OFF = V(0, 0.35, 0);
  const ALC = 3;                                // alcance da visão do guarda
  let fov = 90;
  modos.push({
    g: G, nome: '2 Escalar',
    desc: 'O guarda olha na direção <b>A</b> e o jogador é <b>B</b>. O <b>produto escalar</b> dos vetores unitários é o cosseno do ângulo: se for maior que o cosseno da metade do campo de visão, o jogador foi visto.',
    ctl: function () { sliderUI('campo de visão', 20, 170, 1, fov, (v) => { fov = v; }, '°'); },
    upd: function () {
      F.copy(A.position).normalize();                       // direção da frente
      Bn.copy(B.position).normalize();                      // direção até o jogador
      const half = fov * RAD / 2;
      const d = F.dot(Bn);                                  // cos θ
      const ang = Math.acos(THREE.MathUtils.clamp(d, -1, 1)) / RAD;
      const visto = ang <= fov / 2;                         // o mesmo que d >= Math.cos(half)
      const proj = B.position.dot(F);                       // B · Â = tamanho da "sombra" de B sobre A
      P.copy(F).multiplyScalar(proj);

      cone.quaternion.setFromUnitVectors(YNEG, F);
      cone.scale.set(ALC * Math.sin(half), ALC * Math.cos(half), ALC * Math.sin(half));
      u.crossVectors(F, Math.abs(F.y) < 0.99 ? UP : RIGHT).normalize();
      w.crossVectors(F, u);
      for (let i = 0; i < anel.length; i++) {
        const t = i / (anel.length - 1) * Math.PI * 2;
        anel[i].copy(F).multiplyScalar(ALC * Math.cos(half))
          .addScaledVector(u, Math.cos(t) * ALC * Math.sin(half)).addScaledVector(w, Math.sin(t) * ALC * Math.sin(half));
      }
      pts(borda, anel);
      const c = visto ? '#f87171' : '#4ade80';
      cone.material.color.set(c); borda.material.color.set(c);

      moverSeta(sA, ZERO, A.position); moverSeta(sB, ZERO, B.position);
      marca.position.copy(P); pts(queda, [B.position, P]);
      lA.position.copy(A.position).add(OFF); lB.position.copy(B.position).add(OFF); lP.position.copy(P).add(V(0, -0.35, 0));
      saida(
        'A · B = ax·bx + ay·by + az·bz = ' + f2(A.position.dot(B.position)) + NL +
        'cos θ = Â · B̂ = ' + f2(d) + '   →   θ = ' + f2(ang) + '°' + NL +
        'metade do campo de visão = ' + f2(fov / 2) + '°  (cos = ' + f2(Math.cos(half)) + ')' + NL +
        'estado: ' + (visto ? cor('VISTO!', '#f87171') : cor('fora do campo', '#4ade80')) + NL +
        'projeção: ' + cor('B · Â', COR.o) + ' = ' + f2(proj) + (proj < 0 ? '  (atrás do guarda)' : ''));
    }
  });
}

// 6. LERP, NLERP e SLERP: interpolar sobre uma esfera
// =====================================================================
novoGrupo();
{
  const R = 2;
  G.add(new THREE.Mesh(new THREE.SphereGeometry(R, 32, 20),
    new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.08 })));
  const presa = (v) => { v.setLength(R); };     // as alças ficam presas à superfície
  const A = alca(COR.a, 2, 0, 0, presa), B = alca(COR.b, -1.4, 0.9, 0.8, presa);
  B.position.setLength(R);
  const marcador = (c) => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), new THREE.MeshBasicMaterial({ color: c })); G.add(m); return m; };
  const mL = marcador(COR.o), mN = marcador(COR.r), mS = marcador('#4ade80');
  const corda = linha(2, COR.o, 0.7), arco = linha(41, '#4ade80', 0.9);
  const arcoP = Array.from({ length: 41 }, () => new THREE.Vector3());
  const rL = linha(2, COR.o, 0.4), rS = linha(2, '#4ade80', 0.4);
  const lA = rotulo(COR.a), lB = rotulo(COR.b), lL = rotulo(COR.o), lN = rotulo(COR.r), lS = rotulo('#4ade80');
  lA.set('A'); lB.set('B'); lL.set('lerp'); lN.set('nlerp'); lS.set('slerp');
  const OFF = V(0, 0.3, 0);

  const slerpV = (a, b, t, out) => {            // slerp entre dois vetores de mesmo comprimento
    const om = a.angleTo(b), s = Math.sin(om);
    if (s < 1e-3) return out.copy(a).lerp(b, t);
    return out.copy(a).multiplyScalar(Math.sin((1 - t) * om) / s).addScaledVector(b, Math.sin(t * om) / s);
  };

  let t = 0.5, animando = false, dir = 1, slT = null;
  modos.push({
    g: G, nome: '6 Slerp',
    desc: '<b>lerp</b> anda em linha reta (corta a esfera). <b>nlerp</b> renormaliza o resultado. <b>slerp</b> percorre o arco com velocidade angular constante: é o que <code>Quaternion.slerp</code> faz com rotações.',
    ctl: function () {
      slT = sliderUI('t', 0, 1, 0.01, t, (v) => { t = v; });
      const b = botaoUI('▶ animar', () => { animando = !animando; b.className = animando ? 'on' : ''; });
      b.className = animando ? 'on' : '';
    },
    upd: function (dt) {
      if (animando) {
        t += dir * 0.3 * dt;
        if (t > 1) { t = 1; dir = -1; } else if (t < 0) { t = 0; dir = 1; }
        slT.value = t; slT.mostra();
      }
      const pa = A.position, pb = B.position;
      const om = pa.angleTo(pb);
      mL.position.copy(pa).lerp(pb, t);                         // lerp: a + (b − a)·t
      mN.position.copy(mL.position).setLength(R);               // nlerp: lerp + normalizar
      slerpV(pa, pb, t, mS.position);                           // slerp: sobre o arco
      for (let i = 0; i < arcoP.length; i++) slerpV(pa, pb, i / (arcoP.length - 1), arcoP[i]);
      pts(arco, arcoP); pts(corda, [pa, pb]);
      pts(rL, [ZERO, mL.position]); pts(rS, [ZERO, mS.position]);
      lA.position.copy(pa).add(OFF); lB.position.copy(pb).add(OFF);
      lL.position.copy(mL.position).add(V(0, -0.3, 0)); lN.position.copy(mN.position).add(OFF); lS.position.copy(mS.position).add(V(0.4, 0.2, 0));
      const pct = (P) => {                                      // % do ângulo total já percorrido
        if (P.lengthSq() < 1e-8 || om < 1e-3) return '—';
        return Math.round(pa.angleTo(P) / om * 100) + '%';
      };
      saida(
        'Ω (ângulo entre A e B) = ' + f2(om / RAD) + '°      t = ' + f2(t) + NL +
        cor('lerp ', COR.o) + ' |P| = ' + f2(mL.position.length()) + ' (R = ' + f2(R) + ')  percorreu ' + pct(mL.position) + NL +
        cor('nlerp', COR.r) + ' |P| = ' + f2(mN.position.length()) + '           percorreu ' + pct(mN.position) + NL +
        cor('slerp', '#4ade80') + ' |P| = ' + f2(mS.position.length()) + '           percorreu ' + pct(mS.position));
    }
  });
}

{t:"Colisões e coleta",
 lead:"Como o jogo percebe que o personagem encostou em algo?",
 txt:`<p>A colisão mais simples e útil é a <b>AABB</b>: uma caixa alinhada aos eixos em volta de cada objeto (<code>Box3</code>). Se as duas caixas se cruzam (<code>intersectsBox</code>), houve colisão. Ao coletar, removemos o objeto da cena com <code>scene.remove()</code>.</p>
 <p>Também criamos um <b>HUD</b> (placar) com um <code>div</code> comum sobreposto ao canvas. Clique no preview e use WASD ou as setas. O jogador fica sempre dentro da grid.</p>
 <div class="note tip"><b>Câmera:</b> use a <b>roda do mouse</b> (ou <code>+</code> / <code>-</code>) para aproximar e afastar, e <b>arraste com o mouse</b> para girar (lados) e inclinar (cima/baixo). Quanto mais perto, mais a câmera segue o jogador.</div>
 <div class="note tip"><b>Experimente:</b> faça cada moeda valer 10 pontos e crie 20 moedas em vez de 8.</div>`,
 code:`scene.add(new THREE.GridHelper(20, 20, 0x22d3ee, 0x2a2358));
scene.add(new THREE.HemisphereLight(0xffffff, 0x223355, 1.4));

const jogador = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshStandardMaterial({ color: 0xff4fd8 })
);
jogador.position.y = 0.5;
scene.add(jogador);

const moedas = [];
for (let i = 0; i < 8; i++) {
  const m = new THREE.Mesh(
    new THREE.TorusGeometry(0.3, 0.1, 12, 24),
    new THREE.MeshStandardMaterial({ color: 0xfacc15 })
  );
  m.position.set((Math.random() * 2 - 1) * 8, 0.6, (Math.random() * 2 - 1) * 8);
  scene.add(m);
  moedas.push(m);
}

const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:12px;left:16px;color:#fff;font:700 20px system-ui';
document.body.appendChild(hud);

const teclas = {};
addEventListener('keydown', (e) => (teclas[e.code] = true));
addEventListener('keyup', (e) => (teclas[e.code] = false));

const caixaJ = new THREE.Box3(), caixaM = new THREE.Box3();
const lim = 10 - 0.5; // metade da grid menos metade do cubo
let dist = 30, yaw = 0, pitch = 1.265; // distância, giro e inclinação da câmera
const DMIN = 8, DMAX = 30;
addEventListener('wheel', (e) => {
  dist = THREE.MathUtils.clamp(dist + e.deltaY * 0.03, DMIN, DMAX);
  e.preventDefault();
}, { passive: false });
addEventListener('keydown', (e) => {
  if (e.code === 'Equal' || e.code === 'NumpadAdd') dist = Math.max(DMIN, dist - 2);
  if (e.code === 'Minus' || e.code === 'NumpadSubtract') dist = Math.min(DMAX, dist + 2);
});
addEventListener('pointermove', (e) => {
  if (!e.buttons) return;
  yaw -= e.movementX * 0.01;
  pitch = THREE.MathUtils.clamp(pitch + e.movementY * 0.01, 0.3, 1.45);
});

function atualizarCamera() {
  // longe: vê a arena toda; perto: segue o jogador
  const f = (DMAX - dist) / (DMAX - DMIN);
  const alvo = new THREE.Vector3(jogador.position.x * f, 0, jogador.position.z * f);
  const h = dist * Math.cos(pitch); // distância horizontal ao alvo
  camera.position.set(alvo.x + Math.sin(yaw) * h, dist * Math.sin(pitch), alvo.z + Math.cos(yaw) * h);
  camera.lookAt(alvo);
}

const clock = new THREE.Clock();
let pontos = 0;

renderer.setAnimationLoop((t) => {
  const dt = clock.getDelta();
  const ix = ((teclas.KeyD || teclas.ArrowRight) ? 1 : 0) - ((teclas.KeyA || teclas.ArrowLeft) ? 1 : 0);
  const iz = ((teclas.KeyS || teclas.ArrowDown) ? 1 : 0) - ((teclas.KeyW || teclas.ArrowUp) ? 1 : 0);
  // gira o movimento junto com a câmera: "para cima" sempre vai para frente
  const dx = ix * Math.cos(yaw) + iz * Math.sin(yaw);
  const dz = -ix * Math.sin(yaw) + iz * Math.cos(yaw);
  jogador.position.x = THREE.MathUtils.clamp(jogador.position.x + dx * 6 * dt, -lim, lim);
  jogador.position.z = THREE.MathUtils.clamp(jogador.position.z + dz * 6 * dt, -lim, lim);

  caixaJ.setFromObject(jogador);
  for (let i = moedas.length - 1; i >= 0; i--) {
    caixaM.setFromObject(moedas[i]);
    if (caixaJ.intersectsBox(caixaM)) {
      scene.remove(moedas[i]);
      moedas.splice(i, 1);
      pontos++;
    } else {
      moedas[i].rotation.y = t / 400;
    }
  }
  hud.textContent = 'Moedas: ' + pontos + (moedas.length ? '' : ' — pegou todas!');
  atualizarCamera();
  renderer.render(scene, camera);
});`},
{t:"Mini jogo: Coletor 3D",
 lead:"Juntando tudo: arena, moedas, inimigos, dificuldade crescente e game over.",
 txt:`<p>Este é um jogo completo em ~60 linhas. Colete as moedas amarelas e fuja das esferas vermelhas — cada moeda deixa os inimigos mais rápidos. Se encostar em um, é <b>game over</b>; aperte <b>R</b> para recomeçar.</p>
 <p>Repare na estrutura clássica: <b>estado</b> (<code>pontos</code>, <code>vivo</code>) → <b>entrada</b> (teclas) → <b>atualização</b> (movimento e colisão) → <b>desenho</b> (render + HUD). Clique no preview e jogue!</p>
 <div class="note tip"><b>Câmera:</b> <b>roda do mouse</b> (ou <code>+</code> / <code>-</code>) aproxima e afasta; <b>arrastar o mouse</b> gira (lados) e inclina (cima/baixo) a câmera. Perto, ela segue o jogador.</div>
 <div class="note tip"><b>Desafios:</b> (1) adicione um cronômetro de 30 s; (2) faça um segundo tipo de moeda que vale 5 pontos; (3) deixe o jogador perder velocidade ao tocar numa parede.</div>`,
 code:`const A = 12; // metade do lado da arena
scene.add(new THREE.GridHelper(A * 2, A * 2, 0x22d3ee, 0x2a2358));
scene.add(new THREE.HemisphereLight(0xffffff, 0x223355, 1.4));

const mk = (geo, cor, y) => {
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: cor }));
  m.position.y = y;
  scene.add(m);
  return m;
};
const rnd = () => (Math.random() * 2 - 1) * (A - 1);

const jogador = mk(new THREE.BoxGeometry(1, 1, 1), 0xff4fd8, 0.5);
const moeda = mk(new THREE.CylinderGeometry(0.4, 0.4, 0.12, 24), 0xfacc15, 0.6);
const inimigos = [];
for (let i = 0; i < 4; i++) {
  const e = mk(new THREE.SphereGeometry(0.5, 24, 12), 0xef4444, 0.5);
  e.userData.v = new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).setLength(3);
  inimigos.push(e);
}

const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:12px;left:16px;color:#fff;font:700 20px system-ui;text-shadow:0 2px 6px #000';
document.body.appendChild(hud);

const teclas = {};
addEventListener('keydown', (e) => (teclas[e.code] = true));
addEventListener('keyup', (e) => (teclas[e.code] = false));

let pontos = 0, vivo = true;
function reiniciar() {
  pontos = 0;
  vivo = true;
  jogador.position.set(0, 0.5, 0);
  moeda.position.set(rnd(), 0.6, rnd());
  inimigos.forEach((e) => e.position.set(rnd(), 0.5, rnd()));
}
reiniciar();

let dist = 36, yaw = 0, pitch = 1.265; // distância, giro e inclinação da câmera
const DMIN = 8, DMAX = 36;
addEventListener('wheel', (e) => {
  dist = THREE.MathUtils.clamp(dist + e.deltaY * 0.03, DMIN, DMAX);
  e.preventDefault();
}, { passive: false });
addEventListener('keydown', (e) => {
  if (e.code === 'Equal' || e.code === 'NumpadAdd') dist = Math.max(DMIN, dist - 2);
  if (e.code === 'Minus' || e.code === 'NumpadSubtract') dist = Math.min(DMAX, dist + 2);
});
addEventListener('pointermove', (e) => {
  if (!e.buttons) return;
  yaw -= e.movementX * 0.01;
  pitch = THREE.MathUtils.clamp(pitch + e.movementY * 0.01, 0.3, 1.45);
});

function atualizarCamera() {
  // longe: vê a arena toda; perto: segue o jogador
  const f = (DMAX - dist) / (DMAX - DMIN);
  const alvo = new THREE.Vector3(jogador.position.x * f, 0, jogador.position.z * f);
  const h = dist * Math.cos(pitch); // distância horizontal ao alvo
  camera.position.set(alvo.x + Math.sin(yaw) * h, dist * Math.sin(pitch), alvo.z + Math.cos(yaw) * h);
  camera.lookAt(alvo);
}

const clock = new THREE.Clock();
renderer.setAnimationLoop((t) => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (teclas.KeyR) reiniciar();

  if (vivo) {
    const ix = ((teclas.KeyD || teclas.ArrowRight) ? 1 : 0) - ((teclas.KeyA || teclas.ArrowLeft) ? 1 : 0);
    const iz = ((teclas.KeyS || teclas.ArrowDown) ? 1 : 0) - ((teclas.KeyW || teclas.ArrowUp) ? 1 : 0);
    const dx = ix * Math.cos(yaw) + iz * Math.sin(yaw);
    const dz = -ix * Math.sin(yaw) + iz * Math.cos(yaw);
    const lim = A - 0.5;
    jogador.position.x = THREE.MathUtils.clamp(jogador.position.x + dx * 7 * dt, -lim, lim);
    jogador.position.z = THREE.MathUtils.clamp(jogador.position.z + dz * 7 * dt, -lim, lim);

    inimigos.forEach((e) => {
      const v = e.userData.v;
      e.position.addScaledVector(v, dt * (1 + pontos * 0.1));
      if (Math.abs(e.position.x) > lim && e.position.x * v.x > 0) v.x *= -1;
      if (Math.abs(e.position.z) > lim && e.position.z * v.z > 0) v.z *= -1;
      if (e.position.distanceTo(jogador.position) < 1) vivo = false;
    });

    if (moeda.position.distanceTo(jogador.position) < 1) {
      pontos++;
      moeda.position.set(rnd(), 0.6, rnd());
    }
  }
  moeda.rotation.x = t / 300;
  hud.textContent = vivo ? 'Moedas: ' + pontos : 'GAME OVER — ' + pontos + ' moedas (R reinicia)';
  atualizarCamera();
  renderer.render(scene, camera);
});`},
{t:"Snake 3D",
 lead:"O clássico da cobrinha, num tabuleiro 3D com câmera balançando.",
 txt:`<p>O segredo de jogos em grade é <b>separar a lógica do desenho</b>. A cobra é só uma lista de células <code>{x, z}</code>: a cada passo, <code>unshift</code> cria a nova cabeça e <code>pop</code> remove a cauda (se comeu a maçã, a cauda fica e a cobra cresce).</p>
 <p>A lógica avança em intervalos fixos (um <i>timer</i> que acumula <code>dt</code>), mas os cubos se movem com <b>interpolação</b> até a célula-alvo, o que deixa tudo fluido. A câmera oscila suavemente para dar sensação de profundidade.</p>
 <div class="note"><b>Controles:</b> clique no preview e use <b>WASD</b> ou setas. <b>R</b> reinicia. A cobra acelera a cada maçã.</div>
 <div class="note tip"><b>Desafios:</b> (1) faça as paredes serem atravessáveis (a cobra reaparece do outro lado); (2) crie uma maçã dourada que vale 5 pontos e some após 5 s; (3) adicione obstáculos fixos no tabuleiro.</div>`,
 code:`const N = 15; // lado do tabuleiro (em células)
const mat = (c) => new THREE.MeshStandardMaterial({ color: c });
const pos = (c) => c - N / 2 + 0.5; // célula -> coordenada 3D

scene.background = new THREE.Color(0x0b1020);
scene.add(new THREE.HemisphereLight(0xffffff, 0x223355, 1.3));
const sol = new THREE.DirectionalLight(0xffffff, 1.2);
sol.position.set(6, 12, 4);
scene.add(sol);

// tabuleiro xadrez
for (let x = 0; x < N; x++) {
  for (let z = 0; z < N; z++) {
    const c = new THREE.Mesh(
      new THREE.BoxGeometry(0.96, 0.2, 0.96),
      mat((x + z) % 2 ? 0x1e293b : 0x172033)
    );
    c.position.set(pos(x), -0.1, pos(z));
    scene.add(c);
  }
}

// segmentos da cobra (criados sob demanda) e maçã
const geoSeg = new THREE.BoxGeometry(0.85, 0.85, 0.85);
const meshes = [];
function seg(i, s) {
  if (!meshes[i]) {
    const m = new THREE.Mesh(geoSeg, mat(0x22c55e));
    m.position.set(pos(s.x), 0.425, pos(s.z));
    scene.add(m);
    meshes[i] = m;
  }
  return meshes[i];
}
const macaMesh = new THREE.Mesh(new THREE.SphereGeometry(0.4, 20, 16), mat(0xef4444));
scene.add(macaMesh);

const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:12px;left:16px;color:#fff;font:700 20px system-ui;text-shadow:0 2px 6px #000';
document.body.appendChild(hud);

// ---- estado do jogo ----
let cobra, dir, prox, maca, vivo, pontos, acum, melhor = 0;
const rnd = () => Math.floor(Math.random() * N);

function novaMaca() {
  do { maca = { x: rnd(), z: rnd() }; }
  while (cobra.some((s) => s.x === maca.x && s.z === maca.z));
}
function reiniciar() {
  cobra = [{ x: 7, z: 7 }, { x: 6, z: 7 }, { x: 5, z: 7 }];
  dir = { x: 1, z: 0 };
  prox = dir;
  pontos = 0; acum = 0; vivo = true;
  novaMaca();
  meshes.forEach((m) => m.position.set(pos(7), 0.425, pos(7)));
}
reiniciar();

addEventListener('keydown', (e) => {
  const d = {
    ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0],
  }[e.code];
  if (d && !(d[0] === -dir.x && d[1] === -dir.z)) prox = { x: d[0], z: d[1] }; // não vira 180°
  if (e.code === 'KeyR') reiniciar();
});

function passo() {
  dir = prox;
  const h = { x: cobra[0].x + dir.x, z: cobra[0].z + dir.z };
  const bateu = h.x < 0 || h.x >= N || h.z < 0 || h.z >= N ||
                cobra.some((s) => s.x === h.x && s.z === h.z);
  if (bateu) { vivo = false; melhor = Math.max(melhor, pontos); return; }
  cobra.unshift(h);                       // nova cabeça
  if (h.x === maca.x && h.z === maca.z) { pontos++; novaMaca(); }
  else cobra.pop();                       // sem comer: remove a cauda
}

const clock = new THREE.Clock();
renderer.setAnimationLoop((t) => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (vivo) {
    acum += dt;
    const intervalo = Math.max(0.07, 0.2 - pontos * 0.006); // acelera com os pontos
    if (acum >= intervalo) { acum -= intervalo; passo(); }
  }

  meshes.forEach((m, i) => (m.visible = i < cobra.length));
  const k = Math.min(1, dt * 18);         // suavização do movimento
  cobra.forEach((s, i) => {
    const m = seg(i, s);
    m.position.x += (pos(s.x) - m.position.x) * k;
    m.position.z += (pos(s.z) - m.position.z) * k;
    m.material.color.setHSL(0.38, 0.7, i === 0 ? 0.65 : 0.45 - Math.min(i, 20) * 0.008);
    m.scale.setScalar(i === 0 ? 1.08 : 1 - Math.min(i, 15) * 0.012);
  });

  macaMesh.position.set(pos(maca.x), 0.5 + Math.sin(t / 200) * 0.12, pos(maca.z));
  macaMesh.rotation.y = t / 400;

  camera.position.set(Math.sin(t / 4000) * 3, 16, 14); // câmera balançando
  camera.lookAt(0, 0, 0);

  hud.textContent = vivo
    ? 'Pontos: ' + pontos + '   |   recorde: ' + melhor
    : 'GAME OVER — ' + pontos + ' pontos (R reinicia)';
  renderer.render(scene, camera);
});`},
{t:"Tetris 3D",
 lead:"Peças de cubos caindo num poço 3D, com sombra-guia e câmera balançando.",
 txt:`<p>O poço é uma <b>matriz</b> de 20 linhas × 10 colunas. A peça que cai é uma matriz pequena (0 e 1) com posição <code>x, y</code>. Todo movimento segue o mesmo padrão: <b>testa</b> se a nova posição colide (<code>colide()</code>); se não colidir, aplica.</p>
 <p>Girar uma peça é uma operação de matriz: <i>transpor</i> e <i>inverter as linhas</i>. Quando a peça pousa, ela é gravada na matriz; as linhas completas são removidas com <code>filter</code> e novas linhas vazias entram por cima. O "fantasma" mostra onde a peça vai cair. Ao completar linhas, elas <b>piscam e incham</b>, depois <b>explodem em fagulhas</b> com física própria, a câmera treme e aparece um aviso (LINHA!, DUPLA!, TRIPLA!, TETRIS!).</p>
 <div class="note"><b>Controles:</b> clique no preview. ← → movem, ↑ (ou X) gira, ↓ desce mais rápido, <b>Espaço</b> derruba de uma vez, <b>R</b> reinicia.</div>
 <div class="note tip"><b>Desafios:</b> (1) mostre a próxima peça; (2) crie um combo que multiplica os pontos em limpezas seguidas; (3) adicione pausa com a tecla P; (4) versão 3D de verdade: um poço 4×4×12 em que as peças também se movem em profundidade.</div>`,
 code:`const W = 10, H = 20;
const mat = (c) => new THREE.MeshStandardMaterial({ color: c });
const px = (c) => c - W / 2 + 0.5;   // coluna -> x
const py = (r) => H - r - 0.5;       // linha (0 = topo) -> y

scene.background = new THREE.Color(0x0b1020);
scene.add(new THREE.HemisphereLight(0xffffff, 0x223355, 1.3));
const sol = new THREE.DirectionalLight(0xffffff, 1.2);
sol.position.set(-6, 14, 12);
scene.add(sol);

// moldura do poço
const bloco = (w, h, x, y, cor) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 1), mat(cor));
  m.position.set(x, y, 0);
  scene.add(m);
};
bloco(1, H + 1, -W / 2 - 0.5, H / 2 - 0.5, 0x334155);
bloco(1, H + 1,  W / 2 + 0.5, H / 2 - 0.5, 0x334155);
bloco(W + 2, 1, 0, -0.5, 0x334155);
const fundo = new THREE.Mesh(new THREE.PlaneGeometry(W, H), mat(0x111a30));
fundo.position.set(0, H / 2, -0.6);
scene.add(fundo);

// um cubo para cada célula do poço + 4 do fantasma
const geo = new THREE.BoxGeometry(0.92, 0.92, 0.92);
const cubos = [];
for (let r = 0; r < H; r++) {
  cubos[r] = [];
  for (let c = 0; c < W; c++) {
    const m = new THREE.Mesh(geo, mat(0xffffff));
    m.position.set(px(c), py(r), 0);
    m.visible = false;
    scene.add(m);
    cubos[r][c] = m;
  }
}
const fantasma = [0, 1, 2, 3].map(() => {
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.28 }));
  scene.add(m);
  return m;
});

const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:12px;left:16px;color:#fff;font:700 18px system-ui;text-shadow:0 2px 6px #000;line-height:1.4';
document.body.appendChild(hud);

// ---- peças ----
const PECAS = [
  { c: 0x22d3ee, m: [[1, 1, 1, 1]] },
  { c: 0xfacc15, m: [[1, 1], [1, 1]] },
  { c: 0xa855f7, m: [[0, 1, 0], [1, 1, 1]] },
  { c: 0x22c55e, m: [[0, 1, 1], [1, 1, 0]] },
  { c: 0xef4444, m: [[1, 1, 0], [0, 1, 1]] },
  { c: 0x3b82f6, m: [[1, 0, 0], [1, 1, 1]] },
  { c: 0xfb923c, m: [[0, 0, 1], [1, 1, 1]] },
];
let grid, peca, pontos, linhas, acum, vivo, melhor = 0;
let limpando = null, shake = 0, aviso = { txt: '', t: 0 };
const fagulhas = [];
const geoF = new THREE.BoxGeometry(0.28, 0.28, 0.28);
const nivel = () => 1 + Math.floor(linhas / 10);

function sorteia() {
  const p = PECAS[Math.floor(Math.random() * PECAS.length)];
  return { c: p.c, m: p.m.map((l) => l.slice()), x: Math.floor((W - p.m[0].length) / 2), y: 0 };
}
function colide(m, x, y) {
  return m.some((lin, r) => lin.some((v, c) => {
    if (!v) return false;
    const nx = x + c, ny = y + r;
    return nx < 0 || nx >= W || ny >= H || (ny >= 0 && grid[ny][nx]);
  }));
}
function reiniciar() {
  grid = Array.from({ length: H }, () => Array(W).fill(0));
  pontos = 0; linhas = 0; acum = 0; vivo = true;
  limpando = null;
  peca = sorteia();
}
function mover(dx, dy) {
  if (colide(peca.m, peca.x + dx, peca.y + dy)) return false;
  peca.x += dx; peca.y += dy;
  return true;
}
function girar() {
  const g = peca.m[0].map((_, i) => peca.m.map((l) => l[i]).reverse()); // transpõe + inverte
  for (const k of [0, -1, 1, -2, 2]) {              // "wall kick" simples
    if (!colide(g, peca.x + k, peca.y)) { peca.m = g; peca.x += k; return; }
  }
}
function travar() {
  peca.m.forEach((lin, r) => lin.forEach((v, c) => {
    if (v) grid[peca.y + r][peca.x + c] = peca.c;
  }));
  const cheias = [];
  grid.forEach((l, r) => { if (l.every((v) => v)) cheias.push(r); });
  if (cheias.length) {                   // linhas completas: dispara o efeito
    limpando = { linhas: cheias, t: 0 };
    peca = null;
    return;
  }
  proxima();
}
function concluir() {                    // fim do efeito: explode e remove as linhas
  const n = limpando.linhas.length;
  explodir(limpando.linhas);
  const sobra = grid.filter((_, r) => !limpando.linhas.includes(r));
  grid = [...Array.from({ length: n }, () => Array(W).fill(0)), ...sobra];
  linhas += n;
  pontos += [0, 100, 300, 500, 800][n] * nivel();
  shake = n * 0.35;                      // tremor de câmera proporcional às linhas
  aviso = { txt: ['', 'LINHA!', 'DUPLA!', 'TRIPLA!', 'TETRIS!'][n], t: 1.2 };
  limpando = null;
  proxima();
}
function proxima() {
  peca = sorteia();
  if (colide(peca.m, peca.x, peca.y)) { vivo = false; melhor = Math.max(melhor, pontos); }
}
function explodir(rs) {                  // cada cubo vira 3 fagulhas com física
  rs.forEach((r) => grid[r].forEach((v, c) => {
    for (let i = 0; i < 3; i++) {
      const f = new THREE.Mesh(geoF, new THREE.MeshStandardMaterial({ color: v, emissive: v, emissiveIntensity: 0.6 }));
      f.position.set(px(c), py(r), 0);
      f.userData = { v: new THREE.Vector3((Math.random() - 0.5) * 8, Math.random() * 7 + 2, Math.random() * 8 - 1), vida: 0 };
      scene.add(f);
      fagulhas.push(f);
    }
  }));
}

addEventListener('keydown', (e) => {
  if (e.code === 'KeyR') return reiniciar();
  if (!vivo || limpando) return;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') mover(-1, 0);
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') mover(1, 0);
  else if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'KeyX') girar();
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') { if (mover(0, 1)) pontos++; }
  else if (e.code === 'Space') {
    e.preventDefault();
    while (mover(0, 1)) pontos += 2;                // queda total
    travar();
  }
});
reiniciar();

function desenhar() {
  const k = limpando ? limpando.t / 0.45 : 0;
  cubos.forEach((lin, r) => lin.forEach((m, c) => {
    const v = grid[r][c];
    m.visible = !!v;
    m.scale.setScalar(1);
    m.material.emissive.setHex(0x000000);
    if (!v) return;
    m.material.color.setHex(v);
    if (limpando && limpando.linhas.includes(r)) {          // linha completa: pisca e incha
      const branco = Math.floor(limpando.t * 18) % 2 === 0;
      m.material.color.setHex(branco ? 0xffffff : v);
      m.material.emissive.setHex(branco ? 0xffffff : v);
      m.scale.setScalar(1 + 0.35 * Math.sin(k * Math.PI));
    }
  }));
  if (!peca) { fantasma.forEach((f) => (f.visible = false)); return; }
  let gy = peca.y;                                  // onde a peça vai pousar
  while (!colide(peca.m, peca.x, gy + 1)) gy++;
  let n = 0;
  peca.m.forEach((lin, r) => lin.forEach((v, c) => {
    if (!v) return;
    const m = cubos[peca.y + r][peca.x + c];
    m.visible = true;
    m.material.color.setHex(peca.c);
    const f = fantasma[n++];
    f.visible = gy > peca.y;
    f.position.set(px(peca.x + c), py(gy + r), 0);
    f.material.color.setHex(peca.c);
  }));
}

const clock = new THREE.Clock();
renderer.setAnimationLoop((t) => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (limpando) {
    limpando.t += dt;
    if (limpando.t >= 0.45) concluir();
  } else if (vivo) {
    acum += dt;
    if (acum >= Math.max(0.08, 0.8 - nivel() * 0.07)) {   // gravidade acelera com o nível
      acum = 0;
      if (!mover(0, 1)) travar();
    }
  }

  for (let i = fagulhas.length - 1; i >= 0; i--) {        // física das fagulhas
    const f = fagulhas[i], d = f.userData;
    d.vida += dt;
    d.v.y -= 22 * dt;
    f.position.addScaledVector(d.v, dt);
    f.rotation.x += dt * 6;
    f.rotation.y += dt * 8;
    f.scale.setScalar(Math.max(0.001, 1 - d.vida / 0.9));
    if (d.vida > 0.9) { scene.remove(f); f.material.dispose(); fagulhas.splice(i, 1); }
  }
  shake *= 0.9;
  aviso.t -= dt;

  desenhar();
  camera.position.set(
    Math.sin(t / 4000) * 5 + (Math.random() - 0.5) * shake,
    12 + (Math.random() - 0.5) * shake,
    26
  );
  camera.lookAt(0, 9.5, 0);
  hud.innerHTML = (vivo
    ? 'Pontos: ' + pontos + '<br>Linhas: ' + linhas + '  Nível: ' + nivel() + '<br>Recorde: ' + melhor
    : 'GAME OVER<br>' + pontos + ' pontos — R reinicia')
    + (aviso.t > 0 ? '<br><span style="color:#facc15;font-size:30px">' + aviso.txt + '</span>' : '');
  renderer.render(scene, camera);
});`},
{t:"Pac-Man 3D",
 lead:"Labirinto em grade, fantasmas com IA e power-ups.",
 txt:`<p>O labirinto é só um <b>array de textos</b>: <code>#</code> é parede, <code>.</code> bolinha, <code>o</code> power-up. Cada personagem anda <b>de célula em célula</b>: guardamos a célula atual, a célula destino e um progresso <code>p</code> de 0 a 1, e desenhamos com <code>lerpVectors</code>. Só quando <code>p</code> chega a 1 é hora de decidir a próxima direção.</p>
 <p>A <b>IA dos fantasmas</b> é simples: a cada cruzamento, cada um escolhe a direção cuja célula fica mais perto do seu <b>alvo</b> (nunca voltando para trás). O que muda de um fantasma para outro é só o alvo: o vermelho persegue você, o rosa mira 3 células à frente, o ciano usa o vermelho como espelho e o laranja foge quando está perto. Ao pegar um power-up, eles ficam <b>assustados</b>: azuis, lentos e comestíveis.</p>
 <div class="note"><b>Controles:</b> clique no preview e use setas ou WASD (a direção fica guardada até a curva ficar livre). <b>R</b> reinicia.</div>
 <div class="note tip"><b>Desafios:</b> (1) desenhe seu próprio <code>MAPA</code>; (2) troque o alvo do fantasma laranja; (3) faça o jogador atravessar um túnel que liga a borda esquerda à direita.</div>`,
 code:`const W = 15, H = 13;
const MAPA = [
  '###############',
  '#o.....#.....o#',
  '#.###.#.#.###.#',
  '#.............#',
  '#.###.###.###.#',
  '#.....# #.....#',
  '#.....   .....#',
  '#.###.###.###.#',
  '#.............#',
  '#.###.#.#.###.#',
  '#o...#...#...o#',
  '#......P......#',
  '###############'
];
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const TECLAS = { ArrowRight: [1, 0], KeyD: [1, 0], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowDown: [0, 1], KeyS: [0, 1], ArrowUp: [0, -1], KeyW: [0, -1] };
const livre = (x, z) => !!MAPA[z] && MAPA[z][x] !== '#';
const pos = (x, z) => new THREE.Vector3(x - W / 2 + 0.5, 0, z - H / 2 + 0.5);
const dist2 = (x, z, a) => (x - a.x) ** 2 + (z - a.z) ** 2;

camera.position.set(0, 17, 9);
camera.lookAt(0, 0, 0.5);
scene.add(new THREE.HemisphereLight(0xffffff, 0x223355, 1.4));
const chao = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshStandardMaterial({ color: 0x0b1020 }));
chao.rotation.x = -Math.PI / 2;
scene.add(chao);

const matParede = new THREE.MeshStandardMaterial({ color: 0x2563eb });
const geoParede = new THREE.BoxGeometry(0.96, 0.9, 0.96);
for (let z = 0; z < H; z++) for (let x = 0; x < W; x++) {
  if (MAPA[z][x] !== '#') continue;
  const m = new THREE.Mesh(geoParede, matParede);
  m.position.copy(pos(x, z));
  m.position.y = 0.45;
  scene.add(m);
}

// ---- bolinhas
const geoB = new THREE.SphereGeometry(0.1, 8, 6), geoP = new THREE.SphereGeometry(0.25, 12, 8);
const matB = new THREE.MeshStandardMaterial({ color: 0xfde68a });
let bolinhas = {}, restantes = 0;
function criarBolinhas() {
  Object.values(bolinhas).forEach((b) => scene.remove(b.mesh));
  bolinhas = {};
  restantes = 0;
  for (let z = 0; z < H; z++) for (let x = 0; x < W; x++) {
    const c = MAPA[z][x];
    if (c !== '.' && c !== 'o') continue;
    const m = new THREE.Mesh(c === 'o' ? geoP : geoB, matB);
    m.position.copy(pos(x, z));
    m.position.y = 0.4;
    scene.add(m);
    bolinhas[x + ',' + z] = { mesh: m, poder: c === 'o' };
    restantes++;
  }
}
function comer(x, z) {
  const b = bolinhas[x + ',' + z];
  if (!b) return;
  scene.remove(b.mesh);
  delete bolinhas[x + ',' + z];
  restantes--;
  if (b.poder) { pontos += 50; assustado = 7; } else pontos += 10;
}

// ---- movimento de célula em célula
function nova(mesh, vel) {
  scene.add(mesh);
  return { mesh, x: 0, z: 0, tx: 0, tz: 0, p: 1, vel, dx: 0, dz: 0 };
}
function colocar(e, x, z) {
  e.x = e.tx = x; e.z = e.tz = z;
  e.p = 1; e.dx = e.dz = 0;
}
function mover(e, dt, escolher) {
  e.p += e.vel * dt;
  while (e.p >= 1) {
    e.p -= 1;
    e.x = e.tx; e.z = e.tz;
    escolher(e); // define o próximo destino (ou fica parado)
    if (e.tx === e.x && e.tz === e.z) { e.p = 1; break; }
  }
  e.mesh.position.lerpVectors(pos(e.x, e.z), pos(e.tx, e.tz), Math.min(e.p, 1));
  e.mesh.position.y = 0.45;
}

// ---- jogador
let desejo = [0, 0];
addEventListener('keydown', (e) => {
  if (TECLAS[e.code]) desejo = TECLAS[e.code];
  if (e.code === 'KeyR') iniciar();
});
const jog = nova(new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 14), new THREE.MeshStandardMaterial({ color: 0xfacc15 })), 4.6);
function escolherJogador(e) {
  comer(e.x, e.z);
  if (livre(e.x + desejo[0], e.z + desejo[1])) { e.dx = desejo[0]; e.dz = desejo[1]; }
  if ((e.dx || e.dz) && livre(e.x + e.dx, e.z + e.dz)) { e.tx = e.x + e.dx; e.tz = e.z + e.dz; }
  else { e.tx = e.x; e.tz = e.z; e.dx = e.dz = 0; }
}

// ---- fantasmas: cada um tem um alvo diferente
function criarFantasma(cor) {
  const mat = new THREE.MeshStandardMaterial({ color: cor });
  const g = new THREE.Group();
  const corpo = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.45, 16), mat);
  const topo = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 10), mat);
  topo.position.y = 0.22;
  g.add(corpo, topo);
  g.userData.mat = mat;
  return g;
}
const CFG = [
  { cor: 0xef4444, ini: [7, 5], alvo: () => jog },
  { cor: 0xf9a8d4, ini: [6, 6], alvo: () => ({ x: jog.x + jog.dx * 3, z: jog.z + jog.dz * 3 }) },
  { cor: 0x22d3ee, ini: [7, 6], alvo: () => ({ x: 2 * jog.x - fantasmas[0].x, z: 2 * jog.z - fantasmas[0].z }) },
  { cor: 0xfb923c, ini: [8, 6], alvo: () => {
    const f = fantasmas[3];
    return dist2(f.x, f.z, jog) > 25 ? jog : { x: 1, z: H - 2 };
  } }
];
const fantasmas = CFG.map((c) => {
  const f = nova(criarFantasma(c.cor), 3.4);
  f.cor = c.cor; f.ini = c.ini; f.alvo = c.alvo; f.espera = 0;
  return f;
});
function escolherFantasma(f) {
  const livres = DIRS.filter(([a, b]) => livre(f.x + a, f.z + b));
  const opc = livres.filter(([a, b]) => !(a === -f.dx && b === -f.dz)); // não volta atrás
  const lista = opc.length ? opc : livres;
  let d;
  if (assustado > 0) d = lista[Math.floor(Math.random() * lista.length)];
  else {
    const al = f.alvo();
    d = lista.reduce((m, c) => dist2(f.x + c[0], f.z + c[1], al) < dist2(f.x + m[0], f.z + m[1], al) ? c : m);
  }
  f.dx = d[0]; f.dz = d[1];
  f.tx = f.x + d[0]; f.tz = f.z + d[1];
}

// ---- estado do jogo
const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:12px;left:16px;color:#fff;font:700 20px system-ui;text-shadow:0 2px 6px #000';
document.body.appendChild(hud);
let pontos, vidas, assustado, estado;
function reposicionar() {
  colocar(jog, 7, 11);
  desejo = [0, 0];
  fantasmas.forEach((f, i) => { colocar(f, f.ini[0], f.ini[1]); f.espera = i * 2; });
}
function iniciar() {
  pontos = 0; vidas = 3; assustado = 0; estado = 'jogando';
  criarBolinhas();
  reposicionar();
}
function encostar(f) {
  if (assustado > 0) {
    pontos += 200;
    colocar(f, f.ini[0], f.ini[1]);
    f.espera = 2;
  } else {
    vidas--;
    if (vidas <= 0) estado = 'perdeu'; else reposicionar();
  }
}
iniciar();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime * 1000;
  if (estado === 'jogando') {
    assustado = Math.max(0, assustado - dt);
    // inverter a direção no meio do caminho é permitido
    if ((jog.dx || jog.dz) && desejo[0] === -jog.dx && desejo[1] === -jog.dz) {
      [jog.x, jog.tx] = [jog.tx, jog.x];
      [jog.z, jog.tz] = [jog.tz, jog.z];
      jog.p = 1 - jog.p;
      jog.dx = desejo[0]; jog.dz = desejo[1];
    }
    mover(jog, dt, escolherJogador);
    fantasmas.forEach((f) => {
      if (f.espera > 0) { f.espera -= dt; f.mesh.position.copy(pos(f.x, f.z)); f.mesh.position.y = 0.45; return; }
      f.vel = assustado > 0 ? 2.2 : 3.4;
      mover(f, dt, escolherFantasma);
      if (estado === 'jogando' && f.mesh.position.distanceTo(jog.mesh.position) < 0.7) encostar(f);
    });
    if (restantes === 0) estado = 'venceu';
  }
  fantasmas.forEach((f) => f.mesh.userData.mat.color.set(
    assustado > 0 ? (assustado < 2 && Math.floor(t / 150) % 2 ? 0xffffff : 0x2563eb) : f.cor));
  jog.mesh.scale.setScalar(1 + 0.08 * Math.sin(t / 60));
  hud.textContent = estado === 'perdeu' ? 'GAME OVER — ' + pontos + ' pontos (R reinicia)'
    : estado === 'venceu' ? 'VENCEU! ' + pontos + ' pontos (R reinicia)'
    : 'Pontos: ' + pontos + '   Vidas: ' + vidas + (assustado > 0 ? '   POWER!' : '');
  renderer.render(scene, camera);
});`},
{t:"Sokoban 3D",
 lead:"Empurrar caixas, desfazer movimentos e passar de nível.",
