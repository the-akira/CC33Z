// ---- o mundo é só dados: Uint8Array plano (0 = ar, 1..5 = tipo de bloco)
const N = 32, H = 14;
const TIPOS = [0, 0x5fae3f, 0x8a5a34, 0x8d9199, 0xc89b5a, 0xb5483a];
const NOMES = ['', 'Grama', 'Terra', 'Pedra', 'Madeira', 'Tijolo'];
const mundo = new Uint8Array(N * H * N);
const tom = new Float32Array(N * H * N);            // variação de brilho de cada casa
const idx = (x, y, z) => (y * N + z) * N + x;
const dentro = (x, y, z) => x >= 0 && x < N && y >= 0 && y < H && z >= 0 && z < N;
const tipoEm = (x, y, z) => (dentro(x, y, z) ? mundo[idx(x, y, z)] : 0);
const solido = (x, y, z) => (y < 0 ? 1 : tipoEm(x, y, z));   // abaixo do mundo conta como sólido (ninguém vê)

function gerar() {
  mundo.fill(0);
  for (let z = 0; z < N; z++) {
    for (let x = 0; x < N; x++) {
      const h = Math.round(5.5 + 2.2 * Math.sin(x * 0.28) + 2 * Math.cos(z * 0.23) + 1.2 * Math.sin((x + z) * 0.15));
      const alt = Math.max(1, Math.min(H - 4, h));
      for (let y = 0; y < alt; y++) {
        mundo[idx(x, y, z)] = y === alt - 1 ? 1 : (y >= alt - 3 ? 2 : 3);   // grama, terra, pedra
        tom[idx(x, y, z)] = 0.88 + Math.random() * 0.24;
      }
    }
  }
}

// ---- UMA geometria e UM material, desenhados "capacidade" vezes: 1 ordem de desenho para o mundo todo
const MAX = N * N * H;
const blocos = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: 0xffffff }), MAX);
blocos.frustumCulled = false;           // a esfera de visibilidade é a de UM cubo na origem: sem isto, sumiria da tela
scene.add(blocos);
const ids = new Int32Array(MAX);        // ids[instância] = índice da casa no mundo (usado pela mira)
const m4 = new THREE.Matrix4(), cor = new THREE.Color();
let solidos = 0;

function reconstruir() {
  let n = 0;
  solidos = 0;
  for (let y = 0; y < H; y++) {
    for (let z = 0; z < N; z++) {
      for (let x = 0; x < N; x++) {
        const i = idx(x, y, z), t = mundo[i];
        if (!t) continue;
        solidos++;
        const exposto = !solido(x + 1, y, z) || !solido(x - 1, y, z) || !solido(x, y + 1, z) ||
                        !solido(x, y - 1, z) || !solido(x, y, z + 1) || !solido(x, y, z - 1);
        if (!exposto) continue;         // totalmente cercado: ninguém vê, nem vira instância
        m4.setPosition(x - N / 2 + 0.5, y + 0.5, z - N / 2 + 0.5);
        blocos.setMatrixAt(n, m4);
        blocos.setColorAt(n, cor.setHex(TIPOS[t]).multiplyScalar(tom[i]));
        ids[n++] = i;
      }
    }
  }
  blocos.count = n;                     // desenha só as n primeiras instâncias
  blocos.instanceMatrix.needsUpdate = true;
  blocos.instanceColor.needsUpdate = true;
}

// ---- o jogador: uma caixa de 0,6 x 1,8; "p" é a posição dos PÉS (coordenadas de mundo)
const PW = 0.3, PH = 1.8, OLHOS = 1.62;     // meia largura, altura, altura dos olhos
const G = 28, PULO = 8.4, ALCANCE = 6;      // gravidade, velocidade do pulo (~1,26 bloco) e alcance do braço
const p = new THREE.Vector3(), v = new THREE.Vector3();
let noChao = false;

function solidaCasa(cx, cy, cz) {           // fora do mundo: paredes invisíveis e chão; acima do teto: ar
  if (cx < 0 || cx >= N || cz < 0 || cz >= N || cy < 0) return true;
  if (cy >= H) return false;
  return mundo[idx(cx, cy, cz)] !== 0;
}
function colide(x, y, z) {                  // a caixa do jogador encosta em alguma casa sólida?
  const x0 = Math.floor(x - PW + N / 2), x1 = Math.floor(x + PW - 1e-6 + N / 2);
  const z0 = Math.floor(z - PW + N / 2), z1 = Math.floor(z + PW - 1e-6 + N / 2);
  const y0 = Math.floor(y + 1e-6), y1 = Math.floor(y + PH - 1e-6);
  for (let cy = y0; cy <= y1; cy++)         // só as poucas casas que a caixa cobre
    for (let cz = z0; cz <= z1; cz++)
      for (let cx = x0; cx <= x1; cx++)
        if (solidaCasa(cx, cy, cz)) return true;
  return false;
}
function invade(cx, cy, cz) {               // uma casa nova ficaria dentro do jogador?
  const x0 = cx - N / 2, z0 = cz - N / 2;
  return p.x + PW > x0 && p.x - PW < x0 + 1 && p.z + PW > z0 && p.z - PW < z0 + 1 && p.y + PH > cy && p.y < cy + 1;
}

function nascer() {                         // no meio do mundo, em cima do chão
  const cx = N / 2, cz = N / 2;
  let y = H - 1;
  while (y > 0 && !mundo[idx(cx, y, cz)]) y--;
  p.set(cx - N / 2 + 0.5, y + 1, cz - N / 2 + 0.5);
  v.set(0, 0, 0);
  noChao = false;
}

// ---- controles
const controls = new THREE.PointerLockControls(camera, renderer.domElement);
document.body.addEventListener('click', () => { if (!controls.isLocked) controls.lock(); });
const teclas = {};
addEventListener('keydown', (e) => {
  teclas[e.code] = true;
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.code >= 'Digit1' && e.code <= 'Digit5') escolher(+e.code.slice(5));
  if (e.code === 'KeyR') { gerar(); reconstruir(); nascer(); }
});
addEventListener('keyup', (e) => (teclas[e.code] = false));
addEventListener('wheel', (e) => { if (controls.isLocked) escolher(((sel - 1 + Math.sign(e.deltaY) + 5) % 5) + 1); });

const euler = new THREE.Euler(0, 0, 0, 'YXZ');
function mover(dt) {
  euler.setFromQuaternion(camera.quaternion);
  const yaw = euler.y;                      // para onde o jogador olha, no plano do chão
  const f = (teclas.KeyW ? 1 : 0) - (teclas.KeyS ? 1 : 0), s = (teclas.KeyD ? 1 : 0) - (teclas.KeyA ? 1 : 0);
  let dx = -Math.sin(yaw) * f + Math.cos(yaw) * s, dz = -Math.cos(yaw) * f - Math.sin(yaw) * s;
  const len = Math.hypot(dx, dz);
  if (len > 1) { dx /= len; dz /= len; }    // andar na diagonal não é mais rápido
  const vel = (teclas.ShiftLeft || teclas.ShiftRight) ? 6 : 4.3;
  const k = Math.min(1, (noChao ? 14 : 4) * dt);   // acelera aos poucos (menos controle no ar)
  v.x += (dx * vel - v.x) * k;
  v.z += (dz * vel - v.z) * k;
  if (teclas.Space && noChao) { v.y = PULO; noChao = false; }

  const passos = Math.ceil(dt / (1 / 120)), h = dt / passos;   // passos pequenos: nada atravessa um bloco
  for (let i = 0; i < passos; i++) {
    v.y = Math.max(v.y - G * h, -40);
    noChao = false;
    const nx = p.x + v.x * h;               // um eixo de cada vez: assim você desliza nas paredes
    if (!colide(nx, p.y, p.z)) p.x = nx; else v.x = 0;
    const nz = p.z + v.z * h;
    if (!colide(p.x, p.y, nz)) p.z = nz; else v.z = 0;
    const ny = p.y + v.y * h;
    if (!colide(p.x, ny, p.z)) p.y = ny;
    else {
      if (v.y < 0) { p.y = Math.floor(ny + 1e-6) + 1; noChao = true; }   // pousou: pés no topo do bloco
      else p.y = Math.floor(ny + PH) - PH - 1e-4;                        // cabeçada no teto
      v.y = 0;
    }
  }
}

// ---- mira: o raio sai do centro da tela e o "far" é o alcance do braço
const rc = new THREE.Raycaster();
rc.far = ALCANCE;
const centro = new THREE.Vector2(0, 0);
function mirar() {
  camera.updateMatrixWorld();
  rc.setFromCamera(centro, camera);
  const h = rc.intersectObject(blocos)[0];
  if (!h) return null;
  const i = ids[h.instanceId];
  const x = i % N, z = Math.floor(i / N) % N, y = Math.floor(i / (N * N));
  const n = h.face.normal;              // (0,1,0) = face de cima, etc.
  return { x, y, z, px: x + Math.round(n.x), py: y + Math.round(n.y), pz: z + Math.round(n.z) };
}

let sel = 1, golpe = 0;
const matTipo = TIPOS.map((c) => new THREE.MeshLambertMaterial({ color: c }));
const geoF = new THREE.BoxGeometry(0.2, 0.2, 0.2);
const fagulhas = [];

function quebrar(a) {
  if (a.y === 0) return;                // camada de baixo é indestrutível
  const t = mundo[idx(a.x, a.y, a.z)];
  mundo[idx(a.x, a.y, a.z)] = 0;
  for (let k = 0; k < 6; k++) {         // pedacinhos voando
    const f = new THREE.Mesh(geoF, matTipo[t]);
    f.position.set(a.x - N / 2 + 0.5 + (Math.random() - 0.5) * 0.6, a.y + 0.5, a.z - N / 2 + 0.5 + (Math.random() - 0.5) * 0.6);
    f.userData = { v: new THREE.Vector3((Math.random() - 0.5) * 4, Math.random() * 4 + 1, (Math.random() - 0.5) * 4), vida: 0 };
    scene.add(f);
    fagulhas.push(f);
  }
  reconstruir();
}
function colocar(a) {
  if (!dentro(a.px, a.py, a.pz) || mundo[idx(a.px, a.py, a.pz)]) return;
  if (invade(a.px, a.py, a.pz)) return;     // não vale colocar bloco dentro de si mesmo
  mundo[idx(a.px, a.py, a.pz)] = sel;
  reconstruir();
}
document.addEventListener('mousedown', (e) => {
  if (!controls.isLocked) return;
  const a = mirar();
  golpe = 1;                                // balança a mão mesmo no ar
  if (!a) return;
  if (e.button === 2) colocar(a); else if (e.button === 0) quebrar(a);
});
document.addEventListener('contextmenu', (e) => e.preventDefault());

// contorno do bloco mirado e a "mão" com o bloco selecionado
const contorno = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.01, 1.01, 1.01)), new THREE.LineBasicMaterial({ color: 0x000000 }));
contorno.visible = false;
scene.add(contorno);
const mao = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshLambertMaterial({ color: TIPOS[sel], depthTest: false }));
mao.renderOrder = 10;                   // desenha por cima de tudo, como a mão do jogo
mao.position.set(0.5, -0.4, -0.8);
mao.rotation.y = 0.6;
camera.add(mao);

// ---- interface: mira, barra de materiais, painel e aviso
const mk = (css, html) => { const d = document.createElement('div'); d.style.cssText = css; if (html) d.innerHTML = html; document.body.appendChild(d); return d; };
mk('position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;pointer-events:none;background:linear-gradient(#fff,#fff) center/2px 100% no-repeat,linear-gradient(#fff,#fff) center/100% 2px no-repeat;mix-blend-mode:difference');
const hud = mk('position:fixed;top:8px;left:10px;color:#fff;font:600 13px/1.5 system-ui;text-shadow:0 1px 4px #000;pointer-events:none');
const barra = mk('position:fixed;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none');
const caixas = [];
for (let t = 1; t < TIPOS.length; t++) {
  const b = document.createElement('div');
  b.style.cssText = 'width:44px;height:44px;border-radius:6px;color:#fff;font:700 12px system-ui;text-shadow:0 1px 3px #000;padding:3px;box-sizing:border-box;background:#' + TIPOS[t].toString(16).padStart(6, '0');
  b.textContent = t;
  barra.appendChild(b);
  caixas.push(b);
}
function escolher(t) {
  sel = t;
  mao.material.color.setHex(TIPOS[t]);
  caixas.forEach((b, i) => (b.style.outline = i + 1 === t ? '3px solid #fff' : '2px solid #0006'));
}
const aviso = mk('position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:rgba(0,0,0,.5);font:700 20px system-ui;pointer-events:none;padding:20px',
  'Clique para jogar<br><span style="font:14px system-ui;font-weight:400">WASD andar · Shift correr · Espaço pular<br>esq quebra · dir coloca · 1-5 ou roda: material · R: novo mundo · Esc libera o mouse</span>');
controls.addEventListener('lock', () => (aviso.style.display = 'none'));
controls.addEventListener('unlock', () => (aviso.style.display = 'flex'));

gerar();
reconstruir();
nascer();
escolher(1);

const clock = new THREE.Clock();
let acc = 0, quadros = 0, fps = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (controls.isLocked) mover(dt);
  camera.position.set(p.x, p.y + OLHOS, p.z);   // a câmera são os olhos do jogador

  const a = controls.isLocked ? mirar() : null;
  contorno.visible = !!a;
  if (a) contorno.position.set(a.x - N / 2 + 0.5, a.y + 0.5, a.z - N / 2 + 0.5);

  golpe = Math.max(0, golpe - dt * 5);
  mao.rotation.x = -golpe * 0.9;
  mao.position.y = -0.4 + Math.sin(golpe * Math.PI) * 0.08;

  for (let i = fagulhas.length - 1; i >= 0; i--) {
    const f = fagulhas[i], d = f.userData;
    d.vida += dt;
    d.v.y -= 20 * dt;
    f.position.addScaledVector(d.v, dt);
    f.rotation.x += dt * 6;
    f.scale.setScalar(Math.max(0.001, 1 - d.vida / 0.7));
    if (d.vida > 0.7) { scene.remove(f); fagulhas.splice(i, 1); }   // material compartilhado: não descartar
  }
  quadros++; acc += dt;
  if (acc > 0.5) { fps = Math.round(quadros / acc); quadros = 0; acc = 0; }
  hud.innerHTML = 'Blocos sólidos: ' + solidos + '<br>Instâncias desenhadas: ' + blocos.count + '<br>FPS: ' + fps +
    '<br>Material: ' + NOMES[sel];
  renderer.render(scene, camera);
});`},
{t:"Jogo de ritmo",
 lead:"Pistas e janela de acerto sincronizadas com o relógio do Web Audio.",
 txt:`<p>Em jogo de ritmo, <b>som e imagem não podem se afastar nem por 50 ms</b>. O problema é que há dois relógios: o do quadro de animação (impreciso, oscila) e o do hardware de áudio. A solução é usar <code>audioCtx.currentTime</code> como <b>relógio mestre</b>: a música é <b>agendada com antecedência</b> (<code>osc.start(t)</code>, precisão de amostra, nada de <code>setTimeout</code>) e a posição de cada nota na tela é calculada <b>a partir desse relógio</b>, e não somando <code>dt</code> quadro a quadro, que acumula erro.</p>
 <p>Cada nota tem um <b>instante de acerto</b> <code>t</code>. Sua posição é <code>z = -(t - agora) * VEL</code>: ela viaja pela pista e chega à linha exatamente quando o som toca. A <b>janela de acerto</b> é só uma diferença de tempo: <code>Math.abs(t - agora) &lt;= JANELA</code>. Como tempo vira distância pela mesma fórmula, a faixa translúcida desenhada na pista mostra a janela de verdade. Por fim, o som leva um tempinho para sair do computador (<code>outputLatency</code>); descontamos esse valor em <code>agora()</code> para o que você <b>vê</b> bater com o que você <b>ouve</b>.</p>
 <div class="note"><b>Controles:</b> clique no preview e aperte <b>Espaço</b> para começar (navegadores só liberam o áudio depois de um gesto do usuário). Teclas <b>D F J K</b> para as quatro pistas, <b>R</b> reinicia e <b>[</b> / <b>]</b> calibram o atraso em 10 ms se achar que está adiantado ou atrasado.</div>
 <div class="note tip"><b>Desafios:</b> (1) mude <code>BPM</code> e <code>PADROES</code> para criar sua música; (2) apertar sem nota tirar pontos; (3) notas longas, que exigem segurar a tecla; (4) agendar a música em pedaços de 0,2 s com <code>setInterval</code> (a técnica do <i>look-ahead</i>) em vez de agendar tudo de uma vez.</div>`,
 code:`const BPM = 120, BATIDA = 60 / BPM;          // duração de uma batida, em segundos
const VEL = 10;                               // unidades de distância por segundo
const JANELA = 0.15, PERFEITO = 0.05, BOM = 0.10; // tolerâncias de acerto, em segundos
let ajuste = 0;                               // calibração manual da latência (segundos)
const TECLAS = ['KeyD', 'KeyF', 'KeyJ', 'KeyK'], NOMES = ['D', 'F', 'J', 'K'];
const CORES = [0xef4444, 0xfacc15, 0x22c55e, 0x3b82f6];
const FREQS = [440, 523.25, 659.25, 783.99];  // nota que cada pista toca quando você acerta
const RAIZES = [55, 55, 65.41, 73.42];        // baixo de cada compasso
const GRAUS = [['PERFEITO', 300, '#facc15'], ['BOM', 200, '#4ade80'], ['OK', 100, '#93c5fd']];
// cada compasso tem 8 colcheias: número = pista da nota, -1 = silêncio
const PADROES = [
  [0, -1, 1, -1, 2, -1, 3, -1],
  [0, 1, -1, 2, -1, 3, 2, -1],
  [3, -1, 2, -1, 1, -1, 0, -1],
  [0, -1, 1, 2, -1, 3, -1, 0]
];
const SEQUENCIA = [0, 1, 0, 1, 2, 3, 2, 3, 0, 1, 2, 3, 0, 3, 1, 2]; // 16 compassos = 32 s

// ---- cena: pistas, linha de acerto e a janela desenhada em 3D
camera.position.set(0, 7, 8);
camera.lookAt(0, 0, -3);
scene.add(new THREE.HemisphereLight(0xffffff, 0x223355, 1.3));
const X = (i) => (i - 1.5) * 1.6;
function etiqueta(txt, x) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff';
  g.font = 'bold 96px system-ui';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(txt, 64, 70);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.9), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.03, 1.4);
  return m;
}
const pads = [];
for (let i = 0; i < 4; i++) {
  const pista = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 34), new THREE.MeshStandardMaterial({ color: 0x151a2e }));
  pista.rotation.x = -Math.PI / 2;
  pista.position.set(X(i), 0, -15);
  scene.add(pista);
  const mat = new THREE.MeshStandardMaterial({ color: CORES[i], emissive: CORES[i], emissiveIntensity: 0.15 });
  const pad = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.2, 0.5), mat);
  pad.position.set(X(i), 0.1, 0);
  scene.add(pad);
  pads.push(mat);
  scene.add(etiqueta(NOMES[i], X(i)));
}
function faixa(profundidade, opacidade) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(6.6, profundidade), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: opacidade, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(0, 0.03, 0);
  scene.add(m);
}
faixa(JANELA * VEL * 2, 0.10);   // janela de acerto: tempo vira distância
faixa(PERFEITO * VEL * 2, 0.18); // zona perfeita

// ---- áudio: tudo agendado no relógio do Web Audio
let ctx, saida, ruido;
function criarAudio() {
  if (ctx) ctx.close();
  ctx = new AudioContext();
  saida = ctx.createGain();
  saida.gain.value = 0.5;
  saida.connect(ctx.destination);
  ruido = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate);
  const d = ruido.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function tom(freq, t, dur, tipo, vol) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = tipo;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g);
  g.connect(saida);
  o.start(t);              // t está no futuro, no relógio do áudio
  o.stop(t + dur + 0.02);
}
function bumbo(t) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
  g.gain.setValueAtTime(0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  o.connect(g);
  g.connect(saida);
  o.start(t);
  o.stop(t + 0.3);
}
function chimbal(t) {
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = ruido;
  f.type = 'highpass';
  f.frequency.value = 7000;
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  s.connect(f);
  f.connect(g);
  g.connect(saida);
  s.start(t);
}
// "agora" = o que você está ouvindo neste instante (desconta a latência de saída)
const agora = () => ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0) - ajuste;

// ---- estado do jogo
const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:12px;left:16px;color:#fff;font:700 18px system-ui;text-shadow:0 2px 6px #000';
document.body.appendChild(hud);
const julg = document.createElement('div');
julg.style.cssText = 'position:fixed;top:42%;left:0;right:0;text-align:center;font:800 34px system-ui;text-shadow:0 2px 8px #000;pointer-events:none';
document.body.appendChild(julg);

let estado = 'espera', notas = [], grupo, pontos, combo, maior, stats;
const noteGeo = new THREE.BoxGeometry(1.3, 0.3, 0.5);

function iniciar() {
  criarAudio();
  if (grupo) scene.remove(grupo);
  grupo = new THREE.Group();
  scene.add(grupo);
  notas = []; pontos = 0; combo = 0; maior = 0; stats = [0, 0, 0, 0];
  julg.textContent = '';
  const t0 = ctx.currentTime + 2; // a música começa daqui a 2 s, no relógio do áudio
  SEQUENCIA.forEach((p, c) => {
    for (let b = 0; b < 4; b++) {
      const t = t0 + (c * 4 + b) * BATIDA;
      bumbo(t);
      tom(RAIZES[c % 4], t, BATIDA * 0.9, 'triangle', 0.3);
      chimbal(t + BATIDA / 2);
    }
    PADROES[p].forEach((lane, s) => {
      if (lane < 0) return;
      const mesh = new THREE.Mesh(noteGeo, new THREE.MeshStandardMaterial({ color: CORES[lane], emissive: CORES[lane], emissiveIntensity: 0.4 }));
      mesh.position.x = X(lane);
      mesh.position.y = 0.2;
      mesh.visible = false;
      grupo.add(mesh);
      notas.push({ lane, t: t0 + (c * 4 + s * 0.5) * BATIDA, fim: false, mesh });
    });
  });
  estado = 'jogando';
}

function errar() {
  combo = 0;
  stats[3]++;
  julg.textContent = 'ERROU';
  julg.style.color = '#f87171';
}
function apertar(lane) {
  if (estado !== 'jogando') return;
  pads[lane].emissiveIntensity = 1;
  tom(FREQS[lane], ctx.currentTime, 0.18, 'triangle', 0.35); // você "toca" a melodia
  const a = agora();
  // a primeira nota ainda não resolvida desta pista que esteja dentro da janela
  const n = notas.find((x) => !x.fim && x.lane === lane && Math.abs(x.t - a) <= JANELA);
  if (!n) return;
  n.fim = true;
  n.mesh.visible = false;
  const erro = Math.abs(n.t - a);
  const g = erro <= PERFEITO ? 0 : erro <= BOM ? 1 : 2;
  combo++;
  maior = Math.max(maior, combo);
  stats[g]++;
  pontos += Math.round(GRAUS[g][1] * (1 + Math.min(combo, 30) / 30));
  julg.textContent = GRAUS[g][0] + (combo > 4 ? '  x' + combo : '');
  julg.style.color = GRAUS[g][2];
}

addEventListener('keydown', (e) => {
  if (e.code === 'BracketLeft') ajuste -= 0.01;
  if (e.code === 'BracketRight') ajuste += 0.01;
  if (e.repeat) return;
  if ((e.code === 'Space' && estado !== 'jogando') || e.code === 'KeyR') iniciar();
  const lane = TECLAS.indexOf(e.code);
  if (lane >= 0) apertar(lane);
});
addEventListener('keyup', (e) => {
  const lane = TECLAS.indexOf(e.code);
  if (lane >= 0) pads[lane].emissiveIntensity = 0.15;
});
addEventListener('mousedown', () => { if (estado === 'espera') iniciar(); });

renderer.setAnimationLoop(() => {
  if (estado === 'jogando') {
    const a = agora();
    notas.forEach((n) => {
      if (n.fim) return;
      const falta = n.t - a;                 // segundos até a nota chegar à linha
      n.mesh.position.z = -falta * VEL;      // tempo vira distância
      n.mesh.visible = falta < 2.6;
      if (falta < -JANELA) { n.fim = true; n.mesh.visible = false; errar(); } // passou da janela
    });
    if (notas.every((n) => n.fim)) estado = 'fim';
  }
  pads.forEach((m) => { if (m.emissiveIntensity > 0.15) m.emissiveIntensity = Math.max(0.15, m.emissiveIntensity - 0.06); });
  const acertos = stats ? stats[0] + stats[1] + stats[2] : 0;
  hud.textContent = estado === 'espera' ? 'Clique aqui e aperte ESPAÇO para começar  |  teclas D F J K'
    : estado === 'fim' ? 'FIM!  ' + pontos + ' pontos  |  ' + acertos + '/' + notas.length + ' acertos  |  maior combo ' + maior + '  |  Espaço reinicia'
    : 'Pontos: ' + pontos + '   Combo: ' + combo + '   Ajuste: ' + Math.round(ajuste * 1000) + ' ms';
  renderer.render(scene, camera);
});`},
{t:"RPG de mago em 1ª pessoa",
 lead:"Floresta e masmorra, cajado na mão, bolas de fogo, criaturas e níveis: um RPG medieval visto pelos olhos do mago.",
 txt:`<p>Este capítulo junta quase tudo o que você já viu num <b>RPG medieval em 1ª pessoa</b>: você é um <b>mago</b>, e da câmera só aparece o <b>cajado</b> na sua mão, como nos jogos de aventura clássicos. Há dois mundos: uma <b>floresta sombria</b> sob a lua e uma <b>masmorra</b> de salas e corredores. Um portal de pedra liga um ao outro, e cada descida deixa as criaturas mais fortes.</p>
 <p><b>O cajado é filho da câmera.</b> Ao fazer <code>camera.add(cajado)</code> (e <code>scene.add(camera)</code>, senão nada que pende dela é desenhado), o cajado passa a girar e andar junto com o olhar, sempre no mesmo canto da tela. É o truque da <i>view model</i>. O orbe tem uma <code>PointLight</code>: <b>o próprio cajado ilumina a masmorra</b>. Ao andar ele balança, ao lançar uma magia ele <b>recua</b> e o orbe incha por um instante.</p>
 <p><b>Magias.</b> Ao clicar, a bola de fogo sai do orbe, mas não na direção da câmera: ela mira no <b>ponto 30 metros à frente da mira</b>, assim o tiro acerta onde o ponto de mira está, mesmo saindo do canto da tela. Cada quadro ela anda <code>v * dt</code>, deixa um rastro de faíscas e explode se bater na parede, no chão ou numa criatura. A magia gasta <b>mana</b>, que volta sozinha; a tecla <b>E</b> gasta mais mana para <b>curar</b>.</p>
 <p><b>Criaturas.</b> Slimes, lobos, esqueletos e ogros são <code>Group</code>s de caixas e esferas, sem nenhum modelo externo. A inteligência é simples: se o mago está dentro do raio de <code>vista</code>, a criatura <b>vira para ele, persegue e ataca</b> quando encosta (com um tempo de recarga); senão, <b>vagueia</b> e para de vez em quando. Cada eixo é movido separadamente, então elas deslizam nas paredes e nas árvores. A barra de vida é um <code>Sprite</code> com uma textura de canvas, que sempre olha para você.</p>
 <p><b>Dois mundos, uma função.</b> Cada mundo é montado por uma função que devolve um <code>Group</code> e uma função <code>bloqueado(x, z, r)</code>. A floresta usa <code>InstancedMesh</code> para centenas de árvores e testa círculos nos troncos; a masmorra reaproveita o gerador de salas do capítulo <i>Dungeon crawler</i> e testa a grade. Trocar de mundo é só <code>scene.remove(grupoAntigo)</code>: inimigos, magias e faíscas estão <b>dentro do grupo</b>, então somem juntos. Quanto mais fundo (<code>profundidade</code>), mais vida e dano têm as criaturas. Cada vitória dá <b>XP</b>, e cada nível aumenta vida, mana e dano; criaturas derrotadas às vezes largam <b>poções</b>.</p>
 <div class="note"><b>Controles:</b> <b>clique no preview</b> para travar o mouse (Esc pausa). <b>WASD</b>/setas andam, <b>Shift</b> corre, <b>mouse</b> olha, <b>clique (segure para repetir)</b> lança bola de fogo, <b>E</b> cura. Entre no <b>portal roxo</b> da floresta para descer à masmorra; o <b>portal azul</b> da última sala volta à floresta. Se cair, aperte <b>R</b>.</div>
 <div class="note tip"><b>Desafios:</b> (1) crie uma segunda magia (raio de gelo que deixa o inimigo lento) na tecla <b>Q</b>; (2) coloque um chefe no último andar, com barra de vida grande no topo da tela; (3) adicione um <b>baú</b> que dá uma arma melhor (cajado com dano maior e outra cor de orbe); (4) faça os lobos uivarem e atacarem em matilha, avisando os vizinhos quando um vê o mago; (5) desenhe um minimapa, como no capítulo do Labirinto.</div>`,
 code:`// ===== Mago errante: aventura medieval em 1ª pessoa =====
camera.far = 160;
camera.updateProjectionMatrix();
scene.add(camera);                       // o cajado é filho da câmera: ela precisa estar na cena

const R = 0.4, S = 3, ALTURA = 3.2;      // raio do jogador, célula da masmorra, pé-direito
const CUSTO = 6, CURA = 30;              // mana gasta por bola de fogo e pela cura
const rnd = (n) => Math.floor(Math.random() * n);
const rand = (a, b) => a + Math.random() * (b - a);
const caixa = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const Mat = (cor) => new THREE.MeshLambertMaterial({ color: cor });
const Brilho = (cor) => new THREE.MeshBasicMaterial({ color: cor });
function parte(g, geo, cor, x, y, z) {   // cria uma peça (cor ou material) dentro de um grupo
  const m = new THREE.Mesh(geo, typeof cor === 'object' ? cor : Mat(cor));
  m.position.set(x, y, z);
  g.add(m);
  return m;
}

// ---- estado do jogo ----
const J = {};                            // o jogador
const inimigos = [], magias = [], faiscas = [], itens = [];
let mundo = null, profundidade = 0, recuo = 0, andou = 0, mensagem = 0, atirando = false;
function novoJogador() {
  Object.assign(J, { hp: 40, hpMax: 40, mana: 40, manaMax: 40, nivel: 1, xp: 0, prox: 20, vivo: true, cd: 0, cdCura: 0, dor: 0 });
}
novoJogador();

// ---- interface (HUD feito com divs sobre o canvas) ----
function caixaHUD(css, html) {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;pointer-events:none;font:14px system-ui,sans-serif;color:#fff;text-shadow:0 1px 3px #000;' + css;
  if (html) d.innerHTML = html;
  document.body.appendChild(d);
  return d;
}
function criarBarra(cor, topo) {
  const f = caixaHUD('left:12px;top:' + topo + 'px;width:200px;height:14px;background:#0009;border:1px solid #fff7;border-radius:7px;overflow:hidden');
  const d = document.createElement('div');
  d.style.cssText = 'height:100%;background:' + cor;
  f.appendChild(d);
  return d;
}
const infoHUD = caixaHUD('left:12px;top:10px;font-weight:700');
const barraVida = criarBarra('linear-gradient(#ff6060,#b01818)', 34);
const barraMana = criarBarra('linear-gradient(#60b0ff,#1850c0)', 54);
const infoXP = caixaHUD('left:12px;top:74px;font-size:12px');
const mira = caixaHUD('left:50%;top:50%;width:8px;height:8px;margin:-4px;border:2px solid #fff;border-radius:50%;opacity:.7');
const dorHUD = caixaHUD('left:0;top:0;right:0;bottom:0;background:radial-gradient(transparent 40%,#d00 100%);opacity:0');
const msgHUD = caixaHUD('left:0;right:0;top:18%;text-align:center;font:700 28px system-ui;opacity:0;transition:opacity .4s');
caixaHUD('left:0;right:0;bottom:8px;text-align:center;font-size:12px;opacity:.8', 'WASD andar · Shift correr · Clique lança fogo · E cura · Esc pausa');
const tela = caixaHUD('left:0;top:0;right:0;bottom:0;background:#000a;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;line-height:1.7;pointer-events:auto;cursor:pointer');
function msg(t) { msgHUD.textContent = t; msgHUD.style.opacity = 1; mensagem = 2.5; }
function atualizarTela(travado) {                                   // o evento 'lock' chega antes de isLocked mudar: o estado vem por parâmetro
  tela.style.display = travado ? 'none' : 'flex';
  tela.innerHTML = J.vivo
    ? '<div><b style="font-size:32px">Mago errante</b><br>Clique para jogar<br><small>WASD andar · mouse olhar · clique lança fogo · E cura</small></div>'
    : '<div><b style="font-size:32px">Você caiu...</b><br>Nível ' + J.nivel + ' · andar ' + profundidade + '<br>Aperte <b>R</b> para recomeçar</div>';
}

// ---- texturas desenhadas no Canvas (pixel art) ----
function texturaRuido(c1, c2, tam, rep) {
  const c = document.createElement('canvas');
  c.width = c.height = tam;
  const x = c.getContext('2d');
  x.fillStyle = c1; x.fillRect(0, 0, tam, tam);
  x.fillStyle = c2;
  for (let i = 0; i < tam * 3; i++) x.fillRect(rnd(tam), rnd(tam), 2 + rnd(4), 2 + rnd(4));
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rep, rep);
  t.magFilter = THREE.NearestFilter;
  return t;
}
function texturaTijolo() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#1a1512'; x.fillRect(0, 0, 128, 128);                 // argamassa
  for (let j = 0; j < 8; j++) for (let i = -1; i < 4; i++) {
    const g = 60 + rnd(40);
    x.fillStyle = 'rgb(' + (g + 25) + ',' + (g + 5) + ',' + (g - 10) + ')';
    x.fillRect(i * 32 + (j % 2) * 16 + 1, j * 16 + 1, 30, 14);
  }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  return t;
}

// ---- portal de pedra (leva de um mundo ao outro) ----
function criarPortal(x, z, cor) {
  const p = new THREE.Group();
  p.position.set(x, 0, z);
  parte(p, caixa(0.6, 3.6, 0.6), 0x555566, -1.4, 1.8, 0);
  parte(p, caixa(0.6, 3.6, 0.6), 0x555566, 1.4, 1.8, 0);
  parte(p, caixa(3.4, 0.6, 0.7), 0x555566, 0, 3.8, 0);
  const veu = parte(p, new THREE.PlaneGeometry(2.2, 3.5), new THREE.MeshBasicMaterial({ color: cor, transparent: true, opacity: 0.55, side: THREE.DoubleSide }), 0, 1.8, 0);
  const luz = new THREE.PointLight(cor, 1.2, 10);
  luz.position.y = 2;
  p.add(luz);
  p.userData.veu = veu;
  p.lookAt(0, 0, 0);
  return p;
}

// ---- mundo 1: a floresta ----
function construirFloresta() {
  scene.background = new THREE.Color(0x101a30);
  scene.fog = new THREE.Fog(0x101a30, 6, 44);
  const g = new THREE.Group();
  g.add(new THREE.HemisphereLight(0x8fa8ff, 0x203820, 0.8));
  const lua = new THREE.DirectionalLight(0xaab8ff, 0.5);
  lua.position.set(-30, 50, -20);
  g.add(lua);

  const chao = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ map: texturaRuido('#1d4426', '#2f6b39', 128, 70) }));
  chao.rotation.x = -Math.PI / 2;
  g.add(chao);
  parte(g, new THREE.SphereGeometry(7, 16, 12), Object.assign(Brilho(0xfff4cc), { fog: false }), -70, 60, -100);   // lua
  const est = [];
  for (let i = 0; i < 400; i++) {
    const a = rand(0, 6.28), b = rand(0.1, 1.4);
    est.push(Math.cos(a) * Math.cos(b) * 120, Math.sin(b) * 120, Math.sin(a) * Math.cos(b) * 120);
  }
  const geoEst = new THREE.BufferGeometry();
  geoEst.setAttribute('position', new THREE.Float32BufferAttribute(est, 3));
  g.add(new THREE.Points(geoEst, new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, fog: false })));

  const ang = rand(0, 6.28), px = Math.cos(ang) * 30, pz = Math.sin(ang) * 30;
  const portalObj = criarPortal(px, pz, 0xa040ff);
  g.add(portalObj);

  // árvores: três InstancedMesh (tronco + duas copas), todas com a mesma geometria
  const arvores = [];
  for (let i = 0; i < 320; i++) {
    const a = rand(0, 6.28), d = Math.sqrt(Math.random()) * 46, x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (Math.hypot(x, z) < 5 || Math.hypot(x - px, z - pz) < 5) continue;
    arvores.push({ x, z, s: rand(0.8, 1.7) });
  }
  const troncos = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.2, 0.3, 1.6, 6), Mat(0x4a3220), arvores.length);
  const copa1 = new THREE.InstancedMesh(new THREE.ConeGeometry(1.3, 2.6, 7), Mat(0x15401f), arvores.length);
  const copa2 = new THREE.InstancedMesh(new THREE.ConeGeometry(0.9, 1.9, 7), Mat(0x1c5a2a), arvores.length);
  const d = new THREE.Object3D();
  arvores.forEach((a, i) => {
    d.position.set(a.x, 0.8 * a.s, a.z); d.scale.setScalar(a.s); d.updateMatrix(); troncos.setMatrixAt(i, d.matrix);
    d.position.y = 2.5 * a.s; d.updateMatrix(); copa1.setMatrixAt(i, d.matrix);
    d.position.y = 3.6 * a.s; d.updateMatrix(); copa2.setMatrixAt(i, d.matrix);
  });
  g.add(troncos, copa1, copa2);

  const cogu = new THREE.InstancedMesh(new THREE.SphereGeometry(0.14, 8, 6), Brilho(0x55ffe0), 50);
  for (let i = 0; i < 50; i++) {
    const a = rand(0, 6.28), r = rand(4, 38);
    d.position.set(Math.cos(a) * r, 0.1, Math.sin(a) * r); d.scale.set(1, 0.7, 1); d.updateMatrix();
    cogu.setMatrixAt(i, d.matrix);
  }
  g.add(cogu);

  const bloqueado = (x, z, r) => {
    if (x * x + z * z > 38 * 38) return true;                          // borda do mapa
    for (const a of arvores) {
      const dx = x - a.x, dz = z - a.z, m = r + 0.3 * a.s;
      if (dx * dx + dz * dz < m * m) return true;                      // círculo do tronco
    }
    return false;
  };
  return { tipo: 'floresta', nome: 'Floresta sombria', g, bloqueado, inicio: { x: 0, z: 0 }, portal: { x: px, z: pz }, portalObj, chamas: [] };
}

// ---- mundo 2: a masmorra (salas + corredores, como no capítulo Dungeon crawler) ----
function construirDungeon() {
  scene.background = new THREE.Color(0x05060a);
  scene.fog = new THREE.Fog(0x05060a, 3, 26);
  const W = 34, H = 34;
  const grade = Array.from({ length: H }, () => Array(W).fill(1));   // 1 = pedra, 0 = vazio
  const salas = [];
  for (let t = 0; t < 120 && salas.length < 9; t++) {
    const w = 4 + rnd(5), h = 4 + rnd(4), x = 1 + rnd(W - w - 2), z = 1 + rnd(H - h - 2);
    if (salas.some((s) => x < s.x + s.w + 1 && x + w + 1 > s.x && z < s.z + s.h + 1 && z + h + 1 > s.z)) continue;
    for (let j = z; j < z + h; j++) for (let i = x; i < x + w; i++) grade[j][i] = 0;
    salas.push({ x, z, w, h, cx: x + (w >> 1), cz: z + (h >> 1) });
  }
  const cavar = (x1, z1, x2, z2) => {
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) grade[z1][x] = 0;
    for (let z = Math.min(z1, z2); z <= Math.max(z1, z2); z++) grade[z][x2] = 0;
  };
  for (let i = 1; i < salas.length; i++) cavar(salas[i - 1].cx, salas[i - 1].cz, salas[i].cx, salas[i].cz);

  const g = new THREE.Group();
  g.add(new THREE.AmbientLight(0x404060, 0.45));
  const chao = new THREE.Mesh(new THREE.PlaneGeometry(W * S, H * S), new THREE.MeshLambertMaterial({ map: texturaRuido('#3a3a44', '#2a2a32', 128, W * S / 3) }));
  chao.rotation.x = -Math.PI / 2;
  chao.position.set(W * S / 2, 0, H * S / 2);
  g.add(chao);
  const teto = new THREE.Mesh(new THREE.PlaneGeometry(W * S, H * S), Mat(0x15151a));
  teto.rotation.x = Math.PI / 2;
  teto.position.set(W * S / 2, ALTURA, H * S / 2);
  g.add(teto);

  const solido = (x, z) => {
    const i = Math.floor(x / S), j = Math.floor(z / S);
    return i < 0 || j < 0 || i >= W || j >= H || grade[j][i] === 1;
  };
  const celulas = [];                                                // só as paredes que encostam em espaço vazio
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    if (grade[j][i] !== 1) continue;
    let borda = false;
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      const a = grade[j + dj] && grade[j + dj][i + di];
      if (a === 0) borda = true;
    }
    if (borda) celulas.push([i, j]);
  }
  const paredes = new THREE.InstancedMesh(caixa(S, ALTURA, S), new THREE.MeshLambertMaterial({ map: texturaTijolo() }), celulas.length);
  const d = new THREE.Object3D();
  celulas.forEach(([i, j], k) => {
    d.position.set((i + 0.5) * S, ALTURA / 2, (j + 0.5) * S); d.updateMatrix(); paredes.setMatrixAt(k, d.matrix);
  });
  g.add(paredes);

  const chamas = [];                                                 // braseiros nos cantos das salas
  salas.forEach((s, i) => {
    const bx = s.x * S + 0.5, bz = s.z * S + 0.5;
    parte(g, new THREE.CylinderGeometry(0.06, 0.08, 1.2, 6), 0x3a2a1a, bx, 0.6, bz);
    chamas.push(parte(g, new THREE.ConeGeometry(0.16, 0.45, 6), Brilho(0xffa030), bx, 1.4, bz));
    if (i < 6) { const l = new THREE.PointLight(0xff9a40, 0.9, 11); l.position.set(bx, 1.6, bz); g.add(l); }
  });

  const ult = salas[salas.length - 1], px = (ult.cx + 0.5) * S, pz = (ult.cz + 0.5) * S;
  const portalObj = criarPortal(px, pz, 0x40d0ff);
  g.add(portalObj);

  const bloqueado = (x, z, r) => solido(x - r, z - r) || solido(x + r, z - r) || solido(x - r, z + r) || solido(x + r, z + r);
  return { tipo: 'dungeon', nome: 'Masmorra · andar ' + profundidade, g, bloqueado, salas, inicio: { x: (salas[0].cx + 0.5) * S, z: (salas[0].cz + 0.5) * S }, portal: { x: px, z: pz }, portalObj, chamas };
}

// ---- criaturas: cada uma é um grupo de caixas e esferas ----
function construirSlime() {
  const g = new THREE.Group();
  const corpo = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), new THREE.MeshLambertMaterial({ color: 0x44dd66, transparent: true, opacity: 0.85 }));
  corpo.scale.y = 0.75; corpo.position.y = 0.38;
  g.add(corpo);
  for (const sx of [-1, 1]) {

// ---- trocar de mundo ----

// ---- efeitos, magias e combate ----
const faiscaGeo = new THREE.SphereGeometry(0.07, 6, 4), matsFx = {};

{t:"Zelda-like: sala por sala",
 lead:"Câmera de cima, espada, corações, chaves e portas que se fecham: uma masmorra de salas ligadas, como nos Zelda clássicos.",
 txt:`<p>Os primeiros <i>Zelda</i> não têm um mundo rolando: o jogo é feito de <b>telas</b>. Cada sala é um retângulo que cabe inteiro na tela, e ao passar por uma porta a câmera <b>desliza</b> para a sala vizinha. Aqui fazemos o mesmo em 3D: a masmorra tem <b>3×2 salas</b> de <b>13×9 células</b>, vista de cima e de um pouco de frente, com o herói de gorro verde, espada, escudo e corações.</p>
 <p><b>O mapa é texto.</b> O interior de cada sala (11×7) é um vetor de strings: <code>#</code> é pilar, <code>S</code> slime, <code>E</code> esqueleto, <code>H</code> recipiente de coração e <code>C</code> o baú. A função que monta o mundo lê essas letras, preenche uma <b>grade única</b> <code>g[z][x]</code> (<code>1</code> parede, <code>0</code> chão, como no <i>Dungeon crawler</i>) e cria os inimigos e itens. Para desenhar uma sala nova, basta editar as strings. A lista <code>LIGACOES</code> diz quais salas têm porta entre elas.</p>
 <p><b>Movimento livre, colisão em grade.</b> Diferente do <i>Dungeon crawler</i>, o herói não anda de célula em célula: a posição é contínua (<code>x</code>, <code>z</code> decimais) e a função <code>bloqueado(x, z, r)</code> testa quais células o círculo do herói toca. Cada eixo é movido separadamente, então ele <b>desliza</b> nas paredes, a mesma técnica do <i>RPG de mago</i>. Quando alguém apanha, ganha um <b>empurrão</b> (<code>kx</code>, <code>kz</code>) que vai perdendo força a cada quadro.</p>
 <p><b>O golpe tem três tempos.</b> Um bom golpe de espada não é um giro uniforme: tem <b>preparação</b> (a lâmina vai para trás, 20% do tempo), <b>golpe</b> (rápido, 30%) e <b>recuperação</b> (volta devagar ao repouso, 50%). A função <code>anguloEspada(p, dir, giro)</code> recebe o progresso <code>p</code> (de 0 a 1) e devolve o ângulo do pivô, usando <code>suave()</code>, uma curva que começa veloz e freia no fim. Só a fase do golpe <b>machuca</b>: o dano é calculado por <b>distância e ângulo</b> (a menos de 1,5 do herói e a menos de 1,3 rad de onde ele olha), e um <code>Set</code> (<code>acertados</code>) garante <b>um acerto por inimigo por golpe</b>. Durante o golpe o herói <b>fica parado</b> (a velocidade vira 0, só o empurrão de um inimigo ainda o move), e o corpo gira um pouco junto com a lâmina.</p>
 <p><b>Combo de três golpes.</b> Apertar Z de novo no fim da recuperação encadeia o próximo golpe (o pedido fica guardado por 0,25 s, o <code>buffer</code>). O 2º golpe volta no <b>sentido contrário</b> e o 3º é um <b>giro</b> de quase 360°, mais demorado, que acerta em volta toda, dá <b>2 de dano</b> e empurra mais. Se você parar por mais de 0,45 s, o combo recomeça.</p>
 <p><b>Sensação de impacto.</b> Um <b>rastro</b> (<code>RingGeometry</code> achatada, recriada a cada quadro com o arco já percorrido) acompanha a lâmina e some na recuperação. Ao acertar, saem <b>faíscas</b> (cubinhos com velocidade e gravidade), o jogo congela por 0,06 s (<b>hit-stop</b>) e a câmera <b>treme</b> um pouco (<code>tremor</code>, que decai rápido). Esses três truques juntos fazem a espada parecer pesada, mesmo sem nenhuma animação de modelo.</p>
 <p><b>Portas que pensam.</b> Cada ligação cria <b>duas portas</b>, uma em cada sala, ligadas pelo campo <code>par</code>. Uma porta está fechada se estiver <b>trancada</b> (precisa de chave) ou <b>selada</b>: toda sala com inimigos vivos fecha as portas assim que o herói chega ao interior dela, como nos jogos clássicos. O teste <code>entrou</code> evita prender o herói dentro da própria porta. Só a <b>última criatura</b> da Cripta solta a chave; ao encostar numa porta dourada com a chave, as duas metades abrem.</p>
 <p><b>Só a sala atual vive.</b> Slimes <b>pulam</b> em direção ao herói a cada 0,9 a 1,6 s; esqueletos <b>perseguem</b> sem parar se o enxergam e vagueiam se não, como as criaturas do <i>RPG de mago</i>. Inimigos de outras salas ficam <b>congelados e invisíveis</b>. A câmera não segue o herói: o ponto de foco (<code>camFoco</code>) usa <code>lerp</code> até o centro da sala atual, e <b>enquanto ele desliza o jogo congela</b>, o clássico efeito de troca de tela.</p>
 <div class="note"><b>Controles:</b> <b>clique no preview</b> para dar foco. <b>WASD</b> ou setas andam, <b>Z</b> usa a espada e abre o baú (<b>aperte em sequência</b> para o combo de 3 golpes, o último é um giro), <b>R</b> reinicia. <b>Objetivo:</b> limpe a Cripta (sala do canto superior direito) para pegar a chave, volte ao Salão (centro de baixo), abra a porta dourada e encontre o baú do Triforce. Os corações extras ficam no Santuário.</div>
 <div class="note tip"><b>Desafios:</b> (1) crie um <b>bloco empurrável</b> (<code>B</code> no mapa) que o herói move ao encostar e que tampa um interruptor no chão; (2) adicione um <b>arco</b> no baú do Santuário, com flechas que voam em linha reta e usam <code>bloqueado</code> para parar nas paredes; (3) faça um <b>chefe</b> na sala do Tesouro, com barra de vida e padrão de ataque; (4) coloque <b>vasos</b> que quebram com a espada e podem soltar corações; (5) desenhe no minimapa também as portas, mostrando as trancadas em dourado; (6) crie uma sala <b>escura</b> que só se vê perto da lanterna; (7) adicione um <b>golpe carregado</b>: segurar Z enche uma barra e, ao soltar, faz o giro de uma vez; (8) deixe o rastro com cor diferente em cada golpe do combo.</div>`,

  d3.position.set(x + 0.5, -0.1, z + 0.5); d3.updateMatrix();

const lerp = (a, b, t) => a + (b - a) * t;

// ---- interface: corações, chaves, minimapa e avisos ----

let avisoT = 0, hudChave = '';

// ---- combate ----
function celulaLivre(x, z) {              // célula de chão mais próxima do ponto (o centro pode cair num pilar)

    if (d <= passo) { p.x = a.x; p.z = a.z; e.alvo++; e.dist += d; passo -= d; }
    else { p.x += (dx / d) * passo; p.z += (dz / d) * passo; e.dist += passo; passo = 0; }
  }
  return e.alvo >= ROTA.length;        // true = chegou ao fim da rota
}

// ---- torres
const matBase = new THREE.MeshStandardMaterial({ color: 0x475569 });
const matNivel = NIVEIS.map((n) => new THREE.MeshStandardMaterial({ color: n.cor, emissive: n.cor, emissiveIntensity: 0.25 }));
const geoBase = new THREE.CylinderGeometry(0.34, 0.42, 0.3, 16);
const geoCab = new THREE.SphereGeometry(0.26, 16, 12);

const geoTiro = new THREE.SphereGeometry(0.1, 8, 8);
const matTiro = new THREE.MeshBasicMaterial({ color: 0xfff3b0 });

function melhorar(t, nivel) {
  t.nivel = nivel;

}
function criarTorre(c, r) {
  const g = new THREE.Group(), cab = new THREE.Group();

  base.position.y = 0.15;
  const corpo = new THREE.Mesh(geoCab, matNivel[0]);
  const cano = new THREE.Mesh(geoCano, matBase);
  cano.position.z = 0.28;
  cab.position.y = 0.55;
  cab.add(corpo, cano);
  g.add(base, cab);
  g.position.copy(centro(c, r));
  scene.add(g);
  torres[c + ',' + r] = { c, r, g, cab, corpo, nivel: 0, cd: 0 };
}

// ---- mouse -> célula: o raio da câmera cruza o plano do chão (y = 0)
const ray = new THREE.Raycaster(), chao = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const ponto = new THREE.Vector3(), mouse = new THREE.Vector2();

  if (!ray.ray.intersectPlane(chao, ponto)) return null;
  const c = Math.floor(ponto.x + COLS / 2), r = Math.floor(ponto.z + LINS / 2);

    ouro -= NIVEIS[0].custo;
    criarTorre(s.c, s.r);

});

const cursor = new THREE.Mesh(new THREE.BoxGeometry(0.98, 0.04, 0.98), new THREE.MeshBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.55 }));
const anel = new THREE.Mesh(new THREE.RingGeometry(0.97, 1, 64), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, side: THREE.DoubleSide }));
anel.rotation.x = -Math.PI / 2;

// ---- ondas
function iniciarOnda() {
  onda++;

  gerados = 0;
  espera = 0;

}
function reiniciar() {
  Object.keys(torres).forEach((k) => { scene.remove(torres[k].g); delete torres[k]; });

  tiros.forEach((s) => scene.remove(s.m)); tiros.length = 0;

const clock = new THREE.Clock();

        s.m.position.y += (dy / d) * 12 * dt;
        s.m.position.z += (dz / d) * 12 * dt;

    if (modo === 'onda' && fila === 0 && !inimigos.length && !fim) {   // onda vencida

  if (fim) txt += '<br>' + fim + ' (R reinicia)';
  else if (msgT > 0) txt += '<br><span style="' + sub + '">' + msg + '</span>';
  else if (modo === 'preparo') txt += '<br><span style="' + sub + '">Espaço chama a onda ' + (onda + 1) + '</span>';
  hud.innerHTML = txt;

  renderer.render(scene, camera);
});`},
{t:"Battle Tanks",
 lead:"Uma arena plana, blocos que racham a tiros, inimigos que contornam paredes com A* e um minimapa desenhado por uma segunda câmera.",
 txt:`<p>Em <b>Battle Tanks</b> juntam-se três ideias num jogo só: a <b>grade</b> com blocos que podem ser destruídos (como no <i>Breakout 3D</i>, no <i>Sandbox de blocos</i> e no <i>Tower defense</i>), a busca de caminho que você viu com BFS, agora evoluída para <b>A*</b>, e um <b>minimapa</b>, que antes era um desenho 2D, agora desenhado por uma segunda câmera. A arena é plana: tudo acontece no plano <code>XZ</code>, sem altura nem relevo. Ela nasce de um <b>mapa de texto</b> (<code>MAPA</code>), em que cada caractere é uma célula de 1×1: <code>#</code> é aço (indestrutível), <code>B</code> é um bloco destrutível, <code>P</code> é você e <code>E</code> é um inimigo. Para trocar a fase, é só editar o texto. O jogo guarda a arena em <code>grade[linha][coluna]</code> (0 livre, 1 bloco, 2 aço) e, para cada bloco, a malha e a vida em <code>blocos</code>. As funções <code>centro</code>, <code>colDe</code> e <code>linDe</code> convertem entre célula e posição no mundo, como no tower defense.</p>
<p><b>O tanque.</b> Cada tanque é um <code>Group</code> com duas partes que giram <b>separadas</b>: o <code>corpo</code> (casco e esteiras) aponta para onde o tanque anda (<code>rumo</code>) e a <code>torre</code> aponta para onde ele mira (<code>mira</code>). Você anda com <b>WASD</b> em relação à tela e mira com o <b>mouse</b>: o raio do mouse cruza um plano na altura da torre (<code>intersectPlane</code>, como no capítulo 8) e <code>Math.atan2</code> dá o ângulo. A <b>colisão</b> é de círculo contra célula: para cada célula sólida por perto, <code>bate</code> acha o ponto dela mais próximo do centro do tanque e compara a distância com o raio. O movimento é feito <b>um eixo por vez</b>, e por isso o tanque escorrega nas paredes em vez de grudar nelas.</p>
<p><b>Tiros e blocos destrutíveis.</b> Cada tiro é uma bolinha em linha reta. A cada quadro ele anda em <b>dois meio-passos</b> (assim, mesmo rápido, não atravessa um bloco) e olha a célula onde está: se for aço, o tiro some; se for bloco, <code>vida--</code> e o material troca para uma cor mais escura (<code>matBloco[vida]</code>); ao chegar a zero, o bloco some. Como o mundo é só uma tabela de números, <b>destruir é escrever 0</b> em <code>grade[l][c]</code>: a colisão e o A* enxergam a nova passagem no quadro seguinte, e <code>gradeMudou</code> avisa os inimigos para refazerem suas rotas. As explosões são cubinhos com <b>gravidade</b>, que fazem arcos e encolhem. Um tiro não acerta o tanque do próprio time.</p>
<p><b>A*.</b> A busca em largura (BFS) explora a grade igualmente em todas as direções. O <b>A*</b> a direciona: ele sempre expande o nó aberto de menor <code>f = custo até aqui + estimativa até o destino</code>. A estimativa (<code>heur</code>) é a distância com diagonais, que nunca passa do custo real, e por isso o primeiro caminho que chega ao destino é o mais curto. Os nós visitados vão para <code>fechado</code>, e o mapa <code>pai</code> guarda de onde se veio, para <b>reconstruir</b> a rota de trás para frente. A busca anda em <b>8 direções</b>, mas uma diagonal é proibida se um dos dois vizinhos laterais for sólido: sem essa regra o tanque "cortaria" a quina de um bloco. As células onde há outro inimigo custam +3, então os inimigos tendem a se espalhar em vez de formar fila. Numa grade pequena como esta, procurar o menor <code>f</code> na lista inteira é suficiente; mapas grandes pedem um <b>heap binário</b>.</p>
<p><b>A IA do inimigo.</b> Cada inimigo escolhe, a cada quadro, entre três comportamentos. <b>Patrulhar</b>: sorteia uma célula livre por perto, acha a rota com o A* e a segue; ao chegar, espera um instante e sorteia outra. <b>Perseguir</b>: quando a distância até você fica abaixo de <code>RAIO_PERSEGUIR</code>, a rota passa a ir até a sua célula, recalculada a cada <code>REFAZER_ROTA</code> segundos e sempre que um bloco cai. Para o inimigo não "piscar" entre perseguir e patrulhar na borda do raio, ele só desiste quando você passa de 1,25 vezes o raio (<b>histerese</b>). <b>Atirar</b>: <code>linhaLivre</code> caminha pela grade em passos de 0,25 e diz se há algum bloco entre os dois; com a linha livre, a torre gira até você e o tiro sai, com um pequeno erro de pontaria. Dentro de <code>DIST_PARAR</code> o inimigo para de andar e só atira. Aperte <b>P</b> para ver as rotas do A*: <b>vermelha</b> quando está perseguindo e <b>azul</b> quando está patrulhando.</p>
<p><b>Minimapa e HUD.</b> Cada quadro é desenhado <b>duas vezes</b>. A primeira usa a câmera de jogo, que segue você. A segunda usa a câmera do minimapa, uma <code>OrthographicCamera</code> que enxerga a arena inteira de cima, e só num retângulo do canto: <code>setViewport(x, y, w, h)</code> limita onde se desenha, e <code>setScissor</code> com <code>setScissorTest(true)</code> limita também a <b>limpeza</b> da tela, para a segunda passada não apagar a primeira. Cuidado: o eixo Y do viewport começa <b>embaixo</b>, e as medidas são em pixels CSS. Os ícones dos tanques (discos coloridos acima de cada um) ficam na <b>camada 1</b> (<code>layers.set(1)</code>): a câmera de jogo só enxerga a camada 0, e a do minimapa liga a camada 1 com <code>layers.enable(1)</code>. As sombras já foram calculadas na primeira passada, então desligamos <code>shadowMap.autoUpdate</code> na segunda. O <b>HUD</b> é HTML por cima do canvas: a barra de vida muda de verde para amarelo e vermelho, a fina barra azul mostra a recarga do canhão, e uma moldura <code>div</code> do mesmo tamanho contorna o minimapa.</p>
<div class="note"><b>Controles:</b> <b>clique no preview</b> para dar foco. <b>WASD</b> ou as setas andam e o <b>mouse</b> mira. <b>Clique</b> (ou segure) ou <b>Espaço</b> atira. Esconda-se atrás dos blocos: eles racham em 3 tiros, e o aço nunca cai. <b>P</b> mostra ou esconde as rotas do A*, e <b>R</b> recomeça. Você tem 100 de vida e cada inimigo aguenta 3 tiros seus. Destrua os 3 inimigos para vencer.</div>
<div class="note tip"><b>Desafios:</b> (1) mude <code>RAIO_PERSEGUIR</code> (3 e 20), <code>DIST_PARAR</code> e <code>RECARGA_INIMIGO</code> e veja o que cada um faz com a dificuldade; (2) troque a lista <code>aberto</code> por um <b>heap binário</b> e meça o tempo do <code>achar</code> num mapa 100×100; (3) <b>caixas de reparo</b> espalhadas pela arena que somam vida ao serem pegas; (4) tiros que <b>ricocheteiam</b> uma vez no aço, refletindo <code>vx</code> ou <code>vz</code>; (5) quando não houver caminho, trate os blocos como células <b>caras</b> (e não sólidas) e faça o inimigo atirar no bloco que bloqueia a rota; (6) <b>ondas</b>: ao vencer, recomece com mais inimigos e mais vida; (7) <b>névoa de guerra</b> no minimapa, mostrando só os inimigos a menos de 12 células; (8) troque os blocos de aço por um <code>InstancedMesh</code> (veja o capítulo 37) e compare os desenhos por quadro em <code>renderer.info.render.calls</code>; (9) um <b>tiro de artilharia</b> com arco: a bala sobe e cai com gravidade e passa por cima dos blocos.</div>`,
