  renderer.render(scene, camera);
});`},
{t:"Raymarching",
 lead:"Fractais 3D sem nenhum triângulo: cada pixel lança um raio e a GPU caminha por ele até achar a superfície.",
 txt:`<p>Continuação da <i>Galeria de shaders</i>. Aqui não há malha: a cena é um <b>quadrado de tela cheia</b> e o <i>fragment shader</i> descobre, pixel a pixel, o que o olho veria. O objeto é descrito por uma função, a <b>SDF</b> (<i>signed distance function</i>): dado um ponto no espaço, ela devolve a distância até a superfície mais próxima (negativa se o ponto estiver dentro). Com ela, o <b>raymarching</b> (ou <i>sphere tracing</i>) funciona assim: parta da câmera, pergunte a distância <code>d</code> e avance <code>d</code> ao longo do raio, porque nesse passo nada pode ser atravessado. Repita até <code>d</code> ficar minúsculo (acertou) ou o raio sair da cena.</p>
<p><b>1 · Mandelbulb.</b> É o \"Mandelbrot em 3D\": a iteração <code>z → z<sup>n</sup> + p</code> feita com <b>coordenadas esféricas</b> (o ponto vira raio, ângulo <code>θ</code> e ângulo <code>φ</code>; elevar à potência <code>n</code> multiplica os ângulos). Para andar com segurança precisamos de uma <b>estimativa de distância</b>: acompanhamos a derivada <code>dr</code> junto com <code>z</code> e devolvemos <code>0.5 · log(r) · r / dr</code>. O <code>trap</code> guarda o menor <code>r</code> visto nas iterações (uma <i>orbit trap</i>) e vira a cor.</p>
<p><b>2 · Esponja de Menger.</b> Comece com um cubo e, em cada nível, fure uma \"cruz\" no meio de cada face e de cada cubo restante. A SDF faz isso com <code>mod(p * s, 2.0) - 1.0</code>, que <b>repete o espaço</b> em células cada vez menores (<code>s</code> triplica a cada iteração), e <code>max(d, -cruz)</code> para subtrair o furo. Com 4 iterações já são 20<sup>4</sup> = 160 mil cubinhos, e o shader não guarda nenhum deles.</p>
<p><b>Como não pesar no hardware.</b> Raymarching é caro por natureza (dezenas de chamadas da SDF por pixel), então este capítulo usa cinco truques: (1) <b>resolução menor</b>: <code>renderer.setPixelRatio(0.5)</code> desenha só um quarto dos pixels e o navegador estica a imagem; (2) <b>desenhar sob demanda</b>: o laço só chama <code>render</code> quando a câmera ou um slider muda (parado, a GPU descansa); (3) <b>esfera limite</b>: raios que não tocam a esfera ao redor do fractal terminam na hora, e os outros já começam na entrada dela; (4) <b>poucos passos e tolerância que cresce com a distância</b> (<code>0.0006 · t</code>), já que longe ninguém vê detalhe de um pixel; (5) <b>oclusão ambiente de graça</b>: o número de passos gasto num pixel diz o quanto ele está \"apertado\", então escurecemos pelos passos em vez de lançar raios de sombra.</p>
<div class="note"><b>Dica:</b> a câmera é a do Three.js. O shader recebe <code>camera.position</code>, <code>camera.matrixWorld</code> e <code>camera.projectionMatrixInverse</code> como uniforms (referências vivas) e reconstrói o raio de cada pixel. Por isso o <code>OrbitControls</code> funciona como em qualquer outro capítulo.</div>
<div class="note tip"><b>Experimente:</b> (1) no Mandelbulb, leve a <b>potência</b> de 8 para 3 e para 12; (2) reduza as <b>iterações</b> para 2 e veja o fractal virar uma casca lisa; (3) suba a <b>resolução</b> para 1 só depois de escolher o ângulo; (4) na esponja, passe de 1 para 4 <b>iterações</b>; (5) abra <code>{ } GLSL</code> e troque <code>0.9</code> (o fator do passo) por <code>1.0</code>: ganha velocidade e aparecem furos.</div>
<div class="note tip"><b>Desafios:</b> (1) <b>sombra suave</b>: lance um segundo raio até a luz e use o menor <code>d / distância</code> visto; (2) um slider de <b>corte</b> na esponja, com <code>d = max(d, p.x - corte)</code>, para ver o interior; (3) <b>resolução adaptativa</b>: pixelRatio 0.3 enquanto o usuário arrasta e 0.8 quando soltar; (4) outro fractal, como a <b>esponja de Sierpinski</b> (tetraedro) ou o <b>Mandelbox</b>; (5) uma SDF simples de <b>esferas repetidas</b> com <code>mod</code> e <b>união suave</b> (<code>smin</code>); (6) animar a potência do Mandelbulb com o tempo (repare no custo: agora a GPU não descansa mais).</div>`,
 code:`// ===== Raymarching: Mandelbulb e esponja de Menger =====
// Nenhum triângulo: um quadrado de tela cheia e um fragment shader que lança um raio por pixel.
// Leve de propósito: pixels pela metade, desenha só quando algo muda, esfera limite e poucos passos.

const NL = String.fromCharCode(10);
const juntar = (linhas) => linhas.join(NL);

renderer.setPixelRatio(0.5);                     // a GPU calcula 1/4 dos pixels; o navegador estica
renderer.setSize(innerWidth, innerHeight);
scene.background = null;

camera.position.set(1.9, 1.1, 2.3);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 1.6;
controls.maxDistance = 8;
controls.autoRotateSpeed = 1.2;

// ---------- GLSL ----------
const VS = juntar([
  'varying vec2 vUv;',
  'void main() {',
  '  vUv = uv;',
  '  gl_Position = vec4(position.xy, 0.0, 1.0);   // quadrado que cobre a tela inteira',
  '}'
]);

const CABECALHO = juntar([
  'varying vec2 vUv;',
  'uniform vec3 uPos;          // posicao da camera',
  'uniform mat4 uInvProj;      // projecao inversa: pixel -> direcao na camera',
  'uniform mat4 uCam;          // matriz do mundo da camera: gira a direcao',
  'uniform float uIter;        // iteracoes do fractal',
  'uniform float uPot;         // potencia do Mandelbulb',
  'uniform float uPassos;      // maximo de passos do raio',
  'uniform float uRaio;        // raio da esfera limite',
  'uniform float uCor;         // deslocamento da paleta',
  'float trap;                 // cor vinda da iteracao (orbit trap)',
  'vec3 pal(float x) {',
  '  return 0.5 + 0.5 * cos(6.2831 * (x + vec3(0.0, 0.33, 0.67)));',
  '}'
]);

// SDF do Mandelbulb: estimativa de distancia 0.5 * log(r) * r / dr
const DE_BULB = juntar([
  'float de(vec3 p) {',
  '  vec3 z = p;',
  '  float dr = 1.0;',
  '  float r = 0.0;',
  '  trap = 10.0;',
  '  for (int i = 0; i < 10; i++) {',
  '    if (float(i) >= uIter) break;',
  '    r = length(z);',
  '    if (r > 2.0) break;',
  '    trap = min(trap, r);',
  '    float th = acos(clamp(z.z / r, -1.0, 1.0)) * uPot;',
  '    float ph = atan(z.y, z.x) * uPot;',
  '    dr = pow(r, uPot - 1.0) * uPot * dr + 1.0;',
  '    z = pow(r, uPot) * vec3(sin(th) * cos(ph), sin(th) * sin(ph), cos(th)) + p;',
  '  }',
  '  return 0.5 * log(r) * r / dr;',
  '}'
]);

// SDF da esponja de Menger: cubo menos cruzes, em escalas 1, 1/3, 1/9...
const DE_MENGER = juntar([
  'float de(vec3 p) {',
  '  vec3 q = abs(p) - vec3(1.0);',
  '  float d = length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);   // cubo',
  '  float s = 1.0;',
  '  trap = 0.0;',
  '  for (int m = 0; m < 4; m++) {',
  '    if (float(m) >= uIter) break;',
  '    vec3 a = mod(p * s, 2.0) - 1.0;        // repete o espaco em celulas menores',
  '    s *= 3.0;',
  '    vec3 r = abs(1.0 - 3.0 * abs(a));',
  '    float c = (min(max(r.x, r.y), min(max(r.y, r.z), max(r.z, r.x))) - 1.0) / s;   // a cruz',
  '    if (c > d) { d = c; trap = float(m + 1) / 4.0; }                              // d = max(d, c)',
  '  }',
  '  return d;',
  '}'
]);

const MARCHA = juntar([
  'void main() {',
  '  vec2 ndc = vUv * 2.0 - 1.0;',
  '  vec3 v = (uInvProj * vec4(ndc, 1.0, 1.0)).xyz;',
  '  vec3 rd = normalize((uCam * vec4(v, 0.0)).xyz);   // direcao do raio deste pixel',
  '  vec3 ro = uPos;',
  '  vec3 fundo = mix(vec3(0.02, 0.03, 0.07), vec3(0.10, 0.12, 0.22), 0.5 + 0.5 * rd.y);',
  '',
  '  // esfera limite: raio que erra a esfera nem entra no laco',
  '  float b = dot(ro, rd);',
  '  float h = b * b - (dot(ro, ro) - uRaio * uRaio);',
  '  if (h < 0.0) { gl_FragColor = vec4(pow(fundo, vec3(0.4545)), 1.0); return; }',
  '  float raiz = sqrt(h);',
  '  float t = max(-b - raiz, 0.0);       // ja comeca na entrada da esfera',
  '  float tmax = -b + raiz;',
  '',
  '  float passos = 0.0;',
  '  bool acertou = false;',
  '  for (int i = 0; i < 96; i++) {',
  '    if (float(i) >= uPassos) break;',
  '    float d = de(ro + rd * t);',
  '    if (d < 0.0006 * t) { acertou = true; break; }   // tolerancia cresce com a distancia',
  '    t += d * 0.9;                                    // 0.9: margem contra estimativas otimistas',
  '    passos += 1.0;',
  '    if (t > tmax) break;',
  '  }',
  '',
  '  vec3 col = fundo;',
  '  if (acertou) {',
  '    float cor = trap;                                // guardado pela ultima chamada de de()',
  '    vec3 p = ro + rd * t;',
  '    float e = 0.0015 * t;',
  '    vec2 k = vec2(1.0, -1.0);',
  '    vec3 n = normalize(k.xyy * de(p + k.xyy * e) + k.yyx * de(p + k.yyx * e) +',
  '                       k.yxy * de(p + k.yxy * e) + k.xxx * de(p + k.xxx * e));   // gradiente da SDF',
  '    float dif = clamp(dot(n, normalize(vec3(0.6, 0.8, 0.5))), 0.0, 1.0);',
  '    float amb = 0.5 + 0.5 * n.y;',
  '    float ao = clamp(1.0 - 1.4 * passos / uPassos, 0.0, 1.0);   // oclusao pelos passos gastos',
  '    col = pal(uCor + 0.6 * cor) * (0.25 + 0.85 * dif) * (0.4 + 0.6 * amb) * (0.25 + 0.75 * ao);',
  '    col = mix(col, fundo, 1.0 - exp(-0.015 * t * t));          // neblina leve',
  '  }',
  '  gl_FragColor = vec4(pow(col, vec3(0.4545)), 1.0);',
  '}'
]);

const FS_BULB = juntar([CABECALHO, DE_BULB, MARCHA]);
const FS_MENGER = juntar([CABECALHO, DE_MENGER, MARCHA]);

// ---------- o quadrado de tela cheia ----------
// os uniforms guardam referências vivas da câmera: o Three.js as atualiza sozinho
const U = {
  uPos: { value: camera.position },
  uInvProj: { value: camera.projectionMatrixInverse },
  uCam: { value: camera.matrixWorld },
  uIter: { value: 6 }, uPot: { value: 8 }, uPassos: { value: 48 },
  uRaio: { value: 1.4 }, uCor: { value: 0.1 }
};
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
quad.frustumCulled = false;
scene.add(quad);

let sujo = true;      // só redesenha quando algo mudou

const RES = { n: 'resolução', min: 0.25, max: 1, passo: 0.05, v: 0.5,
  fn: (v) => { renderer.setPixelRatio(v); renderer.setSize(innerWidth, innerHeight); sujo = true; } };

const slides = [
  { nome: 'Mandelbulb', fs: FS_BULB, raio: 1.4,
    desc: 'Mandelbrot em 3D: z → z^n + p com coordenadas esféricas. A estimativa de distância usa a derivada dr. Potência 8 é o clássico; as iterações dão o detalhe.',
    sliders: [
      { n: 'potência', min: 2, max: 12, passo: 0.1, v: 8, fn: (v) => { U.uPot.value = v; } },

  { nome: 'Esponja de Menger', fs: FS_MENGER, raio: 1.8,

slides.forEach((s) => {

// ---------- interface ----------
const css = document.createElement('style');
css.textContent =
  '#tabs{position:fixed;top:6px;left:6px;right:6px;display:flex;flex-wrap:wrap;gap:4px;font:600 12px system-ui,sans-serif}' +

  '#base .row{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;align-items:center;font-weight:600;font-size:12px}' +

{t:"Água: ondas e reflexo",
 lead:"Ondas que empurram os vértices, um reflexo feito por uma câmera virtual, o efeito Fresnel e espuma nas cristas e na praia: um mar com ilha, barco e pôr do sol.",
 txt:`<p>Água não é uma textura: é uma <b>malha que se mexe</b> mais um <b>shader que decide a cor de cada pixel</b>. Neste capítulo juntamos quatro ideias: ondas que empurram os vértices, um reflexo feito por uma câmera virtual, o efeito Fresnel que mistura reflexo e cor, e espuma desenhada onde as ondas se espremem e onde o mar bate na praia.</p>
<p><b>Ondas de Gerstner.</b> Uma onda de seno puro só sobe e desce, e o resultado são colinas redondas e moles. Na onda de Gerstner cada ponto também anda um pouco na horizontal, em círculos: a altura é <code>A·sen(k·(d·p) − ω·t)</code> e o deslocamento horizontal é <code>Q·A·d·cos(k·(d·p) − ω·t)</code>, em que <code>d</code> é a direção da onda, <code>k = 2π/comprimento</code> e <code>A</code> é a amplitude. Como os pontos se aproximam sob a crista e se afastam no vale, as cristas ficam finas e os vales largos, como no mar de verdade. A frequência <code>ω = √(g·k)</code> faz as ondas longas correrem mais depressa que as curtas. O capítulo soma <b>4 ondas</b> de direções e tamanhos diferentes: nenhuma sozinha parece mar, a soma sim.</p>
<p><b>Normal sem derivar.</b> Para a luz precisamos da normal de cada ponto. Como a onda é uma fórmula, a normal sai da própria soma, <code>n = (−Σ d.x·k·A·cos, 1 − Σ Q·k·A·sen, −Σ d.y·k·A·cos)</code>, sem olhar os vértices vizinhos. O parâmetro <code>Q</code> controla o quão pontuda é a crista; se a soma de <code>Q·k·A</code> passa de 1, as cristas fazem laço. Por isso o código usa <code>Q = choppy / (k·A·4)</code>: a soma fica sempre igual a <code>choppy</code>, que é menor que 1. A tecla <b>3</b> muda <code>amp</code> e <code>choppy</code> juntos, de calmo a tempestade.</p>
<p><b>Reflexo: uma câmera embaixo da água.</b> É a mesma ideia do capítulo <i>Espelho e câmera</i>, agora com um plano horizontal. A cena é desenhada numa <code>WebGLRenderTarget</code> por uma câmera na posição refletida <code>(x, −y, z)</code>, olhando para o ponto refletido, com o "cima" invertido. No shader, <code>texMat = BIAS · projeção · visão</code> da câmera virtual leva cada ponto da água até o pixel certo dessa foto. Dois cuidados: a água fica <b>invisível</b> durante esse passe (senão ela leria a própria textura), e <code>renderer.clippingPlanes</code> corta tudo abaixo da superfície, senão o pedaço submerso da ilha apareceria no "espelho". A foto usa metade da resolução da tela e é entortada pela normal (<code>N.xz * 0.04</code>), o que dá o tremido do reflexo.</p>
<p><b>Fresnel: quando é espelho e quando é vidro.</b> De cima vemos a cor da água; olhando quase rente à superfície, ela vira um espelho. A aproximação de Schlick resume isso numa linha: <code>F = 0.03 + 0.97·(1 − N·V)⁵</code>. O pixel final é <code>mix(corDaÁgua, reflexo, F)</code>. A cor da água vai do azul profundo ao verde-água raso conforme a distância até a ilha, e as cristas ganham um brilho esverdeado quando o sol está atrás delas (um truque barato para luz atravessando a água). O brilho branco do sol é um <code>pow(N·H, 350)</code>.</p>
<p><b>Espuma.</b> Há duas fontes. <b>Cristas:</b> a soma <code>Σ Q·k·A·sen</code> já calculada para a normal mede o quanto os pontos estão espremidos; onde ela passa de um limiar (no mar agitado passa mais vezes), desenhamos branco, quebrado por ruído (<code>fbm</code>) para não virar uma faixa lisa. <b>Praia:</b> a distância até a margem da ilha (<code>shore</code>) gera uma linha de contato branca e faixas que avançam em direção à areia (<code>sen(shore·2.2 − t·1.4)</code>). A margem tem a mesma fórmula, <code>raioIlha(ângulo)</code>, na malha da ilha (JavaScript) e no shader (GLSL), e é assim que a espuma bate exatamente na areia.</p>
<p><b>A mesma onda na CPU.</b> O barco e as boias precisam saber a altura da água. A GPU já sabe, mas a CPU não lê esse resultado de volta com facilidade; então <code>ondaEm(x, z, t)</code> repete as contas em JavaScript, com os mesmos números (<code>ONDAS</code>). Um detalhe: o shader usa a posição <i>original</i> do vértice, e o ponto <code>(x, z)</code> do mundo já foi empurrado na horizontal. A função desfaz o empurrão em duas iterações antes de somar as alturas. O barco se inclina com a inclinação da onda, <code>(−dh/dx, 1, −dh/dz)</code>, alinhada ao "cima" dele com <code>setFromUnitVectors</code>, e a câmera nunca desce abaixo da onda.</p>
<p><b>Custo.</b> São <b>2 passes</b> por quadro (o reflexo e a cena) e a malha tem 300×300 quadrados, cerca de 90 mil vértices, o que a GPU faz sem esforço. A tecla <b>5</b> mostra a malha em arame; a tecla <b>1</b> desliga o passe do reflexo e você vê o fps subir.</p>
<div class="note"><b>Controles:</b> <b>clique no preview</b> para dar foco. <b>Arraste</b> para girar a vista e use a <b>roda</b> para aproximar. <b>1</b> liga/desliga o reflexo, <b>2</b> a espuma, <b>3</b> muda o mar (calmo → ondulado → tempestade), <b>4</b> alterna dia e pôr do sol, <b>5</b> mostra a malha.</div>
<div class="note tip"><b>Experimente:</b> troque os <code>graus</code> de uma onda para 90 e veja o mar cruzado; em <code>MARES</code>, ponha <code>choppy</code> em 1.3 e as cristas fazem laço (<code>Q·k·A</code> passou de 1); mude o <code>0.04</code> do reflexo para 0.15 e a água vira vidro quebrado; troque o <code>350</code> do brilho por 40 e o sol vira uma mancha larga.</div>
<div class="note tip"><b>Desafios:</b> (1) <b>espuma em volta do barco</b>: mande a posição dele por <code>uniform</code> e some uma faixa de espuma pela distância; (2) <b>espuma em qualquer objeto</b>: desenhe a profundidade da cena numa <code>DepthTexture</code> e compare com a profundidade da água; (3) <b>refração</b>: um segundo render target com o que está submerso, entortado pela normal; (4) <b>vento</b>: uma variável que gira os <code>graus</code> das ondas e aumenta <code>amp</code> junto.</div>`,
 code:`// ===== Água: ondas de Gerstner, reflexo, Fresnel e espuma =====
// A superfície é um plano com muitos vértices. O vertex shader soma 4 ondas de Gerstner para mexer
// nesses vértices; o fragment shader mistura o reflexo (uma câmera virtual), a cor da água, o brilho
// do sol e a espuma. As MESMAS ondas rodam em JavaScript para o barco e as boias flutuarem.
const NL = String.fromCharCode(10);
const PI2 = Math.PI * 2;
const clamp = THREE.MathUtils.clamp;

// ---------- 1. AS ONDAS: os mesmos números alimentam a GPU (malha) e a CPU (barco) ----------
const G = 9.81;                                           // gravidade: define a velocidade de cada onda
const ONDAS = [
  { graus: 20, L: 38, a: 0.020 },                         // direção, comprimento de onda (m) e amplitude = a * L
  { graus: -35, L: 21, a: 0.016 },
  { graus: 70, L: 11, a: 0.011 },
  { graus: -80, L: 6.5, a: 0.007 },
].map((o) => ({
  dx: Math.cos(o.graus * Math.PI / 180), dz: Math.sin(o.graus * Math.PI / 180),
  L: o.L, a: o.a, k: PI2 / o.L, w: Math.sqrt(G * PI2 / o.L),   // k: número de onda, w: frequência (ondas longas correm mais)
  A: 0, Q: 0,
}));
const MARES = [
  { nome: 'calmo', amp: 0.35, choppy: 0.35 },
  { nome: 'ondulado', amp: 1.0, choppy: 0.7 },
  { nome: 'tempestade', amp: 1.7, choppy: 0.95 },
];
let marAlvo = 1;
const mar = { amp: 1.0, choppy: 0.7 };                    // valores atuais: caminham suavemente até o alvo
const uWaves = ONDAS.map((o) => new THREE.Vector4(o.dx, o.dz, 0, o.L));
function atualizarMar(dt) {
  const m = MARES[marAlvo], f = 1 - Math.exp(-dt * 2.5);
  mar.amp += (m.amp - mar.amp) * f;
  mar.choppy += (m.choppy - mar.choppy) * f;
  ONDAS.forEach((o, i) => {
    o.A = o.a * o.L * mar.amp;                            // amplitude em metros
    o.Q = mar.choppy / (o.k * o.A * ONDAS.length);        // "pontiagudez": a soma Q*k*A nunca passa de choppy < 1
    uWaves[i].z = o.A;
  });
}
atualizarMar(0);

// Mesma conta do vertex shader, em JavaScript. O vértice guarda a posição ORIGINAL; um ponto (x, z) do
// mundo já foi empurrado na horizontal. Para achar a altura ali, desfazemos o empurrão (2 iterações).
function ondaEm(x, z, t) {
  let px = x, pz = z;
  for (let it = 0; it < 2; it++) {
    let sx = 0, sz = 0;
    for (const o of ONDAS) {
      const c = Math.cos(o.k * (o.dx * px + o.dz * pz) - o.w * t);
      sx += o.Q * o.A * o.dx * c;
      sz += o.Q * o.A * o.dz * c;
    }
    px = x - sx;
    pz = z - sz;
  }
  let y = 0;
  for (const o of ONDAS) y += o.A * Math.sin(o.k * (o.dx * px + o.dz * pz) - o.w * t);
  return y;
}

// ---------- 2. CÉU, SOL E CORES (duas predefinições) ----------
const PRESETS = [
  { nome: 'dia', elev: 36, topo: 0x2a73c4, hor: 0xb4d3ec, sol: 0xfff3dc, fundo: 0x0b4d6e, raso: 0x35b8b0, luz: 1.7 },
  { nome: 'pôr do sol', elev: 8, topo: 0x20274d, hor: 0xff9660, sol: 0xffa965, fundo: 0x06203a, raso: 0x2a7c86, luz: 1.2 },
];
let solAtual = 0;
const AZ = -75 * Math.PI / 180;                           // o sol fica do outro lado da ilha: o brilho cai sobre a água
const COMUM = {                                           // uniforms compartilhados entre o céu e a água
  uTime: { value: 0 },
  uSunDir: { value: new THREE.Vector3() },
  uSunColor: { value: new THREE.Color() },
  uFog: { value: new THREE.Color() },                     // cor do horizonte, também usada como névoa
};
const uTopo = { value: new THREE.Color() }, uFundo = { value: new THREE.Color() }, uRaso = { value: new THREE.Color() };

const sol = new THREE.DirectionalLight(0xffffff, 1.5);
scene.add(sol);
scene.add(new THREE.HemisphereLight(0xbcd7ff, 0x806a40, 0.55));
function aplicarSol() {
  const p = PRESETS[solAtual], el = p.elev * Math.PI / 180;
  COMUM.uSunDir.value.set(Math.cos(el) * Math.cos(AZ), Math.sin(el), Math.cos(el) * Math.sin(AZ));
  COMUM.uSunColor.value.set(p.sol);
  COMUM.uFog.value.set(p.hor);
  uTopo.value.set(p.topo);
  uFundo.value.set(p.fundo);
  uRaso.value.set(p.raso);
  sol.color.set(p.sol);
  sol.intensity = p.luz;
  sol.position.copy(COMUM.uSunDir.value).multiplyScalar(60);
}
aplicarSol();

// ruído de valor + fbm, usado pelo céu (nuvens) e pela água (ondulação fina e espuma)
const RUIDO = [
  'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
  'float noise(vec2 p) {',
  '  vec2 i = floor(p), f = fract(p);',
  '  f = f * f * (3.0 - 2.0 * f);',
  '  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);',
  '}',
  'float fbm(vec2 p) {',
  '  float s = 0.0, a = 0.5;',
  '  for (int i = 0; i < 4; i++) { s += a * noise(p); p = p * 2.03 + vec2(17.0, 9.0); a *= 0.5; }',
  '  return s;',
  '}',
].join(NL);

const ceu = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: Object.assign({ uTopo: uTopo }, COMUM),
  vertexShader: [
    'varying vec3 vDir;',
    'void main() {',
    '  vDir = position;',
    '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
    '}',
  ].join(NL),
  fragmentShader: [
    'uniform float uTime;',
    'uniform vec3 uTopo, uFog, uSunDir, uSunColor;',
    'varying vec3 vDir;',
    RUIDO,
    'void main() {',
    '  vec3 d = normalize(vDir);',
    '  vec3 col = mix(uFog, uTopo, pow(max(d.y, 0.0), 0.5));          // gradiente: horizonte -> zênite',
    '  float s = max(dot(d, normalize(uSunDir)), 0.0);',
    '  col += uSunColor * (pow(s, 900.0) * 3.0 + pow(s, 14.0) * 0.28);   // disco do sol + halo',
    '  vec2 cp = d.xz / (d.y + 0.12) * 0.9 + vec2(uTime * 0.012, 0.0);   // nuvens: ruído projetado no céu',
    '  float nuvem = smoothstep(0.52, 0.82, fbm(cp)) * smoothstep(0.02, 0.22, d.y);',
    '  col = mix(col, mix(uFog, vec3(1.0), 0.65), nuvem * 0.55);',
    '  gl_FragColor = vec4(col, 1.0);',
    '}',
  ].join(NL),
}));
scene.add(ceu);

// ---------- 3. A ILHA: a margem tem a mesma fórmula na malha (JS) e na espuma (GLSL) ----------
function raioIlha(a) { return 9 + 1.2 * Math.sin(3 * a + 1) + 0.8 * Math.sin(5 * a); }
function alturaIlha(x, z) {
  const R = raioIlha(Math.atan2(z, x)), u = Math.hypot(x, z) / R;
  if (u >= 1) return -Math.min(2.5, (u - 1) * R * 0.5);   // abaixo da água: afunda rápido
  return 2.8 * Math.pow(1 - u * u, 1.5) + 0.35 * Math.sin(x * 0.9) * Math.cos(z * 0.8) * (1 - u) * (1 - u);
}
const ilhaGeo = new THREE.PlaneGeometry(44, 44, 110, 110);
ilhaGeo.rotateX(-Math.PI / 2);
{
  const pos = ilhaGeo.attributes.position, cores = new Float32Array(pos.count * 3);
  const cor = new THREE.Color(), verde = new THREE.Color(0x2f6b34);
  for (let i = 0; i < pos.count; i++) {
    const h = alturaIlha(pos.getX(i), pos.getZ(i));
    pos.setY(i, h);
    if (h < 0.5) cor.set(0xe6d19a);                       // areia
    else cor.set(0x4f8f3d).lerp(verde, clamp((h - 0.5) / 2.2, 0, 1));
    if (h < 0) cor.multiplyScalar(0.55);
    cores.set([cor.r, cor.g, cor.b], i * 3);
  }
  ilhaGeo.setAttribute('color', new THREE.BufferAttribute(cores, 3));
  ilhaGeo.computeVertexNormals();
}
scene.add(new THREE.Mesh(ilhaGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true })));

const matFolha = new THREE.MeshStandardMaterial({ color: 0x2e8b3d, roughness: 0.8 });
const matTronco = new THREE.MeshStandardMaterial({ color: 0x7a5a36, roughness: 0.9 });
function palmeira(x, z, s) {
  const g = new THREE.Group();
  const tronco = new THREE.Mesh(new THREE.CylinderGeometry(0.12 * s, 0.2 * s, 3.4 * s, 6), matTronco);
  tronco.position.y = 1.7 * s;
  g.add(tronco);
  for (let i = 0; i < 7; i++) {
    const pivo = new THREE.Group();                       // o pivô gira em torno do tronco; a folha cai para fora
    pivo.position.y = 3.4 * s;
    pivo.rotation.y = (i / 7) * PI2;
    const folha = new THREE.Mesh(new THREE.BoxGeometry(0.4 * s, 0.05 * s, 2.2 * s), matFolha);
    folha.geometry.translate(0, 0, 1.1 * s);
    folha.rotation.x = 0.5;
    pivo.add(folha);
    g.add(pivo);
  }
  g.position.set(x, alturaIlha(x, z), z);
  g.rotation.z = Math.sin(x * 3) * 0.12;
  scene.add(g);
}
[[-1.5, 1.2, 1.1], [2.3, -1.4, 0.9], [0.5, 3.2, 1.0], [-3.0, -2.2, 0.8], [3.4, 2.0, 0.85]].forEach((p) => palmeira(p[0], p[1], p[2]));

// ---------- 4. BARCO E BOIAS: flutuam usando ondaEm() (a mesma onda da GPU) ----------
const barco = new THREE.Group();
const branco = new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.5 });
const vermelho = new THREE.MeshStandardMaterial({ color: 0xd8402e, roughness: 0.6 });
const casco = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.55, 3.2), branco);
const faixa = new THREE.Mesh(new THREE.BoxGeometry(1.52, 0.14, 3.22), vermelho);
const cabine = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.6, 1.0), branco);
const mastro = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.6, 6), matTronco);
casco.position.y = 0.1;
faixa.position.y = 0.05;
cabine.position.set(0, 0.7, -0.5);
mastro.position.set(0, 1.0, 0.8);
barco.add(casco, faixa, cabine, mastro);
scene.add(barco);

const BOIAS = [[-18, -10], [16, -18], [26, 6], [-24, 14]].map((p) => {
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 8), vermelho);
  b.userData = { x: p[0], z: p[1] };
  scene.add(b);
  return b;
});
const UP = new THREE.Vector3(0, 1, 0), normalBarco = new THREE.Vector3();
const qTilt = new THREE.Quaternion(), qYaw = new THREE.Quaternion();
function animarFlutuantes(t) {
  const R = 24, fi = t * 0.1;
  const x = R * Math.cos(fi), z = R * Math.sin(fi), d = 1.4;
  const dhx = (ondaEm(x + d, z, t) - ondaEm(x - d, z, t)) / (2 * d);   // inclinação da onda em x e em z
  const dhz = (ondaEm(x, z + d, t) - ondaEm(x, z - d, t)) / (2 * d);
  normalBarco.set(-dhx, 1, -dhz).normalize();
  qTilt.setFromUnitVectors(UP, normalBarco);                           // deita o barco na superfície
  qYaw.setFromAxisAngle(UP, -fi);                                      // proa na direção do movimento
  barco.quaternion.copy(qTilt).multiply(qYaw);
  barco.position.set(x, ondaEm(x, z, t) + 0.05, z);
  BOIAS.forEach((b) => b.position.set(b.userData.x, ondaEm(b.userData.x, b.userData.z, t) + 0.1, b.userData.z));
}

// ---------- 5. A ÁGUA: malha densa + shaders ----------
const rtRefl = new THREE.WebGLRenderTarget(512, 512);
const texMat = new THREE.Matrix4();
const BIAS = new THREE.Matrix4().set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);

const aguaVert = [
  'uniform float uTime;',
  'uniform float uChoppy;',
  'uniform vec4 uWaves[4];                // x,y: direção · z: amplitude (m) · w: comprimento de onda (m)',
  'uniform mat4 uTexMat;',
  'varying vec3 vWorld;',
  'varying vec3 vNormal;',
  'varying vec4 vRefl;',
  'varying float vCrest;',
  'varying float vH;',
  'const float G = 9.81;',
  'void main() {',
  '  vec3 p = position;                   // o plano já está deitado: x e z são o chão',
  '  vec3 disp = vec3(0.0);',
  '  vec3 n = vec3(0.0, 1.0, 0.0);',
  '  float crest = 0.0;',
  '  for (int i = 0; i < 4; i++) {',
  '    vec2 d = uWaves[i].xy;',
  '    float A = uWaves[i].z;',
  '    float k = 6.2831853 / uWaves[i].w;',
  '    float w = sqrt(G * k);              // dispersão: ondas longas correm mais',
  '    float Q = uChoppy / (k * A * 4.0);',
  '    float th = k * dot(d, p.xz) - w * uTime;',
  '    float c = cos(th), s = sin(th);',
  '    disp.xz += Q * A * d * c;           // empurra o ponto na horizontal: cristas afinam',
  '    disp.y += A * s;                    // sobe e desce',
  '    n.xz -= d * (k * A * c);            // normal analítica: sem derivar a malha',
  '    n.y -= Q * k * A * s;',
  '    crest += Q * k * A * s;             // quanto os pontos estão "espremidos" (cristas)',
  '  }',
  '  vec4 wp = modelMatrix * vec4(p + disp, 1.0);',
  '  vWorld = wp.xyz;',
  '  vNormal = normalize(n);',
  '  vCrest = crest;',
  '  vH = disp.y;',
  '  vRefl = uTexMat * wp;                // onde este ponto aparece na foto da câmera virtual',
  '  gl_Position = projectionMatrix * viewMatrix * wp;',
  '}',
].join(NL);

const aguaFrag = [
  'uniform float uTime, uUseRefl, uUseFoam;',
  'uniform sampler2D tRefl;',
  'uniform vec3 uDeep, uShallow, uFog, uSunDir, uSunColor;',
  'varying vec3 vWorld;',
  'varying vec3 vNormal;',
  'varying vec4 vRefl;',
  'varying float vCrest;',
  'varying float vH;',
  RUIDO,
  'float raioIlha(float a) { return 9.0 + 1.2 * sin(3.0 * a + 1.0) + 0.8 * sin(5.0 * a); }   // igual ao JavaScript',
  'void main() {',
  '  vec3 toCam = cameraPosition - vWorld;',
  '  float dist = length(toCam);',
  '  vec3 V = toCam / dist;',
  '  vec3 L = normalize(uSunDir);',
  '  vec2 q = vWorld.xz;',
  '',
  '  // ondulação fina: ruído mexe na normal (some com a distância, para não cintilar)',
  '  vec3 N = normalize(vNormal);',
  '  vec2 dn = vec2(noise(q * 1.7 + uTime * vec2(0.6, 0.3)), noise(q * 1.7 + 31.0 - uTime * vec2(0.4, 0.5))) - 0.5;',
  '  N = normalize(N + vec3(dn.x, 0.0, dn.y) * 0.22 / (1.0 + dist * 0.04));',
  '',
  '  // Fresnel (Schlick): olhando de cima vemos a água; em ângulo rasante, o reflexo',
  '  float ndv = max(dot(N, V), 0.0);',
  '  float fres = 0.03 + 0.97 * pow(1.0 - ndv, 5.0);',
  '',
  '  // reflexo: projeta o ponto na foto da câmera virtual e entorta pela normal',
  '  vec2 ruv = vRefl.xy / vRefl.w + N.xz * 0.04;',
  '  vec3 refl = texture2D(tRefl, clamp(ruv, 0.002, 0.998)).rgb;',
  '  refl = mix(uFog * 0.85, refl, uUseRefl);',
  '',
  '  // cor do corpo da água: mais clara e esverdeada perto da ilha (raso) + luz atravessando as cristas',
  '  float shore = length(q) - raioIlha(atan(q.y, q.x));   // distância até a margem (negativa dentro da ilha)',
  '  float raso = smoothstep(8.0, 0.0, shore);',
  '  vec3 corpo = mix(uDeep, uShallow, raso * 0.85);',
  '  float sss = pow(max(dot(V, -L), 0.0), 3.0) * smoothstep(0.1, 1.1, vH);',
  '  corpo += uShallow * sss * 1.3;',
  '  vec3 col = mix(corpo, refl, fres);',
  '',
  '  // brilho do sol (Blinn-Phong bem apertado)',
  '  vec3 H = normalize(L + V);',
  '  col += uSunColor * pow(max(dot(N, H), 0.0), 350.0) * 1.2;',
  '',
  '  // espuma: (1) cristas onde os pontos se espremem, quebradas por ruído; (2) contato e marolas na praia',
  '  float ruidoE = fbm(q * 2.2 + vec2(uTime * 0.07, 0.0));',
  '  float topo = smoothstep(0.28, 0.6, vCrest + (ruidoE - 0.5) * 0.4);',
  '  float marola = 0.5 + 0.5 * sin(shore * 2.2 - uTime * 1.4 + ruidoE * 6.0);',
  '  float contato = smoothstep(1.3, 0.0, shore);',
  '  float faixas = smoothstep(4.5, 0.5, shore) * smoothstep(0.55, 0.85, marola * (0.45 + ruidoE));',
  '  float espuma = clamp(topo * smoothstep(0.3, 0.65, ruidoE) * 1.4 + contato * 0.9 + faixas * 0.7, 0.0, 1.0) * uUseFoam;',
  '  vec3 corEsp = mix(vec3(1.0), uSunColor, 0.3) * (0.55 + 0.45 * clamp(L.y * 2.5, 0.0, 1.0));',
  '  col = mix(col, corEsp, espuma * 0.92);',
  '',
  '  col = mix(col, uFog, smoothstep(55.0, 115.0, dist));   // névoa: esconde a borda do plano',
  '  gl_FragColor = vec4(col, 1.0);',
  '}',
].join(NL);

const aguaGeo = new THREE.PlaneGeometry(240, 240, 300, 300);
aguaGeo.rotateX(-Math.PI / 2);
const aguaMat = new THREE.ShaderMaterial({
  uniforms: Object.assign({
    tRefl: { value: rtRefl.texture }, uTexMat: { value: texMat }, uWaves: { value: uWaves },
    uChoppy: { value: 0.7 }, uDeep: uFundo, uShallow: uRaso, uUseRefl: { value: 1 }, uUseFoam: { value: 1 },
  }, COMUM),
  vertexShader: aguaVert,
  fragmentShader: aguaFrag,
});
const agua = new THREE.Mesh(aguaGeo, aguaMat);
agua.frustumCulled = false;                               // os vértices se movem: a caixa original engana
scene.add(agua);

// ---------- 6. O REFLEXO: câmera virtual embaixo d'água ----------
// Um espelho horizontal em y = 0 mostra a cena vista por uma câmera na posição refletida (x, -y, z).
const refl = new THREE.PerspectiveCamera();
const dirCam = new THREE.Vector3();
const planoCorte = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0.15);   // corta tudo abaixo de y = -0.15
function passeReflexo() {
  refl.fov = camera.fov; refl.aspect = camera.aspect; refl.near = camera.near; refl.far = camera.far;
  refl.updateProjectionMatrix();
  refl.position.set(camera.position.x, -camera.position.y, camera.position.z);
  camera.getWorldDirection(dirCam);
  refl.up.set(0, -1, 0);
  refl.lookAt(camera.position.x + dirCam.x, -(camera.position.y + dirCam.y), camera.position.z + dirCam.z);
  refl.updateMatrixWorld();
  texMat.copy(BIAS).multiply(refl.projectionMatrix).multiply(refl.matrixWorldInverse);
  agua.visible = false;                                   // senão ela leria a própria textura
  renderer.clippingPlanes = [planoCorte];                 // a parte submersa da ilha não pode aparecer no espelho
  renderer.setRenderTarget(rtRefl);
  renderer.render(scene, refl);
  renderer.setRenderTarget(null);
  renderer.clippingPlanes = [];
  agua.visible = true;
}
const tam = new THREE.Vector2();
function ajustarAlvo() {                                  // o reflexo usa metade da resolução da tela
  renderer.getDrawingBufferSize(tam);
  rtRefl.setSize(Math.max(2, Math.floor(tam.x * 0.5)), Math.max(2, Math.floor(tam.y * 0.5)));
}
ajustarAlvo();
addEventListener('resize', ajustarAlvo);

// ---------- 7. CÂMERA, INTERFACE E LAÇO ----------
camera.fov = 55;
camera.near = 0.3;
camera.far = 1000;
camera.updateProjectionMatrix();
camera.position.set(16, 6, 32);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, -4);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 8;
controls.maxDistance = 70;
controls.minPolarAngle = 0.4;                             // não olha reto para baixo (a câmera virtual ficaria sem "cima")
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.update();

const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:10px;left:14px;color:#fff;font:14px/1.55 system-ui;text-shadow:0 1px 5px #000;pointer-events:none';
const legenda = document.createElement('div');
legenda.style.cssText = 'position:fixed;left:14px;bottom:10px;color:#e6efff;font:12px system-ui;text-shadow:0 1px 4px #000;pointer-events:none';
legenda.innerHTML = 'arraste: girar · roda: zoom · <b>1</b> reflexo · <b>2</b> espuma · <b>3</b> mar · <b>4</b> sol · <b>5</b> malha';
document.body.append(hud, legenda);
let usarRefl = true, usarEsp = true;
addEventListener('keydown', (e) => {
  if (e.code === 'Digit1') usarRefl = !usarRefl;
  if (e.code === 'Digit2') usarEsp = !usarEsp;
  if (e.code === 'Digit3') marAlvo = (marAlvo + 1) % MARES.length;
  if (e.code === 'Digit4') { solAtual = (solAtual + 1) % PRESETS.length; aplicarSol(); }
  if (e.code === 'Digit5') aguaMat.wireframe = !aguaMat.wireframe;
});
const onoff = (b) => '<b style="color:' + (b ? '#7CFF6B' : '#ff6b6b') + '">' + (b ? 'ligado' : 'desligado') + '</b>';

const relogio = new THREE.Clock();
let fps = 60, quadro = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(relogio.getDelta(), 0.05), t = relogio.elapsedTime;
  fps += (1 / Math.max(dt, 0.001) - fps) * 0.05;
  atualizarMar(dt);
  COMUM.uTime.value = t;
  aguaMat.uniforms.uChoppy.value = mar.choppy;
  aguaMat.uniforms.uUseRefl.value = usarRefl ? 1 : 0;
  aguaMat.uniforms.uUseFoam.value = usarEsp ? 1 : 0;

  controls.update();
  const piso = ondaEm(camera.position.x, camera.position.z, t) + 1.0;   // a câmera nunca mergulha numa onda
  if (camera.position.y < piso) camera.position.y = piso;
  camera.updateMatrixWorld();
  animarFlutuantes(t);

  if (usarRefl) passeReflexo();
  renderer.render(scene, camera);

  if (quadro++ % 10 === 0) {
    hud.innerHTML = '<b>Água</b> · mar <b>' + MARES[marAlvo].nome + '</b> · ' + PRESETS[solAtual].nome + ' · ' + Math.round(fps) + ' fps<br>' +
      'reflexo ' + onoff(usarRefl) + ' · espuma ' + onoff(usarEsp) + ' · ' + (usarRefl ? 2 : 1) + ' passes';
  }
});`},
{t:"Simulação de Tecido",
 lead:"Uma grade de partículas ligadas por restrições de distância vira pano: com vento, colisões, atrito e rasgos, e você pode puxar o tecido com o mouse.",
 txt:`<p>Um tecido é uma <b>grade de pontos ligados por "varetas" de comprimento fixo</b>. Em vez de calcular forças de mola (que ficam instáveis com facilidade), a simulação trabalha direto com <b>posições</b>: anda com a velocidade que já tinha, aplica a gravidade e o vento, e depois corrige as posições para que as varetas voltem ao tamanho original. Esse estilo se chama <i>position based dynamics</i> e é o que a maioria dos jogos usa para pano, cabelo e corda.</p>
<p><b>Integração de Verlet.</b> Cada partícula guarda duas posições: a <b>atual</b> (<code>X</code>) e a do passo <b>anterior</b> (<code>P</code>). A velocidade não é guardada: ela é <code>X − P</code>. A nova posição é <code>X + (X − P)·amortecimento + a·h²</code>, em que <code>h</code> é o tempo do passo. A vantagem é que as correções das restrições mexem em <code>X</code> e a velocidade correspondente sai de graça, sem fórmulas extras. Uma partícula <b>presa</b> tem massa inversa <code>0</code> e simplesmente não anda.</p>
<p><b>Restrições de distância.</b> Para cada par ligado, medimos a distância atual e comparamos com a de descanso (a distância inicial). A diferença é dividida entre os dois pontos, ponderada pela massa inversa. Corrigir um par bagunça os vizinhos, então repetimos tudo várias vezes: são <code>ITER = 6</code> iterações em cada um dos <code>SUB = 3</code> subpassos, ou seja, 18 passadas por quadro sobre as 6852 restrições. Mais iterações deixam o pano mais rígido; poucas o fazem parecer de borracha. O código <b>alterna o sentido</b> da varredura a cada iteração; sempre na mesma ordem, o pano deriva para um lado.</p>
<p><b>Três tipos de restrição.</b> As <b>estruturais</b> ligam vizinhos e mantêm o tamanho. As de <b>cisalhamento</b> ligam as diagonais e impedem os quadradinhos de virar losangos. As de <b>dobra</b> pulam uma partícula e são mais moles (<code>0.3</code>): elas dão "corpo" ao tecido; sem elas o pano dobraria sem nenhuma resistência.</p>
<p><b>Vento aerodinâmico.</b> Vento não empurra tudo igual: um pano de frente para o vento pega muito, de lado quase nada. A aceleração de cada partícula é <code>n·(n·vento)·força</code>, em que <code>n</code> é a normal da malha naquele ponto (recalculada todo quadro com <code>computeVertexNormals</code>). A força oscila no tempo (rajadas) e varia ao longo do pano, o que cria as ondas.</p>
<p><b>Colisões e atrito.</b> Colidir é <b>projetar</b>: se a partícula entrou na esfera, ela é empurrada para a superfície ao longo da normal; no chão, <code>y</code> volta para <code>0.02</code>. O atrito é o detalhe que mais engana. Amortecer a velocidade não segura o pano: ele escorrega devagar do topo da esfera até cair no chão. O código usa <b>atrito de Coulomb</b>: quanto mais fundo a partícula entrou (<code>pen</code>), maior o atrito possível; se o deslize tangencial no subpasso for menor que <code>MU_EST·pen</code>, a partícula <b>fica parada</b>; senão é só freada (<code>MU_CIN</code>). É isso que deixa a toalha apoiada na esfera.</p>
<p><b>Rasgar.</b> Rasgar é desligar restrições. Um quadradinho só vira triângulos se <b>as três arestas de cada triângulo</b> ainda existirem; quando uma morre, o buraco aparece (a lista de índices é refeita e <code>setDrawRange</code> limita o desenho). As restrições de dobra que atravessam um rasgo também caem. O rasgo é feito pela <b>tesoura</b> (modo 3): ela mata as restrições cujo ponto médio cai dentro do raio do mouse. Puxar o pano <b>não rasga</b>; ele só estica até um limite (veja abaixo).</p>
<p><b>Detalhes da malha viva.</b> O array <code>X</code> é usado <b>diretamente</b> como atributo de posição, sem copiar nada. Depois de mexer nele, <code>needsUpdate = true</code>. Para o raio do mouse acertar o tecido é preciso refazer <code>computeBoundingSphere()</code> a cada quadro. O material usa <code>DoubleSide</code> e <code>shadowSide = DoubleSide</code> para o pano ter frente, verso e sombra. O passo é <b>fixo</b> em 1/60 s, com um acumulador de tempo: a simulação fica estável e se comporta igual em telas de 60 e de 144 Hz.</p>
<p><b>Puxar com o mouse.</b> No clique, o raio acha o triângulo e a partícula mais próxima do ponto. Enquanto você segura, ela ganha massa inversa <code>0</code> (arrasta os vizinhos) e segue o mouse num plano de frente para a câmera. Ela <b>não salta</b> para o mouse: anda no máximo <code>PASSO_MAX</code> por subpasso e <b>para de avançar</b> enquanto alguma aresta ligada a ela passar de <code>LIM_PUXAR</code> (1,5 vez o tamanho original), esperando o pano acompanhar. Sem isso, um movimento rápido esticaria de uma vez as arestas vizinhas, e o pano viraria uma borracha esticada. O <code>pointerdown</code> é registrado na fase de captura, antes do <code>OrbitControls</code>, para poder desativá-lo durante o arrasto.</p>
<p><b>Limites.</b> Este pano <b>não colide consigo mesmo</b>: ao dobrar muito, uma camada atravessa a outra. Corrigir isso exige uma grade espacial para achar partículas próximas, e é o desafio 1 abaixo. O custo é pequeno: 1200 partículas e 6852 restrições, 18 passadas por quadro.</p>
<div class="note"><b>Controles:</b> <b>clique no preview</b> para dar foco. <b>Arraste sobre o tecido</b> para puxar (ou rasgar, no modo 3) e arraste fora dele para girar a vista; a <b>roda</b> aproxima. <b>1</b> liga/desliga o vento, <b>2</b> troca entre a <i>cortina</i> presa na vara e a <i>toalha</i> que cai sobre a esfera, <b>3</b> alterna puxar e rasgar, <b>4</b> mostra a malha, <b>R</b> reinicia.</div>
<div class="note tip"><b>Experimente:</b> troque <code>ITER</code> por 2 (pano de borracha) e por 20 (pano duro como lona); ponha <code>MU_EST</code> e <code>MU_CIN</code> em 0.05 (seda sobre gelo: a toalha escorrega da esfera); <code>LIM_PUXAR</code> em 1.2 (pano duro) ou 2.5 (elástico); <code>AMORT</code> em 0.98 (pano debaixo d'água); <code>COLS, ROWS</code> em 60, 45 (mais detalhe, mais custo).</div>
<div class="note tip"><b>Desafios:</b> (1) <b>autocolisão</b>: uma <i>spatial hash</i> para achar partículas a menos de uma espessura e afastá-las; (2) <b>mesa</b>: troque a esfera por uma caixa, projetando as partículas para fora dela; (3) <b>bandeira</b>: prenda a coluna da esquerda em vez da linha de cima e leve a vara para um mastro; (4) <b>esfera arrastável</b>: mova o obstáculo com o mouse e veja o pano ser empurrado; (5) <b>ventilador</b>: um ponto no chão que sopra com força que cai com a distância.</div>`,
 code:`// ===== Simulação de tecido: integração de Verlet + restrições de distância =====
// O tecido é uma grade de partículas ligadas por "molas rígidas" (restrições de distância). A cada
// quadro: (1) cada partícula anda com a velocidade que já tinha + gravidade + vento; (2) as restrições
// puxam os pares de volta ao comprimento original, várias vezes; (3) colisões empurram as partículas
// para fora da esfera e do chão. Clique no tecido para puxar (ou rasgar, tecla 3).
const clamp = THREE.MathUtils.clamp;

const COLS = 40, ROWS = 30, N = COLS * ROWS;
const SUB = 3, ITER = 6;                   // subpassos por quadro e iterações de restrição por subpasso
const GRAV = -9.8, AMORT = 0.995;          // gravidade e perda de velocidade por subpasso
const MU_EST = 0.9, MU_CIN = 0.7;          // atrito de Coulomb: estático (segura) e cinético (freia)
const PASSO_MAX = 0.04;                    // o ponto puxado anda no máximo isso por subpasso (o pano acompanha, não é arrancado)
const LIM_PUXAR = 1.5;                     // e para de avançar se uma aresta ligada a ele passar de 1,5x o tamanho original
const RAIO_CORTE = 0.45;                   // raio da "tesoura" (modo rasgar)
const DT = 1 / 60;

// ---------- 1. DADOS: posição atual, posição anterior e massa inversa ----------
const X = new Float32Array(N * 3);         // posição atual (x, y, z de cada partícula)
const P = new Float32Array(N * 3);         // posição no subpasso anterior: a velocidade é X - P
const invBase = new Float32Array(N);       // 1 = livre, 0 = preso (massa infinita)
const inv = new Float32Array(N);           // igual a invBase, exceto na partícula que você está segurando
const idx = (i, j) => j * COLS + i;

// ---------- 2. AS RESTRIÇÕES (a topologia é fixa; os comprimentos dependem da cena) ----------
// tipo 0: estrutural (vizinhos), 1: cisalhamento (diagonais), 2: dobra (pula uma partícula)
const CA = [], CB = [], CT = [], D1 = [], D2 = [];
function nova(a, b, tipo, d1, d2) { CA.push(a); CB.push(b); CT.push(tipo); D1.push(d1 === undefined ? -1 : d1); D2.push(d2 === undefined ? -1 : d2); return CA.length - 1; }
const H = new Int32Array(N).fill(-1), V = new Int32Array(N).fill(-1), DG1 = new Int32Array(N).fill(-1), DG2 = new Int32Array(N).fill(-1);
for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
  if (i < COLS - 1) H[idx(i, j)] = nova(idx(i, j), idx(i + 1, j), 0);
  if (j < ROWS - 1) V[idx(i, j)] = nova(idx(i, j), idx(i, j + 1), 0);
}
for (let j = 0; j < ROWS - 1; j++) for (let i = 0; i < COLS - 1; i++) {
  DG1[idx(i, j)] = nova(idx(i, j), idx(i + 1, j + 1), 1);
  DG2[idx(i, j)] = nova(idx(i + 1, j), idx(i, j + 1), 1);
}
for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {   // dobra: só vale enquanto as duas restrições do meio existirem
  if (i < COLS - 2) nova(idx(i, j), idx(i + 2, j), 2, H[idx(i, j)], H[idx(i + 1, j)]);
  if (j < ROWS - 2) nova(idx(i, j), idx(i, j + 2), 2, V[idx(i, j)], V[idx(i, j + 1)]);
}
const NC = CA.length;
const ca = Int32Array.from(CA), cb = Int32Array.from(CB), ct = Uint8Array.from(CT), dep1 = Int32Array.from(D1), dep2 = Int32Array.from(D2);
const rest = new Float32Array(NC), vivo = new Uint8Array(NC);
const RIGIDEZ = [1, 1, 0.3];               // a dobra é mais mole: o pano dobra, mas não estica

// ---------- 3. A MALHA: usa o próprio array X como atributo de posição (zero cópias) ----------
const MAXI = (COLS - 1) * (ROWS - 1) * 6;
const geo = new THREE.BufferGeometry();
const posAttr = new THREE.BufferAttribute(X, 3);
posAttr.setUsage(THREE.DynamicDrawUsage);
geo.setAttribute('position', posAttr);
const uvs = new Float32Array(N * 2);
for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) { uvs[idx(i, j) * 2] = i / (COLS - 1); uvs[idx(i, j) * 2 + 1] = 1 - j / (ROWS - 1); }
geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
geo.setIndex(new THREE.BufferAttribute(new Uint16Array(MAXI), 1));
let sujo = true, rasgos = 0;
// Cada quadradinho vira 2 triângulos, mas só se TODAS as arestas dele ainda existirem: é assim que um rasgo aparece.
function atualizarIndices() {
  const ia = geo.index.array;
  ia.fill(0);
  let n = 0;
  for (let j = 0; j < ROWS - 1; j++) for (let i = 0; i < COLS - 1; i++) {
    const a = idx(i, j), b = idx(i + 1, j), c = idx(i, j + 1), d = idx(i + 1, j + 1);
    if (vivo[H[a]] && vivo[V[a]] && vivo[DG2[a]]) { ia[n++] = a; ia[n++] = c; ia[n++] = b; }
    if (vivo[DG2[a]] && vivo[V[b]] && vivo[H[c]]) { ia[n++] = b; ia[n++] = c; ia[n++] = d; }
  }
  geo.index.needsUpdate = true;
  geo.setDrawRange(0, n);
}
function matar(c) { if (vivo[c]) { vivo[c] = 0; sujo = true; if (ct[c] === 0) rasgos++; } }

// ---------- 4. CENAS ----------
const CENAS = [
  { nome: 'cortina', sx: 6.5, sy: 4.8, esfera: [1.3, 1.4, -1.5], raio: 1.4 },
  { nome: 'toalha', sx: 6, sy: 6, esfera: [0, 1.4, 0], raio: 1.4 },
];
let cena = 0, ventoOn = true, modoCortar = false;
const centro = new THREE.Vector3(), WD = [0.25, 0.05, -1];   // direção do vento (normalizada abaixo)
{ const l = Math.hypot(WD[0], WD[1], WD[2]); WD[0] /= l; WD[1] /= l; WD[2] /= l; }
let agarrado = -1;
const alvoG = new THREE.Vector3();
let NORM = null;

function reiniciar() {
  const c = CENAS[cena], dx = c.sx / (COLS - 1), dy = c.sy / (ROWS - 1);
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    const k = idx(i, j) * 3, r = (Math.random() - 0.5) * 0.02;   // um tremorzinho quebra a simetria
    if (cena === 0) { X[k] = i * dx - c.sx / 2; X[k + 1] = 6.2 - j * dy; X[k + 2] = r; }
    else { X[k] = i * dx - c.sx / 2; X[k + 1] = 4.8 + r; X[k + 2] = j * dy - c.sy / 2; }
    invBase[idx(i, j)] = (cena === 0 && j === 0 && (i % 4 === 0 || i === COLS - 1)) ? 0 : 1;   // argolas na vara
  }
  P.set(X);
  inv.set(invBase);
  for (let q = 0; q < NC; q++) {
    const a = ca[q] * 3, b = cb[q] * 3;
    rest[q] = Math.hypot(X[a] - X[b], X[a + 1] - X[b + 1], X[a + 2] - X[b + 2]);   // o comprimento de descanso é a distância inicial
  }
  vivo.fill(1);
  rasgos = 0;
  agarrado = -1;
  centro.set(c.esfera[0], c.esfera[1], c.esfera[2]);
  ventoOn = cena === 0;
  atualizarIndices();
  sujo = false;
}

// ---------- 5. O PASSO DA SIMULAÇÃO ----------
let tSim = 0;
function atrito(k, nx, ny, nz, pen) {
  const dx = X[k] - P[k], dy = X[k + 1] - P[k + 1], dz = X[k + 2] - P[k + 2];   // deslocamento neste subpasso
  const dn = dx * nx + dy * ny + dz * nz;
  const tx = dx - dn * nx, ty = dy - dn * ny, tz = dz - dn * nz;                // parte tangente à superfície
  const tl = Math.sqrt(tx * tx + ty * ty + tz * tz);
  if (tl < 1e-9) return;
  const f = tl < MU_EST * pen ? 1 : Math.min(MU_CIN * pen / tl, 1);             // 1 = trava; menos que 1 = só freia
  X[k] -= tx * f; X[k + 1] -= ty * f; X[k + 2] -= tz * f;
}
function esticamento(p) {                                       // maior razão (comprimento / descanso) entre as arestas vivas que tocam a partícula p
  const i = p % COLS, j = (p / COLS) | 0;
  const lista = [H[p], V[p], i > 0 ? H[p - 1] : -1, j > 0 ? V[p - COLS] : -1];
  let m = 0;
  for (const q of lista) {
    if (q < 0 || !vivo[q]) continue;
    const a = ca[q] * 3, b = cb[q] * 3;
    m = Math.max(m, Math.hypot(X[a] - X[b], X[a + 1] - X[b + 1], X[a + 2] - X[b + 2]) / rest[q]);
  }
  return m;
}
function passo() {
  const h = DT / SUB, raioC = CENAS[cena].raio + 0.06;
  const forca = 7 + 4 * Math.sin(tSim * 0.9);                  // o vento oscila: rajadas
  for (let s = 0; s < SUB; s++) {
    // (1) Verlet: nova posição = posição + velocidade (X - P) + aceleração * h²
    for (let i = 0; i < N; i++) {
      if (inv[i] === 0) continue;
      const k = i * 3;
      let ax = 0, ay = GRAV, az = 0;
      if (ventoOn) {                                           // vento aerodinâmico: empurra mais quando o pano está de frente
        const nx = NORM[k], ny = NORM[k + 1], nz = NORM[k + 2];
        const f = (nx * WD[0] + ny * WD[1] + nz * WD[2]) * forca * (0.6 + 0.4 * Math.sin(tSim * 2.1 + X[k] * 1.3 + X[k + 2] * 0.7));
        ax += nx * f; ay += ny * f; az += nz * f;
      }
      const x0 = X[k], y0 = X[k + 1], z0 = X[k + 2], hh = h * h;
      const vx = clamp((x0 - P[k]) * AMORT, -0.3, 0.3);        // limite de velocidade: evita explosões
      const vy = clamp((y0 - P[k + 1]) * AMORT, -0.3, 0.3);
      const vz = clamp((z0 - P[k + 2]) * AMORT, -0.3, 0.3);
      P[k] = x0; P[k + 1] = y0; P[k + 2] = z0;
      X[k] = x0 + vx + ax * hh; X[k + 1] = y0 + vy + ay * hh; X[k + 2] = z0 + vz + az * hh;
    }
    if (agarrado >= 0) {                                       // a partícula segurada segue o mouse
      const k = agarrado * 3;
      if (esticamento(agarrado) < LIM_PUXAR) {                 // só avança enquanto o pano aguenta; senão espera ele alcançar
        const gx = alvoG.x - X[k], gy = alvoG.y - X[k + 1], gz = alvoG.z - X[k + 2];
        const gd = Math.sqrt(gx * gx + gy * gy + gz * gz), esc = gd > PASSO_MAX ? PASSO_MAX / gd : 1;   // no máximo PASSO_MAX por subpasso
        X[k] += gx * esc; X[k + 1] += gy * esc; X[k + 2] += gz * esc;
      }
      P[k] = X[k]; P[k + 1] = X[k + 1]; P[k + 2] = X[k + 2];   // parada neste subpasso: sem velocidade acumulada
    }
    // (2) restrições de distância: cada par é empurrado de volta ao comprimento de descanso
    for (let it = 0; it < ITER; it++) {
      for (let qq = 0; qq < NC; qq++) {
        const q = (it & 1) ? NC - 1 - qq : qq;                 // alterna o sentido: sem viés para um lado
        if (!vivo[q]) continue;
        const tipo = ct[q];

        const a = ca[q] * 3, b = cb[q] * 3;
        const dx = X[b] - X[a], dy = X[b + 1] - X[a + 1], dz = X[b + 2] - X[a + 2];
        const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (len === 0) continue;
        const wa = inv[ca[q]], wb = inv[cb[q]], ws = wa + wb;
        if (ws === 0) continue;
        const f = (len - rest[q]) / len * RIGIDEZ[tipo] / ws;
        X[a] += dx * f * wa; X[a + 1] += dy * f * wa; X[a + 2] += dz * f * wa;
        X[b] -= dx * f * wb; X[b + 1] -= dy * f * wb; X[b + 2] -= dz * f * wb;

    }

    // Quanto mais fundo ela entrou (pen), mais atrito: se o deslize tangencial for menor que MU_EST*pen,
    // a partícula fica parada; senão é freada. É isso que segura o pano no topo da esfera.
    for (let i = 0; i < N; i++) {
      if (inv[i] === 0) continue;
      const k = i * 3;
      if (X[k + 1] < 0.02) {                                   // chão: normal = (0, 1, 0)
        const pen = 0.02 - X[k + 1];
        X[k + 1] = 0.02;
        atrito(k, 0, 1, 0, pen);
      }
      const ex = X[k] - centro.x, ey = X[k + 1] - centro.y, ez = X[k + 2] - centro.z;
      const d = Math.sqrt(ex * ex + ey * ey + ez * ez);
      if (d < raioC && d > 1e-6) {                             // esfera: normal = do centro para a partícula
        const nx = ex / d, ny = ey / d, nz = ez / d, pen = raioC - d;
        X[k] = centro.x + nx * raioC; X[k + 1] = centro.y + ny * raioC; X[k + 2] = centro.z + nz * raioC;
        atrito(k, nx, ny, nz, pen);
      }
    }
    tSim += h;
  }
}

// ---------- 6. CENA VISUAL ----------
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
scene.background = new THREE.Color(0x1b2233);
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x4a3f36, 0.7));
const luz = new THREE.DirectionalLight(0xffffff, 1.3);
luz.position.set(5, 12, 7);
luz.castShadow = true;
luz.shadow.mapSize.set(2048, 2048);
luz.shadow.camera.left = luz.shadow.camera.bottom = -8;
luz.shadow.camera.right = luz.shadow.camera.top = 8;
luz.shadow.camera.near = 1;
luz.shadow.camera.far = 40;

luz.shadow.normalBias = 0.03;

const chao = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x2f3a58, roughness: 0.95 }));
chao.rotation.x = -Math.PI / 2;
chao.receiveShadow = true;

const esfera = new THREE.Mesh(new THREE.SphereGeometry(CENAS[0].raio, 48, 32), new THREE.MeshStandardMaterial({ color: 0x4a90d9, roughness: 0.35 }));
esfera.castShadow = esfera.receiveShadow = true;

vara.rotation.z = Math.PI / 2;
vara.position.set(0, 6.22, 0);
scene.add(vara);

const cv = document.createElement('canvas');                     // textura xadrez de pano de mesa, feita no canvas
cv.width = cv.height = 256;
const g2 = cv.getContext('2d');
g2.fillStyle = '#f4efe6';
g2.fillRect(0, 0, 256, 256);
g2.fillStyle = 'rgba(196,48,43,0.6)';
for (let s = 0; s < 256; s += 64) { g2.fillRect(s, 0, 32, 256); g2.fillRect(0, s, 256, 32); }
const tex = new THREE.CanvasTexture(cv);
tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
tex.repeat.set(4, 3);
const mat = new THREE.MeshStandardMaterial({ map: tex, side: THREE.DoubleSide, roughness: 0.9 });

const pano = new THREE.Mesh(geo, mat);
pano.castShadow = pano.receiveShadow = true;
pano.frustumCulled = false;
scene.add(pano);

reiniciar();
geo.computeVertexNormals();
NORM = geo.attributes.normal.array;
function aplicarCena() {

function build(code,full,titulo){
  return '<!DOCTYPE html><html><head>'+(titulo?'<meta charset="utf-8"><title>'+titulo.replace(/</g,'&lt;')+'</title>':'')+'<style>html,body{margin:0;overflow:hidden;background:#111827}canvas{display:block}</style>'+
  '<script crossorigin="anonymous" src="'+CDN+'build/three.min.js"><\/script><script crossorigin="anonymous" src="'+CDN+'examples/js/controls/OrbitControls.js"><\/script><script crossorigin="anonymous" src="'+CDN+'examples/js/controls/PointerLockControls.js"><\/script>'+((/EffectComposer/.test(code)?POS:[]).concat(/GLTFLoader/.test(code)?['loaders/GLTFLoader']:[])).map(f=>'<script crossorigin="anonymous" src="'+CDN+'examples/js/'+f+'.js"><\/script>').join('')+'</head><body>'+
  (titulo?'':'<script>onerror=function(m,s,l){parent.postMessage({guiaErr:m+(l?" (linha "+l+")":"")},"*");return true};<\/script>')+
  '<script>addEventListener("keydown",function(e){'+(titulo?'':'if(e.key==="Escape")parent.postMessage({guiaEsc:1},"*");')+'if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].indexOf(e.code)>-1)e.preventDefault()},{passive:false});addEventListener("pointerdown",function(){focus()});<\/script>'+
  '<script>'+(full?'':PRE)+'\n'+code.replace(/<\/script/gi,'<\\/script')+'\n<\/script></body></html>';
}

// ===== Interface =====
const $=s=>document.querySelector(s);
let cur=0,timer=null,done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem('g3d-done')||'[]'))}catch(e){}
const GRUPOS={0:'Fundamentos',5:'Cena e interação',11:'Jogos',35:'Avançado',63:'Projeto final'};
const nav=$('#nav');
CAPS.forEach((c,i)=>{if(GRUPOS[i]){const h=document.createElement('div');h.className='grp';h.textContent=GRUPOS[i];nav.appendChild(h)}const a=document.createElement('a');a.innerHTML='<i>'+String(i+1).padStart(2,'0')+'</i>'+c.t;a.onclick=()=>go(i);nav.appendChild(a)});
// ===== Maximizar a visão 3D =====
let fsReal=false;
function setMax(pane,on){
  pane=pane||document.querySelector('.pane.max');
  if(!pane)return;
  const b=pane.querySelector('#mx');
  pane.classList.toggle('max',on);
  document.body.classList.toggle('maxlock',on);
  if(b)b.textContent=on?'✕ Sair':'Maximizar';
  if(on){
    fsReal=false;
    const rf=pane.requestFullscreen||pane.webkitRequestFullscreen;
    if(rf)try{const r=rf.call(pane);fsReal=true;if(r&&r.catch)r.catch(()=>{fsReal=false})}catch(e){fsReal=false}
    const f=document.getElementById('fr');if(f)setTimeout(()=>f.focus(),50);
  }else{
    const ef=document.fullscreenElement||document.webkitFullscreenElement;
    if(ef){const xf=document.exitFullscreen||document.webkitExitFullscreen;try{xf.call(document)}catch(e){}}
    fsReal=false;
  }
}
function fsChange(){
  if(fsReal&&!(document.fullscreenElement||document.webkitFullscreenElement)&&document.body.classList.contains('maxlock'))setMax(null,false);
}
document.addEventListener('fullscreenchange',fsChange);
document.addEventListener('webkitfullscreenchange',fsChange);
addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('maxlock'))setMax(null,false)});
function go(i){
  if(document.body.classList.contains('maxlock'))setMax(null,false);
  cur=i;const c=CAPS[i];done.add(i);
  try{localStorage.setItem('g3d-done',JSON.stringify([...done]))}catch(e){}
  [...nav.querySelectorAll('a')].forEach((a,j)=>{a.classList.toggle('on',j===i);a.classList.toggle('ok',done.has(j)&&j!==i)});
  $('#bar').style.width=(done.size/CAPS.length*100)+'%';
  $('#main').innerHTML='<div class="num">'+(i+1)+'</div><h1>'+c.t+'</h1><p class="lead">'+c.lead+'</p>'+c.txt+
   '<div class="lab"><div class="pane"><div class="bar"><span>código (editável)</span><button id="rs">Restaurar</button><button class="run" id="rn">▶ Executar</button></div><textarea id="ed" spellcheck="false"></textarea></div>'+
   '<div class="pane"><div class="bar"><span>resultado ao vivo</span><button id="mx" title="Ampliar a visão 3D para a tela inteira (Esc para sair)">Maximizar</button><button id="dl" title="Baixa só a cena, para abrir em outra aba">⬇ Baixar HTML</button></div><iframe id="fr" title="Pré-visualização 3D"></iframe><div class="err" id="er"></div></div></div>'+
   '<p style="color:var(--mut);font-size:15px">O código roda automaticamente enquanto você digita. Atalho: <code>Ctrl+Enter</code>.</p>'+
   '<div class="pg"><button id="pv" '+(i?'':'disabled')+'>← Anterior</button><button id="nx" '+(i<CAPS.length-1?'':'disabled')+'>Próximo →</button></div>';
  const ed=$('#ed');ed.value=c.code;
  const run=()=>{$('#er').textContent='';$('#fr').srcdoc=build(ed.value,c.full)};
  ed.oninput=()=>{clearTimeout(timer);timer=setTimeout(run,700)};
  ed.onkeydown=e=>{
    if(e.key==='Tab'){e.preventDefault();const s=ed.selectionStart;ed.setRangeText('  ',s,ed.selectionEnd,'end')}
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();clearTimeout(timer);run()}
  };
  $('#rn').onclick=run;$('#rs').onclick=()=>{ed.value=c.code;run()};
  $('#dl').onclick=()=>{                       // baixa só a cena, com o código que está no editor agora
    const nome=c.t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([build(ed.value,c.full,c.t)],{type:'text/html;charset=utf-8'}));
    a.download=String(i+1).padStart(2,'0')+'-'+nome+'.html';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  $('#mx').onclick=()=>setMax($('#mx').closest('.pane'),!document.body.classList.contains('maxlock'));
  $('#pv').onclick=()=>go(cur-1);$('#nx').onclick=()=>go(cur+1);
  run();scrollTo(0,0);$('#side').classList.remove('open');
}
addEventListener('message',e=>{if(e.data&&e.data.guiaEsc&&document.body.classList.contains('maxlock'))setMax(null,false);if(e.data&&e.data.guiaErr){const er=$('#er');if(er)er.textContent='⚠ '+e.data.guiaErr}});
$('#menu').onclick=()=>$('#side').classList.toggle('open');
go(0);
</script>
</body>
</html>
