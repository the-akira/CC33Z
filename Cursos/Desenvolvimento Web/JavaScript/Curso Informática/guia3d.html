 txt:`<p>O estado de cada fase é pequeno: uma <b>grade de textos</b> (<code>#</code> parede, <code>$</code> caixa, <code>.</code> alvo, <code>@</code> jogador, <code>*</code> caixa já no alvo) e as posições do jogador e das caixas. A regra central cabe em poucas linhas: você só anda se a célula da frente não for parede, e só empurra uma caixa se a célula <b>atrás dela</b> estiver livre (nem parede, nem outra caixa).</p>
 <p>O <b>desfazer</b> usa uma <b>pilha</b>: cada movimento guarda a direção e a caixa que foi empurrada (se houve). Para voltar, tiramos o último item da pilha e andamos ao contrário. A fase está resolvida quando <b>toda caixa</b> está sobre um alvo. A posição lógica muda na hora, e os objetos 3D só deslizam até ela com <code>lerp</code>.</p>
 <div class="note"><b>Controles:</b> clique no preview; setas ou WASD movem, <b>Z</b> desfaz, <b>R</b> reinicia a fase e <b>Enter</b> avança quando ela for resolvida.</div>
 <div class="note tip"><b>Desafios:</b> (1) crie uma fase nova no array <code>NIVEIS</code>; (2) conte também quantas vezes você empurrou caixas; (3) guarde o menor número de movimentos de cada fase.</div>`,
 code:`const NIVEIS = [
  ['########', '#@ $  .#', '########'],
  ['####', '# .#', '#  ###', '#*@  #', '#  $ #', '#  ###', '####'],
  ['######', '#    #', '# #@ #', '# $* #', '# .* #', '#    #', '######'],
  ['#####', '#   #', '# $ #', '#.@$#', '#  .#', '#####'],
  ['#######', '#     #', '# $ $ #', '# . . #', '#  @  #', '#######'],
  ['#######', '#     #', '# .$. #', '## $@ #', ' #    #', ' ######'],
  ['  ####', '###  ####', '#     $ #', '# #  #$ #', '# . .#@ #', '#########'],
  ['########', '#      #', '# .**$@#', '#      #', '#####  #', '    ####']
];
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const TECLAS = { ArrowRight: [1, 0], KeyD: [1, 0], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowDown: [0, 1], KeyS: [0, 1], ArrowUp: [0, -1], KeyW: [0, -1] };

scene.add(new THREE.HemisphereLight(0xffffff, 0x223355, 1.2));
const sol = new THREE.DirectionalLight(0xffffff, 0.8);
sol.position.set(4, 10, 6);
scene.add(sol);

const geoParede = new THREE.BoxGeometry(1, 0.7, 1), geoChao = new THREE.BoxGeometry(0.98, 0.1, 0.98);
const geoCaixa = new THREE.BoxGeometry(0.92, 0.92, 0.92), geoAlvo = new THREE.CylinderGeometry(0.3, 0.3, 0.02, 20);
const matParede = new THREE.MeshStandardMaterial({ color: 0x475569 });
const matChao = new THREE.MeshStandardMaterial({ color: 0x1e1b4b });
const matAlvo = new THREE.MeshBasicMaterial({ color: 0x22d3ee });
const matCaixa = new THREE.MeshStandardMaterial({ color: 0xf59e0b });
const matOk = new THREE.MeshStandardMaterial({ color: 0x22c55e });

const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:12px;left:16px;color:#fff;font:700 18px system-ui;text-shadow:0 2px 6px #000';
document.body.appendChild(hud);

let nivel = 0, mundo, W, H, paredes, alvos, caixas, jog, pilha, movs, venceu;
const pos = (x, z, y) => new THREE.Vector3(x - W / 2 + 0.5, y, z - H / 2 + 0.5);
const parede = (x, z) => paredes.has(x + ',' + z);
const caixaEm = (x, z) => caixas.find((c) => c.x === x && c.z === z);

function carregar(n) {
  if (mundo) scene.remove(mundo);
  mundo = new THREE.Group();
  scene.add(mundo);
  const mapa = NIVEIS[n];
  H = mapa.length;
  W = Math.max(...mapa.map((l) => l.length));
  paredes = new Set(); alvos = new Set(); caixas = []; pilha = []; movs = 0; venceu = false;

  const grade = mapa.map((l) => [...l.padEnd(W)]);
  let inicio;
  grade.forEach((linha, z) => linha.forEach((c, x) => {
    if (c === '#') paredes.add(x + ',' + z);
    if (c === '.' || c === '*' || c === '+') alvos.add(x + ',' + z);
    if (c === '$' || c === '*') caixas.push({ x, z });
    if (c === '@' || c === '+') inicio = { x, z };
  }));

  // paredes
  paredes.forEach((k) => {
    const [x, z] = k.split(',').map(Number);
    const m = new THREE.Mesh(geoParede, matParede);
    m.position.copy(pos(x, z, 0.35));
    mundo.add(m);
  });
  // chão: só as células que o jogador consegue alcançar
  const fila = [inicio], vis = new Set([inicio.x + ',' + inicio.z]);
  while (fila.length) {
    const { x, z } = fila.pop();
    const m = new THREE.Mesh(geoChao, matChao);
    m.position.copy(pos(x, z, -0.05));
    mundo.add(m);
    if (alvos.has(x + ',' + z)) {
      const a = new THREE.Mesh(geoAlvo, matAlvo);
      a.position.copy(pos(x, z, 0.02));
      mundo.add(a);
    }
    DIRS.forEach(([a, b]) => {
      const k = (x + a) + ',' + (z + b);
      if (!vis.has(k) && !paredes.has(k) && grade[z + b] && grade[z + b][x + a] !== undefined) {
        vis.add(k);
        fila.push({ x: x + a, z: z + b });
      }
    });
  }
  // caixas e jogador
  caixas.forEach((c) => {
    c.mesh = new THREE.Mesh(geoCaixa, matCaixa);
    c.mesh.position.copy(pos(c.x, c.z, 0.47));
    mundo.add(c.mesh);
  });
  jog = { x: inicio.x, z: inicio.z, mesh: new THREE.Mesh(new THREE.SphereGeometry(0.38, 20, 14), new THREE.MeshStandardMaterial({ color: 0xff4fd8 })) };
  jog.mesh.position.copy(pos(jog.x, jog.z, 0.4));
  mundo.add(jog.mesh);

  const m = Math.max(W, H);
  camera.position.set(0, m * 1.5 + 4, m * 0.8 + 3);
  camera.lookAt(0, 0, 0.3);
}

function tentar(dx, dz) {
  if (venceu) return;
  const nx = jog.x + dx, nz = jog.z + dz;
  if (parede(nx, nz)) return;
  const c = caixaEm(nx, nz);
  if (c) {
    const bx = nx + dx, bz = nz + dz;
    if (parede(bx, bz) || caixaEm(bx, bz)) return; // caixa travada
    c.x = bx; c.z = bz;
  }
  jog.x = nx; jog.z = nz;
  pilha.push({ dx, dz, caixa: c || null });
  movs++;
  venceu = caixas.every((b) => alvos.has(b.x + ',' + b.z));
}
function desfazer() {
  const u = pilha.pop();
  if (!u) return;
  jog.x -= u.dx; jog.z -= u.dz;
  if (u.caixa) { u.caixa.x -= u.dx; u.caixa.z -= u.dz; }
  movs--;
  venceu = false;
}

addEventListener('keydown', (e) => {
  if (TECLAS[e.code]) tentar(TECLAS[e.code][0], TECLAS[e.code][1]);
  else if (e.code === 'KeyZ' || e.code === 'KeyU') desfazer();
  else if (e.code === 'KeyR') carregar(nivel);
  else if ((e.code === 'Enter' || e.code === 'KeyN') && venceu) {
    nivel = (nivel + 1) % NIVEIS.length;
    carregar(nivel);
  }
});

carregar(nivel);
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const k = 1 - Math.exp(-dt * 16); // deslizar suave até a posição lógica
  jog.mesh.position.lerp(pos(jog.x, jog.z, 0.4), k);
  caixas.forEach((c) => {
    c.mesh.position.lerp(pos(c.x, c.z, 0.47), k);
    c.mesh.material = alvos.has(c.x + ',' + c.z) ? matOk : matCaixa;
  });
  hud.textContent = 'Nível ' + (nivel + 1) + '/' + NIVEIS.length + '   Movimentos: ' + movs +
    (venceu ? '   RESOLVIDO! Enter = próximo' : '') + '   |   Z desfaz   R reinicia';
  renderer.render(scene, camera);
});`},
{t:"Plataforma 3D",
 lead:"Pulos entre plataformas, gravidade e colisão.",
 txt:`<p>Um jogo de plataforma precisa de três coisas: <b>gravidade</b> (a velocidade vertical <code>vel.y</code> diminui um pouco a cada quadro), <b>pulo</b> (só trocamos <code>vel.y</code> por um valor positivo, e apenas se o jogador estiver no chão, com uma pequena tolerância para pular logo depois de sair da borda ou logo antes de pousar) e <b>colisão</b> com as plataformas, que são caixas.</p>
 <p>O truque da colisão é mover <b>um eixo por vez</b> (<code>x</code>, depois <code>z</code>, depois <code>y</code>). Se depois de mover a caixa do jogador invade uma plataforma, empurramos de volta para a borda dela. Assim o jogador desliza pelas paredes e, quando a colisão acontece caindo no eixo <code>y</code>, sabemos que ele <b>pousou</b>. A sombra no chão ajuda a calcular onde o pulo vai cair.</p>
 <div class="note"><b>Controles:</b> clique no preview; WASD ou setas movem, <b>Z</b> pula (ou o <b>clique do mouse</b>) e <b>R</b> reinicia. Colete as estrelas e chegue à bandeira.</div>
 <div class="note tip"><b>Desafios:</b> (1) mude <code>GRAV</code> e <code>PULO</code> para criar uma lua de baixa gravidade; (2) permita um segundo pulo no ar; (3) adicione uma plataforma que se move de um lado para o outro.</div>`,
 code:`// cada plataforma: [centro x, altura do topo, centro z, largura, profundidade]
const PLAT = [
  [0, 0, 0, 7, 7],
  [0, 0.6, -7.5, 3, 3],
  [3.5, 1.3, -12, 3, 3],
  [-1, 2.0, -16.5, 3, 3],
  [-6, 2.7, -19, 3, 3],
  [-6, 3.4, -24, 3, 3],
  [-1, 4.1, -27, 3, 3],
  [4, 4.8, -30, 6, 6]
];
const ESTRELAS = [[0, 1.5, -7.5], [3.5, 2.2, -12], [-6, 3.6, -19], [-1, 5.0, -27]];

scene.add(new THREE.HemisphereLight(0xffffff, 0x223355, 1.2));
const sol = new THREE.DirectionalLight(0xffffff, 0.8);
sol.position.set(5, 12, 6);
scene.add(sol);

const H = 0.4, M = H - 0.001;      // metade do lado do jogador (M evita erro de arredondamento)
const GRAV = 28, PULO = 10, VEL = 6;

const plataformas = PLAT.map(([cx, topo, cz, w, d], i) => {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, 1, d),
    new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(i / 9, 0.55, 0.5) })
  );
  m.position.set(cx, topo - 0.5, cz);
  scene.add(m);
  return {
    min: new THREE.Vector3(cx - w / 2, topo - 1, cz - d / 2),
    max: new THREE.Vector3(cx + w / 2, topo, cz + d / 2),
    topo
  };
});
const meta = plataformas[plataformas.length - 1];

// bandeira na última plataforma
const mx = (meta.min.x + meta.max.x) / 2, mz = (meta.min.z + meta.max.z) / 2;
const mastro = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2, 8), new THREE.MeshStandardMaterial({ color: 0xe5e7eb }));
mastro.position.set(mx, meta.topo + 1, mz);
const pano = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.05), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
pano.position.set(mx + 0.45, meta.topo + 1.65, mz);
scene.add(mastro, pano);

const estrelas = ESTRELAS.map((p) => {
  const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.3), new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0x7a5d00 }));
  mesh.position.set(p[0], p[1], p[2]);
  scene.add(mesh);
  return { mesh, pega: false };
});

const jogador = new THREE.Mesh(new THREE.BoxGeometry(H * 2, H * 2, H * 2), new THREE.MeshStandardMaterial({ color: 0xff4fd8 }));
scene.add(jogador);
const sombra = new THREE.Mesh(new THREE.CircleGeometry(0.4, 16), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45 }));
sombra.rotation.x = -Math.PI / 2;
scene.add(sombra);

const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:12px;left:16px;color:#fff;font:700 20px system-ui;text-shadow:0 2px 6px #000';
document.body.appendChild(hud);

const teclas = {};
const PULAR = ['KeyZ', 'Mouse']; // pulo: tecla Z (mão esquerda, não conflita com as setas) ou clique do mouse
let bufferPulo = 0, tempoChao = 0;        // tolerâncias: pulo "guardado" e pulo logo após sair da borda
addEventListener('keydown', (e) => {
  teclas[e.code] = true;
  if (e.code === 'KeyR') reiniciar();
  if (PULAR.includes(e.code)) bufferPulo = 0.12;
});
addEventListener('keyup', (e) => (teclas[e.code] = false));
addEventListener('mousedown', () => { teclas.Mouse = true; bufferPulo = 0.12; }); // o botão do mouse não sofre esse limite do teclado
addEventListener('mouseup', () => (teclas.Mouse = false));

const pos = new THREE.Vector3(), vel = new THREE.Vector3();
let noChao = false, sobre = null, quedas = 0, coletadas = 0, venceu = false;

function respawn() {
  pos.set(0, H + 0.01, 0);
  vel.set(0, 0, 0);
  camera.position.set(0, 5.4, 9);
}
function reiniciar() {
  quedas = 0; coletadas = 0; venceu = false;
  estrelas.forEach((e) => { e.pega = false; e.mesh.visible = true; });
  respawn();
}
reiniciar();

// ---- colisão AABB (caixa contra caixa)
function sobrepoe(p) {
  return pos.x + M > p.min.x && pos.x - M < p.max.x &&
         pos.y + M > p.min.y && pos.y - M < p.max.y &&
         pos.z + M > p.min.z && pos.z - M < p.max.z;
}
function mover(eixo, d) {
  if (d === 0) return;
  pos[eixo] += d;
  for (const p of plataformas) {
    if (!sobrepoe(p)) continue;
    // empurra o jogador de volta para fora da plataforma
    pos[eixo] = d > 0 ? p.min[eixo] - H : p.max[eixo] + H;
    if (eixo === 'y') {
      if (d < 0) { noChao = true; sobre = p; } // caindo e bateu: pousou
      vel.y = 0;
    }
  }
}

const clock = new THREE.Clock();
renderer.setAnimationLoop((t) => {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  if (!venceu) {
    const dx = ((teclas.KeyD || teclas.ArrowRight) ? 1 : 0) - ((teclas.KeyA || teclas.ArrowLeft) ? 1 : 0);
    const dz = ((teclas.KeyS || teclas.ArrowDown) ? 1 : 0) - ((teclas.KeyW || teclas.ArrowUp) ? 1 : 0);
    const n = Math.hypot(dx, dz) || 1; // normaliza: na diagonal não corre mais rápido
    tempoChao = noChao ? 0.1 : tempoChao - dt;
    if (PULAR.some((k) => teclas[k])) bufferPulo = 0.12;
    bufferPulo -= dt;
    noChao = false; sobre = null;

    mover('x', (dx / n) * VEL * dt);
    mover('z', (dz / n) * VEL * dt);
    if (bufferPulo > 0 && tempoChao > 0) { vel.y = PULO; bufferPulo = 0; tempoChao = 0; }
    vel.y = Math.max(vel.y - GRAV * dt, -24); // gravidade, com velocidade máxima de queda
    mover('y', vel.y * dt);

    if (pos.y < -12) { quedas++; respawn(); }
    if (sobre === meta) venceu = true;

    estrelas.forEach((e) => {
      if (e.pega) return;
      e.mesh.rotation.y += dt * 2;
      if (e.mesh.position.distanceTo(pos) < 0.8) { e.pega = true; e.mesh.visible = false; coletadas++; }
    });
  }
  jogador.position.copy(pos);

  // sombra sobre a plataforma que está logo abaixo
  let ytopo = -Infinity;
  for (const p of plataformas) {
    if (pos.x > p.min.x && pos.x < p.max.x && pos.z > p.min.z && pos.z < p.max.z &&
        p.topo <= pos.y - H + 0.01 && p.topo > ytopo) ytopo = p.topo;
  }
  sombra.visible = ytopo > -Infinity;
  sombra.position.set(pos.x, ytopo + 0.02, pos.z);
  sombra.scale.setScalar(Math.max(0.3, 1 - (pos.y - H - ytopo) * 0.12));

  // câmera em terceira pessoa, suave
  camera.position.lerp(new THREE.Vector3(pos.x, pos.y + 5, pos.z + 9), 1 - Math.exp(-dt * 4));
  camera.lookAt(pos.x, pos.y, pos.z - 3);

  hud.textContent = 'Estrelas: ' + coletadas + '/' + estrelas.length + '   Quedas: ' + quedas +
    (venceu ? '   CHEGOU! (R reinicia)' : '');
  renderer.render(scene, camera);
});`},
{t:"Nave espacial",
 lead:"Um rail shooter à la Star Fox: tiros, inimigos, asteroides, explosões, vidas e fases.",
 txt:`<p>Num <i>rail shooter</i> a nave quase não sai do lugar: <b>o mundo é que vem em sua direção</b>. Estrelas, asteroides e inimigos nascem lá no fundo (<code>z = -130</code>) e avançam para a câmera. Isso evita ter de mover a câmera por um mundo gigante.</p>
 <p>Cada tipo de objeto vive numa <b>lista</b> (<code>alvos</code>, <code>tirosJ</code>, <code>tirosI</code>, <code>fagulhas</code>). A cada frame percorremos a lista de trás para frente, movemos, testamos colisão por <b>distância entre esferas</b> e removemos quem saiu da tela ou foi atingido.</p>
 <p>A cada 8 abates sobe a <b>fase</b>: tudo fica mais rápido, nascem mais inimigos e, a partir da fase 2, eles <b>atiram em você</b>. Passar de fase devolve uma vida.</p>
 <div class="note"><b>Controles:</b> clique no preview. <b>WASD</b>/setas movem, <b>Z</b> (segure) atira, <b>R</b> reinicia. Ao ser atingido você fica piscando e invulnerável por 2 s.</div>
 <div class="note tip"><b>Desafios:</b> (1) crie um item de cura que cai dos inimigos; (2) faça um chefe na fase 5, com barra de vida; (3) adicione uma bomba na tecla B que destrói tudo na tela; (4) toque sons de tiro com Web Audio.</div>`,
 code:`camera.far = 220;
camera.updateProjectionMatrix();
scene.background = new THREE.Color(0x02030a);
scene.fog = new THREE.Fog(0x02030a, 70, 150);
scene.add(new THREE.HemisphereLight(0x99bbff, 0x221133, 1.2));
const sol = new THREE.DirectionalLight(0xffffff, 1.4);
sol.position.set(4, 8, 6);
scene.add(sol);
const mat = (c, e = 0x000000) => new THREE.MeshStandardMaterial({ color: c, emissive: e });

// ---- estrelas (Points) que correm em direção à câmera ----
const NE = 1500;
const estPos = new Float32Array(NE * 3);
for (let i = 0; i < NE; i++) {
  estPos[i * 3] = (Math.random() - 0.5) * 120;
  estPos[i * 3 + 1] = (Math.random() - 0.5) * 80;
  estPos[i * 3 + 2] = -150 + Math.random() * 170;
}
const estGeo = new THREE.BufferGeometry();
estGeo.setAttribute('position', new THREE.BufferAttribute(estPos, 3));
scene.add(new THREE.Points(estGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35 })));

// ---- nave ----
const nave = new THREE.Group();
const corpo = new THREE.Mesh(new THREE.ConeGeometry(0.5, 2.2, 12), mat(0x60a5fa));
corpo.rotation.x = -Math.PI / 2;                       // ponta para -Z
const asas = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.08, 0.9), mat(0x1d4ed8));
asas.position.z = 0.5;
const motor = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 8), mat(0x22d3ee, 0x22d3ee));
motor.position.z = 1.1;
nave.add(corpo, asas, motor);
scene.add(nave);

// ---- geometrias e materiais compartilhados ----
const geoLaser = new THREE.BoxGeometry(0.12, 0.12, 1.4), matLaser = mat(0x22ff88, 0x22ff88);
const geoBala = new THREE.SphereGeometry(0.25, 8, 8),   matBala = mat(0xff3355, 0xff3355);
const geoInim = new THREE.OctahedronGeometry(0.9),      matInim = mat(0xef4444, 0x550000);
const geoAst = new THREE.IcosahedronGeometry(1, 0),     matAst = mat(0x78716c);
const geoF = new THREE.BoxGeometry(0.2, 0.2, 0.2),      matF = mat(0xffa03a, 0xff7a00);

const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:12px;left:16px;color:#fff;font:700 18px system-ui;text-shadow:0 2px 6px #000;line-height:1.4';
document.body.appendChild(hud);
const teclas = {};
addEventListener('keydown', (e) => { teclas[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', (e) => (teclas[e.code] = false));

// ---- estado ----
const alvos = [], tirosJ = [], tirosI = [], fagulhas = [];
let vivo, vidas, pontos, abates, fase, inv, tiroCd, spawnCd, vx, vy;
let aviso = { txt: '', t: 0 }, shake = 0, melhor = 0;

function criar(geo, material, x, y, z) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}
function sumir(lista, i) { scene.remove(lista[i]); lista.splice(i, 1); }
function explodir(p, n) {
  for (let i = 0; i < n; i++) {
    const f = criar(geoF, matF, p.x, p.y, p.z);
    f.userData = { v: new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(28), vida: 0 };
    fagulhas.push(f);
  }
}
function reiniciar() {
  [alvos, tirosJ, tirosI, fagulhas].forEach((l) => { l.forEach((m) => scene.remove(m)); l.length = 0; });
  nave.position.set(0, 0, 0);
  nave.visible = true;
  vx = 0; vy = 0; vivo = true; vidas = 3; pontos = 0; abates = 0; fase = 1;
  inv = 0; tiroCd = 0; spawnCd = 1;
  aviso = { txt: 'FASE 1', t: 2 };
}
function dano() {
  if (inv > 0) return;
  vidas--; inv = 2; shake = 1;
  if (vidas <= 0) {
    vivo = false; melhor = Math.max(melhor, pontos);
    explodir(nave.position, 40);
    nave.visible = false;
  }
}
function spawn() {
  const ast = Math.random() < 0.4;                      // asteroide ou inimigo
  const r = ast ? 0.8 + Math.random() : 0.9;
  const m = criar(ast ? geoAst : geoInim, ast ? matAst : matInim, 0, 0, -130);
  m.scale.setScalar(ast ? r : 1);
  m.userData = { ast, r, hp: ast ? 2 : 1, x0: (Math.random() * 2 - 1) * 9, y0: (Math.random() * 2 - 1) * 5, off: Math.random() * 6, cd: 1 + Math.random() * 1.5 };
  m.position.set(m.userData.x0, m.userData.y0, -130);
  alvos.push(m);
}
reiniciar();

const clock = new THREE.Clock();
renderer.setAnimationLoop((t) => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const vel = 35 + fase * 5;                           // velocidade do mundo
  if (teclas.KeyR) reiniciar();

  for (let i = 0; i < NE; i++) {                       // estrelas
    estPos[i * 3 + 2] += vel * 1.2 * dt;
    if (estPos[i * 3 + 2] > 20) estPos[i * 3 + 2] -= 170;
  }
  estGeo.attributes.position.needsUpdate = true;

  if (vivo) {
    const ax = ((teclas.KeyD || teclas.ArrowRight) ? 1 : 0) - ((teclas.KeyA || teclas.ArrowLeft) ? 1 : 0);
    const ay = ((teclas.KeyW || teclas.ArrowUp) ? 1 : 0) - ((teclas.KeyS || teclas.ArrowDown) ? 1 : 0);
    vx += (ax * 16 - vx) * Math.min(1, 8 * dt);
    vy += (ay * 12 - vy) * Math.min(1, 8 * dt);
    nave.position.x = THREE.MathUtils.clamp(nave.position.x + vx * dt, -9, 9);
    nave.position.y = THREE.MathUtils.clamp(nave.position.y + vy * dt, -5, 5);
    nave.rotation.z = -vx * 0.05;                      // inclina nas curvas
    nave.rotation.x = vy * 0.04;

    tiroCd -= dt;
    if (teclas.KeyZ && tiroCd <= 0) {                 // dois canhões
      tiroCd = 0.16;
      [-0.9, 0.9].forEach((dx) => tirosJ.push(criar(geoLaser, matLaser, nave.position.x + dx, nave.position.y, -1.2)));
    }
    spawnCd -= dt;
    if (spawnCd <= 0) { spawn(); spawnCd = Math.max(0.35, 1.1 - fase * 0.12); }
    inv = Math.max(0, inv - dt);
    nave.visible = inv <= 0 || Math.floor(inv * 12) % 2 === 0;   // pisca quando invulnerável

    // alvos: inimigos e asteroides
    for (let i = alvos.length - 1; i >= 0; i--) {
      const a = alvos[i], d = a.userData;
      a.position.z += vel * dt;
      if (d.ast) { a.rotation.x += dt; a.rotation.y += dt * 0.7; }
      else {
        a.position.x = d.x0 + Math.sin(t / 700 + d.off) * 3;   // balança de um lado a outro
        a.rotation.z += dt * 2;
        d.cd -= dt;
        if (fase >= 2 && d.cd <= 0 && a.position.z > -80 && a.position.z < -10) {
          d.cd = Math.max(0.9, 2.4 - fase * 0.2);
          const b = criar(geoBala, matBala, a.position.x, a.position.y, a.position.z);
          b.userData = { v: nave.position.clone().sub(a.position).normalize().multiplyScalar(40) };
          tirosI.push(b);                              // mira na nave
        }
      }
      if (a.position.z > 6) { sumir(alvos, i); continue; }
      if (a.position.distanceTo(nave.position) < d.r + 0.9) {   // bateu na nave
        explodir(a.position, 16); sumir(alvos, i); dano();
      }
    }

    // tiros do jogador
    for (let i = tirosJ.length - 1; i >= 0; i--) {
      const l = tirosJ[i];
      l.position.z -= 90 * dt;
      if (l.position.z < -135) { sumir(tirosJ, i); continue; }
      for (let j = alvos.length - 1; j >= 0; j--) {
        const a = alvos[j], d = a.userData;
        if (l.position.distanceTo(a.position) < d.r + 0.4) {
          d.hp--;
          explodir(l.position, 5);
          sumir(tirosJ, i);
          if (d.hp <= 0) {
            explodir(a.position, 18);
            pontos += d.ast ? 50 : 100;
            abates++;
            sumir(alvos, j);
            const nova = 1 + Math.floor(abates / 8);   // sobe de fase a cada 8 abates
            if (nova > fase) { fase = nova; vidas = Math.min(5, vidas + 1); aviso = { txt: 'FASE ' + fase, t: 2.2 }; }
          }
          break;
        }
      }
    }

    // tiros inimigos
    for (let i = tirosI.length - 1; i >= 0; i--) {
      const b = tirosI[i];
      b.position.addScaledVector(b.userData.v, dt);
      if (b.position.z > 8) { sumir(tirosI, i); continue; }
      if (b.position.distanceTo(nave.position) < 1.1) { explodir(b.position, 6); sumir(tirosI, i); dano(); }
    }
  }

  for (let i = fagulhas.length - 1; i >= 0; i--) {     // partículas
    const f = fagulhas[i], d = f.userData;
    d.vida += dt;
    f.position.addScaledVector(d.v, dt);
    f.rotation.x += dt * 8;
    f.scale.setScalar(Math.max(0.001, 1 - d.vida / 0.7));
    if (d.vida > 0.7) sumir(fagulhas, i);
  }

  shake *= 0.9;
  aviso.t -= dt;
  camera.position.set(
    nave.position.x * 0.6 + (Math.random() - 0.5) * shake,
    nave.position.y * 0.6 + 2.2 + (Math.random() - 0.5) * shake,
    9
  );
  camera.lookAt(nave.position.x * 0.5, nave.position.y * 0.5, -20);

  hud.innerHTML = (vivo
    ? 'Vidas: ' + '♥'.repeat(Math.max(0, vidas)) + '<br>Pontos: ' + pontos + '<br>Fase: ' + fase + '  Recorde: ' + melhor
    : 'GAME OVER<br>' + pontos + ' pontos — R reinicia')
    + (aviso.t > 0 ? '<br><span style="color:#22d3ee;font-size:32px">' + aviso.txt + '</span>' : '');
  renderer.render(scene, camera);
});`},
{t:"Corredor infinito",
 lead:"Três pistas, pulo, deslize, obstáculos e moedas — tudo feito só com geometrias.",
 txt:`<p>Como no capítulo da nave, <b>o mundo é que se move</b>: chão, prédios, obstáculos e moedas correm em direção à câmera, e o corredor fica parado em <code>z = 0</code>, mudando só de pista (<code>x</code>) e de altura (<code>y</code>).</p>
 <p>Cada obstáculo exige uma ação diferente: <b>bloco alto</b> → troque de pista; <b>barreira baixa</b> → pule; <b>barra suspensa</b> → deslize. A colisão é uma <b>AABB simplificada</b>: comparamos a faixa de altura do corredor (<code>y</code> até <code>y + altura</code>, que diminui ao deslizar) com a faixa de altura do obstáculo.</p>
 <p>O corredor é um <b>modelo articulado</b>: pernas e braços são grupos com pivô no quadril e no ombro, balançando com <code>Math.sin</code>. Prédios e pedaços de chão são <b>reciclados</b> quando passam da câmera, e a velocidade aumenta com a distância.</p>
 <div class="note"><b>Controles:</b> clique no preview. <b>A/D</b> ou ←/→ trocam de pista, <b>W</b>, ↑ ou <b>Espaço</b> pulam, <b>S</b> ou ↓ deslizam (no ar, descem rápido), <b>R</b> reinicia.</div>
 <div class="note tip"><b>Desafios:</b> (1) crie vagões de trem que dá para correr por cima; (2) adicione um ímã que atrai moedas por 5 s; (3) faça o cenário mudar de dia para noite com a distância; (4) crie um item de escudo que perdoa uma batida.</div>`,
 code:`camera.far = 200;
camera.updateProjectionMatrix();
scene.background = new THREE.Color(0xffc27a);
scene.fog = new THREE.Fog(0xffc27a, 40, 130);
scene.add(new THREE.HemisphereLight(0xfff1d6, 0x6b5b95, 1.2));
const sol = new THREE.DirectionalLight(0xffffff, 1.3);
sol.position.set(-5, 12, 8);
scene.add(sol);
const mat = (c) => new THREE.MeshStandardMaterial({ color: c });
const caixa = (w, h, d, cor) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(cor));
const LARG = 2.5; // distância entre pistas

// sol no horizonte (sem névoa)
const astro = new THREE.Mesh(new THREE.SphereGeometry(14, 24, 16), new THREE.MeshBasicMaterial({ color: 0xff7a3d, fog: false }));
astro.position.set(-22, 20, -160);
scene.add(astro);

// ---- chão: pedaços alternados que serão reciclados ----
const tiles = [];
for (let i = 0; i < 30; i++) {
  const t = caixa(7.8, 0.3, 6, i % 2 ? 0x4b5563 : 0x3f4756);
  t.position.set(0, -0.15, 8 - i * 6);
  scene.add(t);
  tiles.push(t);
}
const terra = caixa(70, 0.2, 220, 0x7c6f64);
terra.position.set(0, -0.35, -90);
scene.add(terra);
[-1.25, 1.25].forEach((x) => {
  const linha = caixa(0.08, 0.02, 220, 0xe5e7eb);
  linha.position.set(x, 0.02, -90);
  scene.add(linha);
});

// ---- prédios dos dois lados ----
const predios = [];
const cores = [0x64748b, 0x94a3b8, 0x7c8aa5, 0xa8a29e, 0x8b7fb8];
for (let i = 0; i < 36; i++) {
  const lado = i % 2 ? 1 : -1;
  const w = 3 + Math.random() * 3, h = 5 + Math.random() * 12;
  const p = caixa(w, h, 5, cores[i % cores.length]);
  p.position.set(lado * (6.5 + w / 2 + Math.random() * 2), h / 2 - 0.3, 8 - Math.floor(i / 2) * 10);
  scene.add(p);
  predios.push(p);
}

// ---- corredor (modelo articulado) ----
const corredor = new THREE.Group();
const torso = caixa(0.6, 0.8, 0.35, 0xf97316); torso.position.y = 1.05;
const cabeca = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 12), mat(0xfcd9b6)); cabeca.position.y = 1.65;
const bone = caixa(0.46, 0.1, 0.5, 0x1d4ed8); bone.position.set(0, 1.84, -0.06);
corredor.add(torso, cabeca, bone);
function membro(x, yPivo, comp, larg, cor) {            // pivô no topo do membro
  const g = new THREE.Group();
  g.position.set(x, yPivo, 0);
  const m = caixa(larg, comp, larg, cor);
  m.position.y = -comp / 2;
  g.add(m);
  corredor.add(g);
  return g;
}
const pernaE = membro(-0.15, 0.7, 0.7, 0.22, 0x1e3a8a), pernaD = membro(0.15, 0.7, 0.7, 0.22, 0x1e3a8a);
const bracoE = membro(-0.4, 1.4, 0.6, 0.16, 0xfcd9b6), bracoD = membro(0.4, 1.4, 0.6, 0.16, 0xfcd9b6);
scene.add(corredor);

// ---- obstáculos e moedas ----
const obst = [], listaMoedas = [], fagulhas = [];
const geoMoeda = new THREE.CylinderGeometry(0.3, 0.3, 0.08, 16);
geoMoeda.rotateX(Math.PI / 2);                          // disco de frente para a câmera
const matMoeda = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0x8a6a00 });
const geoF = new THREE.BoxGeometry(0.15, 0.15, 0.15);
const matF = new THREE.MeshStandardMaterial({ color: 0xffa03a, emissive: 0xff7a00 });
const matPoeira = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xffcc00 });

function obstaculo(tipo, lane, z) {
  let m, o;
  if (tipo === 'bloco') {                               // desvie (troque de pista)
    m = caixa(2.2, 3, 1.2, 0xdc2626);
    m.position.set((lane - 1) * LARG, 1.5, z);
    o = { hw: 1.1, hd: 0.6, y0: 0, y1: 3 };
  } else if (tipo === 'baixa') {                        // pule
    m = caixa(2.2, 1, 0.8, 0xf59e0b);
    m.position.set((lane - 1) * LARG, 0.5, z);
    o = { hw: 1.1, hd: 0.4, y0: 0, y1: 1 };
  } else {                                              // barra suspensa: deslize
    m = new THREE.Group();
    const barra = caixa(7.8, 0.9, 0.5, 0x7c3aed); barra.position.y = 1.65;
    const p1 = caixa(0.3, 2.1, 0.3, 0x5b21b6); p1.position.set(-3.7, 1.05, 0);
    const p2 = caixa(0.3, 2.1, 0.3, 0x5b21b6); p2.position.set(3.7, 1.05, 0);
    m.add(barra, p1, p2);
    m.position.set(0, 0, z);
    o = { hw: 3.9, hd: 0.25, y0: 1.2, y1: 2.1 };
  }
  scene.add(m);
  obst.push({ mesh: m, x: m.position.x, ...o });
}
function moeda(x, y, z) {
  const m = new THREE.Mesh(geoMoeda, matMoeda);
  m.position.set(x, y, z);
  scene.add(m);
  listaMoedas.push(m);
}
function padrao() {                                     // sorteia o próximo "trecho" da pista
  const z = -120, r = Math.random();
  if (r < 0.35) {
    const livre = Math.floor(Math.random() * 3);
    for (let l = 0; l < 3; l++) {
      if (l !== livre && Math.random() < 0.85) obstaculo('bloco', l, z);
    }
    for (let k = 0; k < 5; k++) moeda((livre - 1) * LARG, 1, z - k * 2);
  } else if (r < 0.7) {
    const l0 = Math.floor(Math.random() * 3);
    for (let l = 0; l < 3; l++) if (l === l0 || Math.random() < 0.4) obstaculo('baixa', l, z);
    for (let k = 0; k < 5; k++) moeda((l0 - 1) * LARG, 2.2 - Math.abs(k - 2) * 0.2, z + 2 - k * 1);  // arco sobre a barreira
  } else {
    obstaculo('alta', 1, z);
    const l = Math.floor(Math.random() * 3);
    for (let k = 0; k < 4; k++) moeda((l - 1) * LARG, 0.7, z - k * 1.5);
  }
}
function faiscas(p, n, material) {
  for (let i = 0; i < n; i++) {
    const f = new THREE.Mesh(geoF, material);
    f.position.copy(p);
    f.userData = { v: new THREE.Vector3((Math.random() - 0.5) * 12, Math.random() * 8, (Math.random() - 0.5) * 12), vida: 0 };
    scene.add(f);
    fagulhas.push(f);
  }
}
function sumir(lista, i) { scene.remove(lista[i]); lista.splice(i, 1); }

const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:12px;left:16px;color:#1f1300;font:700 18px system-ui;text-shadow:0 1px 4px #fff8;line-height:1.4';
document.body.appendChild(hud);

// ---- estado e entrada ----
let lane, vy, deslize, anim, vivo, dist, ouro, falta, shake = 0, melhor = 0;
function reiniciar() {
  [obst, listaMoedas, fagulhas].forEach((l) => { l.forEach((m) => scene.remove(m.mesh || m)); l.length = 0; });
  lane = 1; vy = 0; deslize = 0; anim = 0; vivo = true; dist = 0; ouro = 0; falta = 20;
  corredor.position.set(0, 0, 0);
  corredor.rotation.set(0, 0, 0);
}
reiniciar();

addEventListener('keydown', (e) => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyR') return reiniciar();
  if (!vivo) return;
  const noChao = corredor.position.y <= 0.001;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') lane = Math.max(0, lane - 1);
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') lane = Math.min(2, lane + 1);
  else if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') { if (noChao) vy = 10; }
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') { if (noChao) deslize = 0.7; else vy = -16; }
});

function bateu() {
  const h = deslize > 0 ? 0.8 : 1.7;                    // deslizando, o corredor fica mais baixo
  const c = corredor.position;
  return obst.some((o) =>
    Math.abs(o.mesh.position.z) < o.hd + 0.3 &&
    Math.abs(o.x - c.x) < o.hw + 0.3 &&
    c.y < o.y1 && c.y + h > o.y0
  );
}

const clock = new THREE.Clock();
renderer.setAnimationLoop((t) => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const vel = vivo ? Math.min(34, 16 + dist / 40) : 0;   // acelera com a distância
  const c = corredor.position;

  if (vivo) {
    dist += vel * dt;
    c.x += (((lane - 1) * LARG) - c.x) * Math.min(1, 12 * dt);   // troca de pista suave
    vy -= 30 * dt;                                        // gravidade
    c.y = Math.max(0, c.y + vy * dt);
    if (c.y === 0 && vy < 0) vy = 0;
    deslize = Math.max(0, deslize - dt);
    falta -= vel * dt;
    if (falta <= 0) { padrao(); falta = 10 + vel * 0.9; }

    anim += dt * vel * 0.7;                              // animação de corrida
    const no = c.y <= 0.001, s = Math.sin(anim) * (no ? 0.9 : 0.4);
    pernaE.rotation.x = s; pernaD.rotation.x = -s;
    bracoE.rotation.x = -s; bracoD.rotation.x = s;
    corredor.rotation.x += ((deslize > 0 ? 1.2 : 0) - corredor.rotation.x) * Math.min(1, 14 * dt);
    corredor.rotation.z = -(((lane - 1) * LARG) - c.x) * 0.08;
  }

  // o mundo corre em direção à câmera
  const dz = vel * dt;
  tiles.forEach((m) => { m.position.z += dz; if (m.position.z > 14) m.position.z -= 180; });
  predios.forEach((m) => { m.position.z += dz; if (m.position.z > 14) m.position.z -= 180; });
  for (let i = obst.length - 1; i >= 0; i--) {
    obst[i].mesh.position.z += dz;
    if (obst[i].mesh.position.z > 8) { scene.remove(obst[i].mesh); obst.splice(i, 1); }
  }
  for (let i = listaMoedas.length - 1; i >= 0; i--) {
    const m = listaMoedas[i];
    m.position.z += dz;
    m.rotation.y += dt * 4;
    if (m.position.z > 8) { sumir(listaMoedas, i); continue; }
    if (vivo && Math.abs(m.position.z) < 0.8 &&
        Math.hypot(m.position.x - c.x, m.position.y - (c.y + 0.9)) < 0.8) {
      faiscas(m.position, 6, matPoeira);
      sumir(listaMoedas, i);
      ouro++;
    }
  }

  if (vivo && bateu()) {                                 // BATEU!
    vivo = false;
    melhor = Math.max(melhor, Math.floor(dist) + ouro * 10);
    shake = 1.2;
    faiscas(new THREE.Vector3(c.x, c.y + 1, 0), 40, matF);
  }

  for (let i = fagulhas.length - 1; i >= 0; i--) {
    const f = fagulhas[i], d = f.userData;
    d.vida += dt;
    d.v.y -= 25 * dt;
    f.position.addScaledVector(d.v, dt);
    f.scale.setScalar(Math.max(0.001, 1 - d.vida / 0.8));
    if (d.vida > 0.8) sumir(fagulhas, i);
  }

  shake *= 0.9;
  camera.position.set(c.x * 0.6 + (Math.random() - 0.5) * shake, 4.2 + (Math.random() - 0.5) * shake, 8.5);
  camera.lookAt(c.x * 0.4, 1.3, -12);

  const pts = Math.floor(dist) + ouro * 10;
  hud.innerHTML = vivo
    ? 'Pontos: ' + pts + '<br>Moedas: ' + ouro + '<br>Recorde: ' + melhor
    : 'BATEU!<br>' + pts + ' pontos — R reinicia';
  renderer.render(scene, camera);
});`},
{t:"Labirinto em 1ª pessoa",
 lead:"Um labirinto novo a cada partida, visto pelos olhos do jogador, com mouse livre e minimapa.",
 txt:`<p>O labirinto é gerado por <b>busca em profundidade com retrocesso</b> (<i>recursive backtracker</i>): partimos de uma célula, caminhamos para um vizinho ainda não visitado derrubando a parede entre eles e, quando ficamos sem saída, voltamos pela <code>pilha</code>. O resultado é um labirinto perfeito (sempre há um caminho, e só um, entre dois pontos). A saída fica na célula mais funda da pilha.</p>
 <p>Para desenhar centenas de paredes iguais sem pesar, usamos <code>InstancedMesh</code>: <b>uma única geometria</b> desenhada várias vezes, cada uma com a sua matriz de posição. A <b>câmera é o jogador</b>: o <code>PointerLockControls</code> trava o mouse e gira a câmera, e <code>moveForward()</code>/<code>moveRight()</code> andam no plano do chão.</p>
 <p>A <b>colisão</b> usa a própria matriz do labirinto: testamos os quatro cantos de um quadrado em volta do jogador e, ao bater, movemos <b>cada eixo separadamente</b> — por isso você desliza ao longo das paredes em vez de travar. Uma tocha (<code>PointLight</code>) segue a câmera, e a névoa esconde o que está longe.</p>
 <div class="note"><b>Controles:</b> <b>clique no preview</b> para travar o mouse (Esc libera). <b>WASD</b>/↑↓ andam, <b>Shift</b> corre, mouse ou ←/→ giram. O minimapa mostra só o que você já explorou. Cada nível novo tem um labirinto maior.</div>
 <div class="note tip"><b>Desafios:</b> (1) crie um monstro que persegue o jogador usando BFS; (2) espalhe chaves coloridas que precisam ser coletadas antes da saída; (3) dê uma bateria à tocha, que enfraquece com o tempo; (4) adicione uma tecla que desenha o caminho até a saída (BFS ou A*).</div>`,
 code:`const S = 3, H = 3, R = 0.35;   // tamanho da célula, altura da parede, raio do jogador
camera.far = 80;
camera.updateProjectionMatrix();
scene.background = new THREE.Color(0x05060a);
scene.fog = new THREE.Fog(0x05060a, 2, 24);
scene.add(new THREE.AmbientLight(0x404060, 0.35));
const tocha = new THREE.PointLight(0xffd9a0, 1.2, 18);
scene.add(tocha);

// ---- texturas desenhadas no Canvas ----
function texTijolo() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#3b2a20';
  ctx.fillRect(0, 0, 128, 128);
  for (let r = 0; r < 8; r++) {
    for (let b = -1; b < 4; b++) {
      ctx.fillStyle = 'hsl(' + (12 + Math.random() * 12) + ',45%,' + (26 + Math.random() * 10) + '%)';
      ctx.fillRect(b * 32 + (r % 2 ? 16 : 0) + 1, r * 16 + 1, 30, 14);
    }
  }
  return new THREE.CanvasTexture(c);
}
function texChao() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) {
    ctx.fillStyle = (x + y) % 2 ? '#2b2f3a' : '#232733';
    ctx.fillRect(x * 32, y * 32, 32, 32);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const matParede = new THREE.MeshStandardMaterial({ map: texTijolo(), roughness: 0.9 });
const tChao = texChao();
const matChao = new THREE.MeshStandardMaterial({ map: tChao, roughness: 1 });
const matTeto = new THREE.MeshStandardMaterial({ color: 0x11131a });

// ---- gerador: busca em profundidade com retrocesso ----
function gerar(n) {
  const M = 2 * n + 1;                                   // células em posições ímpares
  const lab = Array.from({ length: M }, () => Array(M).fill(1));   // 1 = parede
  const pilha = [[1, 1]];
  lab[1][1] = 0;
  let fim = { x: 1, z: 1, d: 0 };
  while (pilha.length) {
    const [x, z] = pilha[pilha.length - 1];
    const viz = [[2, 0], [-2, 0], [0, 2], [0, -2]]
      .map(([dx, dz]) => [x + dx, z + dz, dx, dz])
      .filter(([nx, nz]) => nx > 0 && nz > 0 && nx < M - 1 && nz < M - 1 && lab[nz][nx]);
    if (!viz.length) { pilha.pop(); continue; }          // beco sem saída: volta
    const [nx, nz, dx, dz] = viz[Math.floor(Math.random() * viz.length)];
    lab[z + dz / 2][x + dx / 2] = 0;                     // derruba a parede entre as células
    lab[nz][nx] = 0;
    pilha.push([nx, nz]);
    if (pilha.length > fim.d) fim = { x: nx, z: nz, d: pilha.length };  // célula mais funda
  }
  return { lab, M, fim };
}

// ---- construção de um nível ----
let mundo, lab, M, fim, vis, saida, nivel = 1, tempo = 0, aviso = { txt: '', t: 0 };
function construir() {
  if (mundo) scene.remove(mundo);
  mundo = new THREE.Group();
  scene.add(mundo);
  ({ lab, M, fim } = gerar(Math.min(5 + nivel, 15)));
  vis = lab.map((l) => l.map(() => false));

  const total = lab.flat().filter((v) => v).length;
  const paredes = new THREE.InstancedMesh(new THREE.BoxGeometry(S, H, S), matParede, total);
  const d = new THREE.Object3D();
  let i = 0;
  lab.forEach((lin, z) => lin.forEach((v, x) => {
    if (!v) return;
    d.position.set((x + 0.5) * S, H / 2, (z + 0.5) * S);
    d.updateMatrix();
    paredes.setMatrixAt(i++, d.matrix);                  // uma matriz por parede
  }));
  mundo.add(paredes);

  tChao.repeat.set((M * S) / 2, (M * S) / 2);
  const chao = new THREE.Mesh(new THREE.PlaneGeometry(M * S, M * S), matChao);
  chao.rotation.x = -Math.PI / 2;
  chao.position.set((M * S) / 2, 0, (M * S) / 2);
  const teto = new THREE.Mesh(new THREE.PlaneGeometry(M * S, M * S), matTeto);
  teto.rotation.x = Math.PI / 2;
  teto.position.set((M * S) / 2, H, (M * S) / 2);
  mundo.add(chao, teto);

  saida = new THREE.Group();                             // farol verde da saída
  const pilar = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, H, 16), new THREE.MeshBasicMaterial({ color: 0x22ff88, transparent: true, opacity: 0.55 }));
  pilar.position.y = H / 2;
  const anel = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.06, 8, 32), new THREE.MeshBasicMaterial({ color: 0x22ff88 }));
  anel.rotation.x = Math.PI / 2;
  anel.position.y = 0.2;
  const luz = new THREE.PointLight(0x22ff88, 1, 9);
  luz.position.y = 1.5;
  saida.add(pilar, anel, luz);
  saida.position.set((fim.x + 0.5) * S, 0, (fim.z + 0.5) * S);
  mundo.add(saida);

  camera.position.set(1.5 * S, 1.6, 1.5 * S);            // começa na célula (1,1)
  const yaw = lab[1][2] === 0 ? -Math.PI / 2 : Math.PI;  // olha para o corredor aberto
  camera.quaternion.setFromEuler(new THREE.Euler(0, yaw, 0, 'YXZ'));
  tempo = 0;
}

// ---- controles ----
const controls = new THREE.PointerLockControls(camera, renderer.domElement);
document.body.addEventListener('click', () => controls.lock());   // qualquer clique na página trava o mouse
const teclas = {};
addEventListener('keydown', (e) => { teclas[e.code] = true; if (e.code.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', (e) => (teclas[e.code] = false));

const msg = document.createElement('div');
msg.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:rgba(0,0,0,.5);font:700 20px system-ui;pointer-events:none;padding:20px';
msg.innerHTML = 'Clique para jogar<br><span style="font:14px system-ui;font-weight:400">WASD andar · Shift correr · mouse ou ←/→ girar · Esc libera o mouse</span>';
document.body.appendChild(msg);
controls.addEventListener('lock', () => (msg.style.display = 'none'));
controls.addEventListener('unlock', () => (msg.style.display = 'flex'));

const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:12px;left:16px;color:#fff;font:700 18px system-ui;text-shadow:0 2px 6px #000;line-height:1.4;pointer-events:none';
document.body.appendChild(hud);
const mini = document.createElement('canvas');
mini.width = mini.height = 170;
mini.style.cssText = 'position:fixed;right:12px;bottom:12px;border:2px solid #fff6;border-radius:6px;pointer-events:none';
document.body.appendChild(mini);

// ---- colisão com a matriz do labirinto ----
function colide(x, z) {
  for (const ox of [-R, R]) for (const oz of [-R, R]) {
    const gx = Math.floor((x + ox) / S), gz = Math.floor((z + oz) / S);
    if (gx < 0 || gz < 0 || gx >= M || gz >= M || lab[gz][gx]) return true;
  }
  return false;
}

function desenharMapa() {
  const ctx = mini.getContext('2d'), k = 170 / M;
  ctx.fillStyle = 'rgba(0,0,0,.65)';
  ctx.fillRect(0, 0, 170, 170);
  for (let z = 0; z < M; z++) for (let x = 0; x < M; x++) {
    if (!vis[z][x]) continue;                            // névoa: só o que já foi visto
    ctx.fillStyle = lab[z][x] ? '#8b6f47' : '#2a2f3a';
    ctx.fillRect(x * k, z * k, k + 0.5, k + 0.5);
  }
  if (vis[fim.z][fim.x]) { ctx.fillStyle = '#22ff88'; ctx.fillRect(fim.x * k, fim.z * k, k, k); }
  const px = (camera.position.x / S) * k, pz = (camera.position.z / S) * k;
  const dir = camera.getWorldDirection(new THREE.Vector3());
  ctx.strokeStyle = '#ff4466'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px, pz); ctx.lineTo(px + dir.x * k * 1.6, pz + dir.z * k * 1.6); ctx.stroke();
  ctx.fillStyle = '#ff4466';
  ctx.beginPath(); ctx.arc(px, pz, Math.max(2, k * 0.35), 0, 7); ctx.fill();
}

construir();
const euler = new THREE.Euler(0, 0, 0, 'YXZ');
const clock = new THREE.Clock();
renderer.setAnimationLoop((t) => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const p = camera.position;
  tempo += dt;

  const giro = (teclas.ArrowLeft ? 1 : 0) - (teclas.ArrowRight ? 1 : 0);   // girar sem mouse
  if (giro) {
    euler.setFromQuaternion(camera.quaternion);
    euler.y += giro * 2 * dt;
    camera.quaternion.setFromEuler(euler);
  }
  const f = ((teclas.KeyW || teclas.ArrowUp) ? 1 : 0) - ((teclas.KeyS || teclas.ArrowDown) ? 1 : 0);
  const s = (teclas.KeyD ? 1 : 0) - (teclas.KeyA ? 1 : 0);
  const v = ((teclas.ShiftLeft || teclas.ShiftRight) ? 6 : 3.4) * dt;
  if (f || s) {
    const ox = p.x, oz = p.z;
    controls.moveForward(f * v);
    controls.moveRight(s * v);
    const nx = p.x, nz = p.z;
    p.x = nx; p.z = oz; if (colide(p.x, p.z)) p.x = ox;   // testa cada eixo: deslizar nas paredes
    p.z = nz;           if (colide(p.x, p.z)) p.z = oz;
    p.y = 1.6 + Math.sin(t / 110) * 0.035;                // balanço da cabeça ao andar
  } else p.y += (1.6 - p.y) * Math.min(1, 8 * dt);

  tocha.position.copy(p);
  tocha.intensity = 1.2 + Math.sin(t / 90) * 0.08 + Math.sin(t / 37) * 0.05;   // tocha tremulando

  const gx = Math.floor(p.x / S), gz = Math.floor(p.z / S);
  for (let dz = -2; dz <= 2; dz++) for (let dx = -2; dx <= 2; dx++) {
    if (vis[gz + dz] && vis[gz + dz][gx + dx] === false) vis[gz + dz][gx + dx] = true;
  }

  saida.children[1].rotation.z += dt * 2;
  if (Math.hypot(p.x - saida.position.x, p.z - saida.position.z) < 1.3) {   // chegou à saída!
    aviso = { txt: 'Nível ' + nivel + ' concluído em ' + tempo.toFixed(1) + ' s!', t: 2.5 };
    nivel++;
    construir();
  }
  aviso.t -= dt;

  desenharMapa();
  const m = Math.floor(tempo / 60), sg = Math.floor(tempo % 60);
  hud.innerHTML = 'Nível ' + nivel + '  ·  ' + m + ':' + (sg < 10 ? '0' : '') + sg
    + (aviso.t > 0 ? '<br><span style="color:#22ff88;font-size:24px">' + aviso.txt + '</span>' : '');
  renderer.render(scene, camera);
});`},
{t:"Dungeon crawler",
 lead:"Uma masmorra nova a cada andar: salas, corredores, neblina de guerra e inimigos que andam em grade.",
 txt:`<p>Um <i>dungeon crawler</i> clássico (como <i>Rogue</i> e <i>Nethack</i>) é <b>por turnos e em grade</b>: nada se move até que o herói aja. Isso simplifica tudo: o mundo é uma matriz <code>g[z][x]</code> (<code>1</code> parede, <code>0</code> chão) e cada herói, inimigo ou poção ocupa <b>uma célula inteira</b>. A lógica só mexe nos números; as malhas 3D apenas <b>deslizam</b> até a nova célula com <code>lerp</code>, a mesma separação entre estado e desenho do Sokoban e do Xadrez.</p>
 <p><b>Gerador de masmorra.</b> Sorteamos salas de tamanhos diferentes em posições aleatórias e <b>descartamos as que encostam</b> em alguma já criada (um teste de sobreposição de retângulos, com 1 célula de folga). Depois ligamos cada sala à <b>anterior</b> com um corredor em <b>L</b>: cavamos primeiro na horizontal e depois na vertical (ou o contrário, sorteado). Como cada sala está ligada à anterior, a masmorra é <b>sempre conexa</b>: dá para chegar à escada, que fica na última sala. O herói nasce na primeira.</p>
 <p><b>Inimigos em grade.</b> A cada ação do herói, cada inimigo faz <b>um passo</b>: se está ao lado dele, ataca; se <b>enxerga</b> o herói, tenta reduzir a distância no eixo mais longo (e, se estiver bloqueado, no outro); senão, vagueia de vez em quando. A regra de &quot;enxergar&quot; reaproveita a visão do jogador: o inimigo só persegue se a <b>célula dele está visível para o herói</b> e perto o bastante (<code>vista</code>). Atacar é só <b>andar contra</b> um inimigo, a mesma ideia do Sokoban: &quot;a célula da frente tem alguma coisa?&quot;.</p>
 <p><b>Neblina de guerra.</b> Cada célula tem um estado: <code>0</code> (nunca vista), <code>1</code> (explorada) ou <code>2</code> (visível agora). Para saber o que o herói vê, traçamos uma reta de <b>Bresenham</b> até cada célula num raio de 7: se uma parede aparece no caminho, a célula fica escondida. O estado vira <b>cor</b> do <code>InstancedMesh</code> com <code>setColorAt</code>: brilho total, 30% ou preto. Inimigos e poções só aparecem quando a célula está visível, e o minimapa guarda o que você já explorou.</p>
 <div class="note"><b>Controles:</b> <b>clique no preview</b>; <b>WASD</b> ou setas andam (e atacam quem estiver na frente); <b>segure</b> a tecla para andar em ritmo constante (ajuste em <code>PASSO_INICIAL</code> e <code>PASSO_REPETE</code>), <b>Espaço</b> espera um turno, <b>R</b> reinicia. Poções (esferas vermelhas) curam 6 e ficam no chão se a vida estiver cheia. A escada verde leva ao próximo andar, com mais inimigos e novos tipos (Esqueleto no andar 2, Ogro no 3).</div>
 <div class="note tip"><b>Desafios:</b> (1) adicione um inimigo <b>arqueiro</b> que atira de longe quando está em linha reta com o herói (use <code>enxerga</code>); (2) coloque <b>portas</b> nas entradas das salas; (3) crie um baú que dá uma arma melhor; (4) faça os inimigos perseguirem pelo <b>menor caminho</b> com BFS, em vez do passo guloso.</div>`,
 code:`const W = 40, H = 28;              // tamanho da grade (células)
const VIDA_MAX = 20, RAIO = 7;     // vida do herói e alcance da visão
scene.background = new THREE.Color(0x05060a);
scene.fog = new THREE.Fog(0x05060a, 9, 24);
scene.add(new THREE.AmbientLight(0x5565a0, 0.55));
const tocha = new THREE.PointLight(0xffc880, 1.7, 13);
scene.add(tocha);

const rnd = (n) => Math.floor(Math.random() * n);
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const TIPOS = [
  { nome: 'Slime',     cor: 0x44dd66, hp: 3, dano: 1, vista: 5, desde: 1, y: 0.27 },
  { nome: 'Esqueleto', cor: 0xe8e4d0, hp: 5, dano: 2, vista: 6, desde: 2, y: 0.5 },
  { nome: 'Ogro',      cor: 0xcc5533, hp: 9, dano: 3, vista: 5, desde: 3, y: 0.55 },
];

// ---- gerador: salas aleatórias ligadas por corredores em L ----
function gerar() {
  const g = Array.from({ length: H }, () => Array(W).fill(1));    // 1 = parede, 0 = chão
  const salas = [];
  for (let t = 0; t < 80 && salas.length < 9; t++) {
    const w = 4 + rnd(5), h = 4 + rnd(4);
    const x = 1 + rnd(W - w - 2), z = 1 + rnd(H - h - 2);
    const encosta = salas.some((s) => x < s.x + s.w + 1 && x + w + 1 > s.x && z < s.z + s.h + 1 && z + h + 1 > s.z);
    if (encosta) continue;                                        // sala sobreposta: descarta
    for (let j = z; j < z + h; j++) for (let i = x; i < x + w; i++) g[j][i] = 0;
    salas.push({ x, z, w, h, cx: x + (w >> 1), cz: z + (h >> 1) });
  }
  const cavar = (x1, z1, x2, z2) => {                             // primeiro na horizontal, depois na vertical
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) g[z1][x] = 0;
    for (let z = Math.min(z1, z2); z <= Math.max(z1, z2); z++) g[z][x2] = 0;
  };
  for (let i = 1; i < salas.length; i++) {                        // liga cada sala à anterior
    const a = salas[i - 1], b = salas[i];
    if (Math.random() < 0.5) cavar(a.cx, a.cz, b.cx, b.cz); else cavar(b.cx, b.cz, a.cx, a.cz);
  }
  return { g, salas };
}

// ---- visão: linha reta (Bresenham) entre o herói e a célula; parede bloqueia ----
function enxerga(x0, z0, x1, z1) {
  const dx = Math.abs(x1 - x0), dz = Math.abs(z1 - z0);
  const sx = x0 < x1 ? 1 : -1, sz = z0 < z1 ? 1 : -1;
  let e = dx - dz, x = x0, z = z0;
  while (x !== x1 || z !== z1) {
    if ((x !== x0 || z !== z0) && g[z][x]) return false;
    const e2 = 2 * e;
    if (e2 > -dz) { e -= dz; x += sx; }
    if (e2 < dx) { e += dx; z += sz; }
  }
  return true;                                                    // a parede em si também é vista
}

// ---- o herói (existe uma vez só; muda de lugar a cada andar) ----
const matHeroi = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.5 });
const heroi = new THREE.Group();
const corpo = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.28, 0.8, 12), matHeroi);
corpo.position.y = 0.4;
const cabeca = new THREE.Mesh(new THREE.SphereGeometry(0.19, 12, 10), new THREE.MeshStandardMaterial({ color: 0xffd9b0 }));
cabeca.position.y = 0.95;
const espada = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.6), new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.8, roughness: 0.3 }));
espada.position.set(0.3, 0.5, 0.3);
heroi.add(corpo, cabeca, espada);
scene.add(heroi);
const jog = { x: 0, z: 0, vx: 0, vz: 0, bx: 0, bz: 0, fl: 0, hp: VIDA_MAX, rot: 0, mesh: heroi, mat: matHeroi, y: 0 };

// ---- estado do jogo ----
let g, salas, vis, mundo, pisos, paredes, posPiso, posParede, escada, inimigos, itens;
let prof = 1, abates = 0, morto = false, historico = [];
const mensagem = (txt) => { historico.push(txt); if (historico.length > 5) historico.shift(); };
const livre = (x, z) => !g[z][x] && !(jog.x === x && jog.z === z) && !inimigos.some((e) => e.x === x && e.z === z);

function celulaEm(sala) {                                         // sorteia uma célula vazia da sala
  for (let k = 0; k < 100; k++) {
    const x = sala.x + rnd(sala.w), z = sala.z + rnd(sala.h);
    const ocupada = !livre(x, z) || (escada.x === x && escada.z === z) || itens.some((i) => i.x === x && i.z === z);
    if (!ocupada) return { x, z };
  }
  return null;
}

function criarInimigo(t, x, z) {
  const mat = new THREE.MeshStandardMaterial({ color: t.cor, roughness: 0.6 });
  const geo = t.nome === 'Slime' ? new THREE.SphereGeometry(0.36, 16, 12)
    : t.nome === 'Esqueleto' ? new THREE.CylinderGeometry(0.16, 0.24, 1, 10)
    : new THREE.BoxGeometry(0.75, 1.1, 0.75);
  const mesh = new THREE.Mesh(geo, mat);
  if (t.nome === 'Slime') mesh.scale.y = 0.75;
  mundo.add(mesh);
  return { t, x, z, vx: x, vz: z, bx: 0, bz: 0, fl: 0, hp: t.hp + Math.floor(prof / 3), mesh, mat, y: t.y };
}

// ---- construção de um andar ----
const cor = new THREE.Color();
function nivel() {
  if (mundo) scene.remove(mundo);
  mundo = new THREE.Group();
  scene.add(mundo);
  let r;
  do r = gerar(); while (r.salas.length < 4);                     // garante salas suficientes
  g = r.g; salas = r.salas;
  vis = g.map((l) => l.map(() => 0));                             // 0 = nunca visto, 1 = explorado, 2 = visível agora

  // chão e paredes: um InstancedMesh cada; só criamos paredes que encostam em algum chão
  posPiso = []; posParede = [];
  const perto = (x, z) => {
    for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) if (g[z + dz] && g[z + dz][x + dx] === 0) return true;
    return false;
  };
  g.forEach((lin, z) => lin.forEach((v, x) => {
    if (!v) posPiso.push([x, z]); else if (perto(x, z)) posParede.push([x, z]);
  }));
  pisos = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 0.2, 1), new THREE.MeshStandardMaterial({ roughness: 1 }), posPiso.length);
  paredes = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1.5, 1), new THREE.MeshStandardMaterial({ roughness: 0.9 }), posParede.length);
  const d = new THREE.Object3D();
  posPiso.forEach(([x, z], i) => { d.position.set(x, -0.1, z); d.updateMatrix(); pisos.setMatrixAt(i, d.matrix); });
  posParede.forEach(([x, z], i) => { d.position.set(x, 0.75, z); d.updateMatrix(); paredes.setMatrixAt(i, d.matrix); });
  mundo.add(pisos, paredes);

  // herói na primeira sala, escada na última
  const ini = salas[0], fim = salas[salas.length - 1];
  jog.x = jog.vx = ini.cx; jog.z = jog.vz = ini.cz;
  const mesh = new THREE.Group();
  const pilar = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.6, 16), new THREE.MeshBasicMaterial({ color: 0x22ff88, transparent: true, opacity: 0.5 }));
  pilar.position.y = 0.8;
  const anel = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.05, 8, 24), new THREE.MeshBasicMaterial({ color: 0x22ff88 }));
  anel.rotation.x = Math.PI / 2;
  anel.position.y = 0.15;
  const luz = new THREE.PointLight(0x22ff88, 1, 7);
  luz.position.y = 1.2;
  mesh.add(pilar, anel, luz);
  mesh.position.set(fim.cx, 0, fim.cz);
  mundo.add(mesh);
  escada = { x: fim.cx, z: fim.cz, mesh };

  // inimigos nas outras salas (mais e mais fortes a cada andar) e poções em qualquer sala
  inimigos = []; itens = [];
  const tipos = TIPOS.filter((t) => t.desde <= prof);
  for (let i = 0; i < Math.min(3 + prof * 2, 14); i++) {
    const c = celulaEm(salas[1 + rnd(salas.length - 1)]);
    if (c) inimigos.push(criarInimigo(tipos[rnd(tipos.length)], c.x, c.z));
  }
  for (let i = 0; i < 2; i++) {
    const c = celulaEm(salas[rnd(salas.length)]);
    if (!c) continue;
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 10), new THREE.MeshStandardMaterial({ color: 0xff3355, emissive: 0x661122 }));
    m.position.set(c.x, 0.35, c.z);
    mundo.add(m);
    itens.push({ x: c.x, z: c.z, mesh: m });
  }
  camera.position.set(jog.x, 10, jog.z + 6.5);
  ver();
}

// ---- visão, minimapa e HUD: roda a cada turno ----
const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:10px;left:14px;color:#fff;font:700 15px system-ui;text-shadow:0 2px 6px #000;line-height:1.5;pointer-events:none';
const diario = document.createElement('div');
diario.style.cssText = 'position:fixed;left:14px;bottom:10px;color:#fff;font:14px system-ui;text-shadow:0 2px 6px #000;pointer-events:none';
const mini = document.createElement('canvas');
mini.width = W * 4; mini.height = H * 4;
mini.style.cssText = 'position:fixed;right:10px;bottom:10px;border:2px solid #fff4;border-radius:6px;pointer-events:none';
const aviso = document.createElement('div');
aviso.style.cssText = 'position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:#fff;background:rgba(80,0,0,.55);font:700 26px system-ui;pointer-events:none';
document.body.append(hud, diario, mini, aviso);

function pintar() {                                               // brilho de cada bloco: visível, explorado ou escuro
  const f = (x, z) => [0, 0.3, 1][vis[z][x]];
  posPiso.forEach(([x, z], i) => { cor.setHex((x + z) % 2 ? 0x4a5070 : 0x3f4562).multiplyScalar(f(x, z)); pisos.setColorAt(i, cor); });
  posParede.forEach(([x, z], i) => { cor.setHex(0x9a7a52).multiplyScalar(f(x, z)); paredes.setColorAt(i, cor); });
  pisos.instanceColor.needsUpdate = true;
  paredes.instanceColor.needsUpdate = true;
}

function ver() {
  for (const lin of vis) for (let x = 0; x < W; x++) if (lin[x] === 2) lin[x] = 1;   // o que era visível vira "explorado"
  for (let dz = -RAIO; dz <= RAIO; dz++) for (let dx = -RAIO; dx <= RAIO; dx++) {
    const x = jog.x + dx, z = jog.z + dz;
    if (x < 0 || z < 0 || x >= W || z >= H || dx * dx + dz * dz > RAIO * RAIO) continue;
    if (enxerga(jog.x, jog.z, x, z)) vis[z][x] = 2;
  }
  inimigos.forEach((e) => (e.mesh.visible = vis[e.z][e.x] === 2));
  itens.forEach((i) => (i.mesh.visible = vis[i.z][i.x] === 2));
  escada.mesh.visible = vis[escada.z][escada.x] > 0;
  pintar();

  const c = mini.getContext('2d'), k = 4;
  c.fillStyle = 'rgba(0,0,0,.7)';
  c.fillRect(0, 0, W * k, H * k);
  for (let z = 0; z < H; z++) for (let x = 0; x < W; x++) {
    if (!vis[z][x]) continue;
    c.fillStyle = g[z][x] ? '#6b5a42' : vis[z][x] === 2 ? '#5a6285' : '#2f344a';
    c.fillRect(x * k, z * k, k, k);
  }
  if (vis[escada.z][escada.x]) { c.fillStyle = '#22ff88'; c.fillRect(escada.x * k, escada.z * k, k, k); }
  c.fillStyle = '#ff4466';
  inimigos.forEach((e) => { if (vis[e.z][e.x] === 2) c.fillRect(e.x * k, e.z * k, k, k); });
  c.fillStyle = '#ffd34d';
  c.fillRect(jog.x * k - 1, jog.z * k - 1, k + 2, k + 2);

  const pct = Math.max(0, jog.hp) / VIDA_MAX * 100;
  hud.innerHTML = 'Andar ' + prof + ' · Abates ' + abates + '<br>♥ ' + Math.max(0, jog.hp) + '/' + VIDA_MAX
    + '<div style="width:150px;height:8px;background:#400;border-radius:4px"><div style="width:' + pct + '%;height:100%;background:#ff4466;border-radius:4px"></div></div>';
  diario.innerHTML = historico.map((m, i) => '<div style="opacity:' + (0.4 + 0.6 * (i + 1) / historico.length) + '">' + m + '</div>').join('');
  aviso.style.display = morto ? 'flex' : 'none';
  aviso.innerHTML = 'VOCÊ MORREU<br><span style="font:16px system-ui">Andar ' + prof + ' · ' + abates + ' abates · aperte R</span>';
}

// ---- turno dos inimigos: atacam se estão ao lado; senão perseguem (se te veem) ou vagueiam ----
function golpeInimigo(e) {
  e.bx = (jog.x - e.x) * 0.45;
  e.bz = (jog.z - e.z) * 0.45;                                    // "investida" só visual
  if (Math.random() < 0.8) {
    jog.hp -= e.t.dano;
    jog.fl = 0.25;
    mensagem('O ' + e.t.nome + ' acerta você (-' + e.t.dano + ')');
    if (jog.hp <= 0) { morto = true; mensagem('Você caiu...'); }
  } else mensagem('O ' + e.t.nome + ' errou o golpe');
}

function turno() {
  for (const e of inimigos) {
    if (morto) break;
    const dist = Math.abs(e.x - jog.x) + Math.abs(e.z - jog.z);
    if (dist === 1) { golpeInimigo(e); continue; }
    let tentativas = [];
    if (dist <= e.t.vista && vis[e.z][e.x] === 2) {               // o herói está à vista: persegue
      const sx = Math.sign(jog.x - e.x), sz = Math.sign(jog.z - e.z);
      tentativas = Math.abs(jog.x - e.x) > Math.abs(jog.z - e.z) ? [[sx, 0], [0, sz]] : [[0, sz], [sx, 0]];
    } else if (Math.random() < 0.4) tentativas = [DIRS[rnd(4)]];  // senão, vagueia de vez em quando
    for (const [dx, dz] of tentativas) {
      if ((dx || dz) && livre(e.x + dx, e.z + dz)) { e.x += dx; e.z += dz; break; }
    }
  }
}

// ---- turno do herói: andar, atacar (andar contra um inimigo), pegar poção, descer a escada ----
function passo(dx, dz) {
  const nx = jog.x + dx, nz = jog.z + dz;
  jog.rot = Math.atan2(dx, dz);
  const alvo = inimigos.find((e) => e.x === nx && e.z === nz);
  if (alvo) {
    const dano = 2 + rnd(3) + Math.floor((prof - 1) / 2);         // a espada melhora a cada 2 andares
    alvo.hp -= dano;
    alvo.fl = 0.2;
    jog.bx = dx * 0.4; jog.bz = dz * 0.4;
    if (alvo.hp <= 0) {
      mundo.remove(alvo.mesh);
      inimigos.splice(inimigos.indexOf(alvo), 1);
      abates++;
      mensagem('Você derrotou o ' + alvo.t.nome + '!');
    } else mensagem('Você acerta o ' + alvo.t.nome + ' (-' + dano + ', resta ' + alvo.hp + ')');
  } else if (!g[nz][nx]) {
    jog.x = nx; jog.z = nz;
    const i = itens.findIndex((it) => it.x === nx && it.z === nz);
    if (i >= 0 && jog.hp < VIDA_MAX) {                            // com a vida cheia, a poção fica no chão
      const cura = Math.min(6, VIDA_MAX - jog.hp);
      jog.hp += cura;
      mundo.remove(itens[i].mesh);
      itens.splice(i, 1);
      mensagem('Poção! +' + cura + ' de vida');
    }
    if (nx === escada.x && nz === escada.z) {
      prof++;
      jog.hp = Math.min(VIDA_MAX, jog.hp + 3);
      mensagem('Você desce para o andar ' + prof);
      nivel();
      return;
    }
  } else return;                                                  // parede: não gasta o turno
  ver();                                                          // o herói enxerga primeiro...
  turno();                                                        // ...depois os inimigos agem
  ver();
}

function reiniciar() {
  prof = 1; abates = 0; morto = false; jog.hp = VIDA_MAX;
  historico = [];
  mensagem('WASD/setas andam e atacam · Espaço espera · R reinicia');
  nivel();
}

const MOV = { KeyW: [0, -1], ArrowUp: [0, -1], KeyS: [0, 1], ArrowDown: [0, 1], KeyA: [-1, 0], ArrowLeft: [-1, 0], KeyD: [1, 0], ArrowRight: [1, 0] };
// Segurar a tecla: o 1º passo é imediato, depois vem uma pausa e então um passo a cada PASSO_REPETE.
// (ignoramos e.repeat: a repetição automática do sistema é rápida demais para um jogo por turnos)
const PASSO_INICIAL = 0.22, PASSO_REPETE = 0.13;   // segundos
const seguradas = [];                               // direções seguradas; a mais recente fica no fim
let esperaPasso = 0;
addEventListener('keydown', (e) => {
  if (e.code === 'KeyR') return reiniciar();
  if (e.repeat || morto) return;
  if (MOV[e.code]) {
    const i = seguradas.indexOf(e.code);
    if (i >= 0) seguradas.splice(i, 1);
    seguradas.push(e.code);
    passo(MOV[e.code][0], MOV[e.code][1]);
    esperaPasso = PASSO_INICIAL;
  } else if (e.code === 'Space') { turno(); ver(); }  // esperar um turno
});
addEventListener('keyup', (e) => {
  const i = seguradas.indexOf(e.code);
  if (i >= 0) seguradas.splice(i, 1);
});
addEventListener('blur', () => (seguradas.length = 0));

// ---- animação: a lógica muda na hora, os objetos só deslizam até a nova célula ----
function animar(o, dt) {
  const k = Math.min(1, 14 * dt);
  o.vx += (o.x - o.vx) * k;
  o.vz += (o.z - o.vz) * k;
  o.bx *= 1 - Math.min(1, 12 * dt);
  o.bz *= 1 - Math.min(1, 12 * dt);
  o.fl -= dt;
  o.mesh.position.set(o.vx + o.bx, o.y, o.vz + o.bz);
  o.mat.emissive.setHex(o.fl > 0 ? 0xff2020 : 0x000000);          // pisca em vermelho ao levar dano
}

reiniciar();
const alvoCam = new THREE.Vector3();
const clock = new THREE.Clock();
renderer.setAnimationLoop((t) => {
  const dt = Math.min(clock.getDelta(), 0.05);
  esperaPasso -= dt;
  if (seguradas.length && !morto && esperaPasso <= 0) {   // tecla segurada: anda em ritmo constante
    const d = MOV[seguradas[seguradas.length - 1]];
    passo(d[0], d[1]);
    esperaPasso = PASSO_REPETE;
  }
  animar(jog, dt);
  heroi.rotation.y = jog.rot;
  inimigos.forEach((e) => animar(e, dt));
  itens.forEach((it) => (it.mesh.position.y = 0.35 + Math.sin(t / 250) * 0.08));
  escada.mesh.children[1].rotation.z += dt * 2;
  tocha.position.set(jog.vx, 2.4, jog.vz);
  tocha.intensity = 1.7 + Math.sin(t / 90) * 0.08;
  alvoCam.set(jog.vx, 10, jog.vz + 6.5);
  camera.position.lerp(alvoCam, 1 - Math.exp(-6 * dt));           // câmera suave seguindo o herói
  camera.lookAt(jog.vx, 0, jog.vz);
  renderer.render(scene, camera);
});`},
{t:"Aventura 3D cartoon",
 lead:"Um mundo de plataformas ao estilo Mario 64: visual cartoon, colisões à mão e cogumelos que caem com um pisão.",
 txt:`<p>Jogos como <i>Super Mario 64</i> misturam três ideias que cabem num único arquivo: um <b>visual cartoon</b>, um <b>mundo de plataformas</b> onde o jogador sobe, pula e cai, e <b>inimigos</b> que se vencem pulando na cabeça. Aqui tudo isso é feito à mão, sem biblioteca de física.</p>
 <p><b>Visual cartoon.</b> O <code>MeshToonMaterial</code> troca o degradê suave da luz por <b>faixas</b>: o <code>gradientMap</code> é uma textura de 3 pixels (escuro, médio, claro) com filtro <code>NearestFilter</code>, e cada pixel vira uma faixa de sombra. O <b>contorno preto</b> vem do truque do <i>casco invertido</i> (função <code>ol</code>): cada peça ganha uma cópia filha com a mesma geometria, um pouco maior (<code>scale</code> 1.07), material preto e <code>side: THREE.BackSide</code>. Só as costas dessa cópia aparecem e formam a borda. Para completar, o mundo usa cores chapadas e saturadas, névoa azul e uma sombra de mancha (<code>blob</code>) no chão, que encolhe quando o herói está no ar.</p>
 <p><b>Colisão com plataformas.</b> O mundo é uma lista de caixas, cada uma com <code>top</code> (topo) e <code>base</code>. A função <code>gh(x, z, y)</code> devolve a <b>altura do chão</b> sob o jogador: o maior <code>top</code> que ele consegue alcançar, ou o da ilha (0), ou <code>-1e9</code> (vazio). Um degrau só conta se <code>top &lt;= y + 0.6</code>, então o herói sobe degraus pequenos andando e precisa <b>pular</b> nos altos. A gravidade puxa <code>v.y</code> e, quando <code>y</code> alcança o chão com <code>v.y &lt;= 0</code>, ele pousa. Já <code>wall(x, z, y)</code> responde se um ponto está <b>dentro</b> de algo sólido. O herói a chama uma vez para o eixo X e outra para o eixo Z, <b>separadamente</b>, e por isso <b>desliza</b> ao longo das paredes em vez de grudar nelas.</p>
 <p><b>Colisão de cabeça (teto).</b> <code>gh</code> só enxerga o que está <b>embaixo</b> do herói, então a <b>cabeça</b> precisa de um teste próprio; sem ele ela atravessaria a plataforma por baixo. Depois de aplicar <code>v.y</code>, se o herói está <b>subindo</b>, testamos cada caixa: ela estava <b>acima</b> da cabeça no quadro anterior (<code>o.base &gt;= oy + HEAD</code>), a cabeça passaria da base neste quadro (<code>o.base &lt; y + HEAD</code>) e o herói está dentro da pegada da caixa em X e Z. Se tudo isso é verdade, colocamos a cabeça colada na base (<code>y = o.base - HEAD</code>) e zeramos <code>v.y</code>, então ele para de subir e começa a cair na hora.</p>
  <p><b>Colisão com árvores.</b> Cada árvore é um <b>círculo</b> no plano XZ, guardado em <code>ARV</code> com centro, raio do tronco (<code>r</code>) e altura (<code>h</code>). O teste é só uma distância: <code>Math.hypot(x - a.x, z - a.z) &lt; a.r + 0.4</code>, onde 0.4 é o raio do herói. Somar os dois raios transforma "círculo contra círculo" em "ponto contra círculo maior", o mesmo truque das caixas, que ficam maiores em 0.4. Os cogumelos usam essa mesma <code>wall</code> (dentro de <code>livre</code>, que também exige chão), então também não atravessam troncos nem paredes. Como eles <b>contornam</b> esses obstáculos é assunto dos próximos parágrafos.</p>
 <p><b>Pular em cima do inimigo.</b> Quando o herói chega a menos de 1.1 do cogumelo, comparamos <b>como</b> ele chegou: se está <b>caindo</b> (<code>v.y &lt; 0</code>) e está <b>acima</b> da cabeça (<code>p.y &gt; e.y + 0.45</code>), é um pisão. O inimigo achata (<code>scale.y = 0.2</code>), some em meio segundo e o herói ganha um quique. Em qualquer outro caso é um acerto: tira um coração, empurra o herói para trás (<i>knockback</i>) e liga um tempo de invulnerabilidade (<code>inv</code>) em que ele pisca.</p>
 <p><b>Cogumelos que perseguem e contornam obstáculos.</b> Quando o herói está a menos de 10 de distância (e a menos de 3 de diferença de altura), o cogumelo o persegue. Em linha reta ele esbarraria no primeiro tronco ou parede, então o alvo vem de <code>rumo</code>, que tem duas camadas. (1) <b>Linha de visada</b> (<code>vista</code>): a cada 0.5 ao longo da reta até o herói testamos <code>livre</code> (tem chão e não é parede); se está tudo livre, o cogumelo vai direto. (2) Se algo bloqueia, ele consulta um <b>campo de distâncias</b>: a cada 0.2 s a função <code>campo</code> faz uma <b>busca em largura (BFS)</b> numa grade de células 1x1 ao redor do herói. A célula do herói vale 0, as vizinhas livres valem 1, as vizinhas delas 2, e assim por diante, sem atravessar árvores nem paredes (diagonais também não cortam quinas). O cogumelo então <b>desce</b> esse campo: a cada passo olha as 8 células vizinhas e vai para a de menor distância, por até 8 células, e fica com o ponto mais distante que ainda enxerga em linha reta (<code>reta</code>). Esse atalho importa porque o centro de uma célula pode ficar colado numa árvore; mirar um ponto mais longe abre a curva e dobra a quina com folga. Uma única BFS serve para todos os cogumelos, porque o campo mede a distância até o <b>herói</b>, não até cada inimigo.</p>
 <p><b>Herói numa plataforma: perder o foco.</b> E se o herói sobe numa plataforma alta? Os cogumelos não conseguem subir: a célula dele é parede para o campo (<code>celLivre</code> testa o nível do chão), a BFS não se expande e o cogumelo ficaria empurrando a parede, trocando de direção a cada quadro. Por isso, a cada quadro, <code>jogAlto = gh(P.p.x, P.p.z, P.p.y) &gt; 0.6</code>: se o chão sob o herói é mais alto que 0.6, ele está numa plataforma. Nesse caso a condição da perseguição falha <b>imediatamente</b>, os cogumelos <b>perdem o foco</b> e voltam ao passeio livre, como se não o tivessem visto. Quando o herói desce, a perseguição recomeça.</p>
 <p><b>Passeio livre.</b> Sem herói por perto (ou quando perde o foco porque o herói subiu numa plataforma), o cogumelo anda de <b>ponto em ponto</b> (<code>wx, wz</code>), na velocidade 2 em vez dos 3.6 da perseguição. A função <code>ponto</code> sorteia até 16 candidatos em volta de casa (<code>hx, hz</code>, de 1 a 6 de distância) e só aceita um que esteja livre <b>e</b> alcançável em linha reta (<code>reta</code>). Assim o alvo nunca fica dentro de uma árvore nem atrás de uma plataforma. Ele troca de ponto ao chegar (a menos de 0.7), a cada 3 a 6 s, ou quando o detector de travamento (veja mais abaixo) vê que andou menos de 0.5 em 0.8 s. Se o cogumelo está a mais de 6 de casa, por exemplo logo depois de uma perseguição, os candidatos saem em volta dele (de 3 a 5 de distância) e vale o que está mais perto de casa, o que o traz de volta aos poucos. Ao começar uma perseguição o ponto atual é descartado, e um novo é sorteado quando ela termina, inclusive quando o herói sobe numa plataforma.</p>
 <p><b>Curvas suaves.</b> A direção do alvo, venha de <code>rumo</code> ou do passeio, muda de repente: ao trocar de célula, ao passar de "vejo o herói" para "não vejo" ou ao sortear um ponto novo. Se o cogumelo girasse direto para ela, tremeria nas quinas. Por isso cada um guarda o próprio <b>rumo</b> (<code>e.a</code>) e, a cada quadro, gira só uma fração da diferença até o alvo (<code>da * 8 * dt</code>), um <i>amortecimento exponencial</i>. O ângulo é diferenciado com <code>atan2(sin, cos)</code>, que o mantém entre -π e π e evita a volta de 360° quando o alvo cruza ±π. O corpo e o passo seguem <code>e.a</code>, e em curvas fechadas a velocidade cai até metade.</p>
 <p><b>Desvio de passo.</b> Depois de girar, o cogumelo tenta dar o passo na direção <code>e.a</code>. Se ele bate em algo, o passo é testado girado em 0.4, 0.8, 1.2, 1.6 e 2 rad (<code>DESV</code>), para um lado e para o outro, até achar um livre. Testar só o eixo X e depois só o Z, como o herói faz, serve para paredes retas, mas não para um círculo: onde a normal da árvore é diagonal, os dois eixos entram nela e o passo seria sempre recusado. A uns 110° do alvo o passo é <b>tangente</b> à árvore e sempre sai livre, então o cogumelo escorrega em volta do tronco até o caminho abrir. O lado escolhido fica guardado (<code>e.sd</code>) até o passo reto ficar livre por 0.4 s, para ele não trocar de lado a cada quadro, e o corpo passa a apontar para onde ele de fato anda (<code>e.a</code> recebe o ângulo do passo).</p>
 <p><b>Rede de segurança.</b> Por fim, um <b>detector de travamento</b>. Na perseguição, a cada 0.6 s, se o cogumelo está a mais de 1.5 do herói e andou menos de 0.6, a função <code>fuga</code> escolhe entre 16 direções a que leva, em linha reta, à célula do campo mais perto do herói, e ele segue essa direção por 0.7 s. No passeio o detector é mais simples: se andou menos de 0.5 em 0.8 s, sorteia outro ponto. O caminho "bom" resolve quase sempre, e o detector cobre os casos raros em que o cogumelo fica preso (por exemplo num canto entre uma árvore e uma caixa): técnica comum em jogos.</p>
 <div class="note"><b>Controles:</b> <b>clique no preview</b>; <b>WASD</b> ou setas andam; <b>Espaço</b> pula (de novo no ar, pulo duplo); <b>Q/E</b> ou arrastar o mouse giram a câmera; <b>R</b> recomeça. No celular, arraste na metade esquerda para andar e toque na direita para pular. Pegue as 5 estrelas.</div>
 <div class="note tip"><b>Desafios:</b> (1) troque o gradiente para 4 faixas (<code>[70, 130, 190, 255]</code> e largura 4) e veja a diferença; (2) adicione moedas que valem pontos; (3) faça um cogumelo maior que precisa de dois pisões; (4) crie uma plataforma que se move e leve o herói junto (some <code>vx</code> dela ao <code>p</code> dele)</div>

{t:"Corrida",

 txt:`<p>O segredo da derrapagem é separar duas ideias que no dia a dia parecem uma só: <b>para onde o carro aponta</b> (<code>ang</code>) e <b>para onde ele se move</b> (<code>vel</code>, a velocidade no mundo). A cada quadro decompomos <code>vel</code> em duas partes em relação ao carro: <code>vF</code> (para frente) e <code>vS</code> (de lado), com produtos escalares entre <code>vel</code> e a direção do bico e da direita do carro.</p>
 <p>Cada parte recebe a sua física. O <b>motor</b> soma a <code>vF</code>; o <b>arrasto</b> subtrai uma fração proporcional à velocidade (por isso existe uma velocidade máxima, <code>ACEL / ARRASTO</code>, sem nenhum <code>if</code>); e os <b>pneus</b> apagam uma parte de <code>vS</code> a cada quadro, controlada por <code>GRIP</code>. Com grip alto o carro anda nos trilhos. Com o <b>freio de mão</b> o grip cai quase a zero: o volante continua girando o bico, mas a velocidade segue indo para o lado antigo. Isso é a derrapagem! A ordem importa: movemos o carro primeiro e <b>só depois</b> giramos o bico.</p>
 <p>A <b>pista</b> é uma <code>CatmullRomCurve3</code> fechada que passa pelos pontos de <code>PONTOS</code>. <code>getSpacedPoints</code> devolve amostras igualmente espaçadas e, para cada uma, calculamos a tangente e a normal (a tangente girada 90°) para montar o asfalto e as zebras como uma fita de quadriláteros. Saber se o carro está na pista é só medir a distância até a amostra mais próxima: passou da metade da largura, o arrasto sobe e o carro vira um trator na grama.</p>
 <p>Para a <b>volta cronometrada</b>, quatro portais ficam em amostras da pista e precisam ser cruzados <b>em ordem</b> (<code>prox</code>). A volta só conta quando o carro passa pelos três checkpoints e volta a cruzar a linha de largada, então cortar caminho ou voltar de ré não vale. O cronômetro apenas soma <code>dt</code> a cada quadro, a partir da primeira vez que você acelera.</p>
 <div class="note"><b>Controles:</b> clique no preview. <b>↑</b> ou <b>W</b> aceleram, <b>↓</b> ou <b>S</b> freiam (e dão ré), <b>←/→</b> ou <b>A/D</b> viram, <b>Z</b> (ou <b>X</b>) é o freio de mão: segure numa curva para derrapar e solte para recuperar a aderência. <b>R</b> volta ao grid (o melhor tempo é mantido). As marcas de pneu no asfalto seguem o caminho real das rodas.</div>
 <div class="note tip"><b>Desafios:</b> (1) mude <code>GRIP</code> e <code>GRIP_FM</code> para criar um carro de gelo ou um carro grudado no chão; (2) adicione um turbo na tecla <b>C</b> que multiplica <code>ACEL</code> por 1 s; (3) crie um fantasma que repete a melhor volta (guarde <code>pos</code> a cada quadro); (4) desenhe outra pista trocando só a lista <code>PONTOS</code>.</div>`,
 code:`camera.near = 0.5;
camera.far = 400;
camera.updateProjectionMatrix();
scene.background = new THREE.Color(0x8ecbff);

// ---- ajustes do carro (mexa à vontade!)
const ACEL = 26, FREIO = 40, ARRASTO = 0.8;  // motor, freio e resistência do ar

// ---- pista: uma curva fechada que passa por estes pontos [x, z]
const PONTOS = [[0, -70], [60, -80], [110, -45], [100, 15], [55, 50], [10, 30],
                [-30, 60], [-85, 50], [-115, 5], [-90, -45], [-45, -60]];
const curva = new THREE.CatmullRomCurve3(PONTOS.map(([x, z]) => new THREE.Vector3(x, 0, z)), true);
const N = 240;
const centro = curva.getSpacedPoints(N).slice(0, N);  // N pontos igualmente espaçados na linha central

// ponto ao lado da linha central: d > 0 para um lado, d < 0 para o outro
function lado(i, d) {
  const a = centro[(i + N - 1) % N], b = centro[(i + 1) % N];
  const tx = b.x - a.x, tz = b.z - a.z, m = Math.hypot(tx, tz);  // tangente (direção da pista)

}

// faixa de d1 a d2 ao longo de toda a pista, um quadrilátero por trecho (cor escolhida por trecho)
function faixa(d1, d2, cor, y) {
  const pos = [], col = [], idx = [];

    const c = new THREE.Color(cor(i)), j = (i + 1) % N;
