<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games 2D com JavaScript</title>
<link rel="icon" type="image/x-icon" href="images/pc.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800&display=swap">
<style>
:root{--bg:#16301c;--panel:#3b2a1a;--deep:#1c130b;--line:#8a6a35;--ink:#f4e8c1;--mute:#c2ae7d;--gold:#ffd34e;--leaf:#78c840;--red:#e0483e;--water:#4aa3e0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:var(--fs,17px)/var(--lh,1.6) Nunito,system-ui,sans-serif;background:var(--bg) repeating-conic-gradient(var(--pad1,#1a3921) 0 25%,var(--pad2,#16301c) 0 50%) 0 0/32px 32px}
.px{font-family:"Press Start 2P",ui-monospace,monospace;line-height:1.5;font-weight:400}
header{display:flex;gap:16px;align-items:center;padding:20px;background:var(--panel);border-bottom:6px double var(--line)}
header h1{margin:0;font-size:clamp(13px,3.2vw,21px);color:var(--gold);text-shadow:3px 3px 0 #000}
header p{margin:6px 0 0;color:var(--mute)}
.wrap{display:flex;align-items:flex-start;max-width:1200px;margin:0 auto}
nav{width:360px;flex:none;top:0;padding:18px 14px;overflow-y:auto;overflow-x:hidden}
.prog{margin:0 0 14px}
.prog-top{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--mute);margin-bottom:6px}
.prog-top b{color:var(--gold);font-weight:400}
.prog-bar{height:14px;background:var(--deep);border:3px solid var(--line);border-radius:3px;overflow:hidden}
.prog-bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--leaf) 0 8px,#5aa82e 8px 10px);transition:width .5s}
nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;color:var(--ink);text-decoration:none;border:2px solid var(--navbd,#3F8F3A);border-radius:4px; background: var(--navbg,#16301C); margin: 5px;}
nav a b{font-family:"Press Start 2P",monospace;font-size:11px;color:var(--gold);width:22px;flex:none}
nav a:hover{border-color:var(--line)}
nav details{margin:0 0 10px}
nav summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;padding:10px 12px;font-family:"Press Start 2P",ui-monospace,monospace;font-size:10px;line-height:1.4;color:var(--leaf);background:var(--deep);border:3px solid var(--line);border-radius:4px;user-select:none}
nav summary::-webkit-details-marker{display:none}
nav summary::before{content:"\25B6";font-size:9px;color:var(--gold);transition:transform .15s}
nav details[open]>summary::before{transform:rotate(90deg)}
nav summary .cnt{margin-left:auto;font-size:9px;color:var(--mute)}
nav summary:hover{border-color:var(--gold)}
nav details.atual>summary{color:var(--gold)}
nav summary:focus-visible{outline:3px solid var(--water);outline-offset:2px}
nav details>div{padding-top:4px}
nav a.on{background:var(--panel);border-color:var(--gold)}
nav a.ok::after{content:"◆";margin-left:auto;color:var(--leaf)}
main{flex:1;min-width:0;padding:24px 20px 60px}
h2{font-size:clamp(14px,2.6vw,19px);color:var(--leaf);margin:0 0 14px;text-shadow:2px 2px 0 #000}
code{background:var(--deep);padding:1px 6px;border-radius:4px;color:var(--gold);font-size:.92em}
.lab{display:grid;gap:14px;margin:20px 0}
.box{border:4px solid var(--line);background:var(--panel);border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px #000}
.box h3{margin:0;padding:8px 12px;font-size:10px;background:var(--line);color:#1c130b}
textarea{display:block;width:100%;height:340px;border:0;outline:0;resize:vertical;background:var(--deep);color:#e9dcae;font:14px/1.5 ui-monospace,Consolas,monospace;padding:12px;tab-size:2}
canvas{display:block;width:100%;height:auto;background:#000;image-rendering:pixelated;touch-action:none}
.bar{display:flex;gap:10px;padding:10px;flex-wrap:wrap}
button{font:inherit;font-weight:800;border:0;border-radius:6px;padding:9px 16px;cursor:pointer;color:#1c130b;background:var(--leaf);box-shadow:0 4px 0 #3f7a1c}
button.alt{background:var(--gold);box-shadow:0 4px 0 #a98410}
button:active{transform:translateY(3px);box-shadow:none}
button:focus-visible,a:focus-visible,textarea:focus-visible,canvas:focus-visible{outline:3px solid var(--water);outline-offset:2px}
input[type="search"]::-webkit-search-cancel-button {cursor: pointer;}
.err{color:#ff8c82;font:13px ui-monospace,monospace;padding:10px 12px 10px;min-height:1px}
.err:empty{display:none}
.quest{border-left:6px solid var(--gold);background:var(--panel);padding:10px 16px;border-radius:0 8px 8px 0}
.pg{display:flex;justify-content:space-between;margin-top:26px;gap:10px}
.notas{margin-top:22px;border:4px solid var(--line);background:var(--panel);border-radius:6px;box-shadow:0 0 0 2px #000}
.notas summary{cursor:pointer;list-style:none;padding:10px 14px;font-weight:800;color:var(--leaf);display:flex;gap:10px;align-items:center}
.notas summary::-webkit-details-marker{display:none}
.notas summary::before{content:"\25B6";font-size:11px;color:var(--gold);transition:transform .15s}
.notas[open]>summary::before{transform:rotate(90deg)}
.notas summary:focus-visible{outline:3px solid var(--water);outline-offset:-3px}
.notas summary .nt-ind{margin-left:auto;font-size:12px;font-weight:400;color:var(--mute)}
.nt-corpo{padding:0 12px 12px}
.notas textarea{height:150px;min-height:90px;border:3px solid var(--line);border-radius:6px;font:inherit;font-size:15px;line-height:1.5;color:var(--ink);background:var(--deep);box-sizing:border-box}
.nt-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px}
.nt-bar span{flex:1;min-width:160px;font-size:13px;color:var(--mute)}
.nt-bar span.ruim{color:#ff8c82}
nav a.nt span::after{content:" ✎";color:var(--gold)}
@media(max-width:860px){.wrap{display:block}nav{width:auto;position:static;max-height:none;padding:10px;background:var(--panel);border-bottom:4px solid var(--line)}#menu{display:flex;flex-direction:column;gap:4px}nav a{padding:10px}.lab{grid-template-columns:1fr} nav a.on { background:var(--deep) }}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
header #glo,header #cfg{margin-left:auto;flex:none}
header #inicio{margin-left:auto;flex:none;padding:9px 12px}
header #inicio svg{display:block;width:27px;height:27px}
header #inicio+#cfg,header #cfg+#glo{margin-left:0}
#gl,#cf{width:min(720px,94vw);max-height:86vh;padding:0;border:4px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);box-shadow:0 0 0 2px #000,0 10px 40px #000a;overflow:hidden}
#gl[open],#cf[open]{display:flex;flex-direction:column}
#gl::backdrop,#cf::backdrop{background:rgba(0,0,0,.65)}
.glw{display:flex;flex-direction:column;min-height:0;max-height:86vh}
.glh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--line)}
.glh h2{margin:0;flex:1;font-size:12px;color:#1c130b;text-shadow:none}
.glh button{padding:6px 12px;box-shadow:0 3px 0 #a98410}
#glBusca{margin:12px 14px 2px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--deep);border:3px solid var(--line);border-radius:6px}
#glBusca:focus-visible{outline:3px solid var(--water);outline-offset:2px}
#capBusca{width:100%;box-sizing:border-box;margin:0 0 6px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--deep);border:3px solid var(--line);border-radius:6px}
#capBusca:focus-visible{outline:3px solid var(--water);outline-offset:2px}
#capN{margin:0 2px 8px;font-size:12px;color:var(--mute);min-height:1em}
#menu[hidden],#capRes[hidden]{display:none!important}
#capRes a{align-items:flex-start}
#capRes a span{display:block;min-width:0}
#capRes a small{display:block;margin-top:3px;font-size:12px;line-height:1.4;color:var(--mute);font-weight:400}
#capRes mark{background:var(--gold);color:#1c130b;border-radius:2px;padding:0 1px}
::highlight(busca-cap){background:#ffd34e;color:#1c130b}
#glN{margin:4px 16px 8px;font-size:13px;color:var(--mute)}
#glLista{margin:0;padding:0 14px 14px;overflow-y:auto;min-height:0}
.gt{padding:10px 0;border-top:1px solid #5a4424}
.gt dt{font-family:"Press Start 2P",ui-monospace,monospace;font-size:11px;line-height:1.5;color:var(--gold);margin-bottom:6px}
.gt dd{margin:0}
.gt a{color:var(--water);white-space:nowrap}
.aju{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0; margin-bottom: 16px;}
.apoio{margin:8px 0 12px;padding:12px 14px;border:3px solid var(--line);border-radius:8px;background:var(--panel);line-height:1.6}
.apoio pre{margin:8px 0;padding:10px 12px;overflow-x:auto;background:var(--deep);border:2px solid #5a4424;border-radius:6px;font:12px/1.5 ui-monospace,monospace;color:var(--ink)}
.apoio#adica { margin-top:16px; }
.apoio pre{max-height:380px;overflow:auto}
.apoio pre.prompt{white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:hidden}
.apoio pre code{font:inherit;padding:0;background:none;border-radius:0;color:inherit}
.prog-q{margin-top:6px;font-size:12px;color:var(--mute)}
nav a .qn{margin-left:auto;font-style:normal;font-size:12px;font-weight:800;color:var(--mute)}
nav a .qn:empty{display:none}
nav a .qn.ouro{color:var(--gold)}
nav a.q.ok::after{margin-left:8px}
.quiz .mut{color:var(--mute);font-size:.9em}
.qq{margin:14px 0 0;padding-top:10px;border-top:1px solid #5a4424}
.qp{margin:0 0 6px}
.opc{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;background:var(--deep);color:var(--ink);border:3px solid var(--line);box-shadow:none;font-weight:700}
.opc:hover:not(:disabled){border-color:var(--gold)}
.opc:active{transform:none}
.opc:disabled{color:var(--ink);cursor:default}
.opc.certo{border-color:var(--leaf);background:#1f4a1a}
.opc.certo::after{content:" \2714";color:var(--leaf)}
.opc.errado{border-color:var(--red);background:#4a1f1a}
.opc.errado::after{content:" \2716";color:#ff8c82}
.qexp{margin:6px 0 0;color:var(--mute)}
.qres{margin-top:14px;padding-top:10px;border-top:1px solid #5a4424;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qres:empty{display:none}

/* ---- Bônus: Pixel Art ---- */
.pxa{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;margin:20px 0;align-items:start}
.pxa-lado{display:grid;gap:14px;min-width:0}
.pxa-in{padding:12px;position:relative}
.pxa-col{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.pxa-grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pxa-linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.pxa label{display:flex;align-items:center;gap:8px;color:var(--ink)}
.pxa input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold)}
.pxa input[type=color]{width:44px;height:30px;padding:0;border:3px solid var(--line);border-radius:4px;background:var(--deep);cursor:pointer}
.pxa select{font:inherit;background:var(--deep);color:var(--ink);border:3px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
.pxa label.pxa-sel{flex-wrap:wrap}
.pxa .pxa-sel select{flex:1 1 9em;min-width:0}
.pxa-col button,.pxa-grade button{min-width:0}
.pxa select:focus-visible,.pxa input:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.pxa button:disabled{opacity:.45;cursor:default}
.pxa label.botao{display:block;text-align:center;font-weight:800;border-radius:6px;padding:9px 16px;cursor:pointer;color:#1c130b;background:var(--gold);box-shadow:0 4px 0 #a98410}
.pxa label.botao:active{transform:translateY(3px);box-shadow:none}
.pxa-oculto{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.pxa-oculto:focus-visible+label{outline:3px solid var(--water);outline-offset:2px}
.pxa-ferr{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
button.pt{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;font-size:14px;background:var(--deep);color:var(--ink);border:3px solid var(--line);box-shadow:none;font-weight:700}
button.pt:hover:not(:disabled){border-color:var(--gold)}
button.pt:active{transform:none}
button.pt[aria-pressed="true"]{border-color:var(--gold);background:var(--deep);color:var(--gold)}
button.pt kbd{font:700 10px ui-monospace,monospace;color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.pxa-tela{padding:12px}
.pxa-tela canvas{width:100%;max-width:512px;aspect-ratio:1;margin:0 auto;cursor:crosshair;border:3px solid var(--line);background:#a5a5b0}
.pxa-status{padding:0 12px 10px;color:var(--mute);font:13px ui-monospace,monospace;min-height:1.6em}
.pxa-quadros{padding:0 12px 4px;border-top:1px solid #5a4424}
.pxa-lista{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 4px}
button.pq{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px;font-size:11px;background:var(--deep);color:var(--ink);border:3px solid var(--line);box-shadow:none}
button.pq:active{transform:none}
button.pq[aria-pressed="true"]{border-color:var(--gold)}
button.pq canvas{width:48px;height:48px;background:repeating-conic-gradient(#8d8d98 0 25%,#a5a5b0 0 50%) 0 0/12px 12px}
.pxa-pal{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:12px 12px 8px}
button.sw{aspect-ratio:1;min-width:0;padding:0;border:3px solid #000;border-radius:3px;box-shadow:none}
button.sw:active{transform:none}
button.sw[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:1px}
.pxa-atual{margin-top:8px;font-size:14px;color:var(--mute)}
.pxa-atual i{display:inline-block;width:18px;height:18px;border:2px solid #000;vertical-align:middle;margin-right:4px}
.pxa-atual b{color:var(--ink);font-weight:700}
#pxv{width:128px;height:128px;margin:0 auto;border:3px solid var(--line);background:#8fbfe8}
.pxa-msg{padding:0 12px 10px;color:var(--leaf);font-size:14px}
.pxa-msg:empty{display:none}
.mpe-tela{padding:12px}
.mpe-tela canvas{display:block;box-sizing:content-box;width:100%;height:auto;margin:0 auto;cursor:crosshair;border:3px solid var(--line);background:#000;touch-action:none}
.mpe-val{padding:0 12px 10px;font-size:14px;color:var(--leaf);min-height:1.4em}
.mpe-val.ruim{color:#ff8c82}
button.mpe-t i{display:inline-block;width:14px;height:14px;border:2px solid #000;border-radius:2px;flex:none}
.pxa input[type=number]{font:inherit;width:4.5em;background:var(--deep);color:var(--ink);border:3px solid var(--line);border-radius:6px;padding:5px 8px}
.mpe-txt{display:block;width:100%;min-height:150px;resize:vertical;font:12px/1.35 ui-monospace,monospace;background:var(--deep);color:var(--ink);border:3px solid var(--line);border-radius:6px;padding:8px;box-sizing:border-box}
.mpe-txt:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.gs-onda{padding:12px 12px 0}
.gs-onda canvas{display:block;width:100%;height:auto;border:3px solid var(--line);background:#0d0a14}
.gs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px;margin-top:8px}
.pxa label.gs-s{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline;font-size:14px}
.gs-s output{color:var(--gold);font:700 13px ui-monospace,monospace}
.gs-s input[type=range]{grid-column:1/-1;width:100%;margin:2px 0 0;accent-color:var(--gold)}
.gs-s.off{opacity:.45}
.pxa input[type=text]{font:inherit;flex:1 1 9em;min-width:0;background:var(--deep);color:var(--ink);border:3px solid var(--line);border-radius:6px;padding:5px 8px}
@media(max-width:560px){.gs-grid{grid-template-columns:1fr}}
#retoma{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;background:var(--deep);color:var(--ink);border:3px solid var(--gold);border-radius:8px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:14px;max-width:calc(100vw - 24px);box-shadow:0 4px 0 #000}
#retoma button{padding:4px 10px;font-size:13px}
@media(max-width:860px){.pxa{grid-template-columns:1fr}}
/* ---- Configurações: temas e ajustes ---- */
html[data-fonte="p"]{--fs:15px} html[data-fonte="g"]{--fs:19px} html[data-fonte="gg"]{--fs:22px}
html[data-linha="c"]{--lh:1.4} html[data-linha="a"]{--lh:1.9}
html[data-mov="0"] *,html[data-mov="0"] *::before,html[data-mov="0"] *::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
html[data-pixel="0"] .px{font-family:Nunito,system-ui,sans-serif!important;font-weight:800;letter-spacing:.02em}
html[data-pixel="0"] :is(h1,h2,h3).px{font-size:1.25rem}
html[data-tema="noite"]{--bg:#0f1424;--panel:#1a2238;--deep:#0b1020;--line:#4a5a8a;--ink:#e6ecff;--mute:#9fb0d8;--leaf:#6fd3a0;--water:#5ab0ff;--pad1:#121a2e;--pad2:#0f1424;--navbg:#0f1424;--navbd:#2f4a7a}
html[data-tema="gameboy"]{--bg:#0f380f;--panel:#306230;--deep:#0f380f;--line:#8bac0f;--ink:#e0f8d0;--mute:#9bbc0f;--gold:#e0f8d0;--leaf:#9bbc0f;--water:#9bbc0f;--pad1:#133d13;--pad2:#0f380f;--navbg:#0f380f;--navbd:#8bac0f}
html[data-tema="dungeon"]{--bg:#1b1226;--panel:#2c1d3d;--deep:#150d1e;--line:#7a5aa8;--ink:#efe6ff;--mute:#b9a6d6;--gold:#ffcf5a;--leaf:#b88cf0;--red:#ff6a7a;--water:#6ec6ff;--pad1:#20152e;--pad2:#1b1226;--navbg:#150d1e;--navbd:#5a3f86}
html[data-tema="contraste"]{--bg:#000;--panel:#000;--deep:#000;--line:#fff;--ink:#fff;--mute:#e6e6e6;--gold:#ffe600;--leaf:#00ff66;--red:#ff5a5a;--water:#4dc3ff;--pad1:#000;--pad2:#000;--navbg:#000;--navbd:#fff}
.cfb{padding:14px 16px 18px;overflow-y:auto;min-height:0;display:grid;gap:18px}
.cfb h3{margin:0 0 10px;font-size:10px;color:var(--leaf)}
.cfp{display:flex;flex-wrap:wrap;gap:8px}
.cfp button{display:inline-flex;align-items:center;gap:8px;background:var(--deep);color:var(--ink);box-shadow:none;border:3px solid var(--line);padding:8px 12px}
.cfp button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.cfsw{display:inline-flex;border:2px solid #000;border-radius:3px;overflow:hidden}
.cfsw i{display:block;width:12px;height:16px}
.cft{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.cft input{width:20px;height:20px;accent-color:var(--gold);flex:none}
.cfa{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px}
.cfn{margin:0 0 10px;font-size:13px;color:var(--mute)}
#cfMsg{display:none;margin:0;font-size:14px;color:var(--leaf)}
@media screen and (max-width: 750px) { svg { display: none; } }
@media screen and (max-width: 585px) { svg { display: flex; } header > div > h1, p {text-align: center;} }
@media screen and (max-width: 585px) { header {flex-direction: column;} header #cfg { margin: 0 auto;} header #inicio, header #inicio+#cfg { margin: 0 auto; } header #cfo { margin-left:none; }}
</style>
<script>
(function(){try{var d=document.documentElement.dataset,c=JSON.parse(localStorage.getItem('guiaGames:config')||'{}');
if(c.tema&&c.tema!=='floresta')d.tema=c.tema;if(c.fonte&&c.fonte!=='m')d.fonte=c.fonte;if(c.linha&&c.linha!=='n')d.linha=c.linha;
if(c.pixel===false)d.pixel='0';
if(c.mov===false||(c.mov===undefined&&window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))d.mov='0';
}catch(e){}})();
</script>
</head>

<header>
<svg width="56" height="50" viewBox="0 0 34 30" aria-hidden="true">

{n:"Introdução",t:`<p>Bem-vindo! Este guia ensina a criar <b>jogos 2D direto no navegador</b>, com JavaScript e o elemento <code>canvas</code>, sem instalar nada e sem bibliotecas. Cada capítulo tem uma explicação curta, um código que você pode <b>editar</b>, a tela onde ele roda e um desafio no fim. Não precisa saber programar: o caminho começa do zero.</p><p><b>JavaScript</b> é a linguagem que os navegadores entendem. Você só vai precisar de poucas peças: <b>variáveis</b> (<code>const</code> guarda um valor que não muda, <code>let</code> um valor que muda), <b>objetos</b> (<code>{ x: 10, y: 20 }</code> junta várias informações), <b>listas</b> (<code>[1, 2, 3]</code>), <b>funções</b> (blocos de código com nome, como <code>novaMoeda()</code>, ou a forma curta <code>(dt) =&gt; { ... }</code>) e <b>decisões e repetições</b> (<code>if</code> e <code>for</code>). Tudo isso aparece em uso, e os comentários (<code>// assim</code>) explicam cada pedaço.</p><p>O <b>canvas</b> é uma tela em branco dentro da página. O JavaScript pega o "pincel" dela, que no guia se chama <code>ctx</code>, e manda desenhar: <code>fillRect</code> pinta retângulos, <code>arc</code> faz círculos e <code>fillText</code> escreve texto. Cada ponto da tela tem uma posição (x, y): o (0, 0) fica no <b>canto superior esquerdo</b>, o x cresce para a direita e o y cresce para <b>baixo</b>. A tela do guia tem 480 × 240, e as variáveis <code>W</code> e <code>H</code> guardam esse tamanho.</p><p>Quase todo <b>jogo 2D</b> repete o mesmo ciclo, muitas vezes por segundo: <b>(1)</b> ler a entrada (teclado, mouse ou toque), <b>(2)</b> atualizar o mundo (mover, aplicar regras, checar colisões) e <b>(3)</b> desenhar tudo de novo. Esse ciclo é o <b>game loop</b>, e aqui ele é a função <code>loop(dt)</code>. O <code>dt</code> (<i>delta time</i>) é o tempo desde o quadro anterior: multiplicar as velocidades por ele faz o jogo andar igual em qualquer computador. O código que veremos a seguir mostra as três etapas, marcadas nos comentários.</p><p>O caminho do guia: os primeiros capítulos cobrem o básico (coordenadas, desenho, animação, teclado e colisão). Depois vêm os recursos que dão vida a um jogo, como sprites, câmera, som, estados, física, inimigos com inteligência e mapas gerados por código. Os últimos juntam tudo em jogos completos. Qualquer termo novo está no <b>Glossário</b>, o botão no topo da página.</p><p><b>Como usar:</b> edite o código na caixa da esquerda e aperte <b>Executar</b> (ou <b>Ctrl+Enter</b>). Clique na tela do jogo antes de usar o teclado. Suas edições são <b>salvas sozinhas</b> neste navegador, capítulo por capítulo, e o botão <b>Restaurar</b> volta ao código original. O botão <b>Baixar HTML</b> salva o jogo, com o seu código, num arquivo que abre sozinho no navegador. Se algo der errado, a mensagem de erro aparece em vermelho embaixo da tela.</p><p>Pronto para começar? O exemplo ao lado já é um jogo completo: pegue as moedas com as setas (ou WASD), ou clique e segure na tela para ir até o ponteiro.</p>`,
d:"Mude a velocidade do jogador (o número 150), a cor da moeda e o tamanho dela. Depois faça cada moeda valer 10 pontos em vez de 1.",
c:`// Seu primeiro jogo: use as setas (ou WASD) para pegar as moedas.
// Tudo aqui é JavaScript puro, sem bibliotecas.

const jogador = { x: 100, y: 110, tam: 20 };     // um objeto guarda várias informações juntas
let moeda = { x: 300, y: 100 };                  // let: o valor vai mudar (a moeda muda de lugar)
let pontos = 0;

function novaMoeda() {                           // uma função é um bloco de código com nome
  moeda.x = 20 + Math.random() * (W - 40);
  moeda.y = 20 + Math.random() * (H - 40);
}

loop((dt) => {                                   // roda cerca de 60 vezes por segundo
  // 1) ENTRADA e ATUALIZAÇÃO: ler as teclas e mover o jogador
  if (keys.ArrowLeft  || keys.a) jogador.x -= 150 * dt;
  if (keys.ArrowRight || keys.d) jogador.x += 150 * dt;
  if (keys.ArrowUp    || keys.w) jogador.y -= 150 * dt;
  if (keys.ArrowDown  || keys.s) jogador.y += 150 * dt;
  if (mouse.down) {                              // clique ou toque: vai em direção ao ponteiro
    const d = Math.hypot(mouse.x - jogador.x, mouse.y - jogador.y);
    if (d > 4) {
      jogador.x += (mouse.x - jogador.x) / d * 150 * dt;
      jogador.y += (mouse.y - jogador.y) / d * 150 * dt;
    }
  }
  jogador.x = Math.max(10, Math.min(W - 10, jogador.x));   // não deixa sair da tela
  jogador.y = Math.max(10, Math.min(H - 10, jogador.y));

  // 2) REGRAS: o jogador chegou perto da moeda?
  if (Math.hypot(jogador.x - moeda.x, jogador.y - moeda.y) < 18) {
    pontos++;
    novaMoeda();
  }

  // 3) DESENHO: limpa a tela e pinta tudo de novo, a cada quadro
  ctx.fillStyle = '#241d33'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffd34e';
  ctx.beginPath(); ctx.arc(moeda.x, moeda.y, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#7ddcff';
  ctx.fillRect(jogador.x - jogador.tam / 2, jogador.y - jogador.tam / 2, jogador.tam, jogador.tam);
  ctx.fillStyle = '#fff'; ctx.font = '14px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Moedas: ' + pontos, 10, 20);
});
`},
{n:"Desenhar",t:`<p>Todo jogo 2D vive dentro de um elemento <code>&lt;canvas&gt;</code>: uma tela em branco. O <code>ctx</code> é o seu pincel. Você escolhe a cor com <code>fillStyle</code> e pinta formas com <code>fillRect(x, y, largura, altura)</code> ou <code>arc(...)</code>.</p><p>Nesta tela, <code>W</code> = 480 e <code>H</code> = 240 são a largura e a altura.</p>`,
d:"Adicione um arbusto verde-escuro ao lado do herói e uma pedra cinza perto da água.",

ctx.beginPath();

ctx.beginPath();
ctx.arc(132, 114, 5, 0, Math.PI * 2); // cristal do cajado
ctx.fill();

// túnica

// barba

// rosto

ctx.fillStyle = '#1c130b';
ctx.fillRect(110, 135, 2, 2);        // olho esquerdo
ctx.fillRect(116, 135, 2, 2);        // olho direito

// chapéu pontudo

ctx.fillRect(98, 129, 32, 4);        // aba

ctx.moveTo(104, 129);
ctx.lineTo(124, 129);
ctx.lineTo(114, 104);                // ponta

{n:"Desenhar imagens",t:`<p>Até aqui desenhamos com formas: <code>fillRect</code>, <code>arc</code>, linhas. Um jogo de verdade usa <b>imagens</b>, a arte pronta que vem de arquivos PNG. O canvas desenha uma imagem com <code>ctx.drawImage(...)</code>. Neste capítulo montamos uma cena: o <b>fundo</b> (<code>background.png</code>, 480 × 240, do tamanho exato do canvas) e uma <b>raposa</b> (<code>fox.png</code>, 32 × 32) em pé sobre a plataforma de grama.</p><p><b>1) Carregar.</b> Uma imagem é um objeto <code>Image</code>: você o cria com <code>new Image()</code> e diz o arquivo em <code>src</code>. O navegador carrega em segundo plano, então nos primeiros quadros ela pode não estar pronta. Por isso o código só desenha quando <code>img.complete</code> é verdadeiro e <code>img.naturalWidth</code> é maior que 0 (a imagem chegou e tem tamanho). Enquanto isso, mostra <i>Carregando imagens...</i>. Se o arquivo não for achado, o evento <code>onerror</code> dispara e o código avisa na tela.</p><p><b>2) Desenhar.</b> O <code>drawImage</code> tem três formas: <code>drawImage(img, x, y)</code> desenha no tamanho original; <code>drawImage(img, x, y, largura, altura)</code> estica ou encolhe; e <code>drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh)</code> recorta um pedaço da imagem, que é o que o capítulo Spritesheet e estados usa. O <code>(x, y)</code> é sempre o canto <b>superior esquerdo</b> da imagem. E vale a ordem: o que é desenhado depois fica por cima, então o fundo vem primeiro e a raposa depois.</p><p><b>3) Pôr a raposa no chão.</b> No fundo, a grama da plataforma começa em <code>y = 176</code>. Como o y da imagem é o seu <b>topo</b>, para os pés tocarem o chão usamos <code>y = CHAO - altura</code>: a base da imagem encosta em 176. Com <code>ESCALA = 2</code> a altura dobra e o y é recalculado, então ela continua pisando no chão.</p><p><b>4) Pixel art nítida.</b> Ao ampliar uma imagem, o navegador suaviza as bordas e a arte fica borrada. <code>ctx.imageSmoothingEnabled = false</code> desliga isso e mantém os pixels quadradinhos. Se você mudar o tamanho do canvas, volte a definir, porque o canvas restaura esse valor.</p><p><b>5) Espelhar.</b> A raposa do arquivo olha para a direita. Para ela olhar para a esquerda, o código usa <code>save()</code>, <code>translate(X + w, y)</code>, <code>scale(-1, 1)</code>, desenha em <code>(0, 0)</code> e usa <code>restore()</code>. A escala <code>-1</code> no eixo x inverte o desenho, e o <code>translate</code> leva a origem para a borda direita da raposa, para ela continuar no mesmo lugar. O <code>save</code> e o <code>restore</code> garantem que o espelhamento valha só para ela, e não para o resto do que for desenhado depois.</p><p>As imagens ficam na pasta <code>assets/images/</code>, ao lado do HTML (o botão <i>Baixar assets (.zip)</i> leva os dois arquivos). Brinque com <code>X</code>, <code>ESCALA</code> e <code>ESPELHAR</code>.</p>`,
d:"Coloque a raposa em cima da caixa de madeira que aparece no fundo e faça-a olhar para a esquerda, na direção da placa de madeira. A caixa fica em <code>x = 128</code> e o topo dela está em <code>y = 144</code>.",
c:`// Desenhar imagens: o fundo e uma raposa em pé sobre a plataforma.
// As imagens ficam na pasta assets/images/, ao lado do HTML.

// 1) Criar as imagens. O navegador carrega em segundo plano (leva um tempinho).
let falhou = false;
const fundo = new Image();
const raposa = new Image();
fundo.onerror = raposa.onerror = () => { falhou = true; };   // arquivo não encontrado
fundo.src = 'assets/images/background.png';
raposa.src = 'assets/images/fox.png';

// 2) Ajustes para brincar
const CHAO = 176;        // y da superfície onde a raposa pisa (a grama do fundo começa em y = 176)
const X = 40;            // x do canto esquerdo da raposa
const ESCALA = 1;        // 1 = tamanho original, 2 = o dobro
const ESPELHAR = false;  // true: a raposa olha para a esquerda

const pronta = (img) => img.complete && img.naturalWidth > 0;   // já carregou?

function mensagem(texto) {
  ctx.fillStyle = '#16301c'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.font = '14px monospace'; ctx.textAlign = 'center';
  ctx.fillText(texto, W / 2, H / 2);
}

loop(() => {
  if (falhou) { mensagem('Não achei as imagens em assets/images/'); return; }
  if (!pronta(fundo) || !pronta(raposa)) { mensagem('Carregando imagens...'); return; }

  ctx.imageSmoothingEnabled = false;       // pixel art: sem borrar

  // 3) Primeiro o fundo (fica atrás): drawImage(imagem, x, y)
  ctx.drawImage(fundo, 0, 0);

  // 4) Depois a raposa, por cima: drawImage(imagem, x, y, largura, altura)
  const w = raposa.width * ESCALA;
  const h = raposa.height * ESCALA;
  const y = CHAO - h;                      // o y da imagem é o TOPO dela: a base encosta no chão
  if (ESPELHAR) {
    ctx.save();
    ctx.translate(X + w, y);               // leva a origem para o canto direito da raposa
    ctx.scale(-1, 1);                      // inverte o eixo x: o desenho sai espelhado
    ctx.drawImage(raposa, 0, 0, w, h);
    ctx.restore();                         // desfaz o translate e o scale
  } else {
    ctx.drawImage(raposa, X, y, w, h);
  }

  ctx.fillStyle = '#1c130b'; ctx.font = '12px monospace'; ctx.textAlign = 'left';
  ctx.fillText('x: ' + X + '   y: ' + y + '   escala: ' + ESCALA, 10, 20);
});
`},
{n:"Coordenadas",t:`<p>O ponto <code>(0, 0)</code> fica no <b>canto superior esquerdo</b>. O <code>x</code> cresce para a direita e o <code>y</code> cresce para <b>baixo</b> (ao contrário da matemática da escola).</p><p>Mova o mouse (ou o dedo) sobre a tela: o marcador sempre fica dentro da área do jogo. A grade marca de 40 em 40 pixels.</p>`,
d:"Desenhe um quadrado vermelho fixo na posição (440, 200), no canto inferior direito.",
c:`loop(() => {
  ctx.fillStyle = '#1e3a1e';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#3f6b3a';
  for (let x = 0; x <= W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y <= H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // mouse.x e mouse.y já ficam entre 0 e W / 0 e H
  const mx = Math.max(6, Math.min(W - 6, mouse.x));
  const my = Math.max(6, Math.min(H - 6, mouse.y));
  ctx.fillStyle = '#ffd34e';
  ctx.fillRect(mx - 6, my - 6, 12, 12);

  ctx.fillStyle = '#f4e8c1';
  ctx.font = '14px monospace';
  ctx.fillText('x: ' + Math.round(mouse.x) + '   y: ' + Math.round(mouse.y), 10, 22);
});
`},
{n:"Animação",t:`<p>Animar é desenhar, limpar e desenhar de novo, muitas vezes por segundo. Isso é o <b>game loop</b>. A função <code>loop(dt)</code> roda a cada quadro e recebe o <code>dt</code>: o tempo, em segundos, desde o quadro anterior.</p><p>Fórmula essencial: <code>posição += velocidade * dt</code>. Assim o jogo roda igual em qualquer computador.</p>`,
d:"Faça outra forma geométrica voltar pela esquerda quando sair pela esquerda, e depois mude a velocidade para 400.",
c:`let x = 0;
const vel = 120;   // pixels por segundo

loop((dt) => {
  x += vel * dt;
  if (x > W) x = -40;

  ctx.fillStyle = '#3f8f3a';
  ctx.fillRect(0, 0, W, H);       // limpa o quadro

  ctx.fillStyle = '#e0483e';
  ctx.fillRect(x, 100, 40, 40);   // octorok
});
`},
{n:"Teclado",t:`<p>O objeto <code>keys</code> guarda quais teclas estão apertadas agora. <code>keys.ArrowLeft</code> é <code>true</code> enquanto a seta esquerda estiver pressionada. Também funcionam <code>keys.a</code>, <code>keys.d</code>, <code>keys.w</code> e <code>keys.s</code>.</p><p>Clique na tela e use as setas ou WASD. <code>Math.max</code> e <code>Math.min</code> seguram o herói dentro da tela.</p>`,
d:"Faça o herói correr mais rápido enquanto Shift estiver apertado (keys.Shift).",
c:`const p = { x: 220, y: 100, s: 28 };
const vel = 200;

loop((dt) => {
  if (keys.ArrowLeft  || keys.a) p.x -= vel * dt;
  if (keys.ArrowRight || keys.d) p.x += vel * dt;
  if (keys.ArrowUp    || keys.w) p.y -= vel * dt;
  if (keys.ArrowDown  || keys.s) p.y += vel * dt;

  p.x = Math.max(0, Math.min(W - p.s, p.x));
  p.y = Math.max(0, Math.min(H - p.s, p.y));

  ctx.fillStyle = '#3f8f3a';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffd34e';
  ctx.fillRect(p.x, p.y, p.s, p.s);
});
`},
{n:"Colisão",t:`<p>Colisão é saber se dois objetos se tocam. A forma mais simples é a <b>AABB</b>: dois retângulos se encostam quando se sobrepõem nos dois eixos ao mesmo tempo. A função <code>bate(a, b)</code> faz essa conta.</p><p>Mova o herói até a rocha: ela fica vermelha quando há colisão. O herói também não sai da tela: <code>Math.max</code> e <code>Math.min</code> seguram o <code>x</code> entre 0 e <code>W - largura</code>, e o <code>y</code> entre 0 e <code>H - altura</code>.</p>`,
d:"Em vez de mudar a cor, impeça o herói de atravessar a rocha (volte à posição anterior se bater).",
c:`const heroi = { x: 40, y: 100, w: 28, h: 28 };
const rocha = { x: 250, y: 50, w: 40, h: 140 };

function bate(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

loop((dt) => {
  if (keys.ArrowLeft  || keys.a) heroi.x -= 180 * dt;
  if (keys.ArrowRight || keys.d) heroi.x += 180 * dt;
  if (keys.ArrowUp    || keys.w) heroi.y -= 180 * dt;
  if (keys.ArrowDown  || keys.s) heroi.y += 180 * dt;
  heroi.x = Math.max(0, Math.min(W - heroi.w, heroi.x));   // limites do mapa
  heroi.y = Math.max(0, Math.min(H - heroi.h, heroi.y));

  ctx.fillStyle = '#3f8f3a';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = bate(heroi, rocha) ? '#e0483e' : '#8a5a2b';
  ctx.fillRect(rocha.x, rocha.y, rocha.w, rocha.h);

  ctx.fillStyle = '#ffd34e';
  ctx.fillRect(heroi.x, heroi.y, heroi.w, heroi.h);
});
`},
{n:"Depuração",t:`<p>Depurar é <b>tornar visível o que está invisível</b>. A hitbox, por exemplo, não aparece na tela, e é aí que nascem as dúvidas do tipo "por que bateu se não encostou?". A saída é desenhar o contorno com <code>strokeRect</code> (só a borda, sem preencher) por cima do jogo, numa cor viva. Neste exemplo, o <b>tracejado branco</b> é o desenho do jogador e o <b>retângulo verde</b> é a hitbox, que fica 4px menor de cada lado. Ela vira <b>vermelha</b> quando há colisão. Assim você vê na hora se a caixa de colisão está maior, menor ou deslocada em relação ao desenho.</p><p>Mostre também os números que importam como <b>texto na tela</b>: posição, estado, velocidade. É mais rápido do que abrir o console. O <b>FPS</b> não deve ser calculado com <code>1 / dt</code>, que oscila demais. O jeito certo é contar os quadros e fechar a conta a cada segundo, como no código. Um FPS baixo explica vários bugs estranhos, como objetos atravessando paredes.</p><p>O <code>console.log</code> dentro do <code>loop</code> roda 60 vezes por segundo e afoga o console (abra com F12, aba Console). Registre só quando algo <b>muda</b>: guarde o valor anterior (<code>batendo</code>) e escreva a mensagem apenas na transição, como no exemplo. Passe também os valores, como em <code>console.log('x:', jogador.x)</code>, para não ter que adivinhar o que cada linha significa.</p><p>Por fim, duas ferramentas de bancada: a <b>câmera lenta</b> (tecla L) multiplica o <code>dt</code> por 0,2 para você ver a colisão acontecer, e o interruptor <code>DEBUG</code> (tecla G) liga e desliga tudo isso sem apagar código. Deixe a depuração no jogo enquanto desenvolve e desligue só no final.</p><p>Setas ou WASD movem o jogador. Passe-o pelas caixas verdes e observe o contorno.</p>`,
d:"Crie mais caixas com um laço e mostre no painel quantas delas estão colidindo com o jogador neste quadro.",
c:`// ---------- DEPURAÇÃO: tornar visível o que está invisível ----------
let DEBUG = true;                  // tecla G liga e desliga o modo depuração
let lento = false;                 // tecla L: câmera lenta (20% da velocidade)
let fps = 0, contador = 0, relogio = 0, batendo = false, antes = {};

const jogador = { x: 60, y: 104, w: 28, h: 32 };
const HIT = { dx: 4, dy: 4, w: 20, h: 26 };       // a hitbox é MENOR que o desenho
const caixas = [
  { x: 250, y: 40,  w: 30, h: 30, vx: -70 },
  { x: 380, y: 150, w: 36, h: 36, vx: 55 }
];
const bate = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const apertou = (k) => keys[k] && !antes[k];

loop((dt) => {
  if (apertou('g')) DEBUG = !DEBUG;
  if (apertou('l')) lento = !lento;
  const d = lento ? dt * 0.2 : dt;                // d move o jogo; dt (real) fica só para o FPS

  // FPS: conta os quadros e fecha a conta a cada segundo
  contador++; relogio += dt;
  if (relogio >= 1) { fps = contador; contador = 0; relogio -= 1; }

  // movimento
  if (keys.ArrowLeft  || keys.a) jogador.x -= 150 * d;
  if (keys.ArrowRight || keys.d) jogador.x += 150 * d;
  if (keys.ArrowUp    || keys.w) jogador.y -= 150 * d;
  if (keys.ArrowDown  || keys.s) jogador.y += 150 * d;
  jogador.x = Math.max(0, Math.min(W - jogador.w, jogador.x));
  jogador.y = Math.max(0, Math.min(H - jogador.h, jogador.y));
  caixas.forEach(c => { c.x += c.vx * d; if (c.x < 0 || c.x + c.w > W) c.vx = -c.vx; });

  // colisão: usa a hitbox, não o desenho
  const hit = { x: jogador.x + HIT.dx, y: jogador.y + HIT.dy, w: HIT.w, h: HIT.h };
  const tocou = caixas.some(c => bate(hit, c));
  if (tocou && !batendo) {                        // console.log só quando algo MUDA, não 60 vezes por segundo
    console.log('colisão começou em', Math.round(jogador.x), Math.round(jogador.y));
  }
  batendo = tocou;

  // ---------- desenho do jogo ----------
  ctx.fillStyle = '#241d33'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#2d6b2a';
  caixas.forEach(c => ctx.fillRect(c.x, c.y, c.w, c.h));
  ctx.fillStyle = '#ffd34e'; ctx.fillRect(jogador.x, jogador.y, jogador.w, jogador.h);
  ctx.fillStyle = '#1c130b'; ctx.fillRect(jogador.x + 18, jogador.y + 8, 4, 4);

  // ---------- camada de depuração (por cima de tudo) ----------
  if (DEBUG) {
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#00ff88';                  // verde: hitboxes dos obstáculos
    caixas.forEach(c => ctx.strokeRect(c.x, c.y, c.w, c.h));
    ctx.strokeStyle = tocou ? '#ff3b30' : '#00ff88';
    ctx.strokeRect(hit.x, hit.y, hit.w, hit.h);   // hitbox do jogador (vermelha ao colidir)
    ctx.strokeStyle = '#ffffff'; ctx.setLineDash([3, 3]);
    ctx.strokeRect(jogador.x, jogador.y, jogador.w, jogador.h);   // tracejado: o desenho
    ctx.setLineDash([]);

    ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textAlign = 'left';

    ctx.fillText('FPS: ' + (fps || '--'), 8, 16);
    ctx.fillText('jogador: ' + Math.round(jogador.x) + ', ' + Math.round(jogador.y), 8, 30);
    ctx.fillText('colidindo: ' + (tocou ? 'SIM' : 'não') + (lento ? '   [câmera lenta]' : ''), 8, 44);
  }
  ctx.fillStyle = '#8f8aa8'; ctx.font = '10px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Setas: mover   G: depuração   L: câmera lenta   F12: console', 8, H - 8);

  antes = Object.assign({}, keys);
});
`},
{n:"Gravidade e pulo",t:`<p>Gravidade é só um número que muda a <b>velocidade vertical</b> a cada quadro: <code>vy += gravidade * dt</code>. Depois, <code>y += vy * dt</code> move o personagem. O pulo é dar a <code>vy</code> um valor negativo (para cima) quando ele está no chão.</p><p>Use as setas para andar e a barra de espaço para pular. O herói não sai pelas laterais nem pelo teto da tela.</p>`,
d:"Permita um pulo duplo: conte quantos pulos já foram dados antes de tocar o chão.",
c:`const CHAO = 200;
const p = { x: 60, y: 0, w: 28, h: 28, vy: 0, noChao: false };

loop((dt) => {
  if (keys.ArrowLeft  || keys.a) p.x -= 200 * dt;
  if (keys.ArrowRight || keys.d) p.x += 200 * dt;
  p.x = Math.max(0, Math.min(W - p.w, p.x));   // limites laterais do mapa

  if ((keys[' '] || keys.ArrowUp || keys.w) && p.noChao) {
    p.vy = -420;
    p.noChao = false;
  }

  p.vy += 1200 * dt;      // gravidade
  p.y  += p.vy * dt;
  if (p.y < 0) { p.y = 0; p.vy = 0; }   // teto do mapa

  if (p.y + p.h >= CHAO) { p.y = CHAO - p.h; p.vy = 0; p.noChao = true; }

  ctx.fillStyle = '#6fb7e8';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#8a5a2b';
  ctx.fillRect(0, CHAO, W, H - CHAO);
  ctx.fillStyle = '#3f8f3a';
  ctx.fillRect(0, CHAO, W, 8);
  ctx.fillStyle = '#ffd34e';
  ctx.fillRect(p.x, p.y, p.w, p.h);
});
`},
{n:"Câmera",t:`<p>Quando o mundo é maior que a tela, usamos uma <b>câmera</b>: um ponto <code>(cam.x, cam.y)</code> que diz qual pedaço do mundo aparece. Desenhamos tudo com <code>ctx.translate(-cam.x, -cam.y)</code>, e o mundo "anda" no sentido contrário.</p><p>A câmera segue o herói e é limitada às bordas do mundo (<code>MUNDO</code> tem 1200 × 720). Use as setas ou WASD.</p>`,
d:"Deixe a câmera mais suave: em vez de pular direto para o alvo, mova só 10% da distância a cada quadro.",
c:`const MUNDO = { w: 1200, h: 720 };
const p = { x: 100, y: 100, s: 24 };
const cam = { x: 0, y: 0 };

loop((dt) => {
  if (keys.ArrowLeft  || keys.a) p.x -= 220 * dt;
  if (keys.ArrowRight || keys.d) p.x += 220 * dt;
  if (keys.ArrowUp    || keys.w) p.y -= 220 * dt;
  if (keys.ArrowDown  || keys.s) p.y += 220 * dt;
  p.x = Math.max(0, Math.min(MUNDO.w - p.s, p.x));
  p.y = Math.max(0, Math.min(MUNDO.h - p.s, p.y));

  // a câmera centraliza no herói, sem sair do mundo
  cam.x = Math.max(0, Math.min(MUNDO.w - W, p.x + p.s / 2 - W / 2));
  cam.y = Math.max(0, Math.min(MUNDO.h - H, p.y + p.s / 2 - H / 2));

  ctx.fillStyle = '#3f8f3a';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  for (let x = 0; x < MUNDO.w; x += 120) {
    for (let y = 0; y < MUNDO.h; y += 120) {
      if ((x / 120 + y / 120) % 3 === 0) {
        ctx.fillStyle = '#2d6b2a';
        ctx.fillRect(x + 40, y + 40, 40, 40);   // arbustos
      }
    }
  }
  ctx.fillStyle = '#ffd34e';
  ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
  ctx.restore();

  ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
  ctx.fillText('câmera: ' + Math.round(cam.x) + ', ' + Math.round(cam.y), 10, 22);
});
`},
{n:"Ângulos e mira",t:`<p>Para mirar, precisamos do <b>ângulo</b> entre o canhão e o alvo. Com as diferenças <code>dx</code> e <code>dy</code>, a função <code>Math.atan2(dy, dx)</code> devolve esse ângulo em <b>radianos</b> (180° equivale a <code>Math.PI</code>).</p><p>Para ir do ângulo ao movimento, fazemos o caminho inverso: <code>Math.cos(angulo)</code> dá a parte horizontal da direção e <code>Math.sin(angulo)</code> dá a parte vertical. Multiplicadas por uma velocidade, elas fazem o tiro viajar exatamente na direção da mira. O triângulo branco na tela mostra esses dois lados. Para desenhar o canhão girado, usamos <code>ctx.translate</code> e <code>ctx.rotate</code>.</p><p>Mova o mouse (ou o dedo) para mirar. Clique, segure ou aperte a barra de espaço para atirar.</p>`,
d:"Faça o canhão atirar 3 tiros em leque: um no ângulo da mira, outro em angulo - 0.2 e outro em angulo + 0.2.",
c:`const canhao = { x: W / 2, y: H / 2 };
let tiros = [], espera = 0;

loop((dt) => {
  // 1) o ângulo entre o canhão e o mouse
  const dx = mouse.x - canhao.x;
  const dy = mouse.y - canhao.y;
  const angulo = Math.atan2(dy, dx);   // em radianos

  // 2) atirar: cos é a parte horizontal, sin é a parte vertical
  espera -= dt;
  if ((mouse.down || keys[' ']) && espera <= 0) {
    tiros.push({
      x: canhao.x + Math.cos(angulo) * 34,
      y: canhao.y + Math.sin(angulo) * 34,
      vx: Math.cos(angulo) * 360,
      vy: Math.sin(angulo) * 360
    });
    espera = 0.15;
  }
  tiros.forEach(t => { t.x += t.vx * dt; t.y += t.vy * dt; });
  tiros = tiros.filter(t => t.x > 0 && t.x < W && t.y > 0 && t.y < H);

  // desenho
  ctx.fillStyle = '#3f8f3a';
  ctx.fillRect(0, 0, W, H);

  // o triângulo da mira: dx na horizontal, dy na vertical
  ctx.strokeStyle = 'rgba(255,255,255,.4)';
  ctx.beginPath();
  ctx.moveTo(canhao.x, canhao.y);
  ctx.lineTo(mouse.x, canhao.y);
  ctx.lineTo(mouse.x, mouse.y);
  ctx.closePath();
  ctx.stroke();

  // o canhão gira com translate + rotate
  ctx.save();
  ctx.translate(canhao.x, canhao.y);
  ctx.rotate(angulo);
  ctx.fillStyle = '#1c130b';
  ctx.fillRect(0, -5, 34, 10);          // cano
  ctx.fillStyle = '#ffd34e';
  ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#fff';
  tiros.forEach(t => ctx.fillRect(t.x - 3, t.y - 3, 6, 6));

  ctx.strokeStyle = '#e0483e';          // mira no mouse
  ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 8, 0, Math.PI * 2); ctx.stroke();

  ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
  ctx.fillText('ângulo: ' + Math.round(angulo * 180 / Math.PI) + '°', 10, 22);
});
`},
{n:"Sprites e animação",t:`<p>Um <b>sprite</b> é uma imagem pequena de um personagem. Aqui o Mario é só uma <b>matriz</b>: cada letra é uma cor da paleta (<code>K</code> preto, <code>R</code> vermelho, <code>S</code> pele) e o ponto é transparente. Os dois quadros têm 15 × 16 pixels.</p><p>Primeiro a matriz vira uma imagem pequena (<code>criarQuadro</code>), uma única vez. Depois a imagem é desenhada ampliada com <code>drawImage</code>, com <code>imageSmoothingEnabled = false</code> para os pixels continuarem nítidos. O tamanho final é <code>15 * ESCALA</code> por <code>16 * ESCALA</code>.</p><p><b>Animação por quadros:</b> enquanto o jogador anda, um relógio (<code>tempo</code>) alterna entre os dois quadros 8 vezes por segundo. Parado, ele fica no quadro 0. Para <b>espelhar</b> o personagem ao andar para a esquerda, usamos <code>ctx.scale(-1, 1)</code>.</p><p>Use as setas ← → (ou A e D): como num jogo de plataforma, o Mario só anda para os lados e fica sempre em pé sobre o chão marrom. O <code>y</code> dele é calculado com <code>CHAO - ALT</code>, então ao mudar <code>ESCALA</code> ele continua com os pés no chão e o limite lateral se ajusta sozinho.</p>`,
d:"Faça o Mario correr com Shift: ande mais rápido e troque os quadros mais depressa (use keys.Shift).",
c:`const ESCALA = 4;    // cada pixel do sprite vira 4 × 4 na tela
const VEL = 160;     // pixels por segundo

// Paleta: cada letra é uma cor. O ponto (.) é transparente.
const cores = { K: '#000000', R: '#f83800', S: '#f0d0b0' };

// Dois quadros de 15 × 16 pixels
const matrizes = [
  [ // quadro 0
    '...............',
    '.....KKKKKK....',
    '....KRRRRRRKK..',
    '...KRRRRRRRRRK.',
    '...KKKSSKSKKK..',
    '..KSSKKSKSSSSK.',
    '..KSSKKSSKSSSK.',
    '...KKSSSKKKKK..',
    '....KKSSSSSK...',
    '...KRRKKRRK....',
    '..KRRRRKKRRK...',
    '..KRRRRKKKKK...',
    '...KSSSKKSKK...',
    '...KSSRRRKKK...',
    '....KRRRRRK....',
    '....KKKKKKK....'
  ],
  [ // quadro 1
    '.....KKKKK.....',
    '....KRRRRRKKK..',
    '...KRRRRRRRRRK.',
    '...KKKSSKSKKK..',
    '..KSSKKSKSSSSK.',
    '..KSSKKSSKSSSK.',
    '...KKSSSKKKKK..',
    '...KKKSSSSSK...',
    '.KKRRRKKRRKKK..',
    'KSSRRRRKKRRKRK.',
    'KSSSRRKKKKKKRSK',
    '.KSSKKKKSKKSKSK',
    '..KKKKKKKKKRRK.',
    '.KRRKKKKKKRRRK.',
    '.KRRRK..KRRRK..',
    '..KKK....KKK...'
  ]
];

// Transforma a matriz em uma imagem pequena (feito uma vez só)
function criarQuadro(matriz) {
  const img = document.createElement('canvas');
  img.width = matriz[0].length;
  img.height = matriz.length;
  const c = img.getContext('2d');
  matriz.forEach((linha, y) => {
    for (let x = 0; x < linha.length; x++) {
      if (linha[x] === '.') continue;      // transparente
      c.fillStyle = cores[linha[x]];
      c.fillRect(x, y, 1, 1);
    }
  });
  return img;
}
const quadros = matrizes.map(criarQuadro);

const LARG = quadros[0].width * ESCALA;    // tamanho na tela
const ALT  = quadros[0].height * ESCALA;
const CHAO = H - 20;                       // topo da plataforma marrom
const mario = { x: 200, y: CHAO - ALT, esquerda: false, tempo: 0 };   // pés sobre o chão

ctx.imageSmoothingEnabled = false;         // mantém os pixels nítidos

function desenhar(img, x, y, espelhar) {
  x = Math.round(x); y = Math.round(y);
  ctx.save();
  if (espelhar) {
    ctx.translate(x + LARG, y);            // vai até a borda direita...
    ctx.scale(-1, 1);                      // ...e inverte o eixo x
    ctx.drawImage(img, 0, 0, LARG, ALT);
  } else {
    ctx.drawImage(img, x, y, LARG, ALT);
  }
  ctx.restore();
}

loop((dt) => {
  let andando = false;
  if (keys.ArrowLeft  || keys.a) { mario.x -= VEL * dt; mario.esquerda = true;  andando = true; }
  if (keys.ArrowRight || keys.d) { mario.x += VEL * dt; mario.esquerda = false; andando = true; }

  // limite lateral da tela: se mudar a ESCALA, LARG muda junto
  mario.x = Math.max(0, Math.min(W - LARG, mario.x));

  // relógio da animação: 8 quadros por segundo enquanto anda
  mario.tempo = andando ? mario.tempo + dt : 0;
  const quadro = Math.floor(mario.tempo * 8) % 2;

  ctx.fillStyle = '#5c94fc';
  ctx.fillRect(0, 0, W, H);                // céu
  ctx.fillStyle = '#c84c0c';
  ctx.fillRect(0, CHAO, W, H - CHAO);          // chão

  desenhar(quadros[quadro], mario.x, mario.y, mario.esquerda);

  ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
  ctx.fillText('ESCALA: ' + ESCALA + '   quadro: ' + quadro, 10, 22);
});
`},
{n:"Spritesheet e estados",t:`<p>No capítulo anterior o desenho vinha de uma matriz de letras. Num jogo de verdade ele vem de um <b>arquivo de imagem</b>, e o formato mais usado é a <b>spritesheet</b> (folha de sprites): todos os quadros de uma animação lado a lado, numa imagem só. É o que editores de pixel art, como o Aseprite, exportam.</p><p><b>Recortar o quadro.</b> A função <code>drawImage</code> tem uma versão com 9 argumentos: <code>ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh)</code>. Os quatro primeiros dizem <b>que pedaço</b> da imagem copiar (origem) e os quatro últimos dizem <b>onde e em que tamanho</b> desenhar (destino). Como todos os quadros têm 32 × 48, o quadro <code>n</code> começa em <code>x = n * 32</code>. Com <code>imageSmoothingEnabled = false</code> os pixels continuam nítidos ao ampliar.</p><p><b>Uma folha por estado.</b> O personagem tem três: <b>idle</b> (parado, 5 quadros), <b>run</b> (correndo, 7) e <b>jump</b> (pulando, 3). O objeto <code>estados</code> guarda, para cada um, a imagem, o número de quadros <code>n</code> e a velocidade <code>fps</code>. A cada quadro do jogo o código decide o estado pelo que o personagem faz: no ar é <code>jump</code>, andando no chão é <code>run</code>, senão <code>idle</code>. É a mesma ideia de <b>Estados do jogo</b>, agora aplicada ao personagem.</p><p><b>Zere o relógio ao trocar de estado.</b> Sem o <code>tempo = 0</code>, a corrida começaria no meio do ciclo. O quadro vem da conta <code>Math.floor(tempo * fps) % n</code>: o <code>%</code> faz a animação voltar ao quadro 0 depois do último.</p><p><b>O pulo não usa relógio, usa a velocidade vertical.</b> Subindo rápido (<code>vy</code> bem negativa) é o quadro 0, perto do topo é o 1, caindo é o 2. Assim a animação acompanha a física: se o pulo for mais alto ou mais baixo, ela continua certa. Por isso o <code>fps</code> do pulo é 0.</p><p><b>Âncora nos pés.</b> Cada quadro tem espaço vazio em volta: o personagem ocupa uns 14 × 24 pixels dentro de um quadro de 32 × 48. Por isso o código guarda <code>PES</code>, a linha do quadro onde ficam os pés, e desenha o quadro <code>PES * ESCALA</code> pixels acima de <code>y</code>. Assim o personagem pisa no chão em qualquer folha e em qualquer <code>ESCALA</code>. Para olhar para a esquerda, o quadro é espelhado com <code>scale(-1, 1)</code>, como no capítulo anterior, e <code>OLHA_DIREITA</code> diz para que lado a folha foi desenhada.</p><p><b>De onde vêm as imagens.</b> As três folhas são arquivos PNG da pasta <code>assets/spritesheet/</code>, ao lado do HTML, e o código as carrega com <code>img.src = 'assets/spritesheet/player_run.png'</code>. No seu projeto, use o caminho onde você guardou as imagens (por exemplo, <code>'player_run.png'</code> se ficarem na mesma pasta do HTML). Para ter as três folhas, use o botão <b>Baixar assets (.zip)</b> e descompacte ao lado do HTML. Uma imagem ainda carregando não desenha nada, por isso o <code>if (!f.img.complete) return</code>.</p><p>Use ← → (ou A e D) para andar e Espaço (ou ↑, W) para pular. No canto, a folha em uso aparece em tamanho real com o quadro atual destacado em amarelo.</p>`,
d:"Faça o personagem correr com Shift: ele deve andar mais rápido e a animação de corrida deve tocar mais depressa (use keys.Shift).",
c:`// Spritesheet com estados: ← → (ou A D) andam, Espaço (ou ↑ / W) pula.
// A folha atual aparece no canto, com o quadro em uso destacado.

const ESCALA = 3;                  // cada pixel do desenho vira 3 × 3 na tela
const QL = 32, QA = 48;            // tamanho de CADA quadro da folha, em pixels
const PES = 36;                    // linha do quadro onde ficam os pés
const OLHA_DIREITA = true;         // false se o seu desenho olha para a esquerda
const MOSTRAR_FOLHA = true;        // mostra a folha e o quadro em uso

const VEL = 150, GRAV = 1400, PULO = 520;
const CHAO = H - 20;               // topo do chão

// Cada ESTADO tem a sua folha: uma imagem com os quadros lado a lado, numa linha só.
//   n = quantos quadros tem    fps = quadros por segundo (0 = não anima pelo relógio)
// As imagens são arquivos PNG da pasta assets/spritesheet/, ao lado do HTML.
// No seu projeto, use o caminho onde você guardou: src: 'player_idle.png'
const estados = {
  idle: { src: 'assets/spritesheet/player_idle.png', n: 5, fps: 6 },
  run:  { src: 'assets/spritesheet/player_run.png',  n: 7, fps: 12 },
  jump: { src: 'assets/spritesheet/player_jump.png', n: 3, fps: 0 }
};
for (const nome in estados) {
  const img = new Image();                 // cria a imagem e pede ao navegador para carregar
  img.src = estados[nome].src;
  estados[nome].img = img;
}

const p = { x: 200, y: CHAO, vy: 0, esq: false, estado: 'idle', tempo: 0 };   // y = onde ficam os PÉS

ctx.imageSmoothingEnabled = false;         // mantém os pixels nítidos ao ampliar

// Desenha o quadro número "quadro" da folha f, com os pés em (x, y)
function desenhar(f, quadro, x, y, espelhar) {
  if (!f.img.complete) return;             // imagem ainda carregando: espera
  const w = QL * ESCALA, h = QA * ESCALA;
  const dx = Math.round(x - w / 2);
  const dy = Math.round(y - PES * ESCALA); // sobe PES * ESCALA para os pés ficarem em y
  ctx.save();
  if (espelhar) {
    ctx.translate(dx + w, dy);             // vai até a borda direita...
    ctx.scale(-1, 1);                      // ...e inverte o eixo x
    ctx.drawImage(f.img, quadro * QL, 0, QL, QA, 0, 0, w, h);
  } else {
    // origem: (quadro * QL, 0) com QL × QA   |   destino: (dx, dy) com w × h
    ctx.drawImage(f.img, quadro * QL, 0, QL, QA, dx, dy, w, h);
  }
  ctx.restore();
}

loop((dt) => {
  // 1) ENTRADA e FÍSICA
  let dir = 0;
  if (keys.ArrowLeft  || keys.a) dir -= 1;
  if (keys.ArrowRight || keys.d) dir += 1;
  p.x += dir * VEL * dt;
  p.x = Math.max(20, Math.min(W - 20, p.x));
  if (dir) p.esq = dir < 0;

  if (p.y >= CHAO && (keys[' '] || keys.ArrowUp || keys.w)) p.vy = -PULO;   // só pula do chão
  p.vy += GRAV * dt;
  p.y += p.vy * dt;
  if (p.y >= CHAO) { p.y = CHAO; p.vy = 0; }

  // 2) escolhe o ESTADO (qual folha) conforme o que o personagem está fazendo
  const novo = p.y < CHAO ? 'jump' : dir ? 'run' : 'idle';
  if (novo !== p.estado) { p.estado = novo; p.tempo = 0; }   // trocou de folha: recomeça no quadro 0
  p.tempo += dt;

  // 3) escolhe o QUADRO dentro da folha
  const f = estados[p.estado];
  let quadro;
  if (p.estado === 'jump') quadro = p.vy < -120 ? 0 : p.vy > 120 ? 2 : 1;   // subindo, topo, caindo
  else quadro = Math.floor(p.tempo * f.fps) % f.n;                          // relógio: 0, 1, 2... e volta

  // 4) DESENHO
  ctx.fillStyle = '#5c94fc'; ctx.fillRect(0, 0, W, H);          // céu
  ctx.fillStyle = '#3f8f3a'; ctx.fillRect(0, CHAO, W, H - CHAO);   // chão
  ctx.fillStyle = '#78c840'; ctx.fillRect(0, CHAO, W, 4);

  if (MOSTRAR_FOLHA && f.img.complete) {                        // a folha inteira, em tamanho real
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(6, 28, f.n * QL + 8, QA + 8);
    ctx.drawImage(f.img, 10, 32);
    ctx.strokeStyle = '#ffd34e'; ctx.lineWidth = 1;
    ctx.strokeRect(10.5 + quadro * QL, 32.5, QL - 1, QA - 1);   // o quadro em uso
  }

  const alt = CHAO - p.y;                                       // sombra: encolhe com a altura
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(p.x, CHAO + 3, Math.max(4, 16 - alt / 8), 4, 0, 0, Math.PI * 2); ctx.fill();

  desenhar(f, quadro, p.x, p.y, OLHA_DIREITA ? p.esq : !p.esq);

  ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
  ctx.fillText('estado: ' + p.estado + '   quadro: ' + quadro + ' de ' + f.n, 10, 20);
});
`},
{n:"Física simples",t:`<p>Na maioria dos jogos, a física é matemática simples aplicada à <b>velocidade</b>. A bola tem uma velocidade com duas partes, <code>vx</code> e <code>vy</code> (um vetor, a linha amarela na tela), e a cada quadro fazemos <code>x += vx * dt</code> e <code>y += vy * dt</code>.</p><p><b>Ricochete:</b> bater numa parede vertical inverte o <code>vx</code>, e bater numa parede horizontal inverte o <code>vy</code>. <b>Quicar:</b> multiplicar a velocidade por <code>ELASTICIDADE</code> a cada batida. Com 1 o ricochete é perfeito, e com 0.8 a bola perde 20% da velocidade a cada pancada, como uma bola de basquete.</p><p><b>Atrito:</b> a raquete acelera quando você aperta a tecla e é freada por <code>vx *= Math.exp(-ATRITO * dt)</code>. Quanto maior o <code>ATRITO</code>, mais rápido ela para. Sem atrito, ela deslizaria para sempre. Na raquete, o ângulo da rebatida depende de onde a bola bate, usando <code>sin</code> e <code>cos</code> do capítulo de ângulos. Nos tijolos, o ponto da bola mais próximo do retângulo diz se a batida foi de lado (inverte <code>vx</code>) ou por cima ou por baixo (inverte <code>vy</code>).</p><p>Use ← → ou A e D (ou arraste na tela) para mover a raquete. Espaço ou um toque lança a bola.</p>`,
d:"Mude ELASTICIDADE para 0.95 e veja a bola perder velocidade a cada ricochete. Depois tente somar gravidade: vy += 300 * dt a cada quadro.",
c:`const ELASTICIDADE = 1;   // 1 = ricochete perfeito; 0.9 = perde 10% da velocidade a cada batida
const ATRITO = 8;         // quanto maior, mais rápido a raquete para
const ACEL = 2400;        // aceleração da raquete (pixels por segundo²)
const RAIO = 6;
const MOSTRAR_VELOCIDADE = true;   // desenha o vetor velocidade da bola

const cores = ['#e0483e', '#ffd34e', '#78c840', '#4aa3e0'];
const raq  = { x: 205, y: H - 20, w: 70, h: 10, vx: 0 };
const bola = { x: 0, y: 0, vx: 0, vy: 0 };
let tijolos, vidas, pontos, lancada, fim, antes = {}, antesClique = false;

const limite = (v, min, max) => Math.max(min, Math.min(max, v));

function novoJogo() {
  tijolos = [];
  for (let l = 0; l < 4; l++)
    for (let c = 0; c < 10; c++)
      tijolos.push({ x: 12 + c * 46, y: 40 + l * 20, w: 42, h: 14, cor: cores[l] });
  vidas = 3; pontos = 0; lancada = false; fim = '';
}
novoJogo();

function lancar() {
  const ang = (Math.random() - 0.5) * 0.7;   // ângulo em relação à vertical
  bola.vx =  Math.sin(ang) * 240;
  bola.vy = -Math.cos(ang) * 240;
  lancada = true;
}

function texto(msg, y, tam) {
  ctx.font = tam + 'px monospace'; ctx.textAlign = 'center';
  ctx.fillText(msg, W / 2, y);
}

loop((dt) => {
  const clicou = mouse.down && !antesClique;
  const espaco = keys[' '] && !antes[' '];

  if (fim) {
    if (espaco || clicou) novoJogo();
  } else {
    // raquete: a tecla acelera e o atrito vai freando
    if (keys.ArrowLeft  || keys.a) raq.vx -= ACEL * dt;
    if (keys.ArrowRight || keys.d) raq.vx += ACEL * dt;
    raq.vx *= Math.exp(-ATRITO * dt);
    raq.x  += raq.vx * dt;
    if (mouse.down) { raq.x = mouse.x - raq.w / 2; raq.vx = 0; }   // arrastar com mouse ou dedo
    if (raq.x < 0 || raq.x + raq.w > W) { raq.x = limite(raq.x, 0, W - raq.w); raq.vx = 0; }

    if (!lancada) {
      bola.x = raq.x + raq.w / 2;      // a bola fica presa na raquete
      bola.y = raq.y - RAIO;
      if (espaco || clicou) lancar();
    } else {
      bola.x += bola.vx * dt;
      bola.y += bola.vy * dt;

      // ricochete nas paredes: inverte a velocidade do eixo e perde um pouco de energia
      if (bola.x < RAIO)     { bola.x = RAIO;     bola.vx =  Math.abs(bola.vx) * ELASTICIDADE; }
      if (bola.x > W - RAIO) { bola.x = W - RAIO; bola.vx = -Math.abs(bola.vx) * ELASTICIDADE; }
      if (bola.y < RAIO)     { bola.y = RAIO;     bola.vy =  Math.abs(bola.vy) * ELASTICIDADE; }

      // raquete: o ângulo depende de onde a bola bate (meio = reto, pontas = inclinado)
      if (bola.vy > 0 && bola.y + RAIO >= raq.y && bola.y - RAIO <= raq.y + raq.h &&
          bola.x >= raq.x - RAIO && bola.x <= raq.x + raq.w + RAIO) {
        const rel = limite((bola.x - (raq.x + raq.w / 2)) / (raq.w / 2), -1, 1);
        const ang = rel * 1.05;                        // até uns 60 graus
        const vel = Math.hypot(bola.vx, bola.vy);
        bola.vx =  Math.sin(ang) * vel;
        bola.vy = -Math.cos(ang) * vel;
        bola.y = raq.y - RAIO;
      }

      // tijolos: ponto do retângulo mais próximo do centro da bola
      for (const t of tijolos) {
        if (t.morto) continue;
        const px = limite(bola.x, t.x, t.x + t.w);
        const py = limite(bola.y, t.y, t.y + t.h);
        const dx = bola.x - px, dy = bola.y - py;
        if (dx * dx + dy * dy < RAIO * RAIO) {
          t.morto = true; pontos += 10;
          if (Math.abs(dx) > Math.abs(dy)) bola.vx = -bola.vx;   // bateu de lado
          else bola.vy = -bola.vy;                               // bateu em cima ou embaixo
          const vel = Math.hypot(bola.vx, bola.vy) || 1;
          const nova = Math.min(vel * 1.02, 420);                // acelera 2% por tijolo
          bola.vx *= nova / vel; bola.vy *= nova / vel;
          break;
        }
      }
      if (tijolos.every(t => t.morto)) fim = 'Você venceu!';

      if (bola.y > H + RAIO) {              // caiu
        vidas--; lancada = false; raq.vx = 0;
        if (vidas <= 0) fim = 'Fim de jogo';
      }
    }
  }

  // ---------- desenho ----------
  ctx.fillStyle = '#1a1424'; ctx.fillRect(0, 0, W, H);
  tijolos.forEach(t => {
    if (t.morto) return;
    ctx.fillStyle = t.cor; ctx.fillRect(t.x, t.y, t.w, t.h);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(t.x, t.y, t.w, 3);
  });
  ctx.fillStyle = '#f4e8c1'; ctx.fillRect(raq.x, raq.y, raq.w, raq.h);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(bola.x, bola.y, RAIO, 0, Math.PI * 2); ctx.fill();
  if (MOSTRAR_VELOCIDADE && lancada) {
    ctx.strokeStyle = 'rgba(255, 211, 78, 0.9)';
    ctx.beginPath(); ctx.moveTo(bola.x, bola.y);
    ctx.lineTo(bola.x + bola.vx * 0.12, bola.y + bola.vy * 0.12); ctx.stroke();
  }

  ctx.fillStyle = '#fff'; ctx.font = '14px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Vidas: ' + vidas + '   Pontos: ' + pontos, 10, 22);
  if (!lancada && !fim) { ctx.fillStyle = '#ffd34e'; texto('Espaço ou toque para lançar', 150, 14); }
  if (fim) {
    ctx.fillStyle = 'rgba(20, 12, 5, 0.7)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd34e'; texto(fim, 110, 28);
    ctx.fillStyle = '#fff';    texto('Espaço para jogar de novo', 150, 14);
  }
  ctx.textAlign = 'left';

  antes = Object.assign({}, keys);
  antesClique = mouse.down;
});
`},
{n:"Colisão avançada",t:`<p>A colisão AABB resolve retângulos. Quando um dos objetos é redondo, ou quando você quer que as coisas <b>não se atravessem</b> (e até que uma empurre a outra), precisamos de duas ideias novas.</p><p><b>Círculo contra retângulo:</b> ache o ponto do retângulo mais perto do centro do círculo, limitando o x e o y do centro às bordas do retângulo com <code>limitar</code>. Se a distância até esse ponto for menor que o raio, houve batida. A função <code>circuloRetangulo</code> devolve também a direção da batida (<code>nx</code>, <code>ny</code>) e a profundidade (<code>fundo</code>). Quando o centro do círculo está dentro do retângulo não existe ponto "mais perto" fora, e aí o código escolhe o lado mais próximo para sair.</p><p>Detectar não basta: é preciso <b>tirar o objeto de dentro</b>. A regra é empurrar pelo <b>menor deslocamento</b> que desfaz a sobreposição. Para dois retângulos, <code>menorDeslocamento</code> mede quanto um invade o outro nos quatro lados e escolhe o menor. Para o círculo, o empurrão vai ao longo de (<code>nx</code>, <code>ny</code>) por <code>fundo</code> pixels, e é isso que faz o jogador deslizar pela parede em vez de grudar nela.</p><p>O <b>caixote</b> junta tudo, em quatro passos por quadro. (1) O jogador anda e é tirado de dentro das paredes. (2) Se tocou o caixote, o caixote anda o mesmo tanto no sentido oposto: é isso que dá a sensação de empurrar. (3) As paredes seguram o caixote pelo menor deslocamento. (4) Se o caixote foi barrado, ele pode ter ficado dentro do jogador, então o jogador recua. Sem o passo 4, empurrar a caixa contra a parede faria o jogador atravessá-la.</p><p>Setas ou WASD andam. Empurre o caixote contra uma parede e veja o jogador parar.</p>`,
d:"Crie um segundo caixote. Ele precisa ser empurrado pelo jogador e também barrado pelas paredes e pelo outro caixote. Use <code>menorDeslocamento</code> entre os dois.",
c:`// Empurre o caixote. Ele não atravessa as paredes, e o jogador também não.
const paredes = [
  { x: 120, y: 60,  w: 20, h: 120 },
  { x: 250, y: 20,  w: 90, h: 20 },
  { x: 300, y: 150, w: 20, h: 70 },
  { x: 390, y: 90,  w: 70, h: 20 }
];
const jogador = { x: 50, y: 120, r: 10 };               // círculo: x e y são o centro
const caixote = { x: 190, y: 110, w: 26, h: 26 };       // retângulo: x e y são o canto

const limitar = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- círculo contra retângulo ----------
// se tocou, devolve a direção da batida (nx, ny) e a profundidade (fundo); senão, null
function circuloRetangulo(c, r) {
  const px = limitar(c.x, r.x, r.x + r.w), py = limitar(c.y, r.y, r.y + r.h);   // ponto do retângulo mais perto do centro
  const dx = c.x - px, dy = c.y - py, d = Math.hypot(dx, dy);
  if (d >= c.r) return null;                                                   // mais longe que o raio: não tocou
  if (d > 0) return { nx: dx / d, ny: dy / d, fundo: c.r - d };                // empurra para longe daquele ponto
  const e = c.x - r.x, di = r.x + r.w - c.x, t = c.y - r.y, b = r.y + r.h - c.y;   // centro DENTRO do retângulo:
  const m = Math.min(e, di, t, b);                                                  // sai pelo lado mais perto
  if (m === e)  return { nx: -1, ny: 0, fundo: c.r + e };
  if (m === di) return { nx: 1,  ny: 0, fundo: c.r + di };
  if (m === t)  return { nx: 0, ny: -1, fundo: c.r + t };
  return { nx: 0, ny: 1, fundo: c.r + b };
}

// ---------- retângulo contra retângulo: menor deslocamento ----------
// devolve quanto mover o retângulo a para fora de b, pelo caminho mais curto
function menorDeslocamento(a, b) {
  const esq = a.x + a.w - b.x, dir = b.x + b.w - a.x;     // quanto a invade b em cada direção
  const cima = a.y + a.h - b.y, baixo = b.y + b.h - a.y;
  if (esq <= 0 || dir <= 0 || cima <= 0 || baixo <= 0) return null;   // não se tocam
  const m = Math.min(esq, dir, cima, baixo);
  if (m === esq)  return { x: -esq, y: 0 };
  if (m === dir)  return { x: dir,  y: 0 };
  if (m === cima) return { x: 0, y: -cima };
  return { x: 0, y: baixo };
}

loop((dt) => {
  // 1) o jogador anda e é empurrado para fora das paredes
  let dx = 0, dy = 0;
  if (keys.ArrowLeft  || keys.a) dx -= 1;
  if (keys.ArrowRight || keys.d) dx += 1;
  if (keys.ArrowUp    || keys.w) dy -= 1;
  if (keys.ArrowDown  || keys.s) dy += 1;
  jogador.x = limitar(jogador.x + dx * 140 * dt, jogador.r, W - jogador.r);
  jogador.y = limitar(jogador.y + dy * 140 * dt, jogador.r, H - jogador.r);
  paredes.forEach(p => {
    const h = circuloRetangulo(jogador, p);
    if (h) { jogador.x += h.nx * h.fundo; jogador.y += h.ny * h.fundo; }
  });

  // 2) o jogador empurra o caixote: ele anda o MESMO tanto, mas no sentido oposto
  const hc = circuloRetangulo(jogador, caixote);
  if (hc) { caixote.x -= hc.nx * hc.fundo; caixote.y -= hc.ny * hc.fundo; }

  // 3) as paredes seguram o caixote (menor deslocamento)
  caixote.x = limitar(caixote.x, 0, W - caixote.w);
  caixote.y = limitar(caixote.y, 0, H - caixote.h);
  paredes.forEach(p => {
    const m = menorDeslocamento(caixote, p);
    if (m) { caixote.x += m.x; caixote.y += m.y; }
  });

  // 4) se o caixote foi barrado, ele ainda pode estar dentro do jogador: o jogador recua
  const hj = circuloRetangulo(jogador, caixote);
  if (hj) { jogador.x += hj.nx * hj.fundo; jogador.y += hj.ny * hj.fundo; }

  // ---------- desenho ----------
  ctx.fillStyle = '#241d33'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#5d6396';
  paredes.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
  ctx.fillStyle = '#a0683a'; ctx.fillRect(caixote.x, caixote.y, caixote.w, caixote.h);
  ctx.strokeStyle = '#6b3a10'; ctx.lineWidth = 2;
  ctx.strokeRect(caixote.x + 1, caixote.y + 1, caixote.w - 2, caixote.h - 2);
  ctx.fillStyle = '#ffd34e';
  ctx.beginPath(); ctx.arc(jogador.x, jogador.y, jogador.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1c130b'; ctx.fillRect(jogador.x + 2, jogador.y - 3, 4, 4);

  ctx.fillStyle = '#8f8aa8'; ctx.font = '11px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Setas: andar e empurrar o caixote contra as paredes', 8, H - 8);
});
`},
{n:"Inteligência dos inimigos",t:`<p>Inimigos parecem inteligentes quando seguem regras simples. A forma clássica é uma <b>máquina de estados</b>, como no capítulo de estados do jogo (mais adiante no guia), mas agora para cada inimigo: <b>patrulhar</b> (anda pelos corredores), <b>perseguir</b> (viu o jogador e vai atrás) e <b>fugir</b> (ferido, corre para o refúgio mais distante). A cor e o texto sobre cada inimigo mostram o estado atual.</p><p>As transições dependem do que o inimigo <i>percebe</i>. Ele só vê o jogador dentro do raio <code>visao</code> e se não houver parede no caminho: a função <code>veJogador</code> anda em linha reta, de 6 em 6 pixels, testando os tiles. Enquanto vê, a <code>memoria</code> fica em 3 segundos. Sem ver, ela cai, e quando chega a zero ele desiste. Ser atingido por uma magia também avisa o inimigo, e com 1 de vida ele passa a fugir.</p><p>Para chegar ao alvo contornando as paredes, usamos o <b>A*</b>. Ele explora o mapa a partir do inimigo, escolhendo sempre o tile de menor <code>f = g + h</code>: <code>g</code> é o custo já percorrido e <code>h</code> é a estimativa até o alvo (distância Manhattan). O resultado é a lista de tiles do caminho, desenhada como uma linha vermelha na perseguição e azul na fuga. Cada vez que o inimigo chega ao centro de um tile, ele pensa de novo e recalcula a rota. Com <code>MOSTRAR_BUSCA = true</code>, você vê também os tiles que o A* explorou.</p><p>O jogador é uma caixa de 18 × 18 e a função <code>livre</code> confere todos os tiles que ela cobre. O movimento é feito um eixo por vez: se o passo bater numa parede, o código não deixa o jogador parado a alguns pixels dela, e sim o encosta exatamente na face do tile.</p><p>Setas ou WASD andam, e Espaço lança uma magia na direção em que você está virado. Derrote os 3 inimigos.</p>`,
d:"Ligue MOSTRAR_BUSCA e troque a heurística h por 0 (isso transforma o A* no algoritmo de Dijkstra). Compare quantos tiles são explorados.",
c:`const T = 30, COLS = 16, LINS = 8;
// # = parede   . = chão
const mapa = [
  '################',
  '#......#.......#',
  '#.####.#.#####.#',
  '#.#....#.....#.#',
  '#.#.######.#.#.#',
  '#.#........#...#',
  '#.....####.....#',
  '################'
];
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const REFUGIOS = [{ c: 1, l: 1 }, { c: 14, l: 1 }, { c: 14, l: 6 }, { c: 1, l: 6 }, { c: 8, l: 1 }];
const MOSTRAR_ROTA = true;     // desenha o caminho calculado pelo A*
const MOSTRAR_BUSCA = false;   // mostra também os tiles que o A* explorou

const parede = (c, l) => l < 0 || l >= LINS || c < 0 || c >= COLS || mapa[l][c] === '#';
const centro = (c, l) => ({ x: c * T + T / 2, y: l * T + T / 2 });
const tileDe = (o) => ({ c: Math.floor(o.x / T), l: Math.floor(o.y / T) });
const dist = (a, b) => Math.abs(a.c - b.c) + Math.abs(a.l - b.l);

// ---------- A* ----------
function aestrela(ini, alvo) {
  const chave = (c, l) => l * COLS + c;
  const h = (c, l) => Math.abs(c - alvo.c) + Math.abs(l - alvo.l);   // estimativa até o alvo
  const abertos = [{ c: ini.c, l: ini.l, g: 0, f: h(ini.c, ini.l), pai: null }];
  const melhorG = {};
  melhorG[chave(ini.c, ini.l)] = 0;
  const visitados = new Set();
  while (abertos.length) {
    // pega o nó de menor f (custo percorrido + estimativa)
    let i = 0;
    for (let k = 1; k < abertos.length; k++) if (abertos[k].f < abertos[i].f) i = k;
    const no = abertos.splice(i, 1)[0];
    const kn = chave(no.c, no.l);
    if (visitados.has(kn)) continue;
    visitados.add(kn);
    if (no.c === alvo.c && no.l === alvo.l) {         // chegou: volta pelos "pais" montando o caminho
      const caminho = [];
      for (let n = no; n; n = n.pai) caminho.unshift({ c: n.c, l: n.l });
      return { caminho, visitados };
    }
    for (const [dc, dl] of DIRS) {
      const c = no.c + dc, l = no.l + dl;
      if (parede(c, l)) continue;
      const g = no.g + 1, k = chave(c, l);
      if (melhorG[k] === undefined || g < melhorG[k]) {   // achou um caminho melhor até este tile
        melhorG[k] = g;
        abertos.push({ c, l, g, f: g + h(c, l), pai: no });
      }
    }
  }
  return { caminho: [], visitados };
}

// ---------- jogo ----------
let jogador, inimigos, magias, vidas, invul, espera, fim, antes = {};

function novoJogo() {
  jogador = Object.assign(centro(1, 6), { dx: 1, dy: 0 });
  const cria = (c, l, vel, visao) => Object.assign(centro(c, l), {
    vel, visao, vida: 3, estado: 'patrulhar', alvo: null, rota: [], visitados: null,
    memoria: 0, dx: 1, dy: 0, flash: 0 });
  inimigos = [cria(13, 1, 65, 130), cria(8, 5, 75, 120), cria(5, 3, 55, 140)];
  magias = []; vidas = 3; invul = 0; espera = 0; fim = '';
}
novoJogo();

const M = 9;   // metade do jogador (a caixa é de 18 × 18)

// a caixa do jogador, centrada em (x, y), cabe aqui? Confere todos os tiles que ela cobre.
// Só encostar na borda de um tile não conta como batida (por isso o ceil(...) - 1).
function livre(x, y) {
  const c0 = Math.floor((x - M) / T), c1 = Math.ceil((x + M) / T) - 1;
  const l0 = Math.floor((y - M) / T), l1 = Math.ceil((y + M) / T) - 1;
  for (let l = l0; l <= l1; l++)
    for (let c = c0; c <= c1; c++) if (parede(c, l)) return false;
  return true;
}

// o inimigo "enxerga" se o jogador está perto e sem parede no meio
function veJogador(e) {
  const dx = jogador.x - e.x, dy = jogador.y - e.y, d = Math.hypot(dx, dy);
  if (d > e.visao) return false;
  for (let s = 0; s < d; s += 6) {
    if (parede(Math.floor((e.x + dx * s / d) / T), Math.floor((e.y + dy * s / d) / T))) return false;
  }
  return true;
}

// chamado quando o inimigo chega ao centro de um tile: escolhe o próximo passo
function pensar(e) {
  const meu = tileDe(e), eu = tileDe(jogador);

  // 1) transições de estado
  if (e.estado !== 'fugir' && e.vida <= 1 && e.memoria > 0) e.estado = 'fugir';
  else if (e.estado === 'fugir' && e.memoria <= 0) e.estado = 'patrulhar';
  else if (e.estado === 'patrulhar' && e.memoria > 0) e.estado = 'perseguir';
  else if (e.estado === 'perseguir' && e.memoria <= 0) e.estado = 'patrulhar';

  // 2) cada estado decide a rota de um jeito
  e.rota = [];
  if (e.estado === 'perseguir') {
    const r = aestrela(meu, eu);                      // caminho até o jogador
    e.rota = r.caminho; e.visitados = r.visitados;
  } else if (e.estado === 'fugir') {
    const longe = REFUGIOS.filter(t => t.c !== meu.c || t.l !== meu.l)
      .sort((a, b) => dist(b, eu) - dist(a, eu))[0];  // refúgio mais distante do jogador
    const r = aestrela(meu, longe);
    e.rota = r.caminho; e.visitados = r.visitados;
  } else {
    // patrulhar: segue reto se der, senão sorteia uma saída
    const livres = DIRS.filter(([dc, dl]) => !parede(meu.c + dc, meu.l + dl));
    const reto = livres.find(([dc, dl]) => dc === e.dx && dl === e.dy);
    const [dc, dl] = (reto && Math.random() < 0.8) ? reto : livres[Math.floor(Math.random() * livres.length)];
    e.rota = [meu, { c: meu.c + dc, l: meu.l + dl }];
  }

  // 3) dá o primeiro passo da rota
  if (e.rota.length > 1) {
    const p = e.rota[1];
    e.dx = p.c - meu.c; e.dy = p.l - meu.l;
    e.alvo = centro(p.c, p.l);
  }
}

function atualizarInimigo(e, dt) {
  e.memoria -= dt; e.flash -= dt;
  if (veJogador(e)) e.memoria = 3;
  if (!e.alvo) pensar(e);
  if (e.alvo) {
    const vel = e.vel * (e.estado === 'perseguir' ? 1.3 : 1);
    const dx = e.alvo.x - e.x, dy = e.alvo.y - e.y, d = Math.hypot(dx, dy), passo = vel * dt;
    if (d <= passo) { e.x = e.alvo.x; e.y = e.alvo.y; e.alvo = null; }
    else { e.x += dx / d * passo; e.y += dy / d * passo; }
  }
}

function texto(msg, y, tam) {
  ctx.font = tam + 'px monospace'; ctx.textAlign = 'center';
  ctx.fillText(msg, W / 2, y);
}

loop((dt) => {
  const apertou = keys['Enter'] && !antes['Enter'];

  if (fim) {
    if (apertou) novoJogo();
  } else {
    // jogador: anda e vira para a última direção apertada
    let dx = 0, dy = 0;
    if (keys.ArrowLeft  || keys.a) dx -= 1;
    if (keys.ArrowRight || keys.d) dx += 1;
    if (keys.ArrowUp    || keys.w) dy -= 1;
    if (keys.ArrowDown  || keys.s) dy += 1;
    if (dx) { jogador.dx = dx; jogador.dy = 0; } else if (dy) { jogador.dx = 0; jogador.dy = dy; }
    // anda um eixo por vez. Se bater, encosta na parede certinho
    if (dx) {
      jogador.x += dx * 130 * dt;
      if (!livre(jogador.x, jogador.y))
        jogador.x = dx > 0 ? Math.floor((jogador.x + M) / T) * T - M          // encosta na face esquerda do tile
                           : (Math.floor((jogador.x - M) / T) + 1) * T + M;   // encosta na face direita do tile
    }
    if (dy) {
      jogador.y += dy * 130 * dt;
      if (!livre(jogador.x, jogador.y))
        jogador.y = dy > 0 ? Math.floor((jogador.y + M) / T) * T - M          // encosta na face de cima do tile
                           : (Math.floor((jogador.y - M) / T) + 1) * T + M;   // encosta na face de baixo do tile
    }

    // magia: sai na direção em que o jogador está virado
    espera -= dt; invul -= dt;
    if (keys[' '] && espera <= 0) {
      magias.push({ x: jogador.x + jogador.dx * 14, y: jogador.y + jogador.dy * 14, dx: jogador.dx, dy: jogador.dy });
      espera = 0.35;
    }
    magias.forEach(m => {
      m.x += m.dx * 320 * dt; m.y += m.dy * 320 * dt;
      if (parede(Math.floor(m.x / T), Math.floor(m.y / T))) m.morta = true;
      inimigos.forEach(e => {
        if (!m.morta && Math.hypot(e.x - m.x, e.y - m.y) < 14) {
          m.morta = true; e.vida--; e.flash = 0.15; e.memoria = 3;   // ser atingido avisa o inimigo
        }
      });
    });
    magias = magias.filter(m => !m.morta);
