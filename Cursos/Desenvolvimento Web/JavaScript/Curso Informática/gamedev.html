 "Câmera": "Um mundo de 1200 × 720 pixels, maior que a tela de 480 × 240, com chão quadriculado e alguns objetos (árvores ou pedras) espalhados para dar para perceber o movimento. O herói anda com setas ou WASD e a câmera (cam.x, cam.y) o segue, centralizada nele mas sem passar das bordas do mundo. Desenhe o mundo com ctx.translate(-cam.x, -cam.y) e desenhe o texto de interface (como as coordenadas) fora dessa translação. Marque as bordas do mundo.",
 "Ângulos e mira": "Um canhão no centro da tela que gira para apontar para o mouse (ou o dedo), usando Math.atan2(dy, dx) e desenhado girado com ctx.translate e ctx.rotate. Clicar, segurar ou apertar a barra de espaço dispara tiros (com um pequeno intervalo entre eles) que viajam na direção da mira, usando Math.cos(angulo) e Math.sin(angulo) vezes a velocidade, e somem ao sair da tela. Desenhe um triângulo branco com os lados dx e dy entre o canhão e o ponteiro, para mostrar a conta na tela.",
 "Sprites e animação": "Um personagem estilo Mario criado a partir de matrizes de texto: cada letra é uma cor de uma paleta (K preto, R vermelho, S pele e assim por diante) e o ponto é transparente. São dois quadros de 15 × 16 pixels. Converta cada matriz uma única vez numa imagem pequena (um canvas fora da tela, função criarQuadro) e desenhe ampliada por ESCALA com drawImage e imageSmoothingEnabled = false, para os pixels ficarem nítidos. O personagem anda com ← → (ou A e D); enquanto anda, um relógio alterna os dois quadros 8 vezes por segundo; parado, fica no quadro 0; ao ir para a esquerda, espelhe com ctx.scale(-1, 1). Coloque um chão simples embaixo.",
 "Spritesheet e estados": "Este exemplo usa três spritesheets PNG que já existem na pasta assets/spritesheet/, ao lado do HTML: player_idle.png (5 quadros), player_run.png (7 quadros) e player_jump.png (3 quadros). Em cada folha os quadros ficam lado a lado, numa linha só, e cada quadro tem 32 × 48 pixels (constantes QL e QA). Há espaço vazio em volta do personagem: os pés ficam na linha 36 do quadro (PES). Mantenha esses caminhos exatamente assim.\n\nO personagem anda com ← → (ou A e D) e pula com a barra de espaço. VEL = 150, GRAV = 1400, PULO = 520, ESCALA = 3 e o chão começa 20 px acima do fundo da tela. Os estados são: jump no ar, run andando no chão e idle parado. Uma tabela estados guarda, para cada um, o src, o n (número de quadros) e o fps (idle 6, run 12, jump 0). Recorte o quadro com a versão de 9 argumentos do drawImage (ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh)) e imageSmoothingEnabled = false. O quadro vem de Math.floor(tempo * fps) % n, e o tempo volta a zero ao trocar de estado. O pulo não usa relógio, e sim a velocidade vertical: quadro 0 subindo rápido, quadro 1 perto do topo, quadro 2 caindo.\n\nAncore o desenho nos pés (desenhe o quadro PES * ESCALA pixels acima de y), espelhe com scale(-1, 1) ao olhar para a esquerda (a constante OLHA_DIREITA diz para que lado a folha foi desenhada) e só desenhe imagens com img.complete. Com MOSTRAR_FOLHA = true, mostre a folha e o quadro em uso.",
 "Física simples": "Um mini jogo de bola e raquete. A bola tem velocidade vx e vy (mostre o vetor como uma linha amarela) e anda com x += vx * dt e y += vy * dt. Ricochete: bater numa parede vertical inverte vx, bater numa horizontal inverte vy, e cada batida multiplica a velocidade por ELASTICIDADE (comece com 1). A raquete, controlada por ← → ou A e D (ou arrastando na tela), acelera enquanto a tecla está apertada e é freada por atrito: vx *= Math.exp(-ATRITO * dt). O ângulo da rebatida depende do ponto da raquete em que a bola bate. Espaço ou um toque lança a bola. Deixe ELASTICIDADE e ATRITO como constantes no topo.",
 "Colisão avançada": "Uma sala com paredes retangulares, um jogador redondo (círculo) e um caixote que o jogador pode empurrar. Setas ou WASD movem o jogador. Escreva circuloRetangulo(círculo, retângulo), que acha o ponto do retângulo mais perto do centro do círculo (limitando x e y às bordas) e devolve se houve batida, a direção da batida (nx, ny) e a profundidade (fundo); trate o caso do centro dentro do retângulo escolhendo o lado mais próximo para sair. Resolva a colisão empurrando o objeto para fora ao longo de (nx, ny) por fundo pixels, para o jogador deslizar pela parede em vez de grudar nela. Para dois retângulos, escreva menorDeslocamento. Em cada quadro, faça quatro passos: (1) o jogador anda e é tirado de dentro das paredes; (2) se tocou o caixote, o caixote anda o mesmo tanto no sentido oposto; (3) as paredes seguram o caixote pelo menor deslocamento; (4) se o caixote foi barrado e ficou dentro do jogador, o jogador recua.",
 "Inteligência dos inimigos": "Uma masmorra em grade de tiles (mapa como lista de textos, # parede e . chão) com corredores e três inimigos. O jogador é uma caixa de 18 × 18 que anda com setas ou WASD (um eixo por vez, encostando exatamente na face do tile ao bater) e lança uma magia com Espaço, na direção em que está virado. Vença derrotando os 3 inimigos.\n\nCada inimigo é uma máquina de estados: patrulhar (anda pelos corredores), perseguir (viu o jogador) e fugir (foi atingido pela magia e corre para o refúgio mais distante, de uma lista REFUGIOS). A cor e um texto sobre cada inimigo mostram o estado atual. Ele só vê o jogador dentro do raio visao e sem parede no caminho (função veJogador, que anda em linha reta de 6 em 6 pixels testando os tiles). Enquanto vê, a memória fica em 3 segundos; sem ver, ela cai até ele desistir.\n\nPara perseguir e fugir, use o algoritmo A* na grade (g = custo já percorrido, h = distância Manhattan até o alvo), recalculado sempre que o inimigo chega ao centro de um tile. Desenhe a rota como uma linha vermelha na perseguição e azul na fuga (MOSTRAR_ROTA). Com MOSTRAR_BUSCA = true, mostre também os tiles que o A* explorou.",
 "Aleatoriedade e mapas": "Um gerador de masmorras com semente. O mapa começa todo de parede (#): sorteie salas (tamanho e posição), descarte as que encostam em outras e ligue cada sala nova à anterior por um corredor em L, do centro de uma ao centro da outra. O herói nasce na primeira sala, a escada vai para a sala mais distante e as rupias caem em lugares sorteados. A cada fase, o número máximo de salas cresce.\n\nUse Math.random() só dentro de duas funções, inteiro(min, max) e sortear(lista), e depois troque-o por um gerador com semente (mulberry32), para que a mesma semente produza sempre a mesma masmorra. A tecla R refaz a fase com a mesma semente (o mapa sai idêntico), N sorteia uma semente nova, e a constante SEMENTE_FIXA (null por padrão) fixa a fase 1. A cada fase, sorteie um tema de cores da lista TEMAS.\n\nO herói é um quadrado amarelo de 10 × 10 com 2 pixels de contorno (a caixa de colisão é de 14 × 14, contorno incluso). Ele anda com setas ou WASD, um eixo por vez, encostando exatamente na face do tile ao bater, sem folga. Pegue as rupias e chegue à escada para ir à próxima fase. A tecla G mostra as salas numeradas.",
 "Plataforma com tilemap": "Um jogo de plataforma em tilemap. O mapa tem 20 × 10 tiles de 24 pixels (T = 24, cobrindo a tela inteira), escrito como lista de textos em que # é um bloco sólido, com plataformas em alturas diferentes. Converta pixel em tile com Math.floor(x / T) e teste só os tiles sob a caixa do jogador.\n\nColisão por eixo: mova e resolva em X (encostando na face do bloco e zerando vx) e depois mova e resolva em Y (ao cair, pousa e marca noChao; subindo, a cabeça bate no teto e vy vira zero). Limite a velocidade de queda a 480 px/s para nunca atravessar o chão. Dois truques de pulo: coyote time de 0,1 s (COYOTE), que deixa pular logo depois de sair da borda, e pulo variável (soltar o botão enquanto ainda sobe aumenta a gravidade e corta o pulo; segurando, ele chega a cerca de 3,5 tiles). Mostre o valor do coyote na tela. Desenhe os blocos com uma função px que arredonda as bordas para pixels reais, para não aparecerem fios entre blocos vizinhos.\n\nSetas ou WASD andam e ↑, W ou Espaço pulam. VEL = 140, GRAV = 1500, PULO = 520.",
 "Mapas do Tiled": "Um jogo de plataforma que lê o mapa de um arquivo do editor Tiled. Este exemplo usa os arquivos que já existem na pasta assets/tiled/, ao lado do HTML (mantenha os caminhos): map.tmx (mapa de 40 × 15 tiles de 16 pixels, com o tileset embutido e as camadas em formato CSV: Background, Objects, Platforms e uma camada de objetos com um retângulo PlayerStart que marca onde o jogador começa), player_idle.png (5 quadros, 6 fps), player_walk.png (8 quadros, 10 fps) e player_jump.png (4 quadros, 8 fps), com quadros de 32 × 32 e os pés na linha 23 (QUADRO e PES). Como a página usa fetch, ela precisa ser aberta por um servidor local (por exemplo, python -m http.server).\n\nEscreva lerTMX(texto), usando DOMParser e querySelectorAll, e lerJSON(texto). As duas devolvem o mesmo formato: { cols, lins, T, tilesets: [{primeiro, colunas, imagem}], camadas: [{nome, dados}], grupos: [{nome, objetos}] }. Uma constante MAPA escolhe entre .tmx e .json. Carregue tudo numa função async carregar(), com await: o mapa, a imagem do tileset (o endereço vem de new URL(imagem, base), porque o caminho vale a partir da pasta do mapa) e as folhas do jogador. Só então comece o jogo.\n\nPara desenhar cada gid: gid & 0x1FFFFFFF, k = gid - firstgid, coluna k % columns, linha Math.floor(k / columns), e 0 é célula vazia; escolha o tileset cuja firstgid seja a maior que não passa do gid. Pinte todas as camadas uma única vez numa imagem grande fora da tela (montarCenario) e recorte só o pedaço visível a cada quadro, com uma câmera que segue o jogador e uma constante ZOOM (1 por padrão).\n\nColisão: qualquer tile da camada CAMADA_CHAO = 'Platforms' é sólido, e as bordas do mapa também. O jogador (caixa de 12 × 16) começa no primeiro objeto da camada de objetos (os pés ficam em y + altura). Setas ou A e D andam; espaço, ↑ ou W pulam. GRAV = 1000, PULO = 400, VEL = 100, COYOTE = 0.1. Use os estados idle, walk e jump como nas spritesheets: jump vale quando noChao é falso (pulando ou caindo de uma plataforma); senão é walk se estiver andando, e senão idle. Espelhe com OLHA_DIREITA. Com DEPURAR = true, mostre a caixa de colisão e o ponto inicial.",
 "Y Sorting": "Um mini-RPG visto de cima, com Y Sorting. Este exemplo usa os arquivos que já existem na pasta assets/ysorting/, ao lado do HTML (mantenha os caminhos): map2.tmx (com os tilesets tiles.png e objects.png embutidos e as camadas Tiles, que é o chão; Objects, com objetos pequenos de um tile só; YSorting e YSorting2, com árvores e troncos grandes de vários tiles; e um objeto PlayerStart onde os pés do coelho começam), bunny_idle.png (5 quadros, 6 fps) e bunny_run.png (8 quadros, 12 fps). Os quadros têm 48 × 48 e cada folha tem 4 linhas, uma por direção (norte 0, leste 1, oeste 2, sul 3), com os pés na linha 32 e o centro do corpo na coluna 24 (QUADRO, PES, CENTRO, LINHA). A página usa fetch e precisa ser aberta por um servidor local (python -m http.server).\n\nLeia o .tmx com DOMParser. O mapa usa dois tilesets: cada gid pertence à última folha cujo firstgid não passa dele. O coelho anda com setas ou WASD (VEL = 70; na diagonal, divida o movimento por Math.hypot(dx, dy) para não ficar mais rápido), olha para a direção do movimento e fica em idle quando parado. O chão (Tiles) e os Objects ficam sempre atrás do coelho e são pintados uma só vez numa imagem grande.\n\nAs camadas de CAMADAS_ORDENAR = ['YSorting', 'YSorting2'] entram na ordenação: agrupe os tiles vizinhos de cada camada, separadamente, em objetos (uma árvore tem vários tiles). Antes de desenhar, ordene esses objetos e o coelho pelo y da base, do menor para o maior, e desenhe nessa ordem. A base do objeto é a borda de baixo dos tiles dele, e a do coelho é p.y + p.h (os pés). Assim ele passa por trás da árvore quando está acima e pela frente quando está abaixo. A constante ORDENAR = false desliga isso (o coelho fica sempre por cima, para você ver o erro).\n\nColisão: cada tile de Objects é sólido inteiro; nos objetos ordenados, só a base colide (BASE_ALTURA = 8 e BASE_MARGEM = 3 de cada lado). A câmera segue o coelho, com ZOOM. Com DEPURAR = true, mostre as colisões e a linha de ordenação de cada objeto (azul nas árvores e amarela no coelho).",
 "Labirintos e cavernas": "Dois geradores de mapa em grade de tiles, que começam com tudo de parede (#) e vão abrindo chão (.). A tecla 1 escolhe o labirinto, a tecla 2 escolhe a caverna e R sorteia um mapa novo.\n\nLabirinto: busca em profundidade com pilha. As células ficam nas posições ímpares da grade (COLS e LINS ímpares) e as paredes ficam entre elas. Parta de uma célula, sorteie um vizinho ainda fechado, derrube a parede entre os dois e siga para ele; sem vizinho livre, volte um passo pela pilha. A constante ATALHOS derruba algumas paredes extras para criar voltas (com 0, o labirinto é perfeito: só um caminho entre dois pontos).\n\nCaverna: autômato celular. Cada tile vira parede ou chão na sorte (DENSIDADE). Repita algumas rodadas da regra: cada tile olha os 9 tiles ao redor, contando ele mesmo, e vira parede se 5 ou mais forem parede. Depois use flood fill (função maiorRegiao) para manter só a maior região conectada, assim o jogador nunca fica preso.\n\nNos dois: o jogador começa num ponto, uma busca em largura conta os passos até cada tile, e a escada vai para o último tile alcançado, o mais distante; mostre o número de passos na tela. O jogador é um quadrado de 10 × 10 que anda com setas ou WASD, um eixo por vez, encostando exatamente na face do tile ao bater. Chegue à escada para ganhar um mapa novo.",
 "Névoa de guerra e visão": "Um jogo de exploração com névoa de guerra. O mapa é uma lista de textos (labirinto de salas e corredores, tiles de 16 pixels). O jogador é um quadrado de 10 × 10 que anda com setas ou WASD, um eixo por vez, encostando exatamente na face do tile ao bater.\n\nCada tile está em um de três estados: nunca visto (preto, nem chega a ser pintado), explorado (visto antes, mas fora da vista agora, coberto por uma película preta de 65%) e visível (à vista neste instante, que escurece com a distância, como uma lanterna). Duas matrizes guardam isso: visivel, zerada e recalculada a cada quadro, e visto, que só recebe true e nunca volta atrás (a memória do mapa). A função veTile anda em linha reta, de 4 em 4 pixels, do centro do jogador até o centro do tile; se o tile estiver além do raio, ou se aparecer uma parede antes do destino, ele não é visto. A face de uma parede aparece, mas o que fica atrás dela não, então um pilar projeta sombra. A função atualizarVisao só testa os tiles do quadrado em volta do jogador.\n\nHá 5 rupias, que ficam paradas (depois de vistas, aparecem apagadas mesmo fora da vista), e 3 guardas que patrulham o mapa e só aparecem enquanto o tile deles está à vista. Pegue as 5 rupias sem ser tocado. Se um guarda encostar no jogador, ele volta ao início (INICIO), mas o que já foi explorado continua no mapa. A tecla R recomeça com a névoa de volta.",
 "Ruído e terreno": "Um gerador de mundos com ruído de Perlin, em um canvas de 480 × 240. O mundo é uma grade de 120 × 60 tiles de 4 pixels, calculada com uma semente (o gerador mulberry32, que dá a mesma sequência para a mesma semente), e a tecla R sorteia uma semente nova. O mapa é pintado numa imagem pequena de 120 × 60 pixels, um pixel por tile, fora da tela, e o canvas a amplia com imageSmoothingEnabled = false. Só recalcule quando algo mudar.\n\nEscreva o ruído de Perlin 2D: uma tabela de permutação de 0 a 255 embaralhada com a semente (e repetida duas vezes), uma função grad que escolhe um de 8 gradientes pelos 3 últimos bits do número, a curva suave 6t⁵ − 15t⁴ + 10t³ e a mistura linear dos 4 cantos da casa da grade. Em cima disso, escreva o ruído fractal fbm: some várias oitavas, cada uma com o dobro da frequência e metade da força da anterior, e divida pelo total das forças. A altura de cada tile é fbm(c * escala, l * escala, oitavas) menos ILHA * d * d, em que d é a distância ao centro (0 no meio, 1 nas bordas, limitada a 1), e depois uma função esticar remapeia os valores para ocuparem de 0 a 1. A umidade é outro fbm de 3 oitavas, calculado em outro ponto do plano (somando 100 às coordenadas) e também esticado. Valores iniciais: escala 0,05, 5 oitavas, ILHA 0,8 e nível do mar 0,42.\n\nBiomas, pela altura h e a umidade u: abaixo de mar − 0,12 é mar profundo, abaixo de mar é mar (mais escuro quanto mais fundo), até mar + 0,03 é praia, abaixo de 0,68 é deserto (u menor que 0,38), campo (até 0,62) ou floresta, abaixo de 0,84 é montanha e acima é neve. Em terra, dê relevo às cores comparando a altura do vizinho de cima à esquerda com a do vizinho de baixo à direita: se o de baixo é mais alto, o tile fica mais claro (limite de 30%). Rios: sorteie até 14 nascentes com a semente mais 1, em tiles com altura acima de 0,68 e a pelo menos 10 tiles uma da outra. Cada rio desce sempre para o vizinho mais baixo (entre os 8 ao redor, sem repetir tiles) até chegar ao mar, e para num lago se o melhor vizinho for mais alto que o tile atual mais 0,02. Rios aparecem em azul sobre a terra.\n\nControles: as setas esquerda e direita mudam a escala (de 0,02 a 0,2, de 0,01 em 0,01), as setas para cima e para baixo mudam as oitavas (de 1 a 8), as teclas + e − mudam o nível do mar (de 0,1 a 0,9, de 0,02 em 0,02), e V alterna entre o mapa colorido, a altura e a umidade em tons de cinza. Mostre no topo a semente, a escala, as oitavas, o mar e a visão, e embaixo, ao passar o mouse sobre um tile, as coordenadas, a altura, a umidade e o nome do bioma (ou Rio), com um contorno branco no tile.",
 "Minimapa": "Um jogo de exploração com câmera, névoa de guerra e minimapa. O mundo é um mapa de 48 × 30 tiles de 16 pixels (768 × 480 pixels), escrito como lista de textos (# parede, . chão): nove salas ligadas por corredores de 1 tile de largura, com parede em toda a borda. A tela tem 480 × 240, então uma câmera (cam.x, cam.y), arredondada com Math.round, centraliza no jogador sem sair do mundo. Só os tiles que a câmera enxerga são desenhados, e ctx.translate(-cam.x, -cam.y) vale para as rupias, os guardas e o jogador.\n\nO jogador é um quadrado de 10 × 10 que anda com setas ou WASD a 100 px/s, um eixo por vez, encostando exatamente na face do tile ao bater. A névoa de guerra tem três estados por tile: nunca visto (preto, nem chega a ser pintado), explorado (visto antes, coberto por uma película preta de 65%) e visível (escurece com a distância, raio de 6 tiles). Duas matrizes guardam isso: visivel (recalculada a cada quadro) e visto (só recebe true). A função veTile anda em linha reta, de 4 em 4 pixels, até o centro do tile e para numa parede.\n\nMinimapa: uma imagem pequena fora da tela (um canvas de 48 × 30 pixels, 1 pixel por tile) em que cada tile ganha 1 pixel no instante em que é visto pela primeira vez (parede mais clara, chão mais escuro). A cada quadro, a função desenharMinimapa(mx, my, e) amplia essa imagem com drawImage e imageSmoothingEnabled = false, sobre um fundo preto translúcido, e desenha por cima: as rupias já vistas e ainda não pegas (rosa), os guardas só enquanto o tile deles está à vista (vermelho), um retângulo branco com o pedaço que a câmera mostra (posição cam.x / T * e, tamanho W / T * e por H / T * e) e o jogador como um ponto amarelo que pisca 3 vezes por segundo. A conversão do mundo para o minimapa é mx + x / T * e. O minimapa pequeno (e = 2) fica no canto de cima à direita. A tecla M abre o mapa grande (e = 6, centralizado, com a tela escurecida) chamando a mesma função com outros valores, e o jogo fica parado enquanto ele está aberto.\n\nHá 6 rupias paradas (pegue todas) e 3 guardas que andam em linha reta e dão meia-volta ao bater numa parede. Se um guarda encostar no jogador, ele volta ao início, mas o que já foi explorado continua. Mostre as rupias pegas, a porcentagem explorada e as teclas na tela. R recomeça (a névoa e o minimapa voltam a ficar vazios), e Enter também recomeça depois que todas as rupias forem pegas.",
 "Raycasting": "Um jogo em primeira pessoa no estilo de Wolfenstein 3D, feito com raycasting, em um canvas de 480 × 240. O mapa é uma lista de textos (# parede, . chão) de 20 × 14 casas, e o jogador tem posição em casas (números reais) e um ângulo em radianos. As setas esquerda e direita (ou A e D) giram, as setas para cima e para baixo (ou W e S) andam, Q e E andam de lado, e o movimento separa os eixos x e y para deslizar nas paredes, com uma folga de 0,2 casa.\n\nPara cada coluna x da tela, um raio sai do jogador. O ângulo do raio é o do olhar mais atan((2 * x / W - 1) * tan(FOV / 2)), com FOV de 60 graus. A função lancarRaio usa o algoritmo DDA: guarda a distância até a próxima linha vertical e a próxima linha horizontal da grade, salta sempre para a mais próxima até cair numa casa de parede e devolve a distância percorrida, o lado atingido (vertical ou horizontal) e a posição t (0 a 1) ao longo da parede. A distância usada na tela é a perpendicular, dist * cos(desvio), para não ter olho de peixe, e a tecla F liga e desliga essa correção. A faixa de parede tem altura H / distância, centrada na tela, com a cor escurecendo com a distância e as paredes de lado 30% mais escuras. Teto e chão são dois retângulos de cores diferentes. A distância de cada coluna fica guardada numa lista (profund).\n\nSeis rupias (gemas rosa em forma de hexágono alongado, com uma face clara à esquerda, uma escura à direita e um brilho) ficam no mapa como sprites que sempre encaram o jogador: para cada uma, atan2(dy, dx) menos o ângulo do olhar dá o ângulo em relação à visão, a coluna do centro vem de tan(ângulo) / tan(FOV / 2), o tamanho é proporcional a 1 / distância, e só aparecem as colunas em que a parede daquela coluna (profund[x]) estiver mais longe que a rupia: monte uma área de recorte (ctx.clip) só com essas colunas e desenhe a rupia inteira dentro dela, como um caminho (beginPath, lineTo, fill), para as bordas ficarem suaves em vez de serrilhadas. Elas são desenhadas da mais longe para a mais perto. Encostar numa rupia (menos de 0,5 casa) a pega.\n\nNo canto de cima à direita fica um minimapa (4 pixels por casa) com o mapa de texto visto de cima, as rupias, o jogador e um raio a cada 20 colunas, até onde bateu; a tecla M liga e desliga. Mostre as rupias pegas, as teclas e o estado da correção do olho de peixe na tela. Ao pegar todas, mostre uma mensagem, e R recomeça.",
 "Luz e sombras": "Uma masmorra vista de cima, com luz e sombras 2D. O mapa é uma lista de textos de 60 × 34 tiles de 16 pixels (960 × 544 pixels, bem maior que a tela de 480 × 240), em que # é parede, c é caixote e . é chão; parede e caixote bloqueiam a luz e o jogador. Há seis salas ligadas por passagens de 3 tiles, com pilastras, cantos em L e caixotes. Uma câmera centraliza no jogador sem sair do mapa (com Math.round, para a cena e a luz andarem juntas), e só os tiles que ela mostra são desenhados. O jogador (setas ou WASD, 80 pixels por segundo, círculo de raio 5, movimento com um eixo de cada vez) carrega uma tocha. Há 12 tochas fixas junto às paredes e 3 cristais de luz azul.\n\nCada luz ilumina só o que enxerga. Escreva lancar(x, y, ang, alcance), o DDA do Raycasting em pixels, que salta de linha em linha da grade até entrar num tile sólido ou chegar ao alcance e devolve a distância. Escreva contorno(x, y, raio), que lança RAIOS = 360 raios (um por grau) e devolve os pontos onde eles param, entrando PENETRA = 4 pixels na parede, para a face dela aparecer iluminada, mas nunca passando do alcance.\n\nCrie um mapa de luz: um canvas fora da tela de 480 × 240, do tamanho da tela e não do mapa. A cada quadro, pinte o ambiente (noite #14142b ou crepúsculo #4a4a78, alternando com a tecla N) e depois, com a origem deslocada pela câmera (setTransform(1, 0, 0, 1, -cam.x, -cam.y)) e com globalCompositeOperation = 'lighter', desenhe cada luz: o polígono do contorno preenchido por um gradiente radial (cor no centro, 45% de opacidade na metade do raio e transparente na borda). Depois desenhe a cena, com ctx.translate(-cam.x, -cam.y) e só os tiles que a câmera mostra (chão quadriculado, paredes com uma face mais escura embaixo, caixotes de madeira), e junte o mapa de luz por cima (já sem a translação, em coordenadas da tela) com 'multiply', mais uma passada fraca com 'screen' (BRILHO = 0,3). Chamas, fagulhas e texto são desenhados depois, para não escurecerem.\n\nSombra suave: cada luz é desenhada SUAVE = 3 vezes, a partir de pontos ao redor do centro (TAM_FOGO = 3 pixels), cada uma com globalAlpha = 1 / SUAVE; com SUAVE = 1 a sombra fica dura. As tochas tremem: o raio é multiplicado por 1 + tremor(tempo, fase), com a soma de três senos de períodos diferentes, e cada tocha tem a sua fase. O cristal azul só pulsa devagar. As tochas soltam fagulhas (partículas pequenas que sobem e somem). A luz do jogador tem raio 130 e as tochas 110.\n\nClicar num tile de chão põe uma tocha (no máximo 24 no total; o clique soma a câmera à posição do mouse para achar o tile do mundo), e clicar numa tocha a remove. Espaço apaga e acende a tocha do jogador. A tecla G mostra o polígono de cada luz e um raio a cada 15 graus. Só as luzes que chegam à tela (considerando o raio de cada uma, com 10% de sobra para o tremor) entram nas contas: mapa de luz, raios, chamas e fagulhas. Mostre na tela o número de tochas, quantas luzes estão sendo calculadas e os comandos.",
 "Estados do jogo": "Um corredor infinito com quatro telas controladas por uma variável estado: 'titulo', 'jogando', 'pausa' e 'fim'. A cada quadro, o loop olha o estado e decide o que atualizar e o que desenhar. O jogador pula obstáculos que vão ficando mais rápidos: Espaço (ou ↑, ou toque na tela) pula, P pausa, e Espaço ou Enter começam e recomeçam. Escreva a função apertou(tecla), que compara keys com o quadro anterior para detectar só o instante em que a tecla foi apertada (sem isso, a pausa ligaria e desligaria várias vezes por segundo). Mostre pontuação e recorde, a tela de título e a tela de fim de jogo.",
 "Som com Web Audio": "Uma masmorra com 3 salas ligadas por portas, onde o jogador (setas ou WASD) pega rupias e corações e uma chave que abre a porta trancada que leva ao tesouro. Todos os sons são criados por código com a Web Audio API, sem arquivos de áudio.\n\nCrie o AudioContext só depois do primeiro clique ou tecla (o navegador não libera antes) e escreva a função nota(freq, inicio, dur, tipo, vol, fim): um oscillator ('sine', 'triangle', 'square' ou 'sawtooth') ligado a um gain e depois a audio.destination. O volume cai quase a zero ao longo da nota para não dar estalo, inicio permite encadear notas (arpejos) e fim faz a frequência deslizar. Crie uma tabela sons: chave (três notas agudas), rupia (duas notas de moeda), coração (arpejo suave), sala (desliza do grave ao agudo), porta trancada e porta aberta. Quando algo acontecer no jogo, chame sons.nome(). As teclas 1 a 6 testam cada som e M silencia. Mostre um aviso para clicar na tela antes de o áudio ser liberado.",
 "Salvar progresso": "Um mini-game chamado Caça às Rupias: colete a meta de rupias antes que o tempo acabe, sem encostar nas bolas vermelhas, que ricocheteiam nas paredes como no Breakout. Setas ou WASD movem o jogador (ou arraste na tela).\n\nSalve o progresso com localStorage. Guarde um objeto { fase, pontos, recorde, partidas } (constante PADRAO) com JSON.stringify e leia com JSON.parse, com três cuidados: (1) try/catch, porque o armazenamento pode estar bloqueado; (2) conferir os valores lidos e voltar ao PADRAO se estiverem vazios ou quebrados; (3) salvar só nos momentos certos (fase concluída e fim de jogo), nunca a cada quadro. Ao concluir uma fase, salve a fase atual e os pontos e atualize o recorde. Na tela de título, o jogador pode continuar de onde parou; N começa um novo jogo (mantendo o recorde) e X apaga tudo. Mostre também o texto bruto que ficou salvo.",
 "Diálogos e menus": "Uma cena de RPG: o jogador (setas ou WASD) anda até um velho e, perto dele, Enter (ou Espaço, ou clique) inicia a conversa, numa caixa de diálogo na parte de baixo da tela (CX = 10, CY = 156, largura W - 20, altura 78).\n\nA conversa é dado, não código: um objeto conversa em que cada fala tem quem fala, o texto e vai (o nome da próxima fala). Falas com escolhas têm opções, e cada uma aponta para a sua própria continuação. Sem vai, a conversa termina. Um campo ganha entrega rupias uma única vez. O texto aparece letra por letra: mostrados é um número decimal que sobe VEL * dt por quadro (VEL = 30 letras por segundo) e slice(0, resta) corta cada linha no ponto certo. Quebre as linhas medindo cada palavra com ctx.measureText para o texto não escapar da caixa, e divida a fala em páginas de LINHAS = 3.\n\nEnter muda de papel conforme o momento: se o texto ainda está aparecendo, mostra tudo de uma vez; se a página encheu (um ▼ pisca), vira a página; na última, segue para a próxima fala ou fecha a caixa. Use uma função apertou que compara keys com o quadro anterior para pegar só o instante do toque. O menu de escolhas é uma lista com um índice sel: ↑ e ↓ mudam o índice com (sel + n - 1) % n, para o cursor dar a volta; um ▶ marca a linha de sel; Enter, clique ou toque na linha confirma com falar(escolha.vai).",
 "Partículas e Asteroids": "Um Asteroids com efeitos de partículas. A nave tem um ângulo (ang): ← → (ou A e D) giram, ↑ (ou W) acelera somando cos(ang) e sin(ang) à velocidade, não à posição (é isso que dá inércia), e Espaço atira (pode segurar). EMPUXO = 220, ATRITO = 0.3 (0 = inércia pura), VMAX = 300. A nave e os asteroides que saem por um lado da tela voltam pelo lado oposto, com ((v % max) + max) % max. Como essa conta só muda o centro do objeto, para ele atravessar a borda sem pular desenhe a nave e cada asteroide de novo, deslocados em ±W e ±H, quando estiverem perto de uma borda (só a parte que cai dentro da tela aparece), e meça as colisões com a distância dando a volta na tela (Math.min(dx, W - dx) e Math.min(dy, H - dy)). O tiro não dá a volta, ele some ao sair. Os asteroides se partem em pedaços menores, e cada onda tem ROCHAS_BASE + onda asteroides grandes (ROCHAS_BASE = 2, máximo 6).\n\nPartículas: objetos minúsculos de vida curta, com posição, velocidade e tempo de vida, numa lista. A cada quadro, mova cada uma, diminua a vida e remova com filter as que acabaram. Ao desenhar, globalAlpha e o tamanho acompanham a vida restante. A função emitir(x, y, n, opcoes) cria várias de uma vez, e três receitas mudam só as opções: explosão (muitas, rápidas, cores quentes), faíscas (poucas, muito rápidas e curtas) e poeira (uma por quadro, lenta, saindo para trás da nave).\n\nTremor de câmera: a variável tremor sobe nos impactos e cai sozinha com Math.exp. Ao desenhar o mundo, desloque tudo com ctx.translate por um valor sorteado entre -tremor e +tremor, e desenhe o painel de pontos fora do tremor, para não balançar.",
 "Snake": "O jogo da cobrinha numa grade. A posição é uma coluna e uma linha (c, l), e só na hora de desenhar elas são multiplicadas por T, o tamanho da célula. A cobra é uma lista de segmentos, da cabeça para o rabo: andar é criar uma nova cabeça na frente com unshift e remover o último segmento com pop. Ao comer, não remova o rabo naquele passo e a cobra cresce um segmento. A colisão com o próprio corpo olha a lista com some, ignorando o rabo quando ele vai sair do lugar.\n\nO tempo anda em passos fixos: um acumulador soma o dt e, a cada intervalo segundos, a cobra dá um passo, qualquer que seja a taxa de quadros. O intervalo diminui conforme ela cresce, e o jogo acelera. As teclas entram numa fila de no máximo 2 curvas, para que dois toques rápidos não façam a cobra virar sobre si mesma. Setas ou WASD controlam, e o toque na tela vira na direção do toque. A constante PAREDES_MATAM decide: true, bater na borda mata; false, a cobra dá a volta pelas bordas. Mostre pontos, recorde e uma tela de fim de jogo que reinicia.",
 "Invasores": "Um jogo estilo Space Invaders com sprites. Este exemplo usa imagens que já existem na pasta assets/invaders/, ao lado do HTML (mantenha os caminhos): background.png (480 × 240, do tamanho da tela), spaceship.png (folha com 5 quadros de 83 × 84 pixels, lado a lado numa linha, em que a chama do motor muda de um quadro para o outro), alien1.png (47 × 34), alien2.png (47 × 34) e alien3.png (51 × 39). As imagens são grandes, então desenhe tudo na metade do tamanho (constante ESCALA = 0.5).\n\nCarregue cada imagem com uma função carregar(arquivo) que cria um Image, e só desenhe quando pronta(img) for verdadeira (img.complete && img.naturalWidth > 0). Se um arquivo não for encontrado (onerror), mostre na tela o aviso \"Imagem não encontrada: \" com o caminho.\n\nA nave anda com ← → ou A e D a 150 px/s e atira com a barra de espaço, com intervalo de 0,3 s entre os tiros. A caixa de colisão da nave é só o corpo dela: 64 × 42 pixels (vezes ESCALA), que começa em (9, 17) dentro do quadro (constante CORPO). Desenhe o quadro com a versão de 9 argumentos do drawImage, deslocado em CORPO.x * ESCALA e CORPO.y * ESCALA para o corpo cair dentro da caixa. O quadro muda com Math.floor(tempo * FPS) % 5, com FPS = 10, usando um relógio que continua correndo mesmo no fim de jogo. Os tiros continuam sendo retângulos amarelos de 4 × 10.\n\nOs inimigos formam 3 fileiras de 8, uma imagem por fileira (alien1 em cima, alien2 no meio e alien3 embaixo), cada um com o tamanho da imagem vezes ESCALA, e andam de lado a 35 px/s. Quando algum toca a borda, todos descem 14 px e mudam de direção. Tiros e inimigos são listas de objetos: a cada quadro, mova todos, teste a colisão AABB de cada tiro com cada inimigo e remova os atingidos com filter (+10 pontos por inimigo). O fundo é desenhado primeiro, depois os inimigos, os tiros e a nave. O jogador vence quando não sobra nenhum inimigo e perde se algum chegar à altura da nave. Mostre os pontos e a mensagem final.",
 "Battle Tanks": "Um jogo de tanques que junta vários assuntos. O mapa é uma lista de textos maior que a tela, com # pedra (indestrutível), b tijolo e . chão, e uma câmera que segue o seu tanque, limitada às bordas do mapa e desenhada com ctx.translate. Como a matriz é editável, um tiro que acerta um tijolo troca o b por . e a parede some; a pedra bloqueia o tiro.\n\nSetas ou WASD movem o tanque e a barra de espaço atira. Cada tanque guarda para onde está virado em (dx, dy), e essa direção serve para desenhar o canhão e para saber para onde o tiro vai. Os tanques são barrados pelas paredes e uns pelos outros. Destrua os 4 tanques vermelhos antes de perder as 3 vidas. Cada inimigo tem um raio de detecção, desenhado como um círculo tracejado que fica vermelho quando ele detecta você (a distância vem de Math.hypot): ao detectar, o tanque para, vira para o seu lado e atira mais rápido; sem detectar, anda pelo mapa. Mostre as vidas e os inimigos restantes, com telas de vitória e de derrota.",
 "Jogo final": "Um jogo de plataforma no estilo Mario, com dois mapas do editor Tiled, três tipos de inimigos e câmera. Este exemplo usa os arquivos que já existem na pasta assets/final/, ao lado do HTML (mantenha os caminhos): dois mapas .tmx (map1.tmx e map2.tmx) com as mesmas 7 camadas, em formato CSV, que o código acha pelo nome: Layer03, Layer02 e Layer01 (os fundos, do mais distante para o mais próximo, com as imagens Layer_03.png, Layer_02.png e Layer_01.png), Platforms (camada de tiles com as plataformas onde o jogador e os inimigos pisam, feita com Tileset.png; qualquer tile diferente de 0 é sólido), Transition (objetos retangulares com a propriedade map: o nome do próximo mapa, ou end, que termina o jogo), Enemies (objetos com a propriedade type: enemy1, enemy2 ou enemy3, que marcam onde cada inimigo nasce) e PlayerStart (onde os pés do jogador começam). Cada ator tem uma folha de imagem por estado, com os quadros lado a lado, do mesmo tamanho (a quantidade de quadros é descoberta pelas colunas transparentes entre eles): player_hit.png, player_idle.png e player_walk.png; enemy1 e enemy2, cada um com _hit, _idle e _walk; e enemy3_fly.png e enemy3_hit.png. Uma função arquivo(ator, estado) monta esses nomes. A página usa fetch e precisa ser aberta por um servidor local (python -m http.server).\n\nEscreva lerTMX(texto) com DOMParser: ela percorre os filhos do mapa na ordem do arquivo e devolve { cols, lins, T, tilesets, camadas }, em que cada camada tem um tipo ('tiles', 'imagem' ou 'objetos'). Os objetos guardam x, y, w, h e um objeto props com as propriedades do Tiled. Aceite fundos tanto como camadas de imagem (com parallax: PARALAXE = { Layer03: 0.2, Layer02: 0.4, Layer01: 0.6 }, a imagem cobre a altura da tela e se repete na horizontal) quanto como camadas de tiles. Carregue tudo em funções async com await e pinte cada camada de tiles uma única vez num canvas fora da tela.\n\nSetas ou WASD andam e espaço (ou seta para cima) pula, com gravidade, coyote time e pulo variável. Colisão com a camada Platforms, movendo um eixo de cada vez. A caixa de colisão de cada ator vem de getImageData: o menor retângulo que envolve os pixels não transparentes do primeiro quadro, com os pés como âncora. Espelhe o desenho com ctx.scale(-1, 1) quando o ator olhar para a esquerda.\n\nInimigos: enemy1 e enemy2 andam (enemy2 mais rápido), param de vez em quando no estado idle, viram ao bater na parede e na beirada da plataforma. enemy3 voa de um lado para o outro, subindo e descendo com Math.cos, sem gravidade, e volta depois de 96 pixels. O jogador derrota o inimigo pisando nele: ele está caindo e, no quadro anterior, os pés estavam acima do meio do inimigo. O inimigo mostra o estado hit, cai e some, e o jogador quica e ganha 100 pontos. Qualquer outro encontro tira uma vida: o jogador é empurrado, fica atordoado por 0,4 s no estado hit e pisca invulnerável por 1,5 s. Cair num buraco também tira uma vida e volta ao PlayerStart. São 3 vidas.\n\nCâmera suave que segue o jogador (cam += (alvo - cam) * k), limitada às bordas do mapa e desenhada com ctx.translate, com uma constante ZOOM. Ao entrar num retângulo de Transition (só vale a parte de dentro: o retângulo reduzido em 15 pixels de cada lado, para a troca não disparar por um simples encostão), mostre a tela de Carregando... por no mínimo 1 segundo, mesmo que o arquivo chegue antes, e então carregue o mapa indicado (o caminho vale a partir da pasta do mapa atual) e comece no PlayerStart dele, mantendo vidas e pontos; se o valor for end, mostre a tela de vitória. Mostre vidas, pontos e o nome do mapa, com telas de fim de jogo e de vitória em que Enter ou um clique recomeça. Uma constante DEPURAR desenha as caixas de colisão.",
 "Mini RPG": "Crie um mini RPG visto de cima, em um único arquivo HTML (HTML, CSS e JavaScript puros, sem bibliotecas), com um canvas de 480 × 240 e game loop com dt. O jogo usa os arquivos da pasta assets/rpg/ ao lado do HTML (mantenha os caminhos): map1.tmx e map2.tmx (mapas do Tiled, camadas em CSV, tilesets embutidos), player.png (9 linhas), slime.png (3 linhas) e wasp.png (3 linhas). A página usa fetch e precisa ser aberta por um servidor local (python -m http.server).\n\nCada mapa tem 5 camadas, achadas pelo nome: Floor (chão onde se anda), Wall (paredes: qualquer tile diferente de 0 bloqueia), YSorting (árvores de vários tiles, troncos, postes e poço), Enemies (camada de objetos; cada objeto tem a propriedade type, slime ou wasp, e a posição em que o inimigo nasce) e Transition (camada de objetos; cada retângulo tem a propriedade map com o nome do próximo mapa, com ou sem .tmx). Pode haver também duas camadas opcionais: YSorting2, com as construções de vários tiles, e YSorting3, com os bancos; se o mapa não tiver alguma delas, ignore-a. O jogador começa em map1.tmx. Leia o .tmx com DOMParser, pinte Floor e Wall uma vez só numa imagem fora da tela e recorte o pedaço visível com uma câmera que segue o jogador (ZOOM = 2).\n\nY Sorting: agrupe os tiles vizinhos de YSorting, de YSorting2 e de YSorting3, cada camada separadamente, em objetos (flood fill: à direita o gid é gid + 1, embaixo é gid + colunas), ordene esses objetos, os inimigos e o jogador pelo y da base e desenhe nessa ordem. Em cada objeto só uma faixa na base colide, e a tolerância é de cada camada, guardada numa lista CAMADAS_ORDENAR com nome, alt e margem: em YSorting (árvores, troncos, postes e poço) a faixa tem 21 pixels de altura e é 3 pixels mais estreita de cada lado; em YSorting2 (construções) tem 50 pixels e é 10 pixels mais estreita de cada lado, para o jogador poder avançar um pouco pelas laterais; em YSorting3 (bancos) tem 19 pixels e a margem é negativa (-1), isto é, a faixa é 1 pixel mais larga que o desenho de cada lado, para as laterais do banco também bloquearem.\n\nJogador: caixa dos pés de 10 × 6 que colide com Wall e com as bases dos objetos do Y Sorting, movendo um eixo de cada vez. Setas ou WASD andam (VEL = 60, na diagonal divida por Math.hypot). A folha tem 9 linhas: 3 de idle, 3 de caminhada e 3 de ataque, cada grupo na ordem baixo, direita e cima. Para a esquerda, espelhe a direita com ctx.scale(-1, 1). O quadro tem altura = altura da imagem / 9 e largura igual à altura; o número de quadros de cada linha é contado separadamente, ignorando os quadros totalmente transparentes no fim da linha (o ataque do jogador tem 3 quadros e a vespa tem linhas de 4 e de 6). Os pés ficam a 15 pixels (jogador), 10 (slime) e 6 (vespa) acima da borda de baixo do quadro. A animação de ataque toca uma vez em 0,4 s. Espaço (ou J) ataca, com o jogador parado: na metade da animação, crie uma caixa de 24 × 24 na frente dele (no lado em que olha) e teste a colisão com a caixa do corpo de cada inimigo.\n\nInimigos: slime (3 de vida, lento) e wasp (2 de vida, rápida), cada folha com 3 linhas: idle, movimento e ataque. Máquina de estados: longe do jogador fica em idle; dentro da visão persegue; dentro do alcance ataca (o dano sai na metade da animação, depois espera 1 s). A perseguição contorna obstáculos: monte uma grade de tiles (montarGrade) em que fica bloqueado o tile com parede ou em que encosta a base de uma árvore, construção ou banco; uma função linhaLivre anda a caixa do inimigo pelo trajeto até o jogador, de 2 em 2 pixels, com a mesma função de colisão dos pés, e, se não bater em nada, o inimigo vai reto; senão ele segue uma rota de A* na grade (4 direções, no máximo 600 tiles examinados por busca, rota refeita a cada 0,4 s e na hora se ele ficar parado por 0,4 s), passando pelos centros dos tiles e pulando os pontos que já enxergue em linha reta; se não houver caminho, vai até o ponto mais perto do jogador que a busca alcançou. O inimigo, depois de ver o jogador, só para de perseguir quando a distância passa de 1,5 vezes a visão, e só ataca se não houver parede ou árvore no meio. Com DEPURAR, desenhe a rota e os tiles bloqueados. Espelhe o inimigo conforme o jogador estiver à esquerda ou à direita dele. O desenho do slime e o do jogador olham para a direita, mas o da vespa olha para a esquerda: guarde isso numa propriedade olha de cada folha (a vespa tem olha: esq) para o espelhamento ficar certo nos três. Ao ser atingido, o inimigo perde 1 de vida, pisca e é empurrado; com vida 0, some com fade.\n\nO jogador tem 5 vidas, é empurrado e fica 1 s invulnerável (piscando) ao levar dano; sem vidas, mostre a tela de fim, e Enter ou clique recomeça. Se o retângulo de Transition estiver colado numa borda do mapa (a menos de 32 pixels dela), estenda-o até a borda e só carregue o mapa indicado quando os pés chegarem ao fim do mapa (a no máximo 2 pixels da borda), e não apenas ao tocar o retângulo; numa porta no meio do mapa, vale ao entrar no retângulo (reduzido em 4 pixels). Depois de carregar o mapa, faça o jogador nascer na saída do novo mapa que leva de volta ao anterior (um tile para dentro, se ela for de borda); só permita usar uma saída de novo depois de sair da porta em que nasceu. Mostre vidas, nome do mapa e inimigos vivos. Uma constante DEPURAR desenha as caixas de colisão, o golpe e as saídas. Se algum arquivo faltar, mostre um aviso na tela em vez de ficar em branco.",
 "RPG de Tabuleiro": "Crie um RPG de tabuleiro no estilo de Dungeons & Dragons, visto de cima, em um único arquivo HTML (HTML, CSS e JavaScript puros, sem bibliotecas), com um canvas de 480 × 240 e game loop com dt. O jogo usa os arquivos da pasta assets/dnd/ ao lado do HTML (mantenha os caminhos): map1.tmx, map2.tmx, map3.tmx e map4.tmx (mapas do Tiled, camadas em CSV, tileset embutido) e tiles.png (tiles de 16 × 16, 49 colunas, firstgid 1). A página usa fetch e precisa ser aberta por um servidor local (python -m http.server). O primeiro mapa é map1.\n\nCamadas, achadas pelo nome. Camadas de tiles: Floor (chão onde se anda) e Wall (barreiras: tile diferente de 0 bloqueia); pinte as duas uma vez só numa imagem fora da tela. Camadas de objetos: PlayerStart (onde o jogador começa no primeiro mapa; use o primeiro objeto que esteja dentro do mapa), SpawnPoints (pontos de nascimento, cada um com a propriedade id), Transitions (cada objeto tem as propriedades map, o mapa de destino, com ou sem .tmx, e spawnpoint, o id do ponto onde nascer lá), Enemies e NPCs (cada objeto tem a propriedade type) e Items (cada objeto tem type; por enquanto só life, que recupera vida). O desenho de cada objeto é o gid dele no tileset. Em objetos de tile o y do Tiled é a base do tile (linha = y / 16 - 1); em pontos e retângulos o y é o topo. Ignore objetos fora do mapa e inimigos sem um type conhecido. O tiles.png não tem transparência (todo tile traz a cor de fundo, a do pixel 0, 0): para desenhar personagens e itens sem um quadrado em volta, faça uma cópia do tileset em que essa cor fique transparente, e use a folha original para o chão. O jogador usa o gid do objeto de PlayerStart.\n\nMovimento discreto, como uma peça de tabuleiro: cada ator tem uma posição lógica (coluna, linha) e o desenho desliza até o tile a 110 pixels por segundo, sem aceitar nova jogada até terminar. Setas ou WASD andam um tile, só nas 4 direções (segurando, repete a cada 0,16 s). Só se anda onde há Floor e não há Wall nem outro ator (o tile de uma saída pode sempre ser pisado). Apertar a seta na direção de um ator ou de uma parede não move o jogador, só o vira, e isso não gasta turno.\n\nTurnos: cada jogada do jogador (andar, atacar ou passar a vez com Espaço) é seguida pela jogada de cada inimigo, um de cada vez, com uma pausa de 0,18 s entre eles. Mostre no canto da tela Seu turno ou Turno dos inimigos apenas durante o combate, isto é, quando algum inimigo já está perseguindo o jogador.\n\nCombate com dados, como no D&D. Cada ficha tem hp, ca (classe de armadura), atq (bônus de ataque) e dano = [quantos dados, lados, bônus]. Um ataque rola um d20 e soma o atq; se o total alcançar a ca do alvo, acerta e causa o dano; 20 natural é crítico (dano dobrado) e 1 natural sempre erra. Mostre uma mensagem curta de cada ataque, com o resultado do dado, as últimas mensagens no canto inferior da tela, e o dano em texto flutuante sobre o alvo. O atacante avança um pouco em direção ao alvo e volta, e quem leva dano pisca. Inimigo ferido mostra uma barra de vida pequena sobre ele. O jogador tem 24 de vida, ca 13, atq 4 e dano 1d8+2. Inimigos (type: hp, ca, atq, dano, visao em tiles): skeleton 9, 11, 3, 1d6+1, 5; soldier 12, 13, 3, 1d8, 5; warrior 16, 14, 4, 1d8+2, 5; lancer 13, 13, 4, 1d8+1, 6; acolyte 8, 10, 2, 1d6, 4; mage 7, 11, 5, 1d10, 6; captain 24, 15, 5, 1d10+2, 7; beetle 6, 12, 2, 1d4, 4; wasp 4, 13, 3, 1d4, 6; spider 8, 12, 4, 1d6, 5; snake 5, 11, 3, 1d6, 4. Guarde as fichas numa tabela, para cada inimigo ter as suas.\n\nInimigos: a visao é o raio, em tiles, em que o inimigo começa a perseguir o jogador (e só desiste quando a distância passa de 1,5 vez o raio). Na sua jogada, o inimigo perseguidor ataca se estiver num tile vizinho ao jogador nas 8 direções (as diagonais contam); senão faz uma busca em largura pelos tiles livres (sem parede, sem outros atores e sem o jogador, com no máximo 800 tiles examinados) até um tile vizinho ao jogador (8 direções) e dá o primeiro passo desse caminho. Inimigos longe não fazem nada. Com uma constante DEPURAR, desenhe o círculo de visão de cada inimigo.\n\nInteração com a tecla X: o alvo é quem está no tile à frente do jogador (a última direção apertada) ou, se não houver ninguém ali, qualquer ator num tile vizinho nas 8 direções (inclusive diagonais), com preferência para inimigos. Sempre que existir um alvo e for a vez do jogador, mostre uma dica sobre ele: X: atacar (inimigo) ou X: conversar (NPC). X em um inimigo ataca e gasta o turno; X em um NPC abre o diálogo e não gasta turno. Não é preciso apertar a seta para virar.\n\nNPCs (types: king, queen, boy, farmer, oldman, guard, gravekeeper, adventurer, lumberjack): cada um tem um nome e uma ou duas falas curtas em português, guardados numa tabela. O diálogo aparece numa caixa na parte de baixo da tela, com o nome do NPC e o texto aparecendo letra por letra (45 letras por segundo). X, Espaço, Enter ou um clique mostram o texto inteiro e, depois, passam para a próxima fala; ao fim da última, a caixa fecha. Durante o diálogo o jogo fica parado.\n\nItens: ao pisar num life, o jogador recupera 8 de vida (sem passar do máximo) e o item some, mas só se estiver ferido; com a vida cheia, o item fica e uma mensagem avisa. Saídas: ao chegar ao tile de um objeto de Transitions, carregue o mapa indicado em map e faça o jogador nascer no SpawnPoint cujo id é igual a spawnpoint. A saída só vale quando o jogador chega ao tile (nascer em cima de uma saída não conta). Guarde os mapas já visitados num cache, para voltar a eles do jeito que ficaram.\n\nCâmera: o canvas mostra 30 × 15 tiles. Os mapas maiores (map1 e map2) têm câmera que segue o jogador, limitada às bordas do mapa; num mapa menor que a tela, centralize-o. Uma constante SCALE (padrão 1) dá zoom ao mundo: a câmera usa a vista (W / SCALE por H / SCALE), e HUD, dicas e textos de dano são desenhados em coordenadas de tela, fora do zoom. Tecla G liga e desliga uma grade sobre o mapa. Ao lado de um tile de saída mostre a dica Saída: nome do mapa. Toda dica deve ficar inteira na tela: nas laterais é empurrada para dentro e, sem espaço em cima (borda do mapa ou HUD), vai para baixo do tile. Num painel separado, fora do canvas (um bloco com o título AJUSTES DE COR logo depois da área do jogo), crie sliders de brilho, contraste, saturação e matiz em duas colunas, cada um com o nome à esquerda, o valor em destaque dourado à direita e a barra embaixo, com valores iniciais em constantes (BRILHO, CONTRASTE, SATURACAO e MATIZ, em %, e MATIZ em graus) e um botão Redefinir cores com a largura do próprio texto (não esticado); aplique-os com um filtro CSS no canvas (brightness, contrast, saturate, hue-rotate). HUD: barra de vida (VIDA atual/máxima) no canto superior esquerdo. Quando a vida chega a 0, escureça a tela e mostre Você caiu... e que Enter ou clique recomeça o jogo do primeiro mapa. Se algo der errado ao carregar, mostre a mensagem na tela.",
 "Desenhar imagens": "Crie um exemplo que mostra como desenhar imagens no canvas, em um único arquivo HTML (HTML, CSS e JavaScript puros), com um canvas de 480 × 240 e um laço de animação com requestAnimationFrame. As imagens ficam na pasta assets/images/ ao lado do HTML (mantenha os caminhos): background.png (480 × 240, do tamanho exato do canvas; uma paisagem com mar, uma plataforma de grama cuja superfície começa em y = 176, uma caixa de madeira, uma árvore e uma casa) e fox.png (32 × 32, uma raposa em pixel art olhando para a direita).\n\nCarregue as duas com new Image() e a propriedade src. O carregamento é assíncrono: só desenhe quando img.complete for verdadeiro e img.naturalWidth for maior que 0; enquanto isso mostre o texto Carregando imagens... no canvas. Se algum arquivo não for achado (evento onerror), mostre a mensagem Não achei as imagens em assets/images/.\n\nA cena: primeiro desenhe o fundo com drawImage(img, 0, 0); depois a raposa por cima, em pé sobre a plataforma, com drawImage(img, x, y, largura, altura). O y de uma imagem é o seu topo, então use y = CHAO - altura para a base encostar no chão (CHAO = 176). Use constantes no início para brincar: CHAO (y da superfície onde a raposa pisa), X (x do canto esquerdo, 40 por padrão), ESCALA (1 = tamanho original, 2 = o dobro) e ESPELHAR (false por padrão). Com ESCALA maior a raposa deve continuar pisando no chão. Desligue o suavizamento com ctx.imageSmoothingEnabled = false para manter os pixels nítidos. Para ESPELHAR = true, use ctx.save(), ctx.translate(X + largura, y), ctx.scale(-1, 1), desenhe em (0, 0) e ctx.restore(). No canto superior esquerdo, escreva em letras escuras os valores de x, y e escala usados no desenho. Comente o código em português explicando cada passo, incluindo as três formas do drawImage (3, 5 e 9 argumentos)."
};
// O bônus não é um jogo: o prompt dele é completo (não usa o PROMPT_BASE, que fala de canvas 480 × 240 e game loop)
const PROMPT_BONUS={'Gerador de Sons':"Crie uma mini-ferramenta de efeitos sonoros no estilo do sfxr, em um único arquivo HTML (HTML, CSS e JavaScript puros, sem bibliotecas), pronta para abrir no navegador, com visual escuro e botões grandes, funcionando com mouse, toque e teclado.\n\nO som é um objeto com estes números: onda ('square', 'sawtooth', 'sine', 'triangle' ou 'ruido'), largura (largura do pulso da onda quadrada, 0,1 a 0,9), volume, freq (tom inicial, em Hz) e fim (tom final, em Hz, com deslize exponencial entre os dois), arpSalto (salto de tom em semitons, de -12 a 12) e arpTempo (em que fração do som o salto acontece), ataque, sustento e decaimento (o envelope de volume, em segundos), vibrato (força, 0 a 1) e vibVel (velocidade em Hz) e dois filtros opcionais, passaBaixa e passaAlta, em Hz (20000 e 20 significam desligado).\n\nUma função efeito(p) usa a Web Audio para tocar esse objeto: um oscilador (ou, para ruído, um buffer de ruído branco em loop, em que o tom vira a velocidade de leitura), uma rampa exponencial de frequência com o salto de tom no meio, um segundo oscilador lento ligado ao tom para o vibrato, um GainNode com a rampa do envelope (sobe, segura, desce quase a zero sem estalo) e dois BiquadFilter (lowpass e highpass) antes da saída. A pulso de largura diferente de 50% usa createPeriodicWave com a série de Fourier do pulso. A função usa as variáveis audio (um AudioContext) e mudo, para poder ser colada em outro projeto.\n\nA tela tem: botões de sons prontos (Moeda, Laser, Explosão, Pulo, Dano, Power-up e Blip, cada um sorteando uma variação), Aleatório e Mutar (muda um pouco todos os números), um controle deslizante para cada número, com o valor ao lado, botões para os cinco tipos de onda, uma caixa para tocar ao soltar um controle, um botão Tocar (tecla T) e um desenho da forma de onda feito com OfflineAudioContext e a mesma função efeito, com uma linha que passa enquanto o som toca.\n\nExportar: Copiar função, Copiar som (uma linha como  laser: () => efeito({ onda: 'square', ... }), com o nome que a pessoa escolher, só com letras, números e _), Baixar WAV (16 bits, mono, 44100 Hz, gerado da renderização fora da tela) e uma caixa de texto com o código. O som fica salvo no localStorage.\n\nTudo em português do Brasil, com mensagens curtas e amigáveis.",'Editor de Mapas':"Crie uma mini-ferramenta de edição de mapas em um único arquivo HTML (HTML, CSS e JavaScript puros, sem bibliotecas), pronta para abrir no navegador, com visual escuro e botões grandes, que funcione com mouse, toque e teclado.\n\nO que ela deve ter:\n- Um mapa em grade num <canvas>, de 10 × 8 até 64 × 40 casas (começa em 30 × 15), guardado como uma lista simples com um caractere por casa: # parede, . chão, S início (só um), R rupia, V guarda que anda na vertical e H guarda que anda na horizontal. Os tiles S, R, V e H contam como chão. O mapa inicial é todo parede, com uma salinha e o início dentro dela.\n- Seis botões de tile (teclas 1 a 6) e quatro ferramentas: lápis (B), linha (L, algoritmo de Bresenham), retângulo (R, contorno ou cheio, com uma opção) e balde (G, só para parede e chão). Linha e retângulo mostram uma prévia enquanto se arrasta. O botão direito pinta parede. O início só pode ser colocado com o lápis.\n- Desfazer e refazer (Ctrl+Z e Ctrl+Y) com um histórico de fotos do mapa inteiro, grade ligável, campos de largura e altura (o mapa fica no canto de cima à esquerda) e os botões Limpar (tudo parede), Tudo chão, Moldura (parede em volta) e Gerar salas (sorteia uma sala por célula de uma grade, liga as salas com corredores de 1 casa em zigue-zague, põe o início na primeira sala, uma rupia por sala e alguns guardas).\n- Uma conferência em tempo real: uma busca em largura a partir do início, passando só por casas que não são parede. Rupias e guardas que ela não alcança ganham um contorno vermelho, e uma linha de texto diz se tudo está ao alcance, quantas casas de chão, rupias e guardas existem e o que falta (início ou rupias).\n- Teclado: com o foco no mapa, as setas movem o cursor e Espaço ou Enter pintam (na linha e no retângulo, o primeiro toque começa e o segundo termina; Esc cancela).\n- Exportar: um botão Copiar código que gera e copia o texto const MAPA = [ '####', ... ]; (uma string por linha, só com # e .), const INICIO = { c: 9, l: 6 };, const RUPIAS = [[39, 5], [4, 16]]; e const GUARDAS = [{ c: 22, l: 5, dx: 1, dy: 0 }];. O mesmo texto aparece numa caixa de texto. Importar: um botão Carregar do texto lê essas constantes de volta (e, se não houver aspas, aceita linhas só com # e .).\n- O mapa fica salvo no localStorage.\n\nTudo em português do Brasil, com mensagens curtas e amigáveis.",'Pixel Art':"Crie uma mini-ferramenta de pixel art em um único arquivo HTML (HTML, CSS e JavaScript puros, sem bibliotecas), pronta para abrir no navegador, com visual escuro e botões grandes, que funcione com mouse, toque e teclado.\n\nO que ela deve ter:\n- Um quadro de desenho num <canvas> de 512 × 512 pixels, ampliado sem suavização (imageSmoothingEnabled = false), com fundo quadriculado para mostrar o que é transparente e uma grade opcional. O desenho é uma lista de cores, uma por pixel ('' = transparente), nos tamanhos 8 × 8, 16 × 16, 32 × 32 e 64 × 64 (padrão 16 × 16). Ao trocar o tamanho, o desenho fica no canto superior esquerdo.\n- Uma paleta de 16 cores (#1a1c2c #5d275d #b13e53 #ef7d57 #ffcd75 #a7f070 #38b764 #257179 #29366f #3b5dc9 #41a6f6 #73eff7 #f4f4f4 #94b0c2 #566c86 #333c57), com a cor atual em destaque e um seletor de cor personalizada que adiciona a cor nova à paleta (máximo de 32 cores).\n- Ferramentas: lápis, borracha, balde (flood fill), conta-gotas (volta para o lápis depois de pegar a cor), linha (algoritmo de Bresenham) retângulo e círculo (contorno ou cheio, com uma opção; o círculo é a elipse inscrita na caixa arrastada e vira um círculo quando a caixa é quadrada), com os atalhos B, E, G, I, L, R e C. Arrastar com o lápis liga as casas sem deixar buracos, o botão direito do mouse apaga, e linha, retângulo e círculo mostram uma prévia enquanto você arrasta.\n- Opções: grade ligada ou desligada e espelho horizontal e vertical (o que se pinta aparece simétrico, com uma linha tracejada no eixo).\n- Ações: desfazer e refazer (Ctrl+Z e Ctrl+Y, até 60 passos), limpar o quadro, virar na horizontal, virar na vertical, girar 90° e deslocar o desenho uma casa em cada direção (o que sai de um lado volta pelo outro).\n- Quadros de animação: até 12 quadros, com miniaturas clicáveis e botões para adicionar um quadro vazio, duplicar e excluir. Uma prévia de 128 × 128 pixels mostra o desenho no tamanho de jogo e anima os quadros a 2, 4, 6, 8 ou 12 FPS.\n- Teclado: com o foco no quadro, as setas movem um cursor e Espaço ou Enter usam a ferramenta (linha, retângulo e círculo: um toque começa e outro termina; Esc cancela).\n- Exportar: baixar o quadro atual como PNG (tamanho real, × 4, × 8 ou × 16), baixar uma spritesheet em PNG com todos os quadros lado a lado numa linha e copiar o desenho como texto no formato \"const cores = { K: '#1a1c2c', ... }; const matrizes = [ [ // quadro 0 '....', ... ] ];\", em que cada letra é uma cor e o ponto (.) é transparente. Também abrir uma imagem PNG para editar (até 64 × 64; imagens maiores são reduzidas), tratando os pixels pouco opacos como transparentes.\n- O desenho fica salvo no localStorage (com try/catch e validação do que foi lido) e volta quando a página é aberta de novo.\n\nCódigo simples e didático: nomes de variáveis e funções em português, comentários curtos em português e constantes de configuração no topo. Entregue o arquivo HTML completo em um único bloco de código."};

async function copiarTexto(txt){
  try{await navigator.clipboard.writeText(txt);return true}catch(e){
    const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(e2){}t.remove();return ok;
  }
}

const TABELA_CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=TABELA_CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function montarZip(arqs){                                // arqs: [{nome, dados: Uint8Array}] (sem compressão: PNG já é comprimido)
  const enc=new TextEncoder(),partes=[],central=[],d=new Date();
  const hora=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  const data=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  let pos=0;
  for(const a of arqs){
    const nome=enc.encode(a.nome),n=a.dados.length,crc=crc32(a.dados);
    const loc=new DataView(new ArrayBuffer(30));
    loc.setUint32(0,0x04034b50,true);loc.setUint16(4,20,true);loc.setUint16(6,0x0800,true);loc.setUint16(10,hora,true);loc.setUint16(12,data,true);
    loc.setUint32(14,crc,true);loc.setUint32(18,n,true);loc.setUint32(22,n,true);loc.setUint16(26,nome.length,true);
    partes.push(new Uint8Array(loc.buffer),nome,a.dados);
    const cen=new DataView(new ArrayBuffer(46));
    cen.setUint32(0,0x02014b50,true);cen.setUint16(4,20,true);cen.setUint16(6,20,true);cen.setUint16(8,0x0800,true);cen.setUint16(12,hora,true);cen.setUint16(14,data,true);
    cen.setUint32(16,crc,true);cen.setUint32(20,n,true);cen.setUint32(24,n,true);cen.setUint16(28,nome.length,true);cen.setUint32(42,pos,true);
    central.push(new Uint8Array(cen.buffer),nome);
    pos+=30+nome.length+n;
  }
  const tam=central.reduce((t,x)=>t+x.length,0),fim=new DataView(new ArrayBuffer(22));
  fim.setUint32(0,0x06054b50,true);fim.setUint16(8,arqs.length,true);fim.setUint16(10,arqs.length,true);fim.setUint32(12,tam,true);fim.setUint32(16,pos,true);
  return new Blob([...partes,...central,new Uint8Array(fim.buffer)],{type:'application/zip'});
}
async function baixarAssets(c){
  const cfg=ASSETS_ZIP[c.n],pagina=new URL('.',location.href).href,base=new URL(cfg.pasta,location.href),arqs=[],feitos=new Set();
  const buscar=async(url,opcional)=>{
    let r;try{r=await fetch(url)}catch(e){throw new Error('não deu para ler '+url+'. Abra o guia por um servidor local (python -m http.server)')}
    if(!r.ok){if(opcional)return null;throw new Error(url+' (erro '+r.status+')')}
    return new Uint8Array(await r.arrayBuffer());
  };
  const juntar=async(rel,relativoA,opcional)=>{            // busca um arquivo e guarda no zip com o caminho a partir da pasta do guia
    const url=new URL(rel,relativoA);
    const nome=decodeURIComponent(url.href.startsWith(pagina)?url.href.slice(pagina.length):url.pathname.replace(/^\//,''));
    if(feitos.has(nome))return null;feitos.add(nome);
    const dados=await buscar(url.href,opcional);if(dados)arqs.push({nome,dados});
    return dados;
  };
  for(const f of cfg.arquivos)await juntar(f,base);
  for(const f of cfg.opcionais||[])await juntar(f,base,true);
  for(const nomeMapa of (cfg.mapas||(cfg.mapa?[cfg.mapa]:[]))){          // um ou vários mapas .tmx
    const urlMapa=new URL(nomeMapa,base),bytes=await juntar(nomeMapa,base);
    if(bytes){
      const lerXML=b=>new DOMParser().parseFromString(new TextDecoder().decode(b),'application/xml');
      const imagens=async(xml,rel)=>{for(const im of xml.querySelectorAll('image[source]'))await juntar(im.getAttribute('source'),rel)};
      const xml=lerXML(bytes);
      await imagens(xml,urlMapa);                          // tilesets embutidos no .tmx
      for(const ts of xml.querySelectorAll('tileset[source]')){   // tilesets em arquivo .tsx separado
        const urlTsx=new URL(ts.getAttribute('source'),urlMapa),b=await juntar(ts.getAttribute('source'),urlMapa);
        if(b)await imagens(lerXML(b),urlTsx);
      }
    }
  }
  const url=URL.createObjectURL(montarZip(arqs));
  const a=document.createElement('a');
  a.href=url;a.download='assets-'+sem(c.n).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')+'.zip';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function baixarHTML(c,codigo){
  const seguro=codigo.replace(/<\/(script)/gi,'<\\/$1').replace(new RegExp('<'+'!--','g'),'<\\!--');   // o código não pode fechar o <script> da página
  const titulo=c.n.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const pagina=[
    '<!DOCTYPE html>',
    '<html lang="pt-BR">',
    '<head>',
    '<meta charset="utf-8">',
    '<meta name="viewport" content="width=device-width, initial-scale=1">',
    '<title>'+titulo+' | Games 2D com JavaScript</title>',
    '<style>',
    ESTILO_HTML,
    '</style>',
    '</head>',
    '<body>',
    '<canvas id="cv" tabindex="0" width="480" height="240" aria-label="Tela do jogo"></canvas>',
    '<div id="err" role="alert"></div>',
    '<scr'+'ipt>',
    EXECUTOR_HTML,
    '</scr'+'ipt>',
    '<scr'+'ipt>',
    '// ---------- Código do jogo (vem do editor do guia) ----------',
    '(function (ctx, W, H, keys, mouse, loop) {',
    seguro,
    '})(ctx, W, H, keys, mouse, loop);',
    '</scr'+'ipt>',
    '</body>',
    '</html>',
    ''
  ].join('\n');
  const url=URL.createObjectURL(new Blob([pagina],{type:'text/html;charset=utf-8'}));
  const a=document.createElement('a');
  a.href=url;a.download='jogo-'+sem(c.n).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')+'.html';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

function rodar(){
  const minha=++exec;                                     // invalida qualquer loop de execuções anteriores
  cancelAnimationFrame(raf);
  $('#err').textContent='';
  const cv=$('#cv');
  const k=Math.max(1,Math.round(cv.clientWidth*(devicePixelRatio||1)))/W;   // resolução = tamanho exibido
  cv.width=Math.round(W*k);cv.height=Math.round(H*k);largura=cv.clientWidth;
  const ctx=cv.getContext('2d');ctx.scale(k,k);
  try{new Function('ctx','W','H','keys','mouse','loop',$('#ed').value)(ctx,W,H,keys,mouse,criarLoop(minha))}catch(e){erro(e)}
}

'Aleatoriedade e mapas':{d:`Sortear só a sala não basta: o centro dela pode ser a escada, e uma rupia pode cair no mesmo lugar. Coloque os inimigos <b>depois</b> da escada e das rupias e sorteie uma posição dentro da sala. Só vale se o tile for chão vazio (<code>'.'</code>); se estiver ocupado, tente de novo.`,e:`Os 3 inimigos (<code>inimigos</code>) nascem depois da escada e das rupias, em tiles de chão vazio (<code>'.'</code>) de salas sorteadas com <code>sortear(salas.slice(1))</code>: nunca na primeira sala, nunca sobre a escada, uma rupia ou outro inimigo.`,r:[[`let mapa, salas, tema, semente, nivel = 1,`,`let inimigos = [], mapa, salas, tema, semente, nivel = 1,`],[`      if (mapa[l][c] === '.' && !(c === ini.c && l === ini.l)) { mapa[l][c] = 'r'; total++; break; }\n    }\n  }\n}\nnovaFase(true);`,`      if (mapa[l][c] === '.' && !(c === ini.c && l === ini.l)) { mapa[l][c] = 'r'; total++; break; }\n    }\n  }\n\n  // 3 inimigos, depois da escada e das rupias: só em chão vazio de uma sala que não seja a primeira\n  inimigos = [];\n  if (salas.length > 1) {\n    for (let i = 0; i < 3; i++) {\n      for (let k = 0; k < 100; k++) {\n        const s = sortear(salas.slice(1));\n        const c = inteiro(s.x, s.x + s.w - 1), l = inteiro(s.y, s.y + s.h - 1);\n        const ocupado = inimigos.some(e => Math.floor(e.x / T) === c && Math.floor(e.y / T) === l);\n        if (mapa[l][c] === '.' && !ocupado) {            // '>' e 'r' não valem: o tile precisa estar vazio\n          inimigos.push({ x: c * T + T / 2, y: l * T + T / 2 });\n          break;\n        }\n      }\n    }\n  }\n}\nnovaFase(true);`],[`  ctx.fillStyle = '#1c130b'; ctx.fillRect(heroi.x - 7, heroi.y - 7, 14, 14);   // contorno`,`  ctx.fillStyle = '#e0483e';\n  inimigos.forEach(e => { ctx.beginPath(); ctx.arc(e.x, e.y, 6, 0, Math.PI * 2); ctx.fill(); });\n  ctx.fillStyle = '#1c130b'; ctx.fillRect(heroi.x - 7, heroi.y - 7, 14, 14);   // contorno`]]},
'Plataforma com tilemap':{d:`Guarde cada moeda como um objeto com a posição (por exemplo, o centro de um tile: <code>c * T + T / 2</code>). A cada quadro, use <code>filter</code> para manter só as moedas que o jogador <b>não</b> tocou, e some pontos para cada uma que sumir. O teste de toque é o mesmo de sobreposição de retângulos do capítulo de colisão.`,e:`Sete moedas ficam espalhadas pelo cenário: no chão, sobre plataformas e no ar (lista <code>moedas</code>, escrita como coluna e linha do tile). Quando o jogador encosta em uma, o <code>filter</code> a remove e <code>pontos</code> sobe 10. O painel mostra a pontuação e quantas já foram pegas.`,r:[[`let puloAntes = false;`,`let puloAntes = false, pontos = 0, tempo = 0;\n\n// moedas: [coluna, linha] de cada uma, no centro do tile (sobre plataformas e no chão)\nlet moedas = [[3, 8], [7, 6], [12, 6], [5, 4], [15, 4], [13, 2], [17, 8]]\n  .map(([c, l]) => ({ x: c * T + T / 2, y: l * T + T / 2 }));\nconst TOTAL = moedas.length;`],[`  // ---------- desenho ----------`,`  // moedas: se o jogador encosta, ela some (filter) e a pontuação sobe\n  tempo += dt;\n  moedas = moedas.filter(m => {\n    const pegou = p.x < m.x + 6 && p.x + p.w > m.x - 6 && p.y < m.y + 6 && p.y + p.h > m.y - 6;\n    if (pegou) pontos += 10;\n    return !pegou;                       // fica na lista só quem NÃO foi pego\n  });\n\n  // ---------- desenho ----------`],[`  ctx.fillStyle = '#ffd34e'; ctx.fillRect(p.x, p.y, p.w, p.h);`,`  moedas.forEach(m => {                  // a moeda "gira": a largura oscila entre 1 e 6\n    const larg = Math.max(1, 6 * Math.abs(Math.cos(tempo * 4 + m.x)));\n    ctx.fillStyle = '#b8860b'; ctx.beginPath(); ctx.ellipse(m.x, m.y, larg, 6, 0, 0, Math.PI * 2); ctx.fill();\n    ctx.fillStyle = '#ffe566'; ctx.beginPath(); ctx.ellipse(m.x, m.y, Math.max(0.5, larg - 1.5), 4.5, 0, 0, Math.PI * 2); ctx.fill();\n  });\n  ctx.fillStyle = '#ffd34e'; ctx.fillRect(p.x, p.y, p.w, p.h);`],[`  ctx.fillText('no chão: '`,`  ctx.fillText('pontos: ' + pontos + '   moedas: ' + (TOTAL - moedas.length) + '/' + TOTAL, 30, 72);\n  if (!moedas.length) ctx.fillText('Todas as moedas!', 30, 92);\n  ctx.fillText('no chão: '`]]},
'Mapas do Tiled':{d:`A posição de uma célula na lista de dados é <code>linha * colunas + coluna</code>. Para achar o tile sob os pés, divida o centro da caixa em x e a base dela em y por <code>T</code>, com <code>Math.floor</code>.`,e:`O painel ganhou uma linha com a coluna e a linha do tile sob os pés e o <code>gid</code> dele, lido direto da camada: <code>chao[linha * mapa.cols + coluna]</code>. No ar, a célula sob os pés está vazia e o gid mostra 0.`,r:[[`    ctx.fillText('estado: ' + p.estado + '   quadro: ' + quadro + ' de ' + f.n, 8, 28);`,`    ctx.fillText('estado: ' + p.estado + '   quadro: ' + quadro + ' de ' + f.n, 8, 28);
    const cp = Math.floor((p.x + p.w / 2) / T), lp = Math.floor((p.y + p.h) / T);   // tile sob os pés
    ctx.fillText('pisando: coluna ' + cp + ', linha ' + lp + '   gid: ' + (chao[lp * mapa.cols + cp] || 0), 8, 42);`]]},
'Y Sorting':{d:`Um objeto está na frente do coelho quando a base dele é maior (mais abaixo) e os desenhos se sobrepõem. Crie uma caixa para o corpo do coelho, uma função <code>escondendo(o)</code> que faça esse teste para um objeto, e use <code>ctx.globalAlpha</code> ao desenhar cada objeto da fila (e não o coelho).`,e:`A função <code>escondendo(o)</code> devolve <code>true</code> quando o objeto tem <code>base</code> maior que a dos pés e a caixa <code>corpo</code> (14 × 18, acima dos pés) sobrepõe a caixa dele. Na fila, cada objeto que esconde o coelho é desenhado com <code>globalAlpha = 0.5</code>, e o valor volta a 1 logo depois. O coelho é desenhado normal, e aparece através da árvore.`,r:[[`    const desenharCoelho = () => {`,`    // a caixa do corpo do coelho (14 × 18, acima dos pés): é ela que o desenho de um objeto pode cobrir\n    const corpo = { x: p.x + p.w / 2 - 7, y: p.y + p.h - 18, w: 14, h: 18 };\n    // o coelho está ATRÁS deste objeto? (a base do objeto está mais abaixo e os desenhos se sobrepõem)\n    const escondendo = (o) => o.base > p.y + p.h && sobrepoe(corpo, o);\n\n    const desenharCoelho = () => {`],[`      .map(o => ({ y: o.base, desenhar: () => ctx.drawImage(o.img, o.x, o.y) }));`,`      .map(o => ({ y: o.base, desenhar: () => {\n        ctx.globalAlpha = escondendo(o) ? 0.5 : 1;                // objeto meio transparente quando o coelho está atrás\n        ctx.drawImage(o.img, o.x, o.y);\n        ctx.globalAlpha = 1;\n      } }));`]]},
'Labirintos e cavernas':{d:`Desenhe tudo normalmente e, no fim, cubra a tela de preto com um buraco redondo ao redor do jogador. O raio do buraco é 5 tiles (<code>5 * T</code>).`,e:`Antes do painel, tudo é coberto de preto, com um buraco redondo de 5 tiles ao redor do jogador.`,r:[[`  ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textAlign = 'left';`,`  ctx.fillStyle = '#000';                                  // escuridão: tudo preto, menos o círculo de luz
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.arc(jogador.x, jogador.y, 5 * T, 0, Math.PI * 2);
  ctx.fill('evenodd');

  ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textAlign = 'left';`]]},
'Névoa de guerra e visão':{d:`O raio de visão é a variável <code>raio</code>, em pixels (7 tiles = <code>7 * T</code>). Troque o valor dela quando a tecla for apertada, do mesmo jeito que a tecla R recomeça o jogo.`,e:`A tecla Espaço alterna <code>raio</code> entre 7 e 3 tiles. Como <code>veTile</code> e o desenho usam <code>raio</code>, a visão e o escurecimento se ajustam sozinhos.`,r:[[`  if (apertou('r')) novoJogo();`,`  if (apertou('r')) novoJogo();\n  if (apertou(' ')) raio = raio > 3 * T ? 3 * T : 7 * T;   // lanterna: alterna entre raio longo e curto`]]},
'Salvar progresso':{d:`O save é um objeto convertido em texto. Ao ler, use <code>|| 0</code> para dar um valor padrão a quem tem um save antigo sem o campo novo.`,e:`Novo campo <code>carteira</code>: padrão 0 (inclusive em saves antigos), +1 por rupia, salvo com o resto e mostrado no título.`,r:[[`recorde: 0, partidas: 0 };`,`recorde: 0, partidas: 0, carteira: 0 };`],[`partidas: inteiroOk(d.partidas, 0) ? d.partidas : PADRAO.partidas

      carteira: inteiroOk(d.carteira, 0) ? d.carteira : PADRAO.carteira   // save antigo sem o campo: usa 0
`],[`{ pontos++; coletadas++; return novaRupia(); }`,`{ pontos++; coletadas++; dados.carteira++; return novaRupia(); }`],[`'   Partidas: ' + dados.partidas, 128, 14);`,`'   Partidas: ' + dados.partidas + '   Carteira: ' + dados.carteira, 128, 14);`]]},
'Partículas e Asteroids':{d:`Crie uma receita de partículas azuis (como <code>explosao</code>) e use-a duas vezes: antes de mover a nave e depois. Mover a nave é sortear <code>x</code> e <code>y</code> com <code>rnd</code>.`,e:`Tecla H: hiperespaço. A nave some, reaparece num ponto sorteado e há uma explosão azul (<code>azul</code>) na saída e na chegada.`,r:[[`// ---------- asteroides ----------`,`const azul = (x, y) => emitir(x, y, 20,
  { vmin: 30, vmax: 150, vida: 0.6, tam: 2.5, cores: ['#7ddcff', '#ffffff', '#4aa3e0'], atrito: 3 });

// ---------- asteroides ----------`],[`    nave.motor = !!(keys.ArrowUp || keys.w);`,`    if (keys.h && !antes.h) {                          // hiperespaço

        if (livres.length) dourada = Object.assign(livres[Math.floor(Math.random() * livres.length)], { tempo: 5 });

        if (dourada.tempo <= 0) { dourada = null; proxDourada = 8 + Math.random() * 7; }

  if (dourada && c === dourada.c && l === dourada.l) {   // comida dourada: 50 pontos
    pontos += 50; dourada = null; proxDourada = 8 + Math.random() * 7;
  }`],[`  cobra.forEach((s, i) => {`,`  if (dourada && (dourada.tempo > 1 || Math.floor(dourada.tempo * 8) % 2)) {   // pisca no último segundo
