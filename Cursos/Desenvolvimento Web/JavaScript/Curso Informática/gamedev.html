    $('#cpprompt').onclick=async()=>{
      const ok=await copiarTexto(texto),b=$('#cpprompt');
      b.textContent=ok?'✔ Copiado!':'Selecione e copie (Ctrl+C)';
      setTimeout(()=>{b.textContent='Copiar prompt'},1800);
    };
  }
  if(AJUDA[c.n]){
    const sol=AJUDA[c.n].r.reduce((t,[a,b])=>t.split(a).join(b),c.c);   // código original + a mudança do desafio
    $('#solcod').textContent=sol;
    $('#usasol').onclick=()=>{ed.value=sol;ed.dispatchEvent(new Event('input'));rodar()};
    $('#cpsol').onclick=async()=>{
      let ok=false;
      try{await navigator.clipboard.writeText(sol);ok=true}catch(e){
        const t=document.createElement('textarea');t.value=sol;document.body.appendChild(t);t.select();
        try{ok=document.execCommand('copy')}catch(e2){}t.remove();
      }
      const b=$('#cpsol');b.textContent=ok?'✔ Copiado!':'Selecione e copie (Ctrl+C)';
      setTimeout(()=>{b.textContent='Copiar código'},1800);
    };
  }
  ed.addEventListener('keydown',e=>{
    if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'  ')}
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();rodar()}
  });
  const cv=$('#cv');
  cv.addEventListener('pointermove',e=>{
    const r=cv.getBoundingClientRect();
    mouse.x=Math.max(0,Math.min(W,(e.clientX-r.left)*W/r.width));
    mouse.y=Math.max(0,Math.min(H,(e.clientY-r.top)*H/r.height));
  });
  cv.addEventListener('pointerdown',()=>{cv.focus();mouse.down=true});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{mouse.down=false}));
  if($('#prev'))$('#prev').onclick=()=>{location.hash='cap-'+(atual-1)};
  if($('#next'))$('#next').onclick=()=>{location.hash='cap-'+(atual+1)};
  finalizarPagina(c);
  rodar();
  scrollTo(0,0);
}
function rota(){const m=location.hash.match(/cap-(\d+)/);mostrar(m?+m[1]:0)}
// ---------- Glossário ----------
const GLOS=[
{t:'A*',d:`Algoritmo que acha o caminho mais curto entre dois tiles de um mapa. A cada passo ele expande o tile de menor <code>f = g + h</code>, em que <code>g</code> é o custo já percorrido e <code>h</code> é a estimativa até o alvo.`,c:'Inteligência dos inimigos'},
{t:'AABB',d:`Sigla de Axis-Aligned Bounding Box: um retângulo alinhado aos eixos, sem rotação. Dois AABB colidem quando se sobrepõem no eixo x e no eixo y ao mesmo tempo.`,c:'Colisão'},
{t:'Atrito',d:`Perda gradual de velocidade, como se algo freasse o objeto. No guia, a velocidade é multiplicada por um fator menor que 1 a cada quadro (com <code>Math.exp</code>), então a freada não depende do FPS.`,c:'Física simples'},
{t:'Autômato celular',d:`Grade em que cada célula muda de valor segundo uma regra que olha só os vizinhos, repetida em várias rodadas. Serve para gerar cavernas a partir de ruído.`,c:'Labirintos e cavernas'},
{t:'Busca em largura (BFS)',d:`Percorre um mapa em ondas, tile a tile a partir do início, contando os passos. O último tile alcançado é o mais distante.`,c:'Labirintos e cavernas'},
{t:'Busca em profundidade',d:`Segue por um caminho até não ter mais saída e só então volta atrás, usando uma pilha. Gera labirintos de corredores longos e sinuosos.`,c:'Labirintos e cavernas'},
{t:'Canvas',d:`Elemento <code>&lt;canvas&gt;</code> do HTML: uma tela em branco onde o jogo é desenhado por código.`,c:'Desenhar'},
{t:'Câmera',d:`Ponto (<code>cam.x</code>, <code>cam.y</code>) que define que pedaço do mundo aparece na tela. Tudo é desenhado deslocado com <code>ctx.translate(-cam.x, -cam.y)</code>.`,c:'Câmera'},
{t:'Colisão por eixo',d:`Técnica para colisão em mapas de tiles: move o personagem só no eixo X e resolve a batida, depois só no eixo Y e resolve de novo. Assim se sabe de que lado foi a batida.`,c:'Plataforma com tilemap'},
{t:'Coordenadas',d:`O ponto (0, 0) fica no canto superior esquerdo do canvas. O x cresce para a direita e o y cresce para baixo.`,c:'Coordenadas'},
{t:'Coyote time',d:`Pequena tolerância (cerca de 0,1 s) que ainda permite pular logo depois de sair da borda de uma plataforma.`,c:'Plataforma com tilemap'},
{t:'ctx',d:`O contexto 2D do canvas, o seu pincel. Guarda as cores (<code>fillStyle</code>) e as formas que você pode desenhar (<code>fillRect</code>, <code>arc</code>...).`,c:'Desenhar'},
{t:'Delta time (dt)',d:`O tempo, em segundos, desde o quadro anterior: o parâmetro <code>dt</code> do <code>loop</code>. Com <code>posição += velocidade * dt</code>, o jogo anda na mesma velocidade em qualquer computador.`,c:'Animação'},
{t:'drawImage()',d:`Método do <code>ctx</code> que desenha uma imagem no canvas. Tem três formas: <code>drawImage(img, x, y)</code>, <code>drawImage(img, x, y, largura, altura)</code> e a de recorte, com nove argumentos. O <code>(x, y)</code> é o canto superior esquerdo da imagem.`,c:'Desenhar imagens'},
{t:'Elasticidade',d:`Quanto da velocidade o objeto conserva ao quicar. Perto de 1, ele quica sem perder energia. Perto de 0, quase não quica.`,c:'Física simples'},
{t:'Estado (máquina de estados)',d:`Variável que guarda em que situação o jogo (ou um inimigo) está: <code>'titulo'</code>, <code>'jogando'</code>, <code>'pausa'</code>, <code>'fim'</code>... A cada quadro o loop olha o estado e decide o que atualizar e o que desenhar. Trocar de tela é só mudar o valor.`,c:'Estados do jogo'},
{t:'Flood fill',d:`Busca em área: parte de um tile e se espalha pelos vizinhos do mesmo tipo. Serve para descobrir quais pedaços de chão estão ligados entre si.`,c:'Labirintos e cavernas'},
{t:'FPS',d:`Quadros por segundo: quantas vezes o loop roda em um segundo. Para medir, conte os quadros e feche a conta a cada segundo.`,c:'Depuração'},
{t:'Game loop',d:`O ciclo que o jogo repete muitas vezes por segundo: atualizar posições, limpar a tela e desenhar de novo. No guia, é a função <code>loop(dt)</code>.`,c:'Animação'},
{t:'Geração procedural',d:`Criar conteúdo, como mapas, por código, com regras e sorteios, em vez de desenhar tudo à mão.`,c:'Aleatoriedade e mapas'},
{t:'Gravidade',d:`Aceleração que puxa para baixo. A cada quadro ela é somada à velocidade vertical (<code>vy += gravidade * dt</code>), e a velocidade muda a posição.`,c:'Gravidade e pulo'},
{t:'Hitbox',d:`Retângulo (ou círculo) invisível usado para testar colisões. Pode ser menor que o desenho, e vale desenhá-lo com <code>strokeRect</code> para depurar.`,c:'Depuração'},
{t:'Image',d:`Objeto do navegador que representa uma imagem. Você o cria com <code>new Image()</code> e diz o arquivo em <code>src</code>. O carregamento é assíncrono: confira <code>complete</code> e <code>naturalWidth</code> antes de desenhar.`,c:'Desenhar imagens'},
{t:'imageSmoothingEnabled',d:`Propriedade do <code>ctx</code> que liga ou desliga o suavizamento ao ampliar imagens. Em pixel art, use <code>false</code> para manter os pixels nítidos em vez de borrados.`,c:'Desenhar imagens'},
{t:'Linha de visão',d:`Reta imaginária entre dois pontos. Se houver uma parede no caminho, um não enxerga o outro. No guia, o jogo anda por essa reta de 4 em 4 pixels e confere os tiles que ela atravessa.`,c:'Névoa de guerra e visão'},
{t:'localStorage',d:`Memória do navegador que guarda texto mesmo depois de fechar a página. É onde o guia salva o progresso.`,c:'Salvar progresso'},
{t:'Névoa de guerra',d:`Efeito em que o mapa só aparece onde o jogador já esteve ou onde está vendo agora. O que nunca foi visto fica preto, e o que foi visto antes fica escurecido.`,c:'Névoa de guerra e visão'},
{t:'Oscilador',d:`Na Web Audio API, o objeto que gera uma onda sonora numa certa frequência em Hz (440 é o Lá). Os sons do guia são criados assim, por código.`,c:'Som com Web Audio'},
{t:'Partícula',d:`Objeto minúsculo e de vida curta (posição, velocidade e tempo de vida), usado em explosões, faíscas e poeira. Todas ficam numa lista e somem quando a vida acaba.`,c:'Partículas e Asteroids'},
{t:'Pulo variável',d:`Técnica em que a altura do pulo depende de quanto tempo o botão fica apertado: soltar durante a subida aumenta a gravidade e corta o pulo.`,c:'Plataforma com tilemap'},
{t:'Quadro (frame)',d:`Cada imagem desenhada pelo loop. Também é o nome de cada desenho de uma animação de sprite.`,c:'Animação'},
{t:'Radiano',d:`Unidade de ângulo usada por <code>Math.sin</code>, <code>Math.cos</code> e <code>Math.atan2</code>. Uma volta completa vale 2π, ou cerca de 6,28.`,c:'Ângulos e mira'},
{t:'Seno, cosseno e atan2',d:`<code>Math.atan2(dy, dx)</code> devolve o ângulo da direção entre dois pontos. <code>Math.cos</code> e <code>Math.sin</code> fazem o caminho de volta: transformam um ângulo numa direção (x, y).`,c:'Ângulos e mira'},
{t:'Semente (seed)',d:`Número que inicia um gerador pseudoaleatório. A mesma semente produz sempre a mesma sequência, e portanto o mesmo mapa.`,c:'Aleatoriedade e mapas'},
{t:'Sprite',d:`Imagem pequena de um personagem ou objeto. No guia, o sprite sai de uma matriz de letras (uma cor por letra), vira imagem uma vez e é ampliado com <code>drawImage</code>.`,c:'Sprites e animação'},
{t:'Tile',d:`Quadradinho de tamanho fixo (<code>T</code> × <code>T</code> pixels) que forma um mapa. Para achar o tile sob um ponto, divida a coordenada por <code>T</code>: <code>Math.floor(x / T)</code>.`,c:'Plataforma com tilemap'},
{t:'Tilemap',d:`Mapa feito de tiles, geralmente uma lista de linhas de texto em que cada caractere é um tipo de tile (<code>#</code> parede, <code>.</code> chão).`,c:'Plataforma com tilemap'},
{t:'Vetor de velocidade',d:`A velocidade de um objeto 2D tem duas partes: <code>vx</code> (horizontal) e <code>vy</code> (vertical). A rapidez total é <code>Math.hypot(vx, vy)</code>.`,c:'Física simples'},
{t:'Árvore de diálogo',d:`Conversa guardada como dados: cada fala aponta para a próxima (<code>vai</code>), e as escolhas do jogador abrem caminhos diferentes. Escrever uma conversa nova não exige mexer no código.`,c:'Diálogos e menus'},
{t:'Efeito máquina de escrever',d:`Texto que aparece letra por letra. Um contador decimal sobe <code>VEL * dt</code> por quadro e <code>slice</code> mostra só as primeiras letras.`,c:'Diálogos e menus'},
{t:'Quebra de linha (word wrap)',d:`Dividir um texto em linhas que cabem numa largura. Mede-se cada palavra com <code>ctx.measureText</code> e abre-se uma linha nova quando a medida passa do limite.`,c:'Diálogos e menus'},
{t:'Spritesheet (folha de sprites)',d:`Imagem com os quadros de uma animação lado a lado. Para desenhar um quadro, usa-se <code>drawImage</code> com 9 argumentos: o pedaço da imagem a copiar e o lugar onde colar.`,c:'Spritesheet e estados'},
{t:'Âncora (pivô)',d:`Ponto do quadro que fica fixo na posição do personagem. Nos jogos de plataforma costuma ser o meio dos pés: assim o personagem pisa no chão mesmo que a folha ou a escala mudem.`,c:'Spritesheet e estados'},
{t:'Menor deslocamento',d:`Regra para tirar um objeto de dentro de outro: empurre-o pela menor distância que desfaz a sobreposição. Entre dois retângulos, compare quanto um invade o outro nos quatro lados e escolha o menor.`,c:'Colisão avançada'},
{t:'Círculo contra retângulo',d:`Ache o ponto do retângulo mais perto do centro do círculo, limitando o x e o y do centro às bordas. Se a distância até ele for menor que o raio, houve batida.`,c:'Colisão avançada'},
{t:'Tiled',d:`Editor de mapas gratuito. Você desenha o mapa por camadas e o Tiled grava num arquivo <code>.tmx</code> (XML) ou <code>.json</code>, que o jogo lê.`,c:'Mapas do Tiled'},
{t:'Camada (layer)',d:`Uma "folha transparente" do mapa, empilhada do fundo para a frente. Camadas de tiles guardam uma grade de números, e camadas de objetos guardam formas com posição, como o ponto inicial do jogador.`,c:'Mapas do Tiled'},
{t:'gid',d:`Número de cada tile no Tiled, contado a partir de 1 (o <code>0</code> é célula vazia). Para achar o desenho na imagem: <code>k = gid - firstgid</code>, coluna <code>k % columns</code> e linha <code>Math.floor(k / columns)</code>.`,c:'Mapas do Tiled'},
{t:'Promise e async/await',d:`Uma Promise representa um resultado que ainda vai chegar, como um arquivo sendo carregado. Dentro de uma função <code>async</code>, o <code>await</code> espera a Promise terminar antes de seguir para a próxima linha.`,c:'Mapas do Tiled'},
{t:'Servidor local',d:`Programa que entrega os arquivos de uma pasta pelo endereço <code>http://localhost</code>. O navegador exige isso para o <code>fetch</code> ler arquivos, como o mapa. Exemplo: <code>python -m http.server</code>.`,c:'Mapas do Tiled'},
{t:'Canvas fora da tela',d:`Canvas criado por código e nunca mostrado. Serve para desenhar algo pesado uma vez (como o mapa inteiro) e depois só recortar o pedaço visível a cada quadro.`,c:'Mapas do Tiled'},
{t:'Y Sorting',d:`Ordenar o que será desenhado pelo <code>y</code> da base de cada coisa, do menor para o maior. Quem está mais abaixo na tela é desenhado por último e fica na frente. É o que faz o personagem passar por trás e pela frente de uma árvore.`,c:'Y Sorting'},
{t:'Algoritmo do pintor',d:`Desenhar do mais distante para o mais próximo, como um pintor que cobre o fundo com os objetos da frente. O Y Sorting é isso, usando o <code>y</code> como medida de distância.`,c:'Y Sorting'},
{t:'Top-down (vista de cima)',d:`Jogo visto de cima ou de cima e de lado, como os RPGs clássicos. O personagem anda nas quatro (ou oito) direções, e a colisão costuma usar só a área dos pés.`,c:'Y Sorting'},
{t:'Pisão (stomp)',d:`Derrotar um inimigo caindo sobre a cabeça dele, como no Mario. A regra: o jogador está caindo (<code>vy &gt; 0</code>) e, no quadro anterior, os pés dele estavam acima do meio do inimigo. Qualquer outro encontro é dano.`,c:'Jogo final'},
{t:'Invulnerabilidade',d:`Intervalo logo depois de levar dano em que novos golpes não contam. O personagem pisca para avisar. Sem isso, um inimigo encostado tiraria todas as vidas em poucos quadros.`,c:'Jogo final'},
{t:'Parallax',d:`Efeito de profundidade: os fundos mais distantes andam mais devagar que a câmera. Em código, o deslocamento do fundo é o da câmera multiplicado por um número entre 0 e 1.`,c:'Jogo final'},
{t:'Propriedade (Tiled)',d:`Par nome e valor que você anexa a um objeto no Tiled, como <code>type = enemy1</code> ou <code>map = map2.tmx</code>. O jogo lê esses pares do arquivo e decide o que fazer, sem mudar o programa.`,c:'Jogo final'},
{t:'Interpolação (lerp)',d:`Aproximar um valor do alvo aos poucos: <code>x += (alvo - x) * k</code>. Com <code>k</code> pequeno, a câmera desliza até o jogador em vez de pular.`,c:'Jogo final'},
{t:'Pixel art',d:`Desenho feito pixel a pixel numa grade pequena, com poucas cores. Para ampliar sem borrar, use <code>ctx.imageSmoothingEnabled = false</code>.`,c:'Pixel Art'},
{t:'Paleta de cores',d:`Lista pequena de cores usada em um desenho. Com poucas cores o resultado fica coerente, e cada cor pode ganhar uma letra para virar texto (<code>K</code> preto, <code>R</code> vermelho...), como na matriz do capítulo Sprites e animação.`,c:'Pixel Art'},
{t:'Algoritmo de Bresenham',d:`Jeito de achar quais casas de uma grade formam uma reta entre dois pontos, sem buracos e só com contas de números inteiros. A ferramenta de linha do Pixel Art usa ele.`,c:'Pixel Art'},
{t:'Minimapa',d:`Versão pequena do mapa, num canto da tela, que mostra onde o jogador está e o que ele já explorou. No guia ele é uma imagem de 1 pixel por tile, pintada quando o tile é descoberto e ampliada a cada quadro.`,c:'Minimapa'},
{t:'Conversão mundo → minimapa',d:`Para achar um ponto do mundo no minimapa: divida a posição em pixels por <code>T</code> (vira tiles), multiplique pela escala <code>e</code> do minimapa e some o canto dele: <code>mx + x / T * e</code>.`,c:'Minimapa'},
{t:'Envelope de volume',d:`Como o volume de um som muda ao longo do tempo: ele sobe (<b>ataque</b>), fica estável (<b>sustentação</b>) e desce (<b>decaimento</b>). Terminar em um valor bem pequeno, e não em zero, evita o estalo.`,c:'Gerador de Sons'},
{t:'Ruído branco',d:`Som feito de valores aleatórios, sem um tom definido. É a base de explosões, passos e chiados, e os filtros ajudam a moldar o resultado.`,c:'Gerador de Sons'},
{t:'Raycasting',d:`Técnica que cria uma visão 3D a partir de um mapa 2D: para cada coluna da tela, um raio sai do jogador e acha a parede em que bate. A altura da faixa desenhada é proporcional a <code>1 / distância</code>.`,c:'Raycasting'},
{t:'DDA (raio na grade)',d:`Algoritmo que anda um raio pela grade saltando de linha em linha (a mais próxima, vertical ou horizontal) até achar uma casa de parede. É rápido e exato.`,c:'Raycasting'},
{t:'Olho de peixe',d:`Distorção em que paredes retas parecem curvas, porque a distância de cada raio é medida em linha reta até o olho. Corrige-se usando a distância perpendicular à tela: <code>dist * Math.cos(desvio)</code>.`,c:'Raycasting'},
{t:'Billboard (sprite que encara)',d:`Objeto 2D desenhado sempre de frente para o jogador num mundo 3D falso. A coluna vem de <code>Math.atan2</code> e o tamanho, de <code>1 / distância</code>.`,c:'Raycasting'},
{t:'FOV (campo de visão)',d:`Sigla de <i>Field of View</i>: o ângulo que a câmera enxerga de uma vez. No Raycasting ele vale 60 graus (<code>const FOV = Math.PI / 3</code>), e as colunas da tela se espalham dentro dele. Um FOV maior mostra mais do mundo; um menor dá a sensação de zoom.`,c:'Raycasting'},
{t:'Tileset',d:`Imagem com todos os tiles de um mapa lado a lado, como uma spritesheet de tiles. O mapa guarda só números (<code>gid</code>) que dizem qual pedaço dela desenhar. No Tiled, o tileset fica embutido no mapa e o caminho da imagem vale a partir da pasta do mapa.`,c:'Mapas do Tiled'},
{t:'sfxr',d:`Gerador clássico de efeitos sonoros para jogos: em vez de gravar um áudio, você mexe em parâmetros (onda, tom, envelope, vibrato) e sorteia variações como moeda, laser e explosão. O Gerador de Sons do guia é uma ferramenta no mesmo estilo, feita com a Web Audio API.`,c:'Gerador de Sons'},
{t:'Polígono de luz (visibilidade)',d:`Contorno da área que uma luz enxerga: os pontos onde os raios param, ligados em ordem. O que está dentro dele é iluminado, e o que está fora é sombra.`,c:'Luz e sombras'},
{t:'Mapa de luz (light map)',d:`Imagem do tamanho da tela em que cada pixel guarda quanta luz, e de que cor, chega àquele ponto. Ela é multiplicada pela cena para escurecer e tingir o que está no escuro.`,c:'Luz e sombras'},
{t:'Modo de composição',d:`Regra que diz como o canvas mistura o que vai ser desenhado com o que já está lá, definida em <code>ctx.globalCompositeOperation</code>. <code>'lighter'</code> soma as cores, <code>'multiply'</code> multiplica e <code>'screen'</code> clareia sem estourar.`,c:'Luz e sombras'},
{t:'Sombra suave (penumbra)',d:`Borda macia da sombra, em que a luz some aos poucos. No guia ela vem de desenhar a luz várias vezes, a partir de pontos levemente diferentes, cada vez com uma fração da força.`,c:'Luz e sombras'},
{t:'Luz ambiente',d:`A luz mínima que existe em todo o mapa, mesmo longe de qualquer tocha. É a cor com que o mapa de luz começa: quanto mais escura, mais forte parece cada tocha.`,c:'Luz e sombras'},
{t:'Culling (descartar o que está fora da tela)',d:`Não calcular nem desenhar o que a câmera não mostra. Aqui, só os tiles da tela são desenhados e só as luzes que chegam à tela lançam raios, então o custo não cresce com o tamanho do mapa.`,c:'Luz e sombras'},
{t:'Ruído de Perlin',d:`Ruído que varia devagar: pontos vizinhos recebem valores parecidos. Vem de uma grade de direções sorteadas, misturadas com uma curva suave. É a base de terrenos, nuvens e texturas.`,c:'Ruído e terreno'},
{t:'Oitavas (ruído fractal)',d:`Somar vários ruídos, cada um com o dobro da frequência e metade da força do anterior. A primeira oitava dá a forma geral e as seguintes dão os detalhes.`,c:'Ruído e terreno'},
{t:'Bioma',d:`Tipo de terreno, como mar, praia, floresta, deserto ou neve. No guia, vem da altura e da umidade de cada tile.`,c:'Ruído e terreno'},
{t:'Máscara de ilha',d:`Valor subtraído da altura que cresce com a distância ao centro. Faz o terreno afundar nas bordas e o mapa ficar cercado de mar.`,c:'Ruído e terreno'}
];
const sem=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();   // ignora acentos e maiúsculas
{
  const gl=$('#gl'),lista=$('#glLista'),busca=$('#glBusca'),cont=$('#glN');
  lista.innerHTML=GLOS.slice().sort((a,b)=>sem(a.t).localeCompare(sem(b.t))).map(g=>{
    const i=CAPS.findIndex(c=>c.n===g.c);                  // o link usa o NOME do capítulo, então acompanha a ordem
    return `<div class="gt"><dt>${g.t}</dt><dd>${g.d}${i>=0?` <a href="#cap-${i}">Capítulo ${i}: ${g.c} →</a>`:''}</dd></div>`;
  }).join('');
  const filtrar=()=>{
    const q=sem(busca.value).split(/\s+/).filter(Boolean);
    let n=0;
    lista.querySelectorAll('.gt').forEach(el=>{
      const ok=q.every(w=>sem(el.textContent).includes(w));
      el.hidden=!ok;if(ok)n++;
    });
    cont.textContent=n?n+' de '+GLOS.length+' termos':'Nenhum termo encontrado. Tente outra palavra.';
  };
  busca.addEventListener('input',filtrar);
  const abrir=()=>{
    typeof gl.showModal==='function'?gl.showModal():gl.setAttribute('open','');
    busca.value='';filtrar();lista.scrollTop=0;
    if(window.matchMedia&&matchMedia('(pointer:fine)').matches)busca.focus();   // no celular não abre o teclado sozinho
  };
  const fechar=()=>typeof gl.close==='function'?gl.close():gl.removeAttribute('open');
  $('#glo').onclick=abrir;$('#glX').onclick=fechar;
  gl.addEventListener('click',e=>{if(e.target===gl)fechar()});          // clique no fundo escuro fecha
  lista.addEventListener('click',e=>{if(e.target.closest('a'))fechar()}); // ir a um capítulo fecha a janela
}
function openIndex() {
  window.location.href = "/";
}

// ---------- Configurações ----------
// Tema, tamanho do texto e outros ajustes ficam em guiaGames:config. Exportar e importar levam TODOS os dados
// do guia (tudo o que começa com guiaGames:): progresso, quizzes, anotações, códigos editados e ferramentas.
{
  const CHAVE_CFG='guiaGames:config', PREF='guiaGames:';
  const TEMAS=[['floresta','Floresta',['#16301c','#3b2a1a','#ffd34e']],['noite','Noite',['#0f1424','#1a2238','#ffd34e']],['gameboy','Game Boy',['#0f380f','#306230','#9bbc0f']],['dungeon','Dungeon',['#1b1226','#2c1d3d','#ffcf5a']],['contraste','Alto contraste',['#000000','#ffffff','#ffe600']]];
  const FONTES=[['p','Pequeno'],['m','Normal'],['g','Grande'],['gg','Muito grande']];
  const LINHAS=[['c','Compacto'],['n','Normal'],['a','Amplo']];
  const PADRAO={tema:'floresta',fonte:'m',linha:'n',pixel:true,mov:!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)};
  let cfg={...PADRAO};
  try{cfg={...PADRAO,...JSON.parse(localStorage.getItem(CHAVE_CFG)||'{}')}}catch(e){}
  const salvar=()=>{try{localStorage.setItem(CHAVE_CFG,JSON.stringify(cfg))}catch(e){}};
  const ok=(lista,v,pad)=>lista.some(x=>x[0]===v)?v:pad;
  const aplicar=()=>{                                       // cada ajuste vira um atributo no <html>; o CSS faz o resto
    const ds=document.documentElement.dataset;
    cfg.tema=ok(TEMAS,cfg.tema,PADRAO.tema);cfg.fonte=ok(FONTES,cfg.fonte,PADRAO.fonte);cfg.linha=ok(LINHAS,cfg.linha,PADRAO.linha);
    cfg.pixel=cfg.pixel!==false;cfg.mov=cfg.mov!==false;
    cfg.tema===PADRAO.tema?delete ds.tema:ds.tema=cfg.tema;
    cfg.fonte===PADRAO.fonte?delete ds.fonte:ds.fonte=cfg.fonte;
    cfg.linha===PADRAO.linha?delete ds.linha:ds.linha=cfg.linha;
    cfg.pixel?delete ds.pixel:ds.pixel='0';
    cfg.mov?delete ds.mov:ds.mov='0';
  };
  aplicar();

  const cf=$('#cf'),cont=$('#cfc');
  const grupo=(id,titulo,lista,extra)=>'<section><h3 class="px">'+titulo+'</h3><div class="cfp" data-g="'+id+'">'+lista.map(x=>
    '<button type="button" data-v="'+x[0]+'" aria-pressed="false">'+(extra?extra(x):'')+x[1]+'</button>').join('')+'</div></section>';
  cont.innerHTML=
    grupo('tema','TEMA',TEMAS,x=>'<span class="cfsw">'+x[2].map(c=>'<i style="background:'+c+'"></i>').join('')+'</span>')+
    grupo('fonte','TAMANHO DO TEXTO',FONTES)+
    grupo('linha','ESPAÇAMENTO DAS LINHAS',LINHAS)+
    '<section><h3 class="px">OUTROS AJUSTES</h3>'+
      '<label class="cft"><input type="checkbox" data-c="pixel"> Títulos em fonte pixelada (desligue para uma fonte mais legível)</label>'+
      '<label class="cft"><input type="checkbox" data-c="mov"> Animações e transições</label>'+
      '<div class="cfa"><button type="button" id="cfRest" class="alt">Restaurar padrões</button></div></section>'+
    '<section><h3 class="px">SEUS DADOS</h3>'+
      '<p class="cfn">Tudo o que o guia guarda neste navegador: progresso, quizzes, anotações, códigos que você alterou, as ferramentas de bônus e estas configurações. Exporte para ter uma cópia ou para levar para outro navegador ou computador.</p>'+
      '<div class="cfa"><button type="button" id="cfExp">Exportar dados</button><button type="button" id="cfImp" class="alt">Importar dados</button></div>'+
      '<input type="file" id="cfArq" accept="application/json,.json" hidden>'+
      '<p class="cfn">Ao importar, o que vem do arquivo substitui o que tiver o mesmo nome aqui (os capítulos vistos são somados aos que você já tem).</p>'+
      '<p id="cfMsg" role="status" aria-live="polite"></p></section>';

  const marcar=()=>{
    cont.querySelectorAll('.cfp').forEach(g=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',cfg[g.dataset.g]===b.dataset.v)));
    cont.querySelectorAll('input[data-c]').forEach(i=>i.checked=!!cfg[i.dataset.c]);
  };
  const msg=(t,ruim)=>{const m=$('#cfMsg');m.textContent=t;m.style.color=ruim?'var(--red)':'';m.style.display=t?'block':'';};   // só aparece quando há mensagem
  cont.addEventListener('click',e=>{
    const b=e.target.closest('.cfp button');
    if(!b)return;
    cfg[b.closest('.cfp').dataset.g]=b.dataset.v;aplicar();salvar();marcar();
  });
  cont.addEventListener('change',e=>{
    const i=e.target.closest('input[data-c]');
    if(!i)return;
    cfg[i.dataset.c]=i.checked;aplicar();salvar();
  });
  $('#cfRest').onclick=()=>{cfg={...PADRAO};aplicar();salvar();marcar();msg('Configurações restauradas. Seus dados não foram mexidos.')};

  // ----- exportar e importar -----
  const coletar=()=>{const d={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(PREF))d[k]=localStorage.getItem(k)}}catch(e){}return d};
  const tentar=(t,pad)=>{try{return JSON.parse(t)}catch(e){return pad}};
  const resumo=d=>{
    const ks=Object.keys(d), vistos=tentar(d[PREF+'vistos'],[]), quiz=tentar(d[PREF+'quiz'],{});
    const n=p=>ks.filter(k=>k.startsWith(PREF+p)).length;
    return (Array.isArray(vistos)?vistos.length:0)+' capítulos vistos, '+Object.keys(quiz||{}).length+' quizzes, '+n('nota:')+' anotações e '+n('codigo:')+' códigos editados ('+ks.length+' itens no total)';
  };
  $('#cfExp').onclick=()=>{
    const d=coletar();
    if(!Object.keys(d).length)return msg('Ainda não há nada para exportar.',true);
    const arq={app:'guia-games-2d',versao:1,exportadoEm:new Date().toISOString(),dados:d};
    const url=URL.createObjectURL(new Blob([JSON.stringify(arq)],{type:'application/json'}));
    const a=document.createElement('a');
    a.href=url;a.download='guia-games-2d-dados-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    msg('Exportado: '+resumo(d)+'.');
  };
  $('#cfImp').onclick=()=>$('#cfArq').click();
  $('#cfArq').onchange=e=>{
    const f=e.target.files[0];e.target.value='';
    if(!f)return;
    if(f.size>20e6)return msg('Arquivo grande demais para ser deste guia.',true);
    const r=new FileReader();
    r.onerror=()=>msg('Não consegui ler o arquivo.',true);
    r.onload=()=>{
      const arq=tentar(r.result,null);
      if(!arq||arq.app!=='guia-games-2d'||!arq.dados||typeof arq.dados!=='object')return msg('Esse arquivo não parece ter sido exportado por este guia.',true);
      const d={};
      Object.keys(arq.dados).forEach(k=>{if(k.startsWith(PREF)&&typeof arq.dados[k]==='string')d[k]=arq.dados[k]});   // só chaves do guia, só texto
      if(!Object.keys(d).length)return msg('O arquivo não tem dados do guia.',true);
      if(!confirm('Importar '+resumo(d)+'?\n\nO que vem do arquivo substitui o que tem o mesmo nome neste navegador. A página será recarregada.'))return;
      let erros=0;
      Object.keys(d).forEach(k=>{
        try{
          let v=d[k];
          if(k===PREF+'vistos'){const novo=JSON.parse(v),velho=tentar(localStorage.getItem(k)||'[]',[]);v=JSON.stringify([...new Set([...(Array.isArray(velho)?velho:[]),...(Array.isArray(novo)?novo:[])])])}   // soma os capítulos vistos
          localStorage.setItem(k,v);
        }catch(x){erros++}
      });
      if(erros)return msg('Importei com '+erros+' item(ns) que não deu(ram) para guardar (espaço do navegador cheio ou dado inválido).',true);
      msg('Importado! Recarregando...');
      setTimeout(()=>location.reload(),600);
    };
    r.readAsText(f);
  };

  const abrir=()=>{marcar();msg('');typeof cf.showModal==='function'?cf.showModal():cf.setAttribute('open','')};
  const fechar=()=>typeof cf.close==='function'?cf.close():cf.removeAttribute('open');
  $('#inicio').onclick=openIndex;$('#cfg').onclick=abrir;$('#cfX').onclick=fechar;
  cf.addEventListener('click',e=>{if(e.target===cf)fechar()});          // clique no fundo escuro fecha
}
// ---------- Busca nos capítulos ----------
// Procura no título, no texto e no desafio de cada capítulo (não no código do exemplo). Ignora acentos e
// maiúsculas, e todas as palavras digitadas precisam aparecer. Os termos achados ganham destaque no capítulo.
{
  const campo=$('#capBusca'),res=$('#capRes'),menu=$('#menu'),cont=$('#capN');
  let indice=null,termos=[],rolar=false;
  const paraTexto=h=>new DOMParser().parseFromString(h,'text/html').body.textContent.replace(/\s+/g,' ').trim();   // não roda scripts nem carrega imagens
  const montar=()=>{indice=CAPS.map((c,i)=>{const t=paraTexto(c.t+' '+(c.d||''));return{i,n:c.n,nn:sem(c.n),t,tt:sem(t)}})};
  const hashAtual=()=>{const m=location.hash.match(/cap-(\d+)/);return m?+m[1]:0};
  const temAPI=()=>!!(window.CSS&&CSS.highlights&&window.Highlight);

  const buscar=ws=>{
    const frase=ws.join(' ');
    return indice.map(c=>{
      let pts=0;
      for(const w of ws){
        const noTitulo=c.nn.includes(w),nTexto=c.tt.split(w).length-1;
        if(!noTitulo&&!nTexto)return null;               // faltou uma palavra: este capítulo não serve
        pts+=(noTitulo?30:0)+Math.min(nTexto,10);
      }
      if(c.nn.includes(frase))pts+=100;                  // a frase inteira no título pesa mais
      return{c,pts};
    }).filter(Boolean).sort((a,b)=>b.pts-a.pts||a.c.i-b.c.i);
  };

  // Escreve orig dentro de el, com <mark> nas palavras achadas. norm é orig sem acentos, do mesmo tamanho.
  const marcar=(el,orig,norm,ws)=>{
    if(orig.length!==norm.length){el.textContent=orig;return}
    const mk=new Array(orig.length).fill(false);
    ws.forEach(w=>{for(let p=norm.indexOf(w);p>=0;p=norm.indexOf(w,p+1))for(let k=p;k<p+w.length;k++)mk[k]=true});
    for(let i=0,j;i<orig.length;i=j){
      for(j=i;j<orig.length&&mk[j]===mk[i];)j++;
      const parte=orig.slice(i,j);
      if(mk[i]){const m=document.createElement('mark');m.textContent=parte;el.appendChild(m)}
      else el.appendChild(document.createTextNode(parte));
    }
  };

  // Trecho do texto em volta da primeira palavra achada (sem cortar palavras no meio).
  const trecho=(c,ws)=>{
    if(c.tt.length!==c.t.length)return null;
    let pos=-1;
    ws.forEach(w=>{const p=c.tt.indexOf(w);if(p>=0&&(pos<0||p<pos))pos=p});
    if(pos<0)return null;                                // só o título casou
    let ini=Math.max(0,pos-50),fim=Math.min(c.t.length,pos+110);
    if(ini>0){const e=c.t.indexOf(' ',ini);if(e>=0&&e<pos)ini=e+1}
    if(fim<c.t.length){const e=c.t.lastIndexOf(' ',fim);if(e>pos)fim=e}
    return{o:(ini>0?'… ':'')+c.t.slice(ini,fim)+(fim<c.t.length?' …':''),n:(ini>0?'… ':'')+c.tt.slice(ini,fim)+(fim<c.t.length?' …':'')};
  };

  // Destaque dos termos dentro do capítulo aberto (CSS Custom Highlight API: não mexe no HTML do capítulo).
  const destacar=rolarAte=>{
    if(!temAPI())return;
    CSS.highlights.delete('busca-cap');
    const main=$('#main');
    if(!termos.length||!main)return;
    const ranges=[];
    const it=document.createTreeWalker(main,NodeFilter.SHOW_TEXT,{acceptNode:n=>
      n.parentElement&&n.parentElement.closest('textarea,pre,script,style,button,.lab,.pxa,.aju,.apoio')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    for(let n=it.nextNode();n;n=it.nextNode()){
      const s=sem(n.data);if(s.length!==n.data.length)continue;
      termos.forEach(w=>{for(let p=s.indexOf(w);p>=0;p=s.indexOf(w,p+1)){
        const r=new Range();r.setStart(n,p);r.setEnd(n,p+w.length);ranges.push(r);
      }});
    }
    if(!ranges.length)return;
    CSS.highlights.set('busca-cap',new Highlight(...ranges));
    const el=ranges[0].startContainer.parentElement;
    if(rolarAte&&el)el.scrollIntoView({block:'center'});
  };

  const desenhar=()=>{
    const q=sem(campo.value).trim();
    const ativo=q.length>=2;                             // com 0 ou 1 letra, volta o menu normal
    menu.hidden=ativo;res.hidden=!ativo;res.textContent='';
    if(!ativo){cont.textContent='';termos=[];destacar();return}
    if(!indice)montar();
    const ws=[...new Set(q.split(/\s+/))];
    termos=ws;
    const r=buscar(ws),cur=hashAtual();
    cont.textContent=r.length?(r.length===1?'1 capítulo':r.length+' capítulos'):'Nenhum capítulo encontrado. Tente outra palavra.';
    r.forEach(({c})=>{
      const a=document.createElement('a');a.href='#cap-'+c.i;a.dataset.cap=c.i;
      if(c.i===cur)a.classList.add('on');
      if(vistos.has(c.n))a.classList.add('ok');
      const b=document.createElement('b');b.textContent=c.i;
      const sp=document.createElement('span'),t=document.createElement('strong');
      marcar(t,c.n,c.nn,ws);sp.appendChild(t);
      const tr=trecho(c,ws);
      if(tr){const sm=document.createElement('small');marcar(sm,tr.o,tr.n,ws);sp.appendChild(sm)}
      a.append(b,sp);res.appendChild(a);
    });
    destacar();
  };

  campo.addEventListener('input',desenhar);
  campo.addEventListener('search',desenhar);             // o "x" do campo (e o Esc, em alguns navegadores)
  campo.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&campo.value){e.preventDefault();campo.value='';desenhar()}
    else if(e.key==='Enter'){const a=res.querySelector('a');if(a){e.preventDefault();a.click()}}   // Enter abre o 1º resultado
  });
  res.addEventListener('click',e=>{
    const a=e.target.closest('a');if(!a)return;
    rolar=true;
    if(location.hash==='#cap-'+a.dataset.cap)setTimeout(()=>{destacar(true);rolar=false},0);   // já está nesse capítulo: não haverá hashchange
  });
  addEventListener('hashchange',()=>setTimeout(()=>{      // depois do rota(), que troca o conteúdo
    const cur=hashAtual();
    res.querySelectorAll('a').forEach(a=>{const k=+a.dataset.cap;a.classList.toggle('on',k===cur);a.classList.toggle('ok',vistos.has(CAPS[k].n))});
    destacar(rolar);rolar=false;
  },50));
}
// ---------- Continuar de onde parou ----------
// Guardamos o NOME do capítulo (e a rolagem), não o número: os números mudam quando entram capítulos novos.
const CHAVE_ULTIMO='guiaGames:ultimo';
function guardarUltimo(y){
  try{localStorage.setItem(CHAVE_ULTIMO,JSON.stringify({n:CAPS[atual].n,y:Math.round(y)}))}catch(e){}
}
function lerUltimo(){
  try{
    const d=JSON.parse(localStorage.getItem(CHAVE_ULTIMO)||'null');
    if(!d||typeof d.n!=='string')return null;
    const i=CAPS.findIndex(c=>c.n===d.n);                 // o capítulo pode ter sido renomeado ou removido
    return i<0?null:{i,n:d.n,y:Math.max(0,+d.y||0)};
  }catch(e){return null}
}
function avisoRetomada(u){
  const d=document.createElement('div'); d.id='retoma'; d.setAttribute('role','status');
  d.innerHTML='<span></span><button type="button" class="alt">Começar do início</button><button type="button" class="alt" aria-label="Fechar aviso">✕</button>';
  d.children[0].textContent='Continuando de onde você parou: '+u.i+'. '+u.n;
  const fechar=()=>d.remove();
  d.children[1].onclick=()=>{fechar();location.hash='cap-0'};
  d.children[2].onclick=fechar;
  document.body.appendChild(d);
  setTimeout(fechar,9000);
}
function retomar(){
  const semCapitulo=!/cap-\d+/.test(location.hash);        // um link com capítulo (favorito, compartilhado) vale mais
  const u=semCapitulo?lerUltimo():null;
  if(u&&u.i>0){
    history.replaceState(null,'','#cap-'+u.i);            // sem criar uma entrada nova no histórico
    rota();
    scrollTo(0,u.y); setTimeout(()=>scrollTo(0,u.y),300);  // a 2ª tentativa vem depois do layout assentar
    avisoRetomada(u);
  }else rota();
}
let tScroll=0;
addEventListener('scroll',()=>{clearTimeout(tScroll);tScroll=setTimeout(()=>guardarUltimo(scrollY),400)},{passive:true});
addEventListener('pagehide',()=>guardarUltimo(scrollY));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')guardarUltimo(scrollY)});
addEventListener('hashchange',rota);
retomar();
new ResizeObserver(()=>{const cv=$('#cv');if(!cv||cv.clientWidth===largura)return;clearTimeout(tm);tm=setTimeout(rodar,150)}).observe(document.body);
</script>
