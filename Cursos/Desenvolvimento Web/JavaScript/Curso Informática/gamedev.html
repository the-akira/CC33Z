  fase = f; pontos = p; pontosInicio = p;
  meta = 3 + 2 * fase;                        // rupias necessárias
  tempo = 20; coletadas = 0;
  heroi = { x: W / 2, y: H / 2 + 10 };
  rupias = [novaRupia(), novaRupia(), novaRupia()];
  perigos = [];
  for (let i = 0; i < Math.min(1 + fase, 8); i++) {
    const ang = Math.random() * Math.PI * 2, vel = Math.min(50 + 12 * fase, 160);
    perigos.push({ x: i % 2 ? 40 : W - 40, y: 50 + Math.random() * (H - 80),
                   vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel });
  }
  estado = 'jogando';
}

function concluir() {
  bonus = Math.ceil(tempo);                   // bônus pelo tempo que sobrou
  pontos += bonus;
  dados.fase = fase + 1;                      // próxima fase fica salva
  dados.pontos = pontos;
  dados.recorde = Math.max(dados.recorde, pontos);
  salvar();                                   // momento certo para salvar
  estado = 'concluida'; pausa = 2;
}
function derrota() {
  dados.recorde = Math.max(dados.recorde, pontos);
  dados.fase = fase;                          // volta a tentar esta fase
  dados.pontos = pontosInicio;
  dados.partidas++;
  salvar();
  estado = 'fim';
}

function atualizar(dt) {
  tempo -= dt;
  let dx = 0, dy = 0;
  if (keys.ArrowLeft  || keys.a) dx -= 1;
  if (keys.ArrowRight || keys.d) dx += 1;
  if (keys.ArrowUp    || keys.w) dy -= 1;
  if (keys.ArrowDown  || keys.s) dy += 1;
  if (mouse.down) {                           // toque: o herói vai até o dedo
    const vx = mouse.x - heroi.x, vy = mouse.y - heroi.y, d = Math.hypot(vx, vy);
    if (d > 4) { dx = vx / d; dy = vy / d; }
  }
  const m = Math.hypot(dx, dy) || 1;
  heroi.x = limite(heroi.x + dx / m * 170 * dt, 9, W - 9);
  heroi.y = limite(heroi.y + dy / m * 170 * dt, 34, H - 9);

  perigos.forEach(p => {                      // ricochete, como no Breakout
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.x < 8 || p.x > W - 8) { p.vx = -p.vx; p.x = limite(p.x, 8, W - 8); }
    if (p.y < 34 || p.y > H - 8) { p.vy = -p.vy; p.y = limite(p.y, 34, H - 8); }
  });

  rupias = rupias.map(r => {
    if (Math.hypot(r.x - heroi.x, r.y - heroi.y) < 16) { pontos++; coletadas++; return novaRupia(); }
    return r;
  });

  if (perigos.some(p => Math.hypot(p.x - heroi.x, p.y - heroi.y) < 17)) derrota();
  else if (coletadas >= meta) concluir();
  else if (tempo <= 0) derrota();
}

function texto(msg, y, tam) {
  ctx.font = tam + 'px monospace'; ctx.textAlign = 'center';
  ctx.fillText(msg, W / 2, y);
}

function desenhar() {
  ctx.fillStyle = '#3f8f3a'; ctx.fillRect(0, 0, W, H);
  if (rupias) {
    ctx.fillStyle = '#ff4fa3';
    rupias.forEach(r => {
      ctx.beginPath();
      ctx.moveTo(r.x, r.y - 8); ctx.lineTo(r.x + 6, r.y); ctx.lineTo(r.x, r.y + 8); ctx.lineTo(r.x - 6, r.y);
      ctx.fill();
    });
    ctx.fillStyle = '#e0483e';
    perigos.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI * 2); ctx.fill(); });
    ctx.fillStyle = '#1c130b'; ctx.fillRect(heroi.x - 10, heroi.y - 10, 20, 20);
    ctx.fillStyle = '#ffd34e'; ctx.fillRect(heroi.x - 8, heroi.y - 8, 16, 16);

    ctx.fillStyle = '#1c130b'; ctx.fillRect(0, 0, W, 30);               // barra superior
    ctx.fillStyle = tempo < 5 ? '#e0483e' : '#78c840';
    ctx.fillRect(0, 26, W * Math.max(0, tempo) / 20, 4);                // tempo
    ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'left';
    ctx.fillText('Fase ' + fase + '  Rupias ' + coletadas + '/' + meta + '  Pontos ' + pontos +
                 '  Recorde ' + Math.max(dados.recorde, pontos), 8, 17);
  }

  if (estado === 'titulo' || estado === 'concluida' || estado === 'fim') {
    ctx.fillStyle = 'rgba(20, 12, 5, 0.78)'; ctx.fillRect(0, 0, W, H);
  }
  if (estado === 'titulo') {
    ctx.fillStyle = '#ffd34e'; texto('CAÇA ÀS RUPIAS', 70, 28);
    ctx.fillStyle = '#fff';
    const continua = dados.fase > 1 || dados.pontos > 0;
    texto(continua ? 'Espaço: continuar (fase ' + dados.fase + ', ' + dados.pontos + ' pontos)' : 'Espaço: começar', 105, 14);
    texto('Recorde: ' + dados.recorde + '   Partidas: ' + dados.partidas, 128, 14);
    texto('N: novo jogo (mantém o recorde)   X: apagar tudo', 152, 12);
    ctx.fillStyle = '#9ee7ff'; texto('salvo no navegador: ' + lerTexto(), 185, 10);
    if (!podeSalvar) { ctx.fillStyle = '#ff8c82'; texto('Armazenamento indisponível: nada será salvo', 205, 12); }
  } else if (estado === 'concluida') {
    ctx.fillStyle = '#78c840'; texto('FASE ' + fase + ' CONCLUÍDA!', 100, 26);
    ctx.fillStyle = '#fff'; texto('Bônus de tempo: +' + bonus + '   Pontos: ' + pontos, 135, 14);
  } else if (estado === 'fim') {
    ctx.fillStyle = '#ff8c82'; texto(tempo <= 0 ? 'TEMPO ESGOTADO' : 'VOCÊ FOI PEGO!', 100, 26);
    ctx.fillStyle = '#fff';
    texto('Espaço: tentar a fase ' + dados.fase + ' de novo   Esc: título', 135, 13);
  }
  if (aviso > 0 && estado !== 'jogando') {
    ctx.fillStyle = msgAviso === 'Não foi possível salvar' ? '#ff8c82' : '#78c840';
    texto(msgAviso, H - 10, 12);
  }
  ctx.textAlign = 'left';
}

loop((dt) => {
  const aperta = (k) => keys[k] && !antes[k];
  const clicou = mouse.down && !antesClique;
  const confirma = aperta(' ') || aperta('Enter') || clicou;
  aviso -= dt;

  if (estado === 'titulo') {
    if (confirma) iniciar(dados.fase, dados.pontos);
    if (aperta('n')) { dados.fase = 1; dados.pontos = 0; salvar(); iniciar(1, 0); }
    if (aperta('x')) apagar();
  } else if (estado === 'jogando') {
    atualizar(dt);
  } else if (estado === 'concluida') {
    pausa -= dt;
    if (pausa <= 0) iniciar(dados.fase, dados.pontos);
  } else if (estado === 'fim') {
    if (confirma) iniciar(dados.fase, dados.pontos);
    if (aperta('Escape')) estado = 'titulo';
  }

  desenhar();
  antes = Object.assign({}, keys);
  antesClique = mouse.down;
});
`},
{n:"Diálogos e menus",t:`<p>Em quase todo RPG o jogo conversa com você: o aldeão fala, o texto aparece <b>letra por letra</b> numa caixa e, às vezes, surge um <b>menu</b> para escolher a resposta. São três ideias simples juntas.</p><p><b>A conversa é dado, não código.</b> O objeto <code>conversa</code> guarda cada fala com <code>quem</code> fala, o <code>texto</code> e para onde ir depois (<code>vai</code>, o nome da próxima fala). Se a fala tem <code>escolhas</code>, cada uma aponta para a sua própria continuação. Sem <code>vai</code>, a conversa termina (para voltar ao menu, use <code>vai: 'inicio'</code>). Isso forma uma <b>árvore de diálogo</b>: para escrever outra conversa você só mexe nos dados, e o código continua igual. O campo <code>ganha</code> entrega rupias uma única vez.</p><p><b>Letra por letra:</b> <code>mostrados</code> é um número decimal que sobe <code>VEL * dt</code> por quadro, com <code>VEL</code> em letras por segundo. Decimal porque 30 letras por segundo, a 60 quadros, é meia letra por quadro, e o contador acumula, como o <code>acumulado</code> da Snake. Ao desenhar, <code>slice(0, resta)</code> corta cada linha no ponto certo. Para o texto não escapar da caixa, <code>quebrar</code> mede cada palavra com <code>ctx.measureText</code> e abre uma linha nova quando passa da largura. Depois a fala é dividida em <b>páginas</b> de 3 linhas.</p><p><b>O Enter muda de papel conforme o momento:</b> se o texto ainda está aparecendo, mostra tudo de uma vez; se a página encheu (o <b>▼</b> pisca), vira a página; na última, segue para a próxima fala ou fecha a caixa. A função <code>apertou</code> compara <code>keys</code> com o quadro anterior para pegar só o <i>instante</i> do toque, o mesmo truque da pausa em <b>Estados do jogo</b>. Sem isso, segurar o Enter atropelaria a conversa inteira.</p><p><b>O menu</b> é uma lista com um índice, <code>sel</code>. ↑ e ↓ mudam o índice, e a conta <code>(sel + n - 1) % n</code> faz o cursor <b>dar a volta</b>: no topo, ↑ vai para o último item. O <b>▶</b> é desenhado na linha de <code>sel</code>, e Enter (ou um clique, ou um toque na linha) confirma com <code>falar(escolha.vai)</code>.</p><p>Setas ou WASD andam. Chegue perto do velho e aperte <b>Enter</b> (ou Espaço, ou clique) para falar. Na caixa, Enter acelera e avança, e no menu use ↑ ↓ e Enter.</p>`,
d:"Adicione uma escolha nova ao velho, \"Tem algum tesouro?\", que leve a uma fala nova com mais de 150 letras (para ver a página virar) e dê 10 rupias de recompensa. Depois mude <code>VEL</code> para 60 e compare a velocidade do texto.",
c:`// Diálogos e menus: chegue perto do velho e aperte Enter (ou Espaço, ou clique).
// Na caixa: Enter mostra tudo de uma vez ou avança. No menu: ↑ ↓ escolhem e Enter confirma.

const VEL = 30;                                   // velocidade do texto: letras por segundo
const LINHAS = 3;                                 // linhas por página
const CX = 10, CY = 156, CW = W - 20, CH = 78;    // posição e tamanho da caixa de diálogo
const LH = 22;                                    // altura de cada linha do menu

// A conversa é só DADO. Cada fala tem quem fala, o texto e para onde ir depois (vai).
// Com "escolhas", quem decide o próximo passo é o jogador. Sem "vai", a conversa acaba (use vai: 'inicio' para voltar ao menu).
const conversa = {
  inicio: {
    quem: 'Velho',
    texto: 'Olá, viajante! Faz tempo que ninguém passa por esta floresta. Está procurando alguma coisa?',
    escolhas: [
      { texto: 'Quem é você?',      vai: 'quem' },
      { texto: 'Preciso de ajuda.', vai: 'ajuda' },
      { texto: 'Nada, obrigado.',   vai: 'tchau' }
    ]
  },
  quem: {
    quem: 'Velho',
    texto: 'Sou o guardião da floresta. Cuido destes caminhos há mais de cinquenta anos, e conheço cada árvore daqui pelo nome. Dizem que até as pedras me cumprimentam quando eu passo, mas isso eu nunca consegui provar.'
  },
  ajuda: {
    quem: 'Velho',
    texto: 'Leve estas rupias. Elas vão ajudar na sua viagem!',
    ganha: 5                                       // recompensa, entregue uma vez só
  },
  tchau: {
    quem: 'Velho',
    texto: 'Vá com cuidado. A floresta é maior do que parece!'
  }
};

const velho = { x: 240, y: 62 };
const heroi = { x: 240, y: 118, v: 110 };
let rupias = 0, relogio = 0;
let dlg = null;                                   // null = ninguém falando; senão guarda a fala atual
let antes = {}, antesClique = false;

// true só no quadro em que a tecla foi apertada (keys diz se ela está SEGURADA)
const apertou = (...teclas) => teclas.some(t => keys[t] && !antes[t]);

function quebrar(texto, largura) {                // divide o texto em linhas que cabem na caixa
  ctx.font = '14px monospace';
  const linhas = [];
  let linha = '';
  texto.split(' ').forEach(palavra => {
    const teste = linha ? linha + ' ' + palavra : palavra;
    if (linha && ctx.measureText(teste).width > largura) { linhas.push(linha); linha = palavra; }
    else linha = teste;
  });
  linhas.push(linha);
  return linhas;
}

function falar(id) {                              // abre uma fala da conversa
  const no = conversa[id];
  if (no.ganha && !no.pago) { rupias += no.ganha; no.pago = true; }
  const linhas = quebrar(no.texto, CW - 24);
  const paginas = [];
  for (let i = 0; i < linhas.length; i += LINHAS) paginas.push(linhas.slice(i, i + LINHAS));
  dlg = { no, paginas, pag: 0, mostrados: 0, sel: 0 };
}

function info() {                                 // resumo da página atual da fala
  const pagina = dlg.paginas[dlg.pag];
  const ultima = dlg.pag === dlg.paginas.length - 1;
  return { pagina, total: pagina.join('').length, ultima, escolhas: ultima ? dlg.no.escolhas : null };
}

function areaMenu(escolhas) {                     // retângulo do menu, logo acima da caixa
  ctx.font = '14px monospace';
  const w = Math.max(...escolhas.map(e => ctx.measureText(e.texto).width)) + 50;
  const h = escolhas.length * LH + 12;
  return { x: W - 10 - w, y: CY - 8 - h, w, h };
}

function caixa(x, y, w, h) {                      // moldura no estilo do guia
  ctx.fillStyle = '#000';    ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = '#8a6a35'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#3b2a1a'; ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
}

loop((dt) => {
  relogio += dt;
  const clicou = mouse.down && !antesClique;
  const confirmou = apertou('Enter', ' ') || clicou;
  const perto = Math.hypot(heroi.x - velho.x, heroi.y - velho.y) < 40;

  if (!dlg) {
    // ----- sem conversa: o herói anda -----
    if (keys.ArrowLeft  || keys.a) heroi.x -= heroi.v * dt;
    if (keys.ArrowRight || keys.d) heroi.x += heroi.v * dt;
    if (keys.ArrowUp    || keys.w) heroi.y -= heroi.v * dt;
    if (keys.ArrowDown  || keys.s) heroi.y += heroi.v * dt;
    heroi.x = Math.max(10, Math.min(W - 10, heroi.x));
    heroi.y = Math.max(10, Math.min(H - 10, heroi.y));
    if (perto && confirmou) falar('inicio');
  } else {
    // ----- em conversa: o Enter faz coisas diferentes conforme o momento -----
    const { total, ultima, escolhas } = info();

    if (dlg.mostrados < total) {                  // 1) ainda escrevendo: Enter mostra tudo
      dlg.mostrados = confirmou ? total : Math.min(total, dlg.mostrados + VEL * dt);
    } else if (!ultima) {                         // 2) página cheia: Enter vira a página
      if (confirmou) { dlg.pag++; dlg.mostrados = 0; }
    } else if (escolhas) {                        // 3) menu de escolhas
      const n = escolhas.length;
      if (apertou('ArrowUp', 'w'))   dlg.sel = (dlg.sel + n - 1) % n;   // dá a volta no topo
      if (apertou('ArrowDown', 's')) dlg.sel = (dlg.sel + 1) % n;       // dá a volta no fim
      let escolha = apertou('Enter', ' ') ? dlg.sel : -1;
      if (clicou) {                               // clique ou toque direto numa linha
        const m = areaMenu(escolhas);
        const i = Math.floor((mouse.y - m.y - 6) / LH);
        if (mouse.x > m.x && mouse.x < m.x + m.w && i >= 0 && i < n) escolha = i;
      }
      if (escolha >= 0) falar(escolhas[escolha].vai);
    } else if (confirmou) {                       // 4) fim da fala: próxima ou fecha a caixa
      if (dlg.no.vai) falar(dlg.no.vai); else dlg = null;
    }
  }

  // ----- desenho -----
  ctx.fillStyle = '#3f8f3a'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#357a31';
  [[40, 40], [420, 60], [90, 180], [400, 190], [330, 110]].forEach(([x, y]) => ctx.fillRect(x, y, 24, 16));

  ctx.fillStyle = '#e0483e'; ctx.fillRect(velho.x - 10, velho.y - 4, 20, 24);    // velho: túnica
  ctx.fillStyle = '#f1c27d'; ctx.fillRect(velho.x - 7, velho.y - 16, 14, 12);    // rosto
  ctx.fillStyle = '#fff';    ctx.fillRect(velho.x - 7, velho.y - 6, 14, 6);      // barba
  ctx.fillStyle = '#7ddcff'; ctx.fillRect(Math.round(heroi.x) - 8, Math.round(heroi.y) - 8, 16, 16);

  ctx.font = '14px monospace'; ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd34e'; ctx.fillText('◆ ' + rupias, 10, 20);
  if (perto && !dlg) {
    ctx.font = '12px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText('Enter: falar', velho.x, velho.y - 24);
    ctx.textAlign = 'left';
  }

  if (dlg) {
    const { pagina, total, escolhas } = info();
    ctx.font = '11px monospace';
    caixa(CX + 8, CY - 18, ctx.measureText(dlg.no.quem).width + 20, 24);     // aba com o nome
    caixa(CX, CY, CW, CH);
    ctx.fillStyle = '#ffd34e'; ctx.fillText(dlg.no.quem, CX + 18, CY - 4);

    let resta = Math.floor(dlg.mostrados);                  // quantas letras já podem aparecer
    ctx.fillStyle = '#f4e8c1';
    pagina.forEach((linha, i) => {
      ctx.fillText(linha.slice(0, resta), CX + 12, CY + 26 + i * 18);
      resta = Math.max(0, resta - linha.length);
    });

    if (dlg.mostrados >= total) {                           // texto completo: mostra o que vem depois
      if (escolhas) {
        const m = areaMenu(escolhas);
        caixa(m.x, m.y, m.w, m.h);
        escolhas.forEach((e, i) => {
          const y = m.y + 6 + i * LH + 15;
          ctx.fillStyle = i === dlg.sel ? '#ffd34e' : '#f4e8c1';
          if (i === dlg.sel) ctx.fillText('▶', m.x + 10, y);               // cursor
          ctx.fillText(e.texto, m.x + 28, y);
        });
      } else if (Math.floor(relogio * 3) % 2) {
        ctx.fillStyle = '#ffd34e'; ctx.fillText('▼', CX + CW - 22, CY + CH - 10);   // "aperte Enter"
      }
    }
  }

  antes = Object.assign({}, keys);
  antesClique = mouse.down;
});
`},
{n:"Partículas e Asteroids",t:`<p>Uma <b>partícula</b> é um objeto minúsculo e de vida curta: posição, velocidade e <b>tempo de vida</b>. Todas ficam numa lista. A cada quadro movemos cada uma, diminuímos a vida e removemos com <code>filter</code> as que acabaram. Ao desenhar, a transparência (<code>globalAlpha</code>) e o tamanho acompanham a vida restante, e a partícula some suavemente. A função <code>emitir(x, y, n, opcoes)</code> cria várias de uma vez, e três receitas mudam só as opções: <b>explosão</b> (muitas, rápidas, cores quentes), <b>faíscas</b> (poucas, muito rápidas e curtas) e <b>poeira</b> (uma por quadro, lenta, saindo para trás da nave).</p><p><b>Tremor de câmera:</b> a variável <code>tremor</code> sobe nos impactos e cai sozinha, com <code>Math.exp</code>, como o atrito da raquete. Ao desenhar o mundo, deslocamos tudo com <code>ctx.translate</code> por um valor sorteado entre <code>-tremor</code> e <code>+tremor</code>. O painel de pontos é desenhado fora do tremor, para não balançar.</p><p><b>Asteroids:</b> a nave tem um ângulo (<code>ang</code>) que gira com as setas. O empuxo soma <code>cos(ang)</code> e <code>sin(ang)</code> à <b>velocidade</b>, e não à posição. É isso que dá <b>inércia</b>: a nave continua deslizando depois que você solta a tecla. O <code>ATRITO</code> do espaço é pequeno (com 0 a inércia é pura). A nave e os asteroides que saem por um lado da tela voltam pelo lado oposto, com <code>((v % max) + max) % max</code>. Mas essa conta só muda o <b>centro</b> do objeto: sozinha, ela faz o asteroide <i>pular</i> de um lado para o outro, cortado ao meio. Para ele <b>atravessar</b> a borda, a função <code>copias</code> desenha o objeto de novo, deslocado em <code>±W</code> e <code>±H</code>. O que cai fora da tela não aparece, então a parte que sai por um lado já está entrando pelo outro. Pelo mesmo motivo, a colisão usa <code>perto</code>, que mede a distância <b>dando a volta</b> na tela (<code>Math.min(dx, W - dx)</code>). O tiro não dá a volta: ele some ao sair da tela. Os asteroides se partem em pedaços menores.</p><p>Setas ou A e D giram, seta para cima ou W acelera, e Espaço atira (pode segurar).</p>`,
d:"Crie um hiperespaço: ao apertar H, a nave some e reaparece num lugar sorteado, com uma explosão de partículas azuis na saída e na chegada.",
c:`const ROT = 4;          // giro da nave (radianos por segundo)
const EMPUXO = 220;     // aceleração do motor (pixels por segundo²)
const ATRITO = 0.3;     // 0 = inércia pura: nada freia a nave
const VMAX = 300;
const ROCHAS_BASE = 2;  // asteroides grandes por onda: ROCHAS_BASE + onda (máximo 6)

const rnd = (a, b) => a + Math.random() * (b - a);
const dar = (v, max) => ((v % max) + max) % max;   // sai de um lado, volta pelo outro
// Mas o dar() só muda o CENTRO do objeto: sozinho, ele faz o objeto "pular" de um lado para o outro, cortado ao meio.
// Para ele ATRAVESSAR a borda, desenhamos o objeto de novo, deslocado em ±W e ±H. O que cai fora da tela não aparece.
function copias(x, y, raio, desenhar) {
  for (const dx of [-W, 0, W])
    for (const dy of [-H, 0, H])
      if (x + dx + raio > 0 && x + dx - raio < W && y + dy + raio > 0 && y + dy - raio < H)
        desenhar(x + dx, y + dy);
}
// Pelo mesmo motivo, a distância também dá a volta na tela: perto da borda, o outro lado vale.
function perto(a, b) {
  const dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y);
  return Math.hypot(Math.min(dx, W - dx), Math.min(dy, H - dy));
}

let nave, balas, rochas, particulas, pontos, vidas, onda, tremor, espera, renasce, invul, fim, proxOnda, antes = {};
const estrelas = Array.from({ length: 40 }, () => ({ x: rnd(0, W), y: rnd(0, H), t: Math.random() < 0.2 ? 2 : 1 }));

// ---------- partículas ----------
function emitir(x, y, n, o) {
  for (let i = 0; i < n; i++) {
    const a = (o.dir || 0) + (Math.random() - 0.5) * (o.abertura || Math.PI * 2);
    const v = rnd(o.vmin, o.vmax);
    const vida = o.vida * rnd(0.5, 1);
    particulas.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                      vida: vida, vidaMax: vida, tam: o.tam * rnd(0.6, 1.4),
                      cor: o.cores[Math.floor(Math.random() * o.cores.length)], atrito: o.atrito });
  }
}
// três receitas: só mudam as opções
const explosao = (x, y, n) => emitir(x, y, n,
  { vmin: 30, vmax: 170, vida: 0.9, tam: 3, cores: ['#ffd34e', '#ff9f1c', '#e0483e', '#ffffff'], atrito: 2.5 });
const faiscas = (x, y) => emitir(x, y, 7,
  { vmin: 80, vmax: 240, vida: 0.3, tam: 1.5, cores: ['#ffffff', '#ffd34e'], atrito: 4 });
const poeira = (x, y, dir) => emitir(x, y, 1,
  { dir: dir, abertura: 0.6, vmin: 20, vmax: 70, vida: 0.6, tam: 2.5, cores: ['#a79fd6', '#7d7a99'], atrito: 1.5 });

// ---------- asteroides ----------
function criarRocha(x, y, tam) {
  const ang = Math.random() * Math.PI * 2, v = rnd(25, 55) + (3 - tam) * 20;
  return { x: x, y: y, tam: tam, r: [0, 9, 17, 28][tam], vx: Math.cos(ang) * v, vy: Math.sin(ang) * v,
           ang: 0, giro: rnd(-1, 1), forma: Array.from({ length: 10 }, () => rnd(0.75, 1.2)) };
}
function quebrar(r) {
  explosao(r.x, r.y, 10 + r.tam * 6);
  tremor = Math.min(tremor + 2 + r.tam * 2, 14);
  pontos += [0, 100, 50, 20][r.tam];
  if (r.tam > 1) {                               // vira dois pedaços menores
    for (let i = 0; i < 2; i++) {
      const f = criarRocha(r.x, r.y, r.tam - 1);
      f.vx += r.vx * 0.5; f.vy += r.vy * 0.5;
      rochas.push(f);
    }
  }
}
function novaOnda() {
  rochas = [];
  for (let i = 0; i < Math.min(ROCHAS_BASE + onda, 6); i++) {
    let x, y;
    do { x = rnd(0, W); y = rnd(0, H); } while (perto({ x: x, y: y }, nave) < 110);
    rochas.push(criarRocha(x, y, 3));
  }
}
function iniciar() {
  nave = { x: W / 2, y: H / 2, vx: 0, vy: 0, ang: -Math.PI / 2, motor: false };
  balas = []; particulas = []; pontos = 0; vidas = 3; onda = 1;
  tremor = 0; espera = 0; renasce = 0; invul = 2; fim = false; proxOnda = 0;
  novaOnda();
}
iniciar();

loop((dt) => {
  const viva = renasce <= 0 && !fim;
  invul -= dt;

  if (fim) {
    if (keys['Enter'] && !antes['Enter']) iniciar();
  } else if (!viva) {
    renasce -= dt;
    if (renasce <= 0) { nave = { x: W / 2, y: H / 2, vx: 0, vy: 0, ang: -Math.PI / 2, motor: false }; invul = 2; }
  } else {
    // girar e acelerar
    if (keys.ArrowLeft  || keys.a) nave.ang -= ROT * dt;
    if (keys.ArrowRight || keys.d) nave.ang += ROT * dt;
    nave.motor = !!(keys.ArrowUp || keys.w);
    if (nave.motor) {
      nave.vx += Math.cos(nave.ang) * EMPUXO * dt;     // o empuxo muda a VELOCIDADE...
      nave.vy += Math.sin(nave.ang) * EMPUXO * dt;
      poeira(nave.x - Math.cos(nave.ang) * 10, nave.y - Math.sin(nave.ang) * 10, nave.ang + Math.PI);
    }
    const f = Math.exp(-ATRITO * dt);
    nave.vx *= f; nave.vy *= f;
    const vel = Math.hypot(nave.vx, nave.vy);
    if (vel > VMAX) { nave.vx *= VMAX / vel; nave.vy *= VMAX / vel; }
    nave.x = dar(nave.x + nave.vx * dt, W);            // ...e a velocidade muda a posição
    nave.y = dar(nave.y + nave.vy * dt, H);

    espera -= dt;
    if (keys[' '] && espera <= 0) {
      balas.push({ x: nave.x + Math.cos(nave.ang) * 14, y: nave.y + Math.sin(nave.ang) * 14,
                   vx: Math.cos(nave.ang) * 380 + nave.vx, vy: Math.sin(nave.ang) * 380 + nave.vy });
      espera = 0.22;
    }
  }

  if (!fim) {
    balas.forEach(b => {                              // o tiro NÃO dá a volta: some ao sair da tela
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) b.morta = true;
    });
    rochas.forEach(r => { r.x = dar(r.x + r.vx * dt, W); r.y = dar(r.y + r.vy * dt, H); r.ang += r.giro * dt; });

    balas.forEach(b => rochas.forEach(r => {              // bala x asteroide
      if (!b.morta && !r.morta && perto(b, r) < r.r) {
        b.morta = true; r.morta = true;
        faiscas(b.x, b.y);
        quebrar(r);
      }
    }));
    if (viva && invul <= 0) {                             // nave x asteroide
      rochas.forEach(r => {
        if (!r.morta && perto(nave, r) < r.r + 9) {
          r.morta = true; quebrar(r);
          explosao(nave.x, nave.y, 40); faiscas(nave.x, nave.y);
          tremor = 14; vidas--; renasce = 1.5;
          if (vidas <= 0) fim = true;
        }
      });
    }
    balas = balas.filter(b => !b.morta);
    rochas = rochas.filter(r => !r.morta);

    if (rochas.length === 0) {                            // onda limpa: espera um pouco e vem a próxima
      if (proxOnda <= 0) proxOnda = 1.5;
      else { proxOnda -= dt; if (proxOnda <= 0) { onda++; novaOnda(); } }
    }
  }

  // partículas e tremor continuam mesmo no fim de jogo
  particulas.forEach(p => {
    p.x += p.vx * dt; p.y += p.vy * dt;
    const f = Math.exp(-p.atrito * dt);
    p.vx *= f; p.vy *= f;
    p.vida -= dt;
  });
  particulas = particulas.filter(p => p.vida > 0);
  if (particulas.length > 400) particulas.splice(0, particulas.length - 400);   // limite de segurança
  tremor *= Math.exp(-6 * dt);
  if (tremor < 0.1) tremor = 0;

  // ---------- desenho ----------
  ctx.fillStyle = '#0d0a14'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(rnd(-tremor, tremor), rnd(-tremor, tremor));   // tremor de câmera
  ctx.fillStyle = '#6d6a8a';
  estrelas.forEach(e => ctx.fillRect(e.x, e.y, e.t, e.t));

  ctx.strokeStyle = '#c9c3e8'; ctx.lineWidth = 1.5;
  rochas.forEach(r => copias(r.x, r.y, r.r * 1.2, (x, y) => {   // desenha também do outro lado, se passar da borda
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2 + r.ang, d = r.r * r.forma[i];
      if (i === 0) ctx.moveTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
      else ctx.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
    }
    ctx.closePath(); ctx.stroke();
  }));

  ctx.fillStyle = '#fff';
  balas.forEach(b => ctx.fillRect(b.x - 1.5, b.y - 1.5, 3, 3));

  if (viva && (invul <= 0 || Math.floor(invul * 10) % 2)) {
    const chama = rnd(6, 12);                                 // sorteada uma vez, para todas as cópias
    copias(nave.x, nave.y, 20, (x, y) => {                    // a nave também atravessa a borda sem pular
      ctx.save();
      ctx.translate(x, y); ctx.rotate(nave.ang);              // gira o desenho da nave
      ctx.strokeStyle = '#ffd34e'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-10, -8); ctx.lineTo(-6, 0); ctx.lineTo(-10, 8); ctx.closePath();
      ctx.stroke();
      if (nave.motor) {
        ctx.strokeStyle = '#ff9f1c';
        ctx.beginPath(); ctx.moveTo(-7, -4); ctx.lineTo(-7 - chama, 0); ctx.lineTo(-7, 4); ctx.stroke();
      }
      ctx.restore();
    });
  }

  ctx.globalCompositeOperation = 'lighter';                   // cores somam: brilho de fogo
  particulas.forEach(p => {
    const t = p.vida / p.vidaMax, s = p.tam * (0.4 + 0.6 * t);
    ctx.globalAlpha = t; ctx.fillStyle = p.cor;
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  });
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  // painel (fora do tremor)
  ctx.fillStyle = '#fff'; ctx.font = '13px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Pontos: ' + pontos + '   Vidas: ' + Math.max(0, vidas) + '   Onda: ' + onda, 8, 18);
  ctx.font = '10px monospace';
  ctx.fillText('← →: girar   ↑: propulsão   Espaço: atirar', 8, H - 8);
  if (fim) {
    ctx.fillStyle = 'rgba(13, 10, 20, 0.7)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff8c82'; ctx.font = '28px monospace'; ctx.fillText('FIM DE JOGO', W / 2, 110);
    ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
    ctx.fillText('Pontos: ' + pontos + '   Enter para jogar de novo', W / 2, 145);
    ctx.textAlign = 'left';
  }

  antes = Object.assign({}, keys);
});
`},
{n:"Snake",t:`<p>Muitos jogos clássicos vivem numa <b>grade</b>: em vez de pixels, a posição é uma coluna e uma linha (<code>c</code>, <code>l</code>), e só na hora de desenhar multiplicamos por <code>T</code>, o tamanho da célula. A cobra é uma <b>lista de segmentos</b>, da cabeça para o rabo. Andar é criar uma nova cabeça na frente com <code>unshift</code> e remover o último segmento com <code>pop</code>. Os segmentos do meio nem se mexem: a cobra anda porque a lista muda.</p><p><b>Crescimento:</b> quando a cabeça cai na comida, simplesmente não removemos o rabo naquele passo, e a cobra fica um segmento maior. A colisão com o corpo olha a lista com <code>some</code>, ignorando o rabo quando ele vai sair do lugar.</p><p>Aqui o tempo anda em <b>passos fixos</b>: um acumulador soma o <code>dt</code> e, a cada <code>intervalo</code> segundos, a cobra dá um passo, qualquer que seja a taxa de quadros. O intervalo diminui conforme ela cresce, e por isso o jogo acelera. As teclas entram numa <b>fila</b> de no máximo 2 curvas, para que dois toques rápidos não façam a cobra se virar sobre si mesma.</p><p>Use as setas ou WASD, ou toque na tela para virar na direção do toque. Mude <code>PAREDES_MATAM</code> para <code>false</code> e a cobra dá a volta pelas bordas, como a nave do Asteroids.</p>`,
d:"Crie uma comida especial dourada: aparece de vez em quando, vale 50 pontos e desaparece depois de 5 segundos se não for comida.",
c:`const COLS = 24, LINS = 11, T = 20, Y0 = 20;   // grade de 24 × 11 células (Y0 = espaço do painel)
const PAREDES_MATAM = true;                    // false = a cobra dá a volta pelas bordas

const teclas = {
  ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1],
  ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0]
};
let cobra, dir, fila, comida, pontos, estado, acumulado, msgFim;
let recorde = 0, antes = {}, antesClique = false;

function novaComida() {
  const livres = [];                                     // todas as células vazias
  for (let l = 0; l < LINS; l++)
    for (let c = 0; c < COLS; c++)
      if (!cobra.some(s => s.c === c && s.l === l)) livres.push({ c: c, l: l });
  if (!livres.length) return false;                      // a cobra ocupa tudo: vitória
  comida = livres[Math.floor(Math.random() * livres.length)];
  return true;
}
function iniciar() {
  cobra = [{ c: 6, l: 5 }, { c: 5, l: 5 }, { c: 4, l: 5 }];   // a cabeça vem primeiro
  dir = { dc: 1, dl: 0 }; fila = []; pontos = 0; acumulado = 0; estado = 'espera'; msgFim = '';
  novaComida();
}
iniciar();

const intervalo = () => Math.max(0.06, 0.14 - 0.003 * (cobra.length - 3));   // cresce -> acelera
function terminar(msg) { estado = 'fim'; msgFim = msg; recorde = Math.max(recorde, pontos); }

function virar(dc, dl) {            // guarda a curva na fila (no máximo 2)
  if (!dc && !dl) return;
  const ultima = fila.length ? fila[fila.length - 1] : dir;
  if (dc === -ultima.dc && dl === -ultima.dl) return;    // não pode voltar para trás
  if (dc === ultima.dc && dl === ultima.dl) return;      // já está indo para lá
  if (fila.length < 2) fila.push({ dc: dc, dl: dl });
}

function andar() {                  // um passo da cobra
  if (fila.length) dir = fila.shift();
  let c = cobra[0].c + dir.dc, l = cobra[0].l + dir.dl;
  if (PAREDES_MATAM) {
    if (c < 0 || c >= COLS || l < 0 || l >= LINS) return terminar('FIM DE JOGO');
  } else {
    c = (c + COLS) % COLS; l = (l + LINS) % LINS;
  }
  const comeu = c === comida.c && l === comida.l;
  const corpo = comeu ? cobra : cobra.slice(0, -1);      // sem comer, a ponta do rabo sai do lugar
  if (corpo.some(s => s.c === c && s.l === l)) return terminar('FIM DE JOGO');

  cobra.unshift({ c: c, l: l });                         // nova cabeça na frente
  if (comeu) {
    pontos += 10;                                        // crescer = não tirar o rabo
    if (!novaComida()) terminar('VOCÊ VENCEU!');
  } else {
    cobra.pop();                                         // anda: tira o último segmento
  }
}

loop((dt) => {
  const aperta = (k) => keys[k] && !antes[k];
  const clicou = mouse.down && !antesClique;

  if (estado === 'fim') {
    if (aperta(' ') || aperta('Enter') || clicou) iniciar();
  } else {
    let virou = false;
    Object.keys(teclas).forEach(k => {
      if (aperta(k)) { virar(teclas[k][0], teclas[k][1]); virou = true; }
    });
    if (clicou) {                                        // toque: vira na direção do toque
      const h = cobra[0];
      const vx = mouse.x - (h.c * T + T / 2), vy = mouse.y - (Y0 + h.l * T + T / 2);
      if (Math.abs(vx) > Math.abs(vy)) virar(Math.sign(vx), 0); else virar(0, Math.sign(vy));
      virou = true;
    }
    if (estado === 'espera' && (virou || aperta(' '))) estado = 'jogando';

    if (estado === 'jogando') {                          // passos fixos, não importa o FPS
      acumulado += dt;
      while (acumulado >= intervalo() && estado === 'jogando') {
        acumulado -= intervalo();
        andar();
      }
    }
  }

  // ---------- desenho ----------
  ctx.fillStyle = '#1c130b'; ctx.fillRect(0, 0, W, H);
  for (let l = 0; l < LINS; l++) {
    for (let c = 0; c < COLS; c++) {
      ctx.fillStyle = (c + l) % 2 ? '#4a8f3f' : '#3f8f3a';
      ctx.fillRect(c * T, Y0 + l * T, T, T);
    }
  }
  const cx = comida.c * T + T / 2, cy = Y0 + comida.l * T + T / 2;
  ctx.fillStyle = '#e0483e'; ctx.beginPath(); ctx.arc(cx, cy + 1, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff9f9a'; ctx.fillRect(cx - 4, cy - 4, 3, 3);
  ctx.fillStyle = '#1f4d2a'; ctx.fillRect(cx, cy - 9, 4, 3);                 // folha

  cobra.forEach((s, i) => {
    const x = s.c * T, y = Y0 + s.l * T;
    ctx.fillStyle = '#1c130b'; ctx.fillRect(x, y, T, T);
    ctx.fillStyle = i === 0 ? '#ffd34e' : (i % 2 ? '#e8a317' : '#f0b429');
    ctx.fillRect(x + 2, y + 2, T - 4, T - 4);
    if (i === 0) {                                                            // olhos
      ctx.fillStyle = '#1c130b';
      if (dir.dc) {
        const ex = x + (dir.dc > 0 ? 12 : 5);
        ctx.fillRect(ex, y + 5, 3, 3); ctx.fillRect(ex, y + 12, 3, 3);
      } else {
        const ey = y + (dir.dl > 0 ? 12 : 5);
        ctx.fillRect(x + 5, ey, 3, 3); ctx.fillRect(x + 12, ey, 3, 3);
      }
    }
  });

  ctx.fillStyle = '#fff'; ctx.font = '13px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Pontos: ' + pontos + '   Tamanho: ' + cobra.length + '   Recorde: ' + recorde, 8, 15);
  if (estado === 'espera' || estado === 'fim') {
    ctx.fillStyle = 'rgba(20, 12, 5, 0.7)'; ctx.fillRect(0, Y0, W, H - Y0);
    ctx.textAlign = 'center';
    if (estado === 'espera') {
      ctx.fillStyle = '#ffd34e'; ctx.font = '26px monospace'; ctx.fillText('SNAKE', W / 2, 105);
      ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
      ctx.fillText('Aperte uma seta (ou toque) para começar', W / 2, 140);
    } else {
      ctx.fillStyle = '#ffd34e'; ctx.font = '26px monospace'; ctx.fillText(msgFim, W / 2, 105);
      ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
      ctx.fillText('Pontos: ' + pontos + '   Espaço para jogar de novo', W / 2, 140);
    }
    ctx.textAlign = 'left';
  }

  antes = Object.assign({}, keys);
  antesClique = mouse.down;
});
`},
{n:"Invasores",t:`<p>Um clássico estilo <b>Space Invaders</b>. Aqui aparecem listas de objetos: <code>tiros</code> e <code>inimigos</code>. A cada quadro movemos todos, testamos colisão de cada tiro com cada inimigo e removemos os atingidos com <code>filter</code>.</p><p><b>Sprites no lugar de retângulos.</b> A lógica não mudou: cada inimigo continua sendo um objeto com <code>x</code>, <code>y</code>, <code>w</code> e <code>h</code>, e é essa caixa que entra na colisão. Só o desenho mudou: em vez de <code>fillRect</code>, <code>drawImage(img, x, y, w, h)</code> pinta a imagem dentro da caixa. A nave, o fundo e os três aliens (um por fileira) ficam em <code>assets/invaders/</code>. As imagens são grandes, então tudo é desenhado na metade do tamanho (<code>ESCALA = 0.5</code>).</p><p><b>A nave é uma folha de 5 quadros</b>, em que a chama do motor muda de um quadro para o outro, como no capítulo Spritesheet e estados. O desenho tem espaço vazio em volta, por isso a caixa de colisão (<code>CORPO</code>) é só o corpo da nave, e o quadro é desenhado deslocado para o corpo cair dentro dela. Uma imagem pode demorar para carregar: o código só desenha com <code>pronta(img)</code> e, se um arquivo não for encontrado, mostra um aviso na tela. O botão <b>Baixar assets (.zip)</b> traz a pasta; descompacte-a ao lado do HTML baixado.</p><p>Setas ou A/D movem a nave. A barra de espaço atira. Quando os inimigos tocam a borda, eles descem e mudam de direção.</p>`,
d:"Faça os inimigos ficarem mais rápidos a cada inimigo derrotado (aumente a velocidade 50 aos poucos).",
c:`// Invasores com sprites. As imagens ficam em assets/invaders/ (ao lado do HTML).
// Setas ou A/D movem a nave. A barra de espaço atira.
const PASTA = 'assets/invaders/';
const ESCALA = 0.5;                  // as imagens são grandes: desenhamos na metade do tamanho

let faltou = '';                     // aviso na tela se alguma imagem não for encontrada
function carregar(arquivo) {
  const img = new Image();
  img.onerror = () => { faltou = 'Imagem não encontrada: ' + PASTA + arquivo; };
  img.src = PASTA + arquivo;
  return img;
}
const pronta = (img) => img.complete && img.naturalWidth > 0;   // só desenhe depois de carregada

const fundo = carregar('background.png');                       // 480 × 240, do tamanho da tela
const folhaNave = carregar('spaceship.png');
const QL = 83, QA = 84, QUADROS = 5, FPS = 10;                  // a folha tem 5 quadros de 83 × 84, lado a lado
const CORPO = { x: 9, y: 17, w: 64, h: 42 };                    // o corpo da nave dentro do quadro (o resto é espaço vazio e chama)

// Uma imagem por fileira, com o tamanho original dela
const TIPOS = [
  { img: carregar('alien1.png'), w: 47, h: 34 },
  { img: carregar('alien2.png'), w: 47, h: 34 },
  { img: carregar('alien3.png'), w: 51, h: 39 }
];

// A caixa de colisão é só o corpo da nave (o quadro inteiro seria grande demais)
const nave = { x: W / 2 - CORPO.w * ESCALA / 2, y: H - 36, w: CORPO.w * ESCALA, h: CORPO.h * ESCALA };
let tiros = [], inimigos = [], dir = 1, pontos = 0, fim = '', espera = 0, tempo = 0;

for (let l = 0; l < 3; l++)
  for (let c = 0; c < 8; c++) {
    const t = TIPOS[l];
    inimigos.push({ img: t.img, x: 40 + c * 48, y: 35 + l * 30, w: t.w * ESCALA, h: t.h * ESCALA });
  }

function bate(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

loop((dt) => {
  tempo += dt;                       // relógio da animação da nave
  if (!fim) {
    if (keys.ArrowLeft  || keys.a) nave.x -= 150 * dt;
    if (keys.ArrowRight || keys.d) nave.x += 150 * dt;
    nave.x = Math.max(0, Math.min(W - nave.w, nave.x));

    espera -= dt;
    if (keys[' '] && espera <= 0) {
      tiros.push({ x: nave.x + nave.w / 2 - 2, y: nave.y, w: 4, h: 10 });
      espera = 0.3;
    }
    tiros.forEach(t => t.y -= 320 * dt);
    tiros = tiros.filter(t => t.y > -10);

    let borda = false;
    inimigos.forEach(e => {
      e.x += dir * 35 * dt;
      if (e.x < 0 || e.x + e.w > W) borda = true;
    });
    if (borda) {
      dir *= -1;
      inimigos.forEach(e => { e.y += 14; e.x += dir * 4; });
    }

    tiros.forEach(t => inimigos.forEach(e => {
      if (!t.morto && !e.morto && bate(t, e)) { t.morto = e.morto = true; pontos += 10; }
    }));
    tiros = tiros.filter(t => !t.morto);
    inimigos = inimigos.filter(e => !e.morto);

    if (!inimigos.length) fim = 'Você venceu!';
    if (inimigos.some(e => e.y + e.h >= nave.y)) fim = 'Fim de jogo';
  }

  // ---------- desenho ----------
  if (pronta(fundo)) ctx.drawImage(fundo, 0, 0, W, H);
  else { ctx.fillStyle = '#10201a'; ctx.fillRect(0, 0, W, H); }

  inimigos.forEach(e => { if (pronta(e.img)) ctx.drawImage(e.img, e.x, e.y, e.w, e.h); });

  ctx.fillStyle = '#ffd34e';
  tiros.forEach(t => ctx.fillRect(t.x, t.y, t.w, t.h));

  if (pronta(folhaNave)) {
    const q = Math.floor(tempo * FPS) % QUADROS;                // qual quadro da folha mostrar agora
    // drawImage com 9 argumentos: recorta o quadro q e desenha deslocado, para o corpo cair na caixa
    ctx.drawImage(folhaNave, q * QL, 0, QL, QA,
                  nave.x - CORPO.x * ESCALA, nave.y - CORPO.y * ESCALA, QL * ESCALA, QA * ESCALA);
  }

  ctx.fillStyle = '#fff'; ctx.font = '16px monospace';
  ctx.fillText('Pontos: ' + pontos, 8, 22);
  if (fim) ctx.fillText(fim, W / 2 - 50, H / 2);
  if (faltou) { ctx.fillStyle = '#ff8c82'; ctx.font = '11px monospace'; ctx.fillText(faltou, 8, H - 6); }
});
`},
{n:"Battle Tanks",t:`<p>Hora de juntar tudo num jogo de tanques. O mapa é uma matriz de tiles: <code>#</code> é pedra (indestrutível), <code>b</code> é tijolo e <code>.</code> é chão. Como a matriz é editável, um tiro que acerta um tijolo troca o <code>b</code> por <code>.</code>, e a parede some.</p><p>Cada tanque guarda para onde está virado em <code>(dx, dy)</code>. Essa direção serve para desenhar o canhão e para saber para onde o tiro vai. A câmera do capítulo 9 segue o seu tanque pelo mapa. Use as setas ou WASD para mover e a barra de espaço para atirar. Destrua os 4 tanques vermelhos antes de perder as 3 vidas. Cada inimigo tem um <b>raio de detecção</b> (o círculo tracejado): quando você entra nele, o tanque para, vira para o seu lado e atira mais rápido. A distância é calculada com <code>Math.hypot</code>, e o círculo fica vermelho quando o inimigo te detecta.</p>`,
d:"Faça o inimigo perseguir você: dentro do raio, em vez de ficar parado, ele deve andar até você, só para norte, sul, leste ou oeste, dando a volta nas paredes. Depois tente mudar o valor de RAIO.",
c:`const T = 32;   // tamanho do tile
// # = pedra (indestrutível)   b = tijolo (quebra com tiro)   . = chão
const mapa = [
  '########################',
  '#......................#',
  '#..bb......##......bb..#',
  '#..b..........#.....b..#',
  '#......bbbbbb..bbbbbb..#',
  '#......................#',
  '#.##................##.#',
  '#.b..................b.#',
  '#.b..................b.#',
  '#.##................##.#',
  '#......................#',
  '#......bbbbbb..bbbbbb..#',
  '#..b..........#.....b..#',
  '#..bb......##......bb..#',
  '#......................#',
  '########################'
].map(linha => linha.split(''));   // vira matriz, para podermos editar

const MUNDO = { w: mapa[0].length * T, h: mapa.length * T };
const cam = { x: 0, y: 0 };
const p = { x: 1 * T + 4, y: 14 * T + 4, s: 24, dx: 0, dy: -1 };
let tiros = [], vidas = 3, invul = 0, espera = 0, fim = '';
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const RAIO = 140;   // raio de detecção dos inimigos (em pixels)

function novoRumo(e) {
  const d = DIRS[Math.floor(Math.random() * 4)];
  e.dx = d[0]; e.dy = d[1]; e.troca = 1 + Math.random() * 2;
}
let inimigos = [[2, 1], [21, 1], [11, 5], [21, 10]].map(([c, r]) => {
  const e = { x: c * T + 4, y: r * T + 4, s: 24, dx: 0, dy: 1, tiro: 1 + Math.random() * 2 };
  novoRumo(e);
  return e;
});

function tile(x, y) {
  const linha = mapa[Math.floor(y / T)];
  return (linha && linha[Math.floor(x / T)]) || '#';
}
function livre(o) {   // os 4 cantos precisam estar em chão
  const m = o.s - 1;
  return tile(o.x, o.y) === '.' && tile(o.x + m, o.y) === '.' &&
         tile(o.x, o.y + m) === '.' && tile(o.x + m, o.y + m) === '.';
}
function mover(o, dx, dy) {   // devolve false se bateu em algo
  let ok = true;
  o.x += dx; if (!livre(o)) { o.x -= dx; ok = false; }
  o.y += dy; if (!livre(o)) { o.y -= dy; ok = false; }
  return ok;
}
function bate(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}
function caixa(o) { return { x: o.x, y: o.y, w: o.s, h: o.s }; }
function atirar(o, dono) {   // o tiro sai na direção em que o tanque está virado
  tiros.push({ x: o.x + o.s / 2 + o.dx * 16, y: o.y + o.s / 2 + o.dy * 16,
               dx: o.dx, dy: o.dy, dono });
}
function tanque(o, cor) {
  const x = Math.round(o.x), y = Math.round(o.y);   // posição inteira evita tremor
  const cx = x + o.s / 2, cy = y + o.s / 2, L = 15;
  ctx.fillStyle = cor;
  ctx.fillRect(x, y, o.s, o.s);
  ctx.fillStyle = '#1c130b';   // canhão
  if (o.dx) ctx.fillRect(o.dx > 0 ? cx : cx - L, cy - 3, L, 6);
  else ctx.fillRect(cx - 3, o.dy > 0 ? cy : cy - L, 6, L);
}

loop((dt) => {
  if (!fim) {
    // jogador: anda em uma direção por vez
    const v = 130 * dt;
    let mx = 0, my = 0;
    if (keys.ArrowLeft || keys.a) mx = -1;
    else if (keys.ArrowRight || keys.d) mx = 1;
    else if (keys.ArrowUp || keys.w) my = -1;
    else if (keys.ArrowDown || keys.s) my = 1;
    if (mx || my) { p.dx = mx; p.dy = my; mover(p, mx * v, my * v); }

    espera -= dt; invul -= dt;
    if (keys[' '] && espera <= 0) { atirar(p, 'jogador'); espera = 0.35; }

    // inimigos: patrulham; se o jogador entra no raio, miram nele e atiram rápido
    inimigos.forEach(e => {
      e.tiro -= dt;
      const vx = p.x - e.x, vy = p.y - e.y;
      e.alerta = Math.hypot(vx, vy) < RAIO;   // distância até o jogador
      if (e.alerta) {
        // para e vira para o lado em que o jogador está mais longe (4 direções)
        if (Math.abs(vx) > Math.abs(vy)) { e.dx = Math.sign(vx) || 1; e.dy = 0; }
        else { e.dx = 0; e.dy = Math.sign(vy) || 1; }
        if (e.tiro <= 0) { atirar(e, 'inimigo'); e.tiro = 0.9; }
      } else {
        e.troca -= dt;
        if (e.troca <= 0 || !mover(e, e.dx * 70 * dt, e.dy * 70 * dt)) novoRumo(e);
        if (e.tiro <= 0) { atirar(e, 'inimigo'); e.tiro = 1.5 + Math.random() * 2; }
      }
    });

    // tiros
    tiros.forEach(t => {
      t.x += t.dx * 320 * dt; t.y += t.dy * 320 * dt;
      const c = tile(t.x, t.y);
      if (c !== '.') {
        if (c === 'b') mapa[Math.floor(t.y / T)][Math.floor(t.x / T)] = '.';   // quebra o tijolo
        t.morto = true;
      }
      const alvo = { x: t.x - 3, y: t.y - 3, w: 6, h: 6 };
      if (t.dono === 'jogador') {
        inimigos.forEach(e => {
          if (!t.morto && !e.morto && bate(alvo, caixa(e))) { t.morto = e.morto = true; }
        });
      } else if (!t.morto && invul <= 0 && bate(alvo, caixa(p))) {
        t.morto = true; vidas--; invul = 1.5;
      }
    });
    tiros = tiros.filter(t => !t.morto);
    inimigos = inimigos.filter(e => !e.morto);

    if (!inimigos.length) fim = 'Vitória!';
    if (vidas <= 0) fim = 'Fim de jogo';
  }

  // câmera: segue o tanque sem sair do mundo
  cam.x = Math.max(0, Math.min(MUNDO.w - W, p.x + p.s / 2 - W / 2));
  cam.y = Math.max(0, Math.min(MUNDO.h - H, p.y + p.s / 2 - H / 2));

  ctx.fillStyle = '#4f7f3a';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  for (let r = 0; r < mapa.length; r++) {
    for (let c = 0; c < mapa[r].length; c++) {
      const t = mapa[r][c], x = c * T, y = r * T;
      if (t === '#') {
        ctx.fillStyle = '#6e7681'; ctx.fillRect(x, y, T, T);
        ctx.fillStyle = '#8b949e'; ctx.fillRect(x + 3, y + 3, T - 6, T - 6);
      } else if (t === 'b') {
        ctx.fillStyle = '#5e3410'; ctx.fillRect(x, y, T, T);   // argamassa
        for (let k = 0; k < 4; k++) {
          for (let b = 0; b < 3; b++) {
            const bx = (k % 2 ? -8 : 0) + b * 16;   // fileiras alternadas
            const x0 = Math.max(0, bx), x1 = Math.min(T, bx + 16);
            if (x1 - x0 < 3) continue;
            ctx.fillStyle = (b + k) % 2 ? '#c0692a' : '#a85a24';
            ctx.fillRect(x + x0 + 1, y + k * 8 + 1, x1 - x0 - 1, 7);
          }
        }
      }
    }
  }
  ctx.setLineDash([6, 6]);   // círculo tracejado = raio de detecção
  inimigos.forEach(e => {
    ctx.strokeStyle = e.alerta ? 'rgba(255,90,70,.95)' : 'rgba(255,255,255,.3)';
    ctx.beginPath();
    ctx.arc(Math.round(e.x) + e.s / 2, Math.round(e.y) + e.s / 2, RAIO, 0, Math.PI * 2);
    ctx.stroke();
  });
  ctx.setLineDash([]);
  inimigos.forEach(e => tanque(e, '#e0483e'));
  if (invul <= 0 || Math.floor(invul * 10) % 2) tanque(p, '#ffd34e');
  ctx.fillStyle = '#fff';
  tiros.forEach(t => ctx.fillRect(Math.round(t.x) - 3, Math.round(t.y) - 3, 6, 6));
  ctx.restore();

  ctx.fillStyle = '#fff'; ctx.font = '16px monospace';
  ctx.fillStyle = '#e0483e';
  for (let i = 0; i < vidas; i++) ctx.fillText('♥', 10 + i * 24, 22);   // um coração por vida
  ctx.fillStyle = '#fff';
  ctx.fillText('Inimigos: ' + inimigos.length, 90, 22);
  if (fim) { ctx.font = '22px monospace'; ctx.fillText(fim, W / 2 - 70, H / 2); }
});
`},
{n:"Jogo final",t:`<p>Chegou a hora de juntar tudo num jogo de verdade: uma <b>plataforma no estilo Mario</b>, em que você derrota os inimigos <b>pulando na cabeça deles</b> e leva dano se encostar por qualquer outro lado. Ele usa o mapa do Tiled (capítulo 19), a gravidade e o pulo (8), as folhas de sprites por estado (12), a colisão em grade (18), os estados do jogo (26) e a câmera (9). São dois mapas, três tipos de inimigos e um final.</p><p><b>As 7 camadas do mapa.</b> Os dois arquivos <code>.tmx</code> têm as mesmas camadas, e o jogo acha cada uma pelo <b>nome</b>. <code>Layer03</code>, <code>Layer02</code> e <code>Layer01</code> são os fundos, do mais distante para o mais próximo (por isso vêm primeiro no arquivo e são desenhados primeiro). <code>Platforms</code> guarda as plataformas onde o jogador e os inimigos pisam: qualquer tile diferente de 0 é sólido. <code>Transition</code> é uma camada de objetos em que cada retângulo tem a propriedade <code>map</code>, o nome do próximo mapa (ou <code>end</code>, que termina o jogo). <code>Enemies</code> tem um objeto para cada inimigo, com a propriedade <code>type</code> (<code>enemy1</code>, <code>enemy2</code> ou <code>enemy3</code>) e a posição em que ele nasce. E <code>PlayerStart</code> marca onde os pés do jogador começam. Uma <b>propriedade</b> é um par nome e valor que você cria no Tiled e que aparece no arquivo como <code>&lt;property name="type" value="enemy1"/&gt;</code>. A função <code>lerObjeto</code> junta todas elas num objeto <code>props</code>.</p><p><b>O leitor guarda a ordem.</b> Diferente do capítulo 19, <code>lerTMX</code> percorre o arquivo e devolve uma lista só de camadas, na ordem em que estão, cada uma com um <code>tipo</code>: <code>tiles</code> (grade de números), <code>imagem</code> (camada de imagem do Tiled) ou <code>objetos</code>. Assim o jogo funciona tanto se os fundos <code>Layer_01.png</code>, <code>Layer_02.png</code> e <code>Layer_03.png</code> forem camadas de imagem quanto se forem camadas de tiles. As camadas de tiles são pintadas <b>uma vez só</b> numa imagem fora da tela (<code>pintarCamada</code>). As camadas de imagem são ampliadas até cobrir a altura da tela e repetidas na horizontal, e andam mais devagar que a câmera: é o <b>parallax</b>. Quanto menor o número em <code>PARALAXE</code>, mais longe parece estar a camada. O tileset também pode vir num arquivo <code>.tsx</code> separado, e o código lê os dois casos.</p><p><b>Atores e estados.</b> O jogador tem os estados <code>hit</code>, <code>idle</code> e <code>walk</code>. O <code>enemy1</code> e o <code>enemy2</code> também têm esses três: eles andam um tempo e param um tempo, e o <code>idle</code> aparece nas paradas. O <code>enemy3</code> só tem <code>fly</code> e <code>hit</code>: ele voa para os lados, sobe e desce numa onda de <code>Math.cos</code> e não sofre gravidade. Cada estado é uma folha com os quadros lado a lado, como no capítulo 12. O código espera um arquivo por estado, no formato <code>ator_estado.png</code> dentro de <code>assets/final/</code> (por exemplo, <code>player_walk.png</code>), e a função <code>arquivo</code> fica no topo para você acertar os nomes. O número de quadros de cada folha é descoberto por <code>contarQuadros</code>: ela procura o maior número de partes iguais em que a imagem se divide, com desenho em todas e colunas transparentes entre elas (se errar, preencha <code>LARGURA</code> com a largura de um quadro). A caixa de colisão sai do próprio desenho: <code>medirCorpo</code> lê os pixels do primeiro quadro com <code>getImageData</code> e acha o menor retângulo que envolve tudo o que não é transparente. Dele saem o tamanho do corpo e o ponto dos pés, que é a âncora do desenho.</p><p><b>A regra do pisão.</b> Depois que o jogador se move, o jogo testa se a caixa dele encosta na de cada inimigo. Se ele estava <b>caindo</b> (<code>vy &gt; 0</code>) e, no quadro anterior, os pés estavam <b>acima do meio</b> do inimigo (<code>pesAntes</code>), foi um pisão: o inimigo vira <code>morto</code>, mostra o estado <code>hit</code>, cai e some, e o jogador quica (mais alto se estiver segurando o pulo) e ganha pontos. Qualquer outro encontro é dano: o jogador perde uma vida, é empurrado para longe do inimigo, fica atordoado por 0,4 s no estado <code>hit</code> e pisca por 1,5 s, tempo em que novos golpes não contam (a <b>invulnerabilidade</b>), mas ele ainda pode pisar. Cair num buraco também custa uma vida e leva de volta ao início do mapa. Sem vidas, o modo vira <code>fim</code>.</p><p><b>Os inimigos que andam.</b> Eles usam a mesma gravidade e a mesma colisão do jogador (<code>mover</code>) e viram quando batem na parede e também <b>na beirada</b>: antes de andar, olham o tile logo à frente, abaixo dos pés, e se estiver vazio dão meia-volta em vez de cair. O voador volta para perto do ponto de origem depois de <code>ALCANCE</code> pixels.</p><p><b>Câmera.</b> A câmera do capítulo 9 volta, agora <b>suave</b>: em vez de pular para o alvo, ela anda uma fração do caminho a cada quadro, <code>cam += (alvo - cam) * k</code>, o que se chama interpolação (<i>lerp</i>). O alvo é o jogador no centro da tela, limitado às bordas do mapa por <code>limitar</code>. Para desenhar, <code>ctx.translate(-cam.x, -cam.y)</code> transforma as coordenadas do mundo em coordenadas da tela, e <code>ZOOM</code> aproxima ou afasta tudo.</p><p><b>Mapas e final.</b> Quando a caixa do jogador entra num retângulo de <code>Transition</code>, o jogo lê a propriedade <code>map</code>. Só vale a parte de <b>dentro</b> do retângulo, a uma <code>margem</code> de 15 pixels da borda, para a troca não disparar por um simples encostão. Em seguida o jogo mostra a tela de <i>Carregando…</i> por <b>pelo menos 1 segundo</b>, mesmo que o arquivo chegue antes (a conta usa <code>performance.now()</code> e um <code>setTimeout</code> com o tempo que falta), e então carrega aquele arquivo (o caminho vale a partir da pasta do mapa atual) e recomeça no <code>PlayerStart</code> dele, mantendo vidas e pontos. Se o valor for <code>end</code>, o modo vira <code>venceu</code>. Nas telas de fim e de vitória, Enter ou um clique começa de novo. O mapa inicial é o <code>map1.tmx</code> (<code>PRIMEIRO_MAPA</code>), e o segundo é o que o <code>Transition</code> do primeiro indicar. Setas ou WASD andam e espaço pula. Como nos capítulos anteriores, a página precisa ser aberta por um servidor local. Com <code>DEPURAR = true</code> você vê as caixas de colisão e as saídas.</p>`,
d:"Faça a câmera olhar um pouco à frente do jogador, para o lado em que ele está virado, em vez de ficar sempre centralizada nele. Depois teste outros valores para a distância.",
c:`// Jogo final: plataforma estilo Mario, com dois mapas do Tiled, três inimigos e câmera.
// ← → (ou A D) andam e Espaço (ou ↑ / W) pula. Pule NA CABEÇA do inimigo para derrotá-lo.
// Atenção: o navegador só deixa o código ler arquivos por um servidor (veja o texto abaixo).

// ---------- configuração ----------
const PASTA = 'assets/final/';          // pasta com os mapas e as imagens
const PRIMEIRO_MAPA = 'map1.tmx';       // o mapa em que o jogo começa
const ZOOM = 1;                         // 1 = pixel do mapa = pixel do desenho. 2 = câmera mais perto
const DEPURAR = false;                  // true: mostra as caixas de colisão e as saídas
const VIDAS = 3;

const GRAV = 1000, PULO = 400, VEL = 100, COYOTE = 0.1;
const QUICO = 250;                      // impulso para cima ao pisar num inimigo
// Para onde cada desenho olha nas folhas originais: true = direita, false = esquerda.
// O robô olha para a direita e os inimigos para a esquerda. Se um ator sair virado ao contrário, troque o valor dele.
const OLHA_DIREITA = { player: true, enemy1: false, enemy2: false, enemy3: false };
const CORPO = 0.8;                      // quanto da largura do desenho conta como corpo na colisão

// Cada ator tem uma folha de imagem por estado: assets/final/<ator>_<estado>.png
const ATORES = {
  player: ['hit', 'idle', 'walk'],
  enemy1: ['hit', 'idle', 'walk'],
  enemy2: ['hit', 'idle', 'walk'],
  enemy3: ['fly', 'hit']
};
const arquivo = (ator, estado) => PASTA + ator + '_' + estado + '.png';   // mude aqui se os nomes forem outros
const FPS = { idle: 6, walk: 10, fly: 10, hit: 10 };
const LARGURA = {};                     // só se o jogo errar a contagem de quadros: { enemy1: 48 } (largura de cada quadro)

// Cada tipo de inimigo (o valor da propriedade "type" do objeto no Tiled)
const TIPOS = {
  enemy1: { vel: 25, voa: false },      // anda devagar
  enemy2: { vel: 45, voa: false },      // anda mais rápido
  enemy3: { vel: 40, voa: true }        // voa, sobe e desce
};
const ALCANCE = 96;                     // até onde o inimigo voador vai antes de voltar
// Fundos que são "camada de imagem" andam mais devagar que a câmera (parallax): menor = mais longe
const PARALAXE = { Layer03: 0.2, Layer02: 0.4, Layer01: 0.6 };

// ---------- 1) ler o arquivo do Tiled ----------
const num = (el, nome, padrao = 0) => el.hasAttribute(nome) ? Number(el.getAttribute(nome)) : padrao;

function xmlDe(texto) {
  const xml = new DOMParser().parseFromString(texto, 'application/xml');
  if (xml.querySelector('parsererror')) throw new Error('um arquivo do Tiled está com erro de XML');
  return xml.documentElement;
}

function lerTileset(ts) {                 // <tileset> dentro do mapa, ou a raiz de um arquivo .tsx
  const img = ts.querySelector('image');
  if (!img) throw new Error('o tileset precisa ser uma imagem só');
  const tw = num(ts, 'tilewidth'), th = num(ts, 'tileheight');
  const margem = num(ts, 'margin'), espaco = num(ts, 'spacing');
  return {
    tw, th, margem, espaco, imagem: img.getAttribute('source'),
    colunas: num(ts, 'columns') || Math.floor((num(img, 'width') - 2 * margem + espaco) / (tw + espaco))
  };
}

function lerObjeto(o) {
  const props = {};                       // as propriedades que você criou no Tiled (type, map...)
  o.querySelectorAll('property').forEach(p => {
    props[p.getAttribute('name')] = p.hasAttribute('value') ? p.getAttribute('value') : p.textContent;
  });
  const h = num(o, 'height');
  return {
    x: num(o, 'x'), y: num(o, 'y') - (o.hasAttribute('gid') ? h : 0),   // objeto-imagem: o y do Tiled é a BASE
    w: num(o, 'width'), h, props,
    tipo: o.getAttribute('type') || o.getAttribute('class') || o.getAttribute('name') || ''
  };
}

// Devolve { cols, lins, T, tilesets, camadas }. As camadas ficam NA ORDEM DO ARQUIVO (fundo primeiro)
// e cada uma tem um tipo: 'tiles' (grade de números), 'imagem' (fundo) ou 'objetos' (retângulos).
function lerTMX(texto) {
  const m = xmlDe(texto);
  const mapa = { cols: num(m, 'width'), lins: num(m, 'height'), T: num(m, 'tilewidth'), tilesets: [], camadas: [] };
  [...m.children].forEach(el => {
    const nome = el.getAttribute('name');
    const px = el.hasAttribute('parallaxx') ? num(el, 'parallaxx') : null;
    if (el.tagName === 'tileset') {
      mapa.tilesets.push(el.hasAttribute('source')
        ? { primeiro: num(el, 'firstgid'), fonte: el.getAttribute('source') }        // .tsx separado
        : { primeiro: num(el, 'firstgid'), ...lerTileset(el) });
    } else if (el.tagName === 'layer') {
      const d = el.querySelector('data');
      if (d.getAttribute('encoding') !== 'csv') throw new Error('no Tiled, use o formato de camada CSV');
      mapa.camadas.push({ tipo: 'tiles', nome, px, visivel: num(el, 'visible', 1) !== 0, dados: d.textContent.split(',').map(Number) });
    } else if (el.tagName === 'imagelayer') {
      mapa.camadas.push({ tipo: 'imagem', nome, px: px ?? PARALAXE[nome] ?? 0.5, imagem: el.querySelector('image').getAttribute('source') });
    } else if (el.tagName === 'objectgroup') {
      mapa.camadas.push({ tipo: 'objetos', nome, objetos: [...el.querySelectorAll('object')].map(lerObjeto) });
    }
  });
  return mapa;
}

// Uma imagem só vale depois de carregada: a Promise avisa quando isso acontece
function carregarImagem(url) {
  return new Promise((ok, falha) => {
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = () => falha(new Error('imagem não encontrada: ' + url));
    img.src = url;
  });
}

// Pinta UMA camada de tiles numa imagem do tamanho do mapa (fora da tela), uma vez só
function pintarCamada(mapa, camada) {
  const T = mapa.T, c = document.createElement('canvas');
  c.width = mapa.cols * T; c.height = mapa.lins * T;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  camada.dados.forEach((gid, i) => {
    gid = gid & 0x1FFFFFFF;                                 // tira os bits de espelhamento do Tiled
    if (gid === 0) return;                                  // 0 = célula vazia
    const ts = mapa.tilesets.filter(t => t.primeiro <= gid).pop();   // de qual folha é este tile?
    const k = gid - ts.primeiro;
    const sx = ts.margem + (k % ts.colunas) * (ts.tw + ts.espaco);
    const sy = ts.margem + Math.floor(k / ts.colunas) * (ts.th + ts.espaco);
    g.drawImage(ts.img, sx, sy, ts.tw, ts.th, (i % mapa.cols) * T, Math.floor(i / mapa.cols) * T + T - ts.th, ts.tw, ts.th);
  });
  return c;
}

// ---------- 2) carregar um mapa inteiro ----------
async function carregarMapa(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(url.pathname + ' (erro ' + resp.status + ')');
  const mapa = lerTMX(await resp.text());
  mapa.url = url;
  mapa.nome = url.pathname.split('/').pop();

  for (const ts of mapa.tilesets) {                         // o caminho de cada imagem vale a partir do arquivo que a cita
    let base = url;
    if (ts.fonte) {
      base = new URL(ts.fonte, url);
      const r = await fetch(base);
      if (!r.ok) throw new Error(ts.fonte + ' (erro ' + r.status + ')');
      Object.assign(ts, lerTileset(xmlDe(await r.text())));
    }
    ts.img = await carregarImagem(new URL(ts.imagem, base).href);
  }
  for (const c of mapa.camadas) {
    if (c.tipo === 'imagem') c.img = await carregarImagem(new URL(c.imagem, url).href);
    if (c.tipo === 'tiles' && c.visivel) c.tela = pintarCamada(mapa, c);
  }

  const plat = mapa.camadas.find(c => c.tipo === 'tiles' && c.nome === 'Platforms');
  if (!plat) throw new Error('não achei a camada Platforms em ' + mapa.nome);
  mapa.chao = plat.dados;
  const objetos = n => (mapa.camadas.find(c => c.tipo === 'objetos' && c.nome === n) || { objetos: [] }).objetos;
  mapa.inicio = objetos('PlayerStart')[0];
  if (!mapa.inicio) throw new Error('faltou o objeto da camada PlayerStart em ' + mapa.nome);
  mapa.inimigos = objetos('Enemies');
  mapa.saidas = objetos('Transition');
  return mapa;
}

// ---------- 3) os atores: folhas de sprites e caixa do corpo ----------
const sprites = {};                       // sprites[ator][estado] = { img, qw, qh, n }

// Descobre o corpo olhando os pixels do 1º quadro: a caixa que envolve tudo o que não é transparente
function medirCorpo(s) {
  const c = document.createElement('canvas');
  c.width = s.qw; c.height = s.qh;
  const g = c.getContext('2d');
  g.drawImage(s.img, 0, 0, s.qw, s.qh, 0, 0, s.qw, s.qh);
  let x0 = s.qw, y0 = s.qh, x1 = 0, y1 = 0;
  try {
    const d = g.getImageData(0, 0, s.qw, s.qh).data;
    for (let y = 0; y < s.qh; y++)
      for (let x = 0; x < s.qw; x++)
        if (d[(y * s.qw + x) * 4 + 3] > 20) {                // o 4º número de cada pixel é a transparência
          x0 = Math.min(x0, x); x1 = Math.max(x1, x + 1);
          y0 = Math.min(y0, y); y1 = Math.max(y1, y + 1);
        }
  } catch (e) { }
  if (x1 <= x0) { x0 = s.qw * 0.3; x1 = s.qw * 0.7; y0 = s.qh * 0.3; y1 = s.qh; }   // plano B: um chute
  return {
    w: Math.max(4, Math.round((x1 - x0) * CORPO)), h: Math.max(4, y1 - y0),
    ax: (x0 + x1) / 2 / s.qw, ay: y1 / s.qh                 // onde ficam os pés dentro do quadro (de 0 a 1)
  };
}

// Descobre quantos quadros tem a folha: o maior n em que a largura se divide em n partes iguais,
// cada parte tem desenho e os cortes caem em colunas transparentes. Se não achar, supõe quadros quadrados.
function contarQuadros(img) {
  const quadrado = Math.max(1, Math.round(img.width / img.height));
  try {
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    const d = g.getImageData(0, 0, img.width, img.height).data;
    const col = [];                                          // col[x] = true se a coluna x tem algum pixel visível
    for (let x = 0; x < img.width; x++) {
      col[x] = false;
      for (let y = 0; y < img.height && !col[x]; y++) if (d[(y * img.width + x) * 4 + 3] > 20) col[x] = true;
    }
    for (let n = Math.min(32, img.width); n >= 2; n--) {
      if (img.width % n) continue;
      const q = img.width / n;
      let ok = q >= 4;
      for (let k = 0; k < n && ok; k++) {
        let tem = false;
        for (let x = k * q; x < (k + 1) * q; x++) if (col[x]) tem = true;
        if (!tem || (k > 0 && (col[k * q - 1] || col[k * q]))) ok = false;
      }
      if (ok) return n;
    }
  } catch (e) { }
  return quadrado;
}

async function carregarSprites() {
  for (const ator in ATORES) {
    const s = sprites[ator] = {};
    for (const estado of ATORES[ator]) {
      const img = await carregarImagem(arquivo(ator, estado));
      const n = LARGURA[ator] ? Math.max(1, Math.round(img.width / LARGURA[ator])) : contarQuadros(img);
      s[estado] = { img, qw: Math.round(img.width / n), qh: img.height, n };   // quadros lado a lado
    }
    s.corpo = medirCorpo(s.idle || s.fly);
  }
}

// ---------- 4) as regras do jogo ----------
let mapa, modo = 'carregando', mensagem = [];   // modo: carregando, jogando, fim, venceu ou erro
let vidas = VIDAS, pontos = 0, inimigos = [];
const cam = { x: 0, y: 0 };
const p = { w: 12, h: 16, x: 0, y: 0, vx: 0, vy: 0, noChao: false, coyote: 0, esq: false, estado: 'idle',
            tempo: 0, invul: 0, dano: 0, puloAntes: false, pesAntes: 0 };

const solido = (c, l) => {
  if (c < 0 || c >= mapa.cols) return true;               // as laterais do mapa são paredes
  if (l < 0 || l >= mapa.lins) return false;              // em cima e embaixo é aberto: dá para cair no buraco
  return mapa.chao[l * mapa.cols + c] !== 0;
};
const sobrepoe = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const limitar = (v, a, b) => b < a ? (a + b) / 2 : Math.max(a, Math.min(b, v));   // se não cabe, centraliza

function bate(o, x, y) {
  const T = mapa.T;
  const c0 = Math.floor(x / T), c1 = Math.floor((x + o.w - 0.01) / T);
  const l0 = Math.floor(y / T), l1 = Math.floor((y + o.h - 0.01) / T);
  for (let l = l0; l <= l1; l++)
    for (let c = c0; c <= c1; c++)
      if (solido(c, l)) return true;
  return false;
}

// Move qualquer coisa (jogador ou inimigo) um eixo de cada vez, como nos capítulos de colisão
function mover(o, dt) {
  const T = mapa.T;
  o.bateu = false;
  o.x += o.vx * dt;                                         // 1) só em X
  if (bate(o, o.x, o.y)) {
    o.x = o.vx > 0 ? Math.floor((o.x + o.w) / T) * T - o.w : (Math.floor(o.x / T) + 1) * T;
    o.vx = 0; o.bateu = true;
  }
  o.y += o.vy * dt;                                         // 2) só em Y
  o.noChao = false;
  if (bate(o, o.x, o.y)) {
    if (o.vy > 0) { o.y = Math.floor((o.y + o.h) / T) * T - o.h; o.noChao = true; }
    else o.y = (Math.floor(o.y / T) + 1) * T;
    o.vy = 0;
  }
}

function criarInimigo(o) {
  const tipo = (o.props.type || o.tipo).trim();             // a propriedade "type" que você pôs no Tiled
  if (!TIPOS[tipo] || !sprites[tipo]) return null;          // tipo desconhecido: ignora
  const c = sprites[tipo].corpo, x = o.x + o.w / 2 - c.w / 2;
  return { tipo, ...TIPOS[tipo], w: c.w, h: c.h, x, y: o.y + o.h - c.h, x0: x, vx: 0, vy: 0,
           dir: -1, esq: true, noChao: false, t: 0, parado: false, relogio: 2 + Math.random() * 3,
           morto: false, tHit: 0 };
}

function iniciarMapa() {
  const c = sprites.player.corpo;
  p.w = c.w; p.h = c.h;
  p.x = mapa.inicio.x + mapa.inicio.w / 2 - p.w / 2;        // o objeto do Tiled marca onde os pés começam
  p.y = mapa.inicio.y + mapa.inicio.h - p.h;
  p.vx = p.vy = 0; p.invul = p.dano = 0; p.estado = 'idle'; p.tempo = 0;
  inimigos = mapa.inimigos.map(criarInimigo).filter(Boolean);
  seguir(0, true);
}

function novoJogo() {
  modo = 'carregando'; vidas = VIDAS; pontos = 0;
  carregarMapa(primeiroMapa).then(m => { mapa = m; iniciarMapa(); modo = 'jogando'; }).catch(erroCarga);
}

function erroCarga(e) {
  mensagem = ['Não deu para carregar o mapa.', e.message];
  modo = 'erro';
}

function atualizarJogador(dt) {
  const esq = keys.ArrowLeft || keys.a, dir = keys.ArrowRight || keys.d;
  const pulo = keys.ArrowUp || keys.w || keys[' '];
  const apertou = pulo && !p.puloAntes;
  p.puloAntes = !!pulo;
  p.dano = Math.max(0, p.dano - dt);
  p.invul = Math.max(0, p.invul - dt);

  if (p.dano > 0) {
    p.vx -= p.vx * Math.min(1, 4 * dt);                     // atordoado: sem controle, só o empurrão que some
  } else {
    const alvo = (dir ? 1 : 0) - (esq ? 1 : 0);
    if (alvo) p.esq = alvo < 0;
    p.vx += (alvo * VEL - p.vx) * Math.min(1, 12 * dt);
  }

  p.coyote = p.noChao ? COYOTE : p.coyote - dt;             // coyote time e pulo variável (capítulo 18)
  if (apertou && p.coyote > 0 && p.dano <= 0) { p.vy = -PULO; p.coyote = 0; }
  const g = (p.vy < 0 && !pulo) ? GRAV * 2.2 : GRAV;
  p.vy = Math.min(p.vy + g * dt, 400);

  p.pesAntes = p.y + p.h;                                   // onde estavam os pés ANTES de mover (vale para o pisão)
  mover(p, dt);

  const novo = p.dano > 0 ? 'hit' : (Math.abs(p.vx) > 8 && p.noChao) ? 'walk' : 'idle';
  if (novo !== p.estado) { p.estado = novo; p.tempo = 0; }
  p.tempo += dt;
}

function moverInimigo(e, dt) {
  e.t += dt;
  if (e.morto) {                                            // derrotado: mostra 'hit', cai e some
    e.tHit += dt; e.vx = 0;
    e.vy = Math.min(e.vy + GRAV * dt, 400);
    mover(e, dt);
    return;
  }
  if (e.voa) {
    if (Math.abs(e.x - e.x0) > ALCANCE) e.dir = e.x > e.x0 ? -1 : 1;     // passou do alcance: volta
    e.vx = e.dir * e.vel;
    e.vy = Math.cos(e.t * 3) * 30;                          // sobe e desce como uma onda
  } else {
    e.relogio -= dt;                                        // anda um tempo, para um tempo (idle)
    if (e.relogio <= 0) { e.parado = !e.parado; e.relogio = e.parado ? 1 : 2 + Math.random() * 3; }
    if (e.noChao) {                                         // chegou na beirada? vira, em vez de cair
      const c = Math.floor((e.dir > 0 ? e.x + e.w + 1 : e.x - 1) / mapa.T);
      const l = Math.floor((e.y + e.h + 1) / mapa.T);
      if (!solido(c, l)) e.dir = -e.dir;
    }
    e.vx = e.parado ? 0 : e.dir * e.vel;
    e.vy = Math.min(e.vy + GRAV * dt, 400);
  }
  mover(e, dt);
  if (e.bateu) e.dir = -e.dir;                              // bateu na parede: vira
  e.esq = e.dir < 0;
}

function ferir(e) {
  vidas--;
  p.invul = 1.5; p.dano = 0.4;                              // pisca por 1,5 s e fica atordoado por 0,4 s
  p.vx = (p.x + p.w / 2 < e.x + e.w / 2 ? -1 : 1) * 130;    // empurrão para longe do inimigo
  p.vy = -180;
  if (vidas <= 0) modo = 'fim';
}

function tratarInimigos() {
  for (const e of inimigos) {
    if (e.morto || !sobrepoe(p, e)) continue;
    // PISÃO: o jogador está caindo e, no quadro anterior, os pés estavam acima do meio do inimigo
    if (p.vy > 0 && p.pesAntes <= e.y + e.h / 2) {
      e.morto = true; e.tHit = 0; e.vy = -120;
      p.vy = (keys.ArrowUp || keys.w || keys[' ']) ? -QUICO * 1.4 : -QUICO;   // quica; segurando o pulo, quica mais alto
      pontos += 100;
    } else if (p.invul <= 0) {                              // qualquer outro encontro é dano
      ferir(e);
      if (modo !== 'jogando') return;
    }
  }
}

function tratarQueda() {
  if (p.y < mapa.lins * mapa.T + 40) return;                // ainda não caiu no buraco
  vidas--;
  if (vidas <= 0) { modo = 'fim'; return; }
  p.x = mapa.inicio.x + mapa.inicio.w / 2 - p.w / 2;        // volta ao início do mapa
  p.y = mapa.inicio.y + mapa.inicio.h - p.h;
  p.vx = p.vy = 0; p.invul = 1;
}

function tratarSaidas() {
  for (const s of mapa.saidas) {
    const margem = 15;

    if (!sobrepoe(p, {
        x: s.x + margem,
        y: s.y + margem,
        w: Math.max(1, s.w - margem * 2),
        h: Math.max(1, s.h - margem * 2)
    })) continue;
    const destino = String(s.props.map || '').trim();       // a propriedade "map" do objeto Transition
    if (destino.toLowerCase() === 'end') { modo = 'venceu'; return; }
    modo = 'carregando';
    const url = new URL(
        destino.endsWith('.tmx') ? destino : destino + '.tmx',
        mapa.url
    );

    const inicio = performance.now();

    carregarMapa(url).then(m => {
        const espera = Math.max(0, 1000 - (performance.now() - inicio));

        setTimeout(() => {
            mapa = m;
            iniciarMapa();
            modo = 'jogando';
        }, espera);
    }).catch(erroCarga);
    return;
  }
}

// A câmera segue o jogador de forma suave, sem passar das bordas do mapa
function seguir(dt, direto) {
  const vw = W / ZOOM, vh = H / ZOOM, T = mapa.T;
  const alvoX = limitar(p.x + p.w / 2 - vw / 2, 0, mapa.cols * T - vw);
  const alvoY = limitar(p.y + p.h / 2 - vh / 2, 0, mapa.lins * T - vh);
  const k = direto ? 1 : Math.min(1, 6 * dt);               // 1 = vai direto; menor = desliza até o alvo
  cam.x += (alvoX - cam.x) * k;
  cam.y += (alvoY - cam.y) * k;
}

// ---------- 5) desenho ----------
function texto(t, x, y, cor) {
  ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.lineJoin = 'round';
  ctx.strokeText(t, x, y);
  ctx.fillStyle = cor || '#fff';
  ctx.fillText(t, x, y);
}

function desenharAtor(ator, estado, tempo, o) {
  const s = sprites[ator][estado], c = sprites[ator].corpo;
  const quadro = Math.floor(tempo * FPS[estado]) % s.n;
  ctx.save();
  ctx.translate(Math.round(o.x + o.w / 2), Math.round(o.y + o.h));       // origem = meio dos pés
  if (o.esq === OLHA_DIREITA[ator]) ctx.scale(-1, 1);                    // espelha para olhar para o outro lado
  ctx.drawImage(s.img, quadro * s.qw, 0, s.qw, s.qh, -Math.round(c.ax * s.qw), -Math.round(c.ay * s.qh), s.qw, s.qh);
  ctx.restore();
}

function fundo(c, cx) {                   // camada de imagem: cobre a altura da tela e repete na horizontal
  const esc = H / c.img.height, w = Math.ceil(c.img.width * esc);
  const desloc = ((cx * ZOOM * c.px) % w + w) % w;
  ctx.imageSmoothingEnabled = esc < 1;
  for (let x = -desloc; x < W; x += w) ctx.drawImage(c.img, Math.round(x), 0, w, H);
}

function desenhar() {
  const cx = Math.round(cam.x), cy = Math.round(cam.y);
  ctx.fillStyle = '#1c2a3a'; ctx.fillRect(0, 0, W, H);

  mapa.camadas.forEach(c => {                               // na ordem do arquivo: Layer03, Layer02, Layer01, Platforms...
    if (c.tipo === 'imagem') { fundo(c, cx); return; }
    if (c.tipo !== 'tiles' || !c.tela) return;
    const px = c.px ?? 1;                                   // 1 = anda junto com a câmera
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.scale(ZOOM, ZOOM);
    ctx.translate(-Math.round(cx * px), -Math.round(cy * px));
    ctx.drawImage(c.tela, 0, 0);
    ctx.restore();
  });

  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.scale(ZOOM, ZOOM);
  ctx.translate(-cx, -cy);                                  // daqui em diante, as coordenadas são do MUNDO
  inimigos.forEach(e => {
    const estado = e.morto ? 'hit' : e.voa ? 'fly' : e.parado ? 'idle' : 'walk';
    desenharAtor(e.tipo, estado, e.morto ? e.tHit : e.t, e);
  });
  if (p.invul <= 0 || p.dano > 0 || Math.floor(p.invul * 10) % 2)   // pisca enquanto está invulnerável
    desenharAtor('player', p.estado, p.tempo, p);
  if (DEPURAR) {
    ctx.lineWidth = 1 / ZOOM;
    ctx.strokeStyle = '#ffd34e'; ctx.strokeRect(p.x, p.y, p.w, p.h);
    ctx.strokeStyle = '#e0483e'; inimigos.forEach(e => ctx.strokeRect(e.x, e.y, e.w, e.h));
    ctx.strokeStyle = '#4aa3e0'; mapa.saidas.forEach(s => ctx.strokeRect(s.x, s.y, s.w, s.h));
  }
  ctx.restore();

  ctx.font = '16px monospace'; ctx.textAlign = 'left';
  for (let i = 0; i < vidas; i++) texto('♥', 10 + i * 20, 22, '#e0483e');
  ctx.font = '12px monospace';
  texto('Pontos: ' + pontos, 10, 40);
  ctx.textAlign = 'right';
  texto(mapa.nome, W - 8, 16);

  if (modo === 'jogando') return;
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = '24px monospace';
  texto(modo === 'fim' ? 'FIM DE JOGO' : modo === 'venceu' ? 'VOCÊ VENCEU!' : 'Carregando...', W / 2, H / 2 - 6, '#ffd34e');
  if (modo !== 'carregando') {
    ctx.font = '12px monospace';
    texto('Pontos: ' + pontos, W / 2, H / 2 + 16);
    texto('Enter ou clique: jogar de novo', W / 2, H / 2 + 34);
  }
}

function aviso(linhas) {
  ctx.fillStyle = '#16301c'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
  linhas.forEach((t, i) => ctx.fillText(t, W / 2, 96 + i * 20, W - 20));
}

// ---------- 6) carregar tudo e só então começar ----------
const primeiroMapa = new URL(PASTA + PRIMEIRO_MAPA, location.href);

function comecar() {
  loop((dt) => {
    if (modo === 'erro') { aviso(mensagem); return; }
    if (modo === 'jogando') {
      atualizarJogador(dt);
      inimigos.forEach(e => moverInimigo(e, dt));
      inimigos = inimigos.filter(e => !(e.morto && e.tHit > 0.6) && e.y < mapa.lins * mapa.T + 100);
      if (modo === 'jogando') tratarInimigos();
      if (modo === 'jogando') tratarQueda();
      if (modo === 'jogando') tratarSaidas();
      seguir(dt, false);
    } else if ((modo === 'fim' || modo === 'venceu') && (keys.Enter || mouse.down)) {
      novoJogo();
    }
    desenhar();
  });
}

aviso(['Carregando ' + PASTA + '...']);
carregarSprites()
  .then(() => carregarMapa(primeiroMapa))
  .then(m => { mapa = m; iniciarMapa(); modo = 'jogando'; comecar(); })
  .catch(e => aviso([
    'Não deu para carregar o jogo.',
    e.message,
    'Abra o guia por um servidor local (veja o texto).'
  ]));
`},
