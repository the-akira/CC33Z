  });

  // ---------- quadros, transformações e tamanho ----------
  function novoQuadro(copia){
    if(quadros.length>=MAX_QUADROS){aviso('No máximo '+MAX_QUADROS+' quadros.');return}
    const antes=foto();
    quadros.splice(qi+1,0,copia?quadros[qi].slice():vazio(N)); qi++;
    confirmar(antes); tudo();
  }
  function excluirQuadro(){
    if(quadros.length<2)return;
    const antes=foto();
    quadros.splice(qi,1); qi=Math.min(qi,quadros.length-1);
    confirmar(antes); tudo();
  }
  function mexer(f){const antes=foto();quadros[qi]=f(quadros[qi]);confirmar(antes);tudo()}   // aplica uma transformação no quadro atual
  const virarH=g=>g.map((_,i)=>g[Math.floor(i/N)*N+(N-1-i%N)]);
  const virarV=g=>g.map((_,i)=>g[(N-1-Math.floor(i/N))*N+i%N]);
  const girar=g=>g.map((_,i)=>g[(N-1-i%N)*N+Math.floor(i/N)]);          // 90° no sentido horário
  const deslocar=(dx,dy)=>g=>{const r=vazio(N);g.forEach((v,i)=>{r[((Math.floor(i/N)+dy+N)%N)*N+(i%N+dx+N)%N]=v});return r};
  function redimensionar(n){                                // muda o tamanho: o desenho fica no canto superior esquerdo
    if(n===N)return;
    const antes=foto(), m=Math.min(N,n);
    quadros=quadros.map(g=>{const r=vazio(n);for(let y=0;y<m;y++)for(let x=0;x<m;x++)r[y*n+x]=g[y*N+x];return r});
    N=n; foco=null;
    confirmar(antes); tudo();
  }

  // ---------- exportar e importar ----------
  function folha(lista){                                    // PNG com os quadros lado a lado, todos do mesmo tamanho
    const esc=+q$('#pxesc').value, c=document.createElement('canvas');
    c.width=N*esc*lista.length; c.height=N*esc;
    const x=c.getContext('2d'); x.imageSmoothingEnabled=false;
    lista.forEach((g,i)=>x.drawImage(bitmap(g),i*N*esc,0,N*esc,N*esc));
    return c;
  }
  function baixar(canvas,nome){
    canvas.toBlob(b=>{
      if(!b){erro('Não deu para gerar o PNG.');return}
      const url=URL.createObjectURL(b), a=document.createElement('a');
      a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      aviso('Arquivo '+nome+' baixado.');
    },'image/png');
  }
  function matriz(){                                        // o desenho em texto, no formato do capítulo Sprites e animação
    const letra={}; PALETA.forEach(([l,c])=>{letra[c]=l});
    const usadas=[]; quadros.forEach(g=>g.forEach(v=>{if(v&&!usadas.includes(v))usadas.push(v)}));
    let k=0;
    usadas.forEach(c=>{
      if(letra[c])return;
      if(k>=EXTRAS.length)throw new Error('Cores demais para virar letras ('+usadas.length+'). Use no máximo '+(PALETA.length+EXTRAS.length)+' cores.');
      letra[c]=EXTRAS[k++];
    });
    const cores=usadas.map(c=>letra[c]+": '"+c+"'").join(', ');
    const blocos=quadros.map((g,i)=>{
      const linhas=[];
      for(let y=0;y<N;y++){let s='';for(let x=0;x<N;x++)s+=g[y*N+x]?letra[g[y*N+x]]:'.';linhas.push("    '"+s+"'")}
      return '  [ // quadro '+i+'\n'+linhas.join(',\n')+'\n  ]';
    });
    return '// Pixel Art: '+N+' × '+N+', '+quadros.length+' quadro(s). O ponto (.) é transparente.\nconst cores = { '+cores+' };\nconst matrizes = [\n'+blocos.join(',\n')+'\n];\n';
  }
  function importar(img){                                   // abre uma imagem: cabe até 64 × 64 (maiores são reduzidas)
    const w0=img.naturalWidth, h0=img.naturalHeight;
    if(!w0||!h0)throw new Error('Essa imagem não tem tamanho (SVG?). Use um PNG.');
    const maior=Math.max(w0,h0), n=TAMANHOS.find(t=>t>=maior)||64, esc=maior>64?64/maior:1;
    const c=document.createElement('canvas'); c.width=c.height=n;
    const x=c.getContext('2d',{willReadFrequently:true}); x.imageSmoothingEnabled=false;
    x.drawImage(img,0,0,Math.max(1,Math.round(w0*esc)),Math.max(1,Math.round(h0*esc)));
    const d=x.getImageData(0,0,n,n).data, g=vazio(n);
    for(let i=0;i<n*n;i++){
      if(d[i*4+3]<128)continue;                             // pouco opaco = transparente
      g[i]='#'+[d[i*4],d[i*4+1],d[i*4+2]].map(v=>v.toString(16).padStart(2,'0')).join('');
    }
    const antes=foto(), m=Math.min(N,n);
    if(n!==N){                                              // ajusta o tamanho dos outros quadros
      quadros=quadros.map(f=>{const r=vazio(n);for(let yy=0;yy<m;yy++)for(let xx=0;xx<m;xx++)r[yy*n+xx]=f[yy*N+xx];return r});
      N=n;
    }
    quadros[qi]=g; foco=null;
    confirmar(antes); tudo();
    aviso('Imagem aberta ('+w0+' × '+h0+').');
  }

  // ---------- botões e campos ----------
  raiz.addEventListener('click',e=>{
    const t=e.target.closest('.pxa-ferr .pt');
    if(t){ferramenta(t.dataset.t);return}
    const sw=e.target.closest('.sw');
    if(sw){escolher(sw.dataset.c);salvar();return}
    const pq=e.target.closest('.pq');
    if(pq){qi=+pq.dataset.q;foco=null;tudo();salvar();return}
    const b=e.target.closest('[data-acao]');
    if(!b)return;
    erro('');
    const acoes={
      desfazer,refazer,
      limpar:()=>mexer(()=>vazio(N)),
      virarh:()=>mexer(virarH), virarv:()=>mexer(virarV), girar:()=>mexer(girar),
      esq:()=>mexer(deslocar(-1,0)), dir:()=>mexer(deslocar(1,0)), cima:()=>mexer(deslocar(0,-1)), baixo:()=>mexer(deslocar(0,1)),
      novo:()=>novoQuadro(false), dup:()=>novoQuadro(true), excluir:excluirQuadro,
      animar:()=>{anim=!anim;pvi=0;ajustarTimer();pintarPrevia()},
      png:()=>baixar(folha([quadros[qi]]),'pixel-art.png'),
      sheet:()=>baixar(folha(quadros),'pixel-art-spritesheet.png'),
      matriz:async()=>{
        try{
          const ok=await copiarTexto(matriz());
          aviso(ok?'Matriz copiada! Cole no capítulo Sprites e animação.':'Não consegui copiar. Tente outro navegador.');
        }catch(err){erro(err.message)}
      }
    };
    if(acoes[b.dataset.acao])acoes[b.dataset.acao]();
  });
  q$('#pxcor').addEventListener('input',e=>{cor=e.target.value;pintarPaleta()});
  q$('#pxcor').addEventListener('change',e=>{               // ao fechar o seletor, a cor nova entra na paleta
    if(!paleta.includes(cor)&&paleta.length<MAX_CORES)paleta.push(cor);
    else if(!paleta.includes(cor))aviso('A paleta está cheia ('+MAX_CORES+' cores).');
    pintarPaleta(); salvar();
  });
  q$('#pxg').addEventListener('change',e=>{grade=e.target.checked;desenhar();salvar()});
  q$('#pxex').addEventListener('change',e=>{espX=e.target.checked;desenhar();salvar()});
  q$('#pxey').addEventListener('change',e=>{espY=e.target.checked;desenhar();salvar()});
  q$('#pxch').addEventListener('change',e=>{cheio=e.target.checked;salvar()});
  q$('#pxn').addEventListener('change',e=>redimensionar(+e.target.value));
  q$('#pxfps').addEventListener('change',e=>{fps=+e.target.value;ajustarTimer();salvar()});
  q$('#pxarq').addEventListener('change',e=>{
    const f=e.target.files[0]; e.target.value='';
    if(!f)return;
    erro('');
    const url=URL.createObjectURL(f), img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);try{importar(img)}catch(err){erro(err.message)}};
    img.onerror=()=>{URL.revokeObjectURL(url);erro('Não consegui abrir esse arquivo como imagem.')};
    img.src=url;
  });

  // ---------- começar ----------
  carregarSalvo();
  q$('#pxg').checked=grade; q$('#pxex').checked=espX; q$('#pxey').checked=espY; q$('#pxch').checked=cheio; q$('#pxfps').value=String(fps);
  ferramenta('lapis'); pintarPaleta(); tudo();
}

// ---------- Bônus: Editor de Mapas ----------
// Também não há código para editar: é uma ferramenta. O mapa é só uma lista com um caractere por casa
// ('#' parede, '.' chão, S início, R rupia, V e H guardas). O que você pinta vira o texto que os capítulos usam.
// O mapa fica salvo neste navegador (localStorage).
function montarEditorMapas(raiz){
  const MAXC=64, MAXL=40, MINC=10, MINL=8, MAX_HIST=60, CHAVE='guiaGames:editormapas';
  const TILES=[['#','Parede','#6a70a8','1'],['.','Chão','#4a3d68','2'],['S','Início','#4aa3e0','3'],
               ['R','Rupia','#ff4fa3','4'],['V','Guarda ↕','#e0483e','5'],['H','Guarda ↔','#e0483e','6']];
  const NOME=Object.fromEntries(TILES.map(t=>[t[0],t[1]]));
  const FERRAMENTAS=[['lapis','Lápis','B'],['linha','Linha','L'],['retangulo','Retângulo','R'],['balde','Balde','G']];
  const NOME_FERR=Object.fromEntries(FERRAMENTAS.map(f=>[f[0],f[1]]));
  const EXEMPLOS=['Minimapa','Névoa de guerra e visão'];
  const lim=(v,a,b)=>Math.max(a,Math.min(b,v));

  let C=30, L=15, g=[], tile='#', ferr='lapis', grade=true, cheio=false;
  let hist=[], refaz=[], arrasto=null, foco=null, tSalvar=0, tMsg=0;

  // mapa inicial: tudo parede, com uma salinha e o início dentro dela
  g=new Array(C*L).fill('#');
  for(let y=2;y<=6;y++)for(let x=2;x<=8;x++)g[y*C+x]='.';
  g[4*C+4]='S';

  raiz.innerHTML=`
  <div class="pxa">
    <div class="box">
      <h3 class="px">MAPA</h3>
      <div class="pxa-ferr" role="toolbar" aria-label="Ferramentas de desenho">${FERRAMENTAS.map(([id,nome,tecla])=>
        `<button type="button" class="pt" data-t="${id}" aria-pressed="false" title="${nome} (${tecla})">${nome}<kbd>${tecla}</kbd></button>`).join('')}</div>
      <div class="mpe-tela"><canvas id="mpc" tabindex="0" role="img"></canvas></div>
      <div class="pxa-status" id="mps"></div>
      <div class="mpe-val" id="mpv" role="status"></div>
      <div class="pxa-msg" id="mpm" role="status"></div>
      <div class="err" id="mpe" role="alert"></div>
    </div>

    <div class="pxa-lado">
      <div class="box">
        <h3 class="px">TILES</h3>
        <div class="pxa-in pxa-grade" role="group" aria-label="Tiles para pintar">${TILES.map(([k,nome,cor,tecla])=>
          `<button type="button" class="pt mpe-t" data-k="${k}" aria-pressed="false" title="${nome} (${tecla})"><i style="background:${cor}"></i>${nome}<kbd>${tecla}</kbd></button>`).join('')}</div>
        <div class="pxa-in pxa-atual">O botão direito pinta parede.</div>
      </div>

      <div class="box">
        <h3 class="px">OPÇÕES</h3>
        <div class="pxa-in pxa-col">
          <div class="pxa-linha" style="margin-top:0">
            <label>Largura <input type="number" id="mpw" min="${MINC}" max="${MAXC}" inputmode="numeric"></label>
            <label>Altura <input type="number" id="mph" min="${MINL}" max="${MAXL}" inputmode="numeric"></label>
          </div>
          <label><input type="checkbox" id="mpg"> Grade</label>
          <label><input type="checkbox" id="mpch"> Forma cheia</label>
        </div>
      </div>

      <div class="box">
        <h3 class="px">AÇÕES</h3>
        <div class="pxa-in pxa-grade">
          <button type="button" class="pt" data-acao="desfazer" id="mpdes" title="Desfazer (Ctrl+Z)">Desfazer</button>
          <button type="button" class="pt" data-acao="refazer" id="mpref" title="Refazer (Ctrl+Y)">Refazer</button>
          <button type="button" class="pt" data-acao="limpar" title="Tudo parede">Limpar</button>
          <button type="button" class="pt" data-acao="chao" title="Tudo chão">Tudo chão</button>
          <button type="button" class="pt" data-acao="moldura" title="Parede em volta do mapa">Moldura</button>
          <button type="button" class="pt" data-acao="gerar" title="Sorteia salas ligadas por corredores">Gerar salas</button>
        </div>
      </div>

      <div class="box">
        <h3 class="px">USAR O MAPA</h3>
        <div class="pxa-in pxa-col">
          <div class="pxa-grade">
            <button type="button" data-acao="copiar" title="Gera MAPA, INICIO, RUPIAS e GUARDAS e copia">Copiar código</button>
            <button type="button" class="alt" data-acao="carregar" title="Lê o texto da caixa abaixo e troca o mapa">Carregar do texto</button>
            <button type="button" data-acao="minimapa" title="Troca as constantes no código do capítulo Minimapa e abre o capítulo">Abrir no Minimapa</button>
            <button type="button" class="alt" data-acao="nevoa" title="Troca as constantes no código do capítulo Névoa de guerra (mapa até 30 × 15) e abre o capítulo">Abrir na Névoa</button>
          </div>
          <textarea id="mpt" class="mpe-txt" spellcheck="false" aria-label="Texto do mapa: copie daqui ou cole um mapa para carregar" placeholder="Aqui aparece o código do mapa. Você também pode colar um MAPA de um capítulo e clicar em Carregar do texto."></textarea>
          <label class="pxa-sel">Exemplo <select id="mpex">${EXEMPLOS.map(n=>`<option value="${n}">${n}</option>`).join('')}</select></label>
          <button type="button" class="alt" data-acao="exemplo">Carregar exemplo</button>
        </div>
      </div>
    </div>
  </div>`;

  const q$=s=>raiz.querySelector(s);
  const cv=q$('#mpc'), ctx=cv.getContext('2d');
  const dentro=(x,y)=>x>=0&&x<C&&y>=0&&y<L;

  // ---------- salvar e carregar ----------
  function carregarSalvo(){
    try{
      const d=JSON.parse(localStorage.getItem(CHAVE)||'null');
      if(!d||!Number.isInteger(d.C)||!Number.isInteger(d.L)||d.C<MINC||d.C>MAXC||d.L<MINL||d.L>MAXL)return;
      if(typeof d.g!=='string'||d.g.length!==d.C*d.L||/[^#.SRVH]/.test(d.g))return;     // dado quebrado: ignora
      C=d.C; L=d.L; g=d.g.split('');
      const s=g.indexOf('S'); g.forEach((v,i)=>{if(v==='S'&&i!==s)g[i]='.'});            // o início é um só
      if(TILES.some(t=>t[0]===d.tile))tile=d.tile;
      if(FERRAMENTAS.some(f=>f[0]===d.ferr))ferr=d.ferr;
      grade=d.grade!==false; cheio=!!d.cheio;
    }catch(e){}
  }
  function salvar(){                                          // espera 0,3 s sem mudanças para gravar uma vez só
    clearTimeout(tSalvar);
    tSalvar=setTimeout(()=>{try{localStorage.setItem(CHAVE,JSON.stringify({C,L,g:g.join(''),tile,ferr,grade,cheio}))}catch(e){}},300);
  }

  // ---------- desfazer e refazer: guardamos "fotos" do mapa inteiro ----------
  const foto=()=>({C,L,g:g.slice()});
  function confirmar(antes){                                  // chame depois de mudar algo: só entra no histórico se mudou mesmo
    const mudou=antes.C!==C||antes.L!==L||antes.g.some((v,i)=>v!==g[i]);
    if(mudou){hist.push(antes);if(hist.length>MAX_HIST)hist.shift();refaz.length=0}
    salvar();
  }
  function voltarPara(f){C=f.C;L=f.L;g=f.g.slice();foco=null;salvar();tudo()}
  function desfazer(){if(arrasto||!hist.length)return;refaz.push(foto());voltarPara(hist.pop())}
  function refazer(){if(arrasto||!refaz.length)return;hist.push(foto());voltarPara(refaz.pop())}

  // ---------- análise: o mapa é jogável? ----------
  // Busca em largura a partir do Início (como no capítulo Labirintos e cavernas): quem ela não alcança está preso.
  function analise(m){
    let ini=-1, chao=0; const rup=[], gua=[];
    m.forEach((v,i)=>{
      if(v!=='#')chao++;
      if(v==='S'&&ini<0)ini=i; else if(v==='R')rup.push(i); else if(v==='V'||v==='H')gua.push(i);
    });
    const ruins=new Set(); let alc=0;
    if(ini>=0){
      const vis=new Uint8Array(C*L), fila=[ini]; vis[ini]=1;
      for(let k=0;k<fila.length;k++){
        const i=fila[k], x=i%C, y=(i-x)/C;
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
          const a=x+dx, b=y+dy;
          if(a<0||a>=C||b<0||b>=L)return;
          const j=b*C+a;
          if(vis[j]||m[j]==='#')return;
          vis[j]=1; fila.push(j);
        });
      }
      alc=fila.length;
      rup.concat(gua).forEach(i=>{if(!vis[i])ruins.add(i)});
    }
    return {ini,chao,rup,gua,ruins,alc};
  }

  // ---------- desenho ----------
  function desenhar(){
    // Cada casa precisa ter um número INTEIRO de pixels na tela. Antes o canvas era esticado pelo CSS até a
    // largura da caixa; com essa escala quebrada, umas casas saíam com 25 pixels e outras com 26 (casas desiguais).
    const dpr=window.devicePixelRatio||1;
    const livre=cv.parentElement.clientWidth-24-6;               // largura livre: a caixa menos o padding (2 × 12) e a borda (2 × 3)
    const s=lim(Math.floor(livre*dpr/C),4,Math.round(48*dpr));   // lado de cada casa, em pixels do canvas
    if(cv.width!==C*s||cv.height!==L*s){cv.width=C*s;cv.height=L*s}
    cv.style.width=(C*s/dpr)+'px'; cv.style.height=(L*s/dpr)+'px';   // 1 pixel do canvas = 1 pixel da tela, sem esticar
    const m=arrasto&&arrasto.previa?arrasto.previa:g, a=analise(m);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let y=0;y<L;y++)for(let x=0;x<C;x++){
      const v=m[y*C+x], px=x*s, py=y*s;
      ctx.fillStyle=v==='#'?'#6a70a8':'#4a3d68'; ctx.fillRect(px,py,s,s);
      if(v==='S'){
        ctx.fillStyle='#4aa3e0'; ctx.fillRect(px+s*.15,py+s*.15,s*.7,s*.7);
        ctx.fillStyle='#10223a'; ctx.font='bold '+Math.floor(s*.55)+'px monospace'; ctx.fillText('S',px+s/2,py+s/2+1);
      }else if(v==='R'){
        ctx.fillStyle='#ff4fa3'; ctx.beginPath();
        ctx.moveTo(px+s/2,py+s*.1); ctx.lineTo(px+s*.8,py+s/2); ctx.lineTo(px+s/2,py+s*.9); ctx.lineTo(px+s*.2,py+s/2); ctx.fill();
      }else if(v==='V'||v==='H'){
        ctx.fillStyle='#e0483e'; ctx.beginPath(); ctx.arc(px+s/2,py+s/2,s*.4,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.font='bold '+Math.floor(s*.55)+'px monospace'; ctx.fillText(v==='V'?'↕':'↔',px+s/2,py+s/2+1);
      }
    }
    if(grade){
      ctx.strokeStyle='rgba(0,0,0,0.28)'; ctx.lineWidth=1; ctx.beginPath();
      for(let x=0;x<=C;x++){ctx.moveTo(x*s+.5,0);ctx.lineTo(x*s+.5,L*s)}
      for(let y=0;y<=L;y++){ctx.moveTo(0,y*s+.5);ctx.lineTo(C*s,y*s+.5)}
      ctx.stroke();
    }
    ctx.strokeStyle='#ff3b30'; ctx.lineWidth=Math.max(2,s/8);   // contorno vermelho: o jogador nunca chega aqui
    a.ruins.forEach(i=>{const x=(i%C)*s, y=Math.floor(i/C)*s; ctx.strokeRect(x+2,y+2,s-4,s-4)});
    if(foco){ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(foco[0]*s+1,foco[1]*s+1,s-2,s-2)}
    mostrarAnalise(a);
  }
  function mostrarAnalise(a){
    const p=[];
    if(a.ini<0)p.push('falta o Início (S)');
    if(!a.rup.length)p.push('coloque pelo menos 1 rupia');
    if(a.ruins.size)p.push(a.ruins.size+(a.ruins.size>1?' itens fora':' item fora')+' do alcance (contorno vermelho)');
    const resumo='chão '+a.chao+' · rupias '+a.rup.length+' · guardas '+a.gua.length;
    const v=q$('#mpv');
    v.classList.toggle('ruim',p.length>0);
    v.textContent=p.length?'⚠ '+p.join('; ')+' · '+resumo:'✔ Tudo ao alcance do Início · '+resumo;
  }
  function status(){
    const t=foco&&dentro(foco[0],foco[1])?'Coluna '+foco[0]+', linha '+foco[1]+' · '+NOME[g[foco[1]*C+foco[0]]]+' · ':'';
    q$('#mps').textContent=t+'Mapa '+C+' × '+L+' · pincel: '+NOME[tile]+' · '+NOME_FERR[ferr];
  }
  function aviso(t){q$('#mpm').textContent=t;clearTimeout(tMsg);tMsg=setTimeout(()=>{q$('#mpm').textContent=''},3500)}
  function erro(t){q$('#mpe').textContent=t}
  function botoes(){
    raiz.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===ferr)));
    raiz.querySelectorAll('[data-k]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===tile)));
    q$('#mpdes').disabled=!hist.length; q$('#mpref').disabled=!refaz.length;
  }
  function tudo(){
    q$('#mpw').value=C; q$('#mph').value=L; q$('#mpg').checked=grade; q$('#mpch').checked=cheio;
    cv.setAttribute('aria-label','Mapa de '+C+' colunas por '+L+' linhas. Com o foco aqui, use as setas para mover o cursor e Espaço ou Enter para pintar. Teclas 1 a 6 escolhem o tile.');
    desenhar(); botoes(); status();
  }

  // ---------- ferramentas (todas mexem só na lista g) ----------
  function pintar(m,x,y,t){                                   // põe o tile t em (x, y); o Início é um só
    if(!dentro(x,y))return;
    if(t==='S')m.forEach((v,i)=>{if(v==='S')m[i]='.'});
    m[y*C+x]=t;
  }
  function linha(x0,y0,x1,y1,f){                              // Bresenham, o mesmo da linha do Pixel Art
    const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1;
    let err=dx+dy;
    for(;;){
      f(x0,y0);
      if(x0===x1&&y0===y1)break;
      const e2=2*err;
      if(e2>=dy){err+=dy;x0+=sx}
      if(e2<=dx){err+=dx;y0+=sy}
    }
  }
  function retangulo(x0,y0,x1,y1,cheio,f){
    const xa=Math.min(x0,x1), xb=Math.max(x0,x1), ya=Math.min(y0,y1), yb=Math.max(y0,y1);
    for(let y=ya;y<=yb;y++)for(let x=xa;x<=xb;x++)if(cheio||x===xa||x===xb||y===ya||y===yb)f(x,y);
  }
  function encher(m,x,y,t){                                   // balde: espalha pelas casas vizinhas com o mesmo tile
    const alvo=m[y*C+x]; if(alvo===t)return;
    const pilha=[[x,y]];
    while(pilha.length){
      const [a,b]=pilha.pop();
      if(!dentro(a,b)||m[b*C+a]!==alvo)continue;
      m[b*C+a]=t;
      pilha.push([a+1,b],[a-1,b],[a,b+1],[a,b-1]);
    }
  }
  function ferramenta(t){ferr=t;salvar();botoes();status()}
  function escolher(k){tile=k;salvar();botoes();status()}

  function comecar(x,y,direito,teclado){
    erro('');
    const t=direito?'#':tile;
    let f=ferr;
    if(t==='S'&&f!=='lapis'){f='lapis';aviso('O Início é um só: o lápis coloca ele.')}
    if(f==='balde'){
      if(!'#.'.includes(t)){aviso('O balde serve para parede e chão.');return}
      if(!dentro(x,y))return;
      const antes=foto(); encher(g,x,y,t); confirmar(antes); tudo(); return;
    }
    if(f==='lapis'){
      if(!dentro(x,y))return;
      arrasto={tipo:'traco',antes:foto(),t,x,y,teclado};
      pintar(g,x,y,t); desenhar(); return;
    }
    arrasto={tipo:f,antes:foto(),t,x0:x,y0:y,previa:null,teclado};
    mover(x,y);
  }
  function mover(x,y){
    const a=arrasto; if(!a)return;
    x=lim(x,0,C-1); y=lim(y,0,L-1);
    if(a.tipo==='traco'){linha(a.x,a.y,x,y,(cx,cy)=>pintar(g,cx,cy,a.t));a.x=x;a.y=y;return}
    const m=g.slice(), f=(cx,cy)=>pintar(m,cx,cy,a.t);
    if(a.tipo==='linha')linha(a.x0,a.y0,x,y,f); else retangulo(a.x0,a.y0,x,y,cheio,f);
    a.previa=m;
  }
  function terminar(){
    const a=arrasto; if(!a)return;
    arrasto=null;
    if(a.previa)g=a.previa;
    confirmar(a.antes); tudo();
  }

  // ---------- mouse, toque e caneta ----------
  const celula=e=>{
    const r=cv.getBoundingClientRect(), w=cv.clientWidth||r.width, h=cv.clientHeight||r.height;
    return[Math.floor((e.clientX-r.left-cv.clientLeft)*C/w),Math.floor((e.clientY-r.top-cv.clientTop)*L/h)];
  };
  cv.addEventListener('pointerdown',e=>{
    if(e.button!==0&&e.button!==2)return;
    e.preventDefault(); cv.focus({preventScroll:true});
    try{cv.setPointerCapture(e.pointerId)}catch(err){}
    const [x,y]=celula(e); foco=dentro(x,y)?[x,y]:null;
    comecar(x,y,e.button===2,false);
  });
  cv.addEventListener('pointermove',e=>{
    const [x,y]=celula(e);
    foco=dentro(x,y)?[x,y]:null;
    if(arrasto)mover(x,y);
    desenhar(); status();
  });
  ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>terminar()));
  cv.addEventListener('pointerleave',()=>{if(!arrasto){foco=null;desenhar();status()}});
  cv.addEventListener('contextmenu',e=>e.preventDefault());

  // ---------- teclado ----------
  raiz.addEventListener('keydown',e=>{
    if(e.target.closest&&e.target.closest('select,input,textarea'))return;
    const k=e.key.toLowerCase(), cmd=e.ctrlKey||e.metaKey;
    if(cmd&&(k==='z'||k==='y')){e.preventDefault();(k==='y'||e.shiftKey)?refazer():desfazer();return}
    if(cmd||e.altKey)return;
    const atalhos={b:'lapis',l:'linha',r:'retangulo',g:'balde'};
    if(atalhos[k]){e.preventDefault();ferramenta(atalhos[k]);return}
    const t=TILES.find(x=>x[3]===k);
    if(t){e.preventDefault();escolher(t[0]);return}
    if(e.target!==cv)return;
    if(e.key.startsWith('Arrow')){                            // cursor pelo teclado
      e.preventDefault();
      const [x,y]=foco||[0,0];
      foco=[lim(x+(k==='arrowright'?1:0)-(k==='arrowleft'?1:0),0,C-1),lim(y+(k==='arrowdown'?1:0)-(k==='arrowup'?1:0),0,L-1)];
      if(arrasto)mover(foco[0],foco[1]);
      desenhar(); status();
    }else if(e.key===' '||e.key==='Enter'){                   // Espaço ou Enter faz o papel do clique
      e.preventDefault();
      const [x,y]=foco||[0,0]; foco=[x,y];
      if(arrasto&&arrasto.teclado){mover(x,y);terminar()}     // 2º toque de uma linha ou retângulo: termina
      else{comecar(x,y,false,true);if(arrasto&&arrasto.tipo==='traco')terminar()}
    }else if(e.key==='Escape'&&arrasto){arrasto=null;desenhar()}
  });

  // ---------- tamanho, limpar e gerar ----------
  function mudar(f){const antes=foto();f();foco=null;confirmar(antes);tudo()}
  function redimensionar(nc,nl){                              // o mapa fica no canto de cima à esquerda
    nc=lim(nc|0,MINC,MAXC); nl=lim(nl|0,MINL,MAXL);
    if(nc===C&&nl===L){tudo();return}
    mudar(()=>{
      const n=new Array(nc*nl).fill('#');
      for(let y=0;y<Math.min(L,nl);y++)for(let x=0;x<Math.min(C,nc);x++)n[y*nc+x]=g[y*C+x];
      C=nc; L=nl; g=n;
    });
  }
  function gerar(){
    if(C<20||L<12){erro('Para gerar salas, use pelo menos 20 de largura e 12 de altura.');return}
    erro('');
    mudar(()=>{
      const nc=Math.floor(C/10), nl=Math.max(1,Math.floor(L/7)), cw=Math.floor(C/nc), ch=Math.floor(L/nl);
      const n=new Array(C*L).fill('#'), salas=[];
      const sorteio=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
      for(let j=0;j<nl;j++)for(let i=0;i<nc;i++){            // uma sala em cada célula da grade
        const w=sorteio(4,cw-3), h=sorteio(3,ch-3);
        const x0=i*cw+sorteio(1,cw-w-1), y0=j*ch+sorteio(1,ch-h-1);
        salas.push({x0,y0,x1:x0+w-1,y1:y0+h-1});
        for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)n[y*C+x]='.';
      }
      const centro=r=>[(r.x0+r.x1)>>1,(r.y0+r.y1)>>1];
      const corredor=(a,b)=>{                                // vai de um centro ao outro: primeiro em x, depois em y
        let [x,y]=centro(a); const [x1,y1]=centro(b);
        while(x!==x1){n[y*C+x]='.';x+=x1>x?1:-1}
        while(y!==y1){n[y*C+x]='.';y+=y1>y?1:-1}
        n[y*C+x]='.';
      };
      const ordem=[];                                        // liga as salas em zigue-zague, fileira por fileira
      for(let j=0;j<nl;j++){const f=[];for(let i=0;i<nc;i++)f.push(j*nc+i);if(j%2)f.reverse();ordem.push(...f)}
      for(let k=1;k<ordem.length;k++)corredor(salas[ordem[k-1]],salas[ordem[k]]);
      for(let k=nc;k<salas.length;k++)if(Math.random()<.5)corredor(salas[k-nc],salas[k]);   // atalhos: o mapa ganha voltas
      const [ic,il]=centro(salas[ordem[0]]); n[il*C+ic]='S';
      let rupias=0, guardas=0;
      ordem.slice(1).forEach((k,idx)=>{
        const r=salas[k], [cx,cy]=centro(r);
        if(rupias<8){n[sorteio(r.y0,r.y1)*C+sorteio(r.x0,r.x1)]='R';rupias++}
        if(guardas<3&&idx%2===1&&n[cy*C+cx]==='.'){n[cy*C+cx]=(r.x1-r.x0>=r.y1-r.y0)?'H':'V';guardas++}
      });
      g=n;
    });
    aviso('Mapa novo! Ajuste do seu jeito.');
  }

  // ---------- exportar e importar ----------
  function codigo(){                                          // o texto que os capítulos usam
    const linhas=[];
    for(let y=0;y<L;y++){let r='';for(let x=0;x<C;x++)r+=g[y*C+x]==='#'?'#':'.';linhas.push("  '"+r+"'")}
    const a=analise(g);
    let ini=a.ini; if(ini<0){ini=g.indexOf('.');if(ini<0)ini=0}
    const par=i=>[i%C,Math.floor(i/C)];
    const rup=a.rup.map(i=>'['+par(i).join(', ')+']').join(', ');
    const gua=a.gua.map(i=>{const [c,l]=par(i);return '{ c: '+c+', l: '+l+', dx: '+(g[i]==='H'?1:0)+', dy: '+(g[i]==='V'?1:0)+' }'}).join(', ');
    return 'const MAPA = [\n'+linhas.join(',\n')+'\n];\n'+
           'const INICIO = { c: '+par(ini)[0]+', l: '+par(ini)[1]+' };\n'+
           'const RUPIAS = ['+rup+'];\n'+
           'const GUARDAS = ['+gua+'];';
  }
  async function copiar(){
    erro('');
    const t=codigo(); q$('#mpt').value=t;
    const ok=await copiarTexto(t);
    const sem=analise(g).ini<0?' Sem Início: usei a primeira casa de chão.':'';
    aviso((ok?'Código copiado! Cole no capítulo, no lugar de MAPA, INICIO, RUPIAS e GUARDAS.':'Não consegui copiar sozinho: selecione o texto da caixa e use Ctrl+C.')+sem);
  }
  function ler(texto){                                        // devolve {C,L,g,notas} ou {erro}
    const bloco=(texto.match(/MAPA\s*=\s*\[([\s\S]*?)\]/)||[])[1];
    const fonte=bloco!==undefined?bloco:texto;
    let linhas=[...fonte.matchAll(/'([^'\n]*)'|"([^"\n]*)"/g)].map(m=>m[1]!==undefined?m[1]:m[2]);
    if(linhas.length<2)linhas=fonte.split('\n').map(x=>x.trim().replace(/,$/,'')).filter(x=>/^[#.SRVH]+$/i.test(x));
    if(linhas.length<2)return {erro:'Não achei as linhas do mapa. Cole o MAPA do capítulo (as linhas entre aspas) ou linhas só com # e .'};
    const larg=Math.max(...linhas.map(x=>x.length));
    if(larg>MAXC||linhas.length>MAXL)return {erro:'Esse mapa tem '+larg+' × '+linhas.length+'. O editor aceita até '+MAXC+' × '+MAXL+'.'};
    const nc=Math.max(MINC,larg), nl=Math.max(MINL,linhas.length), n=new Array(nc*nl).fill('#');
    const poe=(c,l,t)=>{                                      // põe um tile no mapa novo; o Início é um só
      if(c<0||c>=nc||l<0||l>=nl)return;
      if(t==='S')n.forEach((v,i)=>{if(v==='S')n[i]='.'});
      n[l*nc+c]=t;
    };
    let estranhos=0;
    linhas.forEach((r,y)=>{[...r].forEach((ch,x)=>{
      const u=ch.toUpperCase();
      if(u==='#'||u===' ')n[y*nc+x]='#';
      else if(u==='.')n[y*nc+x]='.';
      else if('SRVH'.includes(u))poe(x,y,u);
      else{n[y*nc+x]='.';estranhos++}
    })});
    const mi=texto.match(/INICIO\s*=\s*\{\s*c:\s*(\d+)\s*,\s*l:\s*(\d+)/);
    if(mi)poe(+mi[1],+mi[2],'S');
    const mr=texto.match(/RUPIAS\s*=\s*\[([^;]*)\]/);
    if(mr)for(const m of mr[1].matchAll(/\[\s*(\d+)\s*,\s*(\d+)\s*\]/g))poe(+m[1],+m[2],'R');
    const mg=texto.match(/GUARDAS\s*=\s*\[([^;]*)\]/);
    if(mg)for(const m of mg[1].matchAll(/\{\s*c:\s*(\d+)\s*,\s*l:\s*(\d+)\s*,\s*dx:\s*(-?\d+)\s*,\s*dy:\s*(-?\d+)/g))poe(+m[1],+m[2],+m[4]!==0?'V':'H');
    return {C:nc,L:nl,g:n,estranhos};
  }
  function carregarTexto(texto,origem){
    erro('');
    const r=ler(texto);
    if(r.erro){erro(r.erro);return}
    mudar(()=>{C=r.C;L=r.L;g=r.g});
    aviso(origem+' carregado: '+C+' × '+L+'.'+(r.estranhos?' '+r.estranhos+' símbolo(s) desconhecido(s) viraram chão.':''));
  }
  // troca só as quatro constantes no código de um capítulo; o resto do que a pessoa editou fica como está
  function trocar(cod,novo){
    const partes=[/const MAPA = \[[\s\S]*?\n\];/,/const INICIO = \{[^;]*\};/,/const RUPIAS = \[[^;]*\];/,/const GUARDAS = \[[^;]*\];/];
    let r=cod;
    for(const re of partes){
      const n=novo.match(re);
      if(!n||!re.test(r))return null;
      r=r.replace(re,()=>n[0]);
    }
    return r;
  }
  function abrir(nome){
    erro('');
    const a=analise(g);
    if(a.ini<0){erro('Coloque o Início (S) antes de abrir no capítulo.');return}
    if(!a.rup.length){erro('Coloque pelo menos 1 rupia: sem rupias o jogo termina na hora.');return}
    if(nome!=='Minimapa'&&(C>30||L>15)){erro('A Névoa não tem câmera: o mapa precisa caber em 30 × 15. Reduza o tamanho ou abra no Minimapa.');return}
    const i=CAPS.findIndex(c=>c.n===nome); if(i<0)return;
    const chave='guiaGames:codigo:'+nome; let cod=CAPS[i].c;
    try{const sv=localStorage.getItem(chave);if(sv!==null)cod=sv}catch(e){}   // parte do código que a pessoa já editou
    const novo=trocar(cod,codigo());
    if(novo===null){erro('Não achei MAPA, INICIO, RUPIAS e GUARDAS no código desse capítulo. Clique em Restaurar lá, ou use Copiar código.');return}
    try{localStorage.setItem(chave,novo)}catch(e){erro('Não consegui guardar o código neste navegador. Use Copiar código.');return}
    location.hash='cap-'+i;
  }

  // ---------- botões e campos ----------
  raiz.addEventListener('click',e=>{
    const b=e.target.closest&&e.target.closest('button'); if(!b||!raiz.contains(b))return;
    if(b.dataset.t){ferramenta(b.dataset.t);return}
    if(b.dataset.k){escolher(b.dataset.k);return}
    const a=b.dataset.acao; if(!a)return;
    if(a==='desfazer')desfazer();
    else if(a==='refazer')refazer();
    else if(a==='limpar')mudar(()=>{g=new Array(C*L).fill('#')});
    else if(a==='chao')mudar(()=>{g=new Array(C*L).fill('.')});
    else if(a==='moldura')mudar(()=>{for(let y=0;y<L;y++)for(let x=0;x<C;x++)if(x===0||y===0||x===C-1||y===L-1)g[y*C+x]='#'});
    else if(a==='gerar')gerar();
    else if(a==='copiar')copiar();
    else if(a==='carregar')carregarTexto(q$('#mpt').value,'Texto');
    else if(a==='exemplo'){
      const nome=q$('#mpex').value, cap=CAPS.find(c=>c.n===nome);
      if(cap)carregarTexto(cap.c,'Exemplo');
    }
    else if(a==='minimapa')abrir('Minimapa');
    else if(a==='nevoa')abrir('Névoa de guerra e visão');
  });
  const mexeuTam=()=>redimensionar(parseInt(q$('#mpw').value,10)||C,parseInt(q$('#mph').value,10)||L);
  q$('#mpw').addEventListener('change',mexeuTam); q$('#mph').addEventListener('change',mexeuTam);
  q$('#mpg').addEventListener('change',e=>{grade=e.target.checked;salvar();desenhar()});
  q$('#mpch').addEventListener('change',e=>{cheio=e.target.checked;salvar()});

  // ---------- começar ----------
  carregarSalvo();
  tudo();
  let larg=0;                                                 // refaz o desenho quando a largura da caixa muda (janela, zoom, celular girando)
  new ResizeObserver(()=>{const w=cv.parentElement.clientWidth;if(w!==larg){larg=w;desenhar()}}).observe(cv.parentElement);
}

// ---------- Bônus: Gerador de Sons ----------
// Também não há código para editar: é uma ferramenta, no estilo do sfxr. O som é um objeto com poucos números
// (onda, tom inicial e final, envelope, vibrato, salto de tom, filtros). A função efeito(p) abaixo transforma esses
// números em som com a Web Audio. É exatamente o texto que o botão "Copiar função" entrega, então o que você
// ouve aqui é o que vai tocar no seu jogo. A curva desenhada vem de uma renderização fora da tela (OfflineAudioContext).
function montarGeradorSons(raiz){
  const CHAVE='guiaGames:gerasons', NOME_CAP='Som com Web Audio';
  const FONTE=`// Gerador de sons: cole esta função UMA vez, depois da função nota().
// Ela usa o 'audio' e o 'mudo' que já existem no capítulo.
function efeito(p) {
  if (mudo) return;
  if (audio.state === 'suspended') audio.resume();   // o navegador só libera após um clique ou tecla
  const t = audio.currentTime;
  const dur = p.ataque + p.sustento + p.decaimento;   // duração total, em segundos
  const acaba = t + dur;

  // 1) a fonte do som: uma onda (oscilador) ou ruído
  let fonte, tom, esc = 1;                            // 'tom' é o parâmetro que muda a altura do som
  if (p.onda === 'ruido') {
    const buf = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;   // ruído branco: valores ao acaso
    fonte = audio.createBufferSource();
    fonte.buffer = buf; fonte.loop = true;
    tom = fonte.playbackRate; esc = 1 / 220;          // no ruído, o 'tom' é a velocidade de leitura
  } else {
    fonte = audio.createOscillator();
    tom = fonte.frequency;
    if (p.onda === 'square' && p.largura !== 0.5) {   // pulso com largura diferente de 50%
      const re = [0], im = [0];
      for (let n = 1; n < 64; n++) {                  // soma de cossenos e senos (série de Fourier do pulso)
        re.push(2 / (n * Math.PI) * Math.sin(2 * Math.PI * n * p.largura));
        im.push(2 / (n * Math.PI) * (1 - Math.cos(2 * Math.PI * n * p.largura)));
      }
      fonte.setPeriodicWave(audio.createPeriodicWave(new Float32Array(re), new Float32Array(im)));
    } else fonte.type = p.onda;
  }

  // 2) o tom: desliza de 'freq' até 'fim' e pode dar um salto (arpejo) no meio
  const f0 = p.freq * esc, f1 = p.fim * esc;
  tom.setValueAtTime(f0, t);
  if (p.arpSalto !== 0) {
    const ts = t + dur * p.arpTempo, salto = Math.pow(2, p.arpSalto / 12);   // 12 semitons = 1 oitava
    const meio = f0 * Math.pow(f1 / f0, p.arpTempo);                          // o tom no instante do salto
    tom.exponentialRampToValueAtTime(meio, ts);
    tom.setValueAtTime(meio * salto, ts);
    tom.exponentialRampToValueAtTime(f1 * salto, acaba);
  } else tom.exponentialRampToValueAtTime(f1, acaba);

  // 3) vibrato: um oscilador lento (LFO) que balança o tom
  if (p.vibrato > 0) {
    const lfo = audio.createOscillator(), forca = audio.createGain();
    lfo.frequency.value = p.vibVel;
    forca.gain.value = f0 * p.vibrato * 0.25;         // até 25% do tom inicial, para cima e para baixo
    lfo.connect(forca); forca.connect(tom);
    lfo.start(t); lfo.stop(acaba);
  }

    else if(a==='som')copiar(entrada()+',','Som copiado! Cole dentro da tabela sons.');
    else if(a==='capitulo')abrirNoCapitulo();
    else if(a==='wav')baixarWav();
  });
  raiz.addEventListener('keydown',e=>{                        // T toca, fora das caixas de texto
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.target.closest&&e.target.closest('textarea,input[type=text]'))return;
    if(e.key.toLowerCase()==='t'){e.preventDefault();tocar()}
  });

  // ---------- começar ----------
  carregarSalvo();
  atualizarControles(); status(); mostrarCodigo(); desenharOnda(); agendarRender();
}

// ---------- Anotações por capítulo ----------
// O texto fica no navegador (localStorage), numa chave por NOME de capítulo, como o código editado e o progresso.
const PREF_NOTA='guiaGames:nota:', MAX_NOTA=5000;
const lerNota=nome=>{try{return localStorage.getItem(PREF_NOTA+nome)||''}catch(e){return ''}};
function gravarNota(nome,texto){
  try{
    if(texto.trim())localStorage.setItem(PREF_NOTA+nome,texto);
    else localStorage.removeItem(PREF_NOTA+nome);          // nota vazia: some a chave, para não acumular lixo
    return true;
  }catch(e){return false}                                   // modo privado ou sem espaço
}
function marcarNotasNoMenu(){                               // um lápis ao lado dos capítulos que têm anotações
  document.querySelectorAll('#menu a').forEach(a=>a.classList.toggle('nt',!!lerNota(CAPS[+a.dataset.i].n).trim()));
}
function todasAsNotas(){                                    // um texto só, na ordem dos capítulos
  const partes=[];
  CAPS.forEach((c,i)=>{const t=lerNota(c.n).trim();if(t)partes.push(i+'. '+c.n+'\n'+'-'.repeat(12)+'\n'+t)});
  return partes.length?'Minhas anotações do Guia de Games 2D ('+new Date().toLocaleDateString('pt-BR')+')\n\n'+partes.join('\n\n\n')+'\n':'';
}
function montarNotas(c){
  const sec=document.createElement('details');
  sec.className='notas'; sec.id='notas';
  sec.innerHTML=`<summary>✎ Minhas anotações <span class="nt-ind" id="ntind"></span></summary>
    <div class="nt-corpo">
      <textarea id="nt" maxlength="${MAX_NOTA}" spellcheck="true" aria-label="Minhas anotações sobre este capítulo" placeholder="O que você entendeu neste capítulo? Escreva com as suas palavras: o que cada parte faz, o que não ficou claro, o que quer testar."></textarea>
      <div class="nt-bar"><span id="nts" role="status" aria-live="polite"></span><button type="button" class="alt" id="ntb" title="Baixa um arquivo de texto só com a anotação deste capítulo">Baixar</button><button type="button" class="alt" id="ntx" title="Apaga as anotações só deste capítulo">Apagar</button></div>
    </div>`;
  const pg=$('#main .pg'); pg.parentNode.insertBefore(sec,pg);   // logo antes dos botões Anterior/Próximo
  const ta=$('#nt'), st=$('#nts'), ind=$('#ntind');
  const dizer=(t,ruim)=>{st.textContent=t;st.classList.toggle('ruim',!!ruim)};
  const atualizarIndicador=()=>{ind.textContent=ta.value.trim()?ta.value.length+' caracteres':'vazia'};
  ta.value=lerNota(c.n);
  sec.open=!!ta.value.trim();                               // quem já escreveu aqui vê a nota aberta
  atualizarIndicador();
  dizer(ta.value.trim()?'Anotação salva neste navegador.':'Fica salvo automaticamente, só neste navegador.');
  ta.addEventListener('input',()=>{                         // grava a cada letra: nada se perde se a pessoa trocar de capítulo
    const ok=gravarNota(c.n,ta.value);
    atualizarIndicador();
    dizer(ok?'✔ Salvo neste navegador.':'Não consegui salvar neste navegador (aba anônima?). O texto continua aqui, copie se precisar.',!ok);
    const a=document.querySelector('#menu a.on'); if(a)a.classList.toggle('nt',!!ta.value.trim());
  });
  $('#ntx').onclick=()=>{
    if(!ta.value.trim()){dizer('Não há anotações neste capítulo.');return}
    if(!confirm('Apagar as anotações deste capítulo?'))return;
    ta.value=''; ta.dispatchEvent(new Event('input')); dizer('Anotações apagadas.');
  };
  $('#ntb').onclick=()=>{
    const nota=ta.value.trim();
    if(!nota){dizer('Você ainda não escreveu nada neste capítulo.');return}
    const slug=c.n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    const nome='anotacoes-'+slug+'.txt';                      // ex.: anotacoes-mini-rpg.txt
    const texto=c.n+'\n'+'-'.repeat(12)+'\n'+nota+'\n';
    const url=URL.createObjectURL(new Blob(['\ufeff'+texto],{type:'text/plain;charset=utf-8'})), a=document.createElement('a');
    a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    dizer('Arquivo '+nome+' baixado.');
  };
}

// Parte comum a todas as páginas: marca como visto, atualiza o menu e o progresso
function finalizarPagina(c){
  vistos.add(c.n);
  try{localStorage.setItem('guiaGames:vistos',JSON.stringify([...vistos]))}catch(e){}
  guardarUltimo(0);                                       // onde a pessoa está agora (a rolagem é guardada à parte)
  document.querySelectorAll('#menu a').forEach(a=>{const k=+a.dataset.i;a.classList.toggle('on',k===atual);a.classList.toggle('ok',vistos.has(CAPS[k].n))});
  const ativo=document.querySelector('#menu a.on');
  document.querySelectorAll('nav details').forEach(d=>{
    const as=[...d.querySelectorAll('a')], dentro=d.contains(ativo);
    d.querySelector('.cnt').textContent=as.filter(a=>a.classList.contains('ok')).length+'/'+as.length;
    d.classList.toggle('atual',dentro);
    if(dentro)d.open=true;                                   // abre a seção do capítulo atual
  });
  atualizarProgresso();
  montarNotas(c); marcarNotasNoMenu();                    // a caixa de anotações vale para todos os capítulos, inclusive as ferramentas
  document.querySelector('#menu a.on').scrollIntoView({block:'nearest',inline:'center'});
}
// Página de ferramenta (bônus): texto, a ferramenta, desafio, prompt e quiz. Não tem editor nem tela de jogo.
function mostrarFerramenta(c){
  ++exec;cancelAnimationFrame(raf);                       // para o loop do capítulo anterior
  $('#main').innerHTML=`<h2 class="px">${atual}. ${c.n}</h2>${c.t}
  <div id="pxa" class="ferr"></div>
  <div class="quest"><b>Desafio:</b> ${c.d}</div>

  <div class="apoio" id="aprompt" hidden><b>Prompt para a IA</b> (copie e cole no assistente de sua preferência para gerar esta ferramenta)<div class="aju"><button id="cpprompt" class="alt">Copiar prompt</button></div><pre class="prompt"><code id="promptcod"></code></pre></div>
  ${QUIZ[c.n]?`<div class="apoio quiz" id="aquiz" role="group" aria-label="Quiz do capítulo" hidden></div>`:''}
  <div class="pg">${atual>0?`<button class="alt" id="prev">← Anterior</button>`:'<span></span>'}${atual<CAPS.length-1?`<button id="next">Próximo →</button>`:'<span></span>'}</div>`;
  const bp=$('#vprompt'),pp=$('#aprompt');
  bp.onclick=()=>{const abrir=pp.hidden;pp.hidden=!abrir;bp.setAttribute('aria-expanded',abrir);bp.textContent=(abrir?'Ocultar':'Ver')+' prompt'};
  const texto=montarPrompt(c.n);
  $('#promptcod').textContent=texto;
  $('#cpprompt').onclick=async()=>{
    const ok=await copiarTexto(texto),b=$('#cpprompt');
    b.textContent=ok?'✔ Copiado!':'Selecione e copie (Ctrl+C)';
    setTimeout(()=>{b.textContent='Copiar prompt'},1800);
  };
  montarQuiz(c);
  ({'Pixel Art':montarPixelArt,'Editor de Mapas':montarEditorMapas,'Gerador de Sons':montarGeradorSons})[c.n]($('#pxa'));   // cada ferramenta monta a sua tela
  if($('#prev'))$('#prev').onclick=()=>{location.hash='cap-'+(atual-1)};
  if($('#next'))$('#next').onclick=()=>{location.hash='cap-'+(atual+1)};
  finalizarPagina(c);
  scrollTo(0,0);
}

function mostrar(i){
  atual=Math.max(0,Math.min(CAPS.length-1,i));
  const c=CAPS[atual];
  if(c.ferramenta)return mostrarFerramenta(c);             // bônus: página de ferramenta, sem editor de código
  $('#main').innerHTML=`<h2 class="px">${atual}. ${c.n}</h2>${c.t}
  <div class="lab">
    <div class="box"><h3 class="px">CÓDIGO</h3><textarea id="ed" spellcheck="false" aria-label="Editor de código"></textarea>

  ${AJUDA[c.n]?`<div class="apoio" id="adica" hidden><b>Dica:</b> ${AJUDA[c.n].d}</div>
  <div class="apoio" id="asol" hidden><b>Solução completa</b> (tente antes de olhar!)<p>${AJUDA[c.n].e}</p><div class="aju"><button id="cpsol" class="alt">Copiar código</button><button id="usasol" class="alt">Usar no editor</button></div><pre><code id="solcod"></code></pre></div>`:''}
  ${PROMPTS_ESP[c.n]?`<div class="apoio" id="aprompt" hidden><b>Prompt para a IA</b> (copie e cole no assistente de sua preferência para gerar este exemplo)<div class="aju"><button id="cpprompt" class="alt">Copiar prompt</button></div><pre class="prompt"><code id="promptcod"></code></pre></div>`:''}
  ${QUIZ[c.n]?`<div class="apoio quiz" id="aquiz" role="group" aria-label="Quiz do capítulo" hidden></div>`:''}`:''}
  <div class="pg">${atual>0?`<button class="alt" id="prev">← Anterior</button>`:'<span></span>'}${atual<CAPS.length-1?`<button id="next">Próximo →</button>`:'<span></span>'}</div>`;
  [['dica','','dica'],['sol','','solução'],['prompt','','prompt']].forEach(([k,ic,nome])=>{   // botões de ajuda: mostram e escondem
    const b=$('#v'+k),p=$('#a'+k);if(!b)return;
    b.onclick=()=>{const abrir=p.hidden;p.hidden=!abrir;b.setAttribute('aria-expanded',abrir);b.textContent=ic+(abrir?'Ocultar ':'Ver ')+nome};
  });
  const ed=$('#ed');
  const chaveCod='guiaGames:codigo:'+c.n;                 // salvo pelo NOME do capítulo (não muda se a ordem mudar)
  let salvo=null;try{salvo=localStorage.getItem(chaveCod)}catch(e){}
  ed.value=salvo!==null?salvo:c.c;                        // mostra o que a pessoa editou, se houver
  ed.addEventListener('input',()=>{                       // a cada alteração: guarda (ou apaga, se voltou ao original)
    try{ed.value===c.c?localStorage.removeItem(chaveCod):localStorage.setItem(chaveCod,ed.value)}catch(e){}
  });
  $('#run').onclick=rodar;
  $('#rst').onclick=()=>{ed.value=c.c;try{localStorage.removeItem(chaveCod)}catch(e){};rodar()};
  $('#bx').onclick=()=>{                                  // baixa o jogo (com o código que está no editor)
    const b=$('#bx');
    try{baixarHTML(c,ed.value);b.textContent='✔ Baixado!'}catch(e){erro(e);b.textContent='Não deu para baixar'}
    setTimeout(()=>{b.textContent='⬇ Baixar HTML'},1800);
  };
  const bz=$('#bz');
  if(bz)bz.onclick=async()=>{                              // baixa a pasta de assets do capítulo (.zip)
    try{await baixarAssets(c);bz.textContent='✔ Baixado!'}catch(e){erro(e);bz.textContent='Não deu para baixar'}
    setTimeout(()=>{bz.textContent='⬇ Baixar assets (.zip)'},1800);
  };
  montarQuiz(c);
  if(PROMPTS_ESP[c.n]){
    const texto=montarPrompt(c.n);
