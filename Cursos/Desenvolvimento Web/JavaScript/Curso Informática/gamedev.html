    inimigos = inimigos.filter(e => e.vida > 0);

    inimigos.forEach(e => {
      atualizarInimigo(e, dt);
      if (invul <= 0 && Math.hypot(e.x - jogador.x, e.y - jogador.y) < 18) { vidas--; invul = 1.2; }
    });
    if (vidas <= 0) fim = 'Fim de jogo';
    else if (!inimigos.length) fim = 'Vitória!';
  }

  // ---------- desenho ----------
  for (let l = 0; l < LINS; l++) {
    for (let c = 0; c < COLS; c++) {
      if (parede(c, l)) {
        ctx.fillStyle = '#4a4f7a'; ctx.fillRect(c * T, l * T, T, T);
        ctx.fillStyle = '#5d6396'; ctx.fillRect(c * T + 2, l * T + 2, T - 4, T - 4);
      } else {
        ctx.fillStyle = '#241d33'; ctx.fillRect(c * T, l * T, T, T);
      }
    }
  }
  const cores = { patrulhar: '#a35ad9', perseguir: '#e0483e', fugir: '#4aa3e0' };
  const nomes = { patrulhar: 'patrulha', perseguir: 'persegue', fugir: 'foge' };

  if (MOSTRAR_BUSCA) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
    inimigos.forEach(e => {
      if (e.estado !== 'patrulhar' && e.visitados) {
        e.visitados.forEach(k => ctx.fillRect((k % COLS) * T + 3, Math.floor(k / COLS) * T + 3, T - 6, T - 6));
      }
    });
  }
  if (MOSTRAR_ROTA) {                   // a rota calculada pelo A*
    inimigos.forEach(e => {
      if (e.estado === 'patrulhar' || e.rota.length < 2) return;
      ctx.strokeStyle = e.estado === 'perseguir' ? 'rgba(255, 90, 70, 0.9)' : 'rgba(90, 170, 255, 0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(e.x, e.y);
      e.rota.slice(1).forEach(p => { const q = centro(p.c, p.l); ctx.lineTo(q.x, q.y); });
      ctx.stroke();
      ctx.lineWidth = 1;
    });
  }

  ctx.fillStyle = '#7ddcff';
  magias.forEach(m => { ctx.beginPath(); ctx.arc(m.x, m.y, 5, 0, Math.PI * 2); ctx.fill(); });

  inimigos.forEach(e => {
    ctx.fillStyle = e.flash > 0 ? '#fff' : cores[e.estado];
    ctx.beginPath(); ctx.arc(e.x, e.y, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
    ctx.fillText(nomes[e.estado], e.x, e.y - 19);
    for (let i = 0; i < e.vida; i++) ctx.fillRect(e.x - 10 + i * 7, e.y - 16, 5, 3);   // vida
  });

  if (invul <= 0 || Math.floor(invul * 10) % 2) {
    ctx.fillStyle = '#ffd34e'; ctx.fillRect(jogador.x - 9, jogador.y - 9, 18, 18);
    ctx.fillStyle = '#1c130b';
    ctx.fillRect(jogador.x + jogador.dx * 8 - 3, jogador.y + jogador.dy * 8 - 3, 6, 6);   // lado em que olha
  }

  ctx.fillStyle = '#fff'; ctx.font = '13px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Vidas: ' + vidas + '   Inimigos: ' + inimigos.length, 8, 19);
  ctx.font = '11px monospace';
  ctx.fillText('Espaço: magia   linha = rota do A* (vermelha: persegue, azul: foge)', 8, 232);
  if (fim) {
    ctx.fillStyle = 'rgba(20, 12, 5, 0.7)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd34e'; texto(fim, 110, 28);
    ctx.fillStyle = '#fff';    texto('Enter para jogar de novo', 150, 14);
  }
  ctx.textAlign = 'left';

  antes = Object.assign({}, keys);
});
`},
{n:"Aleatoriedade e mapas",t:`<p>Jogos usam números aleatórios o tempo todo: onde nasce um inimigo, qual item cai, como é a próxima fase. Em JavaScript, <code>Math.random()</code> devolve um decimal entre 0 e 1 (nunca chega a 1). Com ele criamos duas ferramentas: <code>inteiro(min, max)</code>, que sorteia um número inteiro, e <code>sortear(lista)</code>, que escolhe um item de uma lista. Usamos a segunda para sortear o tema de cores de cada fase.</p><p>O problema do <code>Math.random()</code> é que você não controla o resultado. Para gerar uma fase que possa ser repetida, usamos uma <b>semente</b>: um gerador pseudoaleatório (<code>mulberry32</code>) que, dada a mesma semente, produz sempre a mesma sequência de números, e portanto a mesma masmorra. É assim que alguns jogos compartilham mundos por um número. A tecla <b>R</b> refaz a fase com a mesma semente (o mapa sai idêntico), e <b>N</b> sorteia uma semente nova. Para fixar o mapa, coloque um número em <code>SEMENTE_FIXA</code>.</p><p>O <b>gerador de masmorras</b> é simples: o mapa começa todo de parede. Sorteamos salas (tamanho e posição) e descartamos as que encostam em outras. Cada sala nova é ligada à anterior por um corredor em L, do centro de uma ao centro da outra. Depois o herói nasce na primeira sala, a escada vai para a sala mais distante e as rupias caem em lugares sorteados. A cada fase, o número máximo de salas cresce.</p><p>O herói é um quadrado de 10 × 10 com 2 pixels de contorno, e a colisão considera o contorno: a caixa é de 14 × 14. A função <code>livre</code> confere todos os tiles que ela cobre. O movimento é feito um eixo por vez: se o passo bater numa parede, o código encosta o herói (contorno incluso) exatamente na face do tile, sem deixar folga e sem o contorno entrar na parede.</p><p>Use as setas ou WASD. Pegue as rupias e chegue à escada para ir à próxima fase. Aperte <b>G</b> para ver as salas numeradas. No capítulo seguinte, o <b>ruído de Perlin</b> troca o sorteio de salas por terrenos com montanhas, rios e ilhas.</p>`,
d:"Coloque 3 inimigos (círculos vermelhos) em salas sorteadas, diferentes da primeira: use sortear(salas.slice(1)) para escolher a sala de cada um.",
c:`const COLS = 30, LINS = 15, T = 16;
const SEMENTE_FIXA = null;   // ponha um número (ex.: 42) para a fase 1 sempre sair igual

const TEMAS = [
  { nome: 'Calabouço', parede: '#4a4f7a', topo: '#5d6396', chao: '#241d33' },
  { nome: 'Floresta',  parede: '#1f4d2a', topo: '#2d6b2a', chao: '#5a8f3f' },
  { nome: 'Gelo',      parede: '#4d78a3', topo: '#6f9cc8', chao: '#b9d9ee' },
  { nome: 'Deserto',   parede: '#a0683a', topo: '#c58a4a', chao: '#e6cf94' }
];

// ---------- números aleatórios ----------
// mulberry32: gerador pequeno que aceita semente (mesma semente = mesma sequência)
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rand = Math.random;
const inteiro = (min, max) => Math.floor(rand() * (max - min + 1)) + min;   // sorteia de min a max
const sortear = (lista) => lista[inteiro(0, lista.length - 1)];            // escolhe um item

// ---------- gerador de masmorras ----------
let mapa, salas, tema, semente, nivel = 1, pegas = 0, total = 0, mostrarSalas = false, antes = {};
const heroi = { x: 0, y: 0 };

const centroDe = (s) => ({ c: Math.floor(s.x + s.w / 2), l: Math.floor(s.y + s.h / 2) });
const sobrepoe = (a, b) =>      // as salas se encostam? (com 1 tile de folga)
  a.x < b.x + b.w + 1 && a.x + a.w + 1 > b.x && a.y < b.y + b.h + 1 && a.y + a.h + 1 > b.y;

function escavar(s) {
  for (let l = s.y; l < s.y + s.h; l++)
    for (let c = s.x; c < s.x + s.w; c++) mapa[l][c] = '.';
}
function corredor(c1, l1, c2, l2) {      // corredor em L: sorteia se começa na horizontal ou na vertical
  const h = (ca, cb, l) => { for (let c = Math.min(ca, cb); c <= Math.max(ca, cb); c++) mapa[l][c] = '.'; };
  const v = (la, lb, c) => { for (let l = Math.min(la, lb); l <= Math.max(la, lb); l++) mapa[l][c] = '.'; };
  if (rand() < 0.5) { h(c1, c2, l1); v(l1, l2, c2); }
  else              { v(l1, l2, c1); h(c1, c2, l2); }
}

function novaFase(sortearSemente) {
  if (sortearSemente) {
    semente = SEMENTE_FIXA !== null ? SEMENTE_FIXA + nivel : Math.floor(Math.random() * 1000000);
  }
  rand = mulberry32(semente);          // daqui em diante, tudo usa a semente
  tema = sortear(TEMAS);
  mapa = Array.from({ length: LINS }, () => Array(COLS).fill('#'));   // tudo parede
  salas = [];

  const maximo = Math.min(4 + nivel, 9);
  for (let tentativa = 0; tentativa < 80 && salas.length < maximo; tentativa++) {
    const w = inteiro(4, 8), h = inteiro(3, 5);
    const sala = { x: inteiro(1, COLS - w - 1), y: inteiro(1, LINS - h - 1), w: w, h: h };
    if (salas.some(s => sobrepoe(sala, s))) continue;     // descarta se encostar em outra
    escavar(sala);
    if (salas.length) {                                   // liga à sala anterior
      const a = centroDe(salas[salas.length - 1]), b = centroDe(sala);
      corredor(a.c, a.l, b.c, b.l);
    }
    salas.push(sala);
  }

  // herói na primeira sala, escada na sala mais distante
  const ini = centroDe(salas[0]);
  heroi.x = ini.c * T + T / 2; heroi.y = ini.l * T + T / 2;
  let ultima = salas[0], melhor = -1;
  salas.forEach(s => {
    const c = centroDe(s), d = Math.abs(c.c - ini.c) + Math.abs(c.l - ini.l);
    if (d > melhor) { melhor = d; ultima = s; }
  });
  const f = centroDe(ultima);
  mapa[f.l][f.c + (ultima === salas[0] ? 1 : 0)] = '>';

  // rupias em lugares sorteados
  pegas = 0; total = 0;
  for (let i = 0; i < 6; i++) {
    for (let k = 0; k < 200; k++) {
      const c = inteiro(1, COLS - 2), l = inteiro(1, LINS - 2);
      if (mapa[l][c] === '.' && !(c === ini.c && l === ini.l)) { mapa[l][c] = 'r'; total++; break; }
    }
  }
}
novaFase(true);

const M = 7;   // metade do herói com o contorno (14 × 14: o quadrado amarelo de 10 × 10 mais 2 pixels de contorno de cada lado)

// a caixa do herói, centrada em (x, y), cabe aqui? Confere todos os tiles que ela cobre.
// Só encostar na borda de um tile não conta como batida (por isso o ceil(...) - 1).
function livre(x, y) {
  const c0 = Math.floor((x - M) / T), c1 = Math.ceil((x + M) / T) - 1;
  const l0 = Math.floor((y - M) / T), l1 = Math.ceil((y + M) / T) - 1;
  for (let l = l0; l <= l1; l++)
    for (let c = c0; c <= c1; c++) if (mapa[l][c] === '#') return false;
  return true;
}

loop((dt) => {
  const aperta = (k) => keys[k] && !antes[k];
  let dx = 0, dy = 0;
  if (keys.ArrowLeft  || keys.a) dx -= 110 * dt;
  if (keys.ArrowRight || keys.d) dx += 110 * dt;
  if (keys.ArrowUp    || keys.w) dy -= 110 * dt;
  if (keys.ArrowDown  || keys.s) dy += 110 * dt;
  // anda um eixo por vez. Se bater, encosta na parede certinho
  if (dx) {
    heroi.x += dx;
    if (!livre(heroi.x, heroi.y))
      heroi.x = dx > 0 ? Math.floor((heroi.x + M) / T) * T - M          // encosta na face esquerda do tile
                       : (Math.floor((heroi.x - M) / T) + 1) * T + M;   // encosta na face direita do tile
  }
  if (dy) {
    heroi.y += dy;
    if (!livre(heroi.x, heroi.y))
      heroi.y = dy > 0 ? Math.floor((heroi.y + M) / T) * T - M          // encosta na face de cima do tile
                       : (Math.floor((heroi.y - M) / T) + 1) * T + M;   // encosta na face de baixo do tile
  }

  if (aperta('n')) novaFase(true);      // semente nova: outra masmorra
  if (aperta('r')) novaFase(false);     // mesma semente: o mesmo mapa
  if (aperta('g')) mostrarSalas = !mostrarSalas;

  const col = Math.floor(heroi.x / T), lin = Math.floor(heroi.y / T);
  if (mapa[lin][col] === 'r') { pegas++; mapa[lin][col] = '.'; }
  if (mapa[lin][col] === '>') { nivel++; novaFase(true); }

  // ---------- desenho ----------
  for (let l = 0; l < LINS; l++) {
    for (let c = 0; c < COLS; c++) {
      const t = mapa[l][c], x = c * T, y = l * T;
      if (t === '#') {
        ctx.fillStyle = tema.parede; ctx.fillRect(x, y, T, T);
        ctx.fillStyle = tema.topo;   ctx.fillRect(x + 1, y + 1, T - 2, T - 2);
      } else {
        ctx.fillStyle = tema.chao; ctx.fillRect(x, y, T, T);
        if (t === 'r') {
          ctx.fillStyle = '#ff4fa3'; ctx.beginPath();
          ctx.moveTo(x + 8, y + 2); ctx.lineTo(x + 12, y + 8); ctx.lineTo(x + 8, y + 14); ctx.lineTo(x + 4, y + 8);
          ctx.fill();
        } else if (t === '>') {
          ctx.fillStyle = '#1c130b'; ctx.fillRect(x + 1, y + 1, T - 2, T - 2);
          ctx.fillStyle = '#ffd34e';
          ctx.fillRect(x + 3, y + 3, 10, 2); ctx.fillRect(x + 5, y + 7, 8, 2); ctx.fillRect(x + 7, y + 11, 6, 2);
        }
      }
    }
  }
  if (mostrarSalas) {
    ctx.strokeStyle = '#ffd34e'; ctx.fillStyle = '#ffd34e'; ctx.font = '10px monospace'; ctx.textAlign = 'left';
    salas.forEach((s, i) => {
      ctx.strokeRect(s.x * T + 0.5, s.y * T + 0.5, s.w * T, s.h * T);
      ctx.fillText(String(i + 1), s.x * T + 3, s.y * T + 11);
    });
  }
  ctx.fillStyle = '#1c130b'; ctx.fillRect(heroi.x - 7, heroi.y - 7, 14, 14);   // contorno
  ctx.fillStyle = '#ffd34e'; ctx.fillRect(heroi.x - 5, heroi.y - 5, 10, 10);

  ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Fase ' + nivel + ' - ' + tema.nome + '   Semente: ' + semente + '   Rupias: ' + pegas + '/' + total, 6, 12);
  ctx.font = '10px monospace';
  ctx.fillText('N: nova masmorra   R: repetir a semente   G: mostrar salas', 6, 236);

  antes = Object.assign({}, keys);
});
`},
{n:"Ruído e terreno",t:`<p>No capítulo <b>Aleatoriedade e mapas</b>, o sorteio montava masmorras de salas e corredores. Para <b>terrenos</b> (montanhas, rios, ilhas), sortear cada tile com <code>Math.random()</code> não serve: dá um chuvisco de TV fora do ar, com um tile de montanha ao lado de um tile de mar. Um terreno de verdade é <b>suave</b>: tiles vizinhos têm alturas parecidas. É isso que o <b>ruído de Perlin</b> entrega: números aleatórios que variam <i>devagar</i> de um ponto para o vizinho. Com a mesma <b>semente</b> (o <code>mulberry32</code> de antes), o mundo sai sempre igual.</p><p><b>1. A grade de gradientes.</b> Sorteamos uma direção (um <i>gradiente</i>) para cada ponto de uma grade. Para um ponto qualquer, olhamos os 4 cantos da casa da grade em que ele está: cada canto empurra o valor para cima ou para baixo, conforme o ponto esteja do lado para onde ele aponta, e os 4 empurrões são misturados. A tabela <code>perm</code>, embaralhada com a semente, é o sorteio: ela decide qual dos 8 gradientes cada canto usa (<code>grad</code>).</p><p><b>2. A curva suave.</b> Misturar os cantos em linha reta deixaria quinas visíveis nas linhas da grade. Por isso o <code>t</code> da mistura passa antes pela curva <code>suave</code> (6t⁵ − 15t⁴ + 10t³), que sai devagar de 0 e chega devagar em 1. O resultado, <code>perlin(x, y)</code>, fica entre −1 e 1.</p><p><b>3. A escala é o zoom.</b> Em vez de pedir o ruído de <code>(c, l)</code>, pedimos o de <code>(c * escala, l * escala)</code>. Com escala pequena, andamos pouco pela grade e o relevo fica grande e suave. Com escala grande, ele fica picotado. Use ← e →.</p><p><b>4. Oitavas.</b> Um ruído só dá manchas redondas, e um terreno real tem continentes, montes, pedras, tudo em tamanhos diferentes. Então somamos várias <b>oitavas</b> (<code>fbm</code>): cada uma tem o <b>dobro da frequência</b> e a <b>metade da força</b> da anterior. A primeira desenha os continentes, e as outras acrescentam detalhes. Aperte ↑ e ↓ para ir de 1 a 8 oitavas e veja a diferença.</p><p><b>5. Ilha.</b> O ruído não sabe que o mapa tem borda. Para ter mar em volta, subtraímos da altura <code>ILHA * d * d</code>, em que <code>d</code> é a distância ao centro (0 no meio, 1 nas bordas): quanto mais longe do centro, mais a terra afunda. Depois <code>esticar</code> remapeia as alturas para ocuparem exatamente de 0 a 1. Com <code>ILHA = 0</code>, os continentes vão até a borda.</p><p><b>6. Biomas.</b> A altura decide o grosso: abaixo de <code>mar</code> é água (mais escura quanto mais funda), logo acima é praia, e depois vêm a terra, a montanha e a neve. Em terra, um <b>segundo ruído</b>, a <b>umidade</b> (calculado em outro lugar do plano, com <code>+ 100</code>), separa deserto, campo e floresta. Duas camadas de ruído dão uma variedade que uma só não dá. As teclas + e − mexem no nível do mar: com o mar subindo, o continente vira um arquipélago. A tecla V alterna entre o mapa, a altura e a umidade, em tons de cinza.</p><p><b>7. Relevo.</b> O mapa fica com cara de 3D com uma conta barata: comparamos a altura do vizinho de cima à esquerda com a do vizinho de baixo à direita. Se o de baixo à direita é mais alto, a encosta está virada para a luz (que vem de cima à esquerda) e o tile fica mais claro, senão fica mais escuro. Não há luz de verdade, só uma diferença de alturas.</p><p><b>8. Rios.</b> Um rio nasce numa montanha e <b>desce sempre para o vizinho mais baixo</b> (<code>gerarRios</code>) até chegar ao mar. Se ele encontra uma bacia, onde nenhum vizinho é mais baixo, termina num lago. São até 14 rios, e as nascentes são sorteadas com a semente (<code>semente + 1</code>), então os rios também se repetem.</p><p><b>9. Um pixel por tile.</b> O mapa é pintado numa imagem pequena, de 120 × 60 pixels (um por tile) fora da tela, e o canvas só a amplia com <code>imageSmoothingEnabled = false</code>, como no minimapa. O cálculo só roda quando algo muda, não a cada quadro.</p><p>R sorteia um mundo novo. Passe o mouse sobre o mapa para ver a altura, a umidade e o bioma de cada tile. Para virar um jogo, basta trocar o mapa por uma lista de textos: a água vira parede e a terra vira chão.</p>`,
d:"Crie o bioma <b>Pântano</b>: terra baixa (altura abaixo de 0,55, logo depois da praia) com umidade acima de 0,62, pintada de verde-oliva escuro (<code>[79, 107, 58]</code>).",
c:`// Ruído e terreno: montanhas, rios e ilhas gerados por código.
// R: mundo novo   ← →: zoom no ruído   ↑ ↓: oitavas   + −: nível do mar   V: mapa, altura ou umidade
const COLS = 120, LINS = 60, T = 4;       // 120 × 60 tiles de 4 pixels = 480 × 240: o mundo inteiro cabe na tela
const ILHA = 0.8;                         // força da "ilha": 0 = continentes até a borda, 1 = uma ilha só
const RIOS = 14;                          // quantos rios tentamos criar

let semente, escala = 0.05, oitavas = 5, mar = 0.42, visao = 0, antes = {};
let alt, umi, rio;                        // altura e umidade de cada tile (0 a 1) e onde passa um rio
const mapaImg = document.createElement('canvas');     // o mapa pronto: 1 pixel por tile, fora da tela
mapaImg.width = COLS; mapaImg.height = LINS;
const mc = mapaImg.getContext('2d');

// ---------- números aleatórios com semente (o mesmo mulberry32 do capítulo Aleatoriedade e mapas) ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------- ruído de Perlin ----------
// A ideia: sorteamos uma direção (um "gradiente") para cada ponto de uma grade. Para um ponto qualquer,
// olhamos os 4 cantos da casa da grade em que ele está, e misturamos a influência de cada um com uma curva suave.
let perm;                                 // tabela de permutação: os números 0 a 255 embaralhados (e repetidos)
function criarRuido(sem) {
  const rnd = mulberry32(sem), p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  perm = p.concat(p);
}
const suave = (t) => t * t * t * (t * (t * 6 - 15) + 10);   // curva 6t⁵ − 15t⁴ + 10t³: sai devagar, chega devagar
const mistura = (a, b, t) => a + (b - a) * t;               // de a até b, conforme t vai de 0 a 1
function grad(h, dx, dy) {                // o gradiente do canto (uma de 8 direções), multiplicado pelo vetor até o ponto
  switch (h & 7) {
    case 0: return dx + dy;  case 1: return dx - dy;  case 2: return -dx + dy;  case 3: return -dx - dy;
    case 4: return dx;       case 5: return -dx;      case 6: return dy;         default: return -dy;
  }
}
function perlin(x, y) {                   // devolve um valor entre -1 e 1; pontos vizinhos dão valores parecidos
  const xi = Math.floor(x), yi = Math.floor(y);           // qual casa da grade
  const fx = x - xi, fy = y - yi;                         // onde, dentro da casa (0 a 1)
  const X = xi & 255, Y = yi & 255;
  const aa = perm[perm[X] + Y], ab = perm[perm[X] + Y + 1];           // um número para cada canto
  const ba = perm[perm[X + 1] + Y], bb = perm[perm[X + 1] + Y + 1];
  const u = suave(fx), v = suave(fy);
  return mistura(mistura(grad(aa, fx, fy), grad(ba, fx - 1, fy), u),
                 mistura(grad(ab, fx, fy - 1), grad(bb, fx - 1, fy - 1), u), v);
}

// Ruído fractal (fBm): soma várias "oitavas". Cada uma tem o dobro da frequência e metade da força da anterior:
// a primeira desenha os continentes, as seguintes acrescentam morros, pedras e detalhes.
function fbm(x, y, oit) {
  let soma = 0, forca = 1, freq = 1, total = 0;
  for (let o = 0; o < oit; o++) {
    soma += perlin(x * freq, y * freq) * forca;
    total += forca;
    forca *= 0.5; freq *= 2;
  }
  return soma / total;
}
function esticar(v) {                     // estica os valores para ocuparem exatamente de 0 a 1
  let mn = Infinity, mx = -Infinity;
  for (const x of v) { if (x < mn) mn = x; if (x > mx) mx = x; }
  for (let i = 0; i < v.length; i++) v[i] = (v[i] - mn) / (mx - mn);
}

// ---------- o mundo ----------
function gerarTerreno() {
  criarRuido(semente);
  alt = new Float32Array(COLS * LINS); umi = new Float32Array(COLS * LINS);
  for (let l = 0; l < LINS; l++)
    for (let c = 0; c < COLS; c++) {
      const i = l * COLS + c, nx = c * escala, ny = l * escala;    // a escala é o zoom: pequena = relevo grande e suave
      const dx = (c / COLS - 0.5) * 2, dy = (l / LINS - 0.5) * 2;  // distância ao centro: 0 no meio, 1 nas bordas
      const d = Math.min(1, Math.hypot(dx, dy));
      alt[i] = fbm(nx, ny, oitavas) - ILHA * d * d;                // quanto mais longe do centro, mais a terra afunda
      umi[i] = fbm(nx + 100, ny + 100, 3);                         // outro ruído (em outro lugar do plano): a umidade
    }
  esticar(alt); esticar(umi);
}

// Um rio nasce numa montanha e desce sempre para o vizinho mais baixo, até chegar ao mar (ou a uma bacia).
function gerarRios() {
  rio = new Uint8Array(COLS * LINS);
  const rnd = mulberry32(semente + 1), fontes = [];
  for (let t = 0; t < 600 && fontes.length < RIOS; t++) {
    const c = Math.floor(rnd() * COLS), l = Math.floor(rnd() * LINS);
    if (alt[l * COLS + c] > 0.68 && fontes.every(f => Math.hypot(f[0] - c, f[1] - l) > 10)) fontes.push([c, l]);
  }
  fontes.forEach(([c0, l0]) => {
    let c = c0, l = l0;
    const visitado = new Set();
    for (let passo = 0; passo < 500; passo++) {
      const i = l * COLS + c;
      rio[i] = 1; visitado.add(i);
      if (alt[i] < mar) break;                                     // chegou ao mar
      let melhor = -1;
      for (let dl = -1; dl <= 1; dl++)
        for (let dc = -1; dc <= 1; dc++) {
          const nc = c + dc, nl = l + dl, j = nl * COLS + nc;
          if (nc < 0 || nl < 0 || nc >= COLS || nl >= LINS || visitado.has(j)) continue;
          if (melhor < 0 || alt[j] < alt[melhor]) melhor = j;
        }
      if (melhor < 0 || alt[melhor] > alt[i] + 0.02) break;        // uma bacia: o rio termina num lago
      c = melhor % COLS; l = Math.floor(melhor / COLS);
    }
  });
}

// Qual é o bioma de um tile? Depende da altura (e, em terra, da umidade).
function bioma(h, u) {
  if (h < mar - 0.12) return { nome: 'Mar profundo', cor: [28, 62, 112] };
  if (h < mar)        return { nome: 'Mar',           cor: [45, 106, 168] };
  if (h < mar + 0.03) return { nome: 'Praia',         cor: [227, 212, 154] };
  if (h < 0.68) {
    if (u < 0.38) return { nome: 'Deserto',  cor: [210, 180, 105] };
    if (u < 0.62) return { nome: 'Campo',    cor: [134, 187, 92] };
    return              { nome: 'Floresta', cor: [62, 138, 70] };
  }
  if (h < 0.84)       return { nome: 'Montanha', cor: [141, 135, 130] };
  return                     { nome: 'Neve',     cor: [244, 246, 250] };
}

function pintarMapa() {                   // cada tile vira 1 pixel; depois o canvas amplia a imagem
  const img = mc.createImageData(COLS, LINS);
  for (let l = 0; l < LINS; l++)
    for (let c = 0; c < COLS; c++) {
      const i = l * COLS + c, h = alt[i];
      let cor;
      if (visao === 1) cor = [h * 255, h * 255, h * 255];          // só a altura, em tons de cinza
      else if (visao === 2) cor = [umi[i] * 255, umi[i] * 255, umi[i] * 255];
      else {
        cor = bioma(h, umi[i]).cor;
        if (h >= mar) {                                            // relevo: luz vinda do canto de cima à esquerda
          const nw = alt[Math.max(0, l - 1) * COLS + Math.max(0, c - 1)], se = alt[Math.min(LINS - 1, l + 1) * COLS + Math.min(COLS - 1, c + 1)];
          const f = 1 + Math.max(-0.3, Math.min(0.3, (se - nw) * 6));    // encosta virada para a luz: mais clara
          cor = cor.map(v => Math.min(255, v * f));
        } else {                                                   // mar: mais fundo = mais escuro
          const f = 0.55 + 0.45 * (h / mar);
          cor = cor.map(v => v * f);
        }
        if (rio[i] && h >= mar) cor = [63, 143, 208];
      }
      img.data.set([cor[0], cor[1], cor[2], 255], i * 4);
    }
  mc.putImageData(img, 0, 0);
}

function atualizar(tudo) {                // tudo = true: o ruído mudou e precisa ser calculado de novo
  if (tudo) gerarTerreno();
  gerarRios(); pintarMapa();
}
function novoMundo() { semente = Math.floor(Math.random() * 1000000); atualizar(true); }
novoMundo();

loop((dt) => {
  const apertou = (k) => keys[k] && !antes[k];
  if (apertou('r')) novoMundo();
  if (apertou('v')) { visao = (visao + 1) % 3; pintarMapa(); }
  if (apertou('ArrowLeft'))  { escala = Math.max(0.02, +(escala - 0.01).toFixed(2)); atualizar(true); }
  if (apertou('ArrowRight')) { escala = Math.min(0.2, +(escala + 0.01).toFixed(2)); atualizar(true); }
  if (apertou('ArrowDown'))  { oitavas = Math.max(1, oitavas - 1); atualizar(true); }
  if (apertou('ArrowUp'))    { oitavas = Math.min(8, oitavas + 1); atualizar(true); }
  if (apertou('+') || apertou('=')) { mar = Math.min(0.9, +(mar + 0.02).toFixed(2)); atualizar(false); }
  if (apertou('-'))                 { mar = Math.max(0.1, +(mar - 0.02).toFixed(2)); atualizar(false); }

  ctx.imageSmoothingEnabled = false;      // sem suavizar: cada pixel do mapa vira um quadrado nítido
  ctx.drawImage(mapaImg, 0, 0, W, H);

  // o tile sob o mouse
  const c = Math.floor(mouse.x / T), l = Math.floor(mouse.y / T);
  const dentro = c >= 0 && c < COLS && l >= 0 && l < LINS;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(0, 0, W, 14); ctx.fillRect(0, H - 14, W, 14);
  ctx.fillStyle = '#fff'; ctx.font = '10px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Semente ' + semente + '  escala ' + escala + '  oitavas ' + oitavas + '  mar ' + mar.toFixed(2) + '  visão: ' + ['mapa', 'altura', 'umidade'][visao], 6, 10);
  if (dentro) {
    const i = l * COLS + c, b = bioma(alt[i], umi[i]);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(c * T - 0.5, l * T - 0.5, T + 1, T + 1);
    ctx.fillText('(' + c + ', ' + l + ')  altura ' + alt[i].toFixed(2) + '  umidade ' + umi[i].toFixed(2) + '  ' + (rio[i] && alt[i] >= mar ? 'Rio' : b.nome), 6, H - 4);
  } else ctx.fillText('R: novo   ← →: zoom   ↑ ↓: oitavas   + −: mar   V: visão   mouse: tile', 6, H - 4);

  antes = Object.assign({}, keys);
});
`},
{n:"Plataforma com tilemap",t:`<p>Em <b>Aleatoriedade e mapas</b> o mapa era só desenho. Agora ele vira o chão do jogo: cada <code>#</code> é um bloco sólido de <code>T</code> × <code>T</code> pixels. Para saber se o jogador bate em algo, converta pixel em tile com <code>Math.floor(x / T)</code> e olhe só os tiles sob a caixa dele, em vez de comparar com todos os blocos. É isso que a função <code>bate</code> faz.</p><p>A regra de ouro é a <b>colisão por eixo</b>: mova só em X e resolva, depois mova só em Y e resolva. Se você mover os dois juntos, não dá para saber de que lado foi a batida. Bateu andando para a direita? Encoste o jogador na face esquerda do bloco e zere <code>vx</code>. Bateu caindo (<code>vy &gt; 0</code>)? Ele pousou: ajuste <code>y</code> para cima do bloco e marque <code>noChao</code>. Bateu subindo? É a cabeça no teto, e <code>vy</code> vira zero. O limite de 480 na queda garante que ele nunca anda mais de um tile por quadro e atravessa o chão.</p><p>Dois truques fazem o pulo "parecer bom". O <b>coyote time</b> dá uns 0,1 s para pular depois de sair da borda: o jogo guarda esse tempo em <code>coyote</code> e aceita o pulo enquanto ele for maior que zero. O <b>pulo variável</b> deixa o jogador controlar a altura: se ele solta o botão enquanto ainda sobe, a gravidade fica mais forte e o pulo é cortado. Segure para pular alto (cerca de 3,5 tiles), toque rápido para um pulinho. O texto na tela mostra o <code>coyote</code> em tempo real: ande para fora de uma plataforma e veja o número cair.</p><p>Se aparecerem fios finos entre os blocos, a causa é a escala do canvas: com uma ampliação fracionária, as bordas caem no meio de um pixel real e as cores se misturam. A função <code>px</code> arredonda cada borda para um pixel real, e blocos vizinhos passam a dividir exatamente a mesma linha.</p><p>Setas ou WASD andam, e ↑, W ou Espaço pulam.</p>`,
d:"Distribua moedas pelo cenário. Quando o jogador tocar em uma delas, ela desaparece e a pontuação aumenta.",
c:`// # = bloco sólido   . = ar
const T = 24, COLS = 20, LINS = 10;      // 20 × 24 = 480 e 10 × 24 = 240: o mapa cobre a tela
const mapa = [
  '####################',
  '#..................#',
  '#..................#',
  '#.......###........#',
  '#..................#',
  '#...###.......###..#',
  '#..................#',
  '#.....###..###.....#',
  '#..................#',
  '####################'
];
const GRAV = 1500, PULO = 520, VEL = 140;
const COYOTE = 0.1;                      // tempo extra para pular depois de sair da borda (s)

const solido = (c, l) => {
  if (c < 0 || c >= COLS || l >= LINS) return true;   // lados e fundo contam como parede
  if (l < 0) return false;                            // acima da tela é ar
  return mapa[l][c] === '#';
};

const p = { x: 40, y: 190, w: 18, h: 22, vx: 0, vy: 0, noChao: false, coyote: 0, dir: 1 };
let puloAntes = false;

// a caixa do jogador na posição (x, y) toca algum tile sólido?
function bate(x, y) {
  const c0 = Math.floor(x / T), c1 = Math.floor((x + p.w - 0.01) / T);
  const l0 = Math.floor(y / T), l1 = Math.floor((y + p.h - 0.01) / T);
  for (let l = l0; l <= l1; l++)
    for (let c = c0; c <= c1; c++)
      if (solido(c, l)) return true;
  return false;
}

loop((dt) => {
  const esq = keys.ArrowLeft || keys.a, dir = keys.ArrowRight || keys.d;
  const pulo = keys.ArrowUp || keys.w || keys[' '];
  const apertou = pulo && !puloAntes;               // só no instante do aperto
  puloAntes = !!pulo;

  // horizontal: acelera suavemente até a velocidade desejada
  const alvo = (dir ? 1 : 0) - (esq ? 1 : 0);
  if (alvo) p.dir = alvo;
  p.vx += (alvo * VEL - p.vx) * Math.min(1, 12 * dt);

  // 1) move só no eixo X e resolve
  p.x += p.vx * dt;
  if (bate(p.x, p.y)) {
    p.x = p.vx > 0 ? Math.floor((p.x + p.w) / T) * T - p.w    // encosta na face esquerda do bloco
                   : (Math.floor(p.x / T) + 1) * T;           // encosta na face direita do bloco
    p.vx = 0;
  }

  // coyote time: o "pode pular" dura um instante depois de sair do chão
  p.coyote = p.noChao ? COYOTE : p.coyote - dt;
  if (apertou && p.coyote > 0) { p.vy = -PULO; p.coyote = 0; }

  // pulo variável: soltar o botão durante a subida aumenta a gravidade
  const g = (p.vy < 0 && !pulo) ? GRAV * 2.2 : GRAV;
  p.vy = Math.min(p.vy + g * dt, 480);              // limite de queda: nunca passa de 1 tile por quadro

  // 2) move só no eixo Y e resolve
  p.y += p.vy * dt;
  p.noChao = false;
  if (bate(p.x, p.y)) {
    if (p.vy > 0) { p.y = Math.floor((p.y + p.h) / T) * T - p.h; p.noChao = true; }   // pousou
    else p.y = (Math.floor(p.y / T) + 1) * T;                                          // bateu a cabeça
    p.vy = 0;
  }

  // ---------- desenho ----------
  ctx.fillStyle = '#6fb7e8'; ctx.fillRect(0, 0, W, H);
  // a tela é ampliada por uma escala k (quase nunca inteira). Se uma borda cair no meio de um
  // pixel real, o navegador mistura as cores e aparece um fio entre os tiles. px() evita isso:
  const k = ctx.getTransform().a;
  const px = (v) => Math.round(v * k) / k;          // alinha a borda a um pixel real da tela
  for (let l = 0; l < LINS; l++) {
    for (let c = 0; c < COLS; c++) {
      if (mapa[l][c] !== '#') continue;
      const x0 = px(c * T), x1 = px((c + 1) * T);   // vizinhos usam a MESMA borda: não sobra fresta
      const y0 = px(l * T), y1 = px((l + 1) * T);
      ctx.fillStyle = '#8a5a2b'; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      if ((c + l * 3) % 4 === 0) { ctx.fillStyle = '#6b3a10'; ctx.fillRect(x0 + 6, y0 + 12, 6, 3); }   // textura rara
      if (l > 0 && mapa[l - 1][c] !== '#') {         // grama só onde há ar em cima
        ctx.fillStyle = '#3f8f3a'; ctx.fillRect(x0, y0, x1 - x0, px(l * T + 5) - y0);
      }
    }
  }
  ctx.fillStyle = '#ffd34e'; ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle = '#1c130b';
  ctx.fillRect(p.x + (p.dir > 0 ? 11 : 3), p.y + 5, 4, 4);                         // olho

  ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'left';
  ctx.fillText('no chão: ' + (p.noChao ? 'sim' : 'não') + '   coyote: ' + Math.max(0, p.coyote).toFixed(2), 30, 40);
  ctx.fillText('← →: andar   ↑ / Espaço: pular (segure = alto)', 30, 56);
});
`},
{n:"Mapas do Tiled",t:`<p>Até aqui o mapa era uma lista de textos escrita no código. Num jogo de verdade ele é desenhado num <b>editor de mapas</b>, e um dos mais usados é o <b>Tiled</b> (gratuito). O Tiled grava o mapa num arquivo, <code>.tmx</code> (texto XML) ou <code>.json</code>, e o jogo só precisa <b>ler esse arquivo</b>. Quem desenha o mapa não mexe no código, e quem programa não mexe no mapa.</p><p><b>O que tem no arquivo.</b> Um mapa do Tiled é feito de <b>camadas</b> (<i>layers</i>), empilhadas do fundo para a frente. O mapa deste capítulo (40 × 15 tiles de 16 pixels) tem quatro: <code>Background</code>, o fundo; <code>Objects</code>, objetos decorativos que também ficam atrás (luzes, caixas, espinhos); <code>Platforms</code>, o chão e as plataformas onde o jogador pisa; e uma <b>camada de objetos</b> com um retângulo que marca onde o jogador começa (no arquivo ela se chama <code>PlayerStart</code>, mas o código usa o primeiro objeto da primeira camada de objetos, então o nome não importa). As três primeiras são <b>camadas de tiles</b>: uma grade de números. Cada número é um <b>gid</b>, a posição do tile na imagem do tileset contada a partir de 1, e o <b>0 é célula vazia</b>. Para achar o pedaço da imagem, faça <code>k = gid - firstgid</code>: a coluna é <code>k % columns</code> e a linha é <code>Math.floor(k / columns)</code>. O Tiled também guarda nos bits mais altos do gid se o tile foi espelhado. O código limpa esses bits com <code>gid &amp; 0x1FFFFFFF</code> e não trata espelhamento.</p><p><b>Ler o arquivo.</b> Buscar um arquivo leva tempo, então o navegador não entrega o resultado na hora: <code>fetch</code> devolve uma <b>Promise</b> (a promessa de um resultado), e <code>await</code> espera ela se cumprir dentro de uma função <code>async</code>. Por isso o jogo só começa depois que <code>carregar()</code> termina: o mapa, a imagem do tileset e as três folhas do jogador. O <code>.tmx</code> é XML, lido com <code>DOMParser</code> e <code>querySelectorAll</code> (<code>lerTMX</code>). O <code>.json</code> já vira objeto direto (<code>lerJSON</code>). As duas funções devolvem o mesmo formato, então o resto do jogo não sabe de qual arquivo veio. Para usar JSON, exporte do Tiled em <b>Arquivo → Exportar como</b> e troque a constante <code>MAPA</code>. Nos dois casos, deixe o <b>formato da camada</b> em <b>CSV</b> (propriedades do mapa) e o tileset <b>embutido</b> no mapa: o código não lê Base64 nem arquivos <code>.tsx</code> externos. O caminho da imagem do tileset, escrito dentro do arquivo, vale a partir da pasta do <b>mapa</b>, e não da página. Por isso o código monta o endereço com <code>new URL(ts.imagem, base)</code>.</p><p><b>Importante: é preciso um servidor.</b> Por segurança, o navegador não deixa uma página aberta como arquivo (endereço <code>file://</code>) ler outros arquivos com <code>fetch</code>. Deixe o guia e a pasta <code>assets</code> lado a lado, abra um terminal nessa pasta, rode <code>python -m http.server</code> e acesse <code>http://localhost:8000/guia-games-2d.html</code> (qualquer outro servidor local serve). Se algo faltar, a tela mostra um aviso em vez de ficar em branco. O botão <b>Baixar HTML</b> também gera uma página que precisa ficar ao lado da pasta <code>assets</code> e ser aberta por um servidor. Nos exemplos que usam imagens, o botão <b>Baixar assets (.zip)</b> traz essa pasta pronta: é só descompactar ao lado do HTML.</p><p><b>Desenhar uma vez só.</b> Cada camada tem 600 tiles, e redesenhar todos a cada quadro é trabalho à toa. A função <code>montarCenario</code> pinta as camadas, na ordem do arquivo (fundo primeiro), numa imagem grande fora da tela, uma única vez. A cada quadro o jogo só <b>recorta</b> dessa imagem o pedaço que a câmera mostra, com o <code>drawImage</code> de 9 argumentos do capítulo de spritesheets. Recortar de uma imagem só também evita as frestas entre tiles que aparecem quando a tela é ampliada. A câmera é a do capítulo <b>Câmera</b>: centraliza no jogador e para nas bordas do mapa. O mapa tem 15 × 16 = 240 pixels de altura, exatamente a altura da tela, então ela só anda para os lados. Com <code>ZOOM = 2</code> ela chega mais perto e passa a andar também para cima e para baixo.</p><p><b>Colisão.</b> É a do capítulo <b>Plataforma com tilemap</b>: um eixo de cada vez. A diferença é que o tamanho do tile (<code>mapa.T</code>) e a grade vêm do arquivo, e um tile é sólido quando a célula dele na camada <code>Platforms</code> não é zero. Tudo fora da grade também conta como sólido, inclusive o <b>topo</b>: assim, se o mapa tiver ar na primeira linha, o jogador bate a cabeça na borda de cima ao pular, em vez de sair da tela. <code>Background</code> e <code>Objects</code> só enfeitam: o jogador passa por elas.</p><p><b>O jogador.</b> O objeto do Tiled é um retângulo de 16 × 32 e o Tiled guarda o <code>y</code> do <b>topo</b> dele, então os pés ficam em <code>y + h</code>: é daí que o código tira a posição inicial. As folhas seguem o capítulo <b>Spritesheet e estados</b>, com quadros de 32 × 32: <code>idle</code> tem 5 quadros, <code>walk</code> tem 8 e <code>jump</code> tem 4. O <code>jump</code> é o estado do robô <b>no ar</b>, seja pulando ou caindo de uma plataforma. O estado sai de três perguntas, nesta ordem: se o jogador <b>não está no chão</b> (<code>noChao</code> é falso), o estado é <code>jump</code>; senão, se está andando, <code>walk</code>; senão, <code>idle</code>. Perder o chão já conta como estar no ar, então o robô muda de pose também ao sair de uma borda, sem precisar pular. Dentro do quadro o personagem é pequeno (uns 14 × 17 pixels) e os pés ficam na linha 23 (<code>PES</code>) nas três folhas, por isso o robô não muda de altura na tela quando o estado troca. A caixa de colisão é 12 × 16, e o quadro é desenhado centrado nela e com os pés na base. Ligue <code>DEPURAR</code> para ver a caixa amarela e o retângulo vermelho que veio do Tiled.</p><p>Use ← → (ou A e D) para andar e Espaço (ou ↑, W) para pular. Segure o pulo para ir mais alto.</p>`,
d:"Mostre no painel a coluna e a linha do tile em que o jogador está pisando e o número (gid) desse tile na camada Platforms.",
c:`// Mapa do Tiled: o mapa vem de um arquivo .tmx (ou .json), não do código.
// ← → (ou A D) andam, Espaço (ou ↑ / W) pula.
// Atenção: o navegador só deixa o código ler arquivos por um servidor (veja o texto abaixo).

// ---------- configuração ----------
const PASTA = 'assets/tiled/';                // pasta onde estão os arquivos
const MAPA = PASTA + 'map.tmx';         // troque por 'map.json' se exportar do Tiled em JSON
const CAMADA_CHAO = 'Platforms';        // nome da camada em que o jogador pisa
const ZOOM = 1;                         // 1 = pixel do mapa = pixel do desenho. 2 = câmera mais perto
const DEPURAR = false;                  // true: mostra a caixa de colisão e o ponto inicial

const QUADRO = 32;                      // cada quadro das folhas do jogador é 32 × 32
const PES = 23;                         // linha do quadro onde ficam os pés
const OLHA_DIREITA = true;              // false se o seu desenho olha para a esquerda
const GRAV = 1000, PULO = 400, VEL = 100, COYOTE = 0.1;

// Uma folha por estado (como no capítulo Spritesheet e estados)
const estados = {
  idle: { src: PASTA + 'player_idle.png', n: 5, fps: 6 },
  walk: { src: PASTA + 'player_walk.png', n: 8, fps: 10 },
  jump: { src: PASTA + 'player_jump.png', n: 4, fps: 8 }      // no ar: pulando ou caindo
};

// ---------- 1) ler o arquivo do Tiled ----------
// Os dois leitores devolvem o MESMO formato simples:
// { cols, lins, T, tilesets: [{primeiro, colunas, imagem}], camadas: [{nome, dados}], grupos: [{nome, objetos}] }

function lerTMX(texto) {
  const xml = new DOMParser().parseFromString(texto, 'application/xml');
  if (xml.querySelector('parsererror')) throw new Error('o .tmx está com erro de XML');
  const m = xml.documentElement;
  const num = (el, nome) => Number(el.getAttribute(nome));
  const mapa = { cols: num(m, 'width'), lins: num(m, 'height'), T: num(m, 'tilewidth'), tilesets: [], camadas: [], grupos: [] };

  xml.querySelectorAll('tileset').forEach(ts => mapa.tilesets.push({
    primeiro: num(ts, 'firstgid'),                       // número do primeiro tile desta folha
    colunas: num(ts, 'columns'),
    imagem: ts.querySelector('image').getAttribute('source')
  }));

  xml.querySelectorAll('layer').forEach(l => {           // camadas de tiles
    const d = l.querySelector('data');
    if (d.getAttribute('encoding') !== 'csv') throw new Error('no Tiled, use o formato de camada CSV');
    mapa.camadas.push({ nome: l.getAttribute('name'), dados: d.textContent.split(',').map(Number) });
  });

  xml.querySelectorAll('objectgroup').forEach(g => mapa.grupos.push({    // camadas de objetos
    nome: g.getAttribute('name'),
    objetos: [...g.querySelectorAll('object')].map(o => ({ x: num(o, 'x'), y: num(o, 'y'), w: num(o, 'width'), h: num(o, 'height') }))
  }));
  return mapa;
}

function lerJSON(texto) {
  const j = JSON.parse(texto);
  return {
    cols: j.width, lins: j.height, T: j.tilewidth,
    tilesets: j.tilesets.map(ts => ({ primeiro: ts.firstgid, colunas: ts.columns, imagem: ts.image })),
    camadas: j.layers.filter(l => l.type === 'tilelayer').map(l => ({ nome: l.name, dados: l.data })),
    grupos: j.layers.filter(l => l.type === 'objectgroup').map(l => ({
      nome: l.name,
      objetos: l.objects.map(o => ({ x: o.x, y: o.y, w: o.width, h: o.height }))
    }))
  };
}

// Uma imagem só vale depois de carregada: a Promise avisa quando isso acontece
function carregarImagem(url) {
  return new Promise((ok, falha) => {
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = () => falha(new Error('imagem não encontrada: ' + url));
    img.src = url;
  });
}

let mapa, cenario, chao, inicio;        // preenchidos quando tudo terminar de carregar

async function carregar() {
  const resp = await fetch(MAPA);
  if (!resp.ok) throw new Error(MAPA + ' (erro ' + resp.status + ')');
  const texto = await resp.text();
  mapa = MAPA.endsWith('.json') ? lerJSON(texto) : lerTMX(texto);

  // o caminho da imagem do tileset é relativo ao ARQUIVO DO MAPA, não à página
  const base = new URL(MAPA, location.href);
  for (const ts of mapa.tilesets) ts.img = await carregarImagem(new URL(ts.imagem, base).href);
  for (const nome in estados) estados[nome].img = await carregarImagem(estados[nome].src);

  const camadaChao = mapa.camadas.find(c => c.nome === CAMADA_CHAO);
  if (!camadaChao) throw new Error('não achei a camada ' + CAMADA_CHAO);
  chao = camadaChao.dados;

  const grupo = mapa.grupos[0];                          // a camada de objetos do Tiled
  if (!grupo || !grupo.objetos.length) throw new Error('faltou o ponto inicial (camada de objetos)');
  inicio = grupo.objetos[0];

  cenario = montarCenario();
}

// ---------- 2) desenhar o mapa UMA vez ----------
// Em vez de redesenhar 600 tiles a cada quadro, pintamos todas as camadas numa imagem grande
// (fora da tela) e depois só recortamos o pedaço que a câmera mostra.
function montarCenario() {
  const T = mapa.T;
  const c = document.createElement('canvas');
  c.width = mapa.cols * T; c.height = mapa.lins * T;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  mapa.camadas.forEach(camada => {                       // na ordem do arquivo: fundo primeiro
    camada.dados.forEach((gid, i) => {
      gid = gid & 0x1FFFFFFF;                            // tira os bits de espelhamento do Tiled
      if (gid === 0) return;                             // 0 = célula vazia
      const ts = mapa.tilesets.filter(t => t.primeiro <= gid).pop();   // de qual folha é este tile?
      const k = gid - ts.primeiro;                       // posição dele dentro da folha (0, 1, 2...)
      const sx = (k % ts.colunas) * T, sy = Math.floor(k / ts.colunas) * T;
      g.drawImage(ts.img, sx, sy, T, T, (i % mapa.cols) * T, Math.floor(i / mapa.cols) * T, T, T);
    });
  });
  return c;
}

// ---------- 3) o jogo ----------
const solido = (c, l) => {
  if (c < 0 || c >= mapa.cols || l < 0 || l >= mapa.lins) return true;   // as bordas do mapa (lados, topo e fundo) contam como parede
  return chao[l * mapa.cols + c] !== 0;                         // qualquer tile na camada é sólido
};

const p = { w: 12, h: 16, x: 0, y: 0, vx: 0, vy: 0, noChao: false, coyote: 0, esq: false, estado: 'idle', tempo: 0 };

function bate(x, y) {
  const T = mapa.T;
  const c0 = Math.floor(x / T), c1 = Math.floor((x + p.w - 0.01) / T);
  const l0 = Math.floor(y / T), l1 = Math.floor((y + p.h - 0.01) / T);
  for (let l = l0; l <= l1; l++)
    for (let c = c0; c <= c1; c++)
      if (solido(c, l)) return true;
  return false;
}

const limitar = (v, a, b) => Math.max(a, Math.min(b, v));

function comecar() {
  // o objeto do Tiled marca onde o jogador começa. y é o TOPO do retângulo, então os pés ficam em y + h
  p.x = inicio.x + inicio.w / 2 - p.w / 2;
  p.y = inicio.y + inicio.h - p.h;

  const cam = { x: 0, y: 0 };
  let puloAntes = false;

  loop((dt) => {
    const esq = keys.ArrowLeft || keys.a, dir = keys.ArrowRight || keys.d;
    const pulo = keys.ArrowUp || keys.w || keys[' '];
    const apertou = pulo && !puloAntes;
    puloAntes = !!pulo;

    // horizontal
    const alvo = (dir ? 1 : 0) - (esq ? 1 : 0);
    if (alvo) p.esq = alvo < 0;
    p.vx += (alvo * VEL - p.vx) * Math.min(1, 12 * dt);

    const T = mapa.T;
    p.x += p.vx * dt;                                    // 1) move só em X e resolve
    if (bate(p.x, p.y)) {
      p.x = p.vx > 0 ? Math.floor((p.x + p.w) / T) * T - p.w : (Math.floor(p.x / T) + 1) * T;
      p.vx = 0;
    }

    // pulo (coyote time e pulo variável, como no capítulo Plataforma com tilemap)
    p.coyote = p.noChao ? COYOTE : p.coyote - dt;
    if (apertou && p.coyote > 0) { p.vy = -PULO; p.coyote = 0; }
    const g = (p.vy < 0 && !pulo) ? GRAV * 2.2 : GRAV;
    p.vy = Math.min(p.vy + g * dt, 400);

    p.y += p.vy * dt;                                    // 2) move só em Y e resolve
    p.noChao = false;
    if (bate(p.x, p.y)) {
      if (p.vy > 0) { p.y = Math.floor((p.y + p.h) / T) * T - p.h; p.noChao = true; }
      else p.y = (Math.floor(p.y / T) + 1) * T;
      p.vy = 0;
    }

    // estado e quadro da animação
    // sem chão sob os pés = no ar (pulando OU caindo de uma plataforma); no chão, anda ou fica parado
    const novo = !p.noChao ? 'jump' : Math.abs(p.vx) > 8 ? 'walk' : 'idle';
    if (novo !== p.estado) { p.estado = novo; p.tempo = 0; }
    p.tempo += dt;
    const f = estados[p.estado];
    const quadro = Math.floor(p.tempo * f.fps) % f.n;

    // câmera: centraliza no jogador, sem passar das bordas do mapa
    const vw = W / ZOOM, vh = H / ZOOM;                  // quanto do mundo cabe na tela
    cam.x = Math.round(limitar(p.x + p.w / 2 - vw / 2, 0, mapa.cols * T - vw));
    cam.y = Math.round(limitar(p.y + p.h / 2 - vh / 2, 0, mapa.lins * T - vh));

    // ---------- desenho ----------
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#0b0b16'; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(cenario, cam.x, cam.y, vw, vh, 0, 0, W, H);   // só o pedaço que a câmera vê

    ctx.save();
    ctx.scale(ZOOM, ZOOM);
    ctx.translate(-cam.x, -cam.y);                       // daqui em diante, as coordenadas são do MUNDO
    const dx = Math.round(p.x + p.w / 2 - QUADRO / 2);   // quadro centrado na caixa...
    const dy = Math.round(p.y + p.h - PES);              // ...e com os pés na base dela
    if (p.esq === OLHA_DIREITA) {                        // espelha para olhar para o outro lado
      ctx.translate(dx + QUADRO, dy);
      ctx.scale(-1, 1);
      ctx.drawImage(f.img, quadro * QUADRO, 0, QUADRO, QUADRO, 0, 0, QUADRO, QUADRO);
    } else {
      ctx.drawImage(f.img, quadro * QUADRO, 0, QUADRO, QUADRO, dx, dy, QUADRO, QUADRO);
    }
    ctx.restore();

    if (DEPURAR) {
      ctx.save(); ctx.scale(ZOOM, ZOOM); ctx.translate(-cam.x, -cam.y);
      ctx.lineWidth = 1 / ZOOM;
      ctx.strokeStyle = '#ffd34e'; ctx.strokeRect(p.x, p.y, p.w, p.h);                  // caixa de colisão
      ctx.strokeStyle = '#e0483e'; ctx.strokeRect(inicio.x, inicio.y, inicio.w, inicio.h);   // objeto do Tiled
      ctx.restore();
    }

    ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textAlign = 'left';
    ctx.fillText('mapa: ' + mapa.cols + ' × ' + mapa.lins + ' tiles de ' + T + ' px   câmera x: ' + cam.x, 8, 14);
    ctx.fillText('estado: ' + p.estado + '   quadro: ' + quadro + ' de ' + f.n, 8, 28);
  });
}

// ---------- 4) carregar e só então começar ----------
function aviso(linhas) {
  ctx.fillStyle = '#16301c'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
  linhas.forEach((t, i) => ctx.fillText(t, W / 2, 96 + i * 20, W - 20));
}

aviso(['Carregando ' + MAPA + '...']);
carregar().then(comecar).catch(e => aviso([
  'Não deu para carregar o mapa.',
  e.message,
  'Abra o guia por um servidor local (veja o texto).'
]));
`},
{n:"Y Sorting",t:`<p>Em jogos vistos de cima, como um mini-RPG, a câmera olha o mundo meio de lado: o que está <b>mais embaixo na tela está mais perto de você</b>. Por isso o coelho tem de passar <b>por trás</b> de uma árvore quando está acima dela, e <b>pela frente</b> quando está abaixo. O canvas, porém, só sabe pintar uma coisa em cima da outra, na ordem em que você manda. Se o coelho for desenhado por último, ele fica sempre na frente e aparece por cima da copa mesmo quando está atrás do tronco. Se for desenhado primeiro, fica sempre atrás. Teste: coloque <code>ORDENAR = false</code> e passe por uma árvore.</p><p><b>Y Sorting</b> (ordenar por Y) resolve isso com a regra do pintor: antes de desenhar, ordene tudo pelo <code>y</code> da <b>base</b>, do menor para o maior, e desenhe nessa ordem. Quem está mais acima vai primeiro, quem está mais abaixo vai por último e cobre os outros. A palavra importante é <b>base</b>: não é o topo da imagem, é o ponto em que a coisa toca o chão. Para a árvore, é a borda de baixo dos tiles dela (onde o tronco encontra a grama). Para o coelho, são os pés: <code>p.y + p.h</code>. Com <code>DEPURAR = true</code> você vê essas linhas: azul nas árvores e amarela no coelho. Quando o coelho cruza uma linha azul, os dois trocam de lugar na fila.</p><p><b>As camadas do mapa.</b> <code>Tiles</code> é o chão, e <code>Objects</code> tem objetos pequenos (pedras, cogumelos, toquinhos) de um tile só. Os dois ficam sempre atrás do coelho, então são pintados uma vez só numa imagem grande, como no capítulo anterior. Isso funciona porque o tile inteiro de cada objeto pequeno é sólido: o coelho nunca fica &quot;dentro&quot; de um e sempre os cobre quando está abaixo. <code>YSorting</code> e <code>YSorting2</code> têm as árvores e os troncos grandes: são eles que entram na ordenação. A <code>YSorting2</code> guarda os padrões maiores, como o trio de árvores (4 × 3 tiles). Cada camada é agrupada separadamente, então tiles de camadas diferentes nunca se juntam num objeto só. E o objeto <code>PlayerStart</code> marca onde os pés do coelho começam. O mapa usa dois tilesets (<code>tiles.png</code> e <code>objects.png</code>), e o leitor do capítulo anterior já lida com isso: cada gid pertence à última folha cujo <code>firstgid</code> não passa dele.</p><p><b>De tiles para objetos.</b> A camada <code>YSorting</code> é uma grade de tiles, mas uma árvore tem vários (4 × 3, por exemplo), e todos precisam ser ordenados juntos. Se cada tile fosse ordenado sozinho, a linha de cima da copa teria um <code>y</code> menor que a de baixo, e o coelho poderia ficar na frente de uma parte da árvore e atrás de outra. A função <code>agruparObjetos</code> junta os tiles vizinhos com uma busca em área (<i>flood fill</i>): um vizinho entra no mesmo objeto quando ele <b>continua o desenho na folha</b>, ou seja, à direita o gid é <code>gid + 1</code> e embaixo é <code>gid + colunas</code>. Duas árvores iguais lado a lado não se juntam, porque depois do pedaço direito de uma vem o pedaço esquerdo da outra. Cada grupo vira um objeto com sua própria imagem (pintada uma vez), sua caixa e a <code>base</code>.</p><p><b>Colisão de cima.</b> A caixa de colisão do coelho é só os <b>pés</b>, 10 × 6 pixels, e não o corpo todo. Assim a cabeça pode passar sobre a copa e só os pés precisam respeitar o tronco. Pelo mesmo motivo, cada árvore só bloqueia uma faixa de 8 pixels na base, um pouco mais estreita que o desenho (<code>BASE_ALTURA</code> e <code>BASE_MARGEM</code>). Mas nem todo desenho tem a base reta: no trio de árvores, a do meio fica 12 pixels acima das outras duas, e uma faixa só na base deixaria o coelho descer pelo meio e atravessar o tronco dela. Para esses padrões, a tabela <code>FORMAS</code> guarda uma lista de caixas (uma por tronco), em pixels a partir do canto do desenho, e a chave é o gid do tile do canto de cima à esquerda. O vão entre os dois troncos de baixo tem 8 pixels, menos que os 10 do coelho, então ele também não consegue entrar ali. Já os objetos pequenos bloqueiam o tile inteiro. A lista <code>paredes</code> junta tudo isso, e <code>mover</code> anda um eixo de cada vez, como no capítulo <b>Colisão</b>, empurrando o coelho para fora de qualquer retângulo em que ele entre.</p><p><b>A fila de desenho.</b> A cada quadro o jogo monta uma lista com os objetos que a câmera enxerga e com o coelho. Cada item guarda o seu <code>y</code> e uma função para se desenhar. Depois vem o <code>sort</code> e o <code>forEach</code>: o último a ser desenhado fica na frente. Ordenar umas dezenas de itens por quadro é barato. Num mapa enorme, vale deixar os objetos fixos já ordenados e só encaixar os que se movem.</p><p><b>O coelho.</b> As folhas têm quadros de 48 × 48: <code>idle</code> com 5 quadros e <code>run</code> com 8. Cada folha tem <b>4 linhas, uma por direção</b>, na ordem norte, leste, oeste e sul (<code>LINHA</code>). Os pés ficam na linha 32 do quadro (<code>PES</code>) e o meio do corpo na coluna 24 (<code>CENTRO</code>). O estado é <code>run</code> quando ele realmente andou naquele quadro (encostado numa parede, fica em <code>idle</code>). A direção vem das teclas, e na diagonal o movimento é dividido por <code>Math.hypot(dx, dy)</code> para não ficar mais rápido.</p><p>Setas ou WASD andam. O arquivo vem de <code>assets/ysorting/map2.tmx</code> e, como no capítulo anterior, a página precisa ser aberta por um servidor local.</p>`,
d:"Deixe a árvore (ou qualquer outro objeto) meio transparente quando o coelho estiver escondido atrás dela, para o jogador nunca perdê-lo de vista.",
c:`// Y Sorting: quem está mais ABAIXO na tela é desenhado por último, e por isso fica na frente.
// Setas ou WASD andam. Passe por trás e pela frente das árvores.
// Atenção: precisa de servidor, como no capítulo anterior (python -m http.server).

// ---------- configuração ----------
const PASTA = 'assets/ysorting/';
const MAPA = PASTA + 'map2.tmx';
const ZOOM = 1;                         // 1 = pixel do mapa = pixel do desenho. 2 = câmera mais perto
const ORDENAR = true;                   // false: o coelho é sempre desenhado por cima (veja o erro!)
const DEPURAR = false;                  // true: mostra as colisões e a linha de ordenação de cada objeto

// nomes das camadas do mapa
const CAMADA_CHAO = 'Tiles', CAMADA_OBJETOS = 'Objects';
const CAMADAS_ORDENAR = ['YSorting', 'YSorting2'];      // cada camada é agrupada separadamente

const QUADRO = 48;                      // cada quadro das folhas é 48 × 48
const PES = 32;                         // linha do quadro onde ficam os pés
const CENTRO = 24;                      // coluna do meio do corpo, dentro do quadro
const LINHA = { norte: 0, leste: 1, oeste: 2, sul: 3 };   // ordem das linhas nas folhas
const VEL = 70;
const BASE_ALTURA = 8;                  // altura da colisão na base de cada objeto ordenado
const BASE_MARGEM = 3;                  // a colisão é mais estreita que o desenho (de cada lado)

// Nem todo desenho tem a base reta. No trio de árvores (4 × 3 tiles) a árvore do meio fica mais
// acima que as outras duas: com uma faixa só na base do desenho, o coelho descia pelo meio e
// atravessava o tronco dela. Para esses padrões damos uma lista de caixas (uma por tronco), em
// pixels a partir do canto de cima à esquerda do desenho. A chave é o gid desse tile do canto.
const TRIO = { w: 64, h: 48, caixas: [
  { x: 4,  y: 40, w: 24, h: 8 },       // tronco da esquerda
  { x: 36, y: 40, w: 24, h: 8 },       // tronco da direita (o vão entre os dois é 8 < 10: o coelho não entra)
  { x: 26, y: 28, w: 12, h: 8 }        // tronco do meio: a base dele fica 12 px acima da base do desenho
] };
const FORMAS = { 259: TRIO, 322: TRIO };

const estados = {
  idle: { src: PASTA + 'bunny_idle.png', n: 5, fps: 6 },
  run:  { src: PASTA + 'bunny_run.png',  n: 8, fps: 12 }
};

// ---------- 1) ler o arquivo do Tiled (igual ao capítulo anterior, só .tmx) ----------
function lerTMX(texto) {
  const xml = new DOMParser().parseFromString(texto, 'application/xml');
  if (xml.querySelector('parsererror')) throw new Error('o .tmx está com erro de XML');
  const m = xml.documentElement;
  const num = (el, nome) => Number(el.getAttribute(nome));
  const mapa = { cols: num(m, 'width'), lins: num(m, 'height'), T: num(m, 'tilewidth'), tilesets: [], camadas: [], grupos: [] };

  xml.querySelectorAll('tileset').forEach(ts => mapa.tilesets.push({   // este mapa tem DOIS tilesets
    primeiro: num(ts, 'firstgid'),
    colunas: num(ts, 'columns'),
    imagem: ts.querySelector('image').getAttribute('source')
  }));

  xml.querySelectorAll('layer').forEach(l => {
    const d = l.querySelector('data');
    if (d.getAttribute('encoding') !== 'csv') throw new Error('no Tiled, use o formato de camada CSV');
    mapa.camadas.push({
      nome: l.getAttribute('name'),
      dados: d.textContent.split(',').map(n => Number(n) & 0x1FFFFFFF)   // tira os bits de espelhamento
    });
  });

  xml.querySelectorAll('objectgroup').forEach(g => mapa.grupos.push({
    nome: g.getAttribute('name'),
    objetos: [...g.querySelectorAll('object')].map(o => ({ x: num(o, 'x'), y: num(o, 'y'), w: num(o, 'width'), h: num(o, 'height') }))
  }));
  return mapa;
}

function carregarImagem(url) {
  return new Promise((ok, falha) => {
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = () => falha(new Error('imagem não encontrada: ' + url));
    img.src = url;
  });
}

let mapa, chao, objetos, paredes, inicio;

const camada = (nome) => {
  const c = mapa.camadas.find(c => c.nome === nome);
  if (!c) throw new Error('não achei a camada ' + nome);
  return c.dados;
};
const tilesetDe = (gid) => mapa.tilesets.filter(t => t.primeiro <= gid).pop();   // de qual folha é este tile?

async function carregar() {
  const resp = await fetch(MAPA);
  if (!resp.ok) throw new Error(MAPA + ' (erro ' + resp.status + ')');
  mapa = lerTMX(await resp.text());

  const base = new URL(MAPA, location.href);
  for (const ts of mapa.tilesets) ts.img = await carregarImagem(new URL(ts.imagem, base).href);
  for (const nome in estados) estados[nome].img = await carregarImagem(estados[nome].src);

  chao = montarChao();
  objetos = CAMADAS_ORDENAR.flatMap(nome => agruparObjetos(camada(nome)));   // árvores, troncos...: vão para a ordenação
  paredes = [];
  objetos.forEach(o => {
    const forma = FORMAS[o.id];
    if (forma && forma.w === o.w && forma.h === o.h) {   // padrão conhecido: usa as caixas dele
      forma.caixas.forEach(c => paredes.push({ x: o.x + c.x, y: o.y + c.y, w: c.w, h: c.h }));
    } else {                                             // o resto: só a faixa da base do objeto
      paredes.push({ x: o.x + BASE_MARGEM, y: o.base - BASE_ALTURA, w: o.w - BASE_MARGEM * 2, h: BASE_ALTURA });
    }
  });
  const T = mapa.T;
  camada(CAMADA_OBJETOS).forEach((gid, i) => {           // objetos pequenos: o tile inteiro é sólido
    if (gid) paredes.push({ x: (i % mapa.cols) * T, y: Math.floor(i / mapa.cols) * T, w: T, h: T });
  });

  const grupo = mapa.grupos[0];
  if (!grupo || !grupo.objetos.length) throw new Error('faltou o ponto inicial (camada de objetos)');
  inicio = grupo.objetos[0];
}

// ---------- 2) montar as imagens ----------
function desenharTile(g, gid, x, y) {
  const ts = tilesetDe(gid), T = mapa.T;
  const k = gid - ts.primeiro;                           // posição do tile dentro da folha
  g.drawImage(ts.img, (k % ts.colunas) * T, Math.floor(k / ts.colunas) * T, T, T, x, y, T, T);
}

// O chão e os objetos pequenos ficam SEMPRE atrás do coelho: pintamos uma vez só numa imagem grande.
function montarChao() {
  const T = mapa.T;
  const c = document.createElement('canvas');
  c.width = mapa.cols * T; c.height = mapa.lins * T;
  const g = c.getContext('2d');
  [CAMADA_CHAO, CAMADA_OBJETOS].forEach(nome => {
    camada(nome).forEach((gid, i) => {
      if (gid) desenharTile(g, gid, (i % mapa.cols) * T, Math.floor(i / mapa.cols) * T);
    });
  });
  return c;
}

// A camada YSorting é uma grade de tiles, mas uma árvore tem vários tiles (4 × 3, por exemplo) e
// TODOS precisam ser ordenados juntos. Então juntamos os tiles vizinhos num objeto só. Dois tiles
// pertencem ao mesmo objeto quando o vizinho continua o desenho na folha: à direita é o gid + 1,
// embaixo é o gid + colunas. Duas árvores iguais lado a lado NÃO se juntam (depois do pedaço
// direito de uma vem o pedaço esquerdo da outra, e não o gid + 1).
function agruparObjetos(dados) {
  const { cols, lins, T } = mapa;
  const visto = new Array(dados.length).fill(false);
  const lista = [];
  dados.forEach((gid, comeco) => {
    if (!gid || visto[comeco]) return;
    const cels = [], pilha = [comeco];
    visto[comeco] = true;
    while (pilha.length) {                               // busca em área (flood fill)
      const i = pilha.pop();
      cels.push(i);
      const c = i % cols, l = Math.floor(i / cols), n = tilesetDe(dados[i]).colunas;
      [[c + 1, l, 1], [c - 1, l, -1], [c, l + 1, n], [c, l - 1, -n]].forEach(([cc, ll, passo]) => {
        if (cc < 0 || cc >= cols || ll < 0 || ll >= lins) return;
        const j = ll * cols + cc;
        if (!visto[j] && dados[j] === dados[i] + passo) { visto[j] = true; pilha.push(j); }
      });
    }
    // caixa que cobre o objeto, em tiles
    const cs = cels.map(i => i % cols), ls = cels.map(i => Math.floor(i / cols));
    const c0 = Math.min(...cs), c1 = Math.max(...cs), l0 = Math.min(...ls), l1 = Math.max(...ls);
    const img = document.createElement('canvas');
    img.width = (c1 - c0 + 1) * T; img.height = (l1 - l0 + 1) * T;
    const g = img.getContext('2d');
    cels.forEach(i => desenharTile(g, dados[i], (i % cols - c0) * T, (Math.floor(i / cols) - l0) * T));
    lista.push({
      id: gid,                                           // gid do tile do canto de cima à esquerda: identifica o padrão
      x: c0 * T, y: l0 * T, w: img.width, h: img.height,
      base: (l1 + 1) * T,                                // y da borda de baixo: onde o objeto toca o chão
      img
    });
  });
  return lista;
}

// ---------- 3) o jogo ----------
const limitar = (v, a, b) => Math.max(a, Math.min(b, v));
const sobrepoe = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

// A caixa de colisão é só os PÉS do coelho (10 × 6), e não o corpo todo. Assim a cabeça pode passar
// por cima da copa de uma árvore, e só os pés precisam respeitar o tronco.
const p = { w: 10, h: 6, x: 0, y: 0, dir: 'sul', estado: 'idle', tempo: 0 };

function mover(dx, dy) {                                 // um eixo de cada vez, como nos capítulos anteriores
  p.x += dx;
  for (const r of paredes) if (sobrepoe(p, r)) p.x = dx > 0 ? r.x - p.w : r.x + r.w;
  p.y += dy;
  for (const r of paredes) if (sobrepoe(p, r)) p.y = dy > 0 ? r.y - p.h : r.y + r.h;
  p.x = limitar(p.x, 0, mapa.cols * mapa.T - p.w);       // não sai do mapa
  p.y = limitar(p.y, 0, mapa.lins * mapa.T - p.h);
}

function comecar() {
  p.x = inicio.x + inicio.w / 2 - p.w / 2;               // o objeto do Tiled marca onde os pés começam
  p.y = inicio.y + inicio.h - p.h;
  const cam = { x: 0, y: 0 };

  loop((dt) => {
    // entrada: 8 direções, e na diagonal não anda mais rápido (divide pelo comprimento do vetor)
    let dx = 0, dy = 0;
    if (keys.ArrowLeft || keys.a) dx -= 1;
    if (keys.ArrowRight || keys.d) dx += 1;
    if (keys.ArrowUp || keys.w) dy -= 1;
    if (keys.ArrowDown || keys.s) dy += 1;
    const x0 = p.x, y0 = p.y;
    if (dx || dy) {
      const norma = Math.hypot(dx, dy);
      mover(dx / norma * VEL * dt, dy / norma * VEL * dt);
      p.dir = dy < 0 ? 'norte' : dy > 0 ? 'sul' : dx > 0 ? 'leste' : 'oeste';
    }
    const andou = Math.abs(p.x - x0) + Math.abs(p.y - y0) > 0.001;   // encostado na parede não conta

    // estado (idle ou run) e quadro da animação
    const novo = andou ? 'run' : 'idle';
    if (novo !== p.estado) { p.estado = novo; p.tempo = 0; }
    p.tempo += dt;
    const f = estados[p.estado];
    const quadro = Math.floor(p.tempo * f.fps) % f.n;

    // câmera: centraliza no coelho, sem passar das bordas do mapa
    const T = mapa.T, vw = W / ZOOM, vh = H / ZOOM;
    cam.x = Math.round(limitar(p.x + p.w / 2 - vw / 2, 0, mapa.cols * T - vw));
    cam.y = Math.round(limitar(p.y + p.h / 2 - vh / 2, 0, mapa.lins * T - vh));

    // ---------- desenho ----------
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(chao, cam.x, cam.y, vw, vh, 0, 0, W, H);        // chão + objetos pequenos

    ctx.save();
    ctx.scale(ZOOM, ZOOM);
    ctx.translate(-cam.x, -cam.y);                                // daqui em diante: coordenadas do MUNDO

    const desenharCoelho = () => {
      const cx = p.x + p.w / 2;
      ctx.fillStyle = 'rgba(0,0,0,.25)';                          // sombrinha nos pés
      ctx.beginPath(); ctx.ellipse(cx, p.y + p.h, 6, 2.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.drawImage(f.img, quadro * QUADRO, LINHA[p.dir] * QUADRO, QUADRO, QUADRO,
                    Math.round(cx - CENTRO), Math.round(p.y + p.h - PES), QUADRO, QUADRO);
    };

    // a fila de desenho: cada item sabe o seu y (a base) e como se desenhar
    const fila = objetos
      .filter(o => o.x < cam.x + vw && o.x + o.w > cam.x && o.y < cam.y + vh && o.y + o.h > cam.y)   // só os visíveis
      .map(o => ({ y: o.base, desenhar: () => ctx.drawImage(o.img, o.x, o.y) }));
    fila.push({ y: p.y + p.h, desenhar: desenharCoelho });        // a base do coelho são os pés
    if (ORDENAR) fila.sort((a, b) => a.y - b.y);                  // menor y (mais acima) primeiro
    fila.forEach(item => item.desenhar());                        // o último desenhado fica na frente

    if (DEPURAR) {
      ctx.lineWidth = 1 / ZOOM;
      ctx.strokeStyle = '#e0483e'; paredes.forEach(r => ctx.strokeRect(r.x, r.y, r.w, r.h));   // colisões
      ctx.strokeStyle = '#4aa3e0';
      objetos.forEach(o => { ctx.beginPath(); ctx.moveTo(o.x, o.base); ctx.lineTo(o.x + o.w, o.base); ctx.stroke(); });
      ctx.strokeStyle = '#ffd34e'; ctx.strokeRect(p.x, p.y, p.w, p.h);
      ctx.beginPath(); ctx.moveTo(p.x - 6, p.y + p.h); ctx.lineTo(p.x + p.w + 6, p.y + p.h); ctx.stroke();
    }
    ctx.restore();

    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(4, 4, 232, 30);
    ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textAlign = 'left';
    ctx.fillText('ordenar: ' + (ORDENAR ? 'sim' : 'não') + '   y dos pés: ' + Math.round(p.y + p.h), 8, 16);
    ctx.fillText('direção: ' + p.dir + '   ' + p.estado + ' ' + quadro + '/' + f.n, 8, 29);
  });
}

// ---------- 4) carregar e só então começar ----------
function aviso(linhas) {
  ctx.fillStyle = '#16301c'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
  linhas.forEach((t, i) => ctx.fillText(t, W / 2, 96 + i * 20, W - 20));
}

aviso(['Carregando ' + MAPA + '...']);
carregar().then(comecar).catch(e => aviso([
  'Não deu para carregar o mapa.',
  e.message,
  'Abra o guia por um servidor local (veja o texto).'
]));
`},
{n:"Labirintos e cavernas",t:`<p>Em <b>Aleatoriedade e mapas</b> você viu as salas ligadas por corredores. Aqui estão dois outros jeitos, muito usados em roguelikes, de criar um mapa por código: o <b>labirinto</b> e a <b>caverna</b>. Nos dois, o mapa começa todo de parede (<code>#</code>) e o código vai abrindo chão (<code>.</code>). Com a tecla 1 ou 2 você troca de gerador, e com R sorteia um mapa novo.</p><p>O <b>labirinto</b> usa a busca em profundidade: parte de uma célula, sorteia um vizinho ainda fechado, derruba a parede entre os dois e segue para ele. Se não houver vizinho livre, volta um passo pela <code>pilha</code>. As células ficam nas posições ímpares da grade (por isso <code>COLS</code> e <code>LINS</code> são ímpares) e as paredes ficam entre elas. O resultado é um labirinto "perfeito": só existe um caminho entre dois pontos. Para criar voltas e saídas alternativas, a constante <code>ATALHOS</code> derruba algumas paredes extras. Troque por 0 e veja a diferença.</p><p>A <b>caverna</b> usa um <b>autômato celular</b>. Primeiro cada tile vira parede ou chão na sorte (<code>DENSIDADE</code>). Depois repetimos algumas rodadas de uma regra simples: cada tile olha os 9 tiles ao redor, contando ele mesmo, e vira parede se 5 ou mais forem parede. Pontos soltos desaparecem e o ruído vira cavernas de bordas orgânicas. Mas a regra pode deixar áreas isoladas, então <code>maiorRegiao</code> faz uma busca em área (<i>flood fill</i>) e mantém só a maior. É isso que garante que o jogador nunca fique preso.</p><p>Para o mapa ser jogável, falta definir início e saída. Uma <b>busca em largura</b> a partir do início conta os passos até cada tile, e a escada vai para o último tile alcançado, o mais distante. O número de passos aparece na tela. No labirinto, esse caminho é longo e sinuoso, e na caverna é mais direto.</p><p>O jogador é um quadrado de 10 × 10 e a função <code>livre</code> confere todos os tiles que ele cobre. O movimento é feito um eixo por vez: se o passo bater numa parede, o código não deixa o jogador parado a alguns pixels dela, e sim o encosta exatamente na face do tile. Assim não sobra folga entre ele e a parede, nem quando o jogo roda devagar.</p><p>Setas ou WASD andam. Chegue à escada para o próximo nível.</p>`,
d:"Adicione escuridão: desenhe o chão e a escada só a até 5 tiles de distância do jogador, deixando o resto coberto de preto. Dica: use Math.hypot com a posição do jogador.",
c:`// 1 = labirinto   2 = caverna   R = novo mapa
const COLS = 29, LINS = 15, T = 16;        // 29 × 16 = 464: sobram 8px de cada lado
const OX = (W - COLS * T) / 2;
const ATALHOS = 6;                         // paredes extras derrubadas no labirinto (0 = um caminho só)
const DENSIDADE = 0.45, RODADAS = 4;       // caverna: chance de parede no sorteio e rodadas do autômato
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

const sorteio = (n) => Math.floor(Math.random() * n);
const cheio = () => Array.from({ length: LINS }, () => Array(COLS).fill('#'));   // tudo parede

let mapa, jogador, saida, passos, nivel = 1, tipo = 1, antes = {};
const parede = (c, l) => l < 0 || l >= LINS || c < 0 || c >= COLS || mapa[l][c] === '#';

// ---------- 1) labirinto: busca em profundidade ----------
function labirinto() {
  const m = cheio(), pilha = [[1, 1]];
  m[1][1] = '.';
  while (pilha.length) {
    const [c, l] = pilha[pilha.length - 1];
    // vizinhos a 2 tiles de distância que ainda são parede (as células ficam nas posições ímpares)
    const viz = DIRS.map(([dc, dl]) => [c + dc * 2, l + dl * 2, dc, dl])
      .filter(([nc, nl]) => nc > 0 && nc < COLS - 1 && nl > 0 && nl < LINS - 1 && m[nl][nc] === '#');
    if (!viz.length) { pilha.pop(); continue; }            // beco sem saída: volta um passo
    const [nc, nl, dc, dl] = viz[sorteio(viz.length)];
    m[l + dl][c + dc] = '.';                               // derruba a parede entre as duas células
    m[nl][nc] = '.';
    pilha.push([nc, nl]);
  }
  // atalhos: derruba paredes que separam dois corredores, criando voltas
  for (let i = 0, feitos = 0; feitos < ATALHOS && i < 500; i++) {
    const c = 1 + sorteio(COLS - 2), l = 1 + sorteio(LINS - 2);
    const entre = m[l][c - 1] === '.' && m[l][c + 1] === '.' || m[l - 1][c] === '.' && m[l + 1][c] === '.';
    if (m[l][c] === '#' && (c + l) % 2 === 1 && entre) { m[l][c] = '.'; feitos++; }
  }
  return m;
}

// ---------- 2) caverna: autômato celular ----------
function caverna() {
  let m = cheio();
  for (let l = 1; l < LINS - 1; l++)
    for (let c = 1; c < COLS - 1; c++)
      if (Math.random() > DENSIDADE) m[l][c] = '.';        // ruído: parede ou chão na sorte
  for (let i = 0; i < RODADAS; i++) {
    const n = cheio();                                     // lê de m, escreve em n
    for (let l = 1; l < LINS - 1; l++)
      for (let c = 1; c < COLS - 1; c++) {
        let paredes = 0;
        for (let b = l - 1; b <= l + 1; b++)
          for (let a = c - 1; a <= c + 1; a++) if (m[b][a] === '#') paredes++;   // conta o próprio tile
        if (paredes < 5) n[l][c] = '.';                    // 5 ou mais paredes por perto: vira parede
      }
    m = n;
  }
  return maiorRegiao(m);
}

// flood fill: acha as áreas de chão separadas e mantém só a maior (ninguém fica preso)
function maiorRegiao(m) {
  const visto = m.map(r => r.map(() => false));
  let melhor = [];
  for (let l = 1; l < LINS - 1; l++)
    for (let c = 1; c < COLS - 1; c++) {
      if (m[l][c] !== '.' || visto[l][c]) continue;
      const reg = [], pilha = [[c, l]];
      visto[l][c] = true;
      while (pilha.length) {
        const [x, y] = pilha.pop();
        reg.push([x, y]);
        DIRS.forEach(([dc, dl]) => {
          const a = x + dc, b = y + dl;
          if (m[b][a] === '.' && !visto[b][a]) { visto[b][a] = true; pilha.push([a, b]); }
        });
      }
      if (reg.length > melhor.length) melhor = reg;
    }
  const n = cheio();
  melhor.forEach(([c, l]) => { n[l][c] = '.'; });
  return n;
}

// ---------- início, saída e novo mapa ----------
// busca em largura: o último tile alcançado é o mais distante do início
function maisLonge(m, ini) {
  const dist = m.map(r => r.map(() => -1)), fila = [ini];
  dist[ini.l][ini.c] = 0;
  for (let i = 0; i < fila.length; i++) {
    const { c, l } = fila[i];
    DIRS.forEach(([dc, dl]) => {
      const a = c + dc, b = l + dl;
      if (m[b][a] === '.' && dist[b][a] < 0) { dist[b][a] = dist[l][c] + 1; fila.push({ c: a, l: b }); }
    });
  }
  const fim = fila[fila.length - 1];
  return { fim, passos: dist[fim.l][fim.c] };
}

function novoMapa() {
  let livres;
  do {                                                     // mapa pequeno demais? sorteia de novo
    mapa = tipo === 1 ? labirinto() : caverna();
    livres = [];
    mapa.forEach((linha, l) => linha.forEach((v, c) => { if (v === '.') livres.push({ c, l }); }));
  } while (livres.length < 80);
  const ini = tipo === 1 ? { c: 1, l: 1 } : livres[sorteio(livres.length)];
  const r = maisLonge(mapa, ini);
  saida = r.fim; passos = r.passos;
  jogador = { x: OX + ini.c * T + T / 2, y: ini.l * T + T / 2 };
}
novoMapa();

const M = 5;                                               // metade do jogador (ele é um quadrado de 10 × 10)

// o quadrado do jogador, centrado em (x, y), cabe aqui? Confere todos os tiles que ele cobre.
// Só encostar na borda de um tile não conta como batida (por isso o ceil(...) - 1).
const livre = (x, y) => {
  const c0 = Math.floor((x - M - OX) / T), c1 = Math.ceil((x + M - OX) / T) - 1;
  const l0 = Math.floor((y - M) / T),      l1 = Math.ceil((y + M) / T) - 1;
  for (let l = l0; l <= l1; l++)
    for (let c = c0; c <= c1; c++) if (parede(c, l)) return false;
  return true;
};

loop((dt) => {
  const apertou = (k) => keys[k] && !antes[k];
  if (apertou('1')) { tipo = 1; nivel = 1; novoMapa(); }
  if (apertou('2')) { tipo = 2; nivel = 1; novoMapa(); }
  if (apertou('r')) novoMapa();

  let dx = 0, dy = 0;
  if (keys.ArrowLeft  || keys.a) dx -= 1;
  if (keys.ArrowRight || keys.d) dx += 1;
  if (keys.ArrowUp    || keys.w) dy -= 1;
  if (keys.ArrowDown  || keys.s) dy += 1;
  // anda um eixo por vez. Se bater, não fica parado a um passo da parede: encosta nela certinho
  if (dx) {
    jogador.x += dx * 100 * dt;
    if (!livre(jogador.x, jogador.y))
      jogador.x = dx > 0 ? OX + Math.floor((jogador.x + M - OX) / T) * T - M           // encosta na face esquerda do tile
                         : OX + (Math.floor((jogador.x - M - OX) / T) + 1) * T + M;    // encosta na face direita do tile
  }
  if (dy) {
    jogador.y += dy * 100 * dt;
    if (!livre(jogador.x, jogador.y))
      jogador.y = dy > 0 ? Math.floor((jogador.y + M) / T) * T - M                     // encosta na face de cima do tile
                         : (Math.floor((jogador.y - M) / T) + 1) * T + M;              // encosta na face de baixo do tile
  }

  if (Math.floor((jogador.x - OX) / T) === saida.c && Math.floor(jogador.y / T) === saida.l) {
    nivel++; novoMapa();                                   // chegou na escada: próximo mapa
  }

  // ---------- desenho ----------
  const k = ctx.getTransform().a;                          // alinha as bordas ao pixel real (sem fios entre tiles)
  const px = (v) => Math.round(v * k) / k;
  ctx.fillStyle = '#4a4f7a'; ctx.fillRect(0, 0, W, H);     // fundo = parede
  for (let l = 0; l < LINS; l++)
    for (let c = 0; c < COLS; c++) {
      if (mapa[l][c] === '#') continue;
      const x0 = px(OX + c * T), x1 = px(OX + (c + 1) * T), y0 = px(l * T), y1 = px((l + 1) * T);
      ctx.fillStyle = '#241d33'; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      if (parede(c, l - 1)) { ctx.fillStyle = '#1a1526'; ctx.fillRect(x0, y0, x1 - x0, px(l * T + 4) - y0); }   // sombra sob a parede
    }

  const sx = OX + saida.c * T, sy = saida.l * T;           // escada
  ctx.fillStyle = '#c9c3e8';
  ctx.fillRect(sx + 2, sy + 3, 12, 3); ctx.fillRect(sx + 4, sy + 7, 10, 3); ctx.fillRect(sx + 6, sy + 11, 8, 3);

  ctx.fillStyle = '#ffd34e'; ctx.fillRect(jogador.x - M, jogador.y - M, 2 * M, 2 * M);
  ctx.fillStyle = '#1c130b'; ctx.fillRect(jogador.x + 1, jogador.y - 2, 3, 3);

  ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Nível ' + nivel + '   ' + (tipo === 1 ? 'Labirinto' : 'Caverna') + '   saída a ' + passos + ' passos', 12, 12);
  ctx.font = '10px monospace';
  ctx.fillText('Setas: andar   1: labirinto   2: caverna   R: novo mapa', 12, H - 4);

  antes = Object.assign({}, keys);
});
`},
