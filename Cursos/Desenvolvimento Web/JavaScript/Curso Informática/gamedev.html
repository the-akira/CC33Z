{n:"Névoa de guerra e visão",t:`<p>No desafio de <b>Labirintos e cavernas</b> você cobriu o mapa de escuridão. Aqui isso vira regra do jogo: a <b>névoa de guerra</b>. O jogador só enxerga o que está perto e sem parede no meio, e o que ele já viu continua desenhado, só que mais escuro. Roguelikes e jogos de estratégia usam isso para dar a sensação de explorar o desconhecido.</p><p>Cada tile do mapa está em um de três estados: <b>nunca visto</b> (preto), <b>explorado</b> (visto antes, mas fora da vista agora, desenhado bem escuro) e <b>visível</b> (à vista neste instante). Duas matrizes guardam isso. A <code>visivel</code> é zerada e recalculada a cada quadro. A <code>visto</code> só recebe <code>true</code> e nunca volta atrás: é a memória do mapa.</p><p>Para saber se um tile está visível, a função <code>veTile</code> usa a mesma ideia de <code>veJogador</code>, do capítulo <b>Inteligência dos inimigos</b>: anda em linha reta, de 4 em 4 pixels, do centro do jogador até o centro do tile. Se o tile estiver além do <code>raio</code>, ou se aparecer uma parede antes do destino, ele não é visto. A função <code>atualizarVisao</code> só testa os tiles do quadrado em volta do jogador, porque o raio cabe dentro dele. A face de uma parede aparece (o caminho chega nela), mas o que fica atrás dela não. É por isso que um pilar projeta sombra.</p><p>No desenho, o tile nunca visto nem é pintado, e o fundo preto aparece. O explorado ganha uma película preta de 65%. O visível escurece com a distância, o que dá o efeito de lanterna. Rupias e guardas seguem regras diferentes. A rupia fica parada, então o jogo se <i>lembra</i> dela depois que você a viu, e ela aparece apagada. O guarda se move, e desenhá-lo num tile fora da vista mostraria uma posição velha, que já não é verdade. Por isso ele só aparece enquanto o tile dele está à vista.</p><p>A colisão é a do labirinto: o jogador é um quadrado de 10 × 10 e, ao bater numa parede, o código o encosta exatamente na face do tile. Pegue as 5 rupias sem ser tocado pelos guardas. Se um guarda encostar em você, você volta ao início, mas o que já explorou continua no mapa.</p><p>Setas ou WASD andam. Aperte <b>R</b> para recomeçar com a névoa de volta.</p>`,
d:"Adicione uma lanterna: a tecla Espaço alterna o raio de visão entre 7 e 3 tiles. Dica: o raio está na variável raio, e a tecla R mostra como detectar um aperto.",
c:`// Névoa de guerra: o que nunca foi visto fica preto, o que já foi visto fica escuro.   R = recomeçar
const T = 16, M = 5;                      // tile de 16 px; M = metade do jogador (ele é um quadrado de 10 × 10)
// # = parede   . = chão
const MAPA = [
  '##############################',
  '#.....##.......###...........#',
  '#.....##.#...........#.......#',
  '#........#.....###...#...##..#',
  '#..#..##.......###...........#',
  '#.....#####.######...........#',
  '###.#######.#############.####',
  '###.#######.#############.####',
  '###.#######........######.####',
  '#........##...#....###.......#',
  '#...#....##...#....###...#...#',
  '#...#........................#',
  '#........##....#...###...#...#',
  '#........##....#...###.......#',
  '##############################'
];
const COLS = MAPA[0].length, LINS = MAPA.length;
const INICIO = { c: 2, l: 2 };
const RUPIAS = [[14, 1], [28, 1], [28, 13], [1, 13], [18, 13]];
const GUARDAS = [{ c: 17, l: 8, dx: 0, dy: 1 }, { c: 19, l: 1, dx: 0, dy: 1 }, { c: 23, l: 9, dx: 0, dy: 1 }];
let raio = 7 * T;                         // alcance da visão, em pixels

let jogador, visto, visivel, rupias, guardas, pegas, aviso, fim, antes = {};

const dentro = (c, l) => c >= 0 && c < COLS && l >= 0 && l < LINS;
const parede = (c, l) => !dentro(c, l) || MAPA[l][c] === '#';

function voltarAoInicio() {
  jogador = { x: INICIO.c * T + T / 2, y: INICIO.l * T + T / 2 };
}

function novoJogo() {
  voltarAoInicio();
  visto   = MAPA.map(linha => Array.from(linha, () => false));   // memória: o que já foi visto (começa vazia)
  visivel = MAPA.map(linha => Array.from(linha, () => false));   // o que está à vista agora (refeito a cada quadro)
  rupias  = RUPIAS.map(([c, l]) => ({ c, l, pega: false }));
  guardas = GUARDAS.map(g => ({ x: g.c * T + T / 2, y: g.l * T + T / 2, dx: g.dx, dy: g.dy }));
  pegas = 0; aviso = 0; fim = false;
}
novoJogo();

// o jogador enxerga o tile (c, l)? Mesma ideia de veJogador: anda em linha reta, de 4 em 4 pixels,
// do jogador até o centro do tile. Se achar uma parede antes de chegar, a visão está bloqueada.
function veTile(c, l) {
  const dx = c * T + T / 2 - jogador.x, dy = l * T + T / 2 - jogador.y, d = Math.hypot(dx, dy);
  if (d > raio) return false;                                 // longe demais
  for (let s = 0; s < d; s += 4) {
    const tc = Math.floor((jogador.x + dx * s / d) / T), tl = Math.floor((jogador.y + dy * s / d) / T);
    if (tc === c && tl === l) return true;                    // chegou ao tile (se for parede, a face dela aparece)
    if (parede(tc, tl)) return false;                         // parede no caminho
  }
  return true;
}

function atualizarVisao() {
  for (let l = 0; l < LINS; l++)
    for (let c = 0; c < COLS; c++) visivel[l][c] = false;     // esquece o quadro anterior
  const jc = Math.floor(jogador.x / T), jl = Math.floor(jogador.y / T), n = Math.ceil(raio / T);
  for (let l = jl - n; l <= jl + n; l++)                      // só testa os tiles em volta (o raio cabe nesse quadrado)
    for (let c = jc - n; c <= jc + n; c++) {
      if (!dentro(c, l)) continue;
      if (veTile(c, l)) { visivel[l][c] = true; visto[l][c] = true; }   // visto nunca volta a false
    }
}

// o quadrado do jogador, centrado em (x, y), cabe aqui? Confere todos os tiles que ele cobre.
const livre = (x, y) => {
  const c0 = Math.floor((x - M) / T), c1 = Math.ceil((x + M) / T) - 1;
  const l0 = Math.floor((y - M) / T), l1 = Math.ceil((y + M) / T) - 1;
  for (let l = l0; l <= l1; l++)
    for (let c = c0; c <= c1; c++) if (parede(c, l)) return false;
  return true;
};

loop((dt) => {
  const apertou = (k) => keys[k] && !antes[k];
  if (apertou('r')) novoJogo();
  if (fim && apertou('Enter')) novoJogo();

  if (!fim) {
    let dx = 0, dy = 0;
    if (keys.ArrowLeft  || keys.a) dx -= 1;
    if (keys.ArrowRight || keys.d) dx += 1;
    if (keys.ArrowUp    || keys.w) dy -= 1;
    if (keys.ArrowDown  || keys.s) dy += 1;
    // anda um eixo por vez. Se bater, encosta na parede certinho
    if (dx) {
      jogador.x += dx * 100 * dt;
      if (!livre(jogador.x, jogador.y))
        jogador.x = dx > 0 ? Math.floor((jogador.x + M) / T) * T - M          // encosta na face esquerda do tile
                           : (Math.floor((jogador.x - M) / T) + 1) * T + M;   // encosta na face direita do tile
    }
    if (dy) {
      jogador.y += dy * 100 * dt;
      if (!livre(jogador.x, jogador.y))
        jogador.y = dy > 0 ? Math.floor((jogador.y + M) / T) * T - M          // encosta na face de cima do tile
                           : (Math.floor((jogador.y - M) / T) + 1) * T + M;   // encosta na face de baixo do tile
    }

    rupias.forEach(r => {
      if (!r.pega && Math.hypot(r.c * T + T / 2 - jogador.x, r.l * T + T / 2 - jogador.y) < 11) { r.pega = true; pegas++; }
    });

    // guardas: andam em linha reta e dão meia-volta quando vão bater numa parede
    guardas.forEach(g => {
      const passo = 45 * dt;
      if (parede(Math.floor((g.x + g.dx * (passo + 7)) / T), Math.floor((g.y + g.dy * (passo + 7)) / T))) { g.dx = -g.dx; g.dy = -g.dy; }
      else { g.x += g.dx * passo; g.y += g.dy * passo; }
      if (Math.hypot(g.x - jogador.x, g.y - jogador.y) < 12) { voltarAoInicio(); aviso = 1.5; }
    });
    if (pegas === rupias.length) fim = true;
  }
  aviso -= dt;
  atualizarVisao();

  // ---------- desenho ----------
  const k = ctx.getTransform().a;                             // alinha as bordas ao pixel real (sem fios entre tiles)
  const px = (v) => Math.round(v * k) / k;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);           // o que nunca foi visto fica preto
  let vistos = 0, chao = 0;
  for (let l = 0; l < LINS; l++)
    for (let c = 0; c < COLS; c++) {
      if (!parede(c, l)) { chao++; if (visto[l][c]) vistos++; }
      if (!visto[l][c]) continue;                             // nunca visto: nem desenha
      const x0 = px(c * T), x1 = px((c + 1) * T), y0 = px(l * T), y1 = px((l + 1) * T);
      ctx.fillStyle = parede(c, l) ? '#6a70a8' : '#4a3d68';
      ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      let escuro = 0.65;                                      // explorado, mas fora da vista: bem escuro
      if (visivel[l][c]) {                                    // à vista: escurece com a distância (lanterna)
        const d = Math.hypot(c * T + T / 2 - jogador.x, l * T + T / 2 - jogador.y) / raio;
        escuro = Math.min(0.45, 0.45 * d * d);
      }
      ctx.fillStyle = 'rgba(0, 0, 0, ' + escuro.toFixed(2) + ')';
      ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    }

  rupias.forEach(r => {                                       // rupia não se mexe: o jogo lembra dela depois de vista
    if (r.pega || !visto[r.l][r.c]) return;
    const x = r.c * T, y = r.l * T;
    ctx.globalAlpha = visivel[r.l][r.c] ? 1 : 0.45;           // lembrada, mas fora da vista: apagada
    ctx.fillStyle = '#ff4fa3'; ctx.beginPath();
    ctx.moveTo(x + 8, y + 2); ctx.lineTo(x + 12, y + 8); ctx.lineTo(x + 8, y + 14); ctx.lineTo(x + 4, y + 8);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
  guardas.forEach(g => {                                      // guarda se mexe: só aparece enquanto o tile dele está à vista
    if (!visivel[Math.floor(g.y / T)][Math.floor(g.x / T)]) return;
    ctx.fillStyle = '#e0483e'; ctx.beginPath(); ctx.arc(g.x, g.y, 6, 0, Math.PI * 2); ctx.fill();
  });
  ctx.fillStyle = '#ffd34e'; ctx.fillRect(jogador.x - M, jogador.y - M, 2 * M, 2 * M);
  ctx.fillStyle = '#1c130b'; ctx.fillRect(jogador.x + 1, jogador.y - 2, 3, 3);

  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(0, 0, W, T); ctx.fillRect(0, H - T, W, T);   // faixas atrás do texto (a borda do mapa é parede)
  ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Rupias: ' + pegas + '/' + rupias.length + '   Explorado: ' + Math.round(100 * vistos / chao) + '%', 6, 12);
  ctx.font = '10px monospace';
  ctx.fillText('Setas ou WASD: andar   R: recomeçar (a névoa volta)', 6, H - 4);
  if (aviso > 0) { ctx.fillStyle = '#ff8c82'; ctx.fillText('Guarda! De volta ao início', 300, 12); }
  if (fim) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(0, 90, W, 70);
    ctx.fillStyle = '#ffd34e'; ctx.font = '24px monospace'; ctx.textAlign = 'center'; ctx.fillText('Todas as rupias!', W / 2, 122);
    ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.fillText('Enter ou R: jogar de novo', W / 2, 146);
    ctx.textAlign = 'left';
  }

  antes = Object.assign({}, keys);
});
`},
{n:"Minimapa",t:`<p>Quando o mundo é maior que a tela, o jogador só vê um pedaço dele. O <b>minimapa</b> é o mundo inteiro em miniatura, num canto da tela, para ele saber onde está e por onde já passou. Este capítulo junta duas ideias que você já conhece: a <b>câmera</b> (o mundo tem 768 × 480 pixels e a tela só 480 × 240) e a <b>névoa de guerra</b> (o minimapa só mostra o que o jogador já viu).</p><p><b>Do mundo para o minimapa.</b> Cada tile do mapa vira um quadradinho de <code>e</code> pixels na tela. Para converter uma posição do mundo, divida por <code>T</code> (pixels viram tiles), multiplique por <code>e</code> e some o canto do minimapa: <code>mx + x / T * e</code>. É a mesma conta para o jogador, para os guardas e até para o retângulo da câmera.</p><p><b>Pintar uma vez só.</b> Redesenhar os 1440 tiles do mapa (48 × 30) a cada quadro seria trabalho à toa. Em vez disso, o minimapa é uma imagem minúscula (<code>mini</code>, 1 pixel por tile) que fica fora da tela. Quando <code>atualizarVisao</code> vê um tile pela primeira vez, pinta 1 pixel nela. A cada quadro, o jogo só <b>amplia</b> a imagem com <code>drawImage</code>, com <code>imageSmoothingEnabled = false</code> para os pixels continuarem nítidos. A imagem é a <i>memória</i> do mapa em forma de desenho.</p><p><b>O que o minimapa mostra.</b> Vale a mesma regra da névoa. O que nunca foi visto fica preto. A <b>rupia</b> fica parada, então o minimapa lembra dela depois que você a viu (ponto rosa). O <b>guarda</b> se mexe, então só aparece (vermelho) enquanto o tile dele está à vista: mostrar uma posição velha seria mentira. O <b>retângulo branco</b> é o pedaço do mundo que a câmera mostra agora, em <code>cam.x / T * e</code>, e o jogador é o ponto amarelo que pisca, graças ao relógio <code>tempo</code>.</p><p><b>Mapa grande.</b> A tecla <b>M</b> abre o mapa grande. É a <i>mesma</i> função, <code>desenharMinimapa</code>, só com outra posição e outra escala (<code>E_GRANDE = 6</code> em vez de <code>E_PEQ = 2</code>). Por isso ela recebe <code>mx</code>, <code>my</code> e <code>e</code> em vez de usar números fixos. Com o mapa grande aberto, o jogo fica parado.</p><p><b>A câmera.</b> Ela centraliza no jogador e para nas bordas do mundo (<code>atualizarCamera</code>), arredondada com <code>Math.round</code> para os tiles não tremerem. O jogo só desenha os tiles que a câmera enxerga (de <code>c0</code> a <code>c1</code> e de <code>l0</code> a <code>l1</code>) e usa <code>ctx.translate(-cam.x, -cam.y)</code> para rupias, guardas e jogador. O minimapa é desenhado <i>depois</i> do <code>restore()</code>, em coordenadas da tela, para ficar parado no canto.</p><p>Setas ou WASD andam, M abre e fecha o mapa grande e R recomeça. Pegue as 6 rupias. Se um guarda encostar em você, volta ao início, mas o que já explorou continua no mapa.</p>`,
d:"Marque o ponto de partida no minimapa com um quadradinho azul. Dica: o INICIO já está em tiles, então a conta é mais curta que a do jogador.",
c:`// Minimapa: câmera + névoa de guerra + um mapa pequeno do que já foi explorado.
// Setas ou WASD: andar   M: mapa grande   R: recomeçar
const T = 16, M = 5;                      // tile de 16 px; M = metade do jogador (ele é um quadrado de 10 × 10)
// # = parede   . = chão
const MAPA = [
  '################################################',
  '################################################',
  '################################################',
  '################################################',
  '######.......####...........######........######',
  '######.......####.........................######',
  '######......................######........######',
  '######.......####...........######........######',
  '######.......#############.#######........######',
  '########.#################.############.########',
  '########.#################.############.########',
  '####..........#########.......#########.########',
  '####..........#########.......#########.########',
  '####..........................#########.########',
  '###...........#########.......#########.########',
  '###...........#########.......####...........###',
  '###...........############...................###',
  '###...........####################...........###',
  '###.##############################...........###',
  '###.##################################.#########',
  '###.##################################.#########',
  '###.##################################.#########',
  '#......###############.........###.........#####',
  '#......###############.........###.........#####',
  '#..............................###.........#####',
  '#......###############.....................#####',
  '#......###############.........###.........#####',
  '#......###############.........###.........#####',
  '######################.........###.........#####',
  '################################################'
];
const COLS = MAPA[0].length, LINS = MAPA.length;
const MUNDO = { w: COLS * T, h: LINS * T };   // o mundo (768 × 480) é maior que a tela (480 × 240)
const INICIO = { c: 9, l: 6 };
const RUPIAS = [[39, 5], [4, 16], [27, 12], [43, 17], [2, 26], [40, 27]];
const GUARDAS = [{ c: 22, l: 5, dx: 1, dy: 0 }, { c: 39, l: 16, dx: 0, dy: 1 }, { c: 26, l: 25, dx: 1, dy: 0 }];
let raio = 6 * T;                         // alcance da visão, em pixels

const E_PEQ = 2, E_GRANDE = 6;            // pixels de tela por tile: minimapa pequeno e mapa grande
const mini = document.createElement('canvas');   // a imagem do minimapa: 1 pixel por tile, fora da tela
mini.width = COLS; mini.height = LINS;
const mctx = mini.getContext('2d');

let jogador, visto, visivel, rupias, guardas, pegas, aviso, fim, grande, vistos, chao, tempo = 0, antes = {};
const cam = { x: 0, y: 0 };

const dentro = (c, l) => c >= 0 && c < COLS && l >= 0 && l < LINS;
const parede = (c, l) => !dentro(c, l) || MAPA[l][c] === '#';

function voltarAoInicio() {
  jogador = { x: INICIO.c * T + T / 2, y: INICIO.l * T + T / 2 };
}

function novoJogo() {
  voltarAoInicio();
  visto   = MAPA.map(linha => Array.from(linha, () => false));   // memória: o que já foi visto (começa vazia)
  visivel = MAPA.map(linha => Array.from(linha, () => false));   // o que está à vista agora (refeito a cada quadro)
  rupias  = RUPIAS.map(([c, l]) => ({ c, l, pega: false }));
  guardas = GUARDAS.map(g => ({ x: g.c * T + T / 2, y: g.l * T + T / 2, dx: g.dx, dy: g.dy }));
  mctx.clearRect(0, 0, COLS, LINS);                              // o minimapa também esquece tudo
  chao = MAPA.join('').split('.').length - 1;                    // quantos tiles de chão existem
  vistos = 0; pegas = 0; aviso = 0; fim = false; grande = false;
}
novoJogo();

// o jogador enxerga o tile (c, l)? Anda em linha reta, de 4 em 4 pixels, até o centro do tile.
// Se achar uma parede antes de chegar, a visão está bloqueada.
function veTile(c, l) {
  const dx = c * T + T / 2 - jogador.x, dy = l * T + T / 2 - jogador.y, d = Math.hypot(dx, dy);
  if (d > raio) return false;                                 // longe demais
  for (let s = 0; s < d; s += 4) {
    const tc = Math.floor((jogador.x + dx * s / d) / T), tl = Math.floor((jogador.y + dy * s / d) / T);
    if (tc === c && tl === l) return true;                    // chegou ao tile (se for parede, a face dela aparece)
    if (parede(tc, tl)) return false;                         // parede no caminho
  }
  return true;
}

function atualizarVisao() {
  for (let l = 0; l < LINS; l++)
    for (let c = 0; c < COLS; c++) visivel[l][c] = false;     // esquece o quadro anterior
  const jc = Math.floor(jogador.x / T), jl = Math.floor(jogador.y / T), n = Math.ceil(raio / T);
  for (let l = jl - n; l <= jl + n; l++)                      // só testa os tiles em volta (o raio cabe nesse quadrado)
    for (let c = jc - n; c <= jc + n; c++) {
      if (!dentro(c, l) || !veTile(c, l)) continue;
      visivel[l][c] = true;
      if (!visto[l][c]) {                                     // primeira vez que este tile é visto:
        visto[l][c] = true;                                   // entra na memória...
        if (!parede(c, l)) vistos++;
        mctx.fillStyle = parede(c, l) ? '#7f86c8' : '#4a3d68';
        mctx.fillRect(c, l, 1, 1);                            // ...e ganha 1 pixel no minimapa (pintado uma vez só)
      }
    }
}

// a câmera centraliza no jogador, sem sair do mundo (como no capítulo Câmera)
function atualizarCamera() {
  cam.x = Math.round(Math.max(0, Math.min(MUNDO.w - W, jogador.x - W / 2)));
  cam.y = Math.round(Math.max(0, Math.min(MUNDO.h - H, jogador.y - H / 2)));
}

// desenha o minimapa com o canto de cima à esquerda em (mx, my). e = pixels da tela por tile.
// Do mundo para o minimapa: divide por T (pixels viram tiles) e multiplica por e.
function desenharMinimapa(mx, my, e) {
  const w = COLS * e, h = LINS * e;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.75)'; ctx.fillRect(mx - 3, my - 3, w + 6, h + 6);
  ctx.imageSmoothingEnabled = false;                          // pixels nítidos ao ampliar
  ctx.drawImage(mini, mx, my, w, h);                          // a imagem de 1 pixel por tile, ampliada
  rupias.forEach(r => {
    if (r.pega || !visto[r.l][r.c]) return;                   // rupia parada: o minimapa lembra dela depois de vista
    ctx.fillStyle = '#ff4fa3'; ctx.fillRect(mx + r.c * e, my + r.l * e, e, e);
  });
  guardas.forEach(g => {
    if (!visivel[Math.floor(g.y / T)][Math.floor(g.x / T)]) return;   // guarda se mexe: só aparece à vista
    ctx.fillStyle = '#e0483e'; ctx.fillRect(mx + g.x / T * e - e / 2, my + g.y / T * e - e / 2, e, e);
  });
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;                // o retângulo branco é o pedaço que a câmera mostra
  ctx.strokeRect(mx + cam.x / T * e + 0.5, my + cam.y / T * e + 0.5, W / T * e - 1, H / T * e - 1);
  if (Math.floor(tempo * 3) % 2 === 0) {                      // o jogador pisca, 3 vezes por segundo
    const d = Math.max(3, e);
    ctx.fillStyle = '#ffd34e'; ctx.fillRect(mx + jogador.x / T * e - d / 2, my + jogador.y / T * e - d / 2, d, d);
  }
}

// o quadrado do jogador, centrado em (x, y), cabe aqui? Confere todos os tiles que ele cobre.
const livre = (x, y) => {
  const c0 = Math.floor((x - M) / T), c1 = Math.ceil((x + M) / T) - 1;
  const l0 = Math.floor((y - M) / T), l1 = Math.ceil((y + M) / T) - 1;
  for (let l = l0; l <= l1; l++)
    for (let c = c0; c <= c1; c++) if (parede(c, l)) return false;
  return true;
};

loop((dt) => {
  const apertou = (k) => keys[k] && !antes[k];
  tempo += dt;
  if (apertou('r')) novoJogo();
  if (fim && apertou('Enter')) novoJogo();
  if (apertou('m')) grande = !grande;                         // abre e fecha o mapa grande

  if (!fim && !grande) {                                      // com o mapa grande aberto, o jogo fica parado
    let dx = 0, dy = 0;
    if (keys.ArrowLeft  || keys.a) dx -= 1;
    if (keys.ArrowRight || keys.d) dx += 1;
    if (keys.ArrowUp    || keys.w) dy -= 1;
    if (keys.ArrowDown  || keys.s) dy += 1;
    // anda um eixo por vez. Se bater, encosta na parede certinho
    if (dx) {
      jogador.x += dx * 100 * dt;
      if (!livre(jogador.x, jogador.y))
        jogador.x = dx > 0 ? Math.floor((jogador.x + M) / T) * T - M          // encosta na face esquerda do tile
                           : (Math.floor((jogador.x - M) / T) + 1) * T + M;   // encosta na face direita do tile
    }
    if (dy) {
      jogador.y += dy * 100 * dt;
      if (!livre(jogador.x, jogador.y))
        jogador.y = dy > 0 ? Math.floor((jogador.y + M) / T) * T - M          // encosta na face de cima do tile
                           : (Math.floor((jogador.y - M) / T) + 1) * T + M;   // encosta na face de baixo do tile
    }

    rupias.forEach(r => {
      if (!r.pega && Math.hypot(r.c * T + T / 2 - jogador.x, r.l * T + T / 2 - jogador.y) < 11) { r.pega = true; pegas++; }
    });

    // guardas: andam em linha reta e dão meia-volta quando vão bater numa parede
    guardas.forEach(g => {
      const passo = 45 * dt;
      if (parede(Math.floor((g.x + g.dx * (passo + 7)) / T), Math.floor((g.y + g.dy * (passo + 7)) / T))) { g.dx = -g.dx; g.dy = -g.dy; }
      else { g.x += g.dx * passo; g.y += g.dy * passo; }
      if (Math.hypot(g.x - jogador.x, g.y - jogador.y) < 12) { voltarAoInicio(); aviso = 1.5; }
    });
    if (pegas === rupias.length) fim = true;
  }
  aviso -= dt;
  atualizarVisao();
  atualizarCamera();

  // ---------- desenho ----------
  const k = ctx.getTransform().a;                             // alinha as bordas ao pixel real (sem fios entre tiles)
  const px = (v) => Math.round(v * k) / k;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);           // o que nunca foi visto fica preto
  const c0 = Math.floor(cam.x / T), c1 = Math.min(COLS - 1, Math.floor((cam.x + W) / T));   // só os tiles que a câmera mostra
  const l0 = Math.floor(cam.y / T), l1 = Math.min(LINS - 1, Math.floor((cam.y + H) / T));
  for (let l = l0; l <= l1; l++)
    for (let c = c0; c <= c1; c++) {
      if (!visto[l][c]) continue;                             // nunca visto: nem desenha
      const x0 = px(c * T - cam.x), x1 = px((c + 1) * T - cam.x), y0 = px(l * T - cam.y), y1 = px((l + 1) * T - cam.y);
      ctx.fillStyle = parede(c, l) ? '#6a70a8' : '#4a3d68';
      ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      let escuro = 0.65;                                      // explorado, mas fora da vista: bem escuro
      if (visivel[l][c]) {                                    // à vista: escurece com a distância (lanterna)
        const d = Math.hypot(c * T + T / 2 - jogador.x, l * T + T / 2 - jogador.y) / raio;
        escuro = Math.min(0.45, 0.45 * d * d);
      }
      ctx.fillStyle = 'rgba(0, 0, 0, ' + escuro.toFixed(2) + ')';
      ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    }

  ctx.save();
  ctx.translate(-cam.x, -cam.y);                              // daqui até o restore(), as coordenadas são as do mundo
  rupias.forEach(r => {                                       // rupia não se mexe: o jogo lembra dela depois de vista
    if (r.pega || !visto[r.l][r.c]) return;
    const x = r.c * T, y = r.l * T;
    ctx.globalAlpha = visivel[r.l][r.c] ? 1 : 0.45;           // lembrada, mas fora da vista: apagada
    ctx.fillStyle = '#ff4fa3'; ctx.beginPath();
    ctx.moveTo(x + 8, y + 2); ctx.lineTo(x + 12, y + 8); ctx.lineTo(x + 8, y + 14); ctx.lineTo(x + 4, y + 8);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
  guardas.forEach(g => {                                      // guarda se mexe: só aparece enquanto o tile dele está à vista
    if (!visivel[Math.floor(g.y / T)][Math.floor(g.x / T)]) return;
    ctx.fillStyle = '#e0483e'; ctx.beginPath(); ctx.arc(g.x, g.y, 6, 0, Math.PI * 2); ctx.fill();
  });
  ctx.fillStyle = '#ffd34e'; ctx.fillRect(jogador.x - M, jogador.y - M, 2 * M, 2 * M);
  ctx.fillStyle = '#1c130b'; ctx.fillRect(jogador.x + 1, jogador.y - 2, 3, 3);
  ctx.restore();

  // o minimapa vai por último, em coordenadas da tela (fora da translação da câmera)
  if (grande) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(0, 0, W, H);          // escurece o jogo por trás
    desenharMinimapa((W - COLS * E_GRANDE) / 2, (H - LINS * E_GRANDE) / 2, E_GRANDE);
  } else {
    desenharMinimapa(W - COLS * E_PEQ - 8, 8, E_PEQ);
  }

  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(0, 0, 190, 18); ctx.fillRect(0, H - 16, W, 16);   // faixas atrás do texto
  ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Rupias: ' + pegas + '/' + rupias.length + '   Explorado: ' + Math.round(100 * vistos / chao) + '%', 6, 13);
  ctx.font = '10px monospace';
  ctx.fillText(grande ? 'Rosa: rupia  Vermelho: guarda  Branco: câmera   M: fechar'
                      : 'Setas ou WASD: andar   M: mapa grande   R: recomeçar', 6, H - 5);
  if (aviso > 0) { ctx.fillStyle = '#ff8c82'; ctx.fillText('Guarda! De volta ao início', 6, 32); }
  if (fim) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(0, 90, W, 70);
    ctx.fillStyle = '#ffd34e'; ctx.font = '24px monospace'; ctx.textAlign = 'center'; ctx.fillText('Todas as rupias!', W / 2, 122);
    ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.fillText('Enter ou R: jogar de novo', W / 2, 146);
    ctx.textAlign = 'left';
  }

  antes = Object.assign({}, keys);
});
`},
{n:"Raycasting",t:`<p>Wolfenstein 3D (1992) parece 3D, mas por dentro é só um <b>mapa em grade</b>, como os dos capítulos anteriores, visto de dentro. Para cada coluna da tela, o jogo lança um <b>raio</b> a partir do jogador e descobre em que parede ele bate. Parede perto vira uma faixa alta, parede longe vira uma faixa baixa. Essa técnica se chama <b>raycasting</b>, e ela junta o mapa de texto, a visão da névoa de guerra e o minimapa.</p><p><b>1. Um raio por coluna.</b> A tela tem 480 colunas, então são 480 raios, espalhados dentro do campo de visão (<code>FOV</code>, 60 graus). O ângulo de cada raio é o ângulo do olhar mais um desvio, calculado com <code>Math.atan</code> para que as colunas fiquem igualmente espaçadas na tela.</p><p><b>2. DDA: saltar de linha em linha.</b> Na névoa de guerra, o raio andava aos pouquinhos. Aqui o algoritmo <b>DDA</b> salta direto para a próxima linha da grade, vertical ou horizontal, sempre a mais próxima, até cair numa casa de parede. É exato e rápido: poucos saltos por raio. O resultado é a distância <code>dist</code>, o lado que foi atingido (<code>lado</code>) e <i>onde</i> na parede o raio bateu (<code>t</code>, de 0 a 1).</p><p><b>3. Altura = 1 / distância.</b> A faixa de cada coluna tem altura <code>H / perp</code>, centrada na tela. Para evitar o <b>olho de peixe</b> (paredes retas que parecem curvas), usamos a distância <i>perpendicular</i>: <code>dist * Math.cos(desvio)</code>. Aperte <b>F</b> para desligar a correção e ver o efeito. Para dar profundidade, a cor escurece com a distância, e as paredes de lado ficam mais escuras que as de frente.</p><p><b>4. Sprites com atan2.</b> As rupias não são paredes: são desenhadas como cartazes que sempre encaram o jogador (<i>billboards</i>). Com <code>Math.atan2(dy, dx)</code> achamos o ângulo da rupia, subtraímos o do olhar e descobrimos em que coluna ela aparece. O tamanho também é proporcional a 1 / distância. Antes de desenhar, olhamos <code>profund[x]</code> (guardado ao desenhar as paredes) e separamos as colunas em que não há parede na frente: é o <i>z-buffer</i> mais simples possível. Com <code>clip()</code>, só essas colunas ficam liberadas, e a rupia é desenhada <b>inteira</b>, como uma figura de verdade (um hexágono feito com <code>beginPath</code>, <code>lineTo</code> e <code>fill</code>). Assim as bordas ficam suaves: montar a figura coluna por coluna deixava um degrau do tamanho de uma coluna em cada borda inclinada. E desenhamos do mais longe ao mais perto, para o de perto cobrir o de longe.</p><p><b>5. O minimapa.</b> No canto, o mapa visto de cima mostra o jogador e os raios (a cada 20 colunas, até onde bateram). Repare como o mesmo mapa de texto serve aos dois mundos.</p><p>Setas ou WASD giram e andam, Q e E andam de lado, M liga e desliga o minimapa, F liga e desliga a correção do olho de peixe e R recomeça. Pegue as 6 rupias.</p>`,
d:"Dê textura às paredes. Use <code>r.t</code> (a posição ao longo da parede, de 0 a 1) para fazer listras verticais: escureça as faixas em que <code>Math.floor(r.t * 4)</code> é ímpar.",
c:`// Raycasting: um "3D de mentira" a partir de um mapa em grade (como em Wolfenstein 3D).
// ← → ou A D: girar   ↑ ↓ ou W S: andar   Q E: andar de lado   M: minimapa   F: olho de peixe   R: recomeçar
// # = parede   . = chão
const MAPA = [
  '####################',
  '#..................#',
  '#.....#....#...#####',
  '#.....#....#.......#',
  '#.#...#.....#..#...#',
  '#........#.....#...#',
  '#..............###.#',
  '#........#.....#...#',
  '#.......##.........#',
  '#.......##.........#',
  '#.....###.......####',
  '#......##..........#',
  '#......#...........#',
  '####################'
];
const COLS = MAPA[0].length, LINS = MAPA.length;
const RUPIAS = [[18, 12], [13, 10], [18, 5], [8, 12], [15, 1], [10, 6]];
const FOV = Math.PI / 3;                  // campo de visão: 60 graus
const VISAO = 14;                         // distância em que a parede já está bem escura

let jogador, rupias, pegas, profund, raios, mapaLigado = true, corrige = true, antes = {};
profund = new Array(W).fill(0);           // distância da parede em cada coluna (usada para esconder sprites)
raios = new Array(W).fill(null);          // onde cada raio bateu (usado no minimapa)

const parede = (c, l) => c < 0 || l < 0 || c >= COLS || l >= LINS || MAPA[l][c] === '#';

function novoJogo() {
  jogador = { x: 2.5, y: 1.5, a: 0.5 };   // posição em TILES (não em pixels) e ângulo do olhar, em radianos
  rupias = RUPIAS.map(([c, l]) => ({ x: c + 0.5, y: l + 0.5, pega: false }));
  pegas = 0;
}
novoJogo();

// Lança UM raio a partir do jogador, no ângulo 'ang', e acha a parede em que ele bate.
// DDA: em vez de andar aos pouquinhos, salta de linha em linha da grade, sempre pela mais próxima.
function lancarRaio(ang) {
  const rx = Math.cos(ang), ry = Math.sin(ang);
  let mc = Math.floor(jogador.x), ml = Math.floor(jogador.y);     // casa em que o raio está
  const dx = Math.abs(1 / rx), dy = Math.abs(1 / ry);             // distância percorrida para cruzar 1 casa em x (ou em y)
  const sx = rx < 0 ? -1 : 1, sy = ry < 0 ? -1 : 1;               // para que lado o raio anda
  let lx = (rx < 0 ? jogador.x - mc : mc + 1 - jogador.x) * dx;   // distância até a 1ª linha vertical da grade
  let ly = (ry < 0 ? jogador.y - ml : ml + 1 - jogador.y) * dy;   // distância até a 1ª linha horizontal da grade
  let lado = 0;                                                    // 0 = bateu numa parede vertical, 1 = horizontal
  while (!parede(mc, ml)) {
    if (lx < ly) { lx += dx; mc += sx; lado = 0; }                 // a linha vertical está mais perto: salta para ela
    else         { ly += dy; ml += sy; lado = 1; }                 // a horizontal está mais perto
  }
  const dist = lado === 0 ? lx - dx : ly - dy;                     // distância até o ponto em que bateu
  const hx = jogador.x + rx * dist, hy = jogador.y + ry * dist;    // o ponto da batida
  const t = lado === 0 ? hy - Math.floor(hy) : hx - Math.floor(hx);   // onde, ao longo da parede, bateu (0 a 1)
  return { dist, lado, t, hx, hy };
}

// tenta andar (vx, vy); cada eixo separado, para deslizar na parede em vez de grudar
const andar = (vx, vy) => {
  const m = 0.2;                                                   // folga: o jogador é um círculo de raio 0,2
  if (!parede(Math.floor(jogador.x + vx + Math.sign(vx) * m), Math.floor(jogador.y))) jogador.x += vx;
  if (!parede(Math.floor(jogador.x), Math.floor(jogador.y + vy + Math.sign(vy) * m))) jogador.y += vy;
};

// Uma rupia: hexágono alongado desenhado como um CAMINHO (beginPath, lineTo, fill).
// Como é uma figura inteira, e não uma pilha de colunas, o canvas suaviza as bordas sozinho.
function gema(cx, cy, tam) {
  const a = tam * 0.32, b = tam * 0.5;                              // meia largura e meia altura
  const contorno = (pontos) => {                                    // cada ponto é [fx, fy], de -1 a 1, a partir do centro
    ctx.beginPath();
    pontos.forEach(([fx, fy], i) => {
      if (i === 0) ctx.moveTo(cx + fx * a, cy + fy * b);
      else ctx.lineTo(cx + fx * a, cy + fy * b);
    });
    ctx.closePath();
  };
  const hexagono = [[0, -1], [1, -0.45], [1, 0.45], [0, 1], [-1, 0.45], [-1, -0.45]];
  contorno(hexagono);                                               // base
  ctx.fillStyle = '#ff4fa3'; ctx.fill();
  contorno([[0, -1], [-1, -0.45], [-1, 0.45], [0, 1]]);             // metade esquerda: face clara
  ctx.fillStyle = '#ff8cc6'; ctx.fill();
  contorno([[0, -1], [1, -0.45], [1, 0.45], [0, 1]]);               // metade direita: face escura
  ctx.fillStyle = '#d6347f'; ctx.fill();
  contorno(hexagono);                                               // borda fina e clara
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)'; ctx.lineWidth = Math.max(1, tam * 0.03); ctx.lineJoin = 'round'; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 0.55 * a, cy - 0.3 * b); ctx.lineTo(cx - 0.55 * a, cy + 0.2 * b);   // brilho
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; ctx.lineWidth = Math.max(1, tam * 0.05); ctx.lineCap = 'round'; ctx.stroke();
}

loop((dt) => {
  const apertou = (k) => keys[k] && !antes[k];
  if (apertou('r')) novoJogo();
  if (apertou('m')) mapaLigado = !mapaLigado;
  if (apertou('f')) corrige = !corrige;

  // ---------- movimento ----------
  if (keys.ArrowLeft  || keys.a) jogador.a -= 2.2 * dt;            // girar (o ângulo cresce no sentido horário)
  if (keys.ArrowRight || keys.d) jogador.a += 2.2 * dt;
  const frente = (keys.ArrowUp ? 1 : 0) + (keys.w ? 1 : 0) - (keys.ArrowDown ? 1 : 0) - (keys.s ? 1 : 0);
  const lado = (keys.e ? 1 : 0) - (keys.q ? 1 : 0);
  const v = 3 * dt;                                                // 3 tiles por segundo
  andar(Math.cos(jogador.a) * frente * v - Math.sin(jogador.a) * lado * v,
        Math.sin(jogador.a) * frente * v + Math.cos(jogador.a) * lado * v);
  rupias.forEach(r => {
    if (!r.pega && Math.hypot(r.x - jogador.x, r.y - jogador.y) < 0.5) { r.pega = true; pegas++; }
  });

  // ---------- desenho ----------
  const k = ctx.getTransform().a;                                  // alinha as bordas ao pixel real (sem fios entre colunas)
  const px = (n) => Math.round(n * k) / k;
  ctx.fillStyle = '#1b1530'; ctx.fillRect(0, 0, W, H / 2);         // teto
  ctx.fillStyle = '#3a3040'; ctx.fillRect(0, H / 2, W, H / 2);     // chão

  for (let x = 0; x < W; x++) {                                    // UM RAIO PARA CADA COLUNA DA TELA
    const desvio = Math.atan((2 * x / W - 1) * Math.tan(FOV / 2)); // ângulo desta coluna em relação ao olhar
    const r = lancarRaio(jogador.a + desvio);
    const perp = corrige ? r.dist * Math.cos(desvio) : r.dist;     // distância "reta": corrige o olho de peixe
    profund[x] = perp; raios[x] = r;
    const altura = H / perp;                                       // perto = faixa alta, longe = faixa baixa
    // longe escurece; as paredes de lado (leste e oeste) ficam mais escuras que as de frente
    let brilho = Math.max(0.15, 1 - perp / VISAO) * (r.lado ? 0.7 : 1);
    ctx.fillStyle = 'rgb(' + Math.round(200 * brilho) + ',' + Math.round(115 * brilho) + ',' + Math.round(85 * brilho) + ')';
    ctx.fillRect(px(x), (H - altura) / 2, px(x + 1) - px(x), altura);
  }

  // ---------- sprites: as rupias são cartazes que sempre encaram o jogador ----------
  const visiveis = [];
  rupias.forEach(r => {
    if (r.pega) return;
    const dx = r.x - jogador.x, dy = r.y - jogador.y;
    let ang = Math.atan2(dy, dx) - jogador.a;                      // ângulo da rupia em relação ao olhar
    while (ang > Math.PI) ang -= 2 * Math.PI;                      // deixa entre -180 e 180 graus
    while (ang < -Math.PI) ang += 2 * Math.PI;
    if (Math.abs(ang) < FOV / 2 + 0.3) visiveis.push({ ang, dist: Math.hypot(dx, dy) });
  });
  visiveis.sort((a, b) => b.dist - a.dist);                        // do mais longe ao mais perto (os de perto cobrem os de longe)
  visiveis.forEach(s => {
    const perp = s.dist * Math.cos(s.ang);                         // distância "reta", como nas paredes
    if (perp < 0.2) return;
    const cx = W / 2 + Math.tan(s.ang) / Math.tan(FOV / 2) * W / 2;   // coluna do centro da rupia
    const tam = H / perp * 0.4;                                    // também diminui com a distância
    const cy = H / 2 + H / perp * 0.2;                             // um pouco abaixo do horizonte: perto do chão
    ctx.save();
    ctx.beginPath();                                               // área de recorte: só as colunas SEM parede na frente
    for (let x = Math.max(0, Math.floor(cx - tam / 2)); x <= Math.min(W - 1, cx + tam / 2); x++)
      if (profund[x] >= perp) ctx.rect(px(x), 0, px(x + 1) - px(x), H);
    ctx.clip();                                                    // daqui em diante, só aparece o que cair nessas colunas
    gema(cx, cy, tam);                                             // a figura é desenhada inteira, de uma vez só
    ctx.restore();
  });

  // ---------- minimapa: o mesmo mapa de texto, visto de cima ----------
  if (mapaLigado) {
    const e = 4, mx = W - COLS * e - 8, my = 8;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(mx - 3, my - 3, COLS * e + 6, LINS * e + 6);
    for (let l = 0; l < LINS; l++)
      for (let c = 0; c < COLS; c++) {
        ctx.fillStyle = MAPA[l][c] === '#' ? '#6a70a8' : '#4a3d68';
        ctx.fillRect(mx + c * e, my + l * e, e, e);
      }
    ctx.fillStyle = '#ff4fa3';
    rupias.forEach(r => { if (!r.pega) ctx.fillRect(mx + r.x * e - 1, my + r.y * e - 1, 3, 3); });
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x < W; x += 20) {                              // um raio a cada 20 colunas, até onde bateu
      ctx.moveTo(mx + jogador.x * e, my + jogador.y * e);
      ctx.lineTo(mx + raios[x].hx * e, my + raios[x].hy * e);
    }
    ctx.stroke();
    ctx.fillStyle = '#ffd34e'; ctx.fillRect(mx + jogador.x * e - 2, my + jogador.y * e - 2, 4, 4);
  }

  // ---------- texto ----------
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(0, 0, 130, 18); ctx.fillRect(0, H - 16, W, 16);
  ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Rupias: ' + pegas + '/' + rupias.length, 6, 13);
  ctx.font = '10px monospace';
  ctx.fillText('WASD/setas   Q E: de lado   M: minimapa   F: olho de peixe ' + (corrige ? '(corrigido)' : '(DESLIGADO)'), 6, H - 5);
  if (pegas === rupias.length) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(0, 90, W, 60);
    ctx.fillStyle = '#ffd34e'; ctx.font = '22px monospace'; ctx.textAlign = 'center'; ctx.fillText('Todas as rupias!', W / 2, 126);
    ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.fillText('R: jogar de novo', W / 2, 142);
    ctx.textAlign = 'left';
  }

  antes = Object.assign({}, keys);
});
`},
{n:"Luz e sombras",t:`<p>Na <b>Névoa de guerra</b> o escuro era uma regra do mapa: cada tile estava visível ou não. Aqui o escuro vira <b>luz de verdade</b>: tochas que iluminam em volta, paredes e caixotes que projetam <b>sombras</b>, chamas que tremem e cores que se misturam. É o efeito que mais muda a cara de um jogo, e ele se faz com o que você já conhece: o raio com <b>DDA</b> do Raycasting e as camadas do canvas. E o mapa é bem maior que a tela (60 × 34 tiles), com uma <b>câmera</b> que segue o jogador, como nos capítulos Câmera e Minimapa.</p><p><b>1. Luz é visão.</b> Uma tocha ilumina exatamente o que ela enxerga: se um ponto é visível a partir dela, está iluminado; se uma parede atrapalha, está na sombra. É o mesmo problema da névoa, só que contínuo, em vez de tile por tile.</p><p><b>2. Raios em volta.</b> A função <code>lancar</code> é o DDA do Raycasting, agora em pixels: sai da tocha num ângulo e salta de linha em linha da grade até entrar numa parede (<code>solido</code>) ou chegar ao <code>alcance</code>. Cada amostra de luz (veja o passo 6) lança <code>RAIOS</code> = 360 raios, um por grau.</p><p><b>3. O polígono de luz.</b> Os pontos onde os raios pararam, ligados em ordem, desenham o contorno da área que a tocha enxerga (<code>contorno</code>). Num salão aberto ele é um círculo; atrás de uma pilastra ele ganha um &quot;dente&quot; escuro: a sombra. A constante <code>PENETRA</code> faz o raio entrar 4 px na parede, e assim a face da parede também aparece iluminada.</p><p><b>4. O mapa de luz.</b> Num canvas fora da tela, do tamanho da <b>tela</b> (e não do mapa inteiro), começamos pintando o <b>ambiente</b>, a luz mínima, azulada. Depois cada luz entra com o seu polígono preenchido por um <b>gradiente radial</b>: a cor da chama no centro e transparente na borda. Com <code>globalCompositeOperation = 'lighter'</code> as cores se <b>somam</b>: duas tochas juntas iluminam mais, e uma tocha laranja perto do cristal azul mistura as cores.</p><p><b>5. Multiplicar.</b> A cena é desenhada normalmente e, por cima, entra o mapa de luz com <code>'multiply'</code>: cada pixel da cena é multiplicado pela luz daquele ponto. Luz branca deixa a cena como está, luz preta apaga, luz laranja tinge de laranja. Uma passada fraca com <code>'screen'</code> (<code>BRILHO</code>) dá o clarão em volta das chamas. As chamas e as fagulhas são desenhadas <i>depois</i>, para não serem escurecidas.</p><p><b>6. Sombra suave.</b> Fogo não é um ponto. Cada luz é desenhada <code>SUAVE</code> vezes, a partir de pontos um pouquinho diferentes ao redor do centro (<code>TAM_FOGO</code>), cada uma com 1/<code>SUAVE</code> da força. Onde as amostras concordam, a luz é inteira; onde discordam, na borda da sombra, nasce a <b>penumbra</b>. Troque <code>SUAVE</code> por 1 e a sombra fica dura.</p><p><b>7. Tremor.</b> O raio de cada luz muda um pouco a cada quadro, seguindo a soma de três senos com períodos diferentes (<code>tremor</code>), e por isso a chama parece viva sem se repetir de um jeito óbvio. Cada tocha tem a sua <code>fase</code>, para não tremerem todas juntas.</p><p><b>8. Mapa maior, com câmera.</b> O mundo tem 960 × 544 pixels, e a tela só 480 × 240. A <b>câmera</b> (<code>cam</code>) centraliza no jogador e para nas bordas do mapa; o <code>Math.round</code> faz a cena e a luz andarem juntas, sem tremer. A cena é desenhada com <code>ctx.translate(-cam.x, -cam.y)</code> e só nos tiles que a câmera mostra. O mapa de luz continua com o tamanho da tela: antes de desenhar as luzes, <code>lc.setTransform(1, 0, 0, 1, -cam.x, -cam.y)</code> desloca a origem, e assim <code>acender</code> usa as mesmas coordenadas do mundo de sempre. Como o mouse está em coordenadas da tela, o clique soma <code>cam</code> para achar o tile. E só as luzes que chegam à tela (<code>alcanca</code>) entram nas contas: o número no canto da tela mostra quantas são.</p>
<p>O custo é raios × amostras × luzes: cada luz faz <code>RAIOS</code> × <code>SUAVE</code> = 1080 raios por quadro. O mapa tem 15 luzes, e ainda há a do jogador, mas só as que chegam à tela são calculadas, em geral de 7 a 11, ou seja, de 7 a 12 mil raios por quadro. Isso quase não depende do tamanho do mapa, e ainda é leve, porque o DDA só dá alguns saltos por raio. Use as setas ou WASD para andar (a câmera acompanha), clique no chão para pôr uma tocha (ou numa tocha para apagá-la), Espaço apaga e acende a sua, G mostra os raios e N troca a noite pelo crepúsculo.</p>`,
d:"Transforme a tocha do jogador numa lanterna: em vez de iluminar em volta, ela ilumina só um cone de uns 70 graus, na direção em que o jogador anda.",
c:`// Luz e sombras 2D: tochas iluminam o que enxergam, e o resto fica no escuro.
// O mapa é bem maior que a tela, e uma câmera segue o jogador.
// ← ↑ ↓ → ou WASD: andar   Clique: põe ou tira uma tocha   Espaço: apaga ou acende a sua tocha
// G: mostra os raios   N: noite ou crepúsculo
const T = 16;                             // tamanho de cada tile, em pixels
const RAIOS = 360;                        // raios lançados por cada luz (um por grau)
const SUAVE = 3;                          // amostras por luz: 1 = sombra dura, 3 ou mais = sombra suave
const TAM_FOGO = 3;                       // tamanho do "fogo" em pixels: quanto maior, mais macia a sombra
const PENETRA = 4;                        // a luz entra 4 px na parede, para a face dela aparecer iluminada
const BRILHO = 0.3;                       // brilho extra por cima da cena
const MAX_TOCHAS = 24;
const VEL = 80;                           // pixels por segundo

// # parede   c caixote   . chão   (parede e caixote bloqueiam a luz e o jogador)
const MAPA = [
  '############################################################',
  '#..................##..................##..................#',
  '#...............c......................##..................#',
  '#...............c..........................................#',
  '#............##.......cc...................................#',
  '#............##....##.........................######....c..#',
  '#..................##...........##.....##.....#............#',
  '#............##....##...........##.....##.....#.......c....#',
  '#............##....##..................##.....#............#',
  '#......c..c........##...............cc.##............##....#',
  '#.........c........##.........##.cc....##............##....#',
  '#..................##.........##.cc....##.c......##........#',
  '#..................##..................##........##.....c..#',
  '#..................##..................##.....c.........c..#',
  '#..................##..................##.....c............#',
  '#..................##..................##..................#',
  '####...#####################...##############...############',
  '####...#####################...##############...############',
  '#..................##..................##..................#',
  '#..................##..................##..................#',
  '#..................##..................##..................#',
  '#..................##..................##...##..######.....#',
  '#...c..............##...##........c....##...##..#..........#',
  '#...c..............##...##..##..................#.......c..#',
  '#.c.....##...##....##.......##..................#..........#',
  '#...##..##...##....##......................................#',
  '#...##.............##...##.............##..................#',
  '#..................##...##.............##........c.........#',
  '#..................##.......c..........##........c.....cc..#',
  '#......................................##...........c..cc..#',
  '#...............cc............cc.......##..................#',
  '#...............cc.....................##..................#',
  '#..................##..................##..................#',
  '############################################################'
];
const COLS = MAPA[0].length, LINS = MAPA.length;   // 60 × 34 tiles = 960 × 544 pixels: bem maior que a tela (480 × 240)
const AMBIENTE = { noite: '#14142b', crepusculo: '#4a4a78' };   // a luz mínima: o que nenhuma tocha alcança
const TOCHAS = [[18, 14], [1, 8], [21, 14], [38, 1], [57, 1], [41, 7], [1, 22], [15, 18], [25, 18], [38, 27], [53, 18], [44, 18]];
const CRISTAIS = [[24, 8], [16, 28], [53, 27]];               // luz azul: não é fogo, então não treme nem solta fagulhas

const solido = (c, l) => c < 0 || l < 0 || c >= COLS || l >= LINS || MAPA[l][c] === '#' || MAPA[l][c] === 'c';

// O mapa de luz: um canvas fora da tela, do tamanho da TELA (e não do mapa inteiro). Cada luz é desenhada nele,
// com a origem deslocada pela câmera, e no fim ele é multiplicado pela cena.
const mapaLuz = document.createElement('canvas');
mapaLuz.width = W; mapaLuz.height = H;
const lc = mapaLuz.getContext('2d');

const jog = { x: 4.5 * T, y: 8.5 * T, dx: 1, dy: 0, tocha: true };
const luzJog = { raio: 130, cor: [255, 205, 130], fase: 0, fogo: true };      // a tocha que o jogador carrega
let luzes = [], fagulhas = [], noite = true, mostrarRaios = false, antes = {}, antesClique = false, tempo = 0;

function iniciarLuzes() {
  luzes = TOCHAS.map(([c, l], i) => ({ x: c * T + T / 2, y: l * T + T / 2, raio: 110, cor: [255, 185, 100], fase: i * 1.7, fogo: true }));
  CRISTAIS.forEach(([c, l]) => luzes.push({ x: c * T + T / 2, y: l * T + T / 2, raio: 95, cor: [70, 150, 255], fase: 0, fogo: false }));
}
iniciarLuzes();

// A câmera: a tela mostra um pedaço do mapa, e (cam.x, cam.y) é o canto de cima à esquerda desse pedaço, em pixels do mundo.
const cam = { x: 0, y: 0 };
function atualizarCamera() {              // centraliza no jogador, sem sair do mapa (como no capítulo Câmera)
  cam.x = Math.round(Math.max(0, Math.min(COLS * T - W, jog.x - W / 2)));   // Math.round: a cena e a luz andam juntas, sem tremer
  cam.y = Math.round(Math.max(0, Math.min(LINS * T - H, jog.y - H / 2)));
}
// Só as luzes que chegam à tela entram nas contas (mapa de luz, raios, chamas, fagulhas). O 1.1 deixa uma sobra para o tremor.
const alcanca = (L) => L.x + L.raio * 1.1 > cam.x && L.x - L.raio * 1.1 < cam.x + W && L.y + L.raio * 1.1 > cam.y && L.y - L.raio * 1.1 < cam.y + H;

// O tremor da chama: três senos com períodos diferentes nunca se repetem de um jeito óbvio.
const tremor = (t, f) => 0.035 * Math.sin(t * 11 + f) + 0.025 * Math.sin(t * 27 + f * 2.3) + 0.03 * Math.sin(t * 5 + f * 4.1);

// Lança UM raio a partir de (x, y), em pixels, e devolve a distância até a primeira parede (ou até o alcance).
// É o DDA do Raycasting, só que em pixels: salta de linha em linha da grade, sempre pela mais próxima.
function lancar(x, y, ang, alcance) {
  const rx = Math.cos(ang), ry = Math.sin(ang);
  let c = Math.floor(x / T), l = Math.floor(y / T);
  const dx = Math.abs(T / rx), dy = Math.abs(T / ry);               // pixels andados para cruzar 1 casa em x (ou em y)
  const sx = rx < 0 ? -1 : 1, sy = ry < 0 ? -1 : 1;
  let lx = (rx < 0 ? x - c * T : (c + 1) * T - x) / Math.abs(rx);   // distância até a 1ª linha vertical
  let ly = (ry < 0 ? y - l * T : (l + 1) * T - y) / Math.abs(ry);   // distância até a 1ª linha horizontal
  let dist = 0;
  while (dist < alcance) {
    if (lx < ly) { dist = lx; lx += dx; c += sx; }                  // a linha vertical está mais perto: salta
    else         { dist = ly; ly += dy; l += sy; }
    if (solido(c, l)) return Math.min(dist, alcance);               // entrou numa parede: parou aqui (ou no alcance)
  }
  return alcance;                                                   // não achou parede: a luz vai até o alcance
}

// O polígono de luz: onde cada raio para, ligados em ordem. O que está dentro dele a luz enxerga.
function contorno(x, y, raio) {
  const pts = [];
  for (let i = 0; i < RAIOS; i++) {
    const ang = i / RAIOS * Math.PI * 2;
    const d = Math.min(lancar(x, y, ang, raio) + PENETRA, raio);    // entra um pouco na parede, mas nunca passa do alcance
    pts.push(x + Math.cos(ang) * d, y + Math.sin(ang) * d);
  }
  return pts;
}

// Desenha UMA luz no mapa de luz: o polígono, preenchido com um gradiente (cor no centro, transparente na borda).
function acender(L) {
  const r = L.raio * (1 + (L.fogo ? tremor(tempo, L.fase) : 0.04 * Math.sin(tempo * 2)));
  const cor = (a) => 'rgba(' + L.cor[0] + ',' + L.cor[1] + ',' + L.cor[2] + ',' + a + ')';
  for (let s = 0; s < SUAVE; s++) {
    // Fogo não é um ponto. Cada amostra sai de um ponto um pouco diferente, ao redor do centro,
    // com 1/SUAVE da força: onde as amostras discordam (a borda da sombra), nasce a penumbra.
    const a = L.fase + s / SUAVE * Math.PI * 2;
    const x = L.x + (SUAVE > 1 ? Math.cos(a) * TAM_FOGO : 0), y = L.y + (SUAVE > 1 ? Math.sin(a) * TAM_FOGO : 0);
    const p = contorno(x, y, r);
    const g = lc.createRadialGradient(L.x, L.y, 0, L.x, L.y, r);
    g.addColorStop(0, cor(1)); g.addColorStop(0.5, cor(0.45)); g.addColorStop(1, cor(0));
    lc.beginPath(); lc.moveTo(p[0], p[1]);
    for (let i = 2; i < p.length; i += 2) lc.lineTo(p[i], p[i + 1]);
    lc.closePath();
    lc.globalAlpha = 1 / SUAVE; lc.fillStyle = g; lc.fill();
  }
  lc.globalAlpha = 1;
}

function iluminar(todas) {
  lc.globalCompositeOperation = 'source-over';
  lc.fillStyle = noite ? AMBIENTE.noite : AMBIENTE.crepusculo;      // começa com a luz ambiente
  lc.fillRect(0, 0, W, H);
  lc.setTransform(1, 0, 0, 1, -cam.x, -cam.y);                      // daqui em diante as luzes são desenhadas em coordenadas do mundo
  lc.globalCompositeOperation = 'lighter';                          // 'lighter' SOMA as cores: duas luzes juntas iluminam mais
  todas.forEach(acender);
  lc.globalCompositeOperation = 'source-over';
  lc.setTransform(1, 0, 0, 1, 0, 0);                                // volta ao normal
}

function moverJogador(vx, vy) {           // um eixo de cada vez, para deslizar nas paredes
  const r = 5;
  const livre = (x, y) => !solido(Math.floor((x - r) / T), Math.floor((y - r) / T)) && !solido(Math.floor((x + r) / T), Math.floor((y - r) / T)) &&
                          !solido(Math.floor((x - r) / T), Math.floor((y + r) / T)) && !solido(Math.floor((x + r) / T), Math.floor((y + r) / T));
  if (livre(jog.x + vx, jog.y)) jog.x += vx;
  if (livre(jog.x, jog.y + vy)) jog.y += vy;
}

// ---------- desenho da cena (ainda sem luz) ----------
function cena() {
  ctx.save();
  ctx.translate(-cam.x, -cam.y);                                    // a cena é desenhada em coordenadas do mundo; a câmera desloca tudo
  const c0 = Math.floor(cam.x / T), c1 = Math.min(COLS - 1, Math.floor((cam.x + W) / T));   // só os tiles que a câmera mostra
  const l0 = Math.floor(cam.y / T), l1 = Math.min(LINS - 1, Math.floor((cam.y + H) / T));
  for (let l = l0; l <= l1; l++) {
    for (let c = c0; c <= c1; c++) {
      const x = c * T, y = l * T, ch = MAPA[l][c];
      if (ch === '#') {
        ctx.fillStyle = '#7a77a0'; ctx.fillRect(x, y, T, T);
        if (l + 1 < LINS && !solido(c, l + 1)) { ctx.fillStyle = '#4c4a6e'; ctx.fillRect(x, y + T - 5, T, 5); }   // a "face" da parede
      } else {
        ctx.fillStyle = (c + l) % 2 ? '#9a8866' : '#928060'; ctx.fillRect(x, y, T, T);   // chão quadriculado
        if (ch === 'c') {
          ctx.fillStyle = '#b07a3c'; ctx.fillRect(x + 1, y + 1, T - 2, T - 2);
          ctx.strokeStyle = '#7a4f24'; ctx.lineWidth = 1; ctx.strokeRect(x + 1.5, y + 1.5, T - 3, T - 3);
          ctx.beginPath(); ctx.moveTo(x + 2, y + 2); ctx.lineTo(x + T - 2, y + T - 2); ctx.moveTo(x + T - 2, y + 2); ctx.lineTo(x + 2, y + T - 2); ctx.stroke();
        }
      }
    }
  }
  luzes.forEach(L => {                    // o cabo de cada tocha e o cristal
    if (L.fogo) { ctx.fillStyle = '#6b4423'; ctx.fillRect(L.x - 1, L.y - 1, 2, 7); }
    else { ctx.fillStyle = '#7fc4ff'; ctx.beginPath(); ctx.moveTo(L.x, L.y - 6); ctx.lineTo(L.x + 4, L.y); ctx.lineTo(L.x, L.y + 6); ctx.lineTo(L.x - 4, L.y); ctx.fill(); }
  });
  ctx.fillStyle = '#3d7fc4'; ctx.beginPath(); ctx.arc(jog.x, jog.y, 5, 0, Math.PI * 2); ctx.fill();            // o jogador
  ctx.fillStyle = '#f0d0b0'; ctx.beginPath(); ctx.arc(jog.x - jog.dx * 1, jog.y - jog.dy * 1 - 1, 3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function chama(x, y, f) {                 // chama desenhada DEPOIS da luz, para continuar bem acesa
  const h = 4.5 * (1 + f * 3);
  ctx.fillStyle = 'rgba(255, 120, 30, 0.9)'; ctx.beginPath(); ctx.ellipse(x, y - 4, 2.6, h, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd36a'; ctx.beginPath(); ctx.ellipse(x, y - 3, 1.5, h * 0.6, 0, 0, Math.PI * 2); ctx.fill();
}

loop((dt) => {
  const apertou = (k) => keys[k] && !antes[k];
  const clicou = mouse.down && !antesClique;
  tempo += dt;
  if (apertou('g')) mostrarRaios = !mostrarRaios;
  if (apertou('n')) noite = !noite;
  if (apertou(' ')) jog.tocha = !jog.tocha;

  // ---------- movimento ----------
  const vx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
  const vy = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
  if (vx || vy) {
    const n = Math.hypot(vx, vy);
    jog.dx = vx / n; jog.dy = vy / n;
    moverJogador(jog.dx * VEL * dt, jog.dy * VEL * dt);
  }
  if (clicou) {                           // clicar numa tocha apaga; clicar no chão põe uma nova
    const c = Math.floor((mouse.x + cam.x) / T), l = Math.floor((mouse.y + cam.y) / T);   // o mouse está em coordenadas da tela: soma a câmera
    const i = luzes.findIndex(L => L.fogo && Math.floor(L.x / T) === c && Math.floor(L.y / T) === l);
    if (i >= 0) luzes.splice(i, 1);
    else if (!solido(c, l) && luzes.filter(L => L.fogo).length < MAX_TOCHAS)
      luzes.push({ x: c * T + T / 2, y: l * T + T / 2, raio: 110, cor: [255, 185, 100], fase: Math.random() * 6, fogo: true });
  }
  luzJog.x = jog.x; luzJog.y = jog.y;
  atualizarCamera();
  const perto = luzes.filter(alcanca);                              // as luzes que chegam à tela
  const todas = jog.tocha ? [luzJog].concat(perto) : perto;

  // ---------- fagulhas: partículas que sobem de cada tocha ----------
  todas.forEach(L => {
    if (L.fogo && Math.random() < 2.5 * dt)
      fagulhas.push({ x: L.x + (Math.random() - 0.5) * 4, y: L.y - 6, vx: (Math.random() - 0.5) * 14, vy: -(14 + Math.random() * 16), vida: 0.6 + Math.random() * 0.8 });
  });
  fagulhas.forEach(f => { f.x += f.vx * dt; f.y += f.vy * dt; f.vida -= dt; });
  fagulhas = fagulhas.filter(f => f.vida > 0);

  // ---------- desenho: cena, depois luz, depois o que brilha ----------
  cena();
  iluminar(todas);
  ctx.globalCompositeOperation = 'multiply';                        // cada pixel da cena × a luz: branco não muda nada, preto apaga
  ctx.drawImage(mapaLuz, 0, 0, W, H);
  ctx.globalCompositeOperation = 'screen';                          // uma passada fraca de 'screen' dá o brilho perto das chamas
  ctx.globalAlpha = BRILHO; ctx.drawImage(mapaLuz, 0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  ctx.save(); ctx.translate(-cam.x, -cam.y);                        // o que brilha também é desenhado em coordenadas do mundo
  perto.forEach(L => { if (L.fogo) chama(L.x, L.y, tremor(tempo, L.fase)); });
  if (jog.tocha) chama(jog.x + jog.dx * 6, jog.y + jog.dy * 6 + 2, tremor(tempo, 0));
  fagulhas.forEach(f => { ctx.fillStyle = 'rgba(255, 190, 90, ' + Math.min(1, f.vida) + ')'; ctx.fillRect(f.x, f.y, 1.5, 1.5); });

  if (mostrarRaios) todas.forEach(L => {                            // depuração: o polígono de cada luz e um raio a cada 15 graus
    const p = contorno(L.x, L.y, L.raio);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)'; ctx.lineWidth = 0.8; ctx.beginPath();
    for (let i = 0; i < p.length; i += 30) { ctx.moveTo(L.x, L.y); ctx.lineTo(p[i], p[i + 1]); }
    ctx.stroke();
    ctx.strokeStyle = '#3dff7a'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
    ctx.closePath(); ctx.stroke();
  });
  ctx.restore();                                                    // fim das coordenadas do mundo: o texto é desenhado na tela

  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(0, H - 14, W, 14);
  ctx.fillStyle = '#fff'; ctx.font = '10px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Tochas: ' + luzes.filter(L => L.fogo).length + '/' + MAX_TOCHAS + '  Clique: põe/tira  Espaço: sua tocha  G: raios  N: ' + (noite ? 'noite' : 'crepúsculo'), 6, H - 4);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(0, 0, 150, 14);
  ctx.fillStyle = '#fff'; ctx.fillText('Luzes na tela: ' + todas.length + ' de ' + (luzes.length + (jog.tocha ? 1 : 0)), 6, 10);   // as outras nem entram nas contas

  antes = Object.assign({}, keys); antesClique = mouse.down;
});
`},
{n:"Estados do jogo",t:`<p>Um jogo completo não é só a partida: tem tela de título, pausa e fim de jogo. A forma mais simples de organizar isso é uma variável <code>estado</code> com o nome da tela atual: <code>'titulo'</code>, <code>'jogando'</code>, <code>'pausa'</code> ou <code>'fim'</code>. A cada quadro, o loop olha o <code>estado</code> e decide o que atualizar e o que desenhar.</p><p>Trocar de tela é só mudar o valor da variável. Como <code>keys</code> diz se a tecla está <i>segurada</i>, a função <code>apertou</code> compara com o quadro anterior para detectar o <i>momento</i> em que ela foi apertada. Sem isso, a pausa ligaria e desligaria várias vezes por segundo.</p><p>O jogo aqui é um <b>corredor infinito</b>: pule os obstáculos, que vão ficando mais rápidos. <b>Espaço</b> (ou seta para cima, ou toque na tela) pula, <b>P</b> pausa, e Espaço ou Enter começam e recomeçam. Clique na tela antes de jogar.</p>`,
d:"Crie um quinto estado, 'instrucoes', entre o título e o jogo: ele mostra os controles e só começa a partida quando o jogador apertar Espaço.",
c:`let estado = 'titulo';   // 'titulo' | 'jogando' | 'pausa' | 'fim'
let antes = {};          // teclas do quadro anterior
const segurando = (k) => keys[k] || (k === ' ' && mouse.down);   // toque vale como Espaço
const apertou = (k) => segurando(k) && !antes[k];                // só no instante do aperto

const CHAO = 200;
let jogador, obstaculos, velocidade, proximo, pontos, chaoX, bloqueio = 0;
let recorde = 0;

function reiniciar() {
  jogador = { x: 70, y: CHAO - 32, w: 28, h: 32, vy: 0 };
  obstaculos = []; velocidade = 220; proximo = 1; pontos = 0; chaoX = 0;
}
reiniciar();

function bate(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function atualizar(dt) {
  // pulo + gravidade
  const noChao = jogador.y + jogador.h >= CHAO;
  if ((apertou(' ') || apertou('ArrowUp') || apertou('w')) && noChao) jogador.vy = -520;
  jogador.vy += 1500 * dt;
  jogador.y += jogador.vy * dt;
  if (jogador.y + jogador.h >= CHAO) { jogador.y = CHAO - jogador.h; jogador.vy = 0; }

  // obstáculos nascem à direita e vêm para a esquerda
  proximo -= dt;
  if (proximo <= 0) {
    const h = 24 + Math.random() * 20;
    obstaculos.push({ x: W, y: CHAO - h, w: 20 + Math.random() * 14, h: h });
    proximo = 1 + Math.random() * 0.9;
  }
  obstaculos.forEach(o => o.x -= velocidade * dt);
  obstaculos = obstaculos.filter(o => o.x + o.w > 0);

  velocidade += 6 * dt;    // o jogo acelera
  pontos += dt * 10;
  chaoX = (chaoX + velocidade * dt) % 40;

  const o = obstaculos.find(o => bate(jogador, o));

  if (o) {
    const invadeEsq = (jogador.x + jogador.w) - o.x;
    const invadeCima = (jogador.y + jogador.h) - o.y;

    if (invadeEsq <= invadeCima) {
      jogador.x = o.x - jogador.w;       // batida lateral: encosta na face do obstáculo
    } else {
      jogador.y = o.y - jogador.h;       // caiu por cima: apoia no topo
      jogador.vy = 0;
    }

    estado = 'fim';                                   // troca de estado!
    recorde = Math.max(recorde, Math.floor(pontos));
    bloqueio = 0.6;      // evita recomeçar sem querer
  }
}

function texto(msg, x, y, tam, alinha) {
  ctx.font = tam + 'px monospace';
  ctx.textAlign = alinha || 'center';
  ctx.fillText(msg, x, y);
}

function desenhar() {
  // a cena é desenhada em todos os estados
  ctx.fillStyle = '#6fb7e8'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(0, CHAO, W, H - CHAO);
  ctx.fillStyle = '#3f8f3a'; ctx.fillRect(0, CHAO, W, 8);
  ctx.fillStyle = '#6b3a10';
  for (let x = -chaoX; x < W; x += 40) ctx.fillRect(x, CHAO + 22, 16, 4);   // chão rolando

  ctx.fillStyle = '#2d6b2a';
  obstaculos.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));
  ctx.fillStyle = '#ffd34e';
  ctx.fillRect(jogador.x, jogador.y, jogador.w, jogador.h);
  ctx.fillStyle = '#1c130b';
  ctx.fillRect(jogador.x + 18, jogador.y + 8, 4, 4);   // olho

  if (estado !== 'titulo') {
    ctx.fillStyle = '#fff';
    texto('Pontos: ' + Math.floor(pontos), 10, 22, 16, 'left');
    texto('Recorde: ' + recorde, W - 10, 22, 16, 'right');
  }

  // cada estado tem a sua tela por cima
  if (estado !== 'jogando') {
    ctx.fillStyle = 'rgba(20, 12, 5, 0.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd34e';
    if (estado === 'titulo') {
      texto('CORRIDA INFINITA', W / 2, 100, 28);
      ctx.fillStyle = '#fff';
      texto('Espaço ou Enter para começar', W / 2, 145, 15);
      texto('Espaço pula  -  P pausa', W / 2, 175, 13);
    } else if (estado === 'pausa') {
      texto('PAUSA', W / 2, 115, 30);
      ctx.fillStyle = '#fff';
      texto('P para continuar', W / 2, 150, 15);
    } else if (estado === 'fim') {
      ctx.fillStyle = '#ff8c82';
      texto('FIM DE JOGO', W / 2, 90, 28);
      ctx.fillStyle = '#fff';
      texto('Pontos: ' + Math.floor(pontos) + '   Recorde: ' + recorde, W / 2, 130, 16);
      texto('Espaço ou Enter para jogar de novo', W / 2, 170, 14);
    }
  }
  ctx.textAlign = 'left';
}

loop((dt) => {
  // 1) o estado decide o que atualizar
  if (estado === 'titulo') {
    if (apertou(' ') || apertou('Enter')) { reiniciar(); estado = 'jogando'; }
  } else if (estado === 'jogando') {
    atualizar(dt);
    if (apertou('p') || apertou('Escape')) estado = 'pausa';
  } else if (estado === 'pausa') {
    if (apertou('p') || apertou('Escape')) estado = 'jogando';
  } else if (estado === 'fim') {
    bloqueio -= dt;
    if (bloqueio <= 0 && (apertou(' ') || apertou('Enter'))) { reiniciar(); estado = 'jogando'; }
  }

  // 2) o estado também decide o que desenhar
  desenhar();

  // 3) guarda as teclas deste quadro para detectar o próximo aperto
  antes = Object.assign({}, keys, { ' ': segurando(' ') });
});
`},
{n:"Som com Web Audio",t:`<p>O navegador tem um sintetizador embutido: a <b>Web Audio API</b>. Em vez de tocar arquivos, criamos os sons por código, no mesmo princípio do piano virtual. Um som é um <code>oscillator</code> (gera uma onda numa <b>frequência</b> em Hz: 440 é o Lá), ligado a um <code>gain</code> (o volume), ligado à saída <code>audio.destination</code>.</p><p>A função <code>nota(freq, inicio, dur, tipo, vol, fim)</code> toca uma nota. O <code>tipo</code> é o timbre: <code>'sine'</code> (suave), <code>'triangle'</code>, <code>'square'</code> (som de videogame antigo) ou <code>'sawtooth'</code> (áspero). O volume cai quase a zero ao longo da nota para não dar estalo, e <code>inicio</code> permite encadear notas (arpejos). Com o parâmetro <code>fim</code>, a frequência desliza, como no som de trocar de sala.</p><p>Os efeitos viram uma tabela <code>sons</code>: <b>chave</b> (três notas agudas), <b>rupia</b> (duas notas de moeda), <b>coração</b> (arpejo suave), <b>sala</b> (desliza do grave ao agudo), além de <b>porta trancada</b> e <b>porta aberta</b>. Quando algo acontece no jogo, basta chamar <code>sons.chave()</code>.</p><p>O navegador só libera o áudio depois que você clica ou aperta uma tecla, então clique na tela primeiro. Use as setas ou WASD para explorar as 3 salas e pegue a chave para abrir a porta que leva ao tesouro. As teclas <b>1 a 6</b> testam cada som, e <b>M</b> silencia.</p>`,
d:"Invente o som de um quarto item (tecla 7): combine duas ou três notas e experimente os tipos de onda 'sine', 'square', 'triangle' e 'sawtooth'. Depois coloque o item no mapa.",
c:`// ---------- SOM ----------
// um único AudioContext (o navegador limita quantos podem existir)
const audio = window.meuAudio || (window.meuAudio = new (window.AudioContext || window.webkitAudioContext)());
let mudo = false;

// toca UMA nota: frequência (Hz), início (s), duração (s), tipo de onda, volume, frequência final
function nota(freq, inicio, dur, tipo, vol, fim) {
  if (mudo) return;
  if (audio.state === 'suspended') audio.resume();   // o navegador só libera após um clique ou tecla
  const t = audio.currentTime + inicio;
  const osc = audio.createOscillator();
  const ganho = audio.createGain();
  osc.type = tipo;
  osc.frequency.setValueAtTime(freq, t);
  osc.frequency.exponentialRampToValueAtTime(fim || freq, t + dur);   // desliza até 'fim'
  ganho.gain.setValueAtTime(vol, t);
  ganho.gain.exponentialRampToValueAtTime(0.001, t + dur);            // some aos poucos (sem estalo)
  osc.connect(ganho);
  ganho.connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur);
}

const sons = {
  chave:    () => { nota(1047, 0, .09, 'triangle', .2); nota(1319, .09, .09, 'triangle', .2); nota(1568, .18, .25, 'triangle', .2); },
  rupia:    () => { nota(988, 0, .07, 'square', .12); nota(1319, .07, .3, 'square', .12); },
  coracao:  () => [523, 659, 784, 1047].forEach((f, i) => nota(f, i * .09, .22, 'sine', .25)),
  sala:     () => nota(120, 0, .4, 'sawtooth', .12, 700),
  trancada: () => { nota(130, 0, .12, 'square', .15); nota(98, .13, .2, 'square', .15); },
  abrir:    () => { nota(300, 0, .1, 'sawtooth', .12); nota(600, .1, .2, 'triangle', .2); }
};

// ---------- MAPAS ----------
// # parede   D porta trancada   < > passagem entre salas
// k chave   r rupia   c coração
const T = 30;
const salas = [
  { nome: 'Sala 1: Entrada', mapa: [
    '################',
    '#..............#',
    '#..k...........#',
    '#..............>',
    '#.......r......#',
    '#..............#',
    '#..............#',
    '################'] },
  { nome: 'Sala 2: Câmara', mapa: [
    '################',
    '#.............##',
    '#..##.....c...##',
    '<.............D>',
    '#..##.........##',
    '#.............##',
    '#.............##',
    '################'] },
  { nome: 'Sala 3: Tesouro', mapa: [
    '################',
    '#..............#',
    '#..r.......r...#',
    '<..............#',
    '#..r.......r...#',
    '#..............#',
    '#..............#',
    '################'] }
].map(s => ({ nome: s.nome, mapa: s.mapa.map(l => l.split('')) }));

let atual = 0, vidas = 3, rupias = 0, chaves = 0, msg = '', msgT = 0, antes = {};
const heroi = { x: 60, y: 3 * T + 5, w: 20, h: 20 };

const mapa = () => salas[atual].mapa;
function tile(x, y) {
  const linha = mapa()[Math.floor(y / T)];
  return (linha && linha[Math.floor(x / T)]) || '#';
}
const solido = (x, y) => tile(x, y) === '#' || tile(x, y) === 'D';
function livre(o) {
  return !solido(o.x, o.y) && !solido(o.x + o.w - 1, o.y) &&
         !solido(o.x, o.y + o.h - 1) && !solido(o.x + o.w - 1, o.y + o.h - 1);
}
function mover(o, dx, dy) {
  o.x += dx; if (!livre(o)) o.x -= dx;
  o.y += dy; if (!livre(o)) o.y -= dy;
}
const apertou = (k) => keys[k] && !antes[k];

loop((dt) => {
  // movimento
  let dx = 0, dy = 0;
  if (keys.ArrowLeft  || keys.a) dx -= 140 * dt;
  if (keys.ArrowRight || keys.d) dx += 140 * dt;
  if (keys.ArrowUp    || keys.w) dy -= 140 * dt;
  if (keys.ArrowDown  || keys.s) dy += 140 * dt;
  mover(heroi, dx, dy);

  // teclas de teste: 1 a 6 tocam cada som, M liga e desliga o som
  ['chave', 'rupia', 'coracao', 'sala', 'trancada', 'abrir'].forEach((nome, i) => {
    if (apertou(String(i + 1))) sons[nome]();
  });
  if (apertou('m')) mudo = !mudo;

  // itens: olhamos o tile sob o centro do herói
  const cx = heroi.x + heroi.w / 2, cy = heroi.y + heroi.h / 2;
  const col = Math.floor(cx / T), lin = Math.floor(cy / T);
  const c = tile(cx, cy);
  if (c === 'k') { chaves++;  sons.chave();   mapa()[lin][col] = '.'; }
  if (c === 'r') { rupias++;  sons.rupia();   mapa()[lin][col] = '.'; }
  if (c === 'c') { vidas++;   sons.coracao(); mapa()[lin][col] = '.'; }

  // trocar de sala
  if (c === '>') { atual++; heroi.x = 1 * T + 5;  sons.sala(); }
  if (c === '<') { atual--; heroi.x = 14 * T + 5; sons.sala(); }

  // porta: tocar nela com chave abre; sem chave, avisa
  msgT -= dt;
  [[heroi.x - 3, cy], [heroi.x + heroi.w + 3, cy], [cx, heroi.y - 3], [cx, heroi.y + heroi.h + 3]]
    .forEach(([x, y]) => {
      if (tile(x, y) !== 'D') return;
      if (chaves > 0) {
        chaves--; mapa()[Math.floor(y / T)][Math.floor(x / T)] = '.'; sons.abrir();
      } else if (msgT <= 0) {
        sons.trancada(); msg = 'Precisa de uma chave!'; msgT = 1.2;
      }
    });

  // ---------- desenho ----------
  const m = mapa();
  for (let r = 0; r < m.length; r++) {
    for (let q = 0; q < m[r].length; q++) {
      const t = m[r][q], x = q * T, y = r * T;
      if (t === '#') {
        ctx.fillStyle = '#4a4f7a'; ctx.fillRect(x, y, T, T);
        ctx.fillStyle = '#5d6396'; ctx.fillRect(x + 2, y + 2, T - 4, T - 4);
        continue;
      }
      ctx.fillStyle = '#241d33'; ctx.fillRect(x, y, T, T);
      if (t === 'D') {
        ctx.fillStyle = '#8a5a2b'; ctx.fillRect(x + 3, y, T - 6, T);
        ctx.fillStyle = '#ffd34e'; ctx.fillRect(x + 12, y + 11, 6, 8);
      } else if (t === '<' || t === '>') {
        ctx.fillStyle = '#0d0a14'; ctx.fillRect(x, y, T, T);
        ctx.fillStyle = '#a79fd6'; ctx.beginPath();
        if (t === '>') { ctx.moveTo(x + 10, y + 8); ctx.lineTo(x + 22, y + 15); ctx.lineTo(x + 10, y + 22); }
        else           { ctx.moveTo(x + 20, y + 8); ctx.lineTo(x + 8, y + 15);  ctx.lineTo(x + 20, y + 22); }
        ctx.fill();
      } else if (t === 'k') {
        ctx.fillStyle = '#9ee7ff';
        ctx.beginPath(); ctx.arc(x + 10, y + 15, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(x + 14, y + 13, 12, 4); ctx.fillRect(x + 21, y + 17, 2, 5); ctx.fillRect(x + 24, y + 17, 2, 5);
        ctx.fillStyle = '#241d33';
        ctx.beginPath(); ctx.arc(x + 10, y + 15, 2, 0, Math.PI * 2); ctx.fill();
      } else if (t === 'r') {
        ctx.fillStyle = '#3ddc97'; ctx.beginPath();
        ctx.moveTo(x + 15, y + 6); ctx.lineTo(x + 21, y + 15);
        ctx.lineTo(x + 15, y + 24); ctx.lineTo(x + 9, y + 15); ctx.fill();
      } else if (t === 'c') {
        ctx.fillStyle = '#e0483e'; ctx.font = '22px monospace'; ctx.textAlign = 'center';
        ctx.fillText('♥', x + 15, y + 23);
      }
    }
  }
  ctx.fillStyle = '#ffd34e';
  ctx.fillRect(heroi.x, heroi.y, heroi.w, heroi.h);

  ctx.fillStyle = '#fff'; ctx.font = '13px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Vidas: ' + vidas + '  Rupias: ' + rupias + '  Chaves: ' + chaves + '  ' + salas[atual].nome, 8, 19);
  ctx.font = '11px monospace';
  ctx.fillText(msgT > 0 ? msg : 'Teclas 1-6 testam os sons - M: ' + (mudo ? 'som desligado' : 'som ligado'), 8, 232);

  antes = Object.assign({}, keys);
});
`},
{n:"Salvar progresso",t:`<p>Quando o jogador fecha a página, tudo o que está em variáveis some. Para guardar o progresso, o navegador oferece o <code>localStorage</code>: uma pequena gaveta, própria de cada site e de cada navegador, que continua lá depois que a página é fechada e reaberta. Ele guarda apenas <b>texto</b>, então transformamos o objeto em texto com <code>JSON.stringify</code> ao salvar e voltamos a objeto com <code>JSON.parse</code> ao carregar.</p><p>O código mostra três cuidados: (1) usar <code>try/catch</code>, porque o armazenamento pode estar bloqueado (em abas anônimas, por exemplo); (2) <b>conferir os valores</b> lidos, porque o dado pode estar vazio ou quebrado, e então voltar a valores padrão; (3) salvar nos <b>momentos certos</b> (fase concluída, fim de jogo), e não a cada quadro.</p><p>O mini-game <b>Caça às Rupias</b> usa isso: colete a meta de rupias antes que o tempo acabe, sem encostar nas bolas vermelhas, que ricocheteiam como no Breakout. Ao concluir uma fase, a <b>fase atual</b> e os <b>pontos</b> são salvos, e o <b>recorde</b> é atualizado. Troque de capítulo e volte, ou recarregue a página: na tela de título você pode continuar de onde parou, e ela mostra o texto bruto que ficou salvo.</p><p>Setas ou WASD movem (ou arraste na tela). Na tela de título, <b>N</b> começa um novo jogo (mantendo o recorde) e <b>X</b> apaga tudo.</p>`,
d:"Salve também a carteira (o total de rupias coletadas em todas as partidas) e mostre na tela de título. Lembre de dar um valor padrão para quem já tem um save antigo, sem esse campo.",
c:`const CHAVE = 'guiaGames:cacaRupias';      // nome da "gaveta" no navegador
const PADRAO = { fase: 1, pontos: 0, recorde: 0, partidas: 0 };
const inteiroOk = (v, min) => Number.isInteger(v) && v >= min;
let aviso = 0, msgAviso = '';

// ---------- salvar e carregar ----------

function carregar() {
  try {
    const texto = localStorage.getItem(CHAVE);        // só existe texto (ou null)
    if (!texto) return Object.assign({}, PADRAO);
    const d = JSON.parse(texto);                      // texto -> objeto
    return {                                          // confere: o dado pode estar quebrado
      fase:     inteiroOk(d.fase, 1)     ? d.fase     : PADRAO.fase,
      pontos:   inteiroOk(d.pontos, 0)   ? d.pontos   : PADRAO.pontos,
      recorde:  inteiroOk(d.recorde, 0)  ? d.recorde  : PADRAO.recorde,
      partidas: inteiroOk(d.partidas, 0) ? d.partidas : PADRAO.partidas
    };
  } catch (e) {
    return Object.assign({}, PADRAO);                 // sem armazenamento ou texto inválido
  }
}
function salvar() {
  try {
    localStorage.setItem(CHAVE, JSON.stringify(dados));   // objeto -> texto
    msgAviso = 'Progresso salvo!';
  } catch (e) {
    msgAviso = 'Não foi possível salvar';
  }
  aviso = 1.5;
}
function apagar() {
  try { localStorage.removeItem(CHAVE); } catch (e) {}
  dados = Object.assign({}, PADRAO);
  msgAviso = 'Progresso apagado'; aviso = 1.5;
}
let dados = carregar();   // lê o que estava salvo (ou os valores padrão)

function lerTexto() {      // o texto bruto que está guardado (só para mostrar)
  try { return localStorage.getItem(CHAVE) || '(vazio)'; } catch (e) { return '(indisponível)'; }
}
const podeSalvar = (() => {
  try { localStorage.setItem('teste', '1'); localStorage.removeItem('teste'); return true; }
  catch (e) { return false; }
})();

// ---------- o jogo ----------
let estado = 'titulo', antes = {}, antesClique = false, pausa = 0, bonus = 0;
let fase, pontos, pontosInicio, tempo, meta, coletadas, rupias, perigos, heroi;
const limite = (v, a, b) => Math.max(a, Math.min(b, v));

function novaRupia() {
  let r;
  do { r = { x: 20 + Math.random() * (W - 40), y: 36 + Math.random() * (H - 56) }; }
  while (heroi && Math.hypot(r.x - heroi.x, r.y - heroi.y) < 50);
  return r;
}
function iniciar(f, p) {
