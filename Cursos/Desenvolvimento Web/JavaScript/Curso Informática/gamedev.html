'Invasores':{d:`Guarde a velocidade dos inimigos numa variável e aumente-a no momento em que um inimigo é atingido.`,e:`Variável <code>vel</code>: começa em 35 e ganha +2 a cada inimigo derrotado (24 inimigos = cerca de +50 no total).`,r:[[`fim = '', espera = 0, tempo = 0;`,`fim = '', espera = 0, tempo = 0, vel = 35;`],[`e.x += dir * 35 * dt;`,`e.x += dir * vel * dt;`],[`{ t.morto = e.morto = true; pontos += 10; }`,`{ t.morto = e.morto = true; pontos += 10; vel += 2; }`]]},
'Battle Tanks':{d:`Uma direção só não basta: o inimigo precisa de um <b>caminho</b>. Use a busca em largura do capítulo 21 (ou o A* do 15) na grade de tiles e ande um tile por vez, só para cima, baixo, esquerda ou direita, sempre até o centro do próximo tile. Pedras e tijolos não entram no caminho.`,e:`Dentro do <code>RAIO</code>, o inimigo calcula o caminho até o jogador com busca em largura (<code>proximoPasso</code>) e anda tile a tile, só nas 4 direções (<code>andarAte</code>), contornando pedras e tijolos. Se o jogador está na mesma linha ou coluna, sem parede no meio (<code>mira</code>), ele para, vira e atira.`,r:[[`loop((dt) => {\n  if (!fim) {`,`// ---------- perseguição em grade: só norte, sul, leste e oeste ----------\nconst tc = (o) => Math.floor((o.x + o.s / 2) / T);   // coluna do centro do tanque\nconst tl = (o) => Math.floor((o.y + o.s / 2) / T);   // linha do centro do tanque\n\n// busca em largura que parte do JOGADOR (c1, l1): o tile de onde ela chega ao inimigo (c0, l0)\n// é o primeiro passo do menor caminho dele até o jogador. Pedras e tijolos bloqueiam.\nfunction proximoPasso(c0, l0, c1, l1) {\n  const veio = { [c1 + ',' + l1]: true }, fila = [[c1, l1]];\n  for (let i = 0; i < fila.length && !veio[c0 + ',' + l0]; i++) {\n    const [c, l] = fila[i];\n    DIRS.forEach(([dc, dl]) => {\n      const k = (c + dc) + ',' + (l + dl);\n      if (!veio[k] && mapa[l + dl] && mapa[l + dl][c + dc] === '.') {\n        veio[k] = [c, l]; fila.push([c + dc, l + dl]);\n      }\n    });\n  }\n  const prox = veio[c0 + ',' + l0];\n  return Array.isArray(prox) ? { c: prox[0], l: prox[1] } : null;\n}\n\n// anda até (x, y) em linha reta, um eixo por vez (nunca na diagonal). Devolve true quando chega.\nfunction andarAte(o, x, y, v) {\n  const dx = x - o.x, dy = y - o.y;\n  if (Math.abs(dx) > 0.01) { o.dx = Math.sign(dx); o.dy = 0; mover(o, o.dx * Math.min(v, Math.abs(dx)), 0); return false; }\n  if (Math.abs(dy) > 0.01) { o.dx = 0; o.dy = Math.sign(dy); mover(o, 0, o.dy * Math.min(v, Math.abs(dy))); return false; }\n  return true;\n}\n\n// o jogador está na mesma linha ou coluna, sem parede no meio? Devolve a direção do tiro (ou null).\nfunction mira(e) {\n  const dx = (p.x + p.s / 2) - (e.x + e.s / 2), dy = (p.y + p.s / 2) - (e.y + e.s / 2);\n  const d = Math.abs(dy) < 10 ? [Math.sign(dx) || 1, 0] : Math.abs(dx) < 10 ? [0, Math.sign(dy) || 1] : null;\n  if (!d) return null;\n  for (let i = 8; i < Math.hypot(dx, dy); i += 8)       // anda em linha reta, testando os tiles\n    if (tile(e.x + e.s / 2 + d[0] * i, e.y + e.s / 2 + d[1] * i) !== '.') return null;\n  return d;\n}\n\nloop((dt) => {\n  if (!fim) {`],[`      if (e.alerta) {\n        // para e vira para o lado em que o jogador está mais longe (4 direções)\n        if (Math.abs(vx) > Math.abs(vy)) { e.dx = Math.sign(vx) || 1; e.dy = 0; }\n        else { e.dx = 0; e.dy = Math.sign(vy) || 1; }\n        if (e.tiro <= 0) { atirar(e, 'inimigo'); e.tiro = 0.9; }\n      } else {\n        e.troca -= dt;`,`      if (e.alerta) {\n        const d = mira(e);\n        if (d) {                                 // jogador na linha de tiro: para, vira e atira\n          e.dx = d[0]; e.dy = d[1];\n          if (e.tiro <= 0) { atirar(e, 'inimigo'); e.tiro = 0.9; }\n        } else {                                 // senão, persegue andando de tile em tile\n          if (!e.alvo) {\n            const c = tc(e), l = tl(e);\n            const alinhado = Math.abs(e.x - (c * T + 4)) < 0.01 && Math.abs(e.y - (l * T + 4)) < 0.01;\n            const prox = alinhado ? proximoPasso(c, l, tc(p), tl(p)) : null;\n            e.alvo = prox || { c: c, l: l };     // sem caminho ou fora do centro: encaixa no tile\n          }\n          if (andarAte(e, e.alvo.c * T + 4, e.alvo.l * T + 4, 70 * dt)) e.alvo = null;\n        }\n      } else {\n        e.alvo = null;\n        e.troca -= dt;`]]},
'Jogo final':{d:`O alvo da câmera está em <code>seguir</code>, na variável <code>alvoX</code>. Some a ele um deslocamento que depende do lado em que o jogador está virado (<code>p.esq</code>): negativo para a esquerda e positivo para a direita. Como a câmera é suave, ela desliza até o novo alvo quando o jogador troca de lado.`,e:`Em <code>seguir</code>, a constante <code>olhar</code> vale -40 quando o jogador olha para a esquerda e 40 quando olha para a direita, e entra na conta do <code>alvoX</code>. O <code>limitar</code> continua segurando a câmera dentro do mapa. Troque o 40 por outro valor para olhar mais perto ou mais longe.`,r:[[`  const alvoX = limitar(p.x + p.w / 2 - vw / 2, 0, mapa.cols * T - vw);`,`  const olhar = (p.esq ? -1 : 1) * 40;   // a câmera olha 40 pixels à frente do jogador\n  const alvoX = limitar(p.x + p.w / 2 + olhar - vw / 2, 0, mapa.cols * T - vw);`]]},
'Luz e sombras':{d:`O polígono nasce de um laço que gira de 0 a 360 graus. Para um cone, gire só de (direção − meia abertura) até (direção + meia abertura). A direção do jogador é <code>Math.atan2(jog.dy, jog.dx)</code>. Faça o polígono começar no ponto da própria luz, senão o cone vira uma fatia torta. Dê à luz do jogador os campos <code>ang</code> e <code>cone</code> e passe os dois para o <code>contorno</code>.`,e:`A função <code>contorno</code> ganhou dois parâmetros, <code>centro</code> (a direção) e <code>cone</code> (a meia abertura, em radianos). Sem <code>cone</code>, nada muda: o laço dá a volta inteira. Com <code>cone</code>, o laço vai de <code>centro - cone</code> até <code>centro + cone</code>, e o primeiro ponto do polígono é a própria luz, o que forma uma fatia de pizza cujas bordas param nas paredes. O gradiente continua radial. Tente <code>0.3</code> para uma lanterna estreita ou <code>1.2</code> para uma aberta.`,r:[[`function contorno(x, y, raio) {`,`function contorno(x, y, raio, centro, cone) {`],[`  for (let i = 0; i < RAIOS; i++) {\n    const ang = i / RAIOS * Math.PI * 2;`,`  const a0 = cone ? centro - cone : 0, a1 = cone ? centro + cone : Math.PI * 2;   // cone: só entre a0 e a1\n  if (cone) pts.push(x, y);                                                       // a ponta do cone é a própria luz\n  for (let i = 0; i < RAIOS; i++) {\n    const ang = a0 + (a1 - a0) * i / (RAIOS - 1);`],[`    const p = contorno(x, y, r);`,`    const p = contorno(x, y, r, L.ang, L.cone);`],[`  luzJog.x = jog.x; luzJog.y = jog.y;`,`  luzJog.x = jog.x; luzJog.y = jog.y;\n  luzJog.ang = Math.atan2(jog.dy, jog.dx); luzJog.cone = 0.6;   // meia abertura de 0,6 rad: cone de uns 70 graus`],[`    const p = contorno(L.x, L.y, L.raio);`,`    const p = contorno(L.x, L.y, L.raio, L.ang, L.cone);`]]},
 'Mini RPG':{d:"O desenho do inimigo está na fila do Y Sorting, dentro de <code>inimigos.forEach</code>. Logo depois de <code>desenharAtor</code>, desenhe um retângulo preto e, por cima, um vermelho com largura <code>16 * e.vida / INIMIGOS[e.tipo].vida</code>. Só desenhe quando a vida for menor que a inicial. Depois, em <code>INIMIGOS</code>, aumente a <code>vida</code>, a <code>vel</code> e a <code>visao</code> da vespa.",e:"Depois de desenhar o inimigo, o código desenha uma barrinha de 16 pixels acima da cabeça (<code>e.y - e.hc</code>). A parte vermelha é proporcional à vida que resta, e a barra só aparece se o inimigo estiver ferido e vivo. A transparência volta a 1 antes de desenhar a barra, para ela não piscar junto com o inimigo. Em <code>INIMIGOS</code>, a vespa passou a ter 3 de vida, <code>vel</code> 55 e <code>visao</code> 140: aguenta mais golpes, persegue mais depressa e enxerga de mais longe. Como 55 ainda é menos que a <code>VEL = 60</code> do jogador, dá para fugir dela.",r:[["e.x + e.w / 2, e.y + e.h, e.esq);","e.x + e.w / 2, e.y + e.h, e.esq);\n    if (!e.morto && e.vida < INIMIGOS[e.tipo].vida) {          // barra de vida, só depois de ferido\n      const bx = e.x + e.w / 2 - 8, by = e.y - e.hc - 8;\n      ctx.globalAlpha = 1;                                     // a barra não pisca junto com o inimigo\n      ctx.fillStyle = '#000'; ctx.fillRect(bx - 1, by - 1, 18, 4);\n      ctx.fillStyle = '#e0483e'; ctx.fillRect(bx, by, 16 * e.vida / INIMIGOS[e.tipo].vida, 2);\n    }"],["wasp:  { vida: 2, vel: 45, visao: 120,","wasp:  { vida: 3, vel: 55, visao: 140,"]]},
 'RPG de Tabuleiro':{d:"A poção é pega em <code>pegarItem</code>. Sorteie o valor com <code>d(1, 6) + 4</code> numa constante e use-a no lugar de <code>item.cura</code>, tanto na soma da vida quanto na mensagem. Depois, na tabela <code>INIMIGOS</code>, mude a <code>visao</code> do esqueleto e da cobra, ligue <code>DEPURAR</code> e ande até os círculos.",e:"A função <code>d(n, lados)</code> já existe: rola <code>n</code> dados de <code>lados</code> faces e soma. Em <code>pegarItem</code>, a cura passou a ser <code>d(1, 6) + 4</code>, de 5 a 10 pontos, sorteada a cada poção. O texto <code>+N de vida</code> usa a vida que de fato foi recuperada (<code>j.hp - antes</code>), então continua certo quando a cura passaria do máximo. Na tabela, o esqueleto passou a perseguir de 8 tiles (antes 5) e a cobra de 2 (antes 4). Com <code>DEPURAR = true</code>, o círculo vermelho de cada inimigo mostra o raio: o esqueleto percebe você de bem longe, e a cobra só quando você chega bem perto.",r:[["  const antes = j.hp;\n  j.hp = Math.min(j.hpMax, j.hp + item.cura);", "  const antes = j.hp, cura = d(1, 6) + 4;                   // cura sorteada: 1d6 + 4\n  j.hp = Math.min(j.hpMax, j.hp + cura);"], ["dano: [1, 6, 1],  visao: 5 }", "dano: [1, 6, 1],  visao: 8 }"], ["ca: 11, atq: 3, dano: [1, 6, 0],  visao: 4 }", "ca: 11, atq: 3, dano: [1, 6, 0],  visao: 2 }"]]},
 'Desenhar imagens':{d:"O que muda é a superfície onde a raposa pisa: o topo da caixa é mais alto que a grama. A constante <code>CHAO</code> guarda justamente o y dessa superfície, e <code>X</code> diz onde a raposa fica na horizontal. Para o espelhamento, use <code>ESPELHAR</code>.",e:"A caixa começa em <code>x = 128</code> e o topo dela está em <code>y = 144</code>. Trocamos <code>X</code> para 128 e <code>CHAO</code> para 144. O resto se ajusta sozinho, porque o código calcula <code>y = CHAO - altura</code>: 144 − 32 = 112, e a base da raposa encosta no topo da caixa. Com <code>ESPELHAR = true</code> ela é desenhada espelhada: o <code>translate</code> leva a origem para a borda direita (<code>X + w</code>) e o <code>scale(-1, 1)</code> inverte o eixo x, então o desenho em <code>(0, 0)</code> ocupa o mesmo lugar, só virado.",r:[["const CHAO = 176;        // y da superfície onde a raposa pisa (a grama do fundo começa em y = 176)", "const CHAO = 144;        // y da superfície onde a raposa pisa (agora, o topo da caixa de madeira)"], ["const X = 40;            // x do canto esquerdo da raposa", "const X = 128;           // x do canto esquerdo da raposa (em cima da caixa)"], ["const ESPELHAR = false;  // true: a raposa olha para a esquerda", "const ESPELHAR = true;   // true: a raposa olha para a esquerda"]]}
};

const QUIZ={"Introdução":[["O que é o game loop?","Um ciclo repetido muitas vezes por segundo: ler a entrada, atualizar o mundo e desenhar","Um comando que reinicia o jogo quando o jogador perde","Um laço `for` que desenha todas as moedas de uma só vez","O arquivo HTML que guarda o código do jogo","No guia, o game loop é a função `loop(dt)`, que roda a cada quadro e repete as três etapas: entrada, atualização e desenho."],["Por que multiplicar as velocidades por `dt`?","Para o jogo andar na mesma velocidade em qualquer computador","Para o jogo rodar mais depressa","Para o personagem não sair da tela","Para o código não dar erro","O `dt` é o tempo desde o quadro anterior. Com ele, um computador lento e um rápido fazem o personagem percorrer a mesma distância por segundo."],["No guia, o que é o `ctx`?","O \"pincel\" do canvas, usado para desenhar formas e texto","O tempo desde o quadro anterior","A lista de teclas apertadas","O nome do arquivo do jogo","O `ctx` é o contexto 2D do canvas. É nele que ficam `fillRect`, `arc` e `fillText`."]],"Desenhar":[["Qual chamada pinta um retângulo de 20 de largura e 10 de altura na posição (30, 40)?","`ctx.fillRect(30, 40, 20, 10)`","`ctx.fillRect(20, 10, 30, 40)`","`ctx.fillRect(40, 30, 10, 20)`","`ctx.arc(30, 40, 20, 10)`","A ordem de `fillRect` é `(x, y, largura, altura)`: primeiro a posição, depois o tamanho."],["Qual propriedade escolhe a cor usada nas próximas formas?","`ctx.fillStyle`","`ctx.color`","`ctx.penColor`","`ctx.paint`","Você define `fillStyle` e depois pinta com `fillRect` ou `arc`. A cor vale até você mudá-la de novo."],["Qual método do `ctx` desenha círculos?","`arc`","`circle`","`round`","`fillCircle`","O `arc` desenha um arco. Com o ângulo indo de 0 a `Math.PI * 2`, ele fecha um círculo inteiro."]],"Coordenadas":[["Para que lado o `y` cresce no canvas?","Para baixo","Para cima","Para a direita","Para a esquerda","É o contrário da matemática da escola: o `y` aumenta conforme você desce na tela."],["Onde fica o ponto (0, 0)?","No canto superior esquerdo","No centro da tela","No canto inferior esquerdo","No canto superior direito","A origem fica no canto superior esquerdo. O `x` cresce para a direita e o `y` cresce para baixo."],["Num canvas de 480 × 240, onde está o ponto com `x = 0` e `y = H`?","No canto inferior esquerdo","No canto superior esquerdo","No canto inferior direito","No centro da tela","`x = 0` é a borda esquerda, e `y = H` (240) é a borda de baixo."]],"Animação":[["Qual fórmula faz um objeto andar igual em qualquer computador?","`posição += velocidade * dt`","`posição += velocidade`","`posição = velocidade / dt`","`posição += dt`","A velocidade é em pixels por segundo. Multiplicada pelo `dt`, ela vira o deslocamento daquele quadro."],["O que o parâmetro `dt` do `loop` guarda?","O tempo, em segundos, desde o quadro anterior","A quantidade de quadros por segundo","A duração total do jogo","A distância que o objeto andou","Em um jogo a 60 quadros por segundo, o `dt` fica perto de 0,016."],["O que é animar, na prática?","Desenhar, limpar e desenhar de novo, muitas vezes por segundo","Desenhar uma vez e deixar o navegador mexer a imagem","Trocar o arquivo HTML a cada segundo","Desenhar sempre sem nunca limpar a tela","A cada quadro, o `loop` atualiza as posições, limpa a tela e desenha tudo de novo na nova posição."]],"Teclado":[["O que `keys.ArrowLeft` guarda?","`true` enquanto a seta esquerda estiver pressionada","Quantas vezes a seta esquerda foi apertada","Por quanto tempo a tecla ficou apertada","O nome da última tecla apertada","O objeto `keys` só diz quais teclas estão apertadas agora."],["Qual dupla de funções segura o herói dentro da tela?","`Math.max` e `Math.min`","`Math.floor` e `Math.round`","`Math.sin` e `Math.cos`","`Math.random` e `Math.abs`","`Math.max` impede de passar do limite mínimo, e `Math.min` impede de passar do máximo."],["Como saber no código se a tecla Shift está apertada?","`keys.Shift`","`keys.ShiftKey`","`keys.Maiusculo`","`keys.Control`","As teclas especiais usam o nome em inglês. É assim que o desafio faz o herói correr."]],"Colisão":[["Quando dois retângulos (AABB) colidem?","Quando se sobrepõem no eixo x e no eixo y ao mesmo tempo","Quando se sobrepõem no eixo x ou no eixo y","Quando têm o mesmo tamanho","Quando os centros têm o mesmo valor de x","Se os retângulos se sobrepõem em só um dos eixos, ainda há um vão entre eles. É preciso sobrepor nos dois."],["Para o herói não atravessar a rocha, o que o desafio sugere?","Voltar à posição anterior se bater","Aumentar a velocidade do herói","Trocar a cor da rocha","Apagar a rocha quando houver colisão","Guarde a posição antes de mover. Se depois do passo houver colisão, volte para ela."],["Qual é o maior `x` que o herói pode ter para não sair pela direita da tela?","`W - largura`","`W`","`W + largura`","`H - largura`","O `x` é o canto esquerdo do herói. Para a borda direita dele caber na tela, o `x` vai até `W - largura`."]],"Depuração":[["Qual método desenha só o contorno da hitbox, sem preencher?","`strokeRect`","`fillRect`","`clearRect`","`rotate`","Desenhar o contorno por cima do jogo mostra na hora se a caixa de colisão está maior, menor ou deslocada."],["Qual é o jeito certo de calcular o FPS?","Contar os quadros e fechar a conta a cada segundo","Calcular `1 / dt` a cada quadro","Multiplicar o `dt` por 60","Medir só o tempo do último quadro","O valor de `1 / dt` oscila demais. Contando os quadros de um segundo inteiro, o número fica estável."],["Por que evitar `console.log` solto dentro do loop?","Ele roda 60 vezes por segundo e afoga o console","Ele deixa o jogo mais rápido","Ele só funciona fora do loop","Ele apaga as variáveis do jogo","Registre só quando algo muda, guardando o valor anterior e escrevendo a mensagem na transição."]],"Gravidade e pulo":[["Como a gravidade age no personagem?","Ela muda a velocidade vertical a cada quadro: `vy += gravidade * dt`","Ela soma um valor fixo direto no `y`","Ela muda o `x` do personagem","Ela zera a velocidade horizontal","A gravidade acelera: a velocidade vai aumentando, e `y += vy * dt` move o personagem."],["Que valor damos a `vy` para o personagem pular?","Um valor negativo, quando ele está no chão","Um valor positivo","Zero","O valor do `dt`","O `y` cresce para baixo, então \"para cima\" é negativo."],["Como permitir um pulo duplo?","Contar quantos pulos já foram dados desde que tocou o chão","Dobrar a gravidade","Permitir pular no ar quantas vezes quiser","Dobrar a altura da tela","O contador volta a zero quando o personagem toca o chão e limita os pulos em 2."]],"Câmera":[["O que é a câmera neste guia?","Um ponto (`cam.x`, `cam.y`) que diz que pedaço do mundo aparece na tela","Um segundo canvas que fica atrás do jogo","Uma imagem de fundo que se repete","Um tipo de sprite","Quando o mundo é maior que a tela, a câmera escolhe qual pedaço dele aparece."],["Como desenhar o mundo com a câmera?","`ctx.translate(-cam.x, -cam.y)`","`ctx.translate(cam.x, cam.y)`","`ctx.rotate(cam.x)`","`ctx.scale(cam.x, cam.y)`","O sinal é negativo: se a câmera anda para a direita, o mundo \"anda\" para a esquerda."],["Como deixar a câmera mais suave, segundo o desafio?","Mover só uma fração (10%) da distância até o alvo a cada quadro","Mover o dobro da distância a cada quadro","Pular direto para o alvo","Mover 1 pixel por segundo","Quanto mais perto do alvo, menor o passo: a câmera desacelera e chega suave."]],"Ângulos e mira":[["Qual função devolve o ângulo entre o canhão e o alvo?","`Math.atan2(dy, dx)`","`Math.hypot(dx, dy)`","`Math.sin(dx)`","`Math.round(dy / dx)`","Com `dx` e `dy`, o `atan2` devolve o ângulo em radianos. O `hypot` dá a distância."],["Dado o ângulo, qual função dá a parte horizontal da direção?","`Math.cos(angulo)`","`Math.sin(angulo)`","`Math.tan(angulo)`","`Math.atan2(angulo)`","O `cos` dá a parte horizontal e o `sin` dá a vertical. Multiplicadas pela velocidade, elas fazem o tiro seguir a mira."],["Em radianos, 180° equivale a quê?","`Math.PI`","`Math.PI * 2`","`180`","`Math.PI / 2`","Uma volta completa (360°) é `Math.PI * 2`, e meia volta é `Math.PI`."]],"Sprites e animação":[["Como o Mario é guardado neste capítulo?","Como uma matriz de letras, em que cada letra é uma cor da paleta","Como um arquivo PNG na pasta assets","Como uma lista de círculos coloridos","Como um vídeo curto em loop","A matriz vira uma imagem pequena uma única vez (`criarQuadro`) e depois é desenhada ampliada com `drawImage`."],["O que mantém os pixels nítidos ao ampliar o sprite?","`imageSmoothingEnabled = false`","`imageSmoothingEnabled = true`","`ctx.sharpen()`","`ctx.pixelated = true`","Com a suavização ligada, o navegador borra a imagem ampliada. Desligada, cada pixel vira um quadradinho."],["Como espelhar o personagem ao andar para a esquerda?","`ctx.scale(-1, 1)`","`ctx.scale(1, -1)`","`ctx.rotate(Math.PI / 2)`","`ctx.translate(-1, 1)`","Escala negativa no eixo x inverte a imagem na horizontal. Com `(1, -1)` ela viraria de cabeça para baixo."]],"Spritesheet e estados":[["Numa folha com quadros de 32 pixels de largura, em que `x` começa o quadro número `n`?","`n * 32`","`n + 32`","`n * 48`","`32 / n`","Quadros do mesmo tamanho ficam lado a lado, então o quadro `n` começa em `n * 32`. Esse é o `sx` do `drawImage` de 9 argumentos."],["Para que serve zerar o `tempo` ao trocar de estado?","Para a nova animação começar no quadro 0, e não no meio do ciclo","Para o jogo pausar durante a troca","Para apagar a imagem anterior","Para o personagem parar de se mexer","O quadro vem de `Math.floor(tempo * fps) % n`. Sem zerar o tempo, a corrida poderia começar em qualquer ponto."],["Por que o pulo escolhe o quadro pela velocidade vertical (`vy`), e não por um relógio?","Assim a animação acompanha a física, mesmo que o pulo seja mais alto ou mais baixo","Porque o relógio não funciona no ar","Porque a folha do pulo tem um quadro só","Porque o `vy` é sempre zero durante o pulo","Subindo é o quadro 0, no topo é o 1, caindo é o 2. Por isso o `fps` do pulo é 0."]],"Física simples":[["O que acontece com a velocidade ao bater numa parede vertical?","O `vx` é invertido","O `vy` é invertido","Os dois viram zero","O `vx` dobra","Parede vertical inverte o `vx`. Parede horizontal inverte o `vy`."],["O que `ELASTICIDADE = 0.8` significa?","A bola perde 20% da velocidade a cada batida","A bola ganha 20% de velocidade a cada batida","A bola para depois de 8 batidas","A bola quica durante 0,8 segundo","A velocidade é multiplicada por 0,8 a cada batida. Com 1 o ricochete é perfeito."],["Qual conta aplica o atrito sem depender do FPS?","`vx *= Math.exp(-ATRITO * dt)`","`vx *= ATRITO`","`vx -= ATRITO`","`vx = ATRITO * dt`","Com `Math.exp` e o `dt`, a freada tem o mesmo efeito por segundo em qualquer taxa de quadros."]],"Colisão avançada":[["Como saber se um círculo bate num retângulo?","Achar o ponto do retângulo mais perto do centro e ver se a distância até ele é menor que o raio","Conferir só se o centro do círculo está dentro do retângulo","Comparar a largura do retângulo com o diâmetro do círculo","Comparar só os valores de `x` dos dois centros","Esse ponto mais perto sai de `limitar` aplicado ao centro do círculo, e a distância até ele diz se houve batida."],["Depois de detectar a colisão, como tirar um objeto de dentro do outro?","Empurrando pelo menor deslocamento que desfaz a sobreposição","Empurrando sempre para cima","Levando o objeto de volta ao início","Empurrando até a borda da tela","Empurrar pelo caminho mais curto faz o jogador deslizar pela parede, em vez de grudar nela."],["Por que o último passo do caixote faz o jogador recuar?","Sem ele, empurrar a caixa contra a parede faria o jogador atravessá-la","Para o caixote ganhar velocidade","Para o caixote girar ao ser empurrado","Para o jogador poder pular em cima do caixote","Se a parede barra o caixote, ele pode ficar dentro do jogador. Recuar o jogador resolve isso."]],"Inteligência dos inimigos":[["Quais são os estados do inimigo neste capítulo?","Patrulhar, perseguir e fugir","Dormir, comer e atacar","Parado, andando e pulando","Ligado, desligado e pausado","Uma máquina de estados por inimigo. A cor e o texto sobre ele mostram o estado atual."],["No A*, o que significa `f = g + h`?","`g` é o custo já percorrido e `h` é a estimativa até o alvo","`g` é a estimativa até o alvo e `h` é a vida do inimigo","`g` é a gravidade e `h` é a altura do pulo","`f` é o número de quadros por segundo","O A* expande sempre o tile de menor `f`. Aqui a estimativa `h` é a distância Manhattan."],["O que acontece ao trocar a heurística `h` por 0?","O A* vira o algoritmo de Dijkstra e explora mais tiles","O inimigo para de andar","O inimigo passa a andar na diagonal","O caminho encontrado fica mais curto","Sem estimativa para guiar a busca, ela se espalha em todas as direções. O caminho continua o mais curto."]],"Aleatoriedade e mapas":[["O que `Math.random()` devolve?","Um decimal entre 0 e 1, que nunca chega a 1","Um inteiro de 1 a 10","Um decimal entre 0 e 100","Um decimal entre -1 e 1","Para sortear inteiros, o guia usa `inteiro(min, max)`, construído em cima dele."],["Como gerar a mesma masmorra de novo?","Usando uma semente com um gerador pseudoaleatório (mulberry32)","Chamando `Math.random()` duas vezes","Usando o `dt` do quadro como sorteio","Mudando o tamanho da tela","Dada a mesma semente, o gerador produz sempre a mesma sequência de números, e portanto o mesmo mapa."],["Como o gerador de masmorras liga uma sala nova às outras?","Com um corredor em L, do centro de uma ao centro da anterior","Com uma linha reta que atravessa o mapa inteiro","Com uma escada dentro de cada sala","Não liga: as salas ficam isoladas","Depois dos corredores, o herói nasce na primeira sala e a escada vai para a sala mais distante."]],"Plataforma com tilemap":[["Como converter uma posição em pixels em coluna do tile?","`Math.floor(x / T)`","`x * T`","`Math.floor(x * T)`","`x % T`","Dividir pelo tamanho do tile e arredondar para baixo dá a coluna. Assim só se olham os tiles sob a caixa do jogador."],["Por que a colisão é feita um eixo de cada vez?","Para saber de que lado foi a batida","Porque o canvas só aceita um eixo por vez","Para economizar memória","Para o personagem não poder pular","Movendo X e resolvendo, depois Y e resolvendo, fica claro se foi uma parede, o chão ou o teto."],["O que é o coyote time?","Uma tolerância de uns 0,1 s para ainda poder pular logo depois de sair da borda","Um inimigo que persegue o jogador","Um pulo duplo","Um atalho de teclado para reiniciar a fase","O jogo guarda esse tempo numa variável e aceita o pulo enquanto ele for maior que zero."]],"Mapas do Tiled":[["Por que as camadas do mapa são pintadas uma vez só numa imagem grande?","Para não redesenhar centenas de tiles a cada quadro: o jogo só recorta o pedaço que a câmera mostra","Porque o Tiled só exporta imagens","Porque o canvas não aceita mais de 10 desenhos por quadro","Para o mapa poder girar","Cada camada tem 600 tiles. Recortar de uma imagem só também evita frestas entre os tiles quando a tela é ampliada."],["Como achar o tile na imagem do tileset a partir do `gid`?","`k = gid - firstgid`: coluna `k % columns` e linha `Math.floor(k / columns)`","Coluna `gid * columns` e linha `gid / columns`","Coluna `Math.floor(k / columns)` e linha `k % columns`","O `gid` já é a posição x do tile em pixels","O `gid` conta a partir de 1, e o 0 é célula vazia."],["Por que a página precisa ser aberta por um servidor local?","Por segurança, o navegador não deixa uma página aberta como arquivo (`file://`) ler outros arquivos com `fetch`","Porque o Tiled só funciona online","Porque o arquivo .tmx é criptografado","Porque o canvas não desenha PNG fora de um servidor","Rode `python -m http.server` na pasta do guia e abra `http://localhost:8000`."]],"Y Sorting":[["Qual é a regra do pintor no Y Sorting?","Ordenar tudo pelo `y` da base, do menor para o maior, e desenhar nessa ordem","Desenhar sempre o personagem primeiro","Ordenar pelo topo da imagem, do maior para o menor","Desenhar só o que está mais perto da câmera","Quem está mais acima vai primeiro, e quem está mais abaixo vai por último e cobre os outros."],["O que é a \"base\" de um objeto na ordenação?","O ponto em que ele toca o chão: o pé do tronco, os pés do coelho","O topo da imagem","O centro da imagem","A primeira coluna do tileset","Para a árvore é a borda de baixo dos tiles dela. Para o coelho, `p.y + p.h`."],["Por que uma árvore de vários tiles é agrupada num objeto só antes de ordenar?","Se cada tile fosse ordenado sozinho, o coelho poderia ficar na frente de uma parte da árvore e atrás de outra","Para a árvore ocupar menos memória","Para a árvore poder se mover","Porque o Tiled não aceita tiles soltos","A função `agruparObjetos` junta os tiles vizinhos com uma busca em área (flood fill)."]],"Labirintos e cavernas":[["Qual algoritmo gera o labirinto?","Busca em profundidade, com uma pilha","Busca em largura","Autômato celular","A*","Ele parte de uma célula, derruba a parede até um vizinho fechado e segue. Sem vizinho livre, volta um passo pela pilha."],["Qual é a regra do autômato celular que gera a caverna?","O tile vira parede se 5 ou mais dos 9 tiles ao redor (contando ele mesmo) forem parede","O tile vira chão se algum vizinho for chão","O tile muda de cor a cada rodada","O tile vira parede se a linha dele for par","Repetindo a regra em algumas rodadas, pontos soltos desaparecem e o ruído vira cavernas de borda orgânica."],["Onde o gerador coloca a escada de saída?","No último tile alcançado pela busca em largura a partir do início, o mais distante","No tile mais perto do início","Num tile sorteado, sem conferir o caminho","No centro do mapa","A busca em largura conta os passos até cada tile, e esse número aparece na tela."]],"Névoa de guerra e visão":[["Quais são os três estados de cada tile na névoa de guerra?","Nunca visto, explorado e visível","Aceso, apagado e queimado","Parede, chão e escada","Perto, médio e longe","Nunca visto é preto, explorado é bem escuro e visível aparece à vista neste instante."],["Qual das duas matrizes é a memória do mapa?","`visto`: só recebe `true` e nunca volta atrás","`visivel`: guarda o que já foi visto para sempre","As duas são zeradas a cada quadro","Nenhuma: o jogo não guarda memória","A `visivel` é zerada e recalculada a cada quadro. A `visto` acumula."],["Por que o guarda só aparece enquanto o tile dele está à vista?","Ele se move: desenhá-lo fora da vista mostraria uma posição velha, que já não é verdade","Porque o guarda é mais lento que a rupia","Para o jogo rodar mais rápido","Porque o guarda não tem sprite","A rupia fica parada, então o jogo pode lembrar dela depois que você a viu."]],"Ruído e terreno":[["Por que usamos ruído de Perlin, e não `Math.random()` em cada tile, para criar um terreno?", "O ruído de Perlin varia devagar: tiles vizinhos têm valores parecidos, e o terreno fica suave", "Porque `Math.random()` não funciona em mapas grandes", "Porque o ruído de Perlin é sempre igual, sem nenhuma aleatoriedade", "Porque `Math.random()` só sorteia números inteiros", "`Math.random()` por tile dá um chuvisco, com uma montanha ao lado do mar. O ruído mistura valores de uma grade com uma curva suave, então a altura muda aos poucos. E, com a mesma semente, o mundo se repete."], ["O que cada oitava a mais faz no ruído fractal (`fbm`)?", "Soma mais detalhe: ela tem o dobro da frequência e metade da força da anterior", "Dobra o tamanho do mapa", "Troca a semente do mundo", "Aumenta todas as montanhas por igual", "A primeira oitava desenha os continentes, e as seguintes acrescentam morros e pedras, cada vez menores e mais fracos. Com 1 oitava o terreno é liso, e com 8 ele fica rugoso."], ["Como o mapa ganha mar em volta, formando uma ilha?", "Subtrai-se da altura um valor que cresce com a distância ao centro, e assim as bordas afundam", "Pintando de azul as bordas do canvas", "Sorteando as bordas com `Math.random()`", "Usando menos oitavas nas bordas", "O ruído não conhece as bordas do mapa. Fazer `alt -= ILHA * d * d` afunda a terra quanto mais longe do centro. Com `ILHA = 0`, o terreno vai até a borda."]],"Minimapa":[["Como converter a posição do jogador no mundo (em pixels) para um ponto do minimapa?", "Dividir por `T` (pixels viram tiles), multiplicar pela escala `e` e somar o canto do minimapa", "Somar a posição da câmera", "Multiplicar por `T`", "Subtrair o tamanho da tela", "`x / T` dá a coluna do tile, e `e` diz quantos pixels cada tile ocupa na tela. Depois soma-se o canto `mx` do minimapa."], ["Por que o minimapa é uma imagem pequena, pintada só quando um tile é descoberto?", "A cada quadro o jogo só amplia a imagem com `drawImage`, em vez de redesenhar todos os tiles", "Porque o canvas não consegue desenhar retângulos pequenos", "Para o minimapa mostrar também o que nunca foi visto", "Porque a câmera só aceita imagens", "Pintar 1 pixel por tile descoberto é trabalho feito uma vez. Ampliar a imagem pronta a cada quadro é barato."], ["O que o retângulo branco do minimapa mostra?", "O pedaço do mundo que a câmera está mostrando na tela", "A área de visão (o raio) do jogador", "O caminho que o jogador já andou", "A posição do guarda mais próximo", "Ele fica em `cam.x / T * e` e tem tamanho `W / T * e` por `H / T * e`. O raio de visão controla a névoa, não esse retângulo."]],"Raycasting":[["Por que o jogo lança um raio para cada coluna da tela?", "Cada coluna mostra uma faixa vertical de parede, e a altura dela depende da distância em que o raio daquela coluna bateu", "Porque o canvas só consegue desenhar em colunas", "Para contar quantas paredes existem no mapa", "Porque cada raio calcula a cor do teto", "Com 480 colunas, são 480 raios. Cada um volta com uma distância, e a altura da faixa é `H / distância`: perto é alto, longe é baixo."], ["O que o DDA faz de diferente de andar o raio aos pouquinhos?", "Salta direto de linha em linha da grade, sempre pela mais próxima, até achar uma parede", "Pula a casa em que o jogador está", "Troca o mapa por uma imagem", "Desenha a parede com textura", "Ele sabe a distância até a próxima linha vertical e a próxima horizontal, então não precisa testar pontos no meio das casas. Poucos saltos por raio, e o resultado é exato."], ["Para que serve multiplicar a distância por `Math.cos(desvio)`?", "Corrige o olho de peixe: usa a distância perpendicular à tela, e as paredes retas ficam retas", "Faz as paredes ficarem mais escuras", "Gira o jogador de frente para a parede", "Calcula o ângulo da rupia", "Sem a correção, as colunas dos lados medem uma distância maior só por estarem em ângulo. Aperte F no jogo para ver a diferença."], ["O que `Math.atan2(dy, dx) - jogador.a` dá para uma rupia?", "O ângulo dela em relação ao olhar, que diz em que coluna da tela ela aparece", "A distância até a rupia", "O tamanho da rupia na tela", "A cor da rupia", "`atan2` dá o ângulo da direção do jogador até a rupia. Tirando o ângulo do olhar, sobra o desvio em relação ao centro da tela, e `tan(ângulo) / tan(FOV / 2)` converte isso em coluna."]],"Estados do jogo":[["Como o jogo organiza tela de título, pausa e fim?","Com uma variável `estado` que guarda o nome da tela atual","Com um arquivo HTML para cada tela","Com um loop separado para cada tela, todos rodando ao mesmo tempo","Com uma lista de imagens","A cada quadro, o loop olha o `estado` e decide o que atualizar e o que desenhar. Trocar de tela é mudar o valor."],["Para que serve a função `apertou`?","Detectar o momento em que a tecla foi apertada, comparando com o quadro anterior","Contar quantas teclas existem no teclado","Detectar se a tecla foi solta","Aumentar a velocidade ao apertar","O objeto `keys` só diz se a tecla está segurada. A comparação com o quadro anterior pega o instante do toque."],["O que aconteceria sem essa comparação ao apertar P para pausar?","A pausa ligaria e desligaria várias vezes por segundo","O jogo travaria na tela de título","A tecla P não seria detectada","O jogo ficaria mais rápido","Com a tecla segurada, a condição seria verdadeira em todos os quadros e o estado ficaria alternando."]],"Som com Web Audio":[["Qual é a cadeia de um som na Web Audio API?","Um `oscillator` ligado a um `gain` (volume), ligado à saída `audio.destination`","Um `gain` ligado direto à tela","Um arquivo MP3 ligado ao `ctx`","Um `audio.destination` ligado a um `canvas`","O oscillator gera a onda numa frequência em Hz (440 é o Lá), e o gain controla o volume."],["Qual timbre dá o som de videogame antigo?","`'square'`","`'sine'`","`'sawtooth'`","`'noise'`","A `sine` é suave, e a `sawtooth` é áspera. A `square` é o som clássico dos consoles antigos."],["Por que é preciso clicar na tela antes de ouvir os sons?","O navegador só libera o áudio depois que a pessoa clica ou aperta uma tecla","Porque o som é baixado de um arquivo no primeiro clique","Porque o volume começa sempre em zero","Porque o oscillator só funciona com o mouse","É uma regra dos navegadores, para evitar páginas que tocam som sozinhas."]],"Salvar progresso":[["O que o `localStorage` consegue guardar?","Apenas texto, que continua lá depois de fechar a página","Objetos prontos, sem precisar converter","Só números","Dados que somem quando a aba é fechada","Por isso objetos precisam virar texto antes de serem salvos."],["Como guardar e recuperar um objeto no `localStorage`?","`JSON.stringify` ao salvar e `JSON.parse` ao carregar","`JSON.parse` ao salvar e `JSON.stringify` ao carregar","`toString()` ao salvar e `Number()` ao carregar","Não precisa converter nada","`stringify` transforma o objeto em texto, e `parse` volta de texto para objeto."],["Quando é o momento certo de salvar o progresso?","Em momentos como fase concluída ou fim de jogo, e não a cada quadro","A cada quadro, para nunca perder nada","Só quando a pessoa fecha a página","Nunca: o navegador salva sozinho","O código também usa `try/catch` (o armazenamento pode estar bloqueado) e confere os valores lidos."]],"Diálogos e menus":[["Numa fala da conversa, o que indica qual é a próxima fala?","O campo `vai`, com o nome da próxima fala. Sem ele, a conversa termina","O campo `quem`","A ordem em que as falas foram escritas no código","O tempo que a fala demora para aparecer","Com `escolhas`, cada opção tem o seu próprio `vai`. É isso que forma a árvore de diálogo."],["Por que o contador `mostrados` é um número decimal?","A 60 quadros por segundo, 30 letras por segundo é meia letra por quadro, e o contador acumula","Porque o `slice` só aceita decimais","Para as letras aparecerem espelhadas","Porque cada letra tem largura decimal","Ele sobe `VEL * dt` por quadro. O `Math.floor` diz quantas letras já podem aparecer."],["Qual conta faz o cursor do menu dar a volta ao apertar ↑ no primeiro item?","`(sel + n - 1) % n`","`sel - 1`","`(sel + 1) % n`","`Math.max(0, sel - 1)`","Com `sel = 0`, a conta dá `n - 1`: o último item. Com `sel - 1` o índice ficaria negativo."]],"Partículas e Asteroids":[["Como se removem as partículas que acabaram?","Diminui-se a vida de cada uma e usa-se `filter` para ficar só com as que ainda vivem","Com `unshift` no começo da lista","Zerando a lista inteira a cada quadro","Elas somem sozinhas do canvas","Ao desenhar, a transparência (`globalAlpha`) e o tamanho acompanham a vida restante."],["Por que o empuxo soma `cos(ang)` e `sin(ang)` à velocidade, e não à posição?","Isso dá inércia: a nave continua deslizando depois que a tecla é solta","Para a nave ficar mais lenta","Para a nave poder voltar pelo lado oposto da tela","Para o tiro sair mais rápido","O `ATRITO` do espaço é pequeno. Com 0, a inércia é pura."],["Qual conta faz a nave voltar pelo lado oposto da tela, até com valores negativos?","`((v % max) + max) % max`","`v % max`","`Math.max(v, max)`","`v - max`","Em JavaScript, `-5 % 480` dá -5. Somar `max` e tirar o resto de novo conserta isso."]],"Snake":[["Como a cobra anda, na lista de segmentos?","Cria-se uma nova cabeça na frente com `unshift` e remove-se o último segmento com `pop`","Todos os segmentos mudam de posição juntos","Só a cabeça existe, e o corpo é um desenho","Move-se o rabo para a frente da lista com `shift`","Os segmentos do meio nem se mexem: a cobra anda porque a lista muda."],["Como a cobra cresce ao comer?","Naquele passo, o rabo não é removido","A velocidade dobra","Um segmento é adicionado no meio da lista","A grade fica menor","Sem o `pop`, a lista fica com um segmento a mais."],["Por que o tempo anda em passos fixos, com um acumulador?","Para a cobra dar um passo a cada intervalo, qualquer que seja a taxa de quadros","Para economizar bateria","Para a cobra andar na diagonal","Porque o canvas só desenha a cada segundo","O acumulador soma o `dt`. O intervalo diminui conforme a cobra cresce, e por isso o jogo acelera."]],"Invasores":[["Ao trocar os retângulos por sprites, o que muda na colisão?","Nada: cada inimigo continua sendo um objeto com `x`, `y`, `w` e `h`, e só o desenho mudou","A colisão passa a comparar os pixels das imagens","Cada sprite precisa de uma função de colisão própria","A colisão deixa de ser necessária","Em vez de `fillRect`, o `drawImage` pinta a imagem dentro da mesma caixa."],["O que os inimigos fazem ao tocar a borda da tela?","Descem e mudam de direção","Voltam ao ponto inicial","Somem da tela","Atiram na nave","Esse é o comportamento clássico do Space Invaders."],["Por que a caixa de colisão da nave (`CORPO`) é menor que o quadro da imagem?","O desenho tem espaço vazio em volta, e só o corpo da nave deve contar na colisão","Para a nave ficar mais rápida","Porque o quadro tem sempre 5 colunas","Para economizar memória","O quadro é desenhado deslocado, para o corpo cair dentro da caixa."]],"Battle Tanks":[["Como o tijolo some quando um tiro o acerta?","O `b` da matriz do mapa é trocado por `.`","Um retângulo da cor do fundo é desenhado por cima","O canvas inteiro é apagado","O tanque inimigo remove o tijolo","Como a matriz é editável, mudar o valor da célula muda o mapa. A pedra (`#`) é indestrutível."],["Para que serve o par `(dx, dy)` de cada tanque?","Guarda para onde ele está virado: serve para desenhar o canhão e para dar a direção do tiro","Guarda a posição do tanque na grade","Guarda a vida e a velocidade","Guarda o ângulo da câmera","O tiro sai na direção do `(dx, dy)` do tanque que atirou."],["Qual função calcula a distância em linha reta até o jogador?","`Math.hypot`","`Math.atan2`","`Math.max(dx, dy)`","`Math.round`","O `Math.hypot(dx, dy)` dá a distância. O `atan2` dá o ângulo."]],"Jogo final":[["O que caracteriza um pisão que derrota o inimigo?","O jogador está caindo (`vy > 0`) e, no quadro anterior, os pés estavam acima do meio do inimigo","Qualquer encontro entre as caixas dos dois","O jogador apertar Espaço ao encostar","O inimigo estar parado","Qualquer outro encontro é dano: o jogador perde uma vida."],["Como funciona o parallax dos fundos?","Os fundos mais distantes andam mais devagar que a câmera","Os fundos andam mais depressa que a câmera","Os fundos ficam parados","Os fundos giram em volta do jogador","Quanto menor o número em `PARALAXE`, mais longe parece estar a camada."],["Para que serve a invulnerabilidade logo depois de levar dano?","Para novos golpes não contarem por um tempo, senão um inimigo encostado tiraria todas as vidas em poucos quadros","Para o jogador poder voar","Para o jogo pular para o próximo mapa","Para os inimigos ficarem mais lentos","O jogador pisca para avisar, e ainda pode pisar nos inimigos."]],"Gerador de Sons":[["O que acontece com o tom quando a frequência final é diferente da inicial?", "O tom desliza de uma até a outra durante o som, como no laser ou no pulo", "O som toca duas vezes, uma em cada frequência", "O volume muda de acordo com a diferença", "O navegador troca o tipo de onda", "No código, `exponentialRampToValueAtTime` leva a frequência de `freq` até `fim` durante a duração. É o mesmo parâmetro `fim` da função `nota()`."], ["Para que serve o envelope (ataque, sustentação e decaimento)?", "Controla o volume ao longo do tempo: sobe, segura e desce quase a zero, sem estalo", "Escolhe o tipo de onda", "Controla a velocidade do vibrato", "Corta os graves do som", "Ele é uma rampa de volume no `GainNode`. Terminar em um valor bem pequeno (e não em zero) evita o estalo no fim do som."], ["Por que o ruído branco serve para explosões e batidas?", "Ele mistura todas as frequências ao acaso, sem um tom definido, como um estrondo", "É o tipo de onda mais agudo", "É sempre mais alto que as outras ondas", "Só o ruído aceita filtros", "As ondas têm um tom claro. O ruído não tem, então soa como estouro e chiado, e os filtros ajudam a moldá-lo (um passa-baixa deixa a explosão mais grave)."]],"Editor de Mapas":[["Por que o mapa é guardado como uma lista de textos, uma linha para cada fileira?", "É fácil de ler e de escrever no código, e `MAPA[l][c]` dá o tile da linha `l`, coluna `c`", "Porque o canvas só aceita texto", "Porque letras ocupam menos memória que números", "Porque o JavaScript não tem listas de números", "Cada letra é um tile. Para achar o tile de uma casa, basta usar a linha e a coluna como índices, e o texto ainda dá para escrever e conferir a olho."], ["Como o editor descobre que uma rupia não pode ser alcançada?", "Faz uma busca em largura a partir do Início, só por casas que não são parede, e vê se chegou nela", "Mede a distância em linha reta entre o Início e a rupia", "Conta quantas paredes existem no mapa", "Pede para o jogador testar o mapa antes", "A busca espalha pelo chão a partir do Início, como no capítulo Labirintos e cavernas. O que ela não toca está preso atrás de paredes."], ["Por que o botão Abrir na Névoa recusa um mapa maior que 30 × 15?", "Porque esse capítulo não tem câmera: a tela de 480 × 240 mostra só 30 × 15 tiles de 16 pixels", "Porque o capítulo só aceita mapas quadrados", "Porque a busca em largura não funciona em mapas grandes", "Porque o localStorage guarda só 30 linhas", "Sem câmera, o que passa da tela fica invisível. O Minimapa tem câmera, então aceita mapas maiores."]],"Pixel Art":[["Por que, ao ampliar um desenho pequeno no canvas, usamos `imageSmoothingEnabled = false`?", "Para os pixels continuarem nítidos, em vez de ficarem borrados", "Para o desenho carregar mais depressa", "Para o canvas aceitar imagens maiores", "Para as cores ficarem mais fortes", "Com a suavização ligada, o navegador mistura as cores vizinhas ao ampliar e o pixel art fica embaçado. Desligada, cada pixel vira um quadradinho bem definido."], ["O que faz o balde (flood fill) na ferramenta de pixel art?", "Pinta a região de pixels vizinhos que têm a mesma cor do pixel clicado", "Pinta a imagem inteira com a cor escolhida", "Troca a cor escolhida em todos os lugares do desenho, mesmo longe do clique", "Pinta só o pixel em que você clicou", "O flood fill parte do pixel clicado e se espalha pelos vizinhos de mesma cor, parando nas bordas. É a mesma ideia usada no capítulo Labirintos e cavernas."], ["Como a ferramenta organiza os quadros ao exportar uma spritesheet?", "Lado a lado numa linha só, todos do mesmo tamanho", "Empilhados numa coluna, cada um com um tamanho", "Um sobre o outro, misturados num quadro só", "Cada quadro vira um arquivo de texto separado", "É o mesmo formato das folhas do capítulo Spritesheet e estados: o quadro de número n começa em n vezes a largura de um quadro."]],"Luz e sombras":[["Qual é a ideia central para calcular a sombra de uma tocha?","Lançar raios a partir da tocha: o que o raio alcança está iluminado, e depois da parede em que ele para fica na sombra","Pintar de preto um quadrado atrás de cada parede","Comparar a cor de cada pixel com a cor da tocha","Desenhar a sombra num editor e carregar a imagem no jogo","Uma luz ilumina o que ela enxerga. Os pontos onde os raios param formam o polígono de luz, e o que fica fora dele é sombra."],["O que o `'multiply'` faz ao juntar o mapa de luz com a cena?","Multiplica cada pixel da cena pela luz: branco deixa como está e preto escurece","Soma as cores da cena e da luz, clareando tudo","Troca a cena pelo mapa de luz","Desenha a luz só dentro das paredes","Luz laranja, por exemplo, mantém o vermelho e reduz o azul, e por isso a cena fica com cor de tocha. Já o `'lighter'` é o que soma as luzes entre si, dentro do mapa de luz."],["Como as bordas das sombras ficam macias, com penumbra?","Cada luz é desenhada várias vezes, a partir de pontos um pouco diferentes, cada vez com uma fração da força","Aumentando o número de raios para 3600","Pintando uma linha branca na borda da sombra","Diminuindo o `alcance` da luz","Onde as amostras concordam, a luz é inteira; onde discordam, na borda, ela fica pela metade. Com `SUAVE = 1` a sombra volta a ser dura."]],"Mini RPG":[["Por que a folha do jogador não tem linhas para a esquerda?", "Porque a esquerda é a direita espelhada com `scale(-1, 1)`, e assim o arquivo fica com metade das linhas", "Porque o canvas não consegue desenhar para a esquerda", "Porque o personagem só pode andar para a direita", "Porque o Tiled não aceita linhas para a esquerda", "As folhas têm baixo, direita e cima. Ao olhar para a esquerda, o código espelha o quadro da direita no eixo x."], ["Quando o golpe do jogador acerta um inimigo?", "Quando a caixa do golpe, criada na frente do jogador na metade da animação, sobrepõe a caixa do corpo do inimigo", "Quando o jogador aperta a tecla de ataque, em qualquer lugar do mapa", "Quando os pés do jogador tocam os pés do inimigo", "Quando o inimigo está a menos de 1 pixel do jogador", "A caixa do golpe aparece para o lado em que o jogador olha, e o teste de sobreposição é o mesmo `sobrepoe` do capítulo Colisão."], ["Por que cada ator tem duas caixas, a dos pés e a do corpo?", "Os pés colidem com paredes, para a cabeça poder passar por cima das árvores, e o corpo é onde o golpe acerta", "Para o ator ocupar o dobro de espaço no mapa", "Para o jogo rodar mais depressa", "Porque o Tiled exige duas caixas por objeto", "Uma caixa baixa nos pés deixa o jogador passar por trás das copas. Já o golpe precisa acertar o corpo inteiro, que é mais alto."], ["Por que o inimigo só usa o A* quando há algo entre ele e o jogador?", "Em campo aberto ir reto é mais simples e suave, e o A* só entra quando a linha reta bate em alguma coisa", "Porque o A* só consegue calcular linhas retas", "Porque o A* não enxerga paredes nem árvores", "Para o inimigo andar mais devagar perto do jogador", "A função `linhaLivre` anda a caixa do inimigo pelo trajeto, usando a mesma colisão dos pés. Se não bater em nada, ele vai reto. Se bater, segue a rota do A* pelos centros dos tiles."]],"RPG de Tabuleiro":[["Por que o desenho do jogador desliza até o tile, se o movimento é de tile em tile?", "A posição lógica (c, l) muda de uma vez e o desenho (x, y) só anda até ela: o jogo fica suave sem perder a regra de tabuleiro", "Porque o jogador anda pixel a pixel e o tile é só um enfeite", "Porque o canvas não consegue desenhar exatamente em cima de um tile", "Para o inimigo poder atravessar o jogador", "As regras (parede, ocupação, turnos) usam só a coluna e a linha. O deslize é apenas visual, e o jogo espera ele terminar antes da próxima jogada."], ["Quando um ataque acerta, no combate com dados?", "Quando d20 + bônus de ataque alcança a CA do alvo (20 natural sempre acerta e 1 natural sempre erra)", "Quando o d20 é maior que a vida do alvo", "Sempre que o atacante está num tile vizinho", "Quando o d20 sai com número par", "A CA (classe de armadura) é a dificuldade de acertar. O dano só é rolado depois do acerto, com os dados e o bônus da ficha, e dobra num crítico."], ["Como o inimigo acha o caminho até o jogador?", "Com uma busca em largura pelos tiles livres, dando o primeiro passo do caminho até um tile vizinho do jogador", "Andando em linha reta, mesmo que haja parede", "Sorteando uma direção a cada turno", "Olhando a câmera para ver onde o jogador está", "A busca espalha pelos tiles livres a partir do inimigo, e o primeiro tile do caminho mais curto é o passo dele. Paredes e outros atores não entram na busca."], ["Por que uma saída só vale quando o jogador chega ao tile dela?", "Porque ele pode nascer em cima da saída de volta, e sem essa regra voltaria ao mapa anterior na hora", "Porque o Tiled não guarda a posição das saídas", "Para o mapa carregar mais depressa", "Porque o jogador só pode usar uma saída por jogo", "Em dois mapas o ponto de nascimento fica no mesmo tile da saída. A transição só é conferida depois de um passo, então é preciso sair e entrar de novo para voltar."], ["Por que o jogo faz uma cópia do tiles.png sem a cor de fundo?", "A folha não tem transparência: sem a cópia, personagens e itens teriam um quadrado em volta e tapariam o chão", "Para o arquivo carregar mais depressa", "Para os inimigos mudarem de cor", "Porque o Tiled exige uma segunda folha", "A cor de fundo é a do pixel (0, 0). Na cópia, os pixels dessa cor viram transparentes, e o chão continua usando a folha original."]],"Desenhar imagens":[["Por que o código confere img.complete e img.naturalWidth antes de chamar drawImage?", "Porque o navegador carrega a imagem em segundo plano: nos primeiros quadros ela pode ainda não estar pronta (ou o arquivo pode nem existir)", "Porque o drawImage só funciona uma vez por imagem", "Porque o canvas apaga a imagem a cada quadro", "Porque um PNG precisa ser convertido antes de ser desenhado", "Desenhar uma imagem que ainda não carregou não mostra nada (ou dá erro). Por isso o código espera e mostra uma mensagem enquanto isso."], ["A grama do fundo começa em y = 176. Qual y usamos no drawImage para a raposa pisar nela?", "CHAO - altura da raposa, porque o y da imagem é o topo dela", "CHAO + altura da raposa, porque o y cresce para baixo", "Exatamente CHAO, porque o y da imagem é o pé dela", "CHAO / 2, para centralizar a raposa", "O (x, y) do drawImage é o canto superior esquerdo. Para a base da imagem ficar em 176, o topo precisa estar 32 pixels acima: y = 176 - 32 = 144."], ["O que faz ctx.scale(-1, 1) antes de desenhar a raposa?", "Inverte o eixo horizontal, espelhando o desenho (por isso o translate antes leva a origem à borda direita)", "Diminui a imagem pela metade", "Gira a imagem em 90 graus", "Inverte o eixo vertical e deixa a imagem de cabeça para baixo", "Escala -1 no eixo x troca esquerda por direita. Como a imagem passaria a ser desenhada para a esquerda da origem, o translate prévio a coloca no lugar certo, e o restore desfaz tudo."]]};
let quizSt=Object.create(null);                    // nome do capítulo -> {o:[[..],[..],[..]], r:[marcada ou null, x3]} ou {legado:nota}
const tq=k=>(QUIZ[k]||[]).length;                          // quantas perguntas o capítulo tem
const ordemOk=(o,n)=>Array.isArray(o)&&o.length===n&&o.every(p=>Array.isArray(p)&&p.length===4&&[0,1,2,3].every(k=>p.includes(k)));
try{
  const o=JSON.parse(localStorage.getItem('guiaGames:quiz')||'{}');
  for(const k in o){
    const v=o[k];
    if(typeof v==='number'){if(v>=0&&v<=3)quizSt[k]={legado:Math.floor(v)}}                       // formato antigo: só a nota
    else if(v&&typeof v.legado==='number'){if(v.legado>=0&&v.legado<=3)quizSt[k]={legado:Math.floor(v.legado)}}
    else if(v&&tq(k)>0&&ordemOk(v.o,tq(k))&&Array.isArray(v.r)&&v.r.length===tq(k)&&v.r.every(x=>x===null||(Number.isInteger(x)&&x>=0&&x<=3)))quizSt[k]={o:v.o,r:v.r};
  }
}catch(e){}
const guardarQuiz=()=>{try{
  const o={};
  for(const k in quizSt){const s=quizSt[k];if(s.legado!==undefined||s.r.some(x=>x!==null))o[k]=s}   // só guarda o que já tem resposta
  localStorage.setItem('guiaGames:quiz',JSON.stringify(o));
}catch(e){}};
// A nota só existe com as 3 perguntas respondidas (aí a estrela e o progresso aparecem)
const notaDe=n=>{const s=quizSt[n];if(!s)return undefined;if(s.legado!==undefined)return s.legado;return s.r.every(x=>x!==null)?s.r.filter(x=>x===0).length:undefined};
const htmlQ=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/`([^`]+)`/g,'<code>$1</code>');
const embaralhar=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// Progresso: cada capítulo vale 1 ponto. Metade vem de visitar e metade da nota do quiz (nota dividida pelo total de perguntas).
// Capítulo sem quiz vale tudo só por visitar. Também atualiza o selo de nota ao lado de cada capítulo no menu.
function atualizarProgresso(){
  let soma=0,feitos=0,respondidos=0,total=0,acertos=0,maximo=0;
  CAPS.forEach(c=>{
    const visto=vistos.has(c.n),tem=!!QUIZ[c.n],nota=notaDe(c.n);
    if(visto)feitos++;
    if(tem){total++;maximo+=tq(c.n);if(nota!==undefined){respondidos++;acertos+=nota}}
    soma+=(visto?0.5:0)+(tem?0.5*(nota||0)/tq(c.n):(visto?0.5:0));
  });
  const pct=Math.round(soma/CAPS.length*100);
  $('#pf').style.width=pct+'%';$('#pct').textContent=pct+'%';
  $('#pb').setAttribute('aria-valuenow',pct);
  $('#pb').setAttribute('aria-valuetext',pct+'% (capítulos visitados e quizzes)');
  $('#pb').title='Metade de cada capítulo vem de visitá-lo e a outra metade da nota do quiz';
  $('#pq').textContent=total?'Quizzes: '+respondidos+'/'+total+' · acertos: '+acertos+'/'+maximo:'';
  document.querySelectorAll('#menu a').forEach(a=>{
    const nm=CAPS[+a.dataset.i].n,n=notaDe(nm),t=tq(nm)||3,q=a.querySelector('.qn');
    if(!q)return;
    q.textContent=n===undefined?'':n===t?'★':n+'/'+t;
    q.classList.toggle('ouro',n===t);
    q.title=n===undefined?'':'Quiz: '+n+' de '+t;
    a.classList.toggle('q',n!==undefined);
  });
}

function montarQuiz(c){
  const btn=$('#vquiz'),pan=$('#aquiz');
  if(!btn||!pan)return;
  const perguntas=QUIZ[c.n],N=perguntas.length;
  const rotulo=()=>{const n=notaDe(c.n);btn.textContent=(pan.hidden?'Ver':'Ocultar')+' quiz'+(n!==undefined?' ('+n+'/'+N+')':'')};
  btn.onclick=()=>{pan.hidden=!pan.hidden;btn.setAttribute('aria-expanded',String(!pan.hidden));rotulo()};
  const novoEstado=()=>({o:perguntas.map(()=>embaralhar([0,1,2,3])),r:perguntas.map(()=>null)});   // o: ordem embaralhada das opções

  const pintar=qi=>{                                         // mostra uma pergunta já respondida
    const q=perguntas[qi],m=quizSt[c.n].r[qi],bloco=pan.querySelector('.qq[data-q="'+qi+'"]');
    bloco.querySelectorAll('.opc').forEach(o=>{
      o.disabled=true;
      if(+o.dataset.k===0)o.classList.add('certo');else if(+o.dataset.k===m)o.classList.add('errado');
    });
    const ex=bloco.querySelector('.qexp');ex.hidden=false;
    ex.innerHTML=(m===0?'<b>Certo!</b> ':'<b>Não foi dessa vez.</b> ')+htmlQ(q[5]);
  };

  const resultado=rolar=>{                                   // linha de baixo: nota e botão Refazer
    const res=$('#qres'),st=quizSt[c.n],n=notaDe(c.n);
    const feitas=st.legado!==undefined?3:st.r.filter(x=>x!==null).length;
    if(!feitas){res.innerHTML='';return}
    const msg=st.legado!==undefined?'Resultado anterior: '+n+' de 3.':n===undefined?feitas+' de '+N+' respondidas.':
      n===N?'Perfeito! '+N+' de '+N+'.':n===N-1?'Quase lá: '+n+' de '+N+'.':n+' de '+N+'. Releia o capítulo e tente de novo.';
    res.innerHTML='<b>'+msg+'</b><button class="alt" id="qrefaz" type="button">Refazer quiz</button>';
    $('#qrefaz').onclick=()=>{                               // apaga o estado: some a nota e a estrela
      delete quizSt[c.n];guardarQuiz();
      desenhar();atualizarProgresso();
      const p=pan.querySelector('.opc');if(p)p.focus();
    };
    if(rolar)res.scrollIntoView({block:'nearest'});
  };

  const desenhar=()=>{
    if(!quizSt[c.n])quizSt[c.n]=novoEstado();
    const st=quizSt[c.n];
    const blocos=st.legado!==undefined?'':perguntas.map((q,qi)=>
      `<div class="qq" data-q="${qi}"><p class="qp"><b>${qi+1}.</b> ${htmlQ(q[0])}</p>`+
      `<div role="group" aria-label="Opções da pergunta ${qi+1}">${st.o[qi].map(k=>`<button type="button" class="opc" data-k="${k}">${htmlQ(q[1+k])}</button>`).join('')}</div>`+
      `<p class="qexp" role="status" hidden></p></div>`).join('');
    pan.innerHTML='<b>Quiz do capítulo</b> <span class="mut">('+N+' perguntas; o resultado entra no seu progresso)</span>'+blocos+
      '<div class="qres" id="qres" role="status" aria-live="polite"></div>';
    if(st.legado===undefined)perguntas.forEach((q,qi)=>{
      if(st.r[qi]!==null)pintar(qi);                         // volta como você deixou
      pan.querySelectorAll('.qq[data-q="'+qi+'"] .opc').forEach(b=>b.onclick=()=>{
        if(st.r[qi]!==null)return;
        st.r[qi]=+b.dataset.k;guardarQuiz();pintar(qi);      // k = 0 é a resposta certa
        atualizarProgresso();rotulo();resultado(st.r.every(x=>x!==null)); 
      });
    });
    resultado(false);rotulo();
  };
  desenhar();
}

// ---------- Bônus: ferramenta de Pixel Art ----------
// Aqui não há código para editar: é uma mini-ferramenta de desenho. O desenho é só uma lista com uma cor
// por pixel ('' = transparente); lápis, balde, linha, espelho e desfazer são funções que mexem nessa lista.
// O desenho fica salvo neste navegador (localStorage) e pode virar PNG, spritesheet ou matriz de texto.
function montarPixelArt(raiz){
  const TAMANHOS=[8,16,32,64], VISOR=512, MAX_QUADROS=12, MAX_CORES=32, MAX_HIST=60, CHAVE='guiaGames:pixelart';
  // Paleta inicial (Sweetie 16). A letra de cada cor é a usada em "Copiar matriz".
  const PALETA=[['K','#1a1c2c'],['P','#5d275d'],['R','#b13e53'],['O','#ef7d57'],['Y','#ffcd75'],['L','#a7f070'],['G','#38b764'],['T','#257179'],
                ['N','#29366f'],['B','#3b5dc9'],['C','#41a6f6'],['A','#73eff7'],['W','#f4f4f4'],['S','#94b0c2'],['D','#566c86'],['M','#333c57']];
  const EXTRAS='EFHIJQUVXZabcdefghijklmnopqrstuvwxyz';       // letras para as cores que você criar
  const NOMES={lapis:'Lápis',borracha:'Borracha',balde:'Balde',conta:'Conta-gotas',linha:'Linha',retangulo:'Retângulo',circulo:'Círculo'};
  const FERRAMENTAS=[['lapis','B'],['borracha','E'],['balde','G'],['conta','I'],['linha','L'],['retangulo','R'],['circulo','C']];
  const lim=(v,a,b)=>Math.max(a,Math.min(b,v));
  const vazio=n=>new Array(n*n).fill('');

  raiz.innerHTML=`
  <div class="pxa">
    <div class="box">
      <h3 class="px">QUADRO</h3>
      <div class="pxa-ferr" role="toolbar" aria-label="Ferramentas de desenho">${FERRAMENTAS.map(([id,tecla])=>
        `<button type="button" class="pt" data-t="${id}" aria-pressed="false" title="${NOMES[id]} (${tecla})">${NOMES[id]}<kbd>${tecla}</kbd></button>`).join('')}</div>
      <div class="pxa-tela"><canvas id="pxc" tabindex="0" width="512" height="512" role="img"></canvas></div>
      <div class="pxa-status" id="pxs"></div>
      <div class="pxa-quadros">
        <div class="pxa-lista" id="pxq" role="group" aria-label="Quadros da animação"></div>
        <div class="aju">
          <button type="button" class="alt" data-acao="novo">+ Quadro</button>
          <button type="button" class="alt" data-acao="dup">Duplicar</button>
          <button type="button" class="alt" data-acao="excluir">Excluir</button>
        </div>
      </div>
      <div class="pxa-msg" id="pxm" role="status"></div>
      <div class="err" id="pxe" role="alert"></div>
    </div>

    <div class="pxa-lado">
      <div class="box">
        <h3 class="px">CORES</h3>
        <div class="pxa-pal" id="pxp" role="group" aria-label="Paleta de cores"></div>
        <div class="pxa-in">
          <label class="pxa-cor">Cor personalizada <input type="color" id="pxcor" value="#1a1c2c"></label>
          <div class="pxa-atual" id="pxat"></div>
        </div>
      </div>

      <div class="box">
        <h3 class="px">PRÉVIA</h3>
        <div class="pxa-in">
          <canvas id="pxv" width="128" height="128" role="img" aria-label="Prévia do desenho no tamanho de jogo"></canvas>
          <div class="pxa-linha">
            <button type="button" class="alt" id="pxan" aria-pressed="false" data-acao="animar">▶ Animar</button>
            <label>FPS <select id="pxfps" aria-label="Quadros por segundo">${[2,4,6,8,12].map(f=>`<option value="${f}">${f}</option>`).join('')}</select></label>
          </div>
        </div>
      </div>

      <div class="box">
        <h3 class="px">OPÇÕES</h3>
        <div class="pxa-in pxa-col">
          <label><input type="checkbox" id="pxg"> Grade</label>
          <label><input type="checkbox" id="pxex"> Espelho ↔</label>
          <label><input type="checkbox" id="pxey"> Espelho ↕</label>
          <label><input type="checkbox" id="pxch"> Forma cheia</label>
          <label class="pxa-sel">Tamanho <select id="pxn">${TAMANHOS.map(t=>`<option value="${t}">${t} × ${t}</option>`).join('')}</select></label>
        </div>
      </div>

      <div class="box">
        <h3 class="px">AÇÕES</h3>
        <div class="pxa-in pxa-grade">
          <button type="button" class="pt" data-acao="desfazer" id="pxdes" title="Desfazer (Ctrl+Z)">Desfazer</button>
          <button type="button" class="pt" data-acao="refazer" id="pxref" title="Refazer (Ctrl+Y)">Refazer</button>
          <button type="button" class="pt" data-acao="limpar" title="Apaga o quadro atual">Limpar</button>
          <button type="button" class="pt" data-acao="virarh" title="Vira o quadro de lado">Virar ↔</button>
          <button type="button" class="pt" data-acao="virarv" title="Vira o quadro de cabeça para baixo">Virar ↕</button>
          <button type="button" class="pt" data-acao="girar" title="Gira 90 graus">Girar ↻</button>
          <button type="button" class="pt" data-acao="esq" aria-label="Deslocar o desenho para a esquerda" title="Desloca o desenho (o que sai de um lado volta pelo outro)">← Mover</button>
          <button type="button" class="pt" data-acao="dir" aria-label="Deslocar o desenho para a direita">Mover →</button>
          <button type="button" class="pt" data-acao="cima" aria-label="Deslocar o desenho para cima">↑ Mover</button>
          <button type="button" class="pt" data-acao="baixo" aria-label="Deslocar o desenho para baixo">Mover ↓</button>
        </div>
      </div>

      <div class="box">
        <h3 class="px">EXPORTAR</h3>
        <div class="pxa-in pxa-col">
          <label class="pxa-sel">Tamanho do PNG <select id="pxesc"><option value="1">× 1 (tamanho real)</option><option value="4">× 4</option><option value="8">× 8</option><option value="16">× 16</option></select></label>
          <button type="button" data-acao="png">⬇ Baixar PNG</button>
          <button type="button" data-acao="sheet" title="Todos os quadros lado a lado, como no capítulo Spritesheet e estados">⬇ Baixar spritesheet</button>
          <button type="button" class="alt" data-acao="matriz" title="Copia o código no formato do capítulo Sprites e animação">Copiar matriz</button>
          <input type="file" id="pxarq" accept="image/*" class="pxa-oculto">
          <label class="botao" for="pxarq">Abrir imagem…</label>
        </div>
      </div>
    </div>
  </div>`;

  // ---------- estado ----------
  let N=16, quadros=[vazio(16)], qi=0;                      // tamanho, lista de quadros (cada um é uma lista de cores) e o quadro atual
  let cor=PALETA[0][1], paleta=PALETA.map(p=>p[1]), ferr='lapis';
  let grade=true, espX=false, espY=false, cheio=false, fps=6;
  let hist=[], refaz=[];                                    // desfazer e refazer
  let arrasto=null, foco=null;                              // traço em andamento e a casa sob o cursor (mouse ou teclado)
  let anim=false, pvi=0, timer=0, tSalvar=0, tMsg=0;

  const q$=s=>raiz.querySelector(s);
  const cv=q$('#pxc'), ctx=cv.getContext('2d'), pv=q$('#pxv'), pvx=pv.getContext('2d');
  const hex=/^#[0-9a-f]{6}$/;

  // ---------- salvar e carregar (localStorage) ----------
  function carregarSalvo(){
    try{
      const d=JSON.parse(localStorage.getItem(CHAVE)||'null');
      if(!d||!TAMANHOS.includes(d.N)||!Array.isArray(d.quadros)||!d.quadros.length||d.quadros.length>MAX_QUADROS)return;
      if(!d.quadros.every(g=>Array.isArray(g)&&g.length===d.N*d.N&&g.every(v=>v===''||hex.test(v))))return;   // dado quebrado: ignora
      N=d.N; quadros=d.quadros; qi=lim(d.qi|0,0,quadros.length-1);
      if(Array.isArray(d.paleta)&&d.paleta.length<=MAX_CORES&&d.paleta.every(c=>hex.test(c)))paleta=d.paleta;
      if(hex.test(d.cor))cor=d.cor;
      if([2,4,6,8,12].includes(d.fps))fps=d.fps;
      grade=d.grade!==false; espX=!!d.espX; espY=!!d.espY; cheio=!!d.cheio;
    }catch(e){}
  }
  function salvar(){                                        // espera 0,3 s sem mudanças para gravar uma vez só
    clearTimeout(tSalvar);
    tSalvar=setTimeout(()=>{try{localStorage.setItem(CHAVE,JSON.stringify({N,qi,quadros,paleta,cor,fps,grade,espX,espY,cheio}))}catch(e){}},300);
  }

  // ---------- desfazer e refazer: guardamos "fotos" do desenho inteiro ----------
  const foto=()=>({N,qi,quadros:quadros.map(g=>g.slice())});
  function confirmar(antes){                                // chame depois de mudar algo: só entra no histórico se mudou mesmo
    const mudou=antes.N!==N||antes.quadros.length!==quadros.length||antes.quadros.some((g,i)=>g.some((v,k)=>v!==quadros[i][k]));
    if(mudou){hist.push(antes);if(hist.length>MAX_HIST)hist.shift();refaz.length=0}
    salvar();
  }
  function restaurar(f){N=f.N;qi=f.qi;quadros=f.quadros.map(g=>g.slice());foco=null;tudo()}
  function desfazer(){if(!hist.length)return;refaz.push(foto());restaurar(hist.pop());salvar()}
  function refazer(){if(!refaz.length)return;hist.push(foto());restaurar(refaz.pop());salvar()}

  // ---------- as peças do desenho ----------
  const dentro=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
  function pintarCelula(g,x,y,c){                           // pinta uma casa (e as casas espelhadas, se o espelho estiver ligado)
    const pts=[[x,y]];
    if(espX)pts.push([N-1-x,y]);
    if(espY)pts.push([x,N-1-y]);
    if(espX&&espY)pts.push([N-1-x,N-1-y]);
    pts.forEach(([a,b])=>{if(dentro(a,b))g[b*N+a]=c});
  }
  function linha(x0,y0,x1,y1,f){                            // algoritmo de Bresenham: as casas de uma reta, sem buracos
    const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1;
    let erro=dx+dy;
    for(;;){
      f(x0,y0);
      if(x0===x1&&y0===y1)break;
      const e2=2*erro;
      if(e2>=dy){erro+=dy;x0+=sx}
      if(e2<=dx){erro+=dx;y0+=sy}
    }
  }
  function retangulo(x0,y0,x1,y1,preenchido,f){
    const xa=Math.min(x0,x1), xb=Math.max(x0,x1), ya=Math.min(y0,y1), yb=Math.max(y0,y1);
    for(let y=ya;y<=yb;y++)for(let x=xa;x<=xb;x++)if(preenchido||x===xa||x===xb||y===ya||y===yb)f(x,y);
  }
  function circulo(x0,y0,x1,y1,preenchido,f){               // elipse dentro da caixa x0,y0 → x1,y1 (caixa quadrada = círculo)
    const xa=Math.min(x0,x1), xb=Math.max(x0,x1), ya=Math.min(y0,y1), yb=Math.max(y0,y1);
    const cx=(xa+xb)/2, cy=(ya+yb)/2, rx=(xb-xa+1)/2, ry=(yb-ya+1)/2;   // centro e raios da caixa
    const em=(x,y)=>{const u=(x-cx)/rx, v=(y-cy)/ry; return u*u+v*v<=1};   // o centro da casa está dentro da curva?
    for(let y=ya;y<=yb;y++)for(let x=xa;x<=xb;x++){
      if(!em(x,y))continue;
      if(preenchido||!(em(x-1,y)&&em(x+1,y)&&em(x,y-1)&&em(x,y+1)))f(x,y);   // contorno: casa dentro que tem vizinha fora
    }
  }
  function balde(g,x,y,novo){                               // flood fill: espalha a cor pelos vizinhos que têm a cor clicada
    const alvo=g[y*N+x];
    if(alvo===novo)return;
    const pilha=[[x,y]];
    while(pilha.length){
      const [a,b]=pilha.pop();
      if(!dentro(a,b)||g[b*N+a]!==alvo)continue;
      g[b*N+a]=novo;
      pilha.push([a+1,b],[a-1,b],[a,b+1],[a,b-1]);
    }
  }

  // ---------- desenhar na tela ----------
  const rgb={};                                             // guarda '#rrggbb' -> [r, g, b] para não converter toda hora
  function bitmap(g){                                       // lista de cores -> imagem N × N (1 pixel por casa)
    const oc=document.createElement('canvas'); oc.width=oc.height=N;
    const c=oc.getContext('2d'), im=c.createImageData(N,N), d=im.data;
    for(let i=0;i<g.length;i++){
      const h=g[i]; if(!h)continue;
      const v=rgb[h]||(rgb[h]=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
      d[i*4]=v[0]; d[i*4+1]=v[1]; d[i*4+2]=v[2]; d[i*4+3]=255;
    }
    c.putImageData(im,0,0);
    return oc;
  }
  const xadrez=(()=>{                                       // fundo quadriculado = "transparente" (pintado uma vez só)
    const c=document.createElement('canvas'); c.width=c.height=VISOR;
    const x=c.getContext('2d');
    for(let y=0;y<VISOR;y+=16)for(let a=0;a<VISOR;a+=16){x.fillStyle=((a+y)/16)%2?'#8d8d98':'#a5a5b0';x.fillRect(a,y,16,16)}
    return c;
  })();

  function desenhar(){
    const g=arrasto&&arrasto.previa?arrasto.previa:quadros[qi], Z=VISOR/N, bm=bitmap(g);
    ctx.imageSmoothingEnabled=false;                        // pixels nítidos ao ampliar
    ctx.drawImage(xadrez,0,0);
    ctx.drawImage(bm,0,0,VISOR,VISOR);
    if(grade&&Z>=8){
      ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=1; ctx.beginPath();
      for(let i=1;i<N;i++){const p=i*Z+0.5;ctx.moveTo(p,0);ctx.lineTo(p,VISOR);ctx.moveTo(0,p);ctx.lineTo(VISOR,p)}
      ctx.stroke();
    }
    if(espX||espY){                                         // linha rosa tracejada no eixo do espelho
      ctx.save(); ctx.setLineDash([8,6]); ctx.strokeStyle='#ff4fa3'; ctx.lineWidth=2; ctx.beginPath();
      if(espX){ctx.moveTo(VISOR/2,0);ctx.lineTo(VISOR/2,VISOR)}
      if(espY){ctx.moveTo(0,VISOR/2);ctx.lineTo(VISOR,VISOR/2)}
      ctx.stroke(); ctx.restore();
    }
    if(foco){                                               // contorno da casa sob o cursor
      const [x,y]=foco;
      ctx.lineWidth=3; ctx.strokeStyle='#fff'; ctx.strokeRect(x*Z+1.5,y*Z+1.5,Z-3,Z-3);
      ctx.lineWidth=1; ctx.strokeStyle='#000'; ctx.strokeRect(x*Z+1.5,y*Z+1.5,Z-3,Z-3);
    }
    pintarPrevia(bm);
    const mini=q$('.pq[data-q="'+qi+'"] canvas');           // a miniatura do quadro atual acompanha o traço
    if(mini){const mc=mini.getContext('2d');mc.clearRect(0,0,N,N);mc.drawImage(bm,0,0)}
  }
  function pintarPrevia(bm){
    pvx.imageSmoothingEnabled=false; pvx.clearRect(0,0,128,128);
    const b=anim&&quadros.length>1?bitmap(quadros[pvi%quadros.length]):(bm||bitmap(quadros[qi]));
    pvx.drawImage(b,0,0,128,128);
  }
  function ajustarTimer(){                                  // a animação da prévia: troca de quadro fps vezes por segundo
    clearInterval(timer); timer=0;
    const b=q$('#pxan'); b.setAttribute('aria-pressed',String(anim)); b.textContent=anim?'■ Parar':'▶ Animar';
    if(anim&&quadros.length>1)timer=setInterval(()=>{
      if(!raiz.isConnected){clearInterval(timer);return}    // saiu desta página: para sozinho
      pvi=(pvi+1)%quadros.length; pintarPrevia();
    },1000/fps);
  }
  function pintarQuadros(){
    const lista=q$('#pxq');
    lista.innerHTML=quadros.map((_,i)=>`<button type="button" class="pq" data-q="${i}" aria-pressed="${i===qi}" aria-label="Quadro ${i+1} de ${quadros.length}"><canvas width="${N}" height="${N}"></canvas><span>${i+1}</span></button>`).join('');
    lista.querySelectorAll('canvas').forEach((c,i)=>c.getContext('2d').drawImage(bitmap(quadros[i]),0,0));
  }
  function pintarPaleta(){
    q$('#pxp').innerHTML=paleta.map(c=>`<button type="button" class="sw" data-c="${c}" style="background:${c}" aria-pressed="${c===cor}" aria-label="Cor ${c}" title="${c}"></button>`).join('');
    q$('#pxat').innerHTML=`<i style="background:${cor}"></i> Cor atual: <b>${cor}</b>`;
    q$('#pxcor').value=cor;
  }
  function status(){
    q$('#pxs').textContent=NOMES[ferr]+' · '+N+' × '+N+' · quadro '+(qi+1)+' de '+quadros.length+(foco?' · x: '+foco[0]+'  y: '+foco[1]:'');
  }
  function botoes(){
    q$('#pxdes').disabled=!hist.length; q$('#pxref').disabled=!refaz.length;
    q$('[data-acao="excluir"]').disabled=quadros.length<2;
    q$('[data-acao="novo"]').disabled=q$('[data-acao="dup"]').disabled=quadros.length>=MAX_QUADROS;
  }
  function tudo(){                                          // redesenha tudo (depois de qualquer mudança grande)
    q$('#pxn').value=String(N);
    cv.setAttribute('aria-label','Quadro de desenho de '+N+' por '+N+' pixels. Com o foco aqui, use as setas para mover o cursor e Espaço ou Enter para usar a ferramenta.');
    desenhar(); pintarQuadros(); botoes(); ajustarTimer(); status();
  }
  function aviso(t){q$('#pxm').textContent=t;clearTimeout(tMsg);tMsg=setTimeout(()=>{q$('#pxm').textContent=''},3000)}
  function erro(t){q$('#pxe').textContent=t}

  // ---------- ferramentas ----------
  function ferramenta(t){
    ferr=t;
    raiz.querySelectorAll('.pxa-ferr .pt').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===t)));
    status();
  }
  function escolher(c){cor=c;pintarPaleta()}
  function comecar(x,y,direito,teclado){                    // começou um clique (ou Espaço no teclado)
    if(!dentro(x,y))return;
    erro('');
    const g=quadros[qi];
    if(ferr==='conta'){                                     // conta-gotas: pega a cor da casa e volta para o lápis
      if(g[y*N+x])escolher(g[y*N+x]);
      ferramenta('lapis');
      return;
    }
    const antes=foto(), c=(ferr==='borracha'||direito)?'':cor;   // botão direito apaga
    if(ferr==='balde'){balde(g,x,y,c);confirmar(antes);tudo();return}
    arrasto={antes,c,x0:x,y0:y,ult:[x,y],teclado:!!teclado,tipo:(ferr==='linha'||ferr==='retangulo'||ferr==='circulo')?ferr:'traco'};
    if(arrasto.tipo==='traco')pintarCelula(g,x,y,c); else mover(x,y);
    desenhar();
  }
  function mover(x,y){                                      // o cursor andou com o traço em andamento
    const a=arrasto; if(!a)return;
    x=lim(x,-N,2*N); y=lim(y,-N,2*N);
    if(a.tipo==='traco'){
      linha(a.ult[0],a.ult[1],x,y,(i,j)=>pintarCelula(quadros[qi],i,j,a.c));   // liga a casa anterior à atual: sem buracos
      a.ult=[x,y];
    }else{                                                  // linha e retângulo: mostram uma prévia até soltar
      const p=quadros[qi].slice(), f=(i,j)=>pintarCelula(p,i,j,a.c);
      a.previa=p;
      if(a.tipo==='linha')linha(a.x0,a.y0,x,y,f); else if(a.tipo==='circulo')circulo(a.x0,a.y0,x,y,cheio,f); else retangulo(a.x0,a.y0,x,y,cheio,f);
    }
  }
  function terminar(){                                      // soltou o botão: o traço vira parte do desenho
    const a=arrasto; if(!a)return;
    arrasto=null;
    if(a.previa)quadros[qi]=a.previa;
    confirmar(a.antes); tudo();
  }

  // ---------- mouse, toque e caneta ----------
  const celula=e=>{const r=cv.getBoundingClientRect();return[Math.floor((e.clientX-r.left)*N/r.width),Math.floor((e.clientY-r.top)*N/r.height)]};
  cv.addEventListener('pointerdown',e=>{
    if(e.button!==0&&e.button!==2)return;
    e.preventDefault(); cv.focus({preventScroll:true});
    try{cv.setPointerCapture(e.pointerId)}catch(err){}      // continua recebendo o movimento mesmo fora do quadro
    const [x,y]=celula(e); foco=dentro(x,y)?[x,y]:null;
    comecar(x,y,e.button===2,false);
  });
  cv.addEventListener('pointermove',e=>{
    const [x,y]=celula(e);
    foco=dentro(x,y)?[x,y]:null;
    if(arrasto)mover(x,y);
    desenhar(); status();
  });
  ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>terminar()));
  cv.addEventListener('pointerleave',()=>{if(!arrasto){foco=null;desenhar();status()}});
  cv.addEventListener('contextmenu',e=>e.preventDefault());

  // ---------- teclado ----------
  raiz.addEventListener('keydown',e=>{
    if(e.target.closest&&e.target.closest('select,input,textarea'))return;
    const k=e.key.toLowerCase(), cmd=e.ctrlKey||e.metaKey;
    if(cmd&&(k==='z'||k==='y')){e.preventDefault();(k==='y'||e.shiftKey)?refazer():desfazer();return}
    if(cmd||e.altKey)return;
    const atalhos={b:'lapis',e:'borracha',g:'balde',i:'conta',l:'linha',r:'retangulo',c:'circulo'};
    if(atalhos[k]){e.preventDefault();ferramenta(atalhos[k]);return}
    if(e.target!==cv)return;
    if(e.key.startsWith('Arrow')){                          // cursor pelo teclado
      e.preventDefault();
      const [x,y]=foco||[0,0];
      foco=[lim(x+(k==='arrowright'?1:0)-(k==='arrowleft'?1:0),0,N-1),lim(y+(k==='arrowdown'?1:0)-(k==='arrowup'?1:0),0,N-1)];
      if(arrasto)mover(foco[0],foco[1]);
      desenhar(); status();
    }else if(e.key===' '||e.key==='Enter'){                 // Espaço ou Enter faz o papel do clique
      e.preventDefault();
      const [x,y]=foco||[0,0]; foco=[x,y];
      if(arrasto&&arrasto.teclado){mover(x,y);terminar()}   // 2º toque de uma linha, retângulo ou círculo: termina
      else{comecar(x,y,false,true);if(arrasto&&arrasto.tipo==='traco')terminar()}
    }else if(e.key==='Escape'&&arrasto){arrasto=null;desenhar()}
